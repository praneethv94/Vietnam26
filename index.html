function toggleDay(d){
  const body = d.querySelector(".daybody"); if (!body) return;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches || !body.animate){ d.open=!d.open; return; }
  if (d._anim) d._anim.cancel();
  if (!d.open){
    d.open = true; const h = body.scrollHeight;
    d._anim = body.animate([{height:"0px",opacity:0},{height:h+"px",opacity:1}],{duration:320,easing:"cubic-bezier(.2,.8,.2,1)"});
  } else {
    const h = body.scrollHeight;
    d._anim = body.animate([{height:h+"px",opacity:1},{height:"0px",opacity:0}],{duration:240,easing:"cubic-bezier(.4,0,.2,1)"});
    d._anim.onfinish = ()=>{ d.open=false; d._anim=null; };
  }
}
document.addEventListener("click",e=>{
  const s = e.target.closest("details.day > summary"); if(!s) return;
  e.preventDefault(); toggleDay(s.parentElement);
});

// Swipe left or right to move between tabs.
let sx=0, sy=0, st=0;
let edge=false;
document.addEventListener("touchstart",e=>{ const t=e.touches[0]; sx=t.clientX; sy=t.clientY; st=Date.now(); edge = sx < 28 || sx > innerWidth-28; },{passive:true});
document.addEventListener("touchend",e=>{
  if (!current || !edge || e.target.closest(".legbar,input,.map,.strip,.mapchips,.seg,.wxrow")) return;
  const t=e.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy;
  // Only a swipe that starts at the screen edge and crosses most of the screen changes tabs.
  if (Math.abs(dx)>innerWidth*0.45 && Math.abs(dx)>Math.abs(dy)*2 && Date.now()-st<800){
    if (current.startsWith("story-") || current.startsWith("guide-")) return;
    const i = ORDER.indexOf(PARENT[current]||current) + (dx<0?1:-1);
    if (ORDER[i]) location.hash = ORDER[i];
  }
},{passive:true});

// Who is using this phone. Praneeth and Bindu also see the India part of the trip.
let FULL = null;
const ME = () => store.get("trip-me");
const PB = () => ["Praneeth","Bindu"].includes(ME());
function scoped(D){
  if (PB()) return D;
  const vn = x => !x.pb;
  return {...D,
    days: D.days.filter(d=>d.date>="2026-12-06" && d.date<="2026-12-13"),
    stays: D.stays.filter(s=>s.end<="2026-12-13"),
    flights: D.flights.filter(vn), transfers: D.transfers.filter(vn),
    info: {...D.info, emergency: D.info.emergency.filter(vn)}};
}
function picker(){
  $("#tabs").hidden = true; $("#subtitle").textContent = "Welcome";
  $("#view").innerHTML = `<section class="lock"><div class="brand" style="font-size:30px">Vietnam<span>’26</span></div>
    <p class="muted" style="margin:0">Who's using this phone? This only changes what the app shows you.</p>
    <div class="people" style="justify-content:center">${FULL.travelers.map(p=>`<button class="btn" data-me="${esc(p.name)}">${esc(p.name)}</button>`).join("")}</div></section>`;
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-me]"); if(b){ store.set("trip-me", b.dataset.me); launch(); return; }
  if (e.target.closest("[data-switch]")){ store.del("trip-me"); picker(); }
});
window.addEventListener("scroll",()=>{ const p=$("#progress"); if(!document.body.classList.contains("reading")){ p.style.width=0; return; }
  const a=document.querySelector("article.prose"); if(!a) return; const r=a.getBoundingClientRect(); const tot=r.height-innerHeight+200;
  p.style.width = Math.max(0,Math.min(100, (-r.top+100)/tot*100))+"%"; },{passive:true});
document.documentElement.dataset.look = "postcard";
function launch(){
  if (!ME()) return picker();
  T = scoped(FULL); afterTripReady(); $("#tabs").hidden=false; current=null; route();
  setTimeout(()=>prefetchPhotos().catch(()=>{}), 4000);
}
function start(data){
  FULL = data; window.addEventListener("hashchange",()=>{ if(T && ME()) route(); }); launch();
}

// Encrypted build: the trip data is locked with a shared trip passcode, entered once per phone.
async function unlock(pass, enc){
  const b = s => Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b(enc.salt), iterations:150000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b(enc.iv)}, key, b(enc.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function lockScreen(enc, msg){
  $("#view").innerHTML = `<form class="lock" id="lockform"><div class="brand" style="font-size:30px">Vietnam<span>’26</span></div>
    <label for="pass" class="muted">Enter the trip passcode. You only need to do this once on this phone.</label>
    <input id="pass" type="password" autocomplete="current-password" required>
    <button class="btn" style="justify-self:center">Unlock</button>${msg?`<div class="err">${esc(msg)}</div>`:""}</form>`;
  $("#lockform").addEventListener("submit", async e=>{ e.preventDefault(); const p=$("#pass").value.trim();
    try { const d = await unlock(p, enc); store.set("trip-pass", p); start(d); } catch(err){ lockScreen(enc, "That passcode didn't work. Check it with Praneeth and try again."); } });
}

if (window.TRIP) start(window.TRIP);
else if (window.TRIP_ENC){
  const saved = store.get("trip-pass");
  if (saved) unlock(saved, window.TRIP_ENC).then(start).catch(()=>{ store.del("trip-pass"); lockScreen(window.TRIP_ENC); });
  else lockScreen(window.TRIP_ENC);
}
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && !/claude/.test(location.host)) {
  navigator.serviceWorker.register("sw.js").then(r=>{ r.update().catch(()=>{}); document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") r.update().catch(()=>{}); }); }).catch(()=>{});
  // A new version took over: reload once so it shows right away.
  let reloaded=false; const hadSW=!!navigator.serviceWorker.controller; navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(reloaded || !hadSW) return; reloaded=true; location.reload(); });
}
})();
