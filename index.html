  background:rgb(255 255 255/.55);-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);box-shadow:inset 0 0 0 1px rgb(255 255 255/.7),0 4px 14px rgb(20 40 80/.12)}

/* ── Nov 5 round 2 ── */

/* Check-in card. */

/* Trip map button and sheet. */

.tm-list{display:grid;gap:6px;padding-top:6px}

.tm-row.now{box-shadow:inset 0 0 0 2px var(--city)}

/* ── Nov 5 round 3: liquid glass wallet, gates, Ninh Bình spur ── */
.wcard{background:linear-gradient(150deg,color-mix(in srgb,var(--c2) 70%,transparent),color-mix(in srgb,var(--c1) 84%,transparent));
  -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);overflow:hidden;

  background:radial-gradient(120% 70% at 0% 0%,rgb(255 255 255/.32),transparent 55%),linear-gradient(180deg,rgb(255 255 255/.14),transparent 30%)}

.wc-f{grid-template-columns:minmax(0,.8fr) minmax(0,1fr) minmax(0,.9fr) minmax(0,1.45fr);gap:5px}.wc-f .wf{padding:8px 7px}.wf b{font-size:14px}
.wc-track{display:flex;align-items:center;gap:10px;margin:12px 16px 0;min-height:52px;padding:8px 14px;border-radius:14px;text-decoration:none;color:#fff;
  background:rgb(255 255 255/.18);box-shadow:inset 0 0 0 1px rgb(255 255 255/.38),inset 0 1px 0 rgb(255 255 255/.55)}
.wc-track .ic2{width:20px;height:20px;color:#f2c94c;flex:none}.wc-track span{flex:1;display:grid}.wc-track b{font:800 14.5px var(--body)}.wc-track small{font:600 12px var(--body);color:rgb(255 255 255/.75)}
.wc-track i{font-style:normal;font-weight:800;opacity:.8}
.wc-f .wf.chg{background:#da251d}
.wcard .wc-qr{padding-top:10px}
.wc-ck{font:800 12px var(--body);font-style:normal;padding:4px 9px;border-radius:999px;background:rgb(255 255 255/.22);box-shadow:inset 0 0 0 1px rgb(255 255 255/.35);white-space:nowrap}
.wc-ck.on{background:#2e8b57;box-shadow:none}

.wc-ckrow i{font-style:normal;font-weight:800}

  background:rgb(255 255 255/.7);-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);box-shadow:inset 0 0 0 1px rgb(255 255 255/.8),0 6px 18px rgb(20 40 80/.18)}

(function(){
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"], DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const parse = iso => { const [y,m,d]=iso.split("-").map(Number); return new Date(y,m-1,d); };
const isoOf = dt => dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");
const LABEL = {booked:"Booked", todo:"To book", maybe:"Not decided"};
const chip = s => s ? `<span class="chip ${s}">${LABEL[s]}</span>` : "";
const mapUrl = q => "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q);
const store = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}, del(k){try{localStorage.removeItem(k)}catch(e){}} };

let T = null;

// "Now" on the trip is the trip's clock, not the phone's: Vietnam time Dec 5–13, India time Dec 14–27, else the phone's own.
function tripNow(){
  const n = new Date(), at = tz => { try { const p = Object.fromEntries(new Intl.DateTimeFormat("en-CA", { timeZone: tz, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(n).map(x => [x.type, x.value])); return { iso: `${p.year}-${p.month}-${p.day}`, min: (+p.hour % 24) * 60 + +p.minute }; } catch (e) { return null; } };
  const vn = at("Asia/Ho_Chi_Minh"); if (vn && vn.iso >= "2026-12-05" && vn.iso <= "2026-12-13") return vn;
  const ind = at("Asia/Kolkata"); if (ind && ind.iso >= "2026-12-14" && ind.iso <= "2026-12-27") return ind;
  return { iso: isoOf(n), min: n.getHours() * 60 + n.getMinutes() };
}
function todayIso(){
  let d = null;
  try { d = new URLSearchParams(location.search).get("d"); } catch(e){}
  return d && /^\d{4}-\d{2}-\d{2}$/.test(d) ? d : tripNow().iso;
}
const stayById = id => T.stays.find(s=>s.id===id);

function dayCard(d, opts={}){
  const dt = parse(d.date), st = d.stay ? stayById(d.stay) : null;
  const dph = d.photo || ((T.flights||[]).find(f=>f.date===d.date)||{}).photo || (st&&st.photo) || "";
  const nowI = opts.today && d.date===todayIso() ? (nowNext(d).cur||{}).i : null;
  let prevP=null;
  const items = d.items.map((x,i)=>[x[0],x[1],x[2],i,x[3]]).filter(x=>!(x[4]==="pb" && !PB())).map(([t,w,s,i])=>{ const ps=placesFor(w,d.city), gs=guidesFor(w); const pc=ps.filter(p=>COORD(p.name)); const hop=(prevP&&pc[0])?hopHtml(prevP,pc[0]):""; if(pc.length) prevP=pc[pc.length-1];
    return `<li data-i="${i}"${i===nowI?' class="now"':""}><div class="t">${esc(t)}</div><div class="w">${hop}${esc(w)} ${chip(s)}${hoursHtml(ps,d.date)}${ps.length||gs.length?`<div class="pins">${gs.map(listenPin).join("")}${ps.map(pinBtn).join("")}</div>`:""}</div></li>`; }).join("");
  const night = (!PB() && d.date==="2026-12-13") ? "" : d.night ? esc(d.night) : st ? `<a href="#stay-${st.id}">${esc(st.name)}</a> ${st.status!=="booked"?chip(st.status):""}` : "";
  return `<details class="day${opts.today?" is-today":""}${opts.past?" past":""}" id="day-${d.date}"${opts.open?" open":""}>
    <summary><div class="date"><span class="dow">${DOW[dt.getDay()]}</span><span class="dnum">${dt.getDate()}</span><span class="mon">${MON[dt.getMonth()]}</span></div>
      <div class="sumtext"><div class="place">${esc(d.place)}</div><div class="title">${esc(d.title)}</div>${opts.stamp||""}</div>${dph?`<div class="ph thumb" data-lead="${esc(dph)}"></div>`:`<span class="caret" aria-hidden="true"></span>`}</summary>
    <div class="daybody">${dph?`<div class="ph banner" data-lead="${esc(dph)}"></div>`:""}${d.note?`<div class="note">${esc(d.note)}</div>`:""}<ul class="tl">${items}</ul>
      ${night?`<div class="night"><span class="muted">Tonight:</span> ${night}</div>`:""}${checklistHtml(d)}</div></details>`;
}

const STOPS = [["Saigon","2026-12-06"],["Hoi An","2026-12-07"],["Da Nang","2026-12-08"],["Hanoi","2026-12-09"]];
function sizeRoute(){
  const p = document.querySelector(".route .done"); if(!p) return;
  const len = p.getTotalLength(), k = +p.dataset.k, n = STOPS.length-1;
  const frac = k>=0 ? k/n : 0;
  p.style.setProperty("--len", len); p.style.setProperty("--off", len*(1-frac));
}

// Split long text into sentence groups the speech engine handles reliably.
function chunkText(t){
  const out = []; let cur = "";
  for (const s of t.match(/[^.!?]+[.!?]+["”’)]*\s*|[^.!?]+$/g) || [t]){
    if ((cur + s).length > 260 && cur){ out.push(cur.trim()); cur = ""; }
    cur += s;
  }
  if (cur.trim()) out.push(cur.trim());
  return out;
}
// Story pages read aloud chapter by chapter, built from the story text.
function storyAsGuide(st){
  const d = document.createElement("div"); d.innerHTML = st.html;
  const stops = [{ h: st.title, where: "", paras: [] }];
  for (const el of d.children){
    if (el.tagName === "H2") stops.push({ h: el.textContent, where: "", paras: [] });
    else if (el.tagName === "P" || el.tagName === "UL") stops[stops.length-1].paras.push(el.textContent);
  }
  return { id: "story-"+st.id, story: true, title: st.title, stops, href: "#story-"+st.id, intro: `${st.title}. ${st.kicker}.` };
}
function tagChunks(root){
  // Mark the paragraphs so the reader can follow along while it plays.
  let si = 0, pi = 0;
  for (const el of root.children){
    if (el.tagName === "H2"){ si++; pi = 0; el.dataset.ch = si+"--1"; }
    else if (el.tagName === "P" || el.tagName === "UL"){ el.dataset.ch = si+"-"+pi; pi++; }
  }
}
const Player = {
  g: null, chunks: [], i: 0, playing: false, tok: 0, lock: null,
  rate: parseFloat(store.get("tts-rate")) || 1,
  load(g){
    this.g = g; this.chunks = [];
    g.stops.forEach((s, si) => {
      const head = si===0 && (g.intro || s.h==="Before you start") ? (g.intro || `${g.title}.`) : `${s.h}.${s.where?" "+s.where:""}`;
      this.chunks.push({ si, pi: -1, text: head });
      s.paras.forEach((p, pi) => chunkText(p).forEach(t => this.chunks.push({ si, pi, text: t })));
    });
  },
  play(g, si=0){
    if (!SS) return toast("This phone can't play audio guides");
    if (!this.g || this.g.id !== g.id) this.load(g);
    this.i = Math.max(0, this.chunks.findIndex(c => c.si === si));
    this.playing = true; this.speak(); this.wake(true);
  },
  speak(){
    const my = ++this.tok;
    const c = this.chunks[this.i];
    if (!c){ this.playing = false; this.i = 0; this.ui(); this.wake(false); toast("End of the guide"); return; }
    const u = new SpeechSynthesisUtterance(c.text); u.lang = "en-US"; u.rate = this.rate;
    const v = voiceFor("en"); if (v) u.voice = v;
    const nextUp = () => { if (my !== this.tok || !this.playing) return; this.i++; this.speak(); };
    u.onend = nextUp;
    u.onerror = ev => { if (ev.error === "interrupted" || ev.error === "canceled") return; nextUp(); };
    ssSpeak(u); this.ui(true);
  },
  toggle(){ this.playing ? this.pause() : this.resume(); },
  pause(){ this.playing = false; this.tok++; SS && SS.cancel(); this.ui(); this.wake(false); },
  resume(){
    if (!this.g) return;
    const c = this.chunks[this.i] || this.chunks[0];
    this.i = this.chunks.findIndex(x => x.si === c.si && x.pi === c.pi);
    this.playing = true; this.speak(); this.wake(true);
  },
  jump(dir){
    if (!this.g) return;
    const si = (this.chunks[this.i]||{si:0}).si;
    const atStart = this.chunks.findIndex(c => c.si === si) >= this.i - 1;
    const target = dir > 0 ? si + 1 : (atStart ? si - 1 : si);
    const j = this.chunks.findIndex(c => c.si === Math.max(0, target));
    if (j < 0) return;
    this.i = j; this.playing = true; this.speak(); this.wake(true);
  },
  speed(){
    const steps = [0.9, 1, 1.15, 1.3]; this.rate = steps[(steps.indexOf(this.rate) + 1) % steps.length] || 1;
    store.set("tts-rate", this.rate); if (this.playing) this.resume(); else this.ui();
  },
  stop(){ this.playing = false; this.tok++; SS && SS.cancel(); this.g = null; this.ui(); this.wake(false); },
  // iPhone stops the phone's voice when the screen locks or the app goes to the background; don't keep showing "playing".
  check(){ if (document.visibilityState !== "visible" || !this.playing || !SS) return; setTimeout(() => { if (this.playing && !SS.speaking && !SS.pending) { this.playing = false; this.tok++; this.ui(); this.wake(false); toast("The guide paused while the phone was locked. Tap play to carry on."); } }, 600); },
  async wake(on){

      if (!on && this.lock){ await this.lock.release(); this.lock = null; }
    } catch(e){}
  },
  ui(follow){
    document.querySelectorAll(".speaking").forEach(e => e.classList.remove("speaking"));
    let bar = document.getElementById("mp");
    document.body.classList.toggle("has-player", !!this.g);
    if (!this.g){ bar && bar.remove(); return; }
    if (!bar){ bar = document.createElement("div"); bar.id = "mp"; bar.className = "mp"; document.body.appendChild(bar); }
    const c = this.chunks[this.i] || this.chunks[0], s = this.g.stops[c.si];
    const label = this.g.story ? s.h : (c.si===0 && s.h==="Before you start" ? "Introduction" : `Stop ${this.g.stops[0].h==="Before you start"?c.si:c.si+1} of ${this.g.stops.length - (this.g.stops[0].h==="Before you start"?1:0)} · ${s.h}`);
    bar.innerHTML = `<div class="in"><a class="ti" href="${esc(this.g.href)}"><b>${esc(this.g.title)}</b><span>${esc(label)}</span></a>
      <button data-mp="prev" aria-label="Previous stop">${PREV}</button><button class="pp" data-mp="toggle" aria-label="${this.playing?"Pause":"Play"}">${this.playing?PAUSE:PLAY}</button>
      <button data-mp="next" aria-label="Next stop">${NEXT}</button><button data-mp="speed" aria-label="Speed ${this.rate}×, tap to change">${this.rate}×</button><button data-mp="close" aria-label="Close">${CLOSE}</button></div>`;
    const root = document.querySelector(`[data-gid="${CSS.escape(this.g.id)}"]`);

    }
  },
};

const SLOT = { breakfast:480, morning:540, "late morning":630, midday:720, lunch:750, "early afternoon":810, afternoon:870, cafes:900, sunset:1020, evening:1110, dinner:1140, bar:1290, late:1320, night:1320 };
function startMin(label){
  const l = label.toLowerCase().replace(/^~/, "").trim();
  if (/^until|^optional|^if /.test(l)) return null;
  const m = l.match(/(\d{1,2})(?::(\d{2}))?/);
  if (m){
    let h = +m[1]; const mm = +(m[2]||0), ap = (l.slice(m.index).match(/am|pm/)||[""])[0];
    if (ap==="pm" && h<12) h += 12; if (ap==="am" && h===12) h = 0;
    return h*60 + mm;
  }
  return SLOT[l] ?? null;
}
const KEY = /tasting menu|flight|vn\d|ua \d|qatar|puppet|boat ride|sampan|pickup|class|check ?out|show|car to|private car/i;
function timeline(d){
  const items = d.items.map((x, i) => ({ i, t: x[0], w: x[1], st: x[2], pb: x[3]==="pb", s: startMin(x[0]), exact: /\d/.test(x[0]) }))
    .filter(x => !(x.pb && !PB()));
  items.forEach((x, k) => {
    if (x.s == null){ const prev = items.slice(0, k).reverse().find(y => y.s != null); x.s = prev ? prev.s + 45 : 540; }
    const prev = items[k-1]; if (prev && x.s < prev.s && !(k===1 && prev.s < 120)) x.s = prev.s;
  });
  // Deadlines hidden inside the text, like "Check out by 11 AM".
  d.items.forEach(x => { const m = x[1].match(/check ?out by (\d{1,2}(?::\d{2})?\s*(?:AM|PM))/i);
    if (m) items.push({ i: -1, t: "By " + m[1], w: "Check out of the stay", s: startMin(m[1]), exact: true, key: true }); });
  items.sort((a, b) => a.s - b.s);
  items.forEach(x => { if (x.key == null) x.key = x.st==="todo" || x.st==="booked" || KEY.test(x.w); });
  return items;
}

// Daily checklist, built from the day's plan and the weather.
function checklistFor(d){
  const txt = (d.title+" "+d.items.map(i=>i[0]+" "+i[1]).join(" ")).toLowerCase(), out=[];
  const add=(t,why)=>{ if(!out.some(o=>o[0]===t)) out.push([t,why]); };
  if (/flight|vn983|ua 7913|ua 1525|ua 79|qatar|depart sarasota|airport/.test(txt)) add("Passport and boarding pass","Flight today");
  if (d.date==="2026-12-04") add("Printed Vietnam e-visa","Needed at immigration in Sài Gòn");
  if (d.date==="2026-12-13" && PB()) add("OCI card","For India immigration");
  if (/check out|checkout/.test(txt)) add("Pack up and check the room","Checkout today");
  if (/temple|pagoda|mausoleum|cathedral/.test(txt)) add("Shoulders and knees covered","Temples and pagodas today");
  if (/boat|sampan|trang an|basket/.test(txt)) add("Small cash for the boat tip","50,000–100,000 dong");
  if (/mua cave|steps|bike|marble mountains|stair/.test(txt)) add("Comfortable shoes","Steps or cycling today");
  if (/coco|\bgia\b|tasting menu|la maison/.test(txt)) add("Dinner outfit","Tasting menu tonight");
  if (/tailoring: get measured|place orders/.test(txt)) add("Photos of clothes you want made","For the tailor");
  if (/pick up tailoring|tailor fittings/.test(txt)) add("Tailoring receipt","Fitting or pickup today");
  if (/spa|pool|beach/.test(txt)) add("Swimsuit","Pool or beach today");
  // weather: forecast if saved, otherwise typical December
  const P = T.info.places[d.city]; let hi, lo, rain=null;
  try{ const f=JSON.parse(store.get("wx-"+d.city)||"null")?.days?.[d.date]; if(f){ hi=f.hi; lo=f.lo; rain=f.p; } }catch(e){}
  if (hi==null && P){ [hi,lo]=P.normal; rain = /rain|shower/i.test(P.normal[2]) ? 50 : 10; }
  if (rain!=null && rain>=40) add("Umbrella or rain jacket", rain>=50 && hi!=null ? `${rain}% chance of rain` : "Rain likely");
  if (hi!=null && hi>=86) add("Water bottle and sunscreen", `High of ${hi}°`);

}

// ===== Trip helpers: travel days, maps, sunset, evening look, phrases, reminders =====
const MOg = () => (typeof T!=="undefined" && T && T.more) || {};
const TZ = c => c==="srq" ? -5 : (c==="blr"||c==="kmc"||c==="hyd") ? 5.5 : 7;
const VN = c => ["hcmc","hoian","danang","hanoi","ninhbinh"].includes(c);
const CITYNAME = {"Saigon":"hcmc","Hoi An":"hoian","Da Nang":"danang","Hanoi":"hanoi","Ninh Binh":"ninhbinh"};
const hm = h => { h=((h%24)+24)%24; let H=Math.floor(h), M=Math.round((h-H)*60); if(M===60){H++;M=0;} const ap=H>=12?"PM":"AM"; return `${(H%12)||12}:${String(M).padStart(2,"0")} ${ap}`; };
// Sunset in local hours (NOAA approximation).
function sunset(lat, lon, iso, tz){
  const d = parse(iso), n = Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()) - Date.UTC(d.getFullYear(),0,0))/864e5);
  const g = 2*Math.PI/365*(n-1);
  const eq = 229.18*(0.000075+0.001868*Math.cos(g)-0.032077*Math.sin(g)-0.014615*Math.cos(2*g)-0.040849*Math.sin(2*g));
  const dec = 0.006918-0.399912*Math.cos(g)+0.070257*Math.sin(g)-0.006758*Math.cos(2*g)+0.000907*Math.sin(2*g)-0.002697*Math.cos(3*g)+0.00148*Math.sin(3*g);
  const r = Math.PI/180, ha = Math.acos(Math.cos(90.833*r)/(Math.cos(lat*r)*Math.cos(dec))-Math.tan(lat*r)*Math.tan(dec))/r;
  return (720 - 4*(lon - ha) - eq)/60 + tz;
}
function sunFor(city, iso){ const P=T.info.places[city]; if(!P) return null; return sunset(P.lat, P.lon, iso, TZ(city)); }

// Evening look: Auto switches to the dark Postcard after sunset where you are.

// Evening: what's first tomorrow, an alarm time, and what to bring.
function parseItemTime(t){ const m=String(t).match(/(\d{1,2})(?::(\d{2}))?\s*(AM|PM)/i); if(!m) return null; let H=+m[1]%12; if(/pm/i.test(m[3])) H+=12; return H+(+(m[2]||0))/60; }

// Opening notes and the hop between stops, inside the day plan.
const COORD = name => (MOg().coords||{})[name];
function hav(a,b){ const r=Math.PI/180, dl=(b[0]-a[0])*r, dn=(b[1]-a[1])*r, x=Math.sin(dl/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dn/2)**2; return 12742*Math.asin(Math.sqrt(x)); }
function hopHtml(a, b){
  const A=COORD(a.name), B=COORD(b.name); if(!A||!B||a===b) return "";
  const km = hav(A,B)*1.3; if (km < 0.15 || km > 40) return "";
  const walk = Math.round(km/4.5*60), grab = Math.round(4 + km/20*60), fare = Math.max(30, Math.round((12 + km*14)/5)*5);
  return `<div class="hop">↳ From ${esc(a.name)}: ${km<1?Math.round(km*1000)+" m":km.toFixed(1)+" km"} · ${walk<=25?`${walk} min walk`:`Grab ~${grab} min, ~${fare}k ₫`}${walk<=25&&walk>12?` (Grab ~${grab} min)`:""}</div>`;
}

// Calendar reminders (.ics): flights and key moments, with alerts.
function icsDate(s){ return new Date(Date.parse(s)).toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,""); }
function icsText(){
  const ev=[], esc2=s=>String(s).replace(/[,;\\]/g,m=>"\\"+m).replace(/\n/g,"\\n");
  for (const l of myLegs()){ if(!l.dep) continue; const end=l.arr||new Date(Date.parse(l.dep)+2*36e5).toISOString();
    ev.push({uid:"leg-"+l.no.replace(/\W/g,"")+"-"+l.dep.slice(0,10), t:`✈ ${l.no} ${l.from} → ${l.to}`, s:l.dep, e:end, d:[l.by, l.seats?"Seats "+l.seats:"", ...(l.tips||[])].filter(Boolean).join("\n"), a:[24*60, /SRQ|DAD/.test(l.from)?120:180]}); }
  for (const r of (MOg().reminders||[])){ if(r.pb && !PB()) continue; ev.push({uid:"r-"+r.at, t:r.t, s:r.at, e:new Date(Date.parse(r.at)+(r.mins||30)*6e4).toISOString(), d:"From the Vietnam '26 app", a:r.alarms||[0]}); }
  // Morning nudge: 8 AM local on each Vietnam day, with the day's "before you head out" list.
  for (const d of T.days){ if (!VN(d.city) || typeof checklistFor !== "function") continue;
    const items = checklistFor(d).map(x => x[0]).filter(Boolean); if (!items.length) continue;
    const s0 = new Date(Date.parse(d.date + "T08:00:00+07:00")).toISOString();
    ev.push({uid:"am-"+d.date, t:`☀ ${CITYV[d.city]||d.place}: ${d.title}`, s:s0, e:new Date(Date.parse(s0)+15*6e4).toISOString(), d:"Before you head out:\n• " + items.slice(0,8).join("\n• ") + "\n\nOpen Today in the Vietnam '26 app for the full plan.", a:[0]}); }
  const lines=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Vietnam26//Trip//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:Vietnam '26"];
  const stamp=icsDate(new Date().toISOString());
  for (const x of ev){ lines.push("BEGIN:VEVENT",`UID:${x.uid}@vietnam26`,`DTSTAMP:${stamp}`,`DTSTART:${icsDate(x.s)}`,`DTEND:${icsDate(x.e)}`,`SUMMARY:${esc2(x.t)}`,`DESCRIPTION:${esc2(x.d)}`);
    for (const m of x.a) lines.push("BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${esc2(x.t)}`,`TRIGGER:-PT${m}M`,"END:VALARM");
    lines.push("END:VEVENT"); }

}

// Offline city maps: CARTO tiles, cached by the service worker.
const TILE = (z,x,y) => `https://tile.openstreetmap.org/${z}/${x}/${y}.png`;
const lon2x = (lon,z) => (lon+180)/360*256*2**z;
const lat2y = (lat,z) => { const s=Math.sin(lat*Math.PI/180); return (0.5-Math.log((1+s)/(1-s))/(4*Math.PI))*256*2**z; };
const x2lon = (x,z) => x/(256*2**z)*360-180;
const y2lat = (y,z) => { const n=Math.PI-2*Math.PI*y/(256*2**z); return 180/Math.PI*Math.atan(0.5*(Math.exp(n)-Math.exp(-n))); };
let MAP = { city: store.get("map-city") || "Saigon" };
function mapPins(city){ return T.places.filter(p=>p.city===city && COORD(p.name)); }
// City names are stored in plain English (they're data keys); show them in Vietnamese.
const VIN = c => ({"Saigon":"Sài Gòn","Ho Chi Minh City":"Sài Gòn","Hoi An":"Hội An","Da Nang":"Đà Nẵng","Hanoi":"Hà Nội","Ninh Binh":"Ninh Bình"})[c] || c;
let MAPMODE = store.get("map-mode") || "google";
function mapView(){

    ${T.myMap ? `<nav class="seg seg-c mapmode" aria-label="Map type"><a href="#" data-mapmode="google"${gm ? ' aria-current="page"' : ""}>Google map</a><a href="#" data-mapmode="offline"${gm ? "" : ' aria-current="page"'}>Offline map</a></nav>` : ""}
    ${gm ? `<div class="gmap"><iframe title="Google map of our places in ${esc(VIN(MAP.city))}" src="https://www.google.com/maps/d/embed?mid=${encodeURIComponent(T.myMap)}${cfg.c ? `&ll=${cfg.c[0]},${cfg.c[1]}&z=${cfg.z || 14}` : ""}" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe></div>
    <p class="small muted" style="margin:8px 0 0">Needs signal. Tap a pin for the name, or the corner button to open it in Google Maps. With no signal, switch to Offline map.</p>` : `<div class="map" id="map"><div class="map-layer" id="map-layer"></div><div class="map-ctl"><button type="button" data-mapz="1" aria-label="Zoom in">+</button><button type="button" data-mapz="-1" aria-label="Zoom out">−</button><button type="button" data-mapz="0" aria-label="Recenter">◎</button></div><div class="map-attr">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors</div></div>
    <p class="small muted" id="mapmsg" style="margin:8px 0 0">The offline map keeps the areas you've already looked at. The numbered list below always works with no signal.</p>`}
    <h3>${esc(VIN(MAP.city))}</h3><div class="card" style="padding:4px 16px">${pins.map((p,i)=>`<div class="row prow" data-place="${p.id}" role="button" tabindex="0" aria-label="${esc(p.name)}, details" style="cursor:pointer"><div class="pthumb ph pinnum">${i+1}</div><div class="what">${esc(p.name)}</div><span class="pin" style="align-self:center" aria-hidden="true">Details ›</span><div class="detail">${esc(p.vi)}</div></div>`).join("")}</div>`;
}
function drawMap(){
  const el=document.getElementById("map"), layer=document.getElementById("map-layer"); if(!el) return;
  const cfg = MOg().maps[MAP.city]; if (MAP.z==null || MAP.for!==MAP.city){ MAP.c=cfg.c.slice(); MAP.z=cfg.z; MAP.for=MAP.city; }
  const W=el.clientWidth, H=el.clientHeight, z=MAP.z, cx=lon2x(MAP.c[1],z), cy=lat2y(MAP.c[0],z), x0=cx-W/2, y0=cy-H/2;
  let h=""; const n=2**z;
  for (let tx=Math.floor(x0/256); tx<=Math.floor((x0+W)/256); tx++) for (let ty=Math.floor(y0/256); ty<=Math.floor((y0+H)/256); ty++){
    if (ty<0||ty>=n) continue; const wx=((tx%n)+n)%n;
    h += `<img class="mtile" alt="" draggable="false" src="${TILE(z,wx,ty)}" style="left:${Math.round(tx*256-x0)}px;top:${Math.round(ty*256-y0)}px">`; }
  mapPins(MAP.city).forEach((p,i)=>{ const [la,lo]=COORD(p.name); const px=lon2x(lo,z)-x0, py=lat2y(la,z)-y0; if(px<-20||py<-20||px>W+20||py>H+40) return;
    h += `<button type="button" class="mpin" data-place="${p.id}" style="left:${Math.round(px)}px;top:${Math.round(py)}px" aria-label="${esc(p.name)}"><span><i>${i+1}</i></span></button>`; });
  layer.style.transform=""; layer.innerHTML=h; const nt=el.querySelector(".mnote"); if (nt) nt.hidden=true;
}
// A tile that isn't saved and can't load: say so instead of showing a grey hole.
document.addEventListener("error", e=>{ const t=e.target; if (t && t.classList && t.classList.contains("mtile")){ t.style.visibility="hidden"; mapHole(); } }, true);
function mapHole(){ const el=document.getElementById("map"); if(!el) return; let nt=el.querySelector(".mnote"); if(!nt){ el.insertAdjacentHTML("beforeend", `<div class="mnote" role="status"></div>`); nt=el.querySelector(".mnote"); }
  nt.textContent = navigator.onLine===false ? "This area isn't saved for offline. Open it once on Wi-Fi to keep it." : "Some of the map didn't load. Check your connection."; nt.hidden=false; }
function wireMap(){
  const el=document.getElementById("map"); if(!el) return; drawMap();
  let st=null, moved=false, lastTap=0;
  const layer=document.getElementById("map-layer");
  el.addEventListener("touchstart",e=>{ if(e.target.closest(".map-ctl")) return; moved=false; const t=e.touches;
    st = t.length===2 ? {d:Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY), dx:0, dy:0, k:1} : {x:t[0].clientX, y:t[0].clientY, dx:0, dy:0, k:1}; },{passive:true});
  el.addEventListener("touchmove",e=>{ if(!st) return; e.preventDefault(); moved=true; const t=e.touches;
    if (t.length===2 && st.d){ st.k=Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)/st.d; layer.style.transform=`scale(${st.k})`; layer.style.transformOrigin="50% 50%"; }
    else if (t.length===1 && st.x!=null){ st.dx=t[0].clientX-st.x; st.dy=t[0].clientY-st.y; layer.style.transform=`translate(${st.dx}px,${st.dy}px)`; } },{passive:false});
  const end=()=>{ if(!st) return; const z=MAP.z;
    if (st.k!==1){ MAP.z=Math.max(11,Math.min(18,z+Math.round(Math.log2(st.k)))); }
    else if (st.dx||st.dy){ const cx=lon2x(MAP.c[1],z)-st.dx, cy=lat2y(MAP.c[0],z)-st.dy; MAP.c=[y2lat(cy,z), x2lon(cx,z)]; }
    st=null; drawMap(); };
  el.addEventListener("touchcancel",()=>{ st=null; layer.style.transform=""; },{passive:true});
  el.addEventListener("touchend",e=>{ if(e.touches.length) return; const n=Date.now(); if(!moved && !e.target.closest(".mpin,.map-ctl")){ if(n-lastTap<300){ MAP.z=Math.min(18,MAP.z+1); st=null; drawMap(); lastTap=0; return; } lastTap=n; } end(); });
  // Mouse drag for desktop testing.
  el.addEventListener("mousedown",e=>{ if(e.target.closest(".map-ctl,.mpin")) return; st={x:e.clientX,y:e.clientY,dx:0,dy:0,k:1};
    const mv=ev=>{ st.dx=ev.clientX-st.x; st.dy=ev.clientY-st.y; layer.style.transform=`translate(${st.dx}px,${st.dy}px)`; };
    const up=()=>{ removeEventListener("mousemove",mv); removeEventListener("mouseup",up); end(); }; addEventListener("mousemove",mv); addEventListener("mouseup",up); });
}

// ===== Batch 3: What now?, cash for today, morning brief, pharmacy, Google Maps, checkout =====
const NF = new Intl.NumberFormat("en-US"), fmtVnd = n => NF.format(Math.round(n/50000)*50000) + " ₫";
const fmtUsd = n => "$" + Math.round(n / T.info.rates.VND);
const nowH = () => nowMin()/60;
const dayOf = iso => T.days.find(d=>d.date===iso);
const placeByName = n => (T.places||[]).find(p=>p.name===n);
const cityOfIso = iso => (dayOf(iso)||{}).city;
const MAPCITY = c => Object.keys(CITYNAME).find(k=>CITYNAME[k]===c);

// --- What now? ---
let WN = { here: null, n: 3 };
function openAt(S, h, wd){
  if (S[3] && !S[3].includes(wd)) return null;
  for (const [a,b] of S[2]){ if (h >= a && h < b - 0.25) return b; if (h + 24 >= a && h + 24 < b - 0.25) return b - 24; }
  return null;
}
function rainPct(city, iso){ try{ return JSON.parse(store.get("wx-"+city)||"null")?.days?.[iso]?.p ?? null; }catch(e){ return null; } }
function whatNow(){
  const iso = todayIso(), d = dayOf(iso), wd = parse(iso).getDay(), h = nowH();
  const city = d && VN(d.city) ? d.city : "hcmc", M = (MOg().maps||{})[MAPCITY(city)];
  const origin = WN.here || (M && M.c), rain = rainPct(city, iso);
  const planned = new Set((d ? d.items : []).flatMap(x=>placesFor(x[1], d.city)).map(p=>p.name));
  const meal = (h>=11 && h<14) || (h>=17.5 && h<21), coffee = (h>=7 && h<11) || (h>=14 && h<17.5), late = h>=18;
  const out = [];
  for (const [name, S] of Object.entries(MOg().spots||{})){
    const C = COORD(name); if (!C || !origin) continue;
    const km = hav(origin, C)*1.3; if (km > 12) continue;
    const till = openAt(S, h, wd); if (till == null) continue;
    let score = -km*1.6;
    if (S[0]==="eat" && meal) score += 3; if (S[0]==="coffee" && coffee) score += 2.5;
    if ((S[0]==="night"||S[0]==="walk") && late) score += 3; if ((S[0]==="night") && !late) score -= 2;
    if (rain!=null && rain>=50) score += S[1] ? 2 : -2.5;
    if (till - h < 1) score -= 2;
    if (planned.has(name)) score -= 1.5;
    out.push({ name, S, km, till, score, planned: planned.has(name) });
  }
  return { list: out.sort((a,b)=>b.score-a.score), rain, city, origin, d };
}
function getThere(km){
  const walk = Math.round(km/4.5*60), grab = Math.round(4 + km/20*60), fare = Math.max(30, Math.round((12 + km*14)/5)*5);
  return walk <= 20 ? `${walk} min walk` : `Grab ~${grab} min · ~${fare}k ₫`;
}
function whatNowCards(){
  const W = whatNow(), K = MOg().spotKinds||{};
  if (!W.list.length) return `<div class="card"><b>Nothing nearby is open right now.</b><p class="small muted" style="margin:6px 0 0">Late night? Head back to your stay, or check the Eat list for tomorrow.</p></div>`;
  return W.list.slice(0, WN.n).map((x,i)=>{ const p = placeByName(x.name);
    const why = [K[x.S[0]], x.S[1] ? "Indoors" : "", `Open till ${hm(x.till)}`, x.planned ? "On today's plan" : ""].filter(Boolean).join(" · ");
    return `<div class="card wn"><div class="wn-n">${i+1}</div><div class="wn-b"><b>${esc(x.name)}</b><span class="small muted">${esc(why)}</span><span class="wn-go">${getThere(x.km)}${WN.here?"":" from the center"}</span>

    + (W.list.length > WN.n ? `<button class="btn" data-wnmore style="margin-top:4px">Show more</button>` : "");
}

// --- Cash for today ---
function cashFor(d){
  if (!d || !VN(d.city)) return null;
  const F = MOg().fees||{}, B = MOg().cashBase||{food:350000,ride:40000,buffer:200000};
  const names = [...new Set(d.items.flatMap(x=>placesFor(x[1], d.city)).map(p=>p.name))];
  const lines = [];
  names.forEach(n=>{ if (F[n]) lines.push([n, F[n]]); });
  const txt = d.items.map(x=>x[1]).join(" ").toLowerCase();
  const rides = (txt.match(/\bgrab\b|\bcar to\b|\bcar\b|taxi|transfer/g)||[]).length;
  const fine = /coco|\bgia\b|tasting menu|la maison|anan/.test(txt);
  lines.push([fine ? "Street food, coffee and snacks (dinner on card)" : "Meals, coffee and snacks", fine ? Math.round(B.food*0.6) : B.food]);
  if (rides) lines.push([`${rides} ride${rides>1?"s":""}, shared`, rides*B.ride]);
  lines.push(["Tips and small extras", B.buffer]);
  const total = lines.reduce((s,l)=>s+l[1],0);
  return { total, lines };
}

// --- Morning brief ---
function briefHtml(d){
  const test = new URLSearchParams(location.search).get("am");
  if (!d || (nowH() >= 12 && !test)) return "";
  const h = nowH();
  const next = d.items.map(x=>[parseItemTime(x[0]), x]).filter(([t])=>t!=null && t >= h - 0.25).sort((a,b)=>a[0]-b[0])[0];
  const leg = legsOn(d.date).find(l=>localDate(l.dep)===d.date);
  const list = checklistFor(d), txt = list.map(x=>x[0]).join(" ");
  const wear = [];
  if (/Shoulders/.test(txt)) wear.push("shoulders and knees covered");
  if (/Comfortable shoes/.test(txt)) wear.push("good walking shoes");
  if (/Umbrella/.test(txt)) wear.push("something for the rain");
  if (/Light jacket/.test(txt)) wear.push("a light layer for tonight");
  if (/Dinner outfit/.test(txt)) wear.push("dinner clothes for tonight");
  if (!wear.length) wear.push("light, breathable clothes");
  const bring = list.filter(([t])=>!/Shoulders|Comfortable shoes|Dinner outfit|Light jacket|Phone charged|Cash in dong/.test(t)).map(x=>x[0]);
  const c = cashFor(d);
  const row = (k, v) => `<div class="br-r"><span class="br-k">${k}</span><span>${v}</span></div>`;
  return `<h3>Good morning</h3><div class="card brief">
    ${leg ? row("Flight", `<b>${esc(leg.no)} at ${localTime(leg.dep)}</b>`) : ""}
    ${next ? row("First up", `<b>${esc(next[1][0])}</b> ${esc(next[1][1])}`) : row("First up", "Nothing timed. Take it slow.")}
    ${row("Wear", esc(wear.join(", ")))}
    ${bring.length ? row("Bring", esc(bring.join(", "))) : ""}
    ${c ? row("Cash", `<b>about ${fmtVnd(c.total)}</b> each`) : ""}
  </div>`;
}

const FX = () => (T && T.facts) || { facts: [], timeline: [], december: {}, trivia: [] };
const CITYLBL = { all: "Vietnam", hcmc: "Sài Gòn", hoian: "Hội An", danang: "Đà Nẵng", hanoi: "Hà Nội", ninhbinh: "Ninh Bình" };

function hashStr(s){ let h = 0; for (const c of s) h = (h*31 + c.charCodeAt(0)) | 0; return Math.abs(h); }
// Facts for a day: places on the plan first, then the city, then the country; rotates by date.
function factsForDay(d, n){
  const F = FX().facts.map((f,i)=>({f,i}));
  const names = d ? new Set(d.items.flatMap(x=>placesFor(x[1], d.city)).map(p=>p.name)) : new Set();
  const pool = [...F.filter(x=>names.has(x.f[1])), ...F.filter(x=>d && x.f[1]===d.city), ...F.filter(x=>x.f[1]==="all")];
  const seed = hashStr(d ? d.date : todayIso()), out = [], seen = new Set();
  const groups = [pool.filter(x=>names.has(x.f[1])), pool.filter(x=>d && x.f[1]===d.city), pool.filter(x=>x.f[1]==="all")];
  for (const g of groups){ if (!g.length) continue; const x = g[seed % g.length]; if (!seen.has(x.i)){ out.push(x); seen.add(x.i); } if (out.length >= n) break; }
  return out;
}

}

function scoreAll(){

  R.forEach(r=>Object.entries(r.h||{}).forEach(([id,ts])=>{ if (first[id]==null || ts < first[id].ts) first[id] = {ts, n: r.n}; }));
  R.forEach(r=>(r.aw||[]).forEach(a=>{ aw[a.id] = a; }));
  Object.values(aw).forEach(a=>{ if (!R.some(r=>r.n===a.to)) R.push({ n: a.to, t: 0 }); });
  const champ = R.reduce((m,r)=>Math.max(m, r.hg||0), 0);
  return R.map(r=>{
    let hunt = 0, bonus = 0;
    Object.entries(r.h||{}).forEach(([id,ts])=>{ const it = huntItem(id); if (!it) return;
      const day = isoOf(new Date(ts)), b = bountyFor(day); let p = it[1]; if (b && b[0]===id) p *= 2;
      hunt += p; if (first[id] && first[id].n===r.n && R.length > 1) bonus++; });

    const bill = Object.values(aw).filter(a=>a.to===r.n && a.g==="bill").reduce((s,a)=>s+a.p, 0);

}

// ===== Live leaderboard: every phone writes its own scores to one shared room and listens for everyone else's.
// Firebase Realtime Database over plain REST and server-sent events (no SDK). Works offline: changes wait and send later.
const LIVE = { es: null, room: null, dirty: false, timer: null, state: "off", seen: 0, ping0: Date.now() };
const LIVE_OFF = location.protocol === "file:" || /^(localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\])$/.test(location.hostname);
const liveBase = () => T && T.live && !LIVE_OFF ? `${T.live.db}/v26/${T.live.room}` : null;
const SCORE_KEYS = new Set(["hunt-found","trivia-right","trivia-scores","bingo","awards","haggles","speak"]);
function takeRecord(x){
  if (!x || !x.n || x.n === ME()) return false;
  const B = local.get("board", {}), rec = { n:x.n, t:x.t*60000, tr:x.tr||[], tb:x.tb||0, h:{}, bg:x.bg||0, hg:x.hg||0, sp:x.sp||{}, aw:(x.aw||[]).map(a=>({id:a[0], to:a[1], p:a[2], g:a[3], ts:a[4]*60000})) };
  Object.entries(x.h||{}).forEach(([k,v])=>rec.h[k]=v*60000);
  if (B[x.n] && B[x.n].t > rec.t) return false;
  B[x.n] = rec; store.set("board", JSON.stringify(B)); return true;
}
function livePush(soon){
  if (!liveBase() || !ME()) return; LIVE.dirty = true; clearTimeout(LIVE.timer);
  LIVE.timer = setTimeout(async ()=>{
    if (!navigator.onLine) return;
    try { const r = await fetch(`${liveBase()}/scores/${encodeURIComponent(ME())}.json`, { method: "PUT", body: JSON.stringify(compactRecord()) });
      if (r.ok){ LIVE.dirty = false; liveStatus(); } } catch(e){}
  }, soon ? 300 : 1500);
}
function liveApply(path, data){
  // Keep a mirror of the room, then copy everyone else's scores into this phone's board.
  if (path === "/") LIVE.room = data || {};
  else { LIVE.room = LIVE.room || {}; const parts = path.split("/").filter(Boolean).map(decodeURIComponent); let o = LIVE.room;
    for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]] = (o[parts[i]] && typeof o[parts[i]] === "object") ? o[parts[i]] : {};
    if (data == null) delete o[parts[parts.length-1]]; else o[parts[parts.length-1]] = data; }
  if (typeof gatesSync === "function") gatesSync((LIVE.room||{}).gates);
  let changed = false; Object.values((LIVE.room||{}).scores || {}).forEach(x=>{ if (takeRecord(x)) changed = true; });
  const pg = (LIVE.room||{}).ping;
  if (pg && pg.t > LIVE.ping0 && pg.t > LIVE.seen){ LIVE.seen = pg.t; if (pg.by !== ME()){ toast(`${pg.by} refreshed everyone's app`); liveRefresh(); } }
  LIVE.seen = Math.max(LIVE.seen, (pg && pg.t) || 0);
  LIVE.state = "on"; liveStatus();
  if (changed && /^#(board|games)$/.test(location.hash)){ const y = scrollY; route(); scrollTo(0, y); }
}
function liveListen(){
  if (!liveBase() || !window.EventSource) return; liveStop();
  const es = LIVE.es = new EventSource(`${liveBase()}.json`);
  const on = ev => { try { const m = JSON.parse(ev.data); if (m) liveApply(m.path, m.data); } catch(e){} };
  es.addEventListener("put", on); es.addEventListener("patch", ev => { try { const m = JSON.parse(ev.data); Object.entries(m.data||{}).forEach(([k,v])=>liveApply((m.path==="/"?"":m.path)+"/"+k, v)); } catch(e){} });
  es.onerror = () => { LIVE.state = navigator.onLine ? "retry" : "off"; liveStatus(); };
}
function liveStop(){ if (LIVE.es){ LIVE.es.close(); LIVE.es = null; } }
async function liveRefresh(){
  // Fetch the newest app (if one was published) and reload; scores come back with the page.
  try { const r = await navigator.serviceWorker?.getRegistration(); await r?.update(); } catch(e){}
  setTimeout(()=>location.reload(), 900);
}
function liveStatus(){
  const el = document.getElementById("live-st"); if (!el) return;
  el.textContent = !liveBase() ? "" : LIVE.dirty && !navigator.onLine ? "Offline. Your scores will send when you're back online."
    : LIVE.state === "on" ? "Live. Scores update on everyone's phone as you play." : "Connecting…";
  el.dataset.st = LIVE.state;
}
function liveInit(){
  if (!liveBase()) return;
  const set0 = local.set; local.set = (k, v) => { set0(k, v); if (SCORE_KEYS.has(k)) livePush(); };
  livePush(true); liveListen();
  document.addEventListener("visibilitychange", ()=>{ if (document.visibilityState === "visible"){ liveListen(); if (LIVE.dirty) livePush(true); } else liveStop(); });
  addEventListener("online", ()=>{ liveListen(); livePush(true); });
}
document.addEventListener("click", async e=>{
  const b = e.target.closest("[data-liveping]"); if (!b) return;
  if (!liveBase()) return liveRefresh();
  try { await fetch(`${liveBase()}/ping.json`, { method: "PUT", body: JSON.stringify({ t: Date.now(), by: ME() }) }); toast("Refreshing everyone's app"); } catch(err){ toast("No connection. Try again when you're online."); return; }
  liveRefresh();
});
document.addEventListener("click", e=>{ if (e.target.closest("[data-liverefresh]")){ livePush(true); liveListen(); toast("Scores refreshed"); } });

async function shrink(file){
  const bmp = await createImageBitmap(file), k = Math.min(1, 1400/Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width*k); c.height = Math.round(bmp.height*k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(ok=>c.toBlob(ok, "image/jpeg", .82));
}

const CITYV = { hcmc:"Sài Gòn", hoian:"Hội An", danang:"Đà Nẵng", hanoi:"Hà Nội", ninhbinh:"Ninh Bình", blr:"Bengaluru", kmc:"Karamchedu", hyd:"Hyderabad", srq:"Sarasota" };
const cityCol = c => CITYCOL[c] || "var(--b)";
const SLIDES = {
  hoian:[["Hội An","Hội An old town"],["Japanese Covered Bridge","Japanese Covered Bridge"],["Thu Bồn River","Thu Bồn River"],["Basket boat","Basket boats, Cẩm Thanh"]],
  hanoi:[["Hoàn Kiếm Lake","Hoàn Kiếm Lake"],["Old Quarter (Hanoi)","Hà Nội Old Quarter"],["Hanoi Train Street","Train Street"]],

// Today's city first (up to three photos), then the famous sights from the other cities: six in all.
function slidesFor(city){
  const out = [...(SLIDES[city]||[]).slice(0,3)], rest = Object.keys(SLIDES).filter(c=>c!==city);
  for (let i = 0; out.length < 6 && i < 40; i++){ const c = rest[i % rest.length], x = SLIDES[c][Math.floor(i / rest.length)]; if (x) out.push(x); }
  return out;
}
const reduceMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
function streetHero(o){
  const sl = slidesFor(o.city), k0 = reduceMotion() ? parse(todayIso()).getDate() % sl.length : 0;
  return `<section class="shero" id="shero" style="--city:${cityCol(o.city)}">
    <div class="slides">${sl.map(([key,cap],i)=>`<div class="ph sl${i===k0?" on":""}" data-lead="${esc(key)}" data-c="${esc(cap)}"></div>`).join("")}</div>
    <span class="capchip">${k0+1} of ${sl.length} · ${esc(sl[k0][1])}</span>
    <div class="tx"><div class="d">${o.line}</div><div class="plate"><div class="in"><span class="sm">${o.sm}</span><span class="nm" lang="vi">${esc(o.nm)}</span></div></div>
      ${o.title?`<div class="t">${o.title}</div>`:""}<div class="sdots" aria-hidden="true">${sl.map((_,i)=>`<i${i===k0?' class="on"':""}></i>`).join("")}</div></div></section>`;
}
let SLT = null;
function startSlides(){
  clearInterval(SLT); const h = document.getElementById("shero"); if (!h) return;
  const sl = [...h.querySelectorAll(".sl")], dots = [...h.querySelectorAll(".sdots i")], cap = h.querySelector(".capchip"); if (sl.length < 2) return;
  let k = Math.max(0, sl.findIndex(x=>x.classList.contains("on")));
  const show = n => { k = (n + sl.length) % sl.length; sl.forEach((x,i)=>x.classList.toggle("on", i===k)); dots.forEach((x,i)=>x.classList.toggle("on", i===k)); cap.textContent = `${k+1} of ${sl.length} · ${sl[k].dataset.c}`; };
  // Plays through once, then rests on the first photo; any touch hands control to the person (WCAG 2.2.2).
  let left = sl.length;
  const tick = () => { if (!document.body.contains(h)) return clearInterval(SLT); if (document.visibilityState !== "visible") return; show(k+1); if (--left <= 0) clearInterval(SLT); };
  const run = () => { clearInterval(SLT); if (!reduceMotion() && left > 0) SLT = setInterval(tick, 6000); };
  run();
  let x0 = null, y0 = 0;
  h.addEventListener("touchstart", e=>{ clearInterval(SLT); left = 0; x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive:true});
  h.addEventListener("touchcancel", ()=>{ x0 = null; }, {passive:true});
  h.addEventListener("touchend", e=>{ if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)){ show(k + (dx < 0 ? 1 : -1)); run(); } }, {passive:true});
}

// Time plates: "10:00" when the plan has a clock time, otherwise the first word ("Evening").
const tplate = x => x.exact ? `${String(Math.floor(x.s/60)%24).padStart(2,"0")}:${String(x.s%60).padStart(2,"0")}` : esc(x.t.replace(/^~/,"").split(/[ ,(/]/)[0]);
const LEAVE = /grab|car to|private car|taxi|transfer|airport|\bfly\b|flight|vn ?\d|train|bus to|head to/i;
function nowStreetHtml(d, skip){
  let { tl, cur, nxt, key, now } = nowNext(d);
  if (skip) { const sk = x => x && x.w.includes(skip); tl = tl.filter(x => !sk(x)); if (sk(cur)) cur = null; if (sk(nxt)) nxt = tl.find(x => x.s > now); }
  const until = x => x.exact ? hm(x.s/60) : x.t.replace(/^~/,"").toLowerCase();
  let big = null, rest = [];
  if (nxt && nxt.exact && nxt.s - now <= 45){
    const m = nxt.s - now;
    big = { k: m < 1 ? "Right now" : `Right now · ${LEAVE.test(nxt.w) ? "leave" : "starts"} ${inTime(m)}`, x: nxt };
    rest = tl.filter(x=>x.s > nxt.s || (x.s === nxt.s && x !== nxt && tl.indexOf(x) > tl.indexOf(nxt)));
  } else if (cur){
    big = { k: `Right now${nxt ? ` · until ${until(nxt)}` : ""}`, x: cur };
    rest = tl.filter(x=>x.s > now);
  } else if (nxt){
    big = { k: `First up · ${nxt.exact ? inTime(nxt.s - now) : until(nxt)}`, x: nxt };
    rest = tl.filter(x=>x.s > nxt.s);
  }
  const rows = [];
  if (rest[0]) rows.push(rest[0]);
  const k2 = rest.find(x=>x.key && !rows.includes(x)) || (rest[1] && !rows.includes(rest[1]) ? rest[1] : null);
  if (k2) rows.push(k2);
  const bp = big && (placesFor(big.x.w, d.city).find(p => p.photo) || {}).photo;
  const cd = big && big.x.exact && big.x.s > now ? `In ${inTime(big.x.s - now).replace(/^in /, "")}` : "";
  let h = big ? (bp ? `<div class="nowc hasph"><span class="ph" data-lead="${esc(bp)}"></span><span class="nowb">${cd ? `<i class="cdn">${esc(cd)}</i>` : `<i class="cdn now">Now</i>`}<span class="num big"><span>${tplate(big.x)}</span></span></span><div class="nowt"><span class="k">${esc(big.k)}</span><b>${esc(big.x.w)}</b></div></div>`
    : `<div class="nowc"><div><span class="k">${esc(big.k)}</span><b>${esc(big.x.w)}</b></div><span class="num big"><span>${tplate(big.x)}</span></span></div>`) : "";
  h += rows.map(x=>`<div class="nx"><span class="num"><span>${tplate(x)}</span></span><div><b>${esc(x.w)}</b><small>${x.key?`<span class="lan">Don't miss</span>`:""}${x.exact ? inTime(x.s - now) : "around " + esc(until(x))}</small></div></div>`).join("");
  if (!nxt){
    const i = T.days.findIndex(x=>x.date===d.date), tm = T.days[i+1], first = tm && timeline(tm)[0];
    h += `<div class="nx"><span class="num"><span>${first ? tplate(first) : "Done"}</span></span><div><b>${first ? `Tomorrow: ${esc(first.w)}` : "That's today's plan. Enjoy it."}</b><small>${first ? "That's the plan for today" : ""}</small></div></div>`;
  }
  return h;
}

// Next stop: the next place in today's plan (or tonight's stay), with the address for the driver and how to get there.
const WALK_I = '<svg viewBox="0 0 24 24"><circle cx="13" cy="4" r="2"/><path d="M10 22l2-7 3 3v4M8 12l2-4 4 1 3 3M10 8l-2 5"/></svg>';
const CAR_I = '<svg viewBox="0 0 24 24"><path d="M5 17h14v-5l-2-5H7l-2 5zM5 12h14M7 17v2M17 17v2"/><circle cx="8" cy="14.5" r=".8"/><circle cx="16" cy="14.5" r=".8"/></svg>';
function nextStop(){
  const d = dayOf(todayIso()); if (!d) return null;
  const { tl, now } = nowNext(d);
  const prevPlace = (() => { for (const x of [...tl].reverse()) if (x.s <= now && x.i >= 0){ const p = placesFor(x.w, d.city).find(p=>COORD(p.name)); if (p) return p; } return null; })();
  // Riding somewhere right now (a Grab to the airport): that's the next stop.
  const cur = [...tl].reverse().find(x=>x.s <= now && x.i >= 0);
  if (cur && LEAVE.test(cur.w)){ const p = placesFor(cur.w, d.city)[0]; if (p) return { d, x: cur, p, from: null }; }
  for (const x of tl) if (x.s >= now - 10 && x.i >= 0){ const p = placesFor(x.w, d.city)[0]; if (p && p !== prevPlace) return { d, x, p, from: prevPlace }; }
  const st = d.stay && stayById(d.stay); return st ? { d, st, from: prevPlace } : null;
}
function nextStopSheet(){

    const A = n.from && COORD(n.from.name), B = COORD(n.p.name);
    if (A && B && hav(A, B) < 40){ const km = hav(A, B) * 1.3; move = km < 2.2 ? `${WALK_I} About ${Math.max(2, Math.round(km / 4.8 * 60))} min walk from ${esc(n.from.name)} · ${km.toFixed(1)} km` : `${CAR_I} About ${Math.max(5, Math.round(km / 22 * 60 + 4))} min by Grab from ${esc(n.from.name)} · ${km.toFixed(1)} km`; }
  } else { name = n.st.name; vi = n.st.name; addr = n.st.address || ""; link = mapUrl(n.st.address || n.st.map || n.st.name); }

    ${n.x ? `<div class="small muted">${esc(n.x.w)}</div>` : ""}
    <div class="addr"><div><div class="vi" lang="vi">${esc(vi)}</div>${addr ? `<div class="a" lang="vi">${esc(addr)}</div>` : `<div class="a">Search this name in Grab</div>`}</div><button class="btn" data-copy="${esc(full)}">Copy</button></div>
    ${move ? `<div class="ns-move">${move}</div>` : ""}
    <div class="btns"><button class="btn solid" data-driver="${esc(vi)}" data-driver-sub="${esc(addr)}">Show the driver</button><a class="btn" href="grab://open" data-copy="${esc(full)}">Copy and open Grab</a><a class="btn" href="${link}" target="_blank" rel="noopener">Google Maps ↗</a></div>`);
}

// Pull down on Today to see the next stop.
{ let pd = null;

// Plan: the route, grouped by city signs, with stamps on finished days.
function dayStamps(){
  const out = {};
  boardRecords().forEach(r=>Object.entries(r.h||{}).forEach(([id,ts])=>{ const it = huntItem(id); if (!it) return; const day = isoOf(new Date(ts));
    const o = out[day] = out[day] || { n: 0, by: {} }; o.n++; o.by[r.n] = (o.by[r.n]||0) + it[1]; }));
  return out;
}
// Plan (A3): city story circles, a banner for the chosen city, and a short card per day. Tapping a day opens its own page.
let PCITY = null;
function planGroups(){
  const groups = [];
  T.days.forEach(d=>{ if (d.place === "Tokyo" && d.city) { (groups.find(g=>g.key===d.city) || (groups.push({ key:d.city, city:d.city, days:[] }), groups[groups.length-1])).days.push(d); return; }
    const key = VN(d.city) ? d.city : (d.city || d.place); let g = groups.find(x=>x.key===key);
    if (!g) { g = { key, city: d.city, place: d.place, days: [] }; groups.push(g); } g.days.push(d); });
  return groups;
}
function dayPh(d){ const st = d.stay ? stayById(d.stay) : null; return d.photo || ((T.flights||[]).find(f=>f.date===d.date)||{}).photo || (st && st.photo) || ""; }
function dayBriefOf(d){
  if (!PB() && d.date < "2026-12-06") return [["🛬", "Your flight lands"], ["🚗", "Grab to the Airbnb and rest up"]];
  const b = (MOg().dayBrief||{})[d.date]; if (b) return PB() ? b : b.filter(([, t]) => !/Bangalore|India/.test(t));
  const its = d.items.filter(x=>!/^(sleep|check out|breakfast|grab to|check in)/i.test(x[1])).slice(0,3);
  return its.map((x,i)=>[["☀️","🌤","🌙"][i], x[1].split(/[.:,(]/)[0].slice(0,42)]);
}
function planStreet(){
  const iso = todayIso(), vd = T.days.filter(d=>VN(d.city)), S = dayStamps();

    if (l && l.key === key) l.days.push(d); else secs.push({ key, city: d.city, place: d.place, days: [d] }); });

  const all = k => secs.filter(x=>x.key===k).flatMap(x=>x.days);
  const rng = ds => { const f = ds[0].date, l = ds[ds.length-1].date; return fmt(f) + (l !== f ? "–" + (parse(l).getMonth() === parse(f).getMonth() ? parse(l).getDate() : fmt(l)) : ""); };
  const circlesOld = secs.filter(x=>x.first).map(x=>`<button type="button" class="pcirc${x.key === "ninhbinh" ? " trip" : ""}${all(x.key).some(d=>d.date===iso)?" now":""}${all(x.key).every(d=>d.date<iso)?" done":""}" data-pgo="${esc(x.key)}" style="--city:${cityCol(x.city)}"><i class="ph" data-lead="${esc(gph(x))}"></i><b lang="vi">${esc(nm(x))}</b><small>${x.key === "ninhbinh" ? "Day trip · " : ""}${rng(all(x.key))}</small></button>`).join("");
  const cs = secs.filter(x=>x.first), cls = x => `${all(x.key).some(d=>d.date===iso)?" now":""}${all(x.key).every(d=>d.date<iso)?" done":""}`;
  const tdo = x => all(x.key).reduce((n,d)=>n + d.items.filter(y=>y[2]==="todo").length, 0), nd = x => all(x.key).length;
  const circles = `<div class="psigns">${cs.map(x=>`<button type="button" class="pnv${cls(x)}" data-pgo="${esc(x.key)}" style="--city:${cityCol(x.city)}"><span class="sg${x.key==="ninhbinh"?" trip":""}"><span><b lang="vi">${esc(nm(x))}</b><small>${x.key==="ninhbinh"?"Day trip":rng(all(x.key))}</small></span></span></button>`).join("")}</div>`;
  // How you get to a section: a flight that day (or the evening before), else a travel-looking item.

  const howTo = d => { const i = T.days.indexOf(d), prev = T.days[i-1];

      if (l) return { ic:"✈", t: (h => `${(+h[0]) % 12 || 12}:${h[1]} ${+h[0] < 12 ? "AM" : "PM"}`)(l.dep.slice(11,16).split(":")), w: `${/^[A-Z]{1,3} ?\d/.test(l.no) ? l.no : l.by.split(" (")[0]} · ${l.from} → ${l.to}`, todo: /not booked/i.test(l.by), key: bkFlightKey(l.dep.slice(0,10), "", l.no), leg: l.no };
      const its = day.items.filter(x=>RX.test(x[1]) && !(x[3]==="pb" && !PB())), it = day === d ? its[0] : its[its.length-1];
      if (it) return { ic: /flight|Airlines|VietJet|Bamboo/i.test(it[1]) ? "✈" : /train/i.test(it[1]) ? "🚆" : "🚗", t: it[0], w: it[1].replace(/\s*\(.*?\)/g,"").split(/\. /)[0].slice(0,64), todo: it[2]==="todo", key: /flight|Airlines|VietJet|Bamboo/i.test(it[1]) ? bkFlightKey(day.date, it[1]) : "" }; }

  const stamp = d => { if (d.date >= iso) return ""; const s = S[d.date]; return `<span class="dstamp">Done${s ? ` · ${s.n} find${s.n>1?"s":""}` : ""}</span>`; };

      <div class="pday-x"><a class="pt pdlink" role="heading" aria-level="3" href="#day-${d.date}">${esc(d.title)}</a>${d.place.includes("→") ? `<small class="pp">${esc(d.place)}</small>` : ""}${brief}
      ${pill}</div>${ton}</div>`; };

function todoHtml(iso){

// Travelling pill: which stop and year you're reading. IntersectionObserver only, no scroll handlers.
let TLFIO = [];
function tlfWatch(){
  TLFIO.forEach(o => o.disconnect()); TLFIO = [];
  document.querySelectorAll("body > .tlf-pill").forEach(x => x.remove());
  const pill = document.getElementById("tlfpill"); if (!pill) return; document.body.appendChild(pill);
  const name = document.getElementById("tlfname"), yr = document.getElementById("tlfyr"), stops = [...document.querySelectorAll(".tlf-stop")];
  const hdr = (document.querySelector("header.top") || {}).offsetHeight || 60, band = `-${hdr + 40}px 0px -${Math.round(innerHeight * .6)}px 0px`;
  const setStop = sec => { const i = stops.indexOf(sec); name.textContent = sec.dataset.name; pill.querySelectorAll(".tlf-dots i").forEach((d, j) => { d.className = j < i ? "past" : j === i ? "on" : ""; }); };
  const so = new IntersectionObserver(es => { es.forEach(e => { if (e.isIntersecting) setStop(e.target); }); }, { rootMargin: band });
  stops.forEach(s => so.observe(s));
  const yo = new IntersectionObserver(es => { es.forEach(e => { if (e.isIntersecting && yr.textContent !== e.target.dataset.y){ yr.textContent = e.target.dataset.y; } }); }, { rootMargin: band });
  document.querySelectorAll(".tlf li[data-y]").forEach(li => yo.observe(li));
  const first = stops[0], vo = new IntersectionObserver(es => { es.forEach(e => pill.classList.toggle("show", !e.isIntersecting && e.boundingClientRect.top < 0)); }, { rootMargin: `-${hdr}px 0px 0px 0px` });
  if (first) vo.observe(first.querySelector(".tlf-h"));
  TLFIO = [so, yo, vo];
}

function srLev(a, b){ if (Math.abs(a.length-b.length) > 2) return 9; const d = Array.from({length:b.length+1},(_,j)=>j); for (let i=1;i<=a.length;i++){ let prev = d[0]; d[0] = i; for (let j=1;j<=b.length;j++){ const t = d[j]; d[j] = Math.min(d[j]+1, d[j-1]+1, prev + (a[i-1]===b[j-1]?0:1)); prev = t; } } return d[b.length]; }

function parseConf(txt){

  const push = (type, i, v) => ev.push({ type, i, v });
  for (const m of T0.matchAll(/\b([A-Z]{2}|[A-Z]\d|\d[A-Z])\s?(\d{1,4})\b/g)) if (!/^\d+$/.test(m[1]) && !APT[m[1] + m[2]] && +m[2] > 0 && !/^(AM|PM|PC|OK|NO|TO)$/.test(m[1])) push("no", m.index, m[1] + " " + m[2]);

  for (const m of T0.matchAll(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s(\d{1,2})(?:,?\s(\d{4}))?\b/gi)) push("date", m.index, `${m[3] || 2026}-${String(MON[m[1].toLowerCase()]).padStart(2, "0")}-${m[2].padStart(2, "0")}`);

}

    tile("bell", "Alarm", alarm != null ? hm(Math.max(alarm, 4)) : "Sleep in", alarm != null ? "for " + why : "No early start"),
    leg ? tile("plane", "Flight", `${leg.no} · ${t12(leg.dep)}`, CK && CK.isOpen ? "Online check-in is open" : `${leg.from} → ${leg.to}`) : timed[0] ? tile("clock", "First up", timed[0][1][0].replace(/^~/, ""), timed[0][1][1]) : "",
    co ? tile("key", "Checkout", (co.checkout || "").replace(/^\w{3} \w{3} \d+,?\s*/, "") || "Tomorrow", co.name) : ""
  ].filter(Boolean).join("");
  return `<div class="nbcard"><div class="nb-h">${icon("moon")}<span><small>Tonight</small><b>Get ready for ${esc(dn)}</b></span><button type="button" class="nb-more" data-ttab="next">Tomorrow ›</button></div>
    <div class="nb-ts">${tiles}</div>
    ${bring.length ? `<div class="nb-pack"><small>Lay out tonight</small><ul>${bring.map(([t]) => `<li>${esc(t)}</li>`).join("")}</ul></div>` : ""}</div>`;
}

// Offline note: a small glass pill under the header whenever the phone has no signal.
function offlineNote(){
  const off = !navigator.onLine || new URLSearchParams(location.search).get("off");
  let el = document.getElementById("offnote");
  if (!off) { if (el) el.remove(); return; }
  // Says when this version of the trip info was made; announced once when going offline, not every minute.
  const day = T && T.builtAt ? fmt(T.builtAt.slice(0, 10)) : "";
  const fresh = !el; if (!el) { el = document.createElement("div"); el.id = "offnote"; document.body.append(el); }
  const html = `<i></i><span><b>Offline</b>${day ? ` · trip info from ${day}` : " · everything saved on this phone"}</span>`;
  if (el.innerHTML !== html) el.innerHTML = html; if (fresh) toast("You're offline. Everything saved on this phone still works.");
}
addEventListener("online", offlineNote); addEventListener("offline", offlineNote);
setInterval(() => { if (document.visibilityState === "visible") offlineNote(); }, 60000);

function launch(){
  if (!ME()) return picker();
  T = scoped(FULL); afterTripReady(); if (!LIVE.init){ LIVE.init = 1; liveInit(); } $("#tabs").hidden=false; current=null; route();
  setTimeout(()=>prefetchPhotos().catch(()=>{}), 4000);
}
function start(data){
  FULL = data; window.addEventListener("hashchange",()=>{ if(T && ME()) requestAnimationFrame(()=>route()); }); launch();
  // Tabs and section buttons replace the history entry, so the iPhone back-swipe can't flip between tabs.
  document.addEventListener("click",e=>{ const a=e.target.closest("#tabs a[href^='#'], nav.seg a[href^='#']"); if(!a) return; e.preventDefault(); const h=a.getAttribute("href");
    if (location.hash!==h){ history.replaceState(null,"",h); if(T && ME()) route(); } },true);
}

// Encrypted build: the trip data is locked with a shared trip passcode, entered once per phone.
async function unlock(pass, enc){
  const b = s => Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b(enc.salt), iterations:150000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b(enc.iv)}, key, b(enc.ct));
  if (enc.z) return JSON.parse(await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"))).text());
  return JSON.parse(new TextDecoder().decode(pt));
}
function lockScreen(enc, msg){
  $("#view").innerHTML = `<form class="lock" id="lockform"><div class="brand" style="font-size:30px">Vietnam<span>’26</span></div>
    <label for="pass" class="muted">Enter the trip passcode. You only need to do this once on this phone.</label>
    <input id="pass" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" enterkeyhint="go" placeholder="Trip passcode" required>
    <button class="btn solid">Unlock</button>${msg?`<div class="err">${esc(msg)}</div>`:""}</form>`;
  $("#lockform").addEventListener("submit", async e=>{ e.preventDefault(); const p=$("#pass").value.trim();
    try { const d = await unlock(p, enc); store.set("trip-pass", p); start(d); } catch(err){ lockScreen(enc, "That passcode didn't work. Check it with Praneeth and try again."); } });
}

if (window.TRIP) start(window.TRIP);
else if (window.TRIP_ENC){
  const saved = store.get("trip-pass");
  if (saved) unlock(saved, window.TRIP_ENC).then(start).catch(err=>{ if (window.TRIP_ENC.z && typeof DecompressionStream==="undefined"){ $("#view").innerHTML=`<div class="card" style="margin:24px 16px"><b>Update your iPhone to open the trip app.</b><p class="small">It needs iOS 16.4 or newer: Settings, General, Software Update.</p></div>`; return; } store.del("trip-pass"); lockScreen(window.TRIP_ENC); });
  else lockScreen(window.TRIP_ENC);
}
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && !/claude/.test(location.host)) {
  navigator.serviceWorker.register("sw.js").then(r=>{ r.update().catch(()=>{}); document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") r.update().catch(()=>{}); }); }).catch(()=>{});
  // A new version took over: reload once so it shows right away.
  let reloaded=false; const hadSW=!!navigator.serviceWorker.controller; navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(reloaded || !hadSW) return;
    // Don't pull the page out from under someone: wait while a guide plays, a sheet, search or a form is open.
    const busy = () => (typeof Player !== "undefined" && Player.playing) || document.querySelector(".sheet,#srch,.cstory") || (document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) || (typeof SU !== "undefined" && SU);
    const go = () => { if (reloaded) return; if (busy()) return setTimeout(go, 15000); reloaded=true; location.reload(); };
    if (busy()) { toast("Update ready. It loads when you're done here."); setTimeout(go, 15000); } else go(); });
}
})();
</script>
