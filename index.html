// --- Cash for today ---
function cashFor(d){
  if (!d || !VN(d.city)) return null;
  const F = MOg().fees||{}, B = MOg().cashBase||{food:350000,ride:40000,buffer:200000};
  const names = [...new Set(d.items.flatMap(x=>placesFor(x[1], d.city)).map(p=>p.name))];
  const lines = [];
  names.forEach(n=>{ if (F[n]) lines.push([n, F[n]]); });
  const txt = d.items.map(x=>x[1]).join(" ").toLowerCase();
  const rides = (txt.match(/\bgrab\b|\bcar to\b|\bcar\b|taxi|transfer/g)||[]).length;
  const fine = /coco|\bgia\b|tasting menu|la maison|anan/.test(txt);
  lines.push([fine ? "Street food, coffee and snacks (dinner on card)" : "Meals, coffee and snacks", fine ? Math.round(B.food*0.6) : B.food]);
  if (rides) lines.push([`${rides} ride${rides>1?"s":""}, shared`, rides*B.ride]);
  lines.push(["Tips and small extras", B.buffer]);
  const total = lines.reduce((s,l)=>s+l[1],0);
  return { total, lines };
}
function cashHtml(d){
  const c = cashFor(d); if (!c) return "";
  return `<details class="card cash"><summary><span class="cash-ico">₫</span><span><b>Carry about ${fmtVnd(c.total)} each</b><span class="small muted">≈ ${fmtUsd(c.total)} · tap for the breakdown</span></span></summary>
    <ul class="cashl">${c.lines.map(([t,v])=>`<li><span>${esc(t)}</span><b>${(Math.round(v/1000)).toLocaleString()}k</b></li>`).join("")}</ul>
    <p class="small muted" style="margin:6px 0 0">Bring small notes (10k–100k). Cards work at hotels and nicer restaurants; markets, street food and tips are cash.</p></details>`;
}

// --- Morning brief ---
function briefHtml(d){
  const test = new URLSearchParams(location.search).get("am");
  if (!d || (nowH() >= 12 && !test)) return "";
  const h = nowH();
  const next = d.items.map(x=>[parseItemTime(x[0]), x]).filter(([t])=>t!=null && t >= h - 0.25).sort((a,b)=>a[0]-b[0])[0];
  const leg = legsOn(d.date).find(l=>localDate(l.dep)===d.date);
  const list = checklistFor(d), txt = list.map(x=>x[0]).join(" ");
  const wear = [];
  if (/Shoulders/.test(txt)) wear.push("shoulders and knees covered");
  if (/Comfortable shoes/.test(txt)) wear.push("good walking shoes");
  if (/Umbrella/.test(txt)) wear.push("something for the rain");
  if (/Light jacket/.test(txt)) wear.push("a light layer for tonight");
  if (/Dinner outfit/.test(txt)) wear.push("dinner clothes for tonight");
  if (!wear.length) wear.push("light, breathable clothes");
  const bring = list.filter(([t])=>!/Shoulders|Comfortable shoes|Dinner outfit|Light jacket|Phone charged|Cash in dong/.test(t)).map(x=>x[0]);
  const c = cashFor(d);
  const row = (k, v) => `<div class="br-r"><span class="br-k">${k}</span><span>${v}</span></div>`;
  return `<h3>Good morning</h3><div class="card brief">
    ${leg ? row("Flight", `<b>${esc(leg.no)} at ${localTime(leg.dep)}</b>`) : ""}
    ${next ? row("First up", `<b>${esc(next[1][0])}</b> ${esc(next[1][1])}`) : row("First up", "Nothing timed. Take it slow.")}
    ${row("Wear", esc(wear.join(", ")))}
    ${bring.length ? row("Bring", esc(bring.join(", "))) : ""}
    ${c ? row("Cash", `<b>about ${fmtVnd(c.total)}</b> each`) : ""}
  </div>`;
}

// --- Split and meet ---
function meetGet(){ const m = local.get("meet", null); if (!m) return null; if (Date.parse(m.at) < Date.now() - 45*60000) { store.del("meet"); return null; } return m; }
function meetOptions(city){
  const pl = (T.places||[]).filter(p=>(CITYSET[city]||[]).slice(0,1).includes(p.city) && !/Airport/.test(p.name));
  const R = (MOg().regroup||{})[city], d = dayOf(todayIso()), st = d && d.stay ? stayById(d.stay) : null;
  const opts = [];
  if (R) opts.push([R.spot, R.vi]); if (st) opts.push([st.name, st.addr||st.name]);
  pl.forEach(p=>opts.push([p.name, p.vi]));
  return opts;
}
function meetCard(){
  const m = meetGet(); if (!m) return "";
  const mins = Math.round((Date.parse(m.at) - Date.now())/60000);
  return `<h3>Meet up</h3><div class="card meet"><div class="meet-t">${mins > 0 ? inTime(mins) : mins > -45 ? "Now" : ""}</div>
    <b>${esc(m.place)}</b><span class="small muted">at ${new Date(m.at).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"})}${m.note?` · ${esc(m.note)}`:""}</span>
    <div class="btns">${m.vi?`<button class="btn" data-driver="${esc(m.vi)}">Show the driver</button>`:""}<a class="btn" href="${mapUrl(m.place+", Vietnam")}" target="_blank" rel="noopener">Directions</a><button class="btn" data-meetclear>Clear</button></div></div>`;
}
function splitPage(){
  const d = dayOf(todayIso()), city = d && VN(d.city) ? d.city : "hcmc";
  const opts = meetOptions(city), t = new Date(Date.now() + 2*3600e3); t.setMinutes(Math.ceil(t.getMinutes()/15)*15, 0, 0);
  const tv = `${String(t.getHours()).padStart(2,"0")}:${String(t.getMinutes()).padStart(2,"0")}`;
  return `<a class="btn back-link" href="#today">← Today</a><h2>Split and meet</h2>
    <p class="small muted" style="margin:0 0 12px">Pick where and when to meet back up. Sending it to the group chat puts a countdown on everyone's Today screen.</p>
    <div class="card form"><label>Meet at<select id="mt-place">${opts.map(([n,v],i)=>`<option value="${i}">${esc(n)}</option>`).join("")}</select></label>
    <label>Time<input id="mt-time" type="time" value="${tv}"></label>
    <label>Who's going where (optional)<input id="mt-note" placeholder="e.g. Sunny + Karthik at the tailor, rest at the market" maxlength="120"></label>
    <div class="btns"><button class="btn solid" data-meetsend>Send to the group</button></div></div>`;
}
document.addEventListener("click", async e=>{
  if (e.target.closest("[data-meetclear]")){ store.del("meet"); route(); return; }
  if (!e.target.closest("[data-meetsend]")) return;
  const d = dayOf(todayIso()), city = d && VN(d.city) ? d.city : "hcmc", opts = meetOptions(city);
  const o = opts[+$("#mt-place").value] || opts[0], [H,Mi] = ($("#mt-time").value||"18:00").split(":").map(Number);
  const at = new Date(); at.setHours(H, Mi, 0, 0); if (at < Date.now() - 3600e3) at.setDate(at.getDate()+1);
  const m = { place: o[0], vi: o[1], at: at.toISOString(), note: $("#mt-note").value.trim() };
  local.set("meet", m);
  const code = btoa(unescape(encodeURIComponent(JSON.stringify(m)))).replace(/=+$/,"");
  const url = location.origin + location.pathname + "#meet-" + code;
  const text = `Meet at ${m.place}, ${at.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})}${m.note?` (${m.note})`:""}. Open in the trip app: ${url}`;
  try { if (navigator.share) { await navigator.share({ text }); } else { await navigator.clipboard.writeText(text); toast("Copied. Paste it in the group chat"); } } catch(err){}
  location.hash = "#today";
});
function takeMeetFromHash(){
  const h = location.hash.slice(1); if (!h.startsWith("meet-")) return false;
  try { const m = JSON.parse(decodeURIComponent(escape(atob(h.slice(5))))); if (m && m.place && m.at) { local.set("meet", m); toast("Meet-up added to Today"); } } catch(e){}
  history.replaceState(null, "", location.pathname + location.search + "#today"); return true;
}

// --- Google Maps: today's route, and every place as a file for Google My Maps ---
function dayRouteUrl(d){
  const ps = [...new Set(d.items.flatMap(x=>placesFor(x[1], d.city)))].filter(p=>COORD(p.name) && !/Airport/.test(p.name));
  if (ps.length < 2) return null;
  const pt = p => COORD(p.name).join(","), mid = ps.slice(1,-1).slice(0,8);
  return `https://www.google.com/maps/dir/?api=1&origin=${pt(ps[0])}&destination=${pt(ps[ps.length-1])}${mid.length?`&waypoints=${encodeURIComponent(mid.map(pt).join("|"))}`:""}&travelmode=walking`;
}
function kmlText(){
  const x = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
  const by = {};
  (T.places||[]).forEach(p=>{ const C = COORD(p.name); if (!C) return; (by[p.city] = by[p.city]||[]).push(`<Placemark><name>${x(p.name)}</name><description>${x(p.vi)}${p.addr?", "+x(p.addr):""}</description><Point><coordinates>${C[1]},${C[0]},0</coordinates></Point></Placemark>`); });
  return `<?xml version="1.0" encoding="UTF-8"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>Vietnam '26</name>${Object.entries(by).map(([c,pm])=>`<Folder><name>${x(c)}</name>${pm.join("")}</Folder>`).join("")}</Document></kml>`;
}
document.addEventListener("click", async e=>{ const b=e.target.closest("[data-kml]"); if(!b) return; e.preventDefault();
  const file = new File([kmlText()], "vietnam26-places.kml", {type:"application/vnd.google-earth.kml+xml"});
  try { if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file], title:"Vietnam '26 places"}); return; } } catch(err){ if (err && err.name==="AbortError") return; }
  const url = URL.createObjectURL(file), a = document.createElement("a"); a.href = url; a.download = file.name; a.click(); setTimeout(()=>URL.revokeObjectURL(url), 60000);
});

function guideCard(g, km, closest){
  const nStops = g.stops.length-(g.stops[0].h==="Before you start"?1:0);
  return `<a class="card gcard${closest?" closest":""}" href="#guide-${g.id}"><div class="ph" data-lead="${esc(g.photo)}"></div><div><div class="t">${esc(g.title)}</div><div class="m">${esc(g.city)} · ${g.minutes} min · ${nStops} stops</div>${km!=null?`<div class="dist">${closest?"You're here · ":""}${distLabel(km)}</div>`:""}</div></a>`;
}
function seg(active){
  const set = (active==="plan"||active==="bookings") ? [["plan","Days"],["bookings","Bookings"]]
    : (active==="stays"||active==="places"||active==="map") ? [["stays","Stays"],["places","Places"],["map","Map"]]
    : [["explore","Stories"],["listen","Listen"],["eat","Eat"],["food","Bingo"],["say","Say"]];
  return `<nav class="seg">${set.map(([h,l])=>`<a href="#${h}"${h===active?' aria-current="page"':""}>${l}</a>`).join("")}</nav>`;
}
function bingo(){ try{ return JSON.parse(store.get("bingo")||"{}"); }catch(e){ return {}; } }
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-dish]"); if(t){ const b=bingo(), k=t.dataset.dish; if(b[k]) delete b[k]; else b[k]=Date.now(); store.set("bingo",JSON.stringify(b));
    t.setAttribute("aria-pressed", !!b[k]); const all=T.food.flatMap(g=>g.items), n=all.filter(([x])=>b[x]).length;
    const bar=document.querySelector(".bar i"); if(bar) bar.style.width=Math.round(n/all.length*100)+"%"; const c=document.querySelector(".bingo-h b"); if(c) c.innerHTML=`${n}<span class="muted" style="font-size:15px">/${all.length}</span>`;
    if (b[k] && navigator.vibrate) navigator.vibrate(12); return; }
  const sec=e.target.closest("[data-sec]"); if(sec){ e.preventDefault(); document.getElementById(sec.dataset.sec)?.scrollIntoView({behavior:"smooth",block:"start"}); }
});
function fmt(iso){ const d=parse(iso); return `${MON[d.getMonth()]} ${d.getDate()}`; }

document.addEventListener("submit",e=>{

  const v=id=>(document.getElementById(id)?.value||"").trim();
  if (f.id==="emform"){ const o={}; ["name","blood","medical","ins","insphone","contact","cphone"].forEach(k=>o[k]=v("em-"+k)); local.set("emergency",o); window._editEm=false; toast("Saved"); }
  if (f.id==="tailorform"){ const l=local.get("tailoring",[]); l.push({item:v("t-item"),shop:v("t-shop"),fitting:v("t-fitting"),pickup:v("t-pickup"),price:v("t-price")}); local.set("tailoring",l); toast("Saved"); }

  const y=scrollY; render(current.startsWith("story-")?"explore":(PARENT[current]||current), null, PARENT[current]?current:null); scrollTo(0,y);
});

  const dt=e.target.closest("[data-deltailor]"); if(dt){ const l=local.get("tailoring",[]); l.splice(+dt.dataset.deltailor,1); local.set("tailoring",l); rerender(); }
  const df=e.target.closest("[data-delflight]"); if(df){ const l=local.get("my-flights",[]); l.splice(+df.dataset.delflight,1); local.set("my-flights",l); rerender(); }
});
function wireInfo(){
  const u=$("#c-usd"), v=$("#c-vnd"), i=$("#c-inr"); if(!u) return;
  const R=T.info.rates, num=x=>parseFloat(String(x).replace(/[^\d.]/g,""))||0;
  const show=(el,n,dp)=>{el.value=n?n.toLocaleString(undefined,{maximumFractionDigits:dp}):""};
  const from=src=>{ const usd = src===u?num(u.value):src===v?num(v.value)/R.VND:num(i.value)/R.INR;
    if(src!==u) show(u,usd,2); if(src!==v) show(v,usd*R.VND,0); if(src!==i) show(i,usd*R.INR,0); };
  [u,v,i].forEach(el=>el.addEventListener("input",()=>from(el))); from(u);
}

const TABS = {today:"Today", plan:"Plan", stays:"Stays", explore:"Explore", info:"Info"};
const ORDER = Object.keys(TABS);
const PARENT = {now:"today", split:"today", bookings:"plan", food:"explore", eat:"explore", listen:"explore", places:"stays", map:"stays", say:"explore"};
let current = null;
function render(h, target, sub){
  const page = sub || h;
  if (current !== page){ const v=$("#view"); v.style.animation="none"; void v.offsetWidth; v.style.animation=""; }
  $("#view").innerHTML = page.startsWith("story-") ? views.story(page.slice(6)) : page.startsWith("guide-") ? views.guide(page.slice(6)) : views[page]();
  document.body.classList.toggle("reading", page.startsWith("story-") || page.startsWith("guide-"));
  document.querySelectorAll("article.prose[data-gid^='story-']").forEach(tagChunks);
  document.querySelectorAll("#tabs a").forEach(a=>{ if(a.dataset.tab===h) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  $("#pill").style.transform = `translateX(calc(${ORDER.indexOf(h)} * (100% + 12px)))`;
  $("#subtitle").textContent = TABS[h];
  if (h==="info") wireInfo();
  if (h==="today") { fillWx(); fillNews(); }
  Player.ui();
  hydrate();
  if (page==="map") wireMap();
  sizeRoute();
  if (target){ const el=document.getElementById(target); if(el){ if(el.tagName==="DETAILS") el.open=true; el.scrollIntoView({block:"start"}); window.scrollBy(0,-64);} }
  else window.scrollTo(0,0);
  current = page;
}
function route(){
  takeMeetFromHash();
  let h = (location.hash||"#today").slice(1), target=null;
  if (h.startsWith("day-")) { target=h; h="plan"; }
  else if (h.startsWith("stay-")) { target=h; h="stays"; }
  let sub=null;
  if (PARENT[h]) { sub=h; h=PARENT[h]; }
  else if (h.startsWith("story-") || h.startsWith("guide-")) { sub=h; h="explore"; }
  if (!TABS[h]) h="today";
  if (h==="plan" && !target && T.days.some(d=>d.date===todayIso())) target="day-"+todayIso();
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const key = sub||h;
  render(h,target,sub);
}
document.addEventListener("click",e=>{
  const j=e.target.closest("[data-jump]"); if(!j) return;
  e.preventDefault(); const el=document.getElementById("day-"+j.dataset.jump);
  if(el){ if(!el.open) toggleDay(el); el.scrollIntoView({block:"start",behavior:"smooth"}); }
});

// Smooth open/close for the day cards.
function toggleDay(d){
  const body = d.querySelector(".daybody"); if (!body) return;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches || !body.animate){ d.open=!d.open; return; }
  if (d._anim) d._anim.cancel();
  if (!d.open){
    d.open = true; const h = body.scrollHeight;
    d._anim = body.animate([{height:"0px",opacity:0},{height:h+"px",opacity:1}],{duration:320,easing:"cubic-bezier(.2,.8,.2,1)"});
  } else {
    const h = body.scrollHeight;
    d._anim = body.animate([{height:h+"px",opacity:1},{height:"0px",opacity:0}],{duration:240,easing:"cubic-bezier(.4,0,.2,1)"});
    d._anim.onfinish = ()=>{ d.open=false; d._anim=null; };
  }
}
document.addEventListener("click",e=>{
  const s = e.target.closest("details.day > summary"); if(!s) return;
  e.preventDefault(); toggleDay(s.parentElement);
});

// Encrypted build: the trip data is locked with a shared trip passcode, entered once per phone.
async function unlock(pass, enc){
  const b = s => Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b(enc.salt), iterations:150000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b(enc.iv)}, key, b(enc.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function lockScreen(enc, msg){
  $("#view").innerHTML = `<form class="lock" id="lockform"><div class="brand" style="font-size:30px">Vietnam<span>’26</span></div>
    <label for="pass" class="muted">Enter the trip passcode. You only need to do this once on this phone.</label>
    <input id="pass" type="password" autocomplete="current-password" required>
    <button class="btn" style="justify-self:center">Unlock</button>${msg?`<div class="err">${esc(msg)}</div>`:""}</form>`;
  $("#lockform").addEventListener("submit", async e=>{ e.preventDefault(); const p=$("#pass").value.trim();
    try { const d = await unlock(p, enc); store.set("trip-pass", p); start(d); } catch(err){ lockScreen(enc, "That passcode didn't work. Check it with Praneeth and try again."); } });
}
