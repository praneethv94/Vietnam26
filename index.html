/* ===== Street look (default): Hội An yellow walls + Hanoi enamel street signs. Night = navy with lantern red. ===== */
html.street{--wall:#f2c94c;--b:#1f4e9a;--b-ink:#fff;--lan:#c62a2a;--sign:"Barlow Condensed","Arial Narrow",sans-serif;
  --bg:#edf2f9;--surface:#ffffff;--ink:#1d1a14;--muted:#5e5646;--line:#d3dfee;--jade:#1f4e9a;--jade-soft:#e3ebf7;--saffron:#c62a2a;--saffron-soft:#fbe3df;
  --hero:#1f4e9a;--hero-ink:#fff;--ok:#2a7148;--ok-soft:#dff0e5;--todo:#1d1a14;--todo-soft:#f2c94c;--maybe:#5e5646;--maybe-soft:#efe6cf;--r-ink:#b3261e;
  --display:"Be Vietnam Pro",-apple-system,system-ui,sans-serif;--body:"Be Vietnam Pro",-apple-system,system-ui,sans-serif;--wall-ink:#4c4330}
html.street[data-theme="dark"]{--wall:#0d1830;--b:#2b5cb0;--lan:#d93a2e;--bg:#0d1830;--surface:#13213d;--ink:#f6efe0;--muted:#b9c3d6;--line:#26365a;
  --jade:#9dbcf2;--jade-soft:#1b2d52;--saffron:#ff8a7a;--saffron-soft:#3a1c22;--hero:#13213d;--ok:#7fd0a0;--ok-soft:#173022;--todo:#0d1830;--todo-soft:#f2c94c;
  --maybe:#b9c3d6;--maybe-soft:#1b2d52;--r-ink:#ff8a7a;--wall-ink:#b9c3d6;color-scheme:dark}
html.street body{font-family:var(--body)}
html.street header.top{background:var(--wall);border-bottom:0}
html.street body::before{background:var(--wall)}
html.street .brand{font:800 26px/1 var(--sign);letter-spacing:.01em;text-transform:uppercase}
html.street .brand span{background:var(--b);color:#fff;transform:none;border-radius:5px;padding:1px 6px 0;box-shadow:inset 0 0 0 1.5px var(--b),inset 0 0 0 3px #fff;margin-left:4px}
html.street header.top .sub{font:700 13px var(--body);color:var(--wall-ink)}
html.street h2{font:800 34px/1 var(--sign);text-transform:uppercase;letter-spacing:.01em;margin-top:12px}
html.street h3{font:800 17px/1.2 var(--body);letter-spacing:-.01em;text-transform:none;color:var(--ink);margin-top:12px}
html.street h3::before{content:none}
html.street .card,html.street details.day{border:2px solid var(--line);box-shadow:none;border-radius:10px}
html.street details.day.is-today{border-color:var(--b);box-shadow:none}
html.street a.card:active{transform:scale(.98);box-shadow:none}
html.street .btn{background:var(--surface);color:var(--b);border:0;box-shadow:inset 0 0 0 2px var(--b);border-radius:8px;min-height:44px;font:700 14.5px var(--body);justify-content:center}
html.street[data-theme="dark"] .btn{color:#cfe0ff;box-shadow:inset 0 0 0 2px #5b82c9}
html.street .btn.solid{background:var(--b);color:#fff;box-shadow:none}
html.street .btn:active{transform:scale(.97);box-shadow:inset 0 0 0 2px var(--b)}
html.street .btn.solid:active{box-shadow:none}
html.street .seg{background:transparent;border:0;padding:0;gap:8px}
html.street .seg a{background:var(--surface);color:var(--ink);border-radius:7px;box-shadow:inset 0 0 0 2px var(--line);font:700 14px var(--body);padding:10px 0}
html.street .seg a[aria-current="page"]{background:var(--b);color:#fff;box-shadow:inset 0 0 0 2px var(--b),inset 0 0 0 3.5px #fff}
html.street .chip,html.street .pin{border:1.5px solid var(--line)}
html.street .chip.todo{background:#f2c94c;color:#1d1a14;border-color:#c9a53a}
html.street .note{background:#f2c94c;color:#1d1a14;border:0}
html.street .addr{border:2px dashed var(--line)}
html.street .legbar a{border:2px solid var(--line)}
html.street nav.tabs{background:var(--surface);border:2px solid var(--line);box-shadow:0 8px 24px rgb(0 0 0 / .16);border-radius:20px;left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));bottom:calc(max(env(safe-area-inset-bottom,0px) - 8px,0px) + 10px);padding:0 6px}
html.street nav.tabs .pill{display:none}
html.street nav.tabs a{color:var(--muted);font:600 12px var(--body)}
html.street nav.tabs a svg{width:24px;height:24px;stroke-width:2;transition:background-color .2s,width .2s}
html.street nav.tabs a[aria-current="page"]{color:var(--b)}
html.street[data-theme="dark"] nav.tabs a[aria-current="page"]{color:#fff}
html.street nav.tabs a[aria-current="page"] svg{background:var(--b);color:#fff;border-radius:7px;width:46px;height:30px;padding:3px 11px;box-sizing:border-box}
html.street .bounty-c,html.street .card.bounty-c{background:var(--b);color:#fff;border:0}
html.street .card.bounty-c .small,html.street .card.bounty-c b{color:#fff}
html.street .progress{background:var(--lan)}
html.street .bar{border:0;background:var(--line);border-radius:4px;height:8px}
html.street .bar i{background:var(--b)}
html.street .tile[aria-pressed="true"]{background:#f2c94c;color:#1d1a14}
html.street .gm-p,html.street .lb-t{font-family:var(--sign)}

/* Number plates (times), city signs */
.num{background:var(--surface);color:var(--b);border-radius:6px;padding:2.5px;display:inline-block;align-self:start;flex:none}
.num>span{display:block;border:1.5px solid var(--b);border-radius:4px;font:800 19px/1 var(--sign);padding:5px 6px 4px;min-width:54px;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap;text-transform:uppercase}
.num.big{padding:3px}.num.big>span{font-size:30px;padding:6px 8px 5px;min-width:0}
.plate{display:inline-block;justify-self:start;background:var(--city,var(--b));border-radius:10px;padding:5px;box-shadow:0 2px 0 #0003;color:#fff}
.plate .in{border:2px solid #fff;border-radius:7px;padding:4px 14px 11px;display:grid}
.plate .sm{font:600 12.5px var(--body);opacity:.92}
.plate .nm{font:800 52px/.9 var(--sign);text-transform:uppercase;letter-spacing:.01em}
.sign{display:inline-block;background:var(--city,var(--b));border-radius:7px;padding:3px;position:relative;z-index:1}
.sign>span{display:block;border:1.5px solid #fff;border-radius:5px;color:#fff;font:800 21px/1 var(--sign);text-transform:uppercase;padding:5px 10px 4px;letter-spacing:.02em}

/* Today hero: full-bleed photo slideshow */
.shero{position:relative;height:min(320px,44vh);min-height:270px;margin:-16px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;color:#fff;background:#2a2a2a;overflow:hidden}
.shero .slides,.shero .sl{position:absolute;inset:0}
.shero .sl{opacity:0;transition:opacity 1.2s ease;border-radius:0}
.shero .sl.on{opacity:1}
.shero .sl img{transform:scale(1.04);transition:transform 7s linear}
.shero .sl.on img{transform:scale(1.1)}
.shero::after{content:"";position:absolute;inset:0;background:linear-gradient(#0006,#0000 28%,#0000 42%,#000c);pointer-events:none}
.shero>.tx,.shero>.capchip{position:absolute;z-index:1}
.shero .capchip{right:12px;top:12px;font:600 12px var(--body);background:#000a;padding:4px 9px;border-radius:20px;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shero .tx{left:16px;right:16px;bottom:14px;display:grid}
.shero .d{font:600 14px var(--body);margin:0 0 6px 2px;text-shadow:0 1px 3px #0008}
.shero .t{font:700 19px/1.25 var(--body);margin:8px 0 0 2px;text-shadow:0 1px 3px #0008;text-wrap:balance}
.shero .sdots{display:flex;gap:8px;margin:10px 0 0 2px}.shero .sdots i{width:6px;height:6px;border-radius:3px;background:#fff8;transition:transform .35s cubic-bezier(.2,.8,.2,1),background-color .35s;transform-origin:left}.shero .sdots i.on{background:#fff;transform:scaleX(1.6)}.shero .sdots i.on+i{margin-left:4px}
@media (prefers-reduced-motion: reduce){.shero .sl,.shero .sl img{transition:none;transform:none}}

/* Today: the yellow wall with now and next */
.swall{background:var(--wall);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:14px max(16px,env(safe-area-inset-left,0px)) 12px;display:grid}
html.street main .wrap>.swall{margin-top:-16px}
.nowc{background:var(--b);color:#fff;border-radius:10px;padding:14px 14px 14px 16px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;margin-bottom:8px}
.nowc .k{font:600 13px var(--body);color:#d6e2f6;display:block;margin-bottom:2px}
.nowc b{font:700 18px/1.25 var(--body);display:block}
.nowc .num{background:#fff}
.nx{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:10px 0;border-top:2px solid #0000001a;align-items:center;color:#1d1a14}
.nx b{font:600 16px/1.3 var(--body);display:block}.nx small{font-size:13px;color:#4c4330}
.lan{display:inline-flex;align-items:center;gap:4px;font:700 12.5px var(--body);color:#a3201d;margin-right:4px}
.lan::before{content:"";width:9px;height:11px;border-radius:50%/45%;background:currentColor}
.swall .wnbar{margin:8px 0 2px}.swall .wnbar .btn{flex:1}
.pullhint{font:600 12.5px var(--body);color:#4c4330;text-align:center;margin:4px 0 -4px;opacity:.8}
html.street[data-theme="dark"] .swall{background:#0d1830;color:var(--ink);border-bottom:2px solid var(--line)}
html.street[data-theme="dark"] .nowc{background:var(--lan)}
html.street[data-theme="dark"] .nowc .k{color:#ffe1dc}
html.street[data-theme="dark"] .nowc .num>span{color:var(--lan);border-color:var(--lan)}
html.street[data-theme="dark"] .nx{color:var(--ink);border-top-color:#ffffff1f}
html.street[data-theme="dark"] .nx small,html.street[data-theme="dark"] .pullhint{color:#b9c3d6}
html.street[data-theme="dark"] .num{background:#0d1830}
html.street[data-theme="dark"] .num>span{border-color:#8fb0ea;color:#cfe0ff}
html.street[data-theme="dark"] .lan{color:#ff8a7a}
html.street[data-theme="dark"] .lan::before{box-shadow:0 0 8px #ff6a5c}
html.street[data-theme="dark"] .swall .btn:not(.solid){background:transparent}

.facts3{display:grid;grid-template-columns:repeat(3,1fr);border-top:2px solid var(--line);border-bottom:2px solid var(--line)}
.facts3>*{padding:9px 0 9px 10px;min-width:0;text-align:left;background:none;border:0;color:inherit;font:inherit}
.facts3>*+*{border-left:2px solid var(--line)}.facts3>:first-child{padding-left:0}
.facts3 small{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.facts3 b{font:800 19px var(--body);letter-spacing:-.02em;display:block;white-space:nowrap}
.rainbar{background:var(--saffron-soft);border-radius:10px;padding:12px 14px}
.rainbar .rainplan{margin:0;border:0;padding:0;background:none}

/* Plan: the route */
.ptop{display:grid;gap:8px}
.ptop .prog{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.ptop .prog i{display:block;height:100%;background:var(--b);border-radius:4px}
.ptop .pl{font:600 13.5px var(--body);color:var(--muted)}
.route2{position:relative;display:grid;gap:8px}
.route2::before{content:"";position:absolute;left:27px;top:30px;bottom:30px;border-left:3px dotted var(--b);opacity:.7}
.route2 .grp{display:grid;gap:8px}
.route2 .grp>.sign{justify-self:start;margin-top:8px}
html.street .route2 details.day{border:0;background:transparent;border-radius:10px;overflow:visible}
html.street .route2 details.day[open]{background:var(--surface);box-shadow:inset 0 0 0 2px var(--line)}
html.street .route2 details.day summary{grid-template-columns:54px 1fr 68px;padding:6px 0}
html.street .route2 details.day[open] summary{padding:6px 8px 6px 0}
html.street .route2 .thumb{width:68px;height:60px;border-radius:6px;border:0}
html.street details.day .date{background:var(--surface);color:var(--b);border-radius:7px;padding:5px 0;width:54px;box-shadow:inset 0 0 0 2px var(--b);position:relative;z-index:1;gap:1px}
html.street details.day .date .dnum{font:800 25px/1 var(--sign)}
html.street details.day .date .dow,html.street details.day .date .mon{font:600 11.5px var(--body);color:inherit;letter-spacing:0;text-transform:none}
html.street details.day .date .mon{display:none}
html.street details.day.is-today .date{background:var(--lan);color:#fff;box-shadow:inset 0 0 0 2px var(--lan),inset 0 0 0 3.5px #fff}
html.street[data-theme="dark"] details.day .date{background:#0d1830;color:#cfe0ff;box-shadow:inset 0 0 0 2px #8fb0ea}
html.street[data-theme="dark"] details.day.is-today .date{background:var(--lan);color:#fff;box-shadow:inset 0 0 0 2px var(--lan),inset 0 0 0 3.5px #fff}
html.street .sumtext .place{font:600 12.5px var(--body);color:var(--muted);text-transform:none;letter-spacing:0}
html.street .sumtext .title{font:700 16px/1.25 var(--body)}
html.street details.day.is-today .sumtext .place{color:var(--r-ink);font-weight:700}
html.street .route2 details.day.past .sumtext .title{color:var(--muted)}
.dstamp{display:inline-flex;align-items:center;gap:8px;margin-top:4px;font:800 12px/1 var(--sign);letter-spacing:.06em;text-transform:uppercase;color:var(--r-ink);border:2px solid currentColor;border-radius:5px;padding:4px 7px 3px;transform:rotate(-2.5deg);opacity:.9}
html.street .daybody{padding:0 12px 12px}

/* Explore tiles */
.xgrid{display:grid;grid-template-columns:1fr 1fr;grid-auto-flow:dense;gap:12px;grid-auto-rows:minmax(112px,auto)}
.xt{border-radius:10px;padding:12px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;text-decoration:none;color:var(--ink);background:var(--surface);box-shadow:inset 0 0 0 2px var(--line);border:0;text-align:left;font:inherit}
.xt b{font:800 19px/1.12 var(--body);letter-spacing:-.02em}.xt small{font:600 12.5px/1.3 var(--body);display:block;margin-bottom:2px}
.xt.wide{grid-column:1/-1;min-height:150px}
.xt.ph1{color:#fff;box-shadow:none;background:#333}.xt.ph1 .ph{position:absolute;inset:0;border-radius:0}
.xt.ph1::before{content:"";position:absolute;inset:0;background:linear-gradient(#0000 30%,#000c);z-index:1}.xt.ph1>:not(.ph){position:relative;z-index:2}
.xt.y{background:var(--wall);color:#1d1a14;box-shadow:none;grid-row:span 2;justify-content:space-between}
.xt.y p{font:600 16px/1.4 var(--body);margin:8px 0}
.xt.y .more{font:700 13.5px var(--body);color:#1f4e9a;background:none;border:0;padding:8px 0 0;text-align:left;min-height:44px}
.xt.b{background:var(--b);color:#fff;box-shadow:none}.xt.r{background:var(--lan);color:#fff;box-shadow:none}
.xt .big{position:absolute;top:8px;right:12px;font:800 32px/1 var(--sign);opacity:.95}
html.street[data-theme="dark"] .xt.y{background:#f2c94c}
html.street[data-theme="dark"] .tlbar{background:#060d1c;box-shadow:inset 0 0 0 2px var(--line)}

/* Leaderboard: lanterns */
.lstring{position:relative;height:210px;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));background:var(--wall)}
.lstring svg.wire{position:absolute;inset:0;width:100%;height:100%}
.lstring .ln{position:absolute;display:grid;justify-items:center;text-align:center;transform:translateX(-50%);transform-origin:50% 0}
.ln .cord{width:2px;background:#5a3d1a}
.ln .bod{background:var(--lan);border-radius:50%/42%;display:grid;place-items:center;color:#fff;font:800 22px/1 var(--sign);position:relative;box-shadow:inset -8px 0 0 #0002}
.ln .bod::before,.ln .bod::after{content:"";position:absolute;left:26%;right:26%;height:6px;background:#7a1a1a;border-radius:2px}
.ln .bod::before{top:-4px}.ln .bod::after{bottom:-4px}
.ln .tas{width:2px;height:14px;background:#7a1a1a}
.ln .nm{font:700 14px var(--body);margin-top:2px;color:#1d1a14}
.ln.me .bod{background:var(--b)}.ln.me .bod::before,.ln.me .bod::after,.ln.me .tas{background:#123366}
html.street[data-theme="dark"] .lstring{background:#0d1830}
html.street[data-theme="dark"] .ln .nm{color:#f6efe0}
html.street[data-theme="dark"] .ln .cord{background:#8a7350}
html.street[data-theme="dark"] .ln .bod{background:radial-gradient(circle at 45% 40%,#ffb36b,#e0442f 55%,#a5231b);box-shadow:0 0 22px 4px #ff6a3d66,0 0 60px 10px #ff6a3d22}
html.street[data-theme="dark"] .ln.me .bod{background:radial-gradient(circle at 45% 40%,#bcd6ff,#3d74d6 55%,#1f4e9a);box-shadow:0 0 22px 4px #5b9bff66}
html.street[data-theme="dark"] .ln{animation:sway 4.5s ease-in-out infinite alternate}
html.street[data-theme="dark"] .ln:nth-child(2n){animation-duration:5.3s;animation-delay:-1.4s}
@keyframes sway{from{transform:translateX(-50%) rotate(-3deg)}to{transform:translateX(-50%) rotate(3deg)}}
@media (prefers-reduced-motion: reduce){html.street[data-theme="dark"] .ln{animation:none}}
.lb-head{background:var(--wall);margin:-16px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;padding:6px max(16px,env(safe-area-inset-left,0px)) 0}
.lb-head h2{margin:0}
.lb-head .live-st{margin:4px 0 0;color:var(--wall-ink)}
.feed>div{display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:center;padding:8px 0;border-bottom:2px solid var(--line)}
.feed>div:last-child{border-bottom:0}
.feed p{margin:0;font-size:14.5px;line-height:1.3}.feed em{font:600 12.5px var(--body);color:var(--muted);font-style:normal;text-align:right;white-space:nowrap}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:800 14px var(--body);background:var(--line);color:var(--ink)}
.av.me{background:var(--b);color:#fff}
.mine{display:flex;gap:4px 12px;align-items:baseline;flex-wrap:wrap;font-size:14px}.mine>span{color:var(--muted);margin-right:auto}.mine b{font-weight:700}.mine .tot{color:var(--b);font:800 22px var(--sign)}
html.street[data-theme="dark"] .mine .tot{color:#cfe0ff}

/* Next stop sheet, Carry sheet */
.ns-k{font:700 13px var(--body);color:var(--muted)}
.ns-move{display:flex;gap:8px;align-items:center;font:600 14px var(--body)}
.ns-move svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;flex:none}

/* Driver card in street-sign style */
html.street .driver{background:var(--b);color:#fff;padding:max(28px,env(safe-area-inset-top,0px)) 18px 28px}
html.street .driver::before{content:"";position:absolute;inset:max(14px,env(safe-area-inset-top,0px)) 12px 14px;border:4px solid #fff;border-radius:16px;pointer-events:none}
html.street .driver .big{font:800 clamp(38px,12vw,64px)/1.02 var(--sign);text-transform:uppercase;letter-spacing:.01em}
html.street .driver .sm{color:#e3ebf7;font:600 19px/1.35 var(--body)}
html.street .driver .hint{color:#c9d8f2}
html.street .driver .play{background:#fff;color:var(--b);font-weight:700}

/* Info plates */
.iplates{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.iplate{display:grid;gap:2px;text-align:left;background:var(--surface);color:var(--ink);border:0;border-radius:8px;padding:10px 12px;box-shadow:inset 0 0 0 2px var(--b);font:inherit;min-height:56px;text-decoration:none}
.iplate small{font:600 12px/1.25 var(--body);color:var(--muted)}
.iplate b{font:800 22px/1.05 var(--sign);color:var(--b);letter-spacing:.01em;word-break:break-word}
.iplate.wide{grid-column:1/-1}
.iplate.sos{background:var(--lan);box-shadow:none}.iplate.sos small{color:#ffe1dc}.iplate.sos b{color:#fff;font-size:28px}
html.street[data-theme="dark"] .iplate{box-shadow:inset 0 0 0 2px #5b82c9}
html.street[data-theme="dark"] .iplate b{color:#cfe0ff}
html.street[data-theme="dark"] .iplate.sos{box-shadow:none}html.street[data-theme="dark"] .iplate.sos b{color:#fff}

/* Recap: split-flap board */
.flap{background:#15130f;border-radius:12px;padding:12px;display:grid;gap:8px;color:#f6efe0}
.flap .fr{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.flap .tiles{display:flex;gap:4px;flex-wrap:wrap}
.flap .tiles i,.flap .rk i,.flap .pts i{font:800 22px/1 var(--sign);font-style:normal;width:20px;height:30px;display:grid;place-items:center;background:#2a2620;border-radius:3px;position:relative;color:#f2c94c;text-transform:uppercase}
.flap .tiles i::after,.flap .rk i::after,.flap .pts i::after{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px solid #0009}
.flap .tiles i.s::after{display:none}
.flap .rk{display:flex}.flap .pts{display:flex;gap:2px}

.flap .fr.flip i{animation:flipin .5s var(--ease,ease) both}
@keyframes flipin{0%{transform:rotateX(90deg);color:#f6efe0}100%{transform:none}}
.flap .fr.win .tiles i,.flap .fr.win .pts i{background:var(--lan);color:#fff}
.rcol{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rcol .hi{aspect-ratio:1;border-radius:6px;background:var(--line);overflow:hidden;display:grid;place-items:center;font:700 11.5px var(--body);color:var(--muted);text-align:center;padding:4px}
.rcol .hi img{width:100%;height:100%;object-fit:cover}
.moments{display:grid;gap:8px}.moments>div{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
#raintop:empty{display:none}
/* Postcard leftovers, re-dressed for the street look */
html.street .pass{box-shadow:none;border-radius:12px}
html.street .pass-top{background:var(--b)}
html.street .pass-route b{font:800 40px/1 var(--sign);letter-spacing:.01em}
html.street .pass-plane{color:var(--b)}
html.street .pass-foot span:first-child{background:#f2c94c;color:#1d1a14}
html.street .ph{background:var(--line)}
html.street .ph.thumb.none::before{content:"";}
html.street .lookbtns button[aria-pressed="true"],html.street .chipbtn[aria-pressed="true"]{background:var(--b);color:#fff}
html.street .jl li.on{border-left-color:var(--lan)}html.street .jl li.on b{color:var(--r-ink)}
html.street .map{box-shadow:none;border-radius:12px}
html.street .mpin span{background:var(--lan);border-color:#fff;box-shadow:0 1px 3px #0006}
html.street .pinnum{background:#f2c94c!important}
html.street .tsize button{border-radius:8px}
html.street .hero{border-radius:12px}
html.street .pin.listen{background:#f2c94c;color:#1d1a14}
html.street .gcard,html.street .gcard.closest{box-shadow:none}html.street .gcard.closest{border-color:var(--b)}
html.street .bigplay{background:var(--b);border:0;box-shadow:none}
html.street .speaking{background:#f2c94c;color:#1d1a14;box-shadow:-6px 0 0 #f2c94c,6px 0 0 #f2c94c}
html.street .mp .in{border:2px solid var(--line);box-shadow:0 4px 16px #0002}
html.street .mp button.pp{background:var(--b)}
.lb-back{display:inline-flex;align-items:center;min-height:44px;font:700 14.5px var(--body);color:var(--b);text-decoration:none}
html.street[data-theme="dark"] .lb-back{color:#cfe0ff}
html.street[data-theme="dark"] .nowc .num{background:#fff}
.flap .fr.hid .tiles i,.flap .fr.hid .pts i{color:transparent!important;background:#2a2620!important}
html.street .pin{min-height:40px}
html.street .seg a{padding:12px 0}
html.street details.day .date .dow,html.street .chip{font-size:12px}
html.street .tl li.now{background:var(--jade-soft);color:var(--ink)}
html.street .tl li.now .w,html.street .tl li.now .t{color:var(--ink)}
html.street .tl li.now .t{color:var(--b);font-weight:700}
html.street[data-theme="dark"] .tl li.now .t{color:#cfe0ff}
html.street[data-theme="dark"] .nowc .k{color:#fff}
.iplate.sos small{color:#fff!important}
.todo{padding:4px 14px}
.todo-r{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:start;padding:12px 0;border-bottom:2px solid var(--line);cursor:pointer}
.todo-r:last-child{border-bottom:0}
.todo-r input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--b)}
.todo-r b{display:block;font:700 15px/1.3 var(--body)}.todo-r small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.todo-r em{grid-column:2/4;font:600 12.5px var(--body);font-style:normal;color:var(--muted)}
.todo-r .num>span{min-width:0;font-size:16px;padding:4px 7px 3px}
.todo-r.soon .num{background:var(--lan)}.todo-r.soon .num>span{color:#fff;border-color:#fff}
.todo-r.soon em{color:var(--r-ink)}
.todo-r.done b{text-decoration:line-through;color:var(--muted)}.todo-r.done .num{opacity:.6}
.sv-h{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}
.sv-h b{display:block;font:700 17px/1.25 var(--display)}.sv-h .vi{display:block;font-size:13.5px;color:var(--muted);margin-top:2px}
.sv p{margin:8px 0 6px;font-size:14.5px;line-height:1.45}
.sv-row{display:grid;grid-template-columns:78px 1fr;gap:8px;font-size:13.5px;padding:3px 0}
.sv .num>span{font-size:17px;min-width:0;padding:4px 7px 3px}
/* Timeline: pinned year dial */
.tlx-top{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr,50px));z-index:3;height:max(250px,36vh);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));overflow:hidden;color:#fff;background:#1d1a14}
.tlx-top .ph{position:absolute;inset:0;border-radius:0;opacity:0;transition:opacity .8s ease}
.tlx-top .ph.on{opacity:1}
.tlx-top .ph img{transform:scale(1.04);transition:transform 6s linear}.tlx-top .ph.on img{transform:scale(1.12)}
.tlx-top::after{content:"";position:absolute;inset:0;background:linear-gradient(#0006,#0000 30%,#000d);pointer-events:none}
.tlx-top .dial{position:absolute;left:16px;right:16px;bottom:20px;z-index:2}
.tlx-top small{font:700 13px var(--body);opacity:.9;display:block;margin-bottom:4px}
.tlx-top .year{font:800 76px/.85 var(--sign);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:clip}
.tlx-top .ttl{font:700 19px/1.25 var(--body);margin-top:8px;min-height:24px;text-shadow:0 1px 3px #0008}
.tlx-top .rail{position:absolute;left:16px;right:16px;bottom:8px;height:4px;background:#ffffff33;border-radius:2px;z-index:2}
.tlx-top .rail i{display:block;height:100%;width:100%;background:#f2c94c;border-radius:2px;transform:scaleX(0);transform-origin:left;will-change:transform}
ol.tlx{list-style:none;margin:0;padding:6px 0 0 40px;position:relative}
ol.tlx::before{content:"";position:absolute;left:13px;top:0;bottom:0;border-left:3px dotted var(--b);opacity:.7}
ol.tlx li{position:relative;padding:16px 0 22px;opacity:.28;transform:translateY(28px);transition:opacity .5s,transform .6s cubic-bezier(.2,.8,.2,1)}
ol.tlx li.seen{opacity:.6;transform:none}ol.tlx li.on{opacity:1}
ol.tlx li::before{content:"";position:absolute;left:-34px;top:21px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:3px solid var(--b);transition:background .3s,border-color .3s,transform .3s}
ol.tlx li.on::before{background:var(--lan);border-color:var(--lan);transform:scale(1.3)}
ol.tlx .y{font:800 15px var(--sign);color:var(--b);letter-spacing:.04em;text-transform:uppercase}
html.street[data-theme="dark"] ol.tlx .y{color:#9dbcf2}
ol.tlx b{display:block;font:700 19px/1.25 var(--body);margin:2px 0 6px}ol.tlx p{margin:0;color:var(--ink);opacity:.85;line-height:1.5}
ol.tlx a{display:inline-block;margin-top:8px}
.tlx-end{padding:8px 0 30vh}
@media (prefers-reduced-motion: reduce){ol.tlx li{opacity:1;transform:none}}

html.street .shopseg{margin-top:12px}html.street .shopseg{display:flex}html.street .shopseg a{flex:1 1 auto;font-size:13px;padding:11px 7px;white-space:nowrap}
.hright{display:flex;align-items:center;gap:12px}
.srchbtn{display:grid;place-items:center;width:40px;height:40px;margin:-8px -8px -8px 0;border:0;background:transparent;color:inherit;border-radius:10px;cursor:pointer}
html.street .srchbtn{color:#1f4e9a}
html.street[data-theme="dark"] .srchbtn{color:#f2c94c}
#srch{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);animation:srin .18s ease-out}
@keyframes srin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.srch-bar{display:flex;gap:8px;padding:12px 16px;border-bottom:2px solid var(--line)}
.srch-bar input{flex:1;min-width:0;font:600 17px var(--body,inherit);padding:11px 14px;border-radius:10px;border:2px solid var(--b,#1f4e9a);background:var(--surface);color:var(--ink)}
.srch-r{flex:1;overflow-y:auto;padding:8px 16px calc(env(safe-area-inset-bottom,0px) + 24px);-webkit-overflow-scrolling:touch}
.srch-hit{display:block;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:0;box-shadow:inset 0 0 0 2px var(--line);border-radius:10px;padding:11px 13px;margin:8px 0;font:inherit;cursor:pointer}
.srch-hit small{display:block;font-weight:700;font-size:12px;color:var(--b,#1f4e9a);margin-bottom:4px}
html.street[data-theme="dark"] .srch-hit small{color:#f2c94c}
.srch-hit span{font-size:14px;line-height:1.4}
.srch-hit mark{background:#f2c94c;color:#1a1a1a;border-radius:3px;padding:0 1px}
body.srch-on{overflow:hidden}body.srch-on nav.tabs{display:none}
.srch-flash{animation:srflash 3.2s ease-out}
@keyframes srflash{0%,60%{box-shadow:0 0 0 4px #f2c94c}100%{box-shadow:0 0 0 0 transparent}}

/* Plan: stats, route strip, city banners, travel hops */
.pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pstats>div{background:var(--surface);border-radius:10px;box-shadow:inset 0 0 0 2px var(--line);padding:9px 12px 8px}
.pstats b{display:block;font:800 28px/1 var(--sign);color:var(--b)}
.pstats small{font:600 12px var(--body);color:var(--muted)}
.pstats .warn b{color:var(--lan)}
html.street[data-theme="dark"] .pstats b{color:#f2c94c}html.street[data-theme="dark"] .pstats .warn b{color:var(--r-ink)}
.tstrip{display:flex;gap:4px;margin-top:4px}
.seg2{min-width:0;display:grid;gap:4px;flex-basis:auto}
.seg2 i{display:block;height:10px;border-radius:3px;background:var(--city)}
.seg2 span{font:700 11px var(--body);white-space:nowrap}
.seg2 small{font:600 11px var(--body);color:var(--muted);margin-top:-3px}
.seg2.done i{opacity:.35}.seg2.on i{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--city)}
.route2::before{display:none}
.route2 .grp{position:relative}
.route2 .grp::before{content:"";position:absolute;left:27px;top:20px;bottom:30px;border-left:3px dotted var(--b);opacity:.6}
.cban{position:relative;height:118px;border-radius:12px;overflow:hidden;background:var(--city);margin-top:4px;box-shadow:inset 0 0 0 2px var(--city)}
.cban .ph{position:absolute;inset:0;background-size:cover;background-position:center;border-radius:0}
.cban::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgb(0 0 0 / 0) 30%,rgb(0 0 0 / .62));pointer-events:none}
.cban-in{position:absolute;left:12px;right:12px;bottom:11px;z-index:1;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.cban-in .sign{margin:0}
.cban-r{text-align:right;color:#fff;text-shadow:0 1px 3px rgb(0 0 0 / .5);min-width:0}
.cban-r b{display:block;font:800 20px/1 var(--sign);letter-spacing:.02em}
.cban-r small{display:block;font:600 12px/1.3 var(--body);opacity:.95;margin-top:4px}
.hop2{position:relative;z-index:1;display:flex;align-items:center;gap:12px;margin:6px 0 2px;padding:9px 12px;border-radius:10px;background:var(--surface);box-shadow:inset 0 0 0 2px var(--line);font:600 13px/1.35 var(--body)}
.hop2 .ic{font-size:17px;flex:none}
.hop2 b{color:var(--b);white-space:nowrap}
html.street[data-theme="dark"] .hop2 b{color:#f2c94c}
.hop2 em{margin-left:auto;flex:none;font:800 11px var(--body);font-style:normal;color:#fff;background:var(--lan);border-radius:5px;padding:3px 7px}
.dmeta{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.dmeta span{font:700 11.5px/1 var(--body);padding:4px 7px;border-radius:5px;background:var(--line);color:var(--ink)}
.dmeta .ok{background:#d9eedd;color:#1c5a2e}.dmeta .td{background:#fbe0dc;color:#9b1c12}
html.street[data-theme="dark"] .dmeta span{background:#1b2d52;color:#cfe0ff}html.street[data-theme="dark"] .dmeta .ok{background:#163d26;color:#9fe0b4}html.street[data-theme="dark"] .dmeta .td{background:#4a1a17;color:#ffb3a8}
html.street .route2 .thumb{width:76px;height:66px;border-radius:8px}
html.street .route2 details.day summary{grid-template-columns:54px 1fr 76px}
.cban-in .sign{white-space:nowrap;flex:none}

/* Plan A3: story circles, city banner, day cards, day page */
.pcircs{display:flex;gap:12px;overflow-x:auto;margin:6px -16px 0;padding:8px 16px 6px;scrollbar-width:none}.pcircs::-webkit-scrollbar{display:none}
.pcirc{flex:none;width:72px;border:0;background:none;padding:0;text-align:center;color:var(--ink);cursor:pointer;font:inherit}
.pcirc i{display:block;width:68px;height:68px;margin:0 auto;border-radius:50%;background:#ccc center/cover;box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--city);transition:box-shadow .2s,transform .2s}
.pcirc.on i{box-shadow:0 0 0 3px var(--bg),0 0 0 6.5px var(--city),0 6px 14px rgb(0 0 0 / .22);transform:scale(1.04)}
.pcirc b{display:block;font:800 14px/1.1 var(--sign);text-transform:uppercase;margin-top:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcirc small{display:block;font:600 10.5px var(--body);color:var(--muted);white-space:nowrap}
.pcirc:not(.on){opacity:.78}.pcirc.done i{filter:grayscale(.6)}
.pcirc{position:relative}.pcirc.now::before{content:"";position:absolute;left:50%;top:0;width:68px;height:68px;margin-left:-34px;border-radius:50%;border:2.5px solid var(--city);animation:pring 2.4s cubic-bezier(.2,.7,.3,1) infinite;pointer-events:none}
@keyframes pring{from{transform:scale(1.05);opacity:.7}to{transform:scale(1.35);opacity:0}}
.phero{position:relative;height:150px;border-radius:16px;overflow:hidden;margin:10px 0 6px;background:var(--city)}
.phero .ph{position:absolute;inset:0;background-size:cover;background-position:center;border-radius:0}
.phero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgb(0 0 0 / .68),rgb(0 0 0 / .15) 75%)}
.phero-in{position:absolute;left:14px;right:14px;bottom:13px;z-index:1;color:#fff}
.phero-in b{display:block;font:800 42px/1 var(--sign);text-transform:uppercase;letter-spacing:.01em}
.phero-in small{display:block;font:600 13px/1.35 var(--body);margin:3px 0 7px;opacity:.95}
.ptodo{display:inline-block;font:800 11.5px/1 var(--body);background:#fbe0dc;color:#9b1c12;border-radius:5px;padding:4px 7px}.ptodo.ok{background:#d9eedd;color:#1c5a2e}
.pl{margin:0 0 10px}
.pdays{display:grid;gap:12px}
.pday{display:grid;grid-template-columns:100px 1fr;min-height:128px;background:var(--surface);border-radius:14px;overflow:hidden;box-shadow:inset 0 0 0 2px var(--line);text-decoration:none;color:var(--ink);transition:transform .15s}
.pday:active{transform:scale(.985)}
.pimg{position:relative;background:var(--city);min-height:100%}.pimg>.ph{position:absolute;inset:0;background-size:cover;background-position:center;border-radius:0}
.pdate{position:absolute;left:8px;top:8px;background:#fff;color:var(--city);border-radius:8px;text-align:center;padding:4px 8px 3px;font:700 10.5px var(--body);box-shadow:0 2px 6px rgb(0 0 0 / .2)}
.pdate b{display:block;font:800 24px/1 var(--sign)}
.pday-x{padding:11px 12px 12px;min-width:0}
.pday .pt{display:block;font:800 15.5px/1.25 var(--body);margin-bottom:2px}
.pday .pp{display:block;font:600 11.5px var(--body);color:var(--muted)}
.pday ul{list-style:none;margin:6px 0 8px;padding:0;display:grid;gap:4px}
.pday li{font:500 12.5px/1.35 var(--body);color:var(--ink);opacity:.85;display:flex;gap:8px}.pday li i{font-style:normal;flex:none;width:16px;text-align:center}
.pday .pill{font:700 11.5px/1 var(--body);padding:4px 7px;border-radius:5px;display:inline-block}
.pday .pill.td,.dhero .pill.td{background:#fbe0dc;color:#9b1c12}.pday .pill.ok,.dhero .pill.ok{background:#d9eedd;color:#1c5a2e}
.pday.is-today{box-shadow:inset 0 0 0 3px var(--lan)}.pday.is-today .pdate{background:var(--lan);color:#fff}
.pday.past{opacity:.7}.pday .dstamp{margin-top:0}
html.street[data-theme="dark"] .pday li{opacity:.9}
/* Day page */
.dpage{margin:-14px -16px 0}
.dhero{position:relative;height:260px;overflow:hidden;background:var(--city)}
.dhero .ph{position:absolute;inset:0;background-size:cover;background-position:center;border-radius:0}
.dhero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgb(0 0 0 / .3),transparent 35%,rgb(0 0 0 / .78))}
.dback{position:absolute;left:14px;top:14px;z-index:2;background:rgb(255 255 255 / .94);color:#1f4e9a;border-radius:10px;padding:9px 13px;font:700 14px var(--body);text-decoration:none}
.dhero-in{position:absolute;left:16px;right:16px;bottom:16px;z-index:1;color:#fff}
.dhero-in small{font:800 14px var(--sign);letter-spacing:.12em}
.dhero-in b{display:block;font:800 26px/1.15 var(--body);margin:4px 0 8px;letter-spacing:-.01em}
.dhero .pill{font:700 12px/1 var(--body);padding:5px 8px;border-radius:5px;display:inline-block;background:rgb(255 255 255 / .92);color:#1d1a16}
.dpage details.day{margin:0;border:0!important;box-shadow:none!important;background:transparent!important}
.dpage details.day>summary{display:none}
.dpage details.day .daybody{padding:6px 16px 0}
.dpage details.day .daybody>.ph.banner{display:none}
.dnav{display:flex;justify-content:space-between;gap:12px;padding:16px 16px 0}

/* Plan: one list, sticky city circles */



html.street[data-theme="dark"] .pcirc.on i{box-shadow:0 0 0 3px var(--bg),0 0 0 6.5px var(--city),0 6px 14px rgb(0 0 0 / .22)}
.psecs{display:grid;gap:4px}.psec{display:grid;gap:12px;margin-bottom:8px}
.psec .phero{margin:6px 0 0}.psec .hop2{margin:10px 0 -2px}
.pback{display:flex;align-items:center;gap:12px;margin-top:8px}.pback small{font:600 12.5px var(--body);color:var(--muted)}
.pwx{position:absolute;right:10px;top:10px;z-index:1;display:grid;grid-template-columns:auto auto;align-items:center;gap:0 8px;background:rgb(255 255 255 / .92);color:#1d1a16;border-radius:10px;padding:6px 9px;max-width:150px}
.pwx span{grid-row:span 2;font-size:22px;line-height:1}.pwx b{font:800 18px/1 var(--sign)}.pwx small{font:600 11px var(--body);color:#5b5446;grid-column:2}
.pwx em{grid-column:1/-1;font:600 10.5px/1.25 var(--body);font-style:normal;color:#4a443a;margin-top:4px}

/* Slim city bar: always laid out, slid in with transform so scrolling never reflows */

/* Plan ↔ day: a short, GPU-only slide like an iOS push and pop */
#view[data-anim="push"]{animation:pushin .3s cubic-bezier(.22,.9,.3,1) both}

@keyframes pushin{from{opacity:.4;transform:translate3d(36px,0,0)}to{opacity:1;transform:none}}
@keyframes popin{from{opacity:.5;transform:translate3d(-28px,0,0)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){#view[data-anim]{animation:none}}
@media (prefers-reduced-motion: reduce){.pmini,.pcirc.now::before{transition:none;animation:none}}

/* Glass tabs: one frosted capsule with a sliding pill (default) */
.ttabs{position:sticky}

.tlf-h{height:84px}
.tlf-stop{margin-bottom:12px}
.tlf-more{margin:2px 0 0 18px}
h2.tlf-title{font-size:26px;margin:6px 0 0}
ol.tlf{padding-left:20px}
ol.tlf li::before{left:-27px}
ol.tlf li.here::before{left:-28px}
html.street h2.tlf-title{font-size:30px;line-height:1;margin:4px 0 0}

/* History: timeline entry card */
.tlnew{position:relative;display:grid;gap:10px;margin:12px 0 4px;padding:14px 14px 12px;border-radius:18px;text-decoration:none;color:var(--ink);background:linear-gradient(135deg,rgb(242 201 76/.35),rgb(31 78 154/.12));box-shadow:inset 0 0 0 1px rgb(255 255 255/.7),0 8px 22px rgb(20 40 80/.1);-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%)}
html[data-theme="dark"] .tlnew{background:linear-gradient(135deg,rgb(242 201 76/.16),rgb(60 110 220/.18));box-shadow:inset 0 0 0 1px rgb(255 255 255/.12),0 8px 22px rgb(0 0 0/.3)}
.tln-h{display:grid;gap:1px;padding-right:30px}
.tln-h small{font:800 11.5px var(--body);letter-spacing:.08em;text-transform:uppercase;color:#a67a06}
html[data-theme="dark"] .tln-h small{color:#f2c94c}
.tln-h b{font:800 22px/1.05 var(--sign);text-transform:uppercase;letter-spacing:.01em}
.tln-h em{font:500 13px var(--body);font-style:normal;color:var(--muted)}
.tln-go{position:absolute;right:14px;top:16px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--b);color:#fff;font:700 20px/1 var(--body);box-shadow:0 4px 10px rgb(31 78 154/.3)}
.tln-route{position:relative;display:flex;justify-content:space-between}
.tln-route::before{content:"";position:absolute;left:24px;right:24px;top:23px;border-top:2px dashed color-mix(in srgb,var(--b) 45%,transparent)}
.tln-s{position:relative;display:grid;justify-items:center;gap:4px;width:20%}
.tln-s .ph{width:46px;height:46px;border-radius:50%;box-shadow:0 0 0 2.5px #fff,0 3px 8px rgb(0 0 0/.18)}
html[data-theme="dark"] .tln-s .ph{box-shadow:0 0 0 2.5px var(--surface),0 3px 8px rgb(0 0 0/.4)}
.tln-s i{font:700 11px var(--body);font-style:normal;white-space:nowrap}
.tlnew:active{transform:scale(.985)}
/* Trip timeline: travelling glass pill */
.tlf-pill{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + var(--hdr,60px) + 8px);z-index:20;display:flex;align-items:center;gap:8px;padding:7px 12px 7px 10px;border-radius:999px;transform:translate(-50%,-14px);opacity:0;pointer-events:none;transition:opacity .25s,transform .3s cubic-bezier(.2,.8,.2,1);background:rgb(255 255 255/.62);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:inset 0 0 0 1px rgb(255 255 255/.8),0 6px 18px rgb(20 40 80/.14);white-space:nowrap}
html[data-theme="dark"] .tlf-pill{background:rgb(28 40 68/.6);box-shadow:inset 0 0 0 1px rgb(255 255 255/.14),0 6px 18px rgb(0 0 0/.35)}
.tlf-pill.show{opacity:1;transform:translate(-50%,0)}
.tlf-dots{display:flex;gap:4px}
.tlf-dots i{width:6px;height:6px;border-radius:50%;background:color-mix(in srgb,var(--ink) 22%,transparent);transition:all .3s}
.tlf-dots i.past{background:#c99312}
.tlf-dots i.on{width:16px;border-radius:3px;background:#c99312}
.tlf-pill b{font:800 13px var(--body)}
.tlf-pill span#tlfyr{font:700 13px var(--sign);color:#a67a06;letter-spacing:.03em}
html[data-theme="dark"] .tlf-pill span#tlfyr{color:#f2c94c}
/* Liquid glass across Explore */
html[data-gl="1"] .hr,html[data-gl="1"] .xlook,html[data-gl="1"] .tlf-pre,html[data-gl="1"] .phrd,html[data-gl="1"] .eatfood,html[data-gl="1"] .chipbtn,html[data-gl="1"] .tld-m{background:var(--glass)!important;-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);box-shadow:var(--glass-edge),var(--glass-shadow)!important;border-color:transparent}
html[data-gl="1"] .hr{border-radius:16px}
html[data-gl="1"] .hr .ph{border-radius:12px;margin:6px 0 6px 6px;min-height:52px;height:52px;align-self:center}
html[data-gl="1"] .xlook{border-radius:16px}
html[data-gl="1"] .chipbtn[aria-pressed="true"]{background:linear-gradient(180deg,#2b63bd,#1f4e9a)!important;color:#fff!important;box-shadow:inset 0 1px 0 rgb(255 255 255/.35),0 4px 12px rgb(31 78 154/.3)!important}
html[data-gl="1"] .dyc{background:linear-gradient(135deg,rgb(242 201 76/.92),rgb(242 201 76/.72))}
html[data-gl="1"] .dyrow{box-shadow:inset 0 0 0 1px rgb(255 255 255/.55),0 10px 26px rgb(166 122 6/.18);border-radius:18px}
html[data-gl="1"] .xhero{border-radius:18px}
html[data-gl="1"] .xhero .bt i{background:rgb(255 255 255/.22);color:#fff;-webkit-backdrop-filter:blur(14px) saturate(170%);backdrop-filter:blur(14px) saturate(170%);box-shadow:inset 0 0 0 1px rgb(255 255 255/.4);border-radius:999px}
html[data-gl="1"] .xbook .ph{border-radius:16px}
html[data-gl="1"] .xbook.on .ph{box-shadow:0 0 0 3px var(--b),0 8px 18px rgb(31 78 154/.25)}
html[data-gl="1"] ol.tlf li.here .c{background:linear-gradient(160deg,rgb(242 201 76/.38),rgb(255 255 255/.55));-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);box-shadow:inset 0 0 0 1px rgb(255 255 255/.75),0 8px 20px rgb(166 122 6/.15)}
html[data-gl="1"][data-theme="dark"] ol.tlf li.here .c{background:linear-gradient(160deg,rgb(242 201 76/.18),rgb(28 40 68/.55));box-shadow:inset 0 0 0 1px rgb(255 255 255/.12)}
html[data-gl="1"] .tlf-h,html[data-gl="1"] .tile{border-radius:16px}
html[data-gl="1"] .tlf-pin{background:linear-gradient(180deg,#2b63bd,#1f4e9a);box-shadow:inset 0 1px 0 rgb(255 255 255/.3),0 3px 10px rgb(31 78 154/.3)}
.tln-h b{font-size:20px}
.dyc{min-height:0}
.dyc p{flex:0 1 auto;margin-bottom:14px}
.dyc .dkf{margin-top:auto}

/* A photo already shown on this page: a soft tinted tile instead of a repeat */
.ph.dupe{background:linear-gradient(135deg,color-mix(in srgb,var(--b) 22%,var(--surface)),color-mix(in srgb,#f2c94c 30%,var(--surface)));display:grid;place-items:center;overflow:hidden}
.ph.dupe .dupe-i{font:800 12px var(--sign);text-transform:uppercase;letter-spacing:.06em;color:color-mix(in srgb,var(--ink) 55%,transparent);padding:4px;text-align:center}

/* Bottom tabs: quick, smooth highlight (no bouncy pop) */
html.street nav.tabs a[aria-current="page"] svg{animation:tabIn .2s cubic-bezier(.2,.8,.2,1)}
html.street nav.tabs a.tmid[aria-current="page"] svg{animation:none}
@keyframes tabIn{from{transform:scale(.82);opacity:.6}to{transform:none;opacity:1}}
html.street nav.tabs a{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.fstats{flex-wrap:wrap;row-gap:6px}

/* ── Nov 5 travel-app pass ── */
/* Live flight card (Flighty style): big codes, live progress line, chips for terminal, gate, seat. */
.lflight{all:unset;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;width:100%;margin:0 0 10px;padding:14px 16px 14px;border-radius:22px;cursor:pointer;color:#fff;
  background:radial-gradient(120% 90% at 0% 0%,#2f5fb3 0%,transparent 60%),linear-gradient(160deg,#16264a,#0c1630);
  box-shadow:inset 0 0 0 1px rgb(255 255 255/.14),inset 0 1px 0 rgb(255 255 255/.22),0 14px 34px rgb(12 22 48/.35);-webkit-tap-highlight-color:transparent}
.lflight:active{transform:scale(.985)}
.lf-top{display:flex;align-items:center;gap:8px;font:700 13px var(--body)}
.lf-no{display:inline-flex;align-items:center;gap:6px;font:800 14px var(--body);letter-spacing:.02em}
.lf-no .ic2{width:16px;height:16px;color:#f2c94c}
.lf-by{color:rgb(255 255 255/.62);font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lf-st{padding:5px 10px;border-radius:999px;background:rgb(255 255 255/.14);box-shadow:inset 0 0 0 1px rgb(255 255 255/.2);font:800 12.5px var(--body);white-space:nowrap}
.t-ok .lf-st{background:#2e8b57}.t-go .lf-st{background:#da251d}.t-air .lf-st{background:#f2c94c;color:#1d1a14}.t-done .lf-st{background:rgb(255 255 255/.22)}
.lf-route{display:grid;grid-template-columns:auto minmax(44px,1fr) auto;align-items:center;gap:10px}
.lf-a{display:grid;gap:1px}.lf-a.r{text-align:right}
.lf-a b{font:800 34px/1 var(--sign,var(--body));letter-spacing:.01em}
.lf-a em{font:800 16px/1.2 var(--body);font-style:normal;color:#f2c94c}.lf-a em sup{font-size:10px;margin-left:2px;color:rgb(255 255 255/.7)}
.lf-a small{font:600 12px var(--body);color:rgb(255 255 255/.62);max-width:96px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lf-track{position:relative;height:40px;--p:0}
.lf-track i{position:absolute;top:14px;height:3px;border-radius:3px;left:0}
.lf-line{right:0;background:repeating-linear-gradient(90deg,rgb(255 255 255/.35) 0 5px,transparent 5px 10px)}
.lf-done{width:calc(var(--p)*100%);background:#f2c94c;box-shadow:0 0 10px rgb(242 201 76/.6)}
.lf-track .lf-pl{top:3px;height:auto;left:calc(var(--p)*(100% - 24px));width:24px;display:grid;place-items:center;background:none}
.lf-pl .ic2{width:24px;height:24px;color:#fff;transform:rotate(45deg);filter:drop-shadow(0 2px 4px rgb(0 0 0/.4))}
.lf-track small{position:absolute;left:0;right:0;bottom:0;text-align:center;font:700 11.5px var(--body);color:rgb(255 255 255/.62)}
.lf-sub{font:600 13.5px var(--body);color:rgb(255 255 255/.85)}
.lf-chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.lfc{display:grid;gap:1px;padding:8px 9px;border-radius:12px;background:rgb(255 255 255/.1);box-shadow:inset 0 0 0 1px rgb(255 255 255/.14)}
.lfc small{font:700 11px var(--body);color:rgb(255 255 255/.6)}.lfc b{font:800 14px/1.2 var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lfc.dim b{color:rgb(255 255 255/.55);font-weight:700;font-size:12.5px}
@media (prefers-reduced-motion: no-preference){.t-air .lf-pl{transition:left 1s ease}}

/* Live chip in the header (Live Activity style) on Plan, Stays, Explore and Info during the trip. */
header.top .brand{white-space:nowrap;flex:none}
header.top .wrap{align-items:center}
header.top .hright{flex:1 1 auto;min-width:0;justify-content:flex-end;gap:6px}
header.top .srchbtn{flex:none;margin:-8px -8px -8px 0}
#subtitle.haschip{flex:0 1 auto;min-width:0;max-width:none;display:flex;justify-content:flex-end;overflow:hidden;padding:2px 0}
#subtitle.haschip .lchip{min-width:0;margin-left:10px}
.lchip{display:inline-flex;align-items:center;gap:7px;max-width:100%;min-height:32px;padding:0 12px 0 10px;border-radius:999px;text-decoration:none;color:var(--ink);font:600 13px var(--body);
  background:rgb(255 255 255/.55);-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);box-shadow:inset 0 0 0 1px rgb(255 255 255/.7),0 4px 14px rgb(20 40 80/.12)}
.lchip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lchip b{font-weight:800}
.lchip .dot{flex:none;width:8px;height:8px;border-radius:50%;background:#2e8b57;box-shadow:0 0 0 3px rgb(46 139 87/.25)}
.lchip .ic2{flex:none;width:15px;height:15px;color:var(--b)}
@media (prefers-reduced-motion: no-preference){.lchip .dot.soon{animation:lcp 2s ease-in-out infinite}@keyframes lcp{50%{box-shadow:0 0 0 6px rgb(46 139 87/0)}}}
html[data-theme="dark"] .lchip{background:rgb(20 30 55/.6);box-shadow:inset 0 0 0 1px rgb(255 255 255/.16),0 4px 14px rgb(0 0 0/.3);color:#fff}
html[data-theme="dark"] .lchip .ic2{color:#f2c94c}

/* Trip readiness ring on Today before the trip. */
.trdy{display:grid;grid-template-columns:76px 1fr;gap:14px;align-items:center;margin:4px 0 14px;padding:14px;border-radius:20px;background:rgb(255 255 255/.6);
  -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:inset 0 0 0 1px rgb(255 255 255/.75),inset 0 1px 0 rgb(255 255 255/.9),0 8px 24px rgb(20 40 80/.1)}
html[data-theme="dark"] .trdy{background:rgb(20 30 55/.55);box-shadow:inset 0 0 0 1px rgb(255 255 255/.14),0 8px 24px rgb(0 0 0/.3)}
.rd-ring{position:relative;width:76px;height:76px}
.rd-ring svg{width:76px;height:76px;transform:rotate(-90deg)}
.rd-ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.rd-bg{stroke:rgb(31 78 154/.14)}html[data-theme="dark"] .rd-bg{stroke:rgb(255 255 255/.14)}
.rd-fg{stroke:#2b63bd}html[data-theme="dark"] .rd-fg{stroke:#f2c94c}
.rd-ring b{position:absolute;inset:0;display:grid;place-items:center;font:800 22px/1 var(--body);color:var(--ink)}.rd-ring b small{font-size:12px;margin-left:1px}
.rd-ring b{display:flex;align-items:center;justify-content:center}
.rd-tx>small{display:block;font:700 12px var(--body);color:var(--muted)}
.rd-tx>b{display:block;font:800 16px/1.25 var(--body);color:var(--ink);margin:1px 0 8px}
.rd-rows{display:grid;gap:4px}
.rd-r{all:unset;box-sizing:border-box;display:grid;grid-template-columns:96px 1fr 34px;align-items:center;gap:8px;min-height:24px;cursor:pointer;font:600 12.5px var(--body);color:var(--ink)}
.rd-r i{position:relative;height:6px;border-radius:6px;background:rgb(31 78 154/.12);overflow:hidden}
html[data-theme="dark"] .rd-r i{background:rgb(255 255 255/.12)}
.rd-r i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--w);border-radius:6px;background:#da251d}
.rd-r.ok i::after{background:#2e8b57}
.rd-r em{font:800 12px var(--body);font-style:normal;text-align:right;color:var(--muted)}

/* ── Nov 5 round 2 ── */
/* Wallet stack: each pass peeks 58px; the open one shows in full. */
.wstack{display:grid;margin:0 0 14px;padding-bottom:2px}
.wcard{position:relative;border-radius:18px;color:#fff;cursor:pointer;background:linear-gradient(160deg,var(--c2),var(--c1));
  box-shadow:inset 0 0 0 1px rgb(255 255 255/.16),inset 0 1px 0 rgb(255 255 255/.25),0 -6px 18px rgb(10 20 50/.18);-webkit-tap-highlight-color:transparent}
.wcard+.wcard{margin-top:-14px}
.wcard.past{filter:saturate(.45) brightness(.9)}
.wc-h{display:flex;align-items:center;gap:10px;min-height:58px;padding:0 16px 14px;padding-top:14px;box-sizing:border-box;font:700 13px var(--body)}
.wcard:last-child .wc-h,.wcard.open .wc-h{padding-bottom:0;min-height:52px}
.wc-no{display:inline-flex;align-items:center;gap:6px;font:800 15px var(--body)}.wc-no .ic2{width:16px;height:16px;color:#f2c94c}
.wc-r{flex:1;font:800 15px var(--body);letter-spacing:.02em;opacity:.95}
.wc-d{font:600 12.5px var(--body);color:rgb(255 255 255/.75)}
.wc-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s cubic-bezier(.3,1.1,.4,1)}
.wcard.open .wc-b{grid-template-rows:1fr}
.wc-in{overflow:hidden;min-height:0}
.wcard.open{z-index:1}
.wcard.open+.wcard{margin-top:-6px}
.wc-route{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:10px 16px 6px}
.wc-route span{display:grid;gap:1px}.wc-route .r{text-align:right}
.wc-route b{font:800 40px/1 var(--sign,var(--body))}.wc-route em{font:800 16px var(--body);font-style:normal;color:#f2c94c}.wc-route small{font:600 12px var(--body);color:rgb(255 255 255/.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wc-route i .ic2{width:26px;height:26px;transform:rotate(45deg);opacity:.85}
.wc-f{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:8px 16px 12px;border-bottom:1.5px dashed rgb(255 255 255/.3)}
.wf{display:grid;gap:1px}.wf small{font:700 11px var(--body);color:rgb(255 255 255/.62)}.wf b{font:800 15px/1.2 var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wf.dim b{color:rgb(255 255 255/.55);font-size:13px;font-weight:700}
.wc-qr{display:flex;gap:8px;align-items:center;padding:12px 16px 16px}
.wc-qr button{all:unset;box-sizing:border-box;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 14px;border-radius:12px;cursor:pointer;font:800 14px var(--body)}
.wc-add{flex:1;background:rgb(255 255 255/.16);box-shadow:inset 0 0 0 1px rgb(255 255 255/.3)}
.wc-pass{flex:1;background:#fff;color:#14213d}.wc-pass span{width:34px;height:34px;border-radius:6px;background:#ddd center/cover}
.wc-more{background:rgb(255 255 255/.1);color:#fff}
.wtips{margin:-4px 0 14px;padding-left:18px;font:500 13.5px/1.45 var(--body);color:var(--ink)}.wtips li{margin:4px 0}.wtips b{font-weight:800}

/* Check-in card. */
.ckin{position:relative;overflow:hidden;border-radius:22px;margin:0 0 14px;color:#fff;background:#14213d;box-shadow:0 12px 30px rgb(12 22 48/.28);transition:opacity .3s,transform .3s}
.ckin.gone{opacity:0;transform:scale(.96)}
.ck-ph{position:absolute;inset:0;opacity:.55}.ckin::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgb(10 18 40/.1),rgb(10 18 40/.85) 60%)}
.ckin>*:not(.ck-ph){position:relative;z-index:2}
.ck-top{display:grid;gap:2px;padding:70px 16px 10px}
.ck-top small{justify-self:start;padding:4px 10px;border-radius:999px;background:var(--city);font:800 12px var(--body)}
.ck-top b{font:800 24px/1.15 var(--body);margin-top:6px}.ck-top span{font:600 14px var(--body);color:rgb(255 255 255/.85)}
.ck-ts{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px}
.ck-t{display:grid;gap:2px;padding:10px 12px;border-radius:14px;background:rgb(255 255 255/.14);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:inset 0 0 0 1px rgb(255 255 255/.22)}
.ck-t small{font:700 11.5px var(--body);color:rgb(255 255 255/.7)}.ck-t b{font:800 16px/1.2 var(--body);word-break:break-word}.ck-t.dim b{font-size:13.5px;color:rgb(255 255 255/.7)}
.ck-t .linkbtn{justify-self:start;color:#f2c94c}
.ck-act{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 16px 0}
.ck-act>*{all:unset;box-sizing:border-box;min-height:56px;display:grid;place-items:center;gap:2px;padding:6px;border-radius:14px;cursor:pointer;text-align:center;font:700 12.5px var(--body);color:#fff;background:rgb(255 255 255/.14);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:inset 0 0 0 1px rgb(255 255 255/.22)}
.ck-act .ic2{width:20px;height:20px}
.ck-done{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;margin:10px 16px 16px;width:calc(100% - 32px);border-radius:14px;cursor:pointer;background:#2e8b57;font:800 15px var(--body);color:#fff}
.ck-done .ic2{width:18px;height:18px}

/* Trip map button and sheet. */
.tmapbtn{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;cursor:pointer;font:800 13.5px var(--body);color:var(--ink);
  background:rgb(255 255 255/.55);-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);box-shadow:inset 0 0 0 1px rgb(255 255 255/.7),0 4px 14px rgb(20 40 80/.12)}
.tmapbtn .ic2{width:17px;height:17px;color:var(--b)}
html[data-theme="dark"] .tmapbtn{background:rgb(20 30 55/.6);box-shadow:inset 0 0 0 1px rgb(255 255 255/.16);color:#fff}html[data-theme="dark"] .tmapbtn .ic2{color:#f2c94c}
.tmap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:10px;align-items:start}
.tmap svg{width:100%;height:auto;max-height:62vh}
.tm-land{fill:#dfe9d4;stroke:#9fb58f;stroke-width:1.2}
html[data-theme="dark"] .tm-land{fill:#1f3550;stroke:#3a5576}
.tm-leg{fill:none;stroke:var(--b);stroke-width:2.2;stroke-dasharray:5 5;opacity:.6}.tm-leg.done{stroke-dasharray:none;opacity:1}
html[data-theme="dark"] .tm-leg{stroke:#f2c94c}
.tm-dot{fill:var(--city);stroke:#fff;stroke-width:2.5}
.tm-c.past .tm-dot{opacity:.55}
.tm-pulse{fill:var(--city);opacity:.25}
@media (prefers-reduced-motion: no-preference){.tm-pulse{transform-box:fill-box;transform-origin:center;animation:tmp 2s ease-out infinite}@keyframes tmp{0%{transform:scale(.6);opacity:.45}100%{transform:scale(1.6);opacity:0}}}
.tm-c text{paint-order:stroke;stroke:var(--bg,#fff);stroke-width:5px;stroke-linejoin:round}
.tm-n{font:800 19px var(--body);fill:var(--ink)}.tm-d{font:700 16px var(--body);fill:var(--muted);paint-order:stroke;stroke:var(--bg,#fff);stroke-width:4px}
.tm-list{display:grid;gap:6px;padding-top:6px}

/* The page container no longer holds its end pose, so drags and sheet depth can move it. */

/* --- Press: one touch-down and spring-back everywhere (motion.js adds the classes) --- */
.mo-prs{scale:var(--mo-ps,.97);transition:scale .13s cubic-bezier(.3,.7,.4,1)!important}

/* --- Tab bar: the highlight is one pill that glides between tabs --- */
html.street nav.tabs a:not(.tmid) svg,html.street nav.tabs a:not(.tmid)[aria-current="page"] svg,html[data-gl="1"].street nav.tabs a:not(.tmid)[aria-current="page"] svg{width:46px;height:30px;padding:3px 11px;box-sizing:border-box;border-radius:999px;background:none;box-shadow:none;position:relative;z-index:1;transition:color .2s}

html.street nav.tabs a[aria-current="page"] svg{animation:moTab .5s var(--mo-bounce)}
html.street nav.tabs a.tmid[aria-current="page"] svg{animation:moTabMid .55s var(--mo-bounce)}
@keyframes moTab{from{transform:scale(.72)}}
@keyframes moTabMid{from{transform:scale(.86)}}

/* --- Sheets: spring up, the page behind sinks back, and they animate away --- */
.sheet{animation:moSheetIn .5s var(--mo-snap) backwards;will-change:transform}
@keyframes moSheetIn{from{transform:translate3d(0,100%,0)}}
.sheet-bg{animation:fade .28s ease backwards}
.sheet[data-out],.sheet-bg[data-out]{pointer-events:none}
#view{transform-origin:50% var(--mo-oy,50%)}
body.mo-sheet #view{transform:scale(.962);transition:transform .5s var(--mo-snap)}
body.mo-sheet-out #view{transition:transform .34s var(--mo-snap)}
body.mo-sheet nav.tabs{transform:translate3d(0,6px,0) scale(.97);transition:transform .5s var(--mo-snap)}

/* --- Toasts spring in and slip out --- */
.toast{animation:moToast .5s var(--mo-bounce) backwards}
@keyframes moToast{from{opacity:0;transform:translate3d(-50%,18px,0) scale(.9)}}

/* --- Photo viewer: the picture grows out of its thumbnail --- */

.lightbox.mo-in>p,.lightbox.mo-in>button{animation:fade .3s .12s ease backwards}

/* --- Day pages: the next day rides in beside the current one while you swipe --- */
.dpage{touch-action:pan-y pinch-zoom}

.dhero>.ph,.shero>.slides{will-change:transform}

/* --- Page changes (View Transitions): things open from where you tapped --- */
html[data-vt] header.top{view-transition-name:mo-top}

::view-transition-old(mo-hero),::view-transition-new(mo-hero){width:100%;height:100%;object-fit:cover}
::view-transition-group(mo-hero){z-index:3;overflow:clip}
::view-transition-old(root),::view-transition-new(root){animation-duration:.32s;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
/* tabs: a quick cross-fade with a nudge toward the tab you picked */
html[data-vt="tab"]::view-transition-old(root){animation:moFadeOut .14s ease both}
html[data-vt="tab"]::view-transition-new(root){animation:moTabIn .34s var(--mo-snap) both}
@keyframes moFadeOut{to{opacity:0}}
@keyframes moFadeIn{from{opacity:0}}
@keyframes moTabIn{from{opacity:0;transform:translate3d(calc(var(--vt-dir,1) * 18px),0,0)}}
/* push and pop, like an iPhone navigation stack */
html[data-vt="push"]::view-transition-old(root){animation:moPushOld .46s var(--mo-snap) both}
html[data-vt="push"]::view-transition-new(root){animation:moPushNew .46s var(--mo-snap) both}
html[data-vt="pop"]::view-transition-old(root){animation:moPopOld .42s var(--mo-snap) both;z-index:2}

@keyframes moPushOld{to{transform:translate3d(-26%,0,0);opacity:.55}}
@keyframes moPushNew{from{transform:translate3d(100%,0,0)}}
@keyframes moPopOld{to{transform:translate3d(100%,0,0)}}
@keyframes moPopNew{from{transform:translate3d(-26%,0,0);opacity:.55}}
/* day to day with the arrows */
html[data-vt="next"]::view-transition-old(root){animation:moNextOld .44s var(--mo-snap) both}

html[data-vt="prev"]::view-transition-new(root){animation:moPrevNew .44s var(--mo-snap) both}
@keyframes moNextOld{to{transform:translate3d(-100%,0,0)}}
@keyframes moPrevNew{from{transform:translate3d(-100%,0,0)}}
/* a card opening into its page, and folding back */
html[data-vt="open"]::view-transition-old(root){animation:moFadeOut .2s ease both}

html[data-vt="fade"]::view-transition-old(root){animation:moFadeOut .16s ease both}

/* Nov 10 sweep: motion. All of it is off when the phone asks for reduced motion. */

  @keyframes blKen{from{transform:scale(1.12)}to{transform:scale(1)}}
  html.street.bl .e1r:has(.is-today) .e1rail i{animation:blPulse 2.4s ease-out infinite}
  @keyframes blPulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--acc) 55%,transparent)}70%,100%{box-shadow:0 0 0 9px transparent}}
  html.street.bl .e1r.hop .e1t span{display:inline-block;animation:blHop 1.1s cubic-bezier(.2,.8,.2,1) .15s both}
  @keyframes blHop{from{transform:translate3d(-14px,0,0);opacity:0}to{transform:none;opacity:1}}
  html.street.bl .ialist .iarow{animation:blRow .42s cubic-bezier(.2,.8,.2,1) both}
  html.street.bl .ialist .iarow:nth-child(2){animation-delay:.04s}html.street.bl .ialist .iarow:nth-child(3){animation-delay:.08s}html.street.bl .ialist .iarow:nth-child(4){animation-delay:.12s}html.street.bl .ialist .iarow:nth-child(5){animation-delay:.16s}html.street.bl .ialist .iarow:nth-child(6){animation-delay:.2s}
  @keyframes blRow{from{opacity:0;transform:translate3d(-8px,0,0)}to{opacity:1;transform:none}}
  html.street.bl .iacv output.pop{animation:blPop .28s cubic-bezier(.3,1.5,.5,1)}
  @keyframes blPop{from{transform:scale(.9);opacity:.5}to{transform:none;opacity:1}}
  html.street.bl .iasos-c a{transition:transform .18s cubic-bezier(.3,1.4,.5,1),background-color .15s}
  html.street.bl .iasos-c a:active{transform:scale(.95)}
  html.street.bl .e1c .pill.td{animation:blNudge 3.2s ease-in-out 1.2s 2}
  @keyframes blNudge{0%,88%,100%{transform:none}92%{transform:translate3d(2px,0,0)}96%{transform:translate3d(-1px,0,0)}}
  html.street.bl nav.tabs a.tmid svg{transition:transform .25s cubic-bezier(.3,1.5,.5,1)}

}

// Calendar reminders (.ics): flights and key moments, with alerts.

    const items = checklistFor(d).map(x => x[0]).filter(Boolean); if (!items.length) continue;

  const lines=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Vietnam26//Trip//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:Vietnam '26"];

// Offline city maps: CARTO tiles, cached by the service worker.

function gmFit(pins, cfg){

  if (!P.length) return cfg.c ? `&ll=${cfg.c[0]},${cfg.c[1]}&z=${cfg.z || 14}` : "";
  const la = P.map(c => c[0]), lo = P.map(c => c[1]), la0 = Math.min(...la), la1 = Math.max(...la), lo0 = Math.min(...lo), lo1 = Math.max(...lo);

function drawMap(){
  const el=document.getElementById("map"), layer=document.getElementById("map-layer"); if(!el) return;
  const cfg = MOg().maps[MAP.city]; if (MAP.z==null || MAP.for!==MAP.city){ MAP.c=cfg.c.slice(); MAP.z=cfg.z; MAP.for=MAP.city; }
  const W=el.clientWidth, H=el.clientHeight, z=MAP.z, cx=lon2x(MAP.c[1],z), cy=lat2y(MAP.c[0],z), x0=cx-W/2, y0=cy-H/2;
  let h=""; const n=2**z;
  for (let tx=Math.floor(x0/256); tx<=Math.floor((x0+W)/256); tx++) for (let ty=Math.floor(y0/256); ty<=Math.floor((y0+H)/256); ty++){
    if (ty<0||ty>=n) continue; const wx=((tx%n)+n)%n;
    h += `<img class="mtile" alt="" draggable="false" src="${TILE(z,wx,ty)}" style="left:${Math.round(tx*256-x0)}px;top:${Math.round(ty*256-y0)}px">`; }
  mapPins(MAP.city).forEach((p,i)=>{ const [la,lo]=COORD(p.name); const px=lon2x(lo,z)-x0, py=lat2y(la,z)-y0; if(px<-20||py<-20||px>W+20||py>H+40) return;
    h += `<button type="button" class="mpin" data-place="${p.id}" style="left:${Math.round(px)}px;top:${Math.round(py)}px" aria-label="${esc(p.name)}"><span><i>${i+1}</i></span></button>`; });
  layer.style.transform=""; layer.innerHTML=h; const nt=el.querySelector(".mnote"); if (nt) nt.hidden=true;
}
// A tile that isn't saved and can't load: say so instead of showing a grey hole.
document.addEventListener("error", e=>{ const t=e.target; if (t && t.classList && t.classList.contains("mtile")){ t.style.visibility="hidden"; mapHole(); } }, true);
function mapHole(){ const el=document.getElementById("map"); if(!el) return; let nt=el.querySelector(".mnote"); if(!nt){ el.insertAdjacentHTML("beforeend", `<div class="mnote" role="status"></div>`); nt=el.querySelector(".mnote"); }
  nt.textContent = navigator.onLine===false ? "This area isn't saved for offline. Open it once on Wi-Fi to keep it." : "Some of the map didn't load. Check your connection."; nt.hidden=false; }
function wireMap(){
  const el=document.getElementById("map"); if(!el) return; drawMap();
  let st=null, moved=false, lastTap=0;
  const layer=document.getElementById("map-layer");
  el.addEventListener("touchstart",e=>{ if(e.target.closest(".map-ctl")) return; moved=false; const t=e.touches;
    st = t.length===2 ? {d:Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY), dx:0, dy:0, k:1} : {x:t[0].clientX, y:t[0].clientY, dx:0, dy:0, k:1}; },{passive:true});
  el.addEventListener("touchmove",e=>{ if(!st) return; e.preventDefault(); moved=true; const t=e.touches;
    if (t.length===2 && st.d){ st.k=Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)/st.d; layer.style.transform=`scale(${st.k})`; layer.style.transformOrigin="50% 50%"; }
    else if (t.length===1 && st.x!=null){ st.dx=t[0].clientX-st.x; st.dy=t[0].clientY-st.y; layer.style.transform=`translate(${st.dx}px,${st.dy}px)`; } },{passive:false});
  const end=()=>{ if(!st) return; const z=MAP.z;
    if (st.k!==1){ MAP.z=Math.max(11,Math.min(18,z+Math.round(Math.log2(st.k)))); }
    else if (st.dx||st.dy){ const cx=lon2x(MAP.c[1],z)-st.dx, cy=lat2y(MAP.c[0],z)-st.dy; MAP.c=[y2lat(cy,z), x2lon(cx,z)]; }
    st=null; drawMap(); };
  el.addEventListener("touchcancel",()=>{ st=null; layer.style.transform=""; },{passive:true});
  el.addEventListener("touchend",e=>{ if(e.touches.length) return; const n=Date.now(); if(!moved && !e.target.closest(".mpin,.map-ctl")){ if(n-lastTap<300){ MAP.z=Math.min(18,MAP.z+1); st=null; drawMap(); lastTap=0; return; } lastTap=n; } end(); });
  // Mouse drag for desktop testing.
  el.addEventListener("mousedown",e=>{ if(e.target.closest(".map-ctl,.mpin")) return; st={x:e.clientX,y:e.clientY,dx:0,dy:0,k:1};
    const mv=ev=>{ st.dx=ev.clientX-st.x; st.dy=ev.clientY-st.y; layer.style.transform=`translate(${st.dx}px,${st.dy}px)`; };
    const up=()=>{ removeEventListener("mousemove",mv); removeEventListener("mouseup",up); end(); }; addEventListener("mousemove",mv); addEventListener("mouseup",up); });
}

const NF = new Intl.NumberFormat("en-US"), fmtVnd = n => NF.format(Math.round(n/50000)*50000) + " ₫";
const fmtUsd = n => "$" + Math.round(n / T.info.rates.VND);
const nowH = () => nowMin()/60;
const dayOf = iso => T.days.find(d=>d.date===iso);
const placeByName = n => (T.places||[]).find(p=>p.name===n);

const MAPCITY = c => Object.keys(CITYNAME).find(k=>CITYNAME[k]===c);

// --- What now? ---
let WN = { here: null, n: 3 };
function openAt(S, h, wd){
  if (S[3] && !S[3].includes(wd)) return null;
  for (const [a,b] of S[2]){ if (h >= a && h < b - 0.25) return b; if (h + 24 >= a && h + 24 < b - 0.25) return b - 24; }
  return null;
}
function rainPct(city, iso){ try{ return JSON.parse(store.get("wx-"+city)||"null")?.days?.[iso]?.p ?? null; }catch(e){ return null; } }
function whatNow(){
  const iso = todayIso(), d = dayOf(iso), wd = parse(iso).getDay(), h = nowH();
  const city = d && VN(d.city) ? d.city : "hcmc", M = (MOg().maps||{})[MAPCITY(city)];
  const origin = WN.here || (M && M.c), rain = rainPct(city, iso);
  const planned = new Set((d ? d.items : []).flatMap(x=>placesFor(x[1], d.city)).map(p=>p.name));
  const meal = (h>=11 && h<14) || (h>=17.5 && h<21), coffee = (h>=7 && h<11) || (h>=14 && h<17.5), late = h>=18;
  const out = [];
  for (const [name, S] of Object.entries(MOg().spots||{})){
    const C = COORD(name); if (!C || !origin) continue;
    const km = hav(origin, C)*1.3; if (km > 12) continue;
    const till = openAt(S, h, wd); if (till == null) continue;
    let score = -km*1.6;
    if (S[0]==="eat" && meal) score += 3; if (S[0]==="coffee" && coffee) score += 2.5;
    if ((S[0]==="night"||S[0]==="walk") && late) score += 3; if ((S[0]==="night") && !late) score -= 2;
    if (rain!=null && rain>=50) score += S[1] ? 2 : -2.5;
    if (till - h < 1) score -= 2;
    if (planned.has(name)) score -= 1.5;
    out.push({ name, S, km, till, score, planned: planned.has(name) });
  }
  return { list: out.sort((a,b)=>b.score-a.score), rain, city, origin, d };
}
function getThere(km){
  const walk = Math.round(km/4.5*60), grab = Math.round(4 + km/20*60), fare = Math.max(30, Math.round((12 + km*14)/5)*5);
  return walk <= 20 ? `${walk} min walk` : `Grab ~${grab} min · ~${fare}k ₫`;
}
function whatNowCards(){
  const W = whatNow(), K = MOg().spotKinds||{};
  if (!W.list.length) return `<div class="card"><b>Nothing nearby is open right now.</b><p class="small muted" style="margin:6px 0 0">Late night? Head back to your stay, or check the Eat list for tomorrow.</p></div>`;
  return W.list.slice(0, WN.n).map((x,i)=>{ const p = placeByName(x.name);
    const why = [K[x.S[0]], x.S[1] ? "Indoors" : "", `Open till ${hm(x.till)}`, x.planned ? "On today's plan" : ""].filter(Boolean).join(" · ");
    return `<div class="card wn"><div class="wn-n">${i+1}</div><div class="wn-b"><b>${esc(x.name)}</b><span class="small muted">${esc(why)}</span><span class="wn-go">${getThere(x.km)}${WN.here?"":" from the center"}</span>

// --- Cash for today ---
function cashFor(d){
  if (!d || !VN(d.city)) return null;
  const F = MOg().fees||{}, B = MOg().cashBase||{food:350000,ride:40000,buffer:200000};
  const names = [...new Set(d.items.flatMap(x=>placesFor(x[1], d.city)).map(p=>p.name))];
  const lines = [];
  names.forEach(n=>{ if (F[n]) lines.push([n, F[n]]); });
  const txt = d.items.map(x=>x[1]).join(" ").toLowerCase();
  const rides = (txt.match(/\bgrab\b|\bcar to\b|\bcar\b|taxi|transfer/g)||[]).length;
  const fine = /coco|\bgia\b|tasting menu|la maison|anan/.test(txt);
  lines.push([fine ? "Street food, coffee and snacks (dinner on card)" : "Meals, coffee and snacks", fine ? Math.round(B.food*0.6) : B.food]);
  if (rides) lines.push([`${rides} ride${rides>1?"s":""}, shared`, rides*B.ride]);
  lines.push(["Tips and small extras", B.buffer]);
  const total = lines.reduce((s,l)=>s+l[1],0);
  return { total, lines };
}

// --- Morning brief ---
function briefHtml(d){
  const test = new URLSearchParams(location.search).get("am");
  if (!d || (nowH() >= 12 && !test)) return "";
  const h = nowH();
  const next = d.items.map(x=>[parseItemTime(x[0]), x]).filter(([t])=>t!=null && t >= h - 0.25).sort((a,b)=>a[0]-b[0])[0];
  const leg = legsOn(d.date).find(l=>localDate(l.dep)===d.date);
  const list = checklistFor(d), txt = list.map(x=>x[0]).join(" ");
  const wear = [];
  if (/Shoulders/.test(txt)) wear.push("shoulders and knees covered");
  if (/Comfortable shoes/.test(txt)) wear.push("good walking shoes");
  if (/Umbrella/.test(txt)) wear.push("something for the rain");
  if (/Light jacket/.test(txt)) wear.push("a light layer for tonight");
  if (/Dinner outfit/.test(txt)) wear.push("dinner clothes for tonight");
  if (!wear.length) wear.push("light, breathable clothes");
  const bring = list.filter(([t])=>!/Shoulders|Comfortable shoes|Dinner outfit|Light jacket|Phone charged|Cash in dong/.test(t)).map(x=>x[0]);
  const c = cashFor(d);
  const row = (k, v) => `<div class="br-r"><span class="br-k">${k}</span><span>${v}</span></div>`;
  return `<h3>Good morning</h3><div class="card brief">
    ${leg ? row("Flight", `<b>${esc(leg.no)} at ${localTime(leg.dep)}</b>`) : ""}
    ${next ? row("First up", `<b>${esc(next[1][0])}</b> ${esc(next[1][1])}`) : row("First up", "Nothing timed. Take it slow.")}
    ${row("Wear", esc(wear.join(", ")))}
    ${bring.length ? row("Bring", esc(bring.join(", "))) : ""}
    ${c ? row("Cash", `<b>about ${fmtVnd(c.total)}</b> each`) : ""}
  </div>`;
}

// ===== History and facts: Did you know?, timeline, December in history, trivia =====
const FX = () => (T && T.facts) || { facts: [], timeline: [], december: {}, trivia: [] };
const CITYLBL = { all: "Vietnam", hcmc: "Sài Gòn", hoian: "Hội An", danang: "Đà Nẵng", hanoi: "Hà Nội", ninhbinh: "Ninh Bình" };
const placeCityKey = name => { const p = placeByName(name); return p ? CITYNAME[p.city] : null; };
const factWhere = w => CITYLBL[w] || w;
function hashStr(s){ let h = 0; for (const c of s) h = (h*31 + c.charCodeAt(0)) | 0; return Math.abs(h); }
// Facts for a day: places on the plan first, then the city, then the country; rotates by date.
function factsForDay(d, n){
  const F = FX().facts.map((f,i)=>({f,i}));
  const names = d ? new Set(d.items.flatMap(x=>placesFor(x[1], d.city)).map(p=>p.name)) : new Set();
  const pool = [...F.filter(x=>names.has(x.f[1])), ...F.filter(x=>d && x.f[1]===d.city), ...F.filter(x=>x.f[1]==="all")];
  const seed = hashStr(d ? d.date : todayIso()), out = [], seen = new Set();
  const groups = [pool.filter(x=>names.has(x.f[1])), pool.filter(x=>d && x.f[1]===d.city), pool.filter(x=>x.f[1]==="all")];
  for (const g of groups){ if (!g.length) continue; const x = g[seed % g.length]; if (!seen.has(x.i)){ out.push(x); seen.add(x.i); } if (out.length >= n) break; }
  return out;
}
const factCard = (x, sm) => `<div class="fact${sm?" sm":""}"><div class="fact-k"><span>${esc(x.f[0])}</span><span>${esc(factWhere(x.f[1]))}</span></div><p>${esc(x.f[2])}</p></div>`;
function todayFactsHtml(d){
  const list = factsForDay(d, 2), dec = d ? FX().december[d.date] : null;
  if (!list.length && !dec) return "";
  return `<h3>Did you know?</h3><div class="card facts-today">${list.map(x=>factCard(x,1)).join("")}
    <a class="more-link" href="#facts">More facts ›</a>
    ${dec?`<div class="fact sm dec"><div class="fact-k"><span>This December in history</span><span>${esc(dec[0])}</span></div><p>${esc(dec[1])}</p></div>`:""}</div>`;
}

// Photos live in IndexedDB on this phone only.
const IDB = { db: null,
  open(){ if (this.db) return Promise.resolve(this.db); return new Promise((ok, no)=>{ const r = indexedDB.open("vietnam26", 1); r.onupgradeneeded = ()=>r.result.createObjectStore("hunt"); r.onsuccess = ()=>{ this.db = r.result; ok(this.db); }; r.onerror = ()=>no(r.error); }); },
  async put(k, v){ const db = await this.open(); return new Promise((ok, no)=>{ const t = db.transaction("hunt","readwrite"); t.objectStore("hunt").put(v, k); t.oncomplete = ok; t.onerror = ()=>no(t.error); }); },
  async get(k){ const db = await this.open(); return new Promise(ok=>{ const r = db.transaction("hunt").objectStore("hunt").get(k); r.onsuccess = ()=>ok(r.result||null); r.onerror = ()=>ok(null); }); },
  async del(k){ const db = await this.open(); return new Promise(ok=>{ const t = db.transaction("hunt","readwrite"); t.objectStore("hunt").delete(k); t.oncomplete = ok; t.onerror = ok; }); },
};

// Daily bounty: one item per trip day, worth double if caught that day.
function bountyFor(iso){
  const d = dayOf(iso); if (!d || !VN(d.city)) return null;
  const pool = HUNT().filter(h=>h[1] < 5 && (!h[3] || h[3]===d.city));
  return pool.length ? pool[hashStr("bounty"+iso) % pool.length] : null;
}
function scoreAll(){
  const R = boardRecords(), first = {}, aw = {}, SP = Object.fromEntries(SPEAK().map(x=>[x[0], x[4]]));
  R.forEach(r=>Object.entries(r.h||{}).forEach(([id,ts])=>{ if (first[id]==null || ts < first[id].ts) first[id] = {ts, n: r.n}; }));
  R.forEach(r=>(r.aw||[]).forEach(a=>{ aw[a.id] = a; }));
  Object.values(aw).forEach(a=>{ if (!R.some(r=>r.n===a.to)) R.push({ n: a.to, t: 0 }); });
  const champ = R.reduce((m,r)=>Math.max(m, r.hg||0), 0);
  return R.map(r=>{
    let hunt = 0, bonus = 0;
    Object.entries(r.h||{}).forEach(([id,ts])=>{ const it = huntItem(id); if (!it) return;
      const day = isoOf(new Date(ts)), b = bountyFor(day); let p = it[1]; if (b && b[0]===id) p *= 2;
      hunt += p; if (first[id] && first[id].n===r.n && R.length > 1) bonus++; });
    const trivia = (r.tr||[]).length, bingo = r.bg||0;
    const bill = Object.values(aw).filter(a=>a.to===r.n && a.g==="bill").reduce((s,a)=>s+a.p, 0);
    const haggle = Math.floor((r.hg||0)/10) + (champ > 0 && r.hg===champ && R.length > 1 ? 3 : 0);
    const speak = Object.keys(r.sp||{}).reduce((s,k)=>s+(SP[k]||0), 0);
    return { n: r.n, t: r.t, hunt, bonus, trivia, bingo, bill, haggle, speak, found: Object.keys(r.h||{}).length,
      total: hunt + bonus + trivia + bingo + bill + haggle + speak, me: r.n===ME() };
  }).sort((a,b)=>b.total-a.total || a.n.localeCompare(b.n));
}
