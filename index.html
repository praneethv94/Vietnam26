// ===== Live leaderboard: every phone writes its own scores to one shared room and listens for everyone else's.
// Firebase Realtime Database over plain REST and server-sent events (no SDK). Works offline: changes wait and send later.
const LIVE = { es: null, room: null, dirty: false, timer: null, state: "off", seen: 0, ping0: Date.now() };
const LIVE_OFF = location.protocol === "file:" || /^(localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\])$/.test(location.hostname);
const liveBase = () => T && T.live && !LIVE_OFF ? `${T.live.db}/v26/${T.live.room}` : null;
const SCORE_KEYS = new Set(["hunt-found","trivia-right","trivia-scores","bingo","awards","haggles","speak"]);
function takeRecord(x){
  if (!x || !x.n || x.n === ME()) return false;
  const B = local.get("board", {}), rec = { n:x.n, t:x.t*60000, tr:x.tr||[], tb:x.tb||0, h:{}, bg:x.bg||0, hg:x.hg||0, sp:x.sp||{}, aw:(x.aw||[]).map(a=>({id:a[0], to:a[1], p:a[2], g:a[3], ts:a[4]*60000})) };
  Object.entries(x.h||{}).forEach(([k,v])=>rec.h[k]=v*60000);
  if (B[x.n] && B[x.n].t > rec.t) return false;
  B[x.n] = rec; store.set("board", JSON.stringify(B)); return true;
}
function livePush(soon){
  if (!liveBase() || !ME()) return; LIVE.dirty = true; clearTimeout(LIVE.timer);
  LIVE.timer = setTimeout(async ()=>{
    if (!navigator.onLine) return;
    try { const r = await fetch(`${liveBase()}/scores/${encodeURIComponent(ME())}.json`, { method: "PUT", body: JSON.stringify(compactRecord()) });
      if (r.ok){ LIVE.dirty = false; liveStatus(); } } catch(e){}
  }, soon ? 300 : 1500);
}
function liveApply(path, data){
  // Keep a mirror of the room, then copy everyone else's scores into this phone's board.
  if (path === "/") LIVE.room = data || {};
  else { LIVE.room = LIVE.room || {}; const parts = path.split("/").filter(Boolean).map(decodeURIComponent); let o = LIVE.room;
    for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]] = (o[parts[i]] && typeof o[parts[i]] === "object") ? o[parts[i]] : {};
    if (data == null) delete o[parts[parts.length-1]]; else o[parts[parts.length-1]] = data; }
  if (typeof gatesSync === "function") gatesSync((LIVE.room||{}).gates);
  if (typeof edSync === "function") edSync((LIVE.room||{}).edits);
  let changed = false; Object.values((LIVE.room||{}).scores || {}).forEach(x=>{ if (takeRecord(x)) changed = true; });
  const pg = (LIVE.room||{}).ping;
  if (pg && pg.t > LIVE.ping0 && pg.t > LIVE.seen){ LIVE.seen = pg.t; if (pg.by !== ME()){ toast(`${pg.by} refreshed everyone's app`); liveRefresh(); } }
  LIVE.seen = Math.max(LIVE.seen, (pg && pg.t) || 0);
  LIVE.state = "on"; liveStatus();
  if (changed && /^#(board|games)$/.test(location.hash)){ const y = scrollY; route(); scrollTo(0, y); }
}
function liveListen(){
  if (!liveBase() || !window.EventSource) return; liveStop();
  const es = LIVE.es = new EventSource(`${liveBase()}.json`);
  const on = ev => { try { const m = JSON.parse(ev.data); if (m) liveApply(m.path, m.data); } catch(e){} };
  es.addEventListener("put", on); es.addEventListener("patch", ev => { try { const m = JSON.parse(ev.data); Object.entries(m.data||{}).forEach(([k,v])=>liveApply((m.path==="/"?"":m.path)+"/"+k, v)); } catch(e){} });
  es.onerror = () => { LIVE.state = navigator.onLine ? "retry" : "off"; liveStatus(); };
}
function liveStop(){ if (LIVE.es){ LIVE.es.close(); LIVE.es = null; } }
async function liveRefresh(){
  // Fetch the newest app (if one was published) and reload; scores come back with the page.

}
function liveStatus(){

function liveInit(){

  const set0 = local.set; local.set = (k, v) => { set0(k, v); if (SCORE_KEYS.has(k)) livePush(); };
  livePush(true); liveListen();
  document.addEventListener("visibilitychange", ()=>{ if (document.visibilityState === "visible"){ liveListen(); if (LIVE.dirty) livePush(true); } else liveStop(); });
  addEventListener("online", ()=>{ liveListen(); livePush(true); });
}
document.addEventListener("click", async e=>{
  const b = e.target.closest("[data-liveping]"); if (!b) return;
  if (!liveBase()) return liveRefresh();
  try { await fetch(`${liveBase()}/ping.json`, { method: "PUT", body: JSON.stringify({ t: Date.now(), by: ME() }) }); toast("Refreshing everyone's app"); } catch(err){ toast("No connection. Try again when you're online."); return; }
  liveRefresh();
});
document.addEventListener("click", e=>{ if (e.target.closest("[data-liverefresh]")){ livePush(true); liveListen(); toast("Scores refreshed"); } });

async function hydrateHunt(){
  for (const el of document.querySelectorAll("[data-himg]")){ const id = el.dataset.himg; if (!id) continue;
    if (!HV.url[id]){ const blob = await IDB.get(id).catch(()=>null); if (blob) HV.url[id] = URL.createObjectURL(blob); }
    if (HV.url[id]) el.innerHTML = `<img src="${HV.url[id]}" alt="">`; else el.textContent = "✓"; }
}
async function shrink(file){
  const bmp = await createImageBitmap(file), k = Math.min(1, 1400/Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width*k); c.height = Math.round(bmp.height*k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(ok=>c.toBlob(ok, "image/jpeg", .82));
}

document.addEventListener("click", e=>{

document.addEventListener("change", async e=>{

// Recap: a shareable collage of your finds.
document.addEventListener("click", async e=>{ if (!e.target.closest("[data-recap]")) return;
  const F = huntFound(), ids = Object.keys(F).sort((a,b)=>F[a]-F[b]); if (!ids.length) return toast("Find something first!");
  const me = scoreAll().find(s=>s.me), cols = 3, cell = 360, pad = 24, head = 220, rows = Math.ceil(ids.length/cols);
  const c = document.createElement("canvas"); c.width = cols*cell + pad*2; c.height = head + rows*(cell+70) + pad; const g = c.getContext("2d");
  g.fillStyle = "#fff5d6"; g.fillRect(0,0,c.width,c.height); g.fillStyle = "#ffed00"; g.fillRect(0,0,c.width,head-30);
  g.fillStyle = "#000"; g.font = "800 64px 'Barlow Condensed', -apple-system, sans-serif"; g.fillText(`${ME().toUpperCase()}'S PHOTO HUNT`, pad, 90);
  g.font = "700 40px 'Barlow Condensed', -apple-system, sans-serif"; g.fillText(`${me.hunt + me.bonus} pts · ${ids.length} of ${HUNT().length} found · Vietnam '26`, pad, 150);
  for (let i=0;i<ids.length;i++){ const x = pad + (i%cols)*cell, y = head + Math.floor(i/cols)*(cell+70);
    const blob = await IDB.get(ids[i]).catch(()=>null);
    g.fillStyle = "#000"; g.fillRect(x+6, y+6, cell-24, cell-24);
    if (blob){ const bm = await createImageBitmap(blob), s = Math.min(bm.width, bm.height); g.drawImage(bm, (bm.width-s)/2, (bm.height-s)/2, s, s, x, y, cell-24, cell-24); }
    else { g.fillStyle = "#ffed00"; g.fillRect(x, y, cell-24, cell-24); }
    g.strokeStyle = "#000"; g.lineWidth = 6; g.strokeRect(x, y, cell-24, cell-24);
    g.fillStyle = "#000"; g.font = "700 22px 'Barlow Condensed', -apple-system, sans-serif";
    const t = huntItem(ids[i])[2]; g.fillText(t.length > 30 ? t.slice(0,29)+"…" : t, x, y + cell + 12); }
  c.toBlob(async blob=>{ const file = new File([blob], "photo-hunt.jpg", {type:"image/jpeg"});
    try { if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file]}); return; } } catch(err){ if (err && err.name==="AbortError") return; }
    const url = URL.createObjectURL(file), a = document.createElement("a"); a.href = url; a.download = file.name; a.click(); }, "image/jpeg", .85);
});

function toggleDay(d){

  if (matchMedia("(prefers-reduced-motion: reduce)").matches || !body.animate){ d.open=!d.open; return; }
  if (d._anim) d._anim.cancel();
  if (!d.open){
    d.open = true; const h = body.scrollHeight;
    d._anim = body.animate([{height:"0px",opacity:0},{height:h+"px",opacity:1}],{duration:320,easing:"cubic-bezier(.2,.8,.2,1)"});

function latestFeed(){

    Object.entries(r.h||{}).forEach(([id,ts])=>{ const it = huntItem(id); if (it) ev.push({ ts, n: r.n, html: `found ${esc(it[2].charAt(0).toLowerCase() + it[2].slice(1))}`, p: it[1] }); });

// Before-you-fly countdown: open items with their deadlines (more.mjs todo). Ticks are saved on this phone.
function todoHtml(iso){
  const L = (MOg().todo||[]).filter(t=>t[4]==="all" || PB()), done = local.get("todo-done", {});
  const open = L.filter(t=>!done[t[0]]); if (!L.length) return "";
  const dleft = due => Math.round((parse(due) - parse(iso)) / 864e5);
  const when = (n, w) => n < 0 ? (/visa/i.test(w || "") ? "Apply now" : "Do it now") : n === 0 ? "today" : n === 1 ? "tomorrow" : `${n} days`;
  const row = t => { const n = dleft(t[2]), dt = parse(t[2]);
    return `<label class="todo-r${done[t[0]]?" done":""}${n<=3&&!done[t[0]]?" soon":""}"><input type="checkbox" data-todo="${t[0]}"${done[t[0]]?" checked":""}><span><b>${esc(t[1])}</b><small>${esc(t[3])}</small></span><span class="num"><span>${done[t[0]] ? "Done" : when(n, t[1])}</span></span><em>${t[5] ? "Deadline" : "Aim for"} ${DOW[dt.getDay()]} ${MON[dt.getMonth()]} ${dt.getDate()}</em></label>`; };
  return `<h3>Still to do before you fly · ${open.length} left</h3><div class="card todo">${[...L].sort((a,b)=>(done[a[0]]?1:0)-(done[b[0]]?1:0) || a[2].localeCompare(b[2])).map(row).join("")}</div>`;
}

const WKIND = { flight: ["Flight", "plane", "#1f4e9a"], stay: ["Stay", "key", "#2a7148"], ticket: ["Ticket", "tag", "#c62a2a"], food: ["Table", "bowl", "#8a5a00"], other: ["Other", "wallet", "#4c4330"], car: ["Car", "car", "#0f7471"] };
const wallet = () => local.get("wallet", []);
const WURL = {};
async function walletPics(root){
  for (const el of (root || document).querySelectorAll("[data-wimg]:not([data-done])")) { el.dataset.done = 1; const id = el.dataset.wimg;
    if (!WURL[id]) { const b = await IDB.get("w-" + id); if (b) WURL[id] = URL.createObjectURL(b); }
    if (WURL[id]) { if (el.tagName === "IMG") el.src = WURL[id]; else el.style.backgroundImage = `url(${WURL[id]})`; } else el.remove(); }
}
function walletCard(w, iso){
  const k = WKIND[w.kind] || WKIND.other, x = w.date ? parse(w.date) : null;
  return `<button type="button" class="wpass${w.date === iso ? " today" : ""}${w.date && w.date < iso ? " old" : ""}" data-wopen="${w.id}" style="--wk:${k[2]}">
    <span class="wtop">${icon(k[1])}<small>${k[0]}${x ? ` · ${DOW[x.getDay()]} ${x.getDate()} ${MON[x.getMonth()]}` : ""}</small>${w.date === iso ? `<em>Today</em>` : ""}</span>
    <b>${esc(w.title)}</b>${w.code ? `<span class="wcode"><small>Code</small>${esc(w.code)}</span>` : ""}${w.pic ? `<span class="wthumb" data-wimg="${w.id}"></span>` : ""}</button>`;
}
function walletForm(pre){
  const p = pre || {};
  openSheet(`<div class="sname">${p.bk ? "Add boarding pass or QR" : "Add a pass"}</div><form class="wform" id="wform">
    <label class="wfile">${icon("tag")}<span data-wfname>Add a screenshot of the boarding pass, QR code or ticket</span><input name="pic" type="file" accept="image/*"></label>
    <label>Name<input name="title" required placeholder="e.g. VN 125 to Đà Nẵng" value="${esc(p.title || "")}"></label>
    ${p.bk ? `<input type="hidden" name="kind" value="${esc(p.kind || "ticket")}"><input type="hidden" name="date" value="${esc(p.date || "")}">` : `<div class="wkinds">${Object.entries(WKIND).map(([k, v]) => `<label><input type="radio" name="kind" value="${k}"${(p.kind || "ticket") === k ? " checked" : ""}><span>${icon(v[1])}${v[0]}</span></label>`).join("")}</div>
    <label>Date<input name="date" type="date" min="2026-12-01" max="2026-12-31" value="${esc(p.date || "")}"></label>`}
    <label>Confirmation code or seat<input name="code" placeholder="e.g. 7K4QXM · seat 12A" autocapitalize="characters" autocorrect="off" spellcheck="false"></label>
    <input type="hidden" name="bk" value="${esc(p.bk || "")}"><p class="small muted" style="margin:0">Saved only on this phone. Keep the screenshot in Photos too.</p><button class="btn solid" type="submit">Save</button></form>`);
}
document.addEventListener("click", async e => {
  if (e.target.closest("[data-wadd]")) return walletForm();
  const q = e.target.closest("[data-wquick]"); if (q) { const [date, title] = q.dataset.wquick.split("|"); return walletForm({ date, title, kind: "flight" }); }
  const o = e.target.closest("[data-wopen]"); if (o) {
    const w = wallet().find(x => x.id === o.dataset.wopen); if (!w) return; const k = WKIND[w.kind] || WKIND.other;

      <p class="small muted">Turn your screen brightness up for scanners.</p><div class="btns"><button type="button" class="btn" data-wdel="${w.id}">Remove</button></div></div>`);
    walletPics(document.querySelector(".sheet")); return; }

document.addEventListener("submit", async e => {
  const f = e.target.closest("#wform"); if (!f) return; e.preventDefault();
  const fd = new FormData(f), id = "w" + Date.now().toString(36), file = fd.get("pic");
  const w = { id, title: String(fd.get("title") || "").trim(), kind: fd.get("kind") || "other", date: fd.get("date") || "", code: String(fd.get("code") || "").trim(), pic: !!(file && file.size), bk: String(fd.get("bk") || "") };
  const btn = f.querySelector('button[type="submit"]'), err = m => { f.querySelector(".werr")?.remove(); btn.insertAdjacentHTML("beforebegin", `<p class="werr su-err" role="alert">${esc(m)}</p>`); };
  if (!w.title) { const t = f.querySelector('[name="title"]'); t.value = ""; t.setAttribute("aria-invalid", "true"); t.focus(); return err("Give it a name, like the flight number."); }
  if (f.dataset.busy) return; f.dataset.busy = "1"; btn.disabled = true; btn.textContent = "Saving…";
  try {
    if (w.pic) await IDB.put("w-" + id, file);
    local.set("wallet", wallet().concat(w));
    if (!wallet().some(x => x.id === id)) throw new Error("not stored");
  } catch (x) { delete f.dataset.busy; btn.disabled = false; btn.textContent = "Try again"; return err("Couldn't save on this phone (storage may be full or in private browsing). Try again, and keep the screenshot in Photos too."); }
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (x) {} closeSheet(); toast(w.bk ? "Saved to this booking" : "Saved"); if (w.bk) { render("bookings"); bkSheet(w.bk); } else render("plan", null, "bookings");
});
function walletToday(iso){

// Bookings: tap any flight, car or reservation for its details and the passes attached to it (QR, boarding pass, code).
const MONI = { Jan:0, Feb:1, Mar:2, Apr:3, May:4, Jun:5, Jul:6, Aug:7, Sep:8, Oct:9, Nov:10, Dec:11 };
function bkItem(key){
  if (key[0] === "m") { const L = personalLegs().filter(l => l.dir === key.slice(2)); if (!L.length) return null;
    const x = { route: `${L[0].from} → ${L[L.length - 1].to}`, when: `${fmt(L[0].dep.slice(0, 10))} · ${t12(L[0].dep)}`, status: "booked", legs: L.map(l => l.no), ref: (L.find(l => l.ref) || {}).ref || "", mine: 1 };
    return { key, x, kind: "flight", title: x.route, when: x.when, date: L[0].dep.slice(0, 10), status: "booked", lines: [] }; }
  const [t, i] = key.split(":"), x = (t === "f" ? T.flights : t === "t" ? T.transfers : T.reservations)[+i]; if (!x) return null;
  const when = x.when || "", m = when.match(/\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\w*\s+(\d{1,2})/);
  const date = x.date || (m ? `2026-${String(MONI[m[1]] + 1).padStart(2, "0")}-${m[2].padStart(2, "0")}` : "");
  return { key, x, kind: t === "f" ? "flight" : t === "t" ? "car" : /dinner|lunch|table|restaurant|tasting|bar/i.test(x.what || "") ? "food" : "ticket",
    title: x.route || x.what || "", when, date, status: x.status, lines: [x.detail, x.note].filter(Boolean).join(" · ").split(/\s·\s|\.\s+(?=[A-Z])/).map(s => s.trim()).filter(Boolean) };
}
const bkPasses = key => wallet().filter(w => w.bk === key);
function bkTag(key){ const n = bkPasses(key).length; return `<span class="bktag">${n ? `${icon("tag")}${n} pass${n > 1 ? "es" : ""} saved` : "Details & passes"} ›</span>`; }
function bkOther(){ const W = wallet().filter(w => !w.bk); setTimeout(() => walletPics(), 0);
  return `<h2>Other passes</h2><p class="small muted" style="margin:0 0 10px">Tickets, QR codes and codes that aren't tied to a booking above. Saved only on this phone, shown offline.</p><button type="button" class="btn solid wadd" data-wadd>${icon("tag")}Add a ticket or pass</button>${W.length ? `<div class="wlist">${W.map(w => walletCard(w, todayIso())).join("")}</div>` : ""}`; }
const tName = t => /^\w$/.test(t) ? `Terminal ${t}` : `${t} terminal`;
// Which flight booking a piece of day text or a leg belongs to ("f:i"), so it can open the boarding-pass sheet.
function bkFlightKey(date, text, legNo){
  const F = T.flights || [], txt = text || "";
  let i = F.findIndex(f => (f.legs || []).some(n => n === legNo || (/\d/.test(n) && txt.replace(/\s/g, "").includes(n.replace(/\s/g, "")))));
  if (i < 0 && (legNo || /flight|airlines|qatar|united|✈|land at|lands|fly /i.test(txt))) i = F.findIndex(f => f.date === date || (f.legs || []).some(n => { const l = (MOg().legs || []).find(x => x.no === n); return l && (l.dep.slice(0, 10) === date || (l.arr || "").slice(0, 10) === date); }));
  return i < 0 || (F[i].pb && !PB()) ? "" : "f:" + i;
}
document.addEventListener("click", e => { const b = e.target.closest("[data-bkopen]"); if (!b) return; e.preventDefault(); e.stopPropagation(); bkSheet(b.dataset.bkopen);
  const n = b.dataset.bkleg, el = n && document.querySelector(`.sheet .bkl[data-no="${CSS.escape(n)}"]`); if (el) setTimeout(() => el.scrollIntoView({ block: "center", behavior: "smooth" }), 120); }, true);
const legIn = t => ((MOg().legs || []).find(l => /\d/.test(l.no) && (t || "").replace(/\s/g, "").includes(l.no.replace(/\s/g, ""))) || {}).no || "";
const t12 = iso => { if (!iso) return "—"; let h = +iso.slice(11, 13); const m = iso.slice(14, 16), ap = h < 12 ? "AM" : "PM"; h = h % 12 || 12; return `${h}:${m} ${ap}`; };
const dur = ms => { const m = Math.round(ms / 60000); return `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, "0")}m`; };
function seatList(s){ return (s || "").split("·").map(x => x.trim()).filter(Boolean).map(x => { const m = x.match(/^(\S+)\s+(\S+)$/); return m ? [m[1], m[2]] : ["", x]; }); }
function legCard(l){
  const sl = seatList(l.seats), wk = l.dep && fmt(l.dep.slice(0, 10)), ak = l.arr && fmt(l.arr.slice(0, 10)), d = l.arr ? dur(new Date(l.arr) - new Date(l.dep)) : "";

    <div class="bklr"><div><big>${esc(l.from)}</big><small>${esc(l.fromName)}</small><em>${t12(l.dep)}</em><small>${wk || ""}</small></div>
    <div class="bkld">${icon("plane")}${d ? `<small>${d}</small>` : ""}</div>
    <div class="r"><big>${esc(l.to)}</big><small>${esc(l.toName)}${l.toT ? ` · ${esc(tName(l.toT))}` : ""}</small><em>${l.arr ? t12(l.arr) : "—"}</em><small>${ak || ""}</small></div></div>
    ${/\d/.test(l.no) ? `<div class="bklt"><span>${l.fromT ? esc(tName(l.fromT)) : esc(l.from)}${l.gate ? ` · <b>Gate ${esc(l.gate)}</b>` : ` · Gate on the day`}</span><a href="https://www.google.com/search?q=${encodeURIComponent(l.no.replace(/\s/, "") + " flight status " + (l.dep || "").slice(0, 10))}" target="_blank" rel="noopener">Live status ›</a><a class="fty" href="flighty://" aria-label="Open Flighty">Flighty ›</a></div>` : ""}
    <div class="bkls"><span>Seat${sl.length > 1 ? "s" : ""}</span>${sl.length ? sl.map(([n, x]) => `<b>${n ? `<i>${esc(n)}</i>` : ""}${esc(x)}</b>`).join("") : `<b class="no">Not picked</b>`}</div></div>`;
}
function bkFields(b){
  const x = b.x, F = [];
  if (b.kind === "flight") {
    if (x.cabin) F.push(["Cabin", x.cabin]); if (x.bags) F.push(["Checked bags", x.bags]); if (x.carry) F.push(["Carry-on", x.carry]);
    (x.tickets || []).forEach(([n, t]) => F.push([`E-ticket · ${n}`, t, "mono"]));
  } else {
    F.push(["When", b.when]);
    const txt = [x.what, x.note].filter(Boolean).join(" · "), price = txt.match(/~?\$[\d,]+(?:[–-]\$?[\d,]+)?(?:\s*pp)?/), about = txt.match(/about (\d+(?:\.\d+)? (?:hrs?|min))/i), tel = txt.match(/\+\d[\d ]{7,}\d/);
    if (about) F.push(["Takes", about[1]]); if (price) F.push(["Price", price[0]]);
    if (tel) F.push(["Book by phone", `<a href="tel:${tel[0].replace(/\s/g, "")}">${esc(tel[0])}</a>`, "html"]);
    if (x.note) F.push(["Notes", x.note.replace(/Call \+\d[\d ]+\d( or )?/i, "").replace(/^\w/, c => c.toUpperCase()), "wide"]);
  }
  return F.length ? `<dl class="bkf">${F.map(([k, v, t]) => `<div class="${t === "wide" ? "w" : ""}"><dt>${esc(k)}</dt><dd class="${t === "mono" ? "mono" : ""}">${t === "html" ? v : esc(v)}</dd></div>`).join("")}</dl>` : "";
}
function bkSheet(key){
  const b = bkItem(key); if (!b) return; const P = bkPasses(key), k = WKIND[b.kind] || WKIND.other, x = b.x;
  const guide = b.kind === "flight" && (T.airports || []).find(a => (!a.pb || PB()) && b.date && a.when.includes(fmt(b.date)));
  const pool = x.mine ? personalLegs().filter(l => l.dir === key.slice(2)) : (MOg().legs || []), L = (x.legs || []).map(n => pool.find(l => l.no === n)).filter(Boolean);
  let legsHtml = "";
  L.forEach((l, i) => { if (i) { const p = L[i - 1]; legsHtml += `<div class="bklc">${p.arr ? dur(new Date(l.dep) - new Date(p.arr)) + " " : ""}layover in ${esc(p.toName)}</div>`; } legsHtml += legCard(l); });
  const title = b.kind === "flight" ? b.title : b.title.replace(/\s*\(~?\$[^)]*\)/, "");
  const lines = L.length ? [] : b.kind === "flight" ? b.lines : [];
  openSheet(`<div class="bkd" style="--wk:${k[2]}"><small>${icon(k[1])}${k[0]} · ${esc(b.when)}</small><div class="sname">${esc(title)}</div>${chip(b.status)}

    ${legsHtml ? `<div class="bkl-wrap">${legsHtml}</div>` : ""}
    ${bkFields(b)}
    ${lines.length ? `<ul class="bklines">${lines.map(l => `<li>${esc(l)}</li>`).join("")}</ul>` : ""}
    <h4>Boarding passes, tickets &amp; QR codes</h4>
    ${P.length ? P.map(w => `<div class="bkpass">${w.code ? `<div class="wbig">${esc(w.code)}</div>` : ""}${w.pic ? `<img class="wimg" data-wimg="${w.id}" alt="Saved pass for ${esc(b.title)}">` : ""}<div class="bkpm"><span>${esc(w.title)}</span><button type="button" class="linkbtn" data-wdel="${w.id}">Remove</button></div></div>`).join("") : `<p class="small muted">Nothing saved yet. Add a screenshot of the ${b.kind === "flight" ? "boarding pass" : "ticket or confirmation"}, so it opens even with no signal.</p>`}
    <button type="button" class="btn solid wadd" data-bkadd="${key}">${icon("tag")}${P.length ? "Add another" : b.kind === "flight" ? "Add boarding pass" : "Add ticket or confirmation"}</button>
    ${guide ? `<details class="bkguide"><summary>${icon("plane")}${esc(guide.title)}</summary><ol class="steps">${guide.steps.map(x => `<li>${esc(x)}</li>`).join("")}</ol></details>` : ""}
    ${x.mine ? `<button type="button" class="btn su-wide" data-susetup style="margin-top:10px">Edit my flights</button>` : ""}${b.kind === "flight" ? `<p class="small muted" style="margin-top:12px">Turn your screen brightness up for scanners.</p>` : ""}</div>`);
  walletPics(document.querySelector(".sheet"));

// Bookings grouped by city, in trip order.
const BKAREA = [["out", "Flying out", "#1f4e9a", "Sarasota → Tokyo → Sài Gòn"], ["hcmc", "Sài Gòn", "#c4561a", "Dec 6–7"], ["hoian", "Hội An & Đà Nẵng", "#c62a2a", "Dec 7–9"], ["hanoi", "Hà Nội", "#2a7148", "Dec 9–13"], ["blr", "Bangalore", "#7a4bb0", "Dec 13–22"], ["kmc", "Karamchedu", "#8a5a00", "Dec 22–24"], ["hyd", "Hyderabad & home", "#4c4330", "Dec 24–27"]];
function bkRow(key){
  const b = bkItem(key), x = b.x, k = WKIND[b.kind] || WKIND.other;
  const sub = b.kind === "flight" ? (x.legs && x.ref ? `${x.legs.join(" · ")} · ref ${x.ref}` : x.legs && x.status === "booked" ? x.legs.join(" · ") : x.detail) : x.note || "";
  return `<div class="row bkrow" data-bk="${key}" style="--wk:${k[2]}"><div class="when"><span class="bkk">${icon(k[1])}${k[0]}</span>${esc(b.when)}</div><div class="what">${esc(b.kind === "flight" ? b.title : b.title.replace(/\s*\(~?\$[^)]*\)/, ""))}</div>${chip(b.status)}${sub ? `<div class="detail">${esc(sub)}</div>` : ""}${bkTag(key)}</div>`;
}
function bkByCity(){
  const all = [["f", T.flights], ["t", T.transfers], ["r", T.reservations]].flatMap(([t, A]) => (A || []).map((x, i) => [t + ":" + i, x])).filter(([, x]) => !x.pb || PB());
  const tm = w => { const m = (w || "").match(/(\d{1,2})(?::(\d\d))?\s*(AM|PM)/i); if (m) return (+m[1] % 12 + (/pm/i.test(m[3]) ? 12 : 0)) * 60 + +(m[2] || 0);
    return /morning/i.test(w) ? 540 : /lunch/i.test(w) ? 720 : /dinner/i.test(w) ? 1140 : /late/i.test(w) ? 1320 : 600; };
  const sk = k => { const b = bkItem(k); return (b.date || "2026-12-99") + String(tm(b.when)).padStart(5, "0"); };
  return BKAREA.map(([a, name, col, sub]) => { const R = all.filter(([, x]) => (x.area || "hanoi") === a).sort((p, q) => sk(p[0]) < sk(q[0]) ? -1 : 1); if (!R.length) return "";
    const open = R.filter(([, x]) => x.status !== "booked").length;
    return `<section class="bkcity" style="--city:${col}"><div class="bkch"><div><h2>${esc(name)}</h2><small>${esc(sub)}</small></div><span>${R.length - open}/${R.length} booked</span></div><div class="card">${R.map(([k]) => bkRow(k)).join("")}</div></section>`; }).join("");
}

}

    const n = flNow(l), d = Date.parse(l.dep), a = Date.parse(l.arr);

  if (fm) h = h.replace('<div class="swall">', '<div class="swall">' + fm);
  return uxMoment(d, h);
};

// 6 · Driver card: the place in big Vietnamese with a photo, plus Play, Copy and Grab.
driverView = function(big, sub){
  const p = T.places.find(x => x.vi === big) || null, C = p && COORD(p.name), ask = "Làm ơn chở tôi đến";

      ${sub ? `<div class="ad">${esc(sub)}</div>` : ""}${p && p.photo ? `<div class="ph" data-lead="${esc(p.photo)}"></div>` : ""}</div>
    <div class="uxdrv-b" lang="en"><button type="button" class="btn pri" data-say="${esc(ask + ": " + big + (sub ? ". " + sub : ""))}">${SPK}Play</button><button type="button" class="btn" data-copy="${esc(sub ? big + ", " + sub : big)}">Copy</button><a class="btn go" href="${grab}">Grab</a></div>`;

// 7 · Stays in the Plan style: nights strip, then one row per stay on a line, with the problem nights called out.
function uxStayRow(s){
  const [line, tone] = stayStatusLine(s), n = nightsOf(s), city = VIN(s.city.replace("Ho Chi Minh City", "Saigon")) || s.city;
  const A = parse(s.start), B = parse(s.end), d = A.getMonth() === B.getMonth() ? `${MON[A.getMonth()]} ${A.getDate()}–${B.getDate()}` : `${MON[A.getMonth()]} ${A.getDate()} – ${MON[B.getMonth()]} ${B.getDate()}`;
  if (s.status === "todo") return `<a class="uxsr todo" href="#stay-${esc(s.id)}" style="--city:${stayCol(s)}"><i class="dot"></i><span class="tx"><small>${esc(d)} · ${esc(city)}</small><b>Not booked yet</b><em>${n} night${n > 1 ? "s" : ""} to book</em></span><span class="btn pri">Find a stay</span></a>`;
  const note = (s.notes || []).find(x => /overlap/i.test(x)), c = stayCancel(s);
  return `<a class="uxsr" href="#stay-${esc(s.id)}" style="--city:${stayCol(s)}"><i class="dot"></i><span class="ph" data-lead="${esc(STAYPH[s.id] || s.photo || s.city)}"></span><span class="tx"><small>${esc(d)} · ${esc(city)}</small><b>${esc(s.name.replace(/\s*\(to book\)/, ""))}</b><em class="${tone}">${esc(s.status === "maybe" ? "Not decided yet" : tone === "ok" ? line : s.checkin ? "Check in " + s.checkin.replace(/^\w{3} \w{3} \d+,?\s*/, "") : line)}</em></span>
    ${note ? `<span class="uxsn">${esc(note.split(".")[0])}${c && c.left >= 0 ? ` · free cancel till ${esc(fmt(c.iso))}` : ""}</span>` : ""}</a>`;
}
const _uxStays = staysStreet;
staysStreet = function(){
  if (!UXBL() || /^#stay-/.test(location.hash)) return _uxStays();
  const V = T.stays.filter(VNStay), nights = V.filter(s => s.status !== "maybe").reduce((a, s) => a + nightsOf(s), 0);
  return `<div class="uxst-h"><h2>${nights} nights, ${V.length} stays</h2></div>${nightsStrip()}<div class="uxsl">${V.map(uxStayRow).join("")}</div>`;
};

// Explore: "Continue reading" first, for the read you're part way through.
const _uxExplore = exploreStreet;
exploreStreet = function(){
  const h = _uxExplore(); if (!UXBL()) return h;
  const RM = readMap(), ids = ["vietnam", ...Object.keys(XCITY), ...XCUL], S = ids.map(id => T.stories.find(x => x.id === id)).filter(Boolean);
  const pct = s => { const n = s.sections.filter(x => !/^(read more|on your itinerary)$/i.test(x)).length; return Math.min(100, Math.round((RM[s.id] || 0) / (n || 1) * 100)); };
  const s = S.find(x => pct(x) > 0 && pct(x) < 100); if (!s) return h;
  const n = s.sections.filter(x => !/^(read more|on your itinerary)$/i.test(x)).length, r = RM[s.id] || 0, left = Math.max(1, Math.round(s.minutes * (1 - r / n)));
  const card = `<h3 class="uxh">Continue reading</h3><a class="card uxcr" href="#story-${s.id}" data-gosec="s${Math.min(r + 1, s.sections.length)}"><span class="ph" data-lead="${esc(s.hero)}"></span><span class="tx"><b>${esc(XCITY[s.id] ? XCITY[s.id][0] : s.title)}</b><small>Chapter ${Math.min(r + 1, n)} of ${n} · about ${left} min left</small><span class="uxbar sm"><i style="width:${pct(s)}%"></i></span></span><span class="go">${icon("play")}</span></a>`;
  return h.replace('<div class="dyk">', card + '<div class="dyk">');
};

// While flight mode is up it carries the boarding pass, so the now card doesn't show a second one; both refresh together.
const _uxNowNext = nowNextHtml;
nowNextHtml = function(d){ if (!UXBL() || !uxJourney()) return _uxNowNext(d); const L = liveLeg(); return nowStreetHtml(d, L ? L.l.no : undefined); };
const _uxFillNow = fillNow;
fillNow = function(){ _uxFillNow(); const el = document.getElementById("uxfm"); if (!el || !UXBL()) return; const h = uxFlightMode();
  if (!h) { el.remove(); return; } const t = document.createElement("div"); t.innerHTML = h; const n = t.firstElementChild; el.replaceWith(n); if (typeof hydrate === "function") hydrate(n); };

// ===== Nov 10 deep-look ideas =====
if (!ICP2.dir) ICP2.dir = '<path d="M3 11 21 3l-8 18-2-8z"/>';
if (!ICP2.chev) ICP2.chev = '<path d="m9 6 6 6-6 6"/>';

// 2 · What now?: one compact list, the whole row opens the place, a small arrow gives directions.
const _uxWN = whatNowCards;
whatNowCards = function(){
  if (!UXBL()) return _uxWN();
  if (WN.n === 3) WN.n = 6;
  const W = whatNow(), K = MOg().spotKinds || {};

  const rows = W.list.slice(0, WN.n).map((x, i) => { const p = placeByName(x.name);

  return `${WN.here ? "" : `<p class="small muted uxwn-note">Times are from the city center until you tap Use where I am.</p>`}<div class="card uxwnl">${rows}</div>${W.list.length > WN.n ? `<button class="btn" data-wnmore style="margin-top:8px">Show more</button>` : ""}`;
};
// The arrow opens directions without also opening the place card.
document.addEventListener("click", e => { if (e.target.closest(".uxwn .go")) e.stopPropagation(); }, true);
document.addEventListener("click", e => { if (e.target.closest("[data-wnmore]")) setTimeout(() => { const l = document.getElementById("wn-list"); if (l && typeof hydrate === "function") hydrate(l); }, 0); });

// 3 · Photo hunt: today's city first and open; the other sections fold, each with a found count.
const UXHUNT = {};
const _uxHunt = huntPage;
huntPage = function(){
  if (!UXBL()) return _uxHunt();
  const F = huntFound(), items = HUNT(), me = scoreAll().find(s => s.me) || { hunt: 0, bonus: 0 }, iso = todayIso(), b = bountyFor(iso), d = dayOf(iso);
  const tile = h => { const f = F[h[0]]; return `<button type="button" class="ht t${h[1]}${f ? " got" : ""}${b && b[0] === h[0] ? " bounty" : ""}" data-hunt="${h[0]}"><span class="ht-p">${h[1]}</span><span class="ht-img" data-himg="${f ? h[0] : ""}">${f ? "" : `<i class="ht-e" aria-hidden="true">${huntEmo(h[0])}</i><i class="ht-cam">${ico("camera")}</i>`}</span><span class="ht-t">${esc(h[2])}</span>${h[3] ? `<span class="ht-c">${esc(CITYLBL[h[3]])}</span>` : ""}</button>`; };
  const here = d && VN(d.city) ? d.city : null;
  const S = [];
  if (here) S.push(["here", `Here in ${CITYLBL[here]}`, items.filter(h => h[3] === here)]);
  S.push(["every", "Everyday finds · 1 pt", items.filter(h => h[1] === 1)]);
  S.push(["city", here ? "Other cities · 3 pts" : "City finds · 3 pts", items.filter(h => h[1] === 3 && h[3] !== here)]);
  S.push(["rare", "Rare finds · 5 pts", items.filter(h => h[1] === 5 && h[3] !== here)]);
  const secs = S.filter(s => s[2].length).map(([k, t, list], i) => { const got = list.filter(h => F[h[0]]).length, open = k in UXHUNT ? UXHUNT[k] : i === 0;
    return `<details class="uxhs" data-uxhs="${k}"${open ? " open" : ""}><summary><span class="t">${esc(t)}</span><span class="c${got === list.length ? " all" : ""}">${got} of ${list.length}</span>${icon("chev")}</summary><div class="hgrid">${list.map(tile).join("")}</div></details>`; }).join("");
  return `<a class="btn back-link" href="#games">← Games</a><h2>Photo hunt</h2>
    <div class="card hunt-top"><div><b>${me.hunt + me.bonus} pts</b><span class="small muted">${Object.keys(F).length} of ${items.length} found</span></div><a class="btn" href="#board">Leaderboard</a></div>
    ${b ? `<div class="card bounty-c"><span class="small">Today's bounty · double points</span><b>${esc(b[2])}</b></div>` : ""}
    <p class="small muted" style="margin:10px 0 4px">Spot it, tap it, take the photo. Photos stay on your phone. Show them off at the finale.</p>
    ${secs}
    <h3>Finale</h3><div class="card"><p style="margin:0 0 10px">On the last night, everyone opens their recap and goes round the table item by item. Then crown the winner on the leaderboard.</p><div class="btns" style="margin:0"><button class="btn solid" data-recap>Make my recap</button></div></div>
    <input type="file" accept="image/*" capture="environment" id="hunt-cam" hidden>`;
};
document.addEventListener("toggle", e => { const d = e.target; if (d && d.dataset && d.dataset.uxhs) UXHUNT[d.dataset.uxhs] = d.open; }, true);

// 4 · Places by day, like the Plan. During the trip today's day comes first; earlier days go to the end.
const _uxPlaces = views.places;
views.places = function(){
  if (!UXBL()) return _uxPlaces.call(views);
  const all = [...new Set(T.places.map(p => p.city))], pick = typeof PLC !== "undefined" && PLC && all.includes(PLC) ? PLC : "";
  const seen = new Set(), iso = todayIso(), row = p => `<div class="row prow uxpr" data-place="${p.id}" role="button" tabindex="0" aria-label="${esc(p.name)}, details">${p.photo ? `<div class="ph pthumb" data-lead="${esc(p.photo)}"></div>` : `<div class="pthumb ph none-pin">${PIN}</div>`}<div class="what">${esc(p.name)}</div><span class="chev" aria-hidden="true">${icon("chev")}</span><div class="detail" lang="vi">${esc(p.vi)}${p.addr ? " · " + esc(p.addr) : ""}</div></div>`;
  const groups = T.days.filter(d => VN(d.city)).map(d => { const ps = [];
    (d.items || []).forEach(x => { if (x[2] === "cancelled") return; placesFor(x[1], d.city).forEach(p => { if (!seen.has(p.id)) { seen.add(p.id); ps.push(p); } }); });
    return { d, ps: ps.filter(p => !pick || p.city === pick) }; }).filter(g => g.ps.length);
  const ti = groups.findIndex(g => g.d.date >= iso), during = iso >= T.days[0].date && ti > 0;
  const order = during ? groups.slice(ti).concat(groups.slice(0, ti)) : groups;
  const rest = T.places.filter(p => !seen.has(p.id) && (!pick || p.city === pick));
  const head = (g, i) => `${during && i === groups.length - ti ? `<h3 class="uxpl-ear">Earlier days</h3>` : ""}<div class="uxpl-h"><small>${g.d.date === iso ? "Today" : esc(uxDate(g.d.date))} · ${esc(VIN(CITYLBL[g.d.city] || g.d.city))}</small><b>${esc(g.d.title || "")}</b></div>`;
  return `${seg("places")}<div class="mapchips plcchips">${["", ...all].map(c => `<button type="button" class="chipbtn" data-plc="${esc(c)}" aria-pressed="${pick === c}">${c ? esc(VIN(c)) : "All"}</button>`).join("")}</div><p class="small muted" style="margin:0">Every spot in the plan, day by day. Tap one for the address, Google Maps and a card to show your driver.</p>
    ${order.map((g, i) => `${head(g, i)}<div class="card uxplc">${g.ps.map(row).join("")}</div>`).join("")}
    ${rest.length ? `<div class="uxpl-h"><small>Not on a day yet</small><b>Other spots</b></div><div class="card uxplc">${rest.map(row).join("")}</div>` : ""}`;
};

// 6 · One spelling for the cities on screen: Đà Nẵng, Hội An, Hà Nội, Sài Gòn, Ninh Bình.
// Display only (the data keeps plain spellings so matching keeps working). Names like "Saigon Central Post Office" or "Capella Hanoi" stay as they are.
const UXSP = { "Da Nang": "Đà Nẵng", "Hoi An": "Hội An", "Hanoi": "Hà Nội", "Saigon": "Sài Gòn", "Ninh Binh": "Ninh Bình" };
const UXSP_RE = /(?<![\p{L}\d])(?<!(?:Capella|Anan|Embassy|Hospital|Vinmec|Saigon) )(Da Nang|Hoi An|Hanoi|Saigon|Ninh Binh)(?![\p{L}\d])(?!\s+[\p{Lu}\d])/gu;
const uxSpText = n => { const v = n.nodeValue; if (!v || v.length < 5 || !/Da Nang|Hoi An|Hanoi|Saigon|Ninh Binh/.test(v)) return;
  const p = n.parentElement; if (!p || p.closest("script,style,textarea,input,[contenteditable],[data-nosp]")) return;
  const nv = v.replace(UXSP_RE, m => UXSP[m]); if (nv !== v) n.nodeValue = nv; };
function uxSpell(root){
  if (!root) return; if (root.nodeType === 3) return uxSpText(root); if (root.nodeType !== 1) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT); let n; while ((n = w.nextNode())) uxSpText(n);
}
new MutationObserver(ms => { if (!UXBL()) return; for (const m of ms) m.addedNodes.forEach(uxSpell); }).observe(document.body, { childList: true, subtree: true });
if (UXBL()) uxSpell(document.body);

function launch(){
  if (!ME()) return picker();
  if (typeof edInit === "function") edInit(); T = scoped(FULL); if (typeof fxApply === "function") fxApply(); afterTripReady(); if (!LIVE.init){ LIVE.init = 1; liveInit(); } $("#tabs").hidden=false; current=null; route();
  setTimeout(()=>prefetchPhotos().catch(()=>{}), 4000);
}
function start(data){
  FULL = data; window.addEventListener("hashchange",()=>{ if(T && ME()) requestAnimationFrame(()=>route()); }); launch();
  // Tabs and section buttons replace the history entry, so the iPhone back-swipe can't flip between tabs.
  document.addEventListener("click",e=>{ const a=e.target.closest("#tabs a[href^='#'], nav.seg a[href^='#']"); if(!a) return; e.preventDefault(); const h=a.getAttribute("href");
    if (location.hash!==h){ history.replaceState(null,"",h); if(T && ME()) route(); } },true);
}

// Encrypted build: the trip data is locked with a shared trip passcode, entered once per phone.
async function unlock(pass, enc){
  const b = s => Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b(enc.salt), iterations:150000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b(enc.iv)}, key, b(enc.ct));
  if (enc.z) return JSON.parse(await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"))).text());
  return JSON.parse(new TextDecoder().decode(pt));
}
function lockScreen(enc, msg){
  $("#view").innerHTML = `<form class="lock" id="lockform"><div class="brand" style="font-size:30px">Vietnam<span>’26</span></div>
    <label for="pass" class="muted">Enter the trip passcode. You only need to do this once on this phone.</label>
    <input id="pass" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" enterkeyhint="go" placeholder="Trip passcode" required>
    <button class="btn solid">Unlock</button>${msg?`<div class="err">${esc(msg)}</div>`:""}</form>`;
  $("#lockform").addEventListener("submit", async e=>{ e.preventDefault(); const p=$("#pass").value.trim();
    try { const d = await unlock(p, enc); store.set("trip-pass", p); start(d); } catch(err){ lockScreen(enc, "That passcode didn't work. Check it with Praneeth and try again."); } });
}

if (window.TRIP) start(window.TRIP);
else if (window.TRIP_ENC){
  const saved = store.get("trip-pass");
  if (saved) unlock(saved, window.TRIP_ENC).then(start).catch(err=>{ if (window.TRIP_ENC.z && typeof DecompressionStream==="undefined"){ $("#view").innerHTML=`<div class="card" style="margin:24px 16px"><b>Update your iPhone to open the trip app.</b><p class="small">It needs iOS 16.4 or newer: Settings, General, Software Update.</p></div>`; return; } store.del("trip-pass"); lockScreen(window.TRIP_ENC); });
  else lockScreen(window.TRIP_ENC);
}
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && !/claude/.test(location.host)) {
  navigator.serviceWorker.register("sw.js").then(r=>{ r.update().catch(()=>{}); document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") r.update().catch(()=>{}); }); }).catch(()=>{});
  // A new version took over: reload once so it shows right away.
  let reloaded=false; const hadSW=!!navigator.serviceWorker.controller; navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(reloaded || !hadSW) return;
    // Don't pull the page out from under someone: wait while a guide plays, a sheet, search or a form is open.
    const busy = () => (typeof Player !== "undefined" && Player.playing) || document.querySelector(".sheet,#srch,.cstory") || (document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) || (typeof SU !== "undefined" && SU);
    const go = () => { if (reloaded) return; if (busy()) return setTimeout(go, 15000); reloaded=true; location.reload(); };
    if (busy()) { toast("Update ready. It loads when you're done here."); setTimeout(go, 15000); } else go(); });
}
})();
