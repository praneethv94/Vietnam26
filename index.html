// ── Nov 5 travel-app pass (patterns from Flighty, Apple Live Activities, Airbnb/TripIt) ──
// "Now" in ms for a flight. Test params ?d= and ?t= are read in the departure airport's time zone.
function flNow(l){
  const q = new URLSearchParams(location.search);
  if (!q.get("d") && !q.get("t")) return Date.now();
  const m = nowMin(), hh = String(Math.floor(m / 60)).padStart(2, "0"), mm = String(m % 60).padStart(2, "0");
  return Date.parse(`${todayIso()}T${hh}:${mm}:00${l.dep.slice(19)}`);
}
const lfDur = ms => { const m = Math.max(0, Math.round(ms / 6e4)), h = Math.floor(m / 60); return h ? `${h}h ${String(m % 60).padStart(2, "0")}m` : `${m}m`; };
// The flight that matters right now: from 3 hours before take-off to 45 minutes after landing.
function liveLeg(){
  for (const l of myLegs()) { if (!l.dep || !l.arr) continue;
    const n = flNow(l), d = Date.parse(l.dep), a = Date.parse(l.arr);
    if (n >= d - 3 * 36e5 && n <= a + 45 * 6e4) return { l, n, d, a }; }
  return null;
}
function liveFlightHtml(LL){
  const L = LL || liveLeg(); if (!L) return "";
  const { l, n, d, a } = L, board = d - (a - d > 4 * 36e5 ? 45 : 30) * 6e4;
  const off = (m => m ? (m[1] === "-" ? -1 : 1) * (+m[2] * 60 + +m[3]) * 6e4 : 0)(l.dep.match(/([+-])(\d\d):(\d\d)$/)), lt = ms => t12(new Date(ms + off).toISOString());
  const p = Math.min(1, Math.max(0, (n - d) / (a - d)));
  let st, sub, tone;
  if (n < board) { st = `Boards ${inTime(Math.round((board - n) / 6e4))}`; sub = `Boarding about ${lt(board)}`; tone = "ok"; }
  else if (n < d) { st = "Boarding now"; sub = `Doors close about 15 min before ${t12(l.dep)}`; tone = "go"; }
  else if (n < a) { st = `Lands ${inTime(Math.round((a - n) / 6e4))}`; sub = `In the air · ${lfDur(n - d)} flown`; tone = "air"; }
  else { st = "Landed"; sub = `Welcome to ${l.toName}`; tone = "done"; }
  const me = ME(), seat = (l.seats || "").split("·").map(s => s.trim()).find(s => me && s.startsWith(me));
  const key = l.mine ? "m:" + l.dir : (typeof bkFlightKey === "function" ? bkFlightKey(l.dep.slice(0, 10), "", l.no) : "");
  const chip = (k, v, dim) => `<span class="lfc${dim ? " dim" : ""}"><small>${k}</small><b>${esc(v)}</b></span>`;
  return `<button type="button" class="lflight t-${tone}" ${key ? `data-bkopen="${esc(key)}" data-bkleg="${esc(l.no)}"` : ""} aria-label="${esc(l.no)} ${esc(l.from)} to ${esc(l.to)}, ${esc(st)}">
    <span class="lf-top"><span class="lf-no">${icon("plane")}${esc(l.no)}</span><span class="lf-by">${esc(l.by)}</span><span class="lf-st">${esc(st)}</span></span>
    <span class="lf-route"><span class="lf-a"><b>${esc(l.from)}</b><em>${esc(t12(l.dep))}</em><small>${esc(l.fromName)}</small></span>
      <span class="lf-track" style="--p:${p.toFixed(3)}"><i class="lf-line"></i><i class="lf-done"></i><i class="lf-pl">${icon("plane")}</i><small>${esc(lfDur(a - d))}</small></span>
      <span class="lf-a r"><b>${esc(l.to)}</b><em>${esc(t12(l.arr))}${localDate(l.arr) !== localDate(l.dep) ? "<sup>+1</sup>" : ""}</em><small>${esc(l.toName)}</small></span></span>
    <span class="lf-sub">${esc(sub)}</span>
    <span class="lf-chips">${chip("Terminal", l.fromT || "–", !l.fromT)}${(G => G.changed ? `<span class="lfc chg"><small>New gate</small><b>${esc(G.g)}</b></span>` : chip("Gate", G.g || "Later", !G.g))(gateOf(l))}${chip("Seat", seat ? seat.split(" ").pop() : "–", !seat)}${chip("Arrive", l.toT ? "T " + l.toT.replace(/^International$/, "Intl") : "–", !l.toT)}</span>
  </button>`;
}

// Live chip in the header on every tab during the trip, like a Live Activity: what's next, tap for Today.
function liveChipHtml(){
  const d = typeof dayOf === "function" ? dayOf(todayIso()) : null; if (!d) return "";
  const L = liveLeg();
  const sh = m => m < 60 ? m + "m" : Math.floor(m / 60) + "h" + (m % 60 ? " " + (m % 60) + "m" : "");
  if (L) { const { l, n, d: dp, a } = L; return `<a class="lchip" href="#today" aria-label="${esc(l.no)}, open Today">${icon("plane")}<span><b>${esc(l.no)}</b> ${n < dp ? sh(Math.round((dp - n) / 6e4)) : n < a ? "lands " + sh(Math.round((a - n) / 6e4)) : "landed"}</span></a>`; }
  const { cur, nxt, now } = nowNext(d), x = nxt || cur; if (!x) return "";
  if (!nxt) return ""; // nothing timed coming: keep the page name
  const w = x.w.replace(/\s*\(.*?\)\s*/g, " ").split(/[.,;]/)[0].trim(), soon = x.exact && x.s - now < 60;
  const tm = x.exact ? `${(Math.floor(x.s / 60) % 24) % 12 || 12}:${String(x.s % 60).padStart(2, "0")} ${Math.floor(x.s / 60) % 24 < 12 ? "AM" : "PM"}` : tplate(x);

function uxJourney(){

}

// 4 · Leave-by: for the next timed stop with a known place, when to set off, with the ride and a Grab button.

function uxStayRow(s){
  const [line, tone] = stayStatusLine(s), n = nightsOf(s), city = VIN(s.city.replace("Ho Chi Minh City", "Saigon")) || s.city;
  const A = parse(s.start), B = parse(s.end), d = A.getMonth() === B.getMonth() ? `${MON[A.getMonth()]} ${A.getDate()}–${B.getDate()}` : `${MON[A.getMonth()]} ${A.getDate()} – ${MON[B.getMonth()]} ${B.getDate()}`;
  if (s.status === "todo") return `<a class="uxsr todo" href="#stay-${esc(s.id)}" style="--city:${stayCol(s)}"><i class="dot"></i><span class="tx"><small>${esc(d)} · ${esc(city)}</small><b>Not booked yet</b><em>${n} night${n > 1 ? "s" : ""} to book</em></span><span class="btn pri">Find a stay</span></a>`;
  const note = (s.notes || []).find(x => /overlap/i.test(x)), c = stayCancel(s);
  return `<a class="uxsr" href="#stay-${esc(s.id)}" style="--city:${stayCol(s)}"><i class="dot"></i><span class="ph" data-lead="${esc(STAYPH[s.id] || s.photo || s.city)}"></span><span class="tx"><small>${esc(d)} · ${esc(city)}</small><b>${esc(s.name.replace(/\s*\(to book\)/, ""))}</b><em class="${tone}">${esc(s.status === "maybe" ? "Not decided yet" : tone === "ok" ? line : s.checkin ? "Check in " + s.checkin.replace(/^\w{3} \w{3} \d+,?\s*/, "") : line)}</em></span>
    ${note ? `<span class="uxsn">${esc(note.split(".")[0])}${c && c.left >= 0 ? ` · free cancel till ${esc(fmt(c.iso))}` : ""}</span>` : ""}</a>`;
}
const _uxStays = staysStreet;
staysStreet = function(){
  if (!UXBL() || /^#stay-/.test(location.hash)) return _uxStays();
  const V = T.stays.filter(VNStay), nights = V.filter(s => s.status !== "maybe").reduce((a, s) => a + nightsOf(s), 0);
  return `<div class="uxst-h"><h2>${nights} nights, ${V.length} stays</h2></div>${nightsStrip()}<div class="uxsl">${V.map(uxStayRow).join("")}</div>`;
};

// Explore: "Continue reading" first, for the read you're part way through.
const _uxExplore = exploreStreet;
exploreStreet = function(){
  const h = _uxExplore(); if (!UXBL()) return h;
  const RM = readMap(), ids = ["vietnam", ...Object.keys(XCITY), ...XCUL], S = ids.map(id => T.stories.find(x => x.id === id)).filter(Boolean);
  const pct = s => { const n = s.sections.filter(x => !/^(read more|on your itinerary)$/i.test(x)).length; return Math.min(100, Math.round((RM[s.id] || 0) / (n || 1) * 100)); };
  const s = S.find(x => pct(x) > 0 && pct(x) < 100); if (!s) return h;
  const n = s.sections.filter(x => !/^(read more|on your itinerary)$/i.test(x)).length, r = RM[s.id] || 0, left = Math.max(1, Math.round(s.minutes * (1 - r / n)));
  const card = `<h3 class="uxh">Continue reading</h3><a class="card uxcr" href="#story-${s.id}" data-gosec="s${Math.min(r + 1, s.sections.length)}"><span class="ph" data-lead="${esc(s.hero)}"></span><span class="tx"><b>${esc(XCITY[s.id] ? XCITY[s.id][0] : s.title)}</b><small>Chapter ${Math.min(r + 1, n)} of ${n} · about ${left} min left</small><span class="uxbar sm"><i style="width:${pct(s)}%"></i></span></span><span class="go">${icon("play")}</span></a>`;
  return h.replace('<div class="dyk">', card + '<div class="dyk">');
};

const _uxNowNext = nowNextHtml;
nowNextHtml = function(d){ if (!UXBL() || !uxJourney()) return _uxNowNext(d); const L = liveLeg(); return nowStreetHtml(d, L ? L.l.no : undefined); };
const _uxFillNow = fillNow;
fillNow = function(){ _uxFillNow(); const el = document.getElementById("uxfm"); if (!el || !UXBL()) return; const h = uxFlightMode();
  if (!h) { el.remove(); return; } const t = document.createElement("div"); t.innerHTML = h; const n = t.firstElementChild; el.replaceWith(n); if (typeof hydrate === "function") hydrate(n); };

function launch(){
  if (!ME()) return picker();
  if (typeof edInit === "function") edInit(); T = scoped(FULL); if (typeof fxApply === "function") fxApply(); afterTripReady(); if (!LIVE.init){ LIVE.init = 1; liveInit(); } $("#tabs").hidden=false; current=null; route();
  setTimeout(()=>prefetchPhotos().catch(()=>{}), 4000);
}
function start(data){
  FULL = data; window.addEventListener("hashchange",()=>{ if(T && ME()) requestAnimationFrame(()=>route()); }); launch();
  // Tabs and section buttons replace the history entry, so the iPhone back-swipe can't flip between tabs.
  document.addEventListener("click",e=>{ const a=e.target.closest("#tabs a[href^='#'], nav.seg a[href^='#']"); if(!a) return; e.preventDefault(); const h=a.getAttribute("href");
    if (location.hash!==h){ history.replaceState(null,"",h); if(T && ME()) route(); } },true);
}

// Encrypted build: the trip data is locked with a shared trip passcode, entered once per phone.
async function unlock(pass, enc){
  const b = s => Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b(enc.salt), iterations:150000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b(enc.iv)}, key, b(enc.ct));
  if (enc.z) return JSON.parse(await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"))).text());
  return JSON.parse(new TextDecoder().decode(pt));
}
function lockScreen(enc, msg){
  $("#view").innerHTML = `<form class="lock" id="lockform"><div class="brand" style="font-size:30px">Vietnam<span>’26</span></div>
    <label for="pass" class="muted">Enter the trip passcode. You only need to do this once on this phone.</label>
    <input id="pass" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" enterkeyhint="go" placeholder="Trip passcode" required>
    <button class="btn solid">Unlock</button>${msg?`<div class="err">${esc(msg)}</div>`:""}</form>`;
  $("#lockform").addEventListener("submit", async e=>{ e.preventDefault(); const p=$("#pass").value.trim();
    try { const d = await unlock(p, enc); store.set("trip-pass", p); start(d); } catch(err){ lockScreen(enc, "That passcode didn't work. Check it with Praneeth and try again."); } });
}

if (window.TRIP) start(window.TRIP);
else if (window.TRIP_ENC){
  const saved = store.get("trip-pass");
  if (saved) unlock(saved, window.TRIP_ENC).then(start).catch(err=>{ if (window.TRIP_ENC.z && typeof DecompressionStream==="undefined"){ $("#view").innerHTML=`<div class="card" style="margin:24px 16px"><b>Update your iPhone to open the trip app.</b><p class="small">It needs iOS 16.4 or newer: Settings, General, Software Update.</p></div>`; return; } store.del("trip-pass"); lockScreen(window.TRIP_ENC); });
  else lockScreen(window.TRIP_ENC);
}
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && !/claude/.test(location.host)) {
  navigator.serviceWorker.register("sw.js").then(r=>{ r.update().catch(()=>{}); document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") r.update().catch(()=>{}); }); }).catch(()=>{});
  // A new version took over: reload once so it shows right away.
  let reloaded=false; const hadSW=!!navigator.serviceWorker.controller; navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(reloaded || !hadSW) return;
    // Don't pull the page out from under someone: wait while a guide plays, a sheet, search or a form is open.
    const busy = () => (typeof Player !== "undefined" && Player.playing) || document.querySelector(".sheet,#srch,.cstory") || (document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) || (typeof SU !== "undefined" && SU);
    const go = () => { if (reloaded) return; if (busy()) return setTimeout(go, 15000); reloaded=true; location.reload(); };
    if (busy()) { toast("Update ready. It loads when you're done here."); setTimeout(go, 15000); } else go(); });
}
})();
