  background:rgb(255 255 255/.55);-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);box-shadow:inset 0 0 0 1px rgb(255 255 255/.7),0 4px 14px rgb(20 40 80/.12)}

/* ── Nov 5 round 2 ── */

/* Check-in card. */

/* Trip map button and sheet. */

.tm-list{display:grid;gap:6px;padding-top:6px}

.tm-row.now{box-shadow:inset 0 0 0 2px var(--city)}

/* ── Nov 5 round 3: liquid glass wallet, gates, Ninh Bình spur ── */
.wcard{background:linear-gradient(150deg,color-mix(in srgb,var(--c2) 70%,transparent),color-mix(in srgb,var(--c1) 84%,transparent));
  -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);overflow:hidden;

  background:radial-gradient(120% 70% at 0% 0%,rgb(255 255 255/.32),transparent 55%),linear-gradient(180deg,rgb(255 255 255/.14),transparent 30%)}

.wc-f{grid-template-columns:minmax(0,.8fr) minmax(0,1fr) minmax(0,.9fr) minmax(0,1.45fr);gap:5px}.wc-f .wf{padding:8px 7px}.wf b{font-size:14px}
.wc-track{display:flex;align-items:center;gap:10px;margin:12px 16px 0;min-height:52px;padding:8px 14px;border-radius:14px;text-decoration:none;color:#fff;
  background:rgb(255 255 255/.18);box-shadow:inset 0 0 0 1px rgb(255 255 255/.38),inset 0 1px 0 rgb(255 255 255/.55)}
.wc-track .ic2{width:20px;height:20px;color:#f2c94c;flex:none}.wc-track span{flex:1;display:grid}.wc-track b{font:800 14.5px var(--body)}.wc-track small{font:600 12px var(--body);color:rgb(255 255 255/.75)}
.wc-track i{font-style:normal;font-weight:800;opacity:.8}
.wc-f .wf.chg{background:#da251d}
.wcard .wc-qr{padding-top:10px}
.wc-ck{font:800 12px var(--body);font-style:normal;padding:4px 9px;border-radius:999px;background:rgb(255 255 255/.22);box-shadow:inset 0 0 0 1px rgb(255 255 255/.35);white-space:nowrap}
.wc-ck.on{background:#2e8b57;box-shadow:none}

.wc-ckrow i{font-style:normal;font-weight:800}

  background:rgb(255 255 255/.7);-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);box-shadow:inset 0 0 0 1px rgb(255 255 255/.8),0 6px 18px rgb(20 40 80/.18)}

/* ===== Motion pass (Nov 9): one spring system for the whole app. Code in motion.js. ===== */
:root{
  --mo-bounce:linear(0,0.028,0.097,0.19,0.299,0.41,0.519,0.624,0.716,0.797,0.867,0.922,0.967,1,1.024,1.041,1.051,1.055,1.056,1.054,1.049,1.044,1.038,1.031,1.025,1.02,1.014,1.01,1.007,1.004,1.001,1,0.998,0.998,0.997,0.997,0.997,0.997,0.997,0.998,1);
  --mo-soft:linear(0,0.02,0.068,0.135,0.213,0.296,0.38,0.461,0.538,0.61,0.674,0.732,0.783,0.827,0.864,0.896,0.922,0.943,0.961,0.975,0.985,0.994,1,1.004,1.007,1.009,1.01,1.011,1.011,1.01,1.01,1.009,1.008,1.007,1.006,1.005,1.004,1.004,1.003,1.003,1);
  --mo-snap:linear(0,0.02,0.068,0.13,0.2,0.274,0.351,0.422,0.489,0.551,0.61,0.661,0.706,0.748,0.783,0.814,0.841,0.866,0.886,0.903,0.919,0.931,0.942,0.951,0.959,0.966,0.971,0.976,0.98,0.984,0.986,0.989,0.991,0.992,0.994,0.995,0.996,0.996,0.997,0.998,1);
}
/* The page container no longer holds its end pose, so drags and sheet depth can move it. */
#view,#view[data-anim]{animation-fill-mode:backwards!important}

/* --- Press: one touch-down and spring-back everywhere (motion.js adds the classes) --- */
.mo-prs{scale:var(--mo-ps,.97);transition:scale .13s cubic-bezier(.3,.7,.4,1)!important}
.mo-prs-out{transition:scale .5s var(--mo-bounce)!important}
/* The older per-element press scales step aside so nothing shrinks twice. */
html.mo-touch.street a.card:active,html.mo-touch.street .btn:active,html.mo-touch .pday:active,html.mo-touch .pmc:active,html.mo-touch .chipbtn:active,html.mo-touch .srch-hit:active,html.mo-touch .pcirc:active i,html.mo-touch .xt:active,html.mo-touch a.card:active,html.mo-touch .itile:active,html.mo-touch .tile .viw:active,html.mo-touch .tlnew:active,html.mo-touch .lflight:active,html.mo-touch .tile:active,html.mo-touch .btn:active,html.mo-touch details.day summary:active,html.mo-touch .legbar a:active,html.mo-touch .say:active,html.mo-touch .mp button:active,html.mo-touch .ptile:active .ph{transform:none}

/* --- Tab bar: the highlight is one pill that glides between tabs --- */
html.street nav.tabs a:not(.tmid) svg,html.street nav.tabs a:not(.tmid)[aria-current="page"] svg,html[data-gl="1"].street nav.tabs a:not(.tmid)[aria-current="page"] svg{width:46px;height:30px;padding:3px 11px;box-sizing:border-box;border-radius:999px;background:none;box-shadow:none;position:relative;z-index:1;transition:color .2s}
html.street nav.tabs .pill{display:block;position:absolute;left:0;top:0;width:46px;height:30px;border:0;border-radius:999px;z-index:0;pointer-events:none;background:linear-gradient(180deg,#2b63bd,#1f4e9a);box-shadow:inset 0 1px 0 rgb(255 255 255/.35),0 3px 10px rgb(31 78 154/.3);transform:translate3d(var(--px,0px),var(--py,0px),0) scale(var(--ps,1))!important;opacity:var(--po,0);transition:transform .52s var(--mo-bounce),opacity .18s ease}
html.street nav.tabs .pill.mo-still{transition:none}
html.street nav.tabs a[aria-current="page"] svg{animation:moTab .5s var(--mo-bounce)}
html.street nav.tabs a.tmid[aria-current="page"] svg{animation:moTabMid .55s var(--mo-bounce)}
@keyframes moTab{from{transform:scale(.72)}}
@keyframes moTabMid{from{transform:scale(.86)}}

/* --- Sheets: spring up, the page behind sinks back, and they animate away --- */
.sheet{animation:moSheetIn .5s var(--mo-snap) backwards;will-change:transform}
@keyframes moSheetIn{from{transform:translate3d(0,100%,0)}}
.sheet-bg{animation:fade .28s ease backwards}
.sheet[data-out],.sheet-bg[data-out]{pointer-events:none}
#view{transform-origin:50% var(--mo-oy,50%)}
body.mo-sheet #view{transform:scale(.962);transition:transform .5s var(--mo-snap)}
body.mo-sheet-out #view{transition:transform .34s var(--mo-snap)}
body.mo-sheet nav.tabs{transform:translate3d(0,6px,0) scale(.97);transition:transform .5s var(--mo-snap)}
nav.tabs{transition:transform .34s var(--mo-snap)}

/* --- Toasts spring in and slip out --- */
.toast{animation:moToast .5s var(--mo-bounce) backwards}
@keyframes moToast{from{opacity:0;transform:translate3d(-50%,18px,0) scale(.9)}}

/* --- Photo viewer: the picture grows out of its thumbnail --- */
.lightbox{animation:none;background:rgb(0 0 0/calc(.94 * var(--mo-lb,1)))}
.lightbox>p,.lightbox>button{opacity:var(--mo-lb,1);transition:opacity .2s}
.lightbox.mo-in>p,.lightbox.mo-in>button{animation:fade .3s .12s ease backwards}

/* --- Day pages: the next day rides in beside the current one while you swipe --- */
.dpage{touch-action:pan-y pinch-zoom}
.mo-ghost{position:fixed;inset:0;z-index:4;overflow:hidden;pointer-events:none;will-change:transform;contain:layout paint}
.mo-ghost>.wrap{display:grid;gap:16px;padding-block:16px;grid-template-columns:minmax(0,1fr)}
.mo-ghost>.wrap>*{min-width:0}

/* --- Hero photos drift a little slower than the page, and stretch when you pull down --- */
.dhero>.ph,.shero>.slides{will-change:transform}
.dhero,.shero{transform-origin:50% 100%}

/* --- Page changes (View Transitions): things open from where you tapped --- */
html[data-vt] header.top{view-transition-name:mo-top}
html[data-vt] nav.tabs{view-transition-name:mo-tabs}
html[data-vt] #view{animation:none!important}
html[data-vt="open"] #view>.dpage>.dhero,html[data-vt="close"] #view>.dpage>.dhero,html[data-vt="open"] #view>.reader>.cover,html[data-vt="close"] #view>.reader>.cover{view-transition-name:mo-hero}
::view-transition-group(*){animation-duration:.46s;animation-timing-function:var(--mo-soft)}
::view-transition-group(mo-top),::view-transition-group(mo-tabs){z-index:5}
::view-transition-old(mo-hero),::view-transition-new(mo-hero){width:100%;height:100%;object-fit:cover}
::view-transition-group(mo-hero){z-index:3;overflow:clip}
::view-transition-old(root),::view-transition-new(root){animation-duration:.32s;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
/* tabs: a quick cross-fade with a nudge toward the tab you picked */
html[data-vt="tab"]::view-transition-old(root){animation:moFadeOut .14s ease both}
html[data-vt="tab"]::view-transition-new(root){animation:moTabIn .34s var(--mo-snap) both}
@keyframes moFadeOut{to{opacity:0}}
@keyframes moFadeIn{from{opacity:0}}
@keyframes moTabIn{from{opacity:0;transform:translate3d(calc(var(--vt-dir,1) * 18px),0,0)}}
/* push and pop, like an iPhone navigation stack */
html[data-vt="push"]::view-transition-old(root){animation:moPushOld .46s var(--mo-snap) both}
html[data-vt="push"]::view-transition-new(root){animation:moPushNew .46s var(--mo-snap) both}
html[data-vt="pop"]::view-transition-old(root){animation:moPopOld .42s var(--mo-snap) both;z-index:2}
html[data-vt="pop"]::view-transition-new(root){animation:moPopNew .42s var(--mo-snap) both}
@keyframes moPushOld{to{transform:translate3d(-26%,0,0);opacity:.55}}
@keyframes moPushNew{from{transform:translate3d(100%,0,0)}}
@keyframes moPopOld{to{transform:translate3d(100%,0,0)}}
@keyframes moPopNew{from{transform:translate3d(-26%,0,0);opacity:.55}}
/* day to day with the arrows */
html[data-vt="next"]::view-transition-old(root){animation:moNextOld .44s var(--mo-snap) both}
html[data-vt="next"]::view-transition-new(root){animation:moPushNew .44s var(--mo-snap) both}
html[data-vt="prev"]::view-transition-old(root){animation:moPopOld .44s var(--mo-snap) both}
html[data-vt="prev"]::view-transition-new(root){animation:moPrevNew .44s var(--mo-snap) both}
@keyframes moNextOld{to{transform:translate3d(-100%,0,0)}}
@keyframes moPrevNew{from{transform:translate3d(-100%,0,0)}}
/* a card opening into its page, and folding back */
html[data-vt="open"]::view-transition-old(root){animation:moFadeOut .2s ease both}
html[data-vt="open"]::view-transition-new(root){animation:moOpenNew .4s cubic-bezier(.2,.8,.2,1) both}
html[data-vt="close"]::view-transition-old(root){animation:moFadeOut .22s ease both}
html[data-vt="close"]::view-transition-new(root){animation:moFadeIn .3s ease both}
@keyframes moOpenNew{from{opacity:0;transform:translate3d(0,22px,0)}}
html[data-vt="fade"]::view-transition-old(root){animation:moFadeOut .16s ease both}
html[data-vt="fade"]::view-transition-new(root){animation:moFadeIn .26s ease both}

/* --- Sections settle in after a tab change (motion.js runs these) --- */
details.mo-acc{overflow:hidden}

@media (prefers-reduced-motion: reduce){
  .mo-prs,.mo-prs-out{scale:none}
  body.mo-sheet #view,body.mo-sheet nav.tabs{transform:none}
  ::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}
}

function tripNow(){

async function wikiLead(title){

let WN = { here: null, n: 3 };
function openAt(S, h, wd){
  if (S[3] && !S[3].includes(wd)) return null;
  for (const [a,b] of S[2]){ if (h >= a && h < b - 0.25) return b; if (h + 24 >= a && h + 24 < b - 0.25) return b - 24; }
  return null;
}
function rainPct(city, iso){ try{ return JSON.parse(store.get("wx-"+city)||"null")?.days?.[iso]?.p ?? null; }catch(e){ return null; } }
function whatNow(){
  const iso = todayIso(), d = dayOf(iso), wd = parse(iso).getDay(), h = nowH();
  const city = d && VN(d.city) ? d.city : "hcmc", M = (MOg().maps||{})[MAPCITY(city)];
  const origin = WN.here || (M && M.c), rain = rainPct(city, iso);
  const planned = new Set((d ? d.items : []).flatMap(x=>placesFor(x[1], d.city)).map(p=>p.name));
  const meal = (h>=11 && h<14) || (h>=17.5 && h<21), coffee = (h>=7 && h<11) || (h>=14 && h<17.5), late = h>=18;
  const out = [];
  for (const [name, S] of Object.entries(MOg().spots||{})){
    const C = COORD(name); if (!C || !origin) continue;
    const km = hav(origin, C)*1.3; if (km > 12) continue;
    const till = openAt(S, h, wd); if (till == null) continue;
    let score = -km*1.6;
    if (S[0]==="eat" && meal) score += 3; if (S[0]==="coffee" && coffee) score += 2.5;
    if ((S[0]==="night"||S[0]==="walk") && late) score += 3; if ((S[0]==="night") && !late) score -= 2;
    if (rain!=null && rain>=50) score += S[1] ? 2 : -2.5;
    if (till - h < 1) score -= 2;
    if (planned.has(name)) score -= 1.5;
    out.push({ name, S, km, till, score, planned: planned.has(name) });
  }
  return { list: out.sort((a,b)=>b.score-a.score), rain, city, origin, d };
}
function getThere(km){
  const walk = Math.round(km/4.5*60), grab = Math.round(4 + km/20*60), fare = Math.max(30, Math.round((12 + km*14)/5)*5);
  return walk <= 20 ? `${walk} min walk` : `Grab ~${grab} min · ~${fare}k ₫`;
}

function cashFor(d){
  if (!d || !VN(d.city)) return null;
  const F = MOg().fees||{}, B = MOg().cashBase||{food:350000,ride:40000,buffer:200000};
  const names = [...new Set(d.items.flatMap(x=>placesFor(x[1], d.city)).map(p=>p.name))];
  const lines = [];
  names.forEach(n=>{ if (F[n]) lines.push([n, F[n]]); });
  const txt = d.items.map(x=>x[1]).join(" ").toLowerCase();
  const rides = (txt.match(/\bgrab\b|\bcar to\b|\bcar\b|taxi|transfer/g)||[]).length;
  const fine = /coco|\bgia\b|tasting menu|la maison|anan/.test(txt);
  lines.push([fine ? "Street food, coffee and snacks (dinner on card)" : "Meals, coffee and snacks", fine ? Math.round(B.food*0.6) : B.food]);
  if (rides) lines.push([`${rides} ride${rides>1?"s":""}, shared`, rides*B.ride]);
  lines.push(["Tips and small extras", B.buffer]);
  const total = lines.reduce((s,l)=>s+l[1],0);
  return { total, lines };
}

function factsForDay(d, n){

  const pool = [...F.filter(x=>names.has(x.f[1])), ...F.filter(x=>d && x.f[1]===d.city), ...F.filter(x=>x.f[1]==="all")];
  const seed = hashStr(d ? d.date : todayIso()), out = [], seen = new Set();
  const groups = [pool.filter(x=>names.has(x.f[1])), pool.filter(x=>d && x.f[1]===d.city), pool.filter(x=>x.f[1]==="all")];
  for (const g of groups){ if (!g.length) continue; const x = g[seed % g.length]; if (!seen.has(x.i)){ out.push(x); seen.add(x.i); } if (out.length >= n) break; }
  return out;

  const d = dayOf(todayIso()), city = d && VN(d.city) ? d.city : null;
  return FX().facts.map((f,i)=>({f,i})).filter(({f})=>{
    if (FD.cat==="All") return true;
    if (FD.cat==="Here") return city && (f[1]===city || placeCityKey(f[1])===city);
    return f[0]===FD.cat || (FD.cat==="History" && f[0]==="Nature");
  });
}
function deckShuffle(){ const L = deckList(); FD.order = L.map(x=>x.i).sort(()=>Math.random()-.5); FD.i = 0; }
function deckCur(){ if (!FD.order || !FD.order.length) deckShuffle(); const i = FD.order[FD.i % Math.max(1,FD.order.length)]; return i==null ? null : {f: FX().facts[i], i}; }
function deckBody(){
  const x = deckCur(), n = FD.order ? FD.order.length : 0;
  return x ? `<div class="card deck">${factCard(x)}<div class="deck-n small muted">${(FD.i % n)+1} of ${n}</div></div>
    <div class="btns deck-btns"><button class="btn" data-deck="prev">← Back</button><button class="btn solid" data-deck="next">Next fact →</button><button class="btn" data-deck="shuffle">Shuffle</button></div>`
    : `<div class="card"><p style="margin:0">No facts for this filter yet${FD.cat==="Here"?" (it lights up once you're in Vietnam)":""}.</p></div>`;
}
function factsPage(){
  return `<a class="btn back-link" href="#explore">← Explore</a><h2>Did you know?</h2>
    <p class="small muted" style="margin:0 0 10px">${FX().facts.length} short facts about Vietnam. Tap Next, or shuffle.</p>
    <div class="chips" role="group" aria-label="Filter facts">${FCATS.map(c=>`<button type="button" class="chipbtn" data-fcat="${c}" aria-pressed="${FD.cat===c}">${c==="Here"?"Where we are":c}</button>`).join("")}</div>

const HUNT = () => FX().hunt || [];
const huntItem = id => HUNT().find(h=>h[0]===id);
// Photos live in IndexedDB on this phone only.
const IDB = { db: null,
  open(){ if (this.db) return Promise.resolve(this.db); return new Promise((ok, no)=>{ const r = indexedDB.open("vietnam26", 1); r.onupgradeneeded = ()=>r.result.createObjectStore("hunt"); r.onsuccess = ()=>{ this.db = r.result; ok(this.db); }; r.onerror = ()=>no(r.error); }); },
  async put(k, v){ const db = await this.open(); return new Promise((ok, no)=>{ const t = db.transaction("hunt","readwrite"); t.objectStore("hunt").put(v, k); t.oncomplete = ok; t.onerror = ()=>no(t.error); }); },
  async get(k){ const db = await this.open(); return new Promise(ok=>{ const r = db.transaction("hunt").objectStore("hunt").get(k); r.onsuccess = ()=>ok(r.result||null); r.onerror = ()=>ok(null); }); },
  async del(k){ const db = await this.open(); return new Promise(ok=>{ const t = db.transaction("hunt","readwrite"); t.objectStore("hunt").delete(k); t.oncomplete = ok; t.onerror = ok; }); },
};

// Daily bounty: one item per trip day, worth double if caught that day.
function bountyFor(iso){
  const d = dayOf(iso); if (!d || !VN(d.city)) return null;
  const pool = HUNT().filter(h=>h[1] < 5 && (!h[3] || h[3]===d.city));
  return pool.length ? pool[hashStr("bounty"+iso) % pool.length] : null;
}
function scoreAll(){
  const R = boardRecords(), first = {}, aw = {}, SP = Object.fromEntries(SPEAK().map(x=>[x[0], x[4]]));
  R.forEach(r=>Object.entries(r.h||{}).forEach(([id,ts])=>{ if (first[id]==null || ts < first[id].ts) first[id] = {ts, n: r.n}; }));
  R.forEach(r=>(r.aw||[]).forEach(a=>{ aw[a.id] = a; }));
  Object.values(aw).forEach(a=>{ if (!R.some(r=>r.n===a.to)) R.push({ n: a.to, t: 0 }); });
  const champ = R.reduce((m,r)=>Math.max(m, r.hg||0), 0);
  return R.map(r=>{
    let hunt = 0, bonus = 0;
    Object.entries(r.h||{}).forEach(([id,ts])=>{ const it = huntItem(id); if (!it) return;
      const day = isoOf(new Date(ts)), b = bountyFor(day); let p = it[1]; if (b && b[0]===id) p *= 2;
      hunt += p; if (first[id] && first[id].n===r.n && R.length > 1) bonus++; });
    const trivia = (r.tr||[]).length, bingo = r.bg||0;
    const bill = Object.values(aw).filter(a=>a.to===r.n && a.g==="bill").reduce((s,a)=>s+a.p, 0);
    const haggle = Math.floor((r.hg||0)/10) + (champ > 0 && r.hg===champ && R.length > 1 ? 3 : 0);
    const speak = Object.keys(r.sp||{}).reduce((s,k)=>s+(SP[k]||0), 0);
    return { n: r.n, t: r.t, hunt, bonus, trivia, bingo, bill, haggle, speak, found: Object.keys(r.h||{}).length,
      total: hunt + bonus + trivia + bingo + bill + haggle + speak, me: r.n===ME() };
  }).sort((a,b)=>b.total-a.total || a.n.localeCompare(b.n));
}
const ago = t => { const m = Math.round((Date.now()-t)/60000); return m < 2 ? "just now" : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m/60)} h ago` : `${Math.round(m/1440)} d ago`; };

function syncCode(){ return btoa(unescape(encodeURIComponent(JSON.stringify(compactRecord())))).replace(/=+$/,""); }

// ===== Live leaderboard: every phone writes its own scores to one shared room and listens for everyone else's.
// Firebase Realtime Database over plain REST and server-sent events (no SDK). Works offline: changes wait and send later.
const LIVE = { es: null, room: null, dirty: false, timer: null, state: "off", seen: 0, ping0: Date.now() };
const LIVE_OFF = location.protocol === "file:" || /^(localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\])$/.test(location.hostname);
const liveBase = () => T && T.live && !LIVE_OFF ? `${T.live.db}/v26/${T.live.room}` : null;
const SCORE_KEYS = new Set(["hunt-found","trivia-right","trivia-scores","bingo","awards","haggles","speak"]);
function takeRecord(x){
  if (!x || !x.n || x.n === ME()) return false;
  const B = local.get("board", {}), rec = { n:x.n, t:x.t*60000, tr:x.tr||[], tb:x.tb||0, h:{}, bg:x.bg||0, hg:x.hg||0, sp:x.sp||{}, aw:(x.aw||[]).map(a=>({id:a[0], to:a[1], p:a[2], g:a[3], ts:a[4]*60000})) };
  Object.entries(x.h||{}).forEach(([k,v])=>rec.h[k]=v*60000);
  if (B[x.n] && B[x.n].t > rec.t) return false;
  B[x.n] = rec; store.set("board", JSON.stringify(B)); return true;
}
function livePush(soon){
  if (!liveBase() || !ME()) return; LIVE.dirty = true; clearTimeout(LIVE.timer);
  LIVE.timer = setTimeout(async ()=>{
    if (!navigator.onLine) return;
    try { const r = await fetch(`${liveBase()}/scores/${encodeURIComponent(ME())}.json`, { method: "PUT", body: JSON.stringify(compactRecord()) });
      if (r.ok){ LIVE.dirty = false; liveStatus(); } } catch(e){}
  }, soon ? 300 : 1500);
}
function liveApply(path, data){
  // Keep a mirror of the room, then copy everyone else's scores into this phone's board.
  if (path === "/") LIVE.room = data || {};
  else { LIVE.room = LIVE.room || {}; const parts = path.split("/").filter(Boolean).map(decodeURIComponent); let o = LIVE.room;
    for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]] = (o[parts[i]] && typeof o[parts[i]] === "object") ? o[parts[i]] : {};
    if (data == null) delete o[parts[parts.length-1]]; else o[parts[parts.length-1]] = data; }
  if (typeof gatesSync === "function") gatesSync((LIVE.room||{}).gates);
  if (typeof edSync === "function") edSync((LIVE.room||{}).edits);
  let changed = false; Object.values((LIVE.room||{}).scores || {}).forEach(x=>{ if (takeRecord(x)) changed = true; });
  const pg = (LIVE.room||{}).ping;
  if (pg && pg.t > LIVE.ping0 && pg.t > LIVE.seen){ LIVE.seen = pg.t; if (pg.by !== ME()){ toast(`${pg.by} refreshed everyone's app`); liveRefresh(); } }
  LIVE.seen = Math.max(LIVE.seen, (pg && pg.t) || 0);
  LIVE.state = "on"; liveStatus();
  if (changed && /^#(board|games)$/.test(location.hash)){ const y = scrollY; route(); scrollTo(0, y); }
}
function liveListen(){
  if (!liveBase() || !window.EventSource) return; liveStop();
  const es = LIVE.es = new EventSource(`${liveBase()}.json`);
  const on = ev => { try { const m = JSON.parse(ev.data); if (m) liveApply(m.path, m.data); } catch(e){} };
  es.addEventListener("put", on); es.addEventListener("patch", ev => { try { const m = JSON.parse(ev.data); Object.entries(m.data||{}).forEach(([k,v])=>liveApply((m.path==="/"?"":m.path)+"/"+k, v)); } catch(e){} });
  es.onerror = () => { LIVE.state = navigator.onLine ? "retry" : "off"; liveStatus(); };
}
function liveStop(){ if (LIVE.es){ LIVE.es.close(); LIVE.es = null; } }
async function liveRefresh(){
  // Fetch the newest app (if one was published) and reload; scores come back with the page.
  try { const r = await navigator.serviceWorker?.getRegistration(); await r?.update(); } catch(e){}
  setTimeout(()=>location.reload(), 900);
}
function liveStatus(){
  const el = document.getElementById("live-st"); if (!el) return;
  el.textContent = !liveBase() ? "" : LIVE.dirty && !navigator.onLine ? "Offline. Your scores will send when you're back online."
    : LIVE.state === "on" ? "Live. Scores update on everyone's phone as you play." : "Connecting…";
  el.dataset.st = LIVE.state;
}
function liveInit(){
  if (!liveBase()) return;
  const set0 = local.set; local.set = (k, v) => { set0(k, v); if (SCORE_KEYS.has(k)) livePush(); };
  livePush(true); liveListen();
  document.addEventListener("visibilitychange", ()=>{ if (document.visibilityState === "visible"){ liveListen(); if (LIVE.dirty) livePush(true); } else liveStop(); });
  addEventListener("online", ()=>{ liveListen(); livePush(true); });
}
document.addEventListener("click", async e=>{
  const b = e.target.closest("[data-liveping]"); if (!b) return;
  if (!liveBase()) return liveRefresh();
  try { await fetch(`${liveBase()}/ping.json`, { method: "PUT", body: JSON.stringify({ t: Date.now(), by: ME() }) }); toast("Refreshing everyone's app"); } catch(err){ toast("No connection. Try again when you're online."); return; }
  liveRefresh();
});
document.addEventListener("click", e=>{ if (e.target.closest("[data-liverefresh]")){ livePush(true); liveListen(); toast("Scores refreshed"); } });

async function shrink(file){
  const bmp = await createImageBitmap(file), k = Math.min(1, 1400/Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width*k); c.height = Math.round(bmp.height*k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(ok=>c.toBlob(ok, "image/jpeg", .82));
}

// End-of-history quiz: 3 questions, one try each; right answers count as trivia points.
const QORDER = ["vietnam","saigon","hoian","danang","hanoi","ninhbinh"];
const qid = (id, i) => 1000 + 10 * QORDER.indexOf(id) + i;
function storyQuiz(id){
  const Q = (FX().quizzes || {})[id]; if (!Q || QORDER.indexOf(id) < 0) return "";
  const tried = local.get("quiz-tried", {}), R = triviaRight();
  const got = Q.filter((q, i) => R[qid(id, i)]).length, done = Q.filter((q, i) => tried[qid(id, i)] != null).length;
  return `<section class="squiz" id="squiz"><small>Quick quiz · a point each on the leaderboard</small><b>${done === Q.length ? `You got ${got} of ${Q.length}` : "How much do you remember?"}</b>
    ${Q.map(([q, opts, ans, why], i) => { const k = qid(id, i), t = tried[k];
      return `<div class="sq"><p>${i + 1}. ${esc(q)}</p><div class="sqo">${opts.map((o, j) => `<button type="button" data-sq="${id}:${i}:${j}"${t != null ? " disabled" : ""} class="${t != null && j === ans ? "ok" : t === j ? "no" : ""}">${esc(o)}</button>`).join("")}</div>${t != null ? `<p class="why">${t === ans ? "Right. " : "Not quite. "}${esc(why)}</p>` : ""}</div>`; }).join("")}</section>`;
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-sq]"); if (!b) return;
  const [id, i, j] = b.dataset.sq.split(":"), Q = FX().quizzes[id], k = qid(id, +i), T2 = local.get("quiz-tried", {});
  if (T2[k] != null) return; T2[k] = +j; local.set("quiz-tried", T2);
  if (+j === Q[+i][2]) { const R = triviaRight(); R[k] = 1; local.set("trivia-right", R); }
  const box = document.getElementById("squiz"); if (box) box.outerHTML = storyQuiz(id);
});

// Leaderboard: lanterns sized by points, the bounty, and the latest finds.
function latestFeed(){
  const ev = [];
  boardRecords().forEach(r=>{
    Object.entries(r.h||{}).forEach(([id,ts])=>{ const it = huntItem(id); if (it) ev.push({ ts, n: r.n, html: `found ${esc(it[2].charAt(0).toLowerCase() + it[2].slice(1))}`, p: it[1] }); });
    (r.aw||[]).forEach(a=>{ if (a.to) ev.push({ ts: a.ts, n: a.to, html: `won ${a.g === "bill" ? "Guess the bill" : esc(a.g)}`, p: a.p }); });
  });
  const seen = new Set();
  return ev.filter(x=>{ const k = x.n + x.ts + x.html; if (seen.has(k)) return false; seen.add(k); return x.ts; }).sort((a,b)=>b.ts-a.ts).slice(0, 6);
}
function lanternsHtml(S){
  const names = T.travelers.map(t=>t.name), byN = Object.fromEntries(S.map(s=>[s.n, s]));
  S.forEach(s=>{ if (!names.includes(s.n)) names.push(s.n); });
  const max = Math.max(1, ...S.map(s=>s.total)), n = names.length;
  const sag = x => 22 + 26 * Math.sin(Math.PI * x);   // the wire droops in the middle
  const ls = names.map((nm,i)=>{ const s = byN[nm] || { total: 0 }, x = (i + .5) / n, sz = Math.round(40 + 34 * (s.total / max));
    return `<div class="ln${nm===ME()?" me":""}" style="left:${(x*100).toFixed(1)}%;top:${sag(x).toFixed(0)}px"><span class="cord" style="height:${10 + (i%2)*16}px"></span><span class="bod" style="width:${sz}px;height:${Math.round(sz*1.12)}px;font-size:${Math.round(sz*.42)}px">${s.total}</span><span class="tas"></span><span class="nm">${esc(nm)}</span></div>`; }).join("");
  const pts = Array.from({length:21}, (_,i)=>`${i*5},${sag(i/20).toFixed(1)}`).join(" ");
  return `<div class="lstring" aria-label="Points: ${S.map(s=>`${esc(s.n)} ${s.total}`).join(", ")}"><svg class="wire" viewBox="0 0 100 210" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="#5a3d1a" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>${ls}</div>`;
}

// ===== End-of-trip recap: opens the last evening in Vietnam (Sat Dec 12, 6 PM). =====
const RECAP_AT = "2026-12-12";
function recapOpen(){ try { if (new URLSearchParams(location.search).get("recap")) return true; } catch(e){} const iso = todayIso(); return iso > RECAP_AT || (iso === RECAP_AT && nowMin() >= 18*60); }
const flapTiles = (s, n) => [...String(s).toUpperCase().padEnd(n, " ")].slice(0, n).map(c=>`<i${c===" "?' class="s"':""}>${c===" "?"":esc(c)}</i>`).join("");
function recapPage(){
  if (!recapOpen()) return `<a class="btn back-link" href="#games">← Games</a><h2>The finale</h2><div class="card"><p style="margin:0">The finale opens on the last night in Hà Nội, <b>Sat Dec 12 at 6 PM</b>: the final standings on a flip board, the route, everyone's hunt photos and the best moments.</p></div>`;
  const S = scoreAll(), N = Math.max(...S.map(s=>s.n.length), 6), R = boardRecords();
  const iso = todayIso(), St = dayStamps(), vd = T.days.filter(d=>VN(d.city));
  // Best moments, worked out from everyone's records.
  const all = []; R.forEach(r=>Object.entries(r.h||{}).forEach(([id,ts])=>all.push({ n: r.n, ts, it: huntItem(id) })));
  const firstFind = all.filter(x=>x.it).sort((a,b)=>a.ts-b.ts)[0];
  const rare = all.filter(x=>x.it && x.it[1] === 5).sort((a,b)=>a.ts-b.ts)[0];
  const hag = [...R].sort((a,b)=>(b.hg||0)-(a.hg||0))[0];
  const triv = [...S].sort((a,b)=>b.trivia-a.trivia)[0], food = [...S].sort((a,b)=>b.bingo-a.bingo)[0];
  const bestDay = Object.entries(St).sort((a,b)=>b[1].n-a[1].n)[0];
  const mom = [
    firstFind && ["First find", `${esc(firstFind.n)}: ${esc(firstFind.it[2])}`],
    rare && ["First rare find", `${esc(rare.n)}: ${esc(rare.it[2])}`],
    hag && hag.hg && ["Best haggle", `${esc(hag.n)}, ${hag.hg}% off`],
    triv && triv.trivia && ["Trivia brain", `${esc(triv.n)}, ${triv.trivia} right`],
    food && food.bingo && ["Ate the most", `${esc(food.n)}, ${food.bingo} dishes`],
    bestDay && ["Busiest hunt day", `${fmt(bestDay[0])}, ${bestDay[1].n} finds`],
  ].filter(Boolean);
  const F = huntFound(), ids = Object.keys(F).sort((a,b)=>F[a]-F[b]);
  return `<a class="btn back-link" href="#games">← Games</a><h2>Who won Vietnam?</h2><button type="button" class="btn solid wrapbtn" data-wrapped>▶ Play your Trip Wrapped</button>

    <div class="flap" id="flap" aria-hidden="true">${S.map((s,i)=>`<div class="fr hid${s.total===S[0].total?" win":""}" data-rank="${i}" data-sr="${esc(`${i+1}. ${s.n}, ${s.total} points`)}"><span class="rk">${flapTiles(i+1, 1)}</span><span class="tiles">${flapTiles(s.n, N)}</span><span class="pts">${flapTiles(String(s.total).padStart(3," "), 3)}</span></div>`).join("")}</div>
    <ol class="sr-only" id="flap-sr" aria-live="polite"></ol><div class="btns" style="display:grid;grid-template-columns:1fr 1fr"><button class="btn solid" data-reveal>Reveal next</button><button class="btn" data-revealall>Show all</button></div>
    <h3>The route</h3><div class="card"><div class="route2" style="gap:4px">${vd.map(d=>`<div style="display:flex;gap:10px;align-items:center"><span class="sign" style="--city:${cityCol(d.city)}"><span style="font-size:16px;min-width:58px;text-align:center">${parse(d.date).getDate()} Dec</span></span><span style="min-width:0"><b style="display:block;font-size:14.5px">${esc(d.title)}</b>${St[d.date] ? `<span class="dstamp">${St[d.date].n} finds</span>` : `<span class="small muted">${esc(CITYV[d.city]||d.place)}</span>`}</span></div>`).join("")}</div></div>
    <h3>Your hunt photos</h3><div class="card">${ids.length ? `<div class="rcol">${ids.map(id=>`<div class="hi" data-himg="${id}">${esc(huntItem(id) ? huntItem(id)[2] : "")}</div>`).join("")}</div>` : `<p class="small muted" style="margin:0">No hunt photos on this phone.</p>`}<div class="btns"><button class="btn solid" data-recap>Share my collage</button></div></div>
    ${mom.length ? `<h3>Best moments</h3><div class="card moments">${mom.map(([k,v])=>`<div><span class="sign"><span style="font-size:15px">${k}</span></span><span>${v}</span></div>`).join("")}</div>` : ""}`;

function todayStreet(){
  const iso = todayIso(), first = T.days[0].date, last = T.days[T.days.length-1].date, idx = T.days.findIndex(d=>d.date===iso);
  const dl = iso => { const x = parse(iso); return `${DOW[x.getDay()]} ${x.getDate()} ${MON[x.getMonth()]}`; };
  let top = "", body = "";
  if (iso < first){
    const n = Math.round((parse(first)-parse(iso))/864e5);
    const ml = PB() ? null : personalLegs().find(l=>l.dir==="in" && l.dep.slice(0,10)>=iso), mf = ml && { date: ml.dep.slice(0,10), from: ml.from, to: personalLegs().filter(l=>l.dir==="in").pop().to };
    const nn = mf ? Math.round((parse(mf.date)-parse(iso))/864e5) : n;
    top = streetHero({ city: "hoian", line: `Countdown · Hi ${esc(ME())}`, sm: nn <= 0 ? "Today you fly to" : nn === 1 ? "Tomorrow you fly to" : `${nn} days to`, nm: "Việt Nam", title: PB() ? (f0 => f0 ? `We fly ${fmt(f0.dep.slice(0, 10))} at ${t12(f0.dep)} from ${esc((APT[f0.from] || [f0.from])[0])}` : "")(myLegs().find(l => l.dep)) : mf ? `You fly ${esc(mf.from)} → ${esc(mf.to)}, ${fmt(mf.date)} at ${t12(ml.dep)}` : "Everyone together in Sài Gòn from Sun Dec 6" });
    const sd = Object.keys(setupDone()).length, sn = (MOg().setup||[]).length;
    body = `${setupNudge()}${arrivalsCard(iso)}${todoHtml(iso)}${jetlagHtml(iso)}<h3>Before you fly</h3><a class="card jlcard" href="#info" data-goto="setup"><b>Phone setup · <span id="setup-n">${sd}</span>/${sn} done</b><span class="small muted">Grab, offline maps, translate, eSIM and more ›</span></a>${wxCard()}${newsCard()}${todayFactsHtml(null)}<h3>First days</h3>${T.days.slice(0,3).map(d=>dayCard(d)).join("")}`;
  } else if (iso > last){
    top = streetHero({ city: "hanoi", line: "Trip complete", sm: "Welcome", nm: "Home", title: `<a href="#recap" style="color:#fff">Open the finale ›</a>` });
    const vdays = T.days.filter(x=>VN(x.city)), ncity = new Set(vdays.map(x=>x.city)).size;
    body = `<h3>The whole trip</h3><a class="card jlcard" href="#plan"><b>${vdays.length} days in Vietnam · ${ncity} cit${ncity===1?"y":"ies"}</b><span class="small muted">${fmt(vdays[0].date)} to ${fmt(vdays[vdays.length-1].date)} · see every day ›</span></a>`;
  } else {
    const d = T.days[idx], st = d.stay ? stayById(d.stay) : null, vd = T.days.filter(x=>VN(x.city)), vi = vd.indexOf(d);
    top = streetHero({ city: d.city, line: `${dl(iso)} · ${vi >= 0 ? `Day ${vi+1} of ${vd.length}` : `Day ${idx+1} of ${T.days.length}`}`, sm: st ? "Tonight" : "Today", nm: CITYV[d.city] || d.place, title: esc(d.title) });
    const ru = dayRouteUrl(d), ns = nextStop();
    top += `<div class="nightbg ph" aria-hidden="true" data-lead="${esc((T.stories.find(x => (XCITY[x.id]||[])[2] === d.city) || {}).hero || "Vietnam")}"></div>`;
    top += `<div class="swall"><div id="nownext" class="nownext-s">${nowNextHtml(d)}</div>
      <div class="wnbar">${ns ? `<button type="button" class="btn solid" data-nextstop>Next stop</button>` : ""}<a class="btn${ns ? "" : " solid"}" href="#now">What now?</a>${ru ? `<a class="btn" href="${ru}" target="_blank" rel="noopener">Map ↗</a>` : ""}</div>
      ${ns ? `<div class="pullhint" aria-hidden="true">Pull down anytime for the next stop</div>` : ""}</div>
      <div id="raintop"></div>${factsStrip(d)}`;
    top += setupNudge() + arrivalPlan(iso) + walletToday(iso) + travelDayHtml(iso) + arrivalsCard(iso) + briefHtml(d) + checkoutHtml(d);
    top += `<h3>Today's plan</h3><div class="tflow">${dayFlow(d, d.items.filter(x=>x[2]==="todo").length)}</div>`;
    top += tomorrowHtml(iso) + jetlagHtml(iso);
    const tp = [...new Set(d.items.flatMap(x=>placesFor(x[1],d.city)))].filter(p=>p.photo);
    if (tp.length) top += `<h3>Today's places</h3><div class="strip">${tp.map(p=>`<button class="ptile" data-place="${p.id}"><div class="ph" data-lead="${esc(p.photo)}"></div><span>${esc(p.name)}</span></button>`).join("")}</div>`;
    top += wxCard() + newsCard();
    body = dayExtrasHtml(d) + gamesTodayHtml(iso) + todayFactsHtml(d);
    const gt = (T.guides||[]).filter(g=>g.day===iso);
    if (gt.length) body += `<h3>Audio guides for today</h3><div class="list">${gt.map(guideCard).join("")}</div>`;
    const ag = (T.airports||[]).find(a=>(!a.pb||PB()) && a.when.includes(fmt(iso)));
    if (ag) body += `<h3>${esc(ag.title)}</h3><div class="card"><ol class="steps" style="margin:0">${ag.steps.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div>`;
    const nf = T.flights.find(f=>f.date>=iso);
    if (nf) body += `<h3>Next flight</h3><div class="card"><div class="row" style="border:0;padding:0"><div class="when">${esc(nf.when)}</div><div class="what">${esc(nf.route)}</div>${chip(nf.status)}<div class="detail">${esc(nf.detail)}</div></div></div>`;
    if (T.days[idx+1]) body += `<h3>Tomorrow</h3>${dayCard(T.days[idx+1])}`;
  }
  const crew = T.travelers.map(p=>`<span class="person${/final/.test(p.note)?" tbd":""}" title="${esc(p.note)}">${esc(p.name)}</span>`).join("");
  const exp = T.expensesUrl ? `<a class="btn" href="${esc(T.expensesUrl)}" target="_blank" rel="noopener">Shared expenses ↗</a>` : "";
  const after = todayIso() > last;
  return `${top}${body}<h3>${after ? "Who came" : "Who's coming"}</h3><div class="card"><div class="people">${after ? crew.replace(/ tbd"/g, '"') : crew}</div>${after ? "" : `<p class="small muted" style="margin:8px 0 0">Dashed names: plans with Sunny, Sindhu and Karthik are still being finalized.</p>`}${exp?`<div class="btns">${exp}</div>`:""}</div>`;
}

// Before-you-fly countdown: open items with their deadlines (more.mjs todo). Ticks are saved on this phone.
function todoHtml(iso){
  const L = (MOg().todo||[]).filter(t=>t[4]==="all" || PB()), done = local.get("todo-done", {});
  const open = L.filter(t=>!done[t[0]]); if (!L.length) return "";
  const dleft = due => Math.round((parse(due) - parse(iso)) / 864e5);
  const when = (n, w) => n < 0 ? (/visa/i.test(w || "") ? "Apply now" : "Do it now") : n === 0 ? "today" : n === 1 ? "tomorrow" : `${n} days`;
  const row = t => { const n = dleft(t[2]), dt = parse(t[2]);
    return `<label class="todo-r${done[t[0]]?" done":""}${n<=3&&!done[t[0]]?" soon":""}"><input type="checkbox" data-todo="${t[0]}"${done[t[0]]?" checked":""}><span><b>${esc(t[1])}</b><small>${esc(t[3])}</small></span><span class="num"><span>${done[t[0]] ? "Done" : when(n, t[1])}</span></span><em>${t[5] ? "Deadline" : "Aim for"} ${DOW[dt.getDay()]} ${MON[dt.getMonth()]} ${dt.getDate()}</em></label>`; };
  return `<h3>Still to do before you fly · ${open.length} left</h3><div class="card todo">${[...L].sort((a,b)=>(done[a[0]]?1:0)-(done[b[0]]?1:0) || a[2].localeCompare(b[2])).map(row).join("")}</div>`;
}

// Travelling pill: which stop and year you're reading. IntersectionObserver only, no scroll handlers.
let TLFIO = [];
function tlfWatch(){
  TLFIO.forEach(o => o.disconnect()); TLFIO = [];
  document.querySelectorAll("body > .tlf-pill").forEach(x => x.remove());
  const pill = document.getElementById("tlfpill"); if (!pill) return; document.body.appendChild(pill);
  const name = document.getElementById("tlfname"), yr = document.getElementById("tlfyr"), stops = [...document.querySelectorAll(".tlf-stop")];
  const hdr = (document.querySelector("header.top") || {}).offsetHeight || 60, band = `-${hdr + 40}px 0px -${Math.round(innerHeight * .6)}px 0px`;
  const setStop = sec => { const i = stops.indexOf(sec); name.textContent = sec.dataset.name; pill.querySelectorAll(".tlf-dots i").forEach((d, j) => { d.className = j < i ? "past" : j === i ? "on" : ""; }); };
  const so = new IntersectionObserver(es => { es.forEach(e => { if (e.isIntersecting) setStop(e.target); }); }, { rootMargin: band });
  stops.forEach(s => so.observe(s));
  const yo = new IntersectionObserver(es => { es.forEach(e => { if (e.isIntersecting && yr.textContent !== e.target.dataset.y){ yr.textContent = e.target.dataset.y; } }); }, { rootMargin: band });
  document.querySelectorAll(".tlf li[data-y]").forEach(li => yo.observe(li));
  const first = stops[0], vo = new IntersectionObserver(es => { es.forEach(e => pill.classList.toggle("show", !e.isIntersecting && e.boundingClientRect.top < 0)); }, { rootMargin: `-${hdr}px 0px 0px 0px` });
  if (first) vo.observe(first.querySelector(".tlf-h"));
  TLFIO = [so, yo, vo];
}

function parseConf(txt){

  const push = (type, i, v) => ev.push({ type, i, v });
  for (const m of T0.matchAll(/\b([A-Z]{2}|[A-Z]\d|\d[A-Z])\s?(\d{1,4})\b/g)) if (!/^\d+$/.test(m[1]) && !APT[m[1] + m[2]] && +m[2] > 0 && !/^(AM|PM|PC|OK|NO|TO)$/.test(m[1])) push("no", m.index, m[1] + " " + m[2]);

  for (const m of T0.matchAll(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s(\d{1,2})(?:,?\s(\d{4}))?\b/gi)) push("date", m.index, `${m[3] || 2026}-${String(MON[m[1].toLowerCase()]).padStart(2, "0")}-${m[2].padStart(2, "0")}`);

}

  const pct = Math.round(100 * parts.reduce((s, p) => s + p[1] / p[2], 0) / parts.length), R = 30, C = 2 * Math.PI * R;

}

// Trip map: the whole Vietnam route on one drawing (works offline), with today's dot.
const VNOUT = [[21.5,108],[21.55,107.4],[21.9,106.8],[22.4,106.7],[22.8,106.2],[22.9,105.6],[23.35,105.3],[22.75,104.8],[22.5,103.95],[22.75,103.4],[22.4,102.15],[21.7,102.65],[21.4,102.9],[20.8,103.6],[20.4,104.4],[19.6,104.6],[19.15,104],[18.6,105.1],[18.1,105.7],[17.5,105.8],[16.6,106.6],[16.2,107.2],[15.5,107.5],[14.7,107.55],[13.9,107.4],[12.7,107.55],[12.15,106.7],[11.6,106.05],[11.1,106.1],[10.9,105.4],[10.7,105.1],[10.38,104.48],[9.6,104.8],[8.6,104.75],[9.2,105.4],[9.5,106.2],[10.0,106.6],[10.35,107.08],[10.6,107.5],[10.93,108.1],[11.2,108.6],[11.55,109.0],[12.25,109.2],[12.9,109.46],[13.77,109.23],[14.6,109.05],[15.1,108.9],[15.88,108.4],[16.07,108.22],[16.5,107.7],[17.0,107.15],[17.47,106.6],[18.1,106.4],[18.75,105.75],[19.8,105.9],[20.25,106.4],[20.86,106.75],[20.95,107.1],[21.2,107.5]];
const VNCITY = { hcmc: [10.78, 106.7], hoian: [15.88, 108.33], danang: [16.05, 108.21], hanoi: [21.03, 105.85], ninhbinh: [20.25, 105.97] };
function tripMapSheet(){
  const K = 34, X = lon => (lon - 102) * K + 8, Y = lat => (23.6 - lat) * K * 1.04 + 8, W = Math.round(X(109.6) + 8), H = Math.round(Y(8.4) + 8);
  const vd = T.days.filter(d => VN(d.city)), iso = todayIso(), seq = [];
  vd.forEach(d => { const k = d.city, l = seq[seq.length - 1]; if (l && l.k === k) l.d.push(d.date); else seq.push({ k, d: [d.date] }); });
  const stops = seq.filter(s => VNCITY[s.k]), cur = (dayOf(iso) || {}).city, before = vd[0] && iso < vd[0].date;
  const path = "M" + VNOUT.map(([a, o]) => `${X(o).toFixed(1)},${Y(a).toFixed(1)}`).join("L") + "Z";
  const arc = (a, b) => { const [x1, y1] = [X(VNCITY[a][1]), Y(VNCITY[a][0])], [x2, y2] = [X(VNCITY[b][1]), Y(VNCITY[b][0])], mx = (x1 + x2) / 2 + (y2 - y1) * .18, my = (y1 + y2) / 2 - (x2 - x1) * .18; return `M${x1.toFixed(1)},${y1.toFixed(1)}Q${mx.toFixed(1)},${my.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}`; };
  // Ninh Bình is a day trip from Hà Nội: a short spur, not a stop on the route.
  const SIDE = { ninhbinh: "hanoi" }, side = s => SIDE[s.k] && stops.some(x => x.k === SIDE[s.k]), route = stops.filter(s => !side(s));
  const legs = route.slice(1).map((s, i) => { const a = route[i].k; if (a === s.k) return ""; const done = s.d[0] <= iso; return `<path d="${arc(a, s.k)}" class="tm-leg${done ? " done" : ""}"/>`; }).join("")
    + stops.filter(side).map(s => { const a = VNCITY[SIDE[s.k]], b = VNCITY[s.k]; return `<path d="M${X(a[1]).toFixed(1)},${Y(a[0]).toFixed(1)}L${X(b[1]).toFixed(1)},${Y(b[0]).toFixed(1)}" class="tm-spur${s.d[0] <= iso ? " done" : ""}"/>`; }).join("");
  const seen = new Set(), rng = ds => fmt(ds[0]) + (ds.length > 1 ? "–" + parse(ds[ds.length - 1]).getDate() : "");
  const dots = stops.filter(s => !seen.has(s.k) && seen.add(s.k)).map(s => { const all = stops.filter(x => x.k === s.k).flatMap(x => x.d), [la, lo] = VNCITY[s.k], x = X(lo), y = Y(la), now = s.k === cur;
    const left = true, dy = s.k === "ninhbinh" ? 14 : s.k === "hoian" ? 20 : s.k === "danang" ? -4 : s.k === "hanoi" ? -2 : 6;
    return `<g class="tm-c${now ? " now" : ""}${all.every(d => d < iso) ? " past" : ""}" style="--city:${cityCol(s.k)}">${now ? `<circle cx="${x}" cy="${y}" r="13" class="tm-pulse"/>` : ""}<circle cx="${x}" cy="${y}" r="${now ? 7 : 5.5}" class="tm-dot"/>
      <text x="${left ? x - 12 : x + 12}" y="${y + dy}" text-anchor="${left ? "end" : "start"}" class="tm-n">${esc(CITYV[s.k])}</text></g>`; }).join("");
  const plane = before ? `<g class="tm-in"><path d="M${W - 6},${Y(11.6)}Q${X(108.6)},${Y(10.4)} ${X(106.95)},${Y(10.78)}" class="tm-leg"/><text x="${W - 10}" y="${Y(11.6) - 10}" text-anchor="end" class="tm-d">From Tokyo</text></g>` : "";
  const list = stops.filter((s, i) => stops.findIndex(x => x.k === s.k) === i).map(s => { const all = stops.filter(x => x.k === s.k).flatMap(x => x.d);
    return `<button type="button" class="tm-row${s.k === cur ? " now" : ""}${side(s) ? " side" : ""}" data-tmgo="${esc(s.k)}" style="--city:${cityCol(s.k)}"><i></i><b lang="vi">${esc(CITYV[s.k])}</b><span>${side(s) ? `Day trip from ${esc(CITYV[SIDE[s.k]])} · ${rng(all)}` : `${rng(all)} · ${all.length} day${all.length > 1 ? "s" : ""}`}</span>${s.k === cur ? "<em>Today</em>" : ""}</button>`; }).join("");

    <div class="tmap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Map of the route through Vietnam"><path d="${path}" class="tm-land"/>${plane}${legs}${dots}</svg>
    <div class="tm-list">${list}</div></div>`);
}
document.addEventListener("click", e => {
  if (e.target.closest("[data-tripmap]")) { tripMapSheet(); return; }
  const g = e.target.closest("[data-tmgo]"); if (g) { closeSheet(); const k = g.dataset.tmgo; const go = () => { const s = document.getElementById("pc-" + k); if (s) planGo(s); };
    if ((location.hash || "").slice(1) !== "plan") { location.hash = "plan"; setTimeout(go, 250); } else go(); }

// Gates: anyone in the group taps Gate on a pass and types it; it syncs to every phone through the live room.
const gateKey = l => (l.no || "").replace(/\s+/g, "") + "_" + (l.dep || "").slice(0, 10);
function gateOf(l){
  const c = local.get("gates-cache", {})[gateKey(l)], g = (c && c.g) || l.gate || "";
  const prev = (c && c.prev) || (c && l.gate && l.gate !== c.g ? l.gate : "");
  return { g, prev, by: c && c.by, changed: !!prev && prev !== g };
}
function gatesSync(G){
  if (!G || typeof G !== "object") return; const C = local.get("gates-cache", {}); if (JSON.stringify(C) === JSON.stringify(G)) return;
  const fresh = Object.entries(G).find(([k, v]) => v && (!C[k] || C[k].g !== v.g) && v.by !== ME());
  local.set("gates-cache", G);
  if (fresh) { toast(`Gate ${fresh[1].g} for ${fresh[0].split("_")[0].replace(/^([A-Z]+)/, "$1 ")}${fresh[1].by ? " · from " + fresh[1].by : ""}`); if (/^#(today|bookings)?$/.test(location.hash || "")) { const y = scrollY; route(); scrollTo(0, y); } }
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-gateset]"); if (!b) return; e.stopPropagation();
  const k = b.dataset.gateset, no = b.dataset.gateno, cur = (local.get("gates-cache", {})[k] || {}).g || b.dataset.gatenow || "";
  openSheet(`<div class="sname">Gate for ${esc(no)}</div><p class="small muted" style="margin:0 0 10px">From the airport screens or the airline app. Everyone's app updates when they're online.</p>
    <form class="gform" data-gform="${esc(k)}"><input name="g" value="${esc(cur)}" placeholder="e.g. C71" autocapitalize="characters" autocomplete="off" maxlength="8" aria-label="Gate" required><button class="btn solid" type="submit">Save gate</button></form>`);
  setTimeout(() => { const i = document.querySelector(".gform input"); if (i) i.focus(); }, 250);
}, true);
document.addEventListener("submit", async e => {
  const f = e.target.closest("[data-gform]"); if (!f) return; e.preventDefault();
  const k = f.dataset.gform, g = String(new FormData(f).get("g") || "").trim().toUpperCase(); if (!g) return;
  const C = local.get("gates-cache", {}), old = C[k] || {}, rec = { g, by: ME() || "", t: Date.now() };
  if (old.g && old.g !== g) rec.prev = old.g; else if (old.prev) rec.prev = old.prev;
  C[k] = rec; local.set("gates-cache", C); closeSheet(); toast(`Gate ${g} saved`);
  const y = scrollY; route(); scrollTo(0, y);
  try { if (typeof liveBase === "function" && liveBase()) await fetch(`${liveBase()}/gates/${encodeURIComponent(k)}.json`, { method: "PUT", body: JSON.stringify(rec) }); } catch (er) {}

// Online check-in countdown on the first pass of each journey: shows 3 days before it opens, until 1 h before take-off.
function ckinWin(l){
  const L = myLegs(), i = L.findIndex(x => x.no === l.no && x.dep === l.dep), prev = L[i - 1];
  if (prev && Date.parse(l.dep) - Date.parse(prev.arr || prev.dep) < 12 * 36e5) return null; // a connection: checked in with the first leg
  const q = /qatar/i.test(l.by) || /^QR/.test(l.no), dep = Date.parse(l.dep), open = dep - (q ? 48 : 24) * 36e5, n = flNow(l);
  if (n < open - 3 * 864e5 || n > dep - 36e5) return null;
  const url = /^UA/.test(l.no) || /united/i.test(l.by) ? "https://www.united.com/en/us/checkin" : q ? "https://www.qatarairways.com" : /^VN/.test(l.no) || /vietnam airlines/i.test(l.by) ? "https://www.vietnamairlines.com" : "";
  const off = (m => m ? (m[1] === "-" ? -1 : 1) * (+m[2] * 60 + +m[3]) * 6e4 : 0)(l.dep.match(/([+-])(\d\d):(\d\d)$/)), od = new Date(open + off);
  const left = Math.round((open - n) / 6e4), sh = m => m >= 1440 ? `${Math.floor(m / 1440)}d ${Math.floor(m % 1440 / 60)}h` : m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : `${m}m`;
  return { isOpen: n >= open, left: sh(Math.max(0, left)), when: `${DOW[od.getUTCDay()]} ${od.getUTCDate()} ${MON[od.getUTCMonth()]}, ${t12(od.toISOString())}`, url };
}

// ── Nov 5 round 5: night-before card and offline note ──
// After 7 PM: tomorrow's alarm, first thing, checkout and flight, and what to lay out tonight.
function nightBeforeHtml(iso){
  const q = new URLSearchParams(location.search);
  if (nowH() < 19 && !q.get("eve")) return "";
  const i = T.days.findIndex(d => d.date === iso), nd = i >= 0 ? T.days[i + 1] : (T.days[0] && (() => { const x = parse(T.days[0].date); x.setDate(x.getDate() - 1); return isoOf(x) === iso ? T.days[0] : null; })());

  let alarm = null, why = "";

  if (leg) { const [H, M] = leg.dep.slice(11, 16).split(":").map(Number), la = H + M / 60 - (/SRQ|DAD|HAN/.test(leg.from) ? 2.5 : 3.5); if (alarm == null || la < alarm) { alarm = la; why = `${leg.no} at ${t12(leg.dep)}`; } }
  const co = (T.stays || []).find(s => s.end === nd.date && s.status !== "maybe" && s.status !== "todo"), bring = checklistFor(nd).slice(0, 4);
  const CK = leg && typeof ckinWin === "function" ? ckinWin(leg) : null, dn = DOW[parse(nd.date).getDay()];
  const tile = (ic, k, v, sub, extra) => `<div class="nb-t"${extra || ""}>${icon(ic)}<small>${k}</small><b>${esc(v)}</b>${sub ? `<span>${esc(sub)}</span>` : ""}</div>`;

}

// Sections settle in after a tab change: the first few blocks rise into place one after another.
function moSettle(){
  const v = document.getElementById("view"); if (!v || !v.animate || !moOK()) return;
  let kids = [...v.children]; if (kids.length === 1) kids = [...kids[0].children];
  const ease = moEase("soft"); let n = 0;
  for (const el of kids){ if (n >= 7) break; const r = el.getBoundingClientRect(); if (r.top > innerHeight) break;
    if (!r.height || el.matches(".nightbg,.shero,.dhero,[hidden]")) continue; const pos = getComputedStyle(el).position; if (pos === "sticky" || pos === "fixed") continue;
    el.animate([{ opacity: 0, transform: "translate3d(0,16px,0)" }, { opacity: 1, transform: "translate3d(0,0,0)" }], { duration: 520, delay: 30 + n * 42, easing: ease, fill: "backwards" }); n++; }
}

// --- Day pages: swipe like real pages. The next day rides in beside the current one, and a flick carries its speed. ---
{ let S = null;
  const vdays = () => T.days.filter(d => VN(d.city));
  const mk = dir => { const vd = vdays(), i = vd.findIndex(d => "day-" + d.date === current), to = i < 0 ? null : vd[i + dir]; if (!to) return null;
    const v = document.getElementById("view"), g = document.createElement("div"), w = document.createElement("div");
    g.className = "mo-ghost"; g.setAttribute("aria-hidden", "true"); g.inert = true; w.className = "wrap";

    PHUSED.clear(); hydrate(g); return { g, w, date: to.date }; };
  const place = (dx) => { const v = document.getElementById("view"), W = innerWidth, dir = dx < 0 ? 1 : -1;
    if (!(dir in S.gh)) S.gh[dir] = mk(dir);
    const gh = S.gh[dir], other = S.gh[-dir]; S.dir = dir; S.tx = gh ? dx : dx * .26;
    v.style.transition = "none"; v.style.transform = `translate3d(${S.tx.toFixed(1)}px,0,0)`;
    if (gh) gh.g.style.transform = `translate3d(${(dx + dir * W).toFixed(1)}px,0,0)`; if (other) other.g.style.transform = `translate3d(${-dir * W * 1.2}px,0,0)`; };
  const clean = () => { document.querySelectorAll(".mo-ghost").forEach(x => x.remove()); };
  document.addEventListener("touchstart", e => {
    if (S || MO.busy || !(current || "").startsWith("day-") || e.touches.length > 1) return; const t = e.touches[0];
    if (t.clientX < 24 || t.clientX > innerWidth - 24 || document.querySelector(".sheet,.lightbox,#srch") || e.target.closest(".gal,input,textarea,.lightbox,.mapchips,.tsize,.brow,.fstats,.dyrow,.xcity,.xcul,#map,.sheet")) return;
    S = { x: t.clientX, y: t.clientY, dx: 0, lock: null, gh: {}, lx: t.clientX, lt: performance.now(), v: 0, tx: 0, dir: 0 };
  }, { passive: true });
  document.addEventListener("touchmove", e => {
    if (!S) return; const t = e.touches[0], dx = t.clientX - S.x, dy = t.clientY - S.y;
    if (!S.lock && (Math.abs(dx) > 10 || Math.abs(dy) > 10)) { S.lock = Math.abs(dx) > Math.abs(dy) * 1.4 ? "x" : "y"; if (S.lock === "x") S.x = t.clientX + (dx > 0 ? -1 : 1); }
    if (S.lock !== "x") { if (S.lock === "y") S = null; return; }

  }, { passive: false });

    if (!S) return; const s = S; S = null; if (s.lock !== "x") { clean(); return; }
    const v = document.getElementById("view"), W = innerWidth, gh = s.gh[s.dir], vel = s.v * 1000, toward = vel * -s.dir;

    const frame = x => ({ transform: `translate3d(${x.toFixed(1)}px,0,0)` });
    if (!moOK() || !v.animate){ clean(); v.style.transform = ""; if (go) location.hash = "#day-" + gh.date; return; }
    MO.busy = true;
    if (go){ haptic();
      const a = moAnim(v, s.tx, -s.dir * W, vel, frame, 250, 31), b = moAnim(gh.g, s.dx + s.dir * W, 0, vel, frame, 250, 31);
      let fin = false; const finish = () => { if (fin) return; fin = true;
        // The page that rode in becomes the real page, photos and all, so nothing reloads or flickers.
        MO.adopt = { page: "day-" + gh.date, nodes: [...gh.w.childNodes] }; MO.skip = 1; history.pushState(null, "", "#day-" + gh.date); try { route(); } finally { MO.adopt = null; try { a.cancel(); } catch (e) {} v.style.transform = ""; clean(); MO.busy = false; } };
      b.onfinish = finish; setTimeout(finish, 900);
    } else {
      const a = moAnim(v, s.tx, 0, vel, frame, 300, 30); v.style.transform = "";
      if (gh) moAnim(gh.g, s.dx + s.dir * W, s.dir * W, vel, frame, 300, 34);
      let fin = false; const finish = () => { if (fin) return; fin = true; try { a.cancel(); } catch (e) {} clean(); MO.busy = false; }; a.onfinish = finish; setTimeout(finish, 900);
    }

}

// --- Hero photos: drift slower than the page, stretch on a pull-down ---
{ let queued = false, last = null;

// Encrypted build: the trip data is locked with a shared trip passcode, entered once per phone.
async function unlock(pass, enc){
  const b = s => Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b(enc.salt), iterations:150000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b(enc.iv)}, key, b(enc.ct));
  if (enc.z) return JSON.parse(await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"))).text());
  return JSON.parse(new TextDecoder().decode(pt));
}
function lockScreen(enc, msg){
  $("#view").innerHTML = `<form class="lock" id="lockform"><div class="brand" style="font-size:30px">Vietnam<span>’26</span></div>
    <label for="pass" class="muted">Enter the trip passcode. You only need to do this once on this phone.</label>
    <input id="pass" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" enterkeyhint="go" placeholder="Trip passcode" required>
    <button class="btn solid">Unlock</button>${msg?`<div class="err">${esc(msg)}</div>`:""}</form>`;
  $("#lockform").addEventListener("submit", async e=>{ e.preventDefault(); const p=$("#pass").value.trim();
    try { const d = await unlock(p, enc); store.set("trip-pass", p); start(d); } catch(err){ lockScreen(enc, "That passcode didn't work. Check it with Praneeth and try again."); } });
}
