  background:rgb(255 255 255/.55);-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);box-shadow:inset 0 0 0 1px rgb(255 255 255/.7),0 4px 14px rgb(20 40 80/.12)}

/* ── Nov 5 round 2 ── */

/* Check-in card. */

/* Trip map button and sheet. */

.tm-list{display:grid;gap:6px;padding-top:6px}

.tm-row.now{box-shadow:inset 0 0 0 2px var(--city)}

/* ── Nov 5 round 3: liquid glass wallet, gates, Ninh Bình spur ── */
.wcard{background:linear-gradient(150deg,color-mix(in srgb,var(--c2) 70%,transparent),color-mix(in srgb,var(--c1) 84%,transparent));
  -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);overflow:hidden;

  background:radial-gradient(120% 70% at 0% 0%,rgb(255 255 255/.32),transparent 55%),linear-gradient(180deg,rgb(255 255 255/.14),transparent 30%)}

.wc-f{grid-template-columns:minmax(0,.8fr) minmax(0,1fr) minmax(0,.9fr) minmax(0,1.45fr);gap:5px}.wc-f .wf{padding:8px 7px}.wf b{font-size:14px}
.wc-track{display:flex;align-items:center;gap:10px;margin:12px 16px 0;min-height:52px;padding:8px 14px;border-radius:14px;text-decoration:none;color:#fff;
  background:rgb(255 255 255/.18);box-shadow:inset 0 0 0 1px rgb(255 255 255/.38),inset 0 1px 0 rgb(255 255 255/.55)}
.wc-track .ic2{width:20px;height:20px;color:#f2c94c;flex:none}.wc-track span{flex:1;display:grid}.wc-track b{font:800 14.5px var(--body)}.wc-track small{font:600 12px var(--body);color:rgb(255 255 255/.75)}
.wc-track i{font-style:normal;font-weight:800;opacity:.8}
.wc-f .wf.chg{background:#da251d}
.wcard .wc-qr{padding-top:10px}
.wc-ck{font:800 12px var(--body);font-style:normal;padding:4px 9px;border-radius:999px;background:rgb(255 255 255/.22);box-shadow:inset 0 0 0 1px rgb(255 255 255/.35);white-space:nowrap}
.wc-ck.on{background:#2e8b57;box-shadow:none}

.wc-ckrow i{font-style:normal;font-weight:800}

  background:rgb(255 255 255/.7);-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);box-shadow:inset 0 0 0 1px rgb(255 255 255/.8),0 6px 18px rgb(20 40 80/.18)}

function tripNow(){
  const n = new Date(), at = tz => { try { const p = Object.fromEntries(new Intl.DateTimeFormat("en-CA", { timeZone: tz, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(n).map(x => [x.type, x.value])); return { iso: `${p.year}-${p.month}-${p.day}`, min: (+p.hour % 24) * 60 + +p.minute }; } catch (e) { return null; } };

function todayIso(){

const W = "https://en.wikipedia.org/api/rest_v1/page/";
const wkey = t => encodeURIComponent(t.replace(/ /g,"_"));
const BAD = /(\.svg|\.gif|flag|coat_of_arms|logo|location|locator|map|seal_of|emblem|icon|signature)/i;
async function cachedJson(k, url){
  try{ const c=JSON.parse(store.get(k)||"null"); if(c) return c; }catch(e){}
  try{ const r=await fetch(url); if(!r.ok) throw 0; const j=await r.json(); return j; }catch(e){ return null; }
}
// Bundled photos first (shipped with the app, work offline from the first open), Wikipedia only for anything not bundled.
async function wikiLead(title){
  const B = T.photos; if (B && title in B.lead) return B.lead[title];
  const k="wl-"+title; try{ const c=store.get(k); if(c) return JSON.parse(c); }catch(e){}
  const j = await cachedJson(k, W+"summary/"+wkey(title)); if(!j) return null;
  const src = j.thumbnail?.source ? j.thumbnail.source.replace(/\/\d+px-/,"/960px-") : j.originalimage?.source;
  if (!src || BAD.test(src)) { store.set(k, "null"); return null; }

  store.set(k, JSON.stringify(out)); return out;
}
async function wikiGallery(title){

  const j = await cachedJson(k, W+"media-list/"+wkey(title)); if(!j) return [];

const hm = h => { h=((h%24)+24)%24; let H=Math.floor(h), M=Math.round((h-H)*60); if(M===60){H++;M=0;} const ap=H>=12?"PM":"AM"; return `${(H%12)||12}:${String(M).padStart(2,"0")} ${ap}`; };
// Sunset in local hours (NOAA approximation).
function sunset(lat, lon, iso, tz){
  const d = parse(iso), n = Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()) - Date.UTC(d.getFullYear(),0,0))/864e5);
  const g = 2*Math.PI/365*(n-1);
  const eq = 229.18*(0.000075+0.001868*Math.cos(g)-0.032077*Math.sin(g)-0.014615*Math.cos(2*g)-0.040849*Math.sin(2*g));
  const dec = 0.006918-0.399912*Math.cos(g)+0.070257*Math.sin(g)-0.006758*Math.cos(2*g)+0.000907*Math.sin(2*g)-0.002697*Math.cos(3*g)+0.00148*Math.sin(3*g);
  const r = Math.PI/180, ha = Math.acos(Math.cos(90.833*r)/(Math.cos(lat*r)*Math.cos(dec))-Math.tan(lat*r)*Math.tan(dec))/r;
  return (720 - 4*(lon - ha) - eq)/60 + tz;
}
function sunFor(city, iso){ const P=T.info.places[city]; if(!P) return null; return sunset(P.lat, P.lon, iso, TZ(city)); }

// Evening look: Auto switches to the dark Postcard after sunset where you are.

  const mc=document.querySelector('meta[name="theme-color"]'); const cl=document.documentElement.classList; if(mc) mc.content = cl.contains("street") ? (dark?"#0d1830":"#f2c94c") : dark ? (cl.contains("press")?"#121212":"#141414") : (cl.contains("press")?"#fff5d6":"#fff8e7");

// Evening: what's first tomorrow, an alarm time, and what to bring.
function parseItemTime(t){ const m=String(t).match(/(\d{1,2})(?::(\d{2}))?\s*(AM|PM)/i); if(!m) return null; let H=+m[1]%12; if(/pm/i.test(m[3])) H+=12; return H+(+(m[2]||0))/60; }

  let alarm = null, why = "";
  const early = nd.items.map(x=>[parseItemTime(x[0]),x]).filter(([t])=>t!=null && t>=4).sort((a,b)=>a[0]-b[0])[0];

  if (leg){ const [H,M]=leg.dep.slice(11,16).split(":").map(Number), la = H+M/60 - (/SRQ|DAD/.test(leg.from)?2.5:3.5); if (alarm==null || la < alarm){ alarm = la; why = `${leg.no} departs ${localTime(leg.dep)}`; } }
  const bring = checklistFor(nd);
  return `<h3>Tonight: get ready for ${esc(DOW[parse(nd.date).getDay()])}</h3><div class="card tmr"><div class="tmr-h"><span class="tmr-ico">${ico("alarm")}</span><div>${alarm!=null?`<b>Set an alarm for ${hm(Math.max(alarm,4))}</b>`:`<b>No early start</b>`}<span class="small muted">${esc(why||nd.title)}</span></div></div>

// Opening notes and the hop between stops, inside the day plan.
const COORD = name => (MOg().coords||{})[name];
function hav(a,b){ const r=Math.PI/180, dl=(b[0]-a[0])*r, dn=(b[1]-a[1])*r, x=Math.sin(dl/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dn/2)**2; return 12742*Math.asin(Math.sqrt(x)); }
function hopHtml(a, b){
  const A=COORD(a.name), B=COORD(b.name); if(!A||!B||a===b) return "";
  const km = hav(A,B)*1.3; if (km < 0.15 || km > 40) return "";
  const walk = Math.round(km/4.5*60), grab = Math.round(4 + km/20*60), fare = Math.max(30, Math.round((12 + km*14)/5)*5);
  return `<div class="hop">↳ From ${esc(a.name)}: ${km<1?Math.round(km*1000)+" m":km.toFixed(1)+" km"} · ${walk<=25?`${walk} min walk`:`Grab ~${grab} min, ~${fare}k ₫`}${walk<=25&&walk>12?` (Grab ~${grab} min)`:""}</div>`;
}
function hoursHtml(ps, iso){
  const wd = parse(iso).getDay(), out=[];
  for (const p of ps){ const H=(MOg().hours||{})[p.name]; if(!H) continue;
    if (H.closed && H.closed.includes(wd)) out.push(`<span class="hrs bad">${esc(p.name)} is closed on ${DOW[wd]}s</span>`);
    else if (H.open && !H.open.includes(wd)) out.push(`<span class="hrs bad">${esc(p.name)}: not open on ${DOW[wd]}s</span>`);
    else if (H.show && !H.show.includes(wd)) out.push(`<span class="hrs">${esc(H.note)} Not tonight.</span>`);
    else out.push(`<span class="hrs">${esc(H.note)}</span>`); }
  return out.length ? `<div class="hrsrow">${out.join("")}</div>` : "";
}

// Calendar reminders (.ics): flights and key moments, with alerts.
function icsDate(s){ return new Date(Date.parse(s)).toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,""); }
function icsText(){
  const ev=[], esc2=s=>String(s).replace(/[,;\\]/g,m=>"\\"+m).replace(/\n/g,"\\n");
  for (const l of myLegs()){ if(!l.dep) continue; const end=l.arr||new Date(Date.parse(l.dep)+2*36e5).toISOString();
    ev.push({uid:"leg-"+l.no.replace(/\W/g,"")+"-"+l.dep.slice(0,10), t:`✈ ${l.no} ${l.from} → ${l.to}`, s:l.dep, e:end, d:[l.by, l.seats?"Seats "+l.seats:"", ...(l.tips||[])].filter(Boolean).join("\n"), a:[24*60, /SRQ|DAD/.test(l.from)?120:180]}); }
  for (const r of (MOg().reminders||[])){ if(r.pb && !PB()) continue; ev.push({uid:"r-"+r.at, t:r.t, s:r.at, e:new Date(Date.parse(r.at)+(r.mins||30)*6e4).toISOString(), d:"From the Vietnam '26 app", a:r.alarms||[0]}); }
  // Morning nudge: 8 AM local on each Vietnam day, with the day's "before you head out" list.
  for (const d of T.days){ if (!VN(d.city) || typeof checklistFor !== "function") continue;
    const items = checklistFor(d).map(x => x[0]).filter(Boolean); if (!items.length) continue;
    const s0 = new Date(Date.parse(d.date + "T08:00:00+07:00")).toISOString();
    ev.push({uid:"am-"+d.date, t:`☀ ${CITYV[d.city]||d.place}: ${d.title}`, s:s0, e:new Date(Date.parse(s0)+15*6e4).toISOString(), d:"Before you head out:\n• " + items.slice(0,8).join("\n• ") + "\n\nOpen Today in the Vietnam '26 app for the full plan.", a:[0]}); }
  const lines=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Vietnam26//Trip//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:Vietnam '26"];
  const stamp=icsDate(new Date().toISOString());
  for (const x of ev){ lines.push("BEGIN:VEVENT",`UID:${x.uid}@vietnam26`,`DTSTAMP:${stamp}`,`DTSTART:${icsDate(x.s)}`,`DTEND:${icsDate(x.e)}`,`SUMMARY:${esc2(x.t)}`,`DESCRIPTION:${esc2(x.d)}`);
    for (const m of x.a) lines.push("BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${esc2(x.t)}`,`TRIGGER:-PT${m}M`,"END:VALARM");
    lines.push("END:VEVENT"); }
  lines.push("END:VCALENDAR"); return { text: lines.join("\r\n"), n: ev.length };
}
document.addEventListener("click", async e=>{ const b=e.target.closest("[data-ics]"); if(!b) return; e.preventDefault();
  const {text} = icsText(), file = new File([text], "vietnam26-reminders.ics", {type:"text/calendar"});
  try { if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file], title:"Vietnam '26 reminders"}); return; } } catch(err){ if (err && err.name==="AbortError") return; }
  const url = URL.createObjectURL(file); location.href = url; setTimeout(()=>URL.revokeObjectURL(url), 60000);
});

// Offline city maps: CARTO tiles, cached by the service worker.
const TILE = (z,x,y) => `https://tile.openstreetmap.org/${z}/${x}/${y}.png`;
const lon2x = (lon,z) => (lon+180)/360*256*2**z;
const lat2y = (lat,z) => { const s=Math.sin(lat*Math.PI/180); return (0.5-Math.log((1+s)/(1-s))/(4*Math.PI))*256*2**z; };
const x2lon = (x,z) => x/(256*2**z)*360-180;
const y2lat = (y,z) => { const n=Math.PI-2*Math.PI*y/(256*2**z); return 180/Math.PI*Math.atan(0.5*(Math.exp(n)-Math.exp(-n))); };
let MAP = { city: store.get("map-city") || "Saigon" };
function mapPins(city){ return T.places.filter(p=>p.city===city && COORD(p.name)); }
// City names are stored in plain English (they're data keys); show them in Vietnamese.
const VIN = c => ({"Saigon":"Sài Gòn","Ho Chi Minh City":"Sài Gòn","Hoi An":"Hội An","Da Nang":"Đà Nẵng","Hanoi":"Hà Nội","Ninh Binh":"Ninh Bình"})[c] || c;
// Centre and zoom the Google map so every pin in the city fits on screen.
function gmFit(pins, cfg){
  const P = pins.map(p => COORD(p.name)).filter(c => c && isFinite(c[0]) && isFinite(c[1]));
  if (!P.length) return cfg.c ? `&ll=${cfg.c[0]},${cfg.c[1]}&z=${cfg.z || 14}` : "";
  const la = P.map(c => c[0]), lo = P.map(c => c[1]), la0 = Math.min(...la), la1 = Math.max(...la), lo0 = Math.min(...lo), lo1 = Math.max(...lo);
  const W = Math.max(280, Math.min(innerWidth, 700) - 40), H = Math.min(innerHeight * .62, 520) - 60;
  const zx = Math.log2(W * 360 / (256 * Math.max(lo1 - lo0, .002))), zy = Math.log2(H * 360 / (256 * Math.max(la1 - la0, .002) * 1.05));
  const z = Math.max(9, Math.min(16, Math.floor(Math.min(zx, zy))));
  return `&ll=${((la0 + la1) / 2).toFixed(5)},${((lo0 + lo1) / 2).toFixed(5)}&z=${z}`;
}

let WN = { here: null, n: 3 };
function openAt(S, h, wd){
  if (S[3] && !S[3].includes(wd)) return null;
  for (const [a,b] of S[2]){ if (h >= a && h < b - 0.25) return b; if (h + 24 >= a && h + 24 < b - 0.25) return b - 24; }
  return null;
}
function rainPct(city, iso){ try{ return JSON.parse(store.get("wx-"+city)||"null")?.days?.[iso]?.p ?? null; }catch(e){ return null; } }
function whatNow(){
  const iso = todayIso(), d = dayOf(iso), wd = parse(iso).getDay(), h = nowH();
  const city = d && VN(d.city) ? d.city : "hcmc", M = (MOg().maps||{})[MAPCITY(city)];
  const origin = WN.here || (M && M.c), rain = rainPct(city, iso);
  const planned = new Set((d ? d.items : []).flatMap(x=>placesFor(x[1], d.city)).map(p=>p.name));
  const meal = (h>=11 && h<14) || (h>=17.5 && h<21), coffee = (h>=7 && h<11) || (h>=14 && h<17.5), late = h>=18;
  const out = [];
  for (const [name, S] of Object.entries(MOg().spots||{})){
    const C = COORD(name); if (!C || !origin) continue;
    const km = hav(origin, C)*1.3; if (km > 12) continue;
    const till = openAt(S, h, wd); if (till == null) continue;
    let score = -km*1.6;
    if (S[0]==="eat" && meal) score += 3; if (S[0]==="coffee" && coffee) score += 2.5;
    if ((S[0]==="night"||S[0]==="walk") && late) score += 3; if ((S[0]==="night") && !late) score -= 2;
    if (rain!=null && rain>=50) score += S[1] ? 2 : -2.5;
    if (till - h < 1) score -= 2;
    if (planned.has(name)) score -= 1.5;
    out.push({ name, S, km, till, score, planned: planned.has(name) });
  }
  return { list: out.sort((a,b)=>b.score-a.score), rain, city, origin, d };
}
function getThere(km){
  const walk = Math.round(km/4.5*60), grab = Math.round(4 + km/20*60), fare = Math.max(30, Math.round((12 + km*14)/5)*5);

}

function cashFor(d){
  if (!d || !VN(d.city)) return null;
  const F = MOg().fees||{}, B = MOg().cashBase||{food:350000,ride:40000,buffer:200000};
  const names = [...new Set(d.items.flatMap(x=>placesFor(x[1], d.city)).map(p=>p.name))];
  const lines = [];
  names.forEach(n=>{ if (F[n]) lines.push([n, F[n]]); });
  const txt = d.items.map(x=>x[1]).join(" ").toLowerCase();
  const rides = (txt.match(/\bgrab\b|\bcar to\b|\bcar\b|taxi|transfer/g)||[]).length;
  const fine = /coco|\bgia\b|tasting menu|la maison|anan/.test(txt);
  lines.push([fine ? "Street food, coffee and snacks (dinner on card)" : "Meals, coffee and snacks", fine ? Math.round(B.food*0.6) : B.food]);
  if (rides) lines.push([`${rides} ride${rides>1?"s":""}, shared`, rides*B.ride]);
  lines.push(["Tips and small extras", B.buffer]);
  const total = lines.reduce((s,l)=>s+l[1],0);
  return { total, lines };
}

  const pool = [...F.filter(x=>names.has(x.f[1])), ...F.filter(x=>d && x.f[1]===d.city), ...F.filter(x=>x.f[1]==="all")];
  const seed = hashStr(d ? d.date : todayIso()), out = [], seen = new Set();
  const groups = [pool.filter(x=>names.has(x.f[1])), pool.filter(x=>d && x.f[1]===d.city), pool.filter(x=>x.f[1]==="all")];

const HUNT = () => FX().hunt || [];

// Photos live in IndexedDB on this phone only.
const IDB = { db: null,
  open(){ if (this.db) return Promise.resolve(this.db); return new Promise((ok, no)=>{ const r = indexedDB.open("vietnam26", 1); r.onupgradeneeded = ()=>r.result.createObjectStore("hunt"); r.onsuccess = ()=>{ this.db = r.result; ok(this.db); }; r.onerror = ()=>no(r.error); }); },
  async put(k, v){ const db = await this.open(); return new Promise((ok, no)=>{ const t = db.transaction("hunt","readwrite"); t.objectStore("hunt").put(v, k); t.oncomplete = ok; t.onerror = ()=>no(t.error); }); },
  async get(k){ const db = await this.open(); return new Promise(ok=>{ const r = db.transaction("hunt").objectStore("hunt").get(k); r.onsuccess = ()=>ok(r.result||null); r.onerror = ()=>ok(null); }); },
  async del(k){ const db = await this.open(); return new Promise(ok=>{ const t = db.transaction("hunt","readwrite"); t.objectStore("hunt").delete(k); t.oncomplete = ok; t.onerror = ok; }); },
};

// Daily bounty: one item per trip day, worth double if caught that day.
function bountyFor(iso){
  const d = dayOf(iso); if (!d || !VN(d.city)) return null;
  const pool = HUNT().filter(h=>h[1] < 5 && (!h[3] || h[3]===d.city));
  return pool.length ? pool[hashStr("bounty"+iso) % pool.length] : null;
}
function scoreAll(){
  const R = boardRecords(), first = {}, aw = {}, SP = Object.fromEntries(SPEAK().map(x=>[x[0], x[4]]));
  R.forEach(r=>Object.entries(r.h||{}).forEach(([id,ts])=>{ if (first[id]==null || ts < first[id].ts) first[id] = {ts, n: r.n}; }));
  R.forEach(r=>(r.aw||[]).forEach(a=>{ aw[a.id] = a; }));
  Object.values(aw).forEach(a=>{ if (!R.some(r=>r.n===a.to)) R.push({ n: a.to, t: 0 }); });
  const champ = R.reduce((m,r)=>Math.max(m, r.hg||0), 0);
  return R.map(r=>{
    let hunt = 0, bonus = 0;
    Object.entries(r.h||{}).forEach(([id,ts])=>{ const it = huntItem(id); if (!it) return;
      const day = isoOf(new Date(ts)), b = bountyFor(day); let p = it[1]; if (b && b[0]===id) p *= 2;
      hunt += p; if (first[id] && first[id].n===r.n && R.length > 1) bonus++; });
    const trivia = (r.tr||[]).length, bingo = r.bg||0;
    const bill = Object.values(aw).filter(a=>a.to===r.n && a.g==="bill").reduce((s,a)=>s+a.p, 0);
    const haggle = Math.floor((r.hg||0)/10) + (champ > 0 && r.hg===champ && R.length > 1 ? 3 : 0);
    const speak = Object.keys(r.sp||{}).reduce((s,k)=>s+(SP[k]||0), 0);
    return { n: r.n, t: r.t, hunt, bonus, trivia, bingo, bill, haggle, speak, found: Object.keys(r.h||{}).length,
      total: hunt + bonus + trivia + bingo + bill + haggle + speak, me: r.n===ME() };
  }).sort((a,b)=>b.total-a.total || a.n.localeCompare(b.n));
}

// ===== Live leaderboard: every phone writes its own scores to one shared room and listens for everyone else's.
// Firebase Realtime Database over plain REST and server-sent events (no SDK). Works offline: changes wait and send later.
const LIVE = { es: null, room: null, dirty: false, timer: null, state: "off", seen: 0, ping0: Date.now() };
const LIVE_OFF = location.protocol === "file:" || /^(localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\])$/.test(location.hostname);
const liveBase = () => T && T.live && !LIVE_OFF ? `${T.live.db}/v26/${T.live.room}` : null;
const SCORE_KEYS = new Set(["hunt-found","trivia-right","trivia-scores","bingo","awards","haggles","speak"]);
function takeRecord(x){
  if (!x || !x.n || x.n === ME()) return false;
  const B = local.get("board", {}), rec = { n:x.n, t:x.t*60000, tr:x.tr||[], tb:x.tb||0, h:{}, bg:x.bg||0, hg:x.hg||0, sp:x.sp||{}, aw:(x.aw||[]).map(a=>({id:a[0], to:a[1], p:a[2], g:a[3], ts:a[4]*60000})) };
  Object.entries(x.h||{}).forEach(([k,v])=>rec.h[k]=v*60000);
  if (B[x.n] && B[x.n].t > rec.t) return false;
  B[x.n] = rec; store.set("board", JSON.stringify(B)); return true;
}
function livePush(soon){
  if (!liveBase() || !ME()) return; LIVE.dirty = true; clearTimeout(LIVE.timer);
  LIVE.timer = setTimeout(async ()=>{
    if (!navigator.onLine) return;
    try { const r = await fetch(`${liveBase()}/scores/${encodeURIComponent(ME())}.json`, { method: "PUT", body: JSON.stringify(compactRecord()) });
      if (r.ok){ LIVE.dirty = false; liveStatus(); } } catch(e){}
  }, soon ? 300 : 1500);
}
function liveApply(path, data){
  // Keep a mirror of the room, then copy everyone else's scores into this phone's board.
  if (path === "/") LIVE.room = data || {};
  else { LIVE.room = LIVE.room || {}; const parts = path.split("/").filter(Boolean).map(decodeURIComponent); let o = LIVE.room;
    for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]] = (o[parts[i]] && typeof o[parts[i]] === "object") ? o[parts[i]] : {};
    if (data == null) delete o[parts[parts.length-1]]; else o[parts[parts.length-1]] = data; }
  if (typeof gatesSync === "function") gatesSync((LIVE.room||{}).gates);
  if (typeof edSync === "function") edSync((LIVE.room||{}).edits);
  let changed = false; Object.values((LIVE.room||{}).scores || {}).forEach(x=>{ if (takeRecord(x)) changed = true; });
  const pg = (LIVE.room||{}).ping;
  if (pg && pg.t > LIVE.ping0 && pg.t > LIVE.seen){ LIVE.seen = pg.t; if (pg.by !== ME()){ toast(`${pg.by} refreshed everyone's app`); liveRefresh(); } }
  LIVE.seen = Math.max(LIVE.seen, (pg && pg.t) || 0);
  LIVE.state = "on"; liveStatus();
  if (changed && /^#(board|games)$/.test(location.hash)){ const y = scrollY; route(); scrollTo(0, y); }
}
function liveListen(){
  if (!liveBase() || !window.EventSource) return; liveStop();
  const es = LIVE.es = new EventSource(`${liveBase()}.json`);
  const on = ev => { try { const m = JSON.parse(ev.data); if (m) liveApply(m.path, m.data); } catch(e){} };
  es.addEventListener("put", on); es.addEventListener("patch", ev => { try { const m = JSON.parse(ev.data); Object.entries(m.data||{}).forEach(([k,v])=>liveApply((m.path==="/"?"":m.path)+"/"+k, v)); } catch(e){} });
  es.onerror = () => { LIVE.state = navigator.onLine ? "retry" : "off"; liveStatus(); };
}
function liveStop(){ if (LIVE.es){ LIVE.es.close(); LIVE.es = null; } }
async function liveRefresh(){
  // Fetch the newest app (if one was published) and reload; scores come back with the page.
  try { const r = await navigator.serviceWorker?.getRegistration(); await r?.update(); } catch(e){}
  setTimeout(()=>location.reload(), 900);
}
function liveStatus(){
  const el = document.getElementById("live-st"); if (!el) return;
  el.textContent = !liveBase() ? "" : LIVE.dirty && !navigator.onLine ? "Offline. Your scores will send when you're back online."
    : LIVE.state === "on" ? "Live. Scores update on everyone's phone as you play." : "Connecting…";
  el.dataset.st = LIVE.state;
}
function liveInit(){
  if (!liveBase()) return;
  const set0 = local.set; local.set = (k, v) => { set0(k, v); if (SCORE_KEYS.has(k)) livePush(); };
  livePush(true); liveListen();
  document.addEventListener("visibilitychange", ()=>{ if (document.visibilityState === "visible"){ liveListen(); if (LIVE.dirty) livePush(true); } else liveStop(); });
  addEventListener("online", ()=>{ liveListen(); livePush(true); });
}
document.addEventListener("click", async e=>{
  const b = e.target.closest("[data-liveping]"); if (!b) return;
  if (!liveBase()) return liveRefresh();
  try { await fetch(`${liveBase()}/ping.json`, { method: "PUT", body: JSON.stringify({ t: Date.now(), by: ME() }) }); toast("Refreshing everyone's app"); } catch(err){ toast("No connection. Try again when you're online."); return; }
  liveRefresh();
});
document.addEventListener("click", e=>{ if (e.target.closest("[data-liverefresh]")){ livePush(true); liveListen(); toast("Scores refreshed"); } });

async function hydrateHunt(){

async function shrink(file){
  const bmp = await createImageBitmap(file), k = Math.min(1, 1400/Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width*k); c.height = Math.round(bmp.height*k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(ok=>c.toBlob(ok, "image/jpeg", .82));
}

// Travelling pill: which stop and year you're reading. IntersectionObserver only, no scroll handlers.
let TLFIO = [];
function tlfWatch(){
  TLFIO.forEach(o => o.disconnect()); TLFIO = [];
  document.querySelectorAll("body > .tlf-pill").forEach(x => x.remove());
  const pill = document.getElementById("tlfpill"); if (!pill) return; document.body.appendChild(pill);
  const name = document.getElementById("tlfname"), yr = document.getElementById("tlfyr"), stops = [...document.querySelectorAll(".tlf-stop")];
  const hdr = (document.querySelector("header.top") || {}).offsetHeight || 60, band = `-${hdr + 40}px 0px -${Math.round(innerHeight * .6)}px 0px`;
  const setStop = sec => { const i = stops.indexOf(sec); name.textContent = sec.dataset.name; pill.querySelectorAll(".tlf-dots i").forEach((d, j) => { d.className = j < i ? "past" : j === i ? "on" : ""; }); };
  const so = new IntersectionObserver(es => { es.forEach(e => { if (e.isIntersecting) setStop(e.target); }); }, { rootMargin: band });
  stops.forEach(s => so.observe(s));
  const yo = new IntersectionObserver(es => { es.forEach(e => { if (e.isIntersecting && yr.textContent !== e.target.dataset.y){ yr.textContent = e.target.dataset.y; } }); }, { rootMargin: band });
  document.querySelectorAll(".tlf li[data-y]").forEach(li => yo.observe(li));
  const first = stops[0], vo = new IntersectionObserver(es => { es.forEach(e => pill.classList.toggle("show", !e.isIntersecting && e.boundingClientRect.top < 0)); }, { rootMargin: `-${hdr}px 0px 0px 0px` });
  if (first) vo.observe(first.querySelector(".tlf-h"));
  TLFIO = [so, yo, vo];
}

  const P = ((FULL || T).preLegs || {})[name]; if (!Array.isArray(P) || !P.length) return null;
  return P.map(l => { const [dd, dt] = (l.dep || "").split(/[ T]/), [ad, at] = (l.arr || "").split(/[ T]/);
    return suToLeg({ no: l.no || "", ref: l.ref || "", from: (l.from || "").toUpperCase(), to: (l.to || "").toUpperCase(), dd, dt: (dt || "").slice(0, 5), ad, at: (at || "").slice(0, 5), dir: l.dir === "out" ? "out" : "in" }); }).filter(Boolean);
}
// Runs before the setup flow's own click handler: a cousin with flights loaded ahead goes straight to "You're set".
document.addEventListener("click", e => {
  if (!SU) return; const w = e.target.closest("[data-suwho]"); if (!w) return;
  const n = w.dataset.suwho; if (["Praneeth", "Bindu"].includes(n) || myF().length && store.get("trip-me") === n) return;
  const L = preLegsFor(n); if (!L || !L.length) return;
  e.stopImmediatePropagation(); store.set("trip-me", n); SU.name = n; local.set("my-legs", L); store.set("setup-done", "1"); T = scoped(FULL);
  SU.share = "sending"; shareArrival().then(ok => { if (!SU || SU.step !== 4) return; SU.share = ok ? "ok" : "later"; const r = $("#su-share"); if (r) r.outerHTML = suShareRow(); });
  SU.step = 4; setupRender();
}, true);

// ── 5. Reminders that ping the phone, even with the app closed ──
// iPhone web apps can't schedule their own alerts, so each phone uploads its subscription and its reminder times
// (plain labels, no booking refs) to push/<name>; a scheduled GitHub job (.github/workflows/remind.yml) sends them.
const pushOK = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
const isStandalone = () => navigator.standalone || matchMedia("(display-mode: standalone)").matches;
function pushList(){
  const now = Date.now(), out = [], plain = s => s.replace(/\s*\((?:ref\s+)?[A-Z0-9]{6}\)/g, "").replace(/\s*ref\s+[A-Z0-9]{6}/gi, "").trim();
  const want = /leave for|head to .*airport|grab to tan son|car to noi bai|check in online|check ?out/i;
  for (const r of (MOg().reminders || [])) { if (r.pb && !PB()) continue; if (!want.test(r.t)) continue;
    const at = Date.parse(r.at) - ((r.alarms || [0])[0] || 0) * 6e4; if (at > now) out.push({ at, t: plain(r.t) }); }
  if (!PB()) { let prev = null;
    personalLegs().slice().sort((a, b) => a.dep.localeCompare(b.dep)).forEach(l => { const dep = Date.parse(l.dep);
      if (!prev || dep - Date.parse(prev.arr || prev.dep) > 12 * 36e5) {
        if (dep - 3 * 36e5 > now) out.push({ at: dep - 3 * 36e5, t: `Leave for the airport: ${l.no} at ${t12(l.dep)} from ${l.from}` });
        if (dep - 24 * 36e5 > now) out.push({ at: dep - 24 * 36e5, t: `Online check-in is open for ${l.no}` }); }
      prev = l; }); }
  return out.sort((a, b) => a.at - b.at).slice(0, 40);
}
async function pushSync(sub){
  const base = liveBase(); if (!base || !ME() || !pushOK()) return false;
  try { if (!sub) { const reg = await navigator.serviceWorker.ready; sub = await reg.pushManager.getSubscription(); } if (!sub) return false;
    const r = await fetch(`${base}/push/${encodeURIComponent(ME())}.json`, { method: "PATCH", body: JSON.stringify({ sub: sub.toJSON(), list: pushList(), t: Date.now() }) }); return r.ok; } catch (e) { return false; }
}
async function pushOn(){
  if (!T.vapid || !liveBase()) return toast("Reminders aren't switched on in this version of the app yet.");
  if (!pushOK() || !isStandalone()) return toast(isStandalone() ? "Reminders need iOS 16.4 or newer: Settings, General, Software Update." : "Open the app from your Home Screen first (Safari: Share, Add to Home Screen), then turn reminders on there.");
  let p; try { p = await Notification.requestPermission(); } catch (e) { p = "denied"; }
  if (p !== "granted") return toast("Notifications are off. Turn them on in Settings, Notifications, Vietnam '26.");
  try { const reg = await navigator.serviceWorker.ready;
    const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64d(T.vapid.replace(/-/g, "+").replace(/_/g, "/") + "=".repeat((4 - T.vapid.length % 4) % 4)) });
    store.set("push-on", "1"); const ok = await pushSync(sub); toast(ok ? "Reminders on" : "Reminders on. They'll sync when you're back online."); pushUi(); }
  catch (e) { toast("Couldn't turn reminders on. Try again in a minute."); }
}
async function pushOffNow(){
  store.del("push-on"); try { const reg = await navigator.serviceWorker.ready, s = await reg.pushManager.getSubscription(); if (s) await s.unsubscribe(); } catch (e) {}
  const base = liveBase(); if (base) fetch(`${base}/push/${encodeURIComponent(ME())}.json`, { method: "DELETE" }).catch(() => {});
  toast("Reminders off"); pushUi();
}
function pushCardHtml(){
  if (!T || !T.vapid) return ""; // the sender isn't set up yet
  const on = store.get("push-on") === "1", n = pushList().length;
  return `<div class="card pushc" id="pushc"><b>Reminders on this phone</b><p class="small" style="margin:4px 0 10px">${on ? `On. ${n} coming up: leave for the airport, check-in opens and checkout.` : "Pings this phone even with the app closed: leave for the airport, online check-in opens, and checkout time."}</p>
    <div class="btns" style="margin:0">${on ? `<button type="button" class="btn" data-pushoff>Turn reminders off</button>` : `<button type="button" class="btn solid" data-pushon>Turn on reminders</button>`}</div>
    ${on ? "" : `<p class="small muted" style="margin:8px 0 0">Works from the Home Screen app on iOS 16.4 or newer. You'll be asked to allow notifications once.</p>`}</div>`;
}
function pushUi(){ document.querySelectorAll("#pushc").forEach(el => { el.outerHTML = pushCardHtml(); }); }
document.addEventListener("click", e => { if (e.target.closest("[data-pushon]")) { e.preventDefault(); pushOn(); } if (e.target.closest("[data-pushoff]")) { e.preventDefault(); pushOffNow(); } });
// Keep this phone's reminder list current after the app updates (plans and flights may have changed).
setTimeout(() => { if (store.get("push-on") === "1" && T) pushSync(); }, 8000);

function launch(){
  if (!ME()) return picker();
  if (typeof edInit === "function") edInit(); T = scoped(FULL); if (typeof fxApply === "function") fxApply(); afterTripReady(); if (!LIVE.init){ LIVE.init = 1; liveInit(); } $("#tabs").hidden=false; current=null; route();
  setTimeout(()=>prefetchPhotos().catch(()=>{}), 4000);
}
function start(data){
  FULL = data; window.addEventListener("hashchange",()=>{ if(T && ME()) requestAnimationFrame(()=>route()); }); launch();
  // Tabs and section buttons replace the history entry, so the iPhone back-swipe can't flip between tabs.
  document.addEventListener("click",e=>{ const a=e.target.closest("#tabs a[href^='#'], nav.seg a[href^='#']"); if(!a) return; e.preventDefault(); const h=a.getAttribute("href");
    if (location.hash!==h){ history.replaceState(null,"",h); if(T && ME()) route(); } },true);
}

// Encrypted build: the trip data is locked with a shared trip passcode, entered once per phone.
async function unlock(pass, enc){
  const b = s => Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b(enc.salt), iterations:150000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b(enc.iv)}, key, b(enc.ct));
  if (enc.z) return JSON.parse(await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"))).text());
  return JSON.parse(new TextDecoder().decode(pt));
}
function lockScreen(enc, msg){
  $("#view").innerHTML = `<form class="lock" id="lockform"><div class="brand" style="font-size:30px">Vietnam<span>’26</span></div>
    <label for="pass" class="muted">Enter the trip passcode. You only need to do this once on this phone.</label>
    <input id="pass" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" enterkeyhint="go" placeholder="Trip passcode" required>
    <button class="btn solid">Unlock</button>${msg?`<div class="err">${esc(msg)}</div>`:""}</form>`;
  $("#lockform").addEventListener("submit", async e=>{ e.preventDefault(); const p=$("#pass").value.trim();
    try { const d = await unlock(p, enc); store.set("trip-pass", p); start(d); } catch(err){ lockScreen(enc, "That passcode didn't work. Check it with Praneeth and try again."); } });
}

if (window.TRIP) start(window.TRIP);
else if (window.TRIP_ENC){
  const saved = store.get("trip-pass");
  if (saved) unlock(saved, window.TRIP_ENC).then(start).catch(err=>{ if (window.TRIP_ENC.z && typeof DecompressionStream==="undefined"){ $("#view").innerHTML=`<div class="card" style="margin:24px 16px"><b>Update your iPhone to open the trip app.</b><p class="small">It needs iOS 16.4 or newer: Settings, General, Software Update.</p></div>`; return; } store.del("trip-pass"); lockScreen(window.TRIP_ENC); });
  else lockScreen(window.TRIP_ENC);
}
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && !/claude/.test(location.host)) {
  navigator.serviceWorker.register("sw.js").then(r=>{ r.update().catch(()=>{}); document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") r.update().catch(()=>{}); }); }).catch(()=>{});
  // A new version took over: reload once so it shows right away.
  let reloaded=false; const hadSW=!!navigator.serviceWorker.controller; navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(reloaded || !hadSW) return;
    // Don't pull the page out from under someone: wait while a guide plays, a sheet, search or a form is open.
    const busy = () => (typeof Player !== "undefined" && Player.playing) || document.querySelector(".sheet,#srch,.cstory") || (document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) || (typeof SU !== "undefined" && SU);
    const go = () => { if (reloaded) return; if (busy()) return setTimeout(go, 15000); reloaded=true; location.reload(); };
    if (busy()) { toast("Update ready. It loads when you're done here."); setTimeout(go, 15000); } else go(); });
}
})();
