.hr small{font:800 11.5px var(--body);color:#c62a2a;text-transform:uppercase;letter-spacing:.05em}.hr b{font:800 15.5px/1.25 var(--body);margin:2px 0 3px}.hr em{font:600 12px var(--body);font-style:normal;color:var(--muted)}
.hr.done small{color:var(--muted)}.hr.done .ph{opacity:.7}
.xlook{margin-top:12px;background:var(--surface);border-radius:12px;box-shadow:inset 0 0 0 2px var(--line);padding:12px 14px}
.xlook small{display:flex;gap:6px;align-items:center;font:800 12px var(--body);text-transform:uppercase;letter-spacing:.05em;color:#c62a2a}.xlook small svg{width:15px;height:15px}
.xlook ul{margin:6px 0 0;padding-left:18px}.xlook li{font:500 14px/1.45 var(--body);margin:4px 0}.xlook a{display:inline-block;margin-top:6px;font:700 13px var(--body);color:var(--b);padding:6px 0}
.tlbar{margin-top:14px}

.prose h3{font:800 18px var(--sign);text-transform:uppercase;letter-spacing:.04em;margin:22px 0 4px}
/* Explore › Games */
.gbar{display:flex;align-items:center;gap:12px;background:#1d1a14;color:#f4efe6;border-radius:12px;padding:12px 14px;text-decoration:none;margin-bottom:12px}.gbar .big{font:800 34px var(--sign);color:#f2c94c}.gbar small{display:block;font:600 12px var(--body);color:#cfc8ba}.gbar b{display:block;font:800 16px var(--body)}.gbar em{margin-left:auto;font:800 13px var(--body);font-style:normal;color:#f2c94c;white-space:nowrap}
.gg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gt{border-radius:12px;padding:12px;min-height:138px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden;color:#fff;background:#333;text-decoration:none}

.squiz>small{display:block;font:800 12px var(--body);color:#f2c94c;text-transform:uppercase;letter-spacing:.05em}.squiz>b{display:block;font:800 20px/1.2 var(--body);margin:4px 0 6px}
.sq>p{font:700 15px/1.4 var(--body);margin:14px 0 8px}.sqo{display:grid;gap:6px}
.sqo button{text-align:left;font:600 14.5px var(--body);color:#f4efe6;background:#fff1;border:0;border-radius:8px;padding:11px 12px;min-height:44px}
.sqo button.ok{background:#2f7d4f;color:#fff}.sqo button.no{background:#c62a2a;color:#fff}.sqo button:disabled:not(.ok):not(.no){opacity:.5}

/* Nov 4 · borrowed from the Glass mock */
html.street nav.tabs{background:color-mix(in srgb,var(--surface) 70%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.7);backdrop-filter:blur(18px) saturate(1.7);border-color:color-mix(in srgb,var(--line) 70%,transparent)}

.nowc.hasph{position:relative;display:block;min-height:210px;padding:0;overflow:hidden;border-radius:14px;background:#222}
.nowc.hasph .ph{position:absolute;inset:0;border-radius:0}

/* Today widgets */
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 4px}
.wg{display:flex;flex-direction:column;justify-content:space-between;gap:6px;min-height:118px;padding:12px 13px;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 2px var(--line);color:var(--ink);text-decoration:none;border:0;text-align:left;font:inherit}

/* Night: blurred city photo behind Today */
.nightbg{display:none}

/* Finished stops */
.fstop.past .fcard{opacity:.62}.fstop.past .fcard b{text-decoration:line-through;text-decoration-thickness:1.5px;text-decoration-color:var(--muted)}
/* History bookshelf */
.xshelf{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;margin:0 -16px;padding:4px 16px 10px;scrollbar-width:none}.xshelf::-webkit-scrollbar{display:none}
.xbook{flex:0 0 128px;scroll-snap-align:start;background:none;border:0;padding:0;text-align:left;color:var(--ink);font:inherit}
.xbook .ph{display:block;height:180px;border-radius:5px 12px 12px 5px;box-shadow:0 10px 22px rgb(0 0 0/.28),inset 6px 0 8px -4px rgb(0 0 0/.45);transition:transform .2s}

.xbook b{display:block;font:800 15px var(--body);margin-top:9px}.xbook small{display:block;font:600 12px var(--body);color:var(--muted)}

/* Night section on day pages: lantern-lit navy */
.fnight{position:relative;margin:8px -10px 0;padding:6px 10px 14px;border-radius:18px;background:radial-gradient(90% 50% at 85% 0,#c62a2a55,transparent 70%),linear-gradient(#13213d,#0a1328);color:#f6efe0;
  --surface:rgb(255 255 255/.08);--line:rgb(255 255 255/.16);--ink:#f6efe0;--muted:#b9c3d6}

/* Full-screen city story */

(function(){

const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"], DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const parse = iso => { const [y,m,d]=iso.split("-").map(Number); return new Date(y,m-1,d); };
const isoOf = dt => dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");
const LABEL = {booked:"Booked", todo:"To book", maybe:"Not decided"};
const chip = s => s ? `<span class="chip ${s}">${LABEL[s]}</span>` : "";

const store = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}, del(k){try{localStorage.removeItem(k)}catch(e){}} };

let T = null;

function todayIso(){
  let d = null;
  try { d = new URLSearchParams(location.search).get("d"); } catch(e){}
  return d && /^\d{4}-\d{2}-\d{2}$/.test(d) ? d : isoOf(new Date());
}
const stayById = id => T.stays.find(s=>s.id===id);

function dayCard(d, opts={}){

    return `<li data-i="${i}"${i===nowI?' class="now"':""}><div class="t">${esc(t)}</div><div class="w">${hop}${esc(w)} ${chip(s)}${hoursHtml(ps,d.date)}${ps.length||gs.length?`<div class="pins">${gs.map(listenPin).join("")}${ps.map(pinBtn).join("")}</div>`:""}</div></li>`; }).join("");
  const night = (!PB() && d.date==="2026-12-13") ? "" : d.night ? esc(d.night) : st ? `<a href="#stay-${st.id}">${esc(st.name)}</a> ${st.status!=="booked"?chip(st.status):""}` : "";

const STOPS = [["Saigon","2026-12-06"],["Hoi An","2026-12-07"],["Da Nang","2026-12-08"],["Hanoi","2026-12-09"]];
function routeSvg(iso){
  const W=320, pts = STOPS.map((s,i)=>[12+i*(W-24)/(STOPS.length-1), i%2?30:16]);
  let k = -1; STOPS.forEach((s,i)=>{ if (iso>=s[1]) k=i; });
  const path = "M"+pts.map(p=>p.join(",")).join(" L");
  const stops = pts.map((p,i)=>`<circle class="stop${i<=k?" past":""}" cx="${p[0]}" cy="${p[1]}" r="3.5"/><text x="${p[0]}" y="${i%2?44:7}" text-anchor="${i===0?"start":i===pts.length-1?"end":"middle"}" dx="${i===0?-6:i===pts.length-1?6:0}">${STOPS[i][0]}</text>`).join("");
  const me = k>=0 ? `<circle class="halo" cx="${pts[k][0]}" cy="${pts[k][1]}" r="5"/><circle class="me" cx="${pts[k][0]}" cy="${pts[k][1]}" r="5"/>` : "";
  return `<div class="route" aria-hidden="true"><svg viewBox="0 0 ${W} 46"><path class="track" d="${path}"/><path class="done" data-k="${k}" d="${path}"/>${stops}${me}</svg></div>`;
}
function sizeRoute(){
  const p = document.querySelector(".route .done"); if(!p) return;
  const len = p.getTotalLength(), k = +p.dataset.k, n = STOPS.length-1;
  const frac = k>=0 ? k/n : 0;
  p.style.setProperty("--len", len); p.style.setProperty("--off", len*(1-frac));
}

// Photos from Wikipedia and Wikimedia Commons, fetched when online and kept for offline use.
const W = "https://en.wikipedia.org/api/rest_v1/page/";
const wkey = t => encodeURIComponent(t.replace(/ /g,"_"));
const BAD = /(\.svg|\.gif|flag|coat_of_arms|logo|location|locator|map|seal_of|emblem|icon|signature)/i;
async function cachedJson(k, url){
  try{ const c=JSON.parse(store.get(k)||"null"); if(c) return c; }catch(e){}
  try{ const r=await fetch(url); if(!r.ok) throw 0; const j=await r.json(); return j; }catch(e){ return null; }
}
// Bundled photos first (shipped with the app, work offline from the first open), Wikipedia only for anything not bundled.
async function wikiLead(title){
  const B = T.photos; if (B && title in B.lead) return B.lead[title];
  const k="wl-"+title; try{ const c=store.get(k); if(c) return JSON.parse(c); }catch(e){}
  const j = await cachedJson(k, W+"summary/"+wkey(title)); if(!j) return null;
  const src = j.thumbnail?.source ? j.thumbnail.source.replace(/\/\d+px-/,"/960px-") : j.originalimage?.source;
  if (!src || BAD.test(src)) { store.set(k, "null"); return null; }
  const out = {src, cap: j.title, link: j.content_urls?.mobile?.page || ("https://en.wikipedia.org/wiki/"+wkey(title))};
  store.set(k, JSON.stringify(out)); return out;
}
async function wikiGallery(title){
  const B = T.photos; if (B && B.gallery[title]) return B.gallery[title];
  const k="wg-"+title; try{ const c=store.get(k); if(c) return JSON.parse(c); }catch(e){}
  const j = await cachedJson(k, W+"media-list/"+wkey(title)); if(!j) return [];
  const out = (j.items||[]).filter(i=>i.type==="image" && i.showInGallery!==false && i.srcset?.length && !BAD.test(i.title||"")).slice(0,6).map(i=>{
    const best = i.srcset[i.srcset.length-1].src; const src=(best.startsWith("//")?"https:":"")+best;
    return {src, cap:(i.caption?.text||i.title.replace(/^File:|\.\w+$/g,"").replace(/_/g," ")).trim(), link:"https://commons.wikimedia.org/wiki/"+encodeURIComponent(i.title)};
  });
  store.set(k, JSON.stringify(out)); return out;
}
function phImg(el, p){

}

function timeline(d){

const TILE = (z,x,y) => `https://tile.openstreetmap.org/${z}/${x}/${y}.png`;

function wireMap(){
  const el=document.getElementById("map"); if(!el) return; drawMap();

  const layer=document.getElementById("map-layer");
  el.addEventListener("touchstart",e=>{ if(e.target.closest(".map-ctl")) return; moved=false; const t=e.touches;
    st = t.length===2 ? {d:Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY), dx:0, dy:0, k:1} : {x:t[0].clientX, y:t[0].clientY, dx:0, dy:0, k:1}; },{passive:true});

const NF = new Intl.NumberFormat("en-US"), fmtVnd = n => NF.format(Math.round(n/50000)*50000) + " ₫";

function openAt(S, h, wd){

}
function rainPct(city, iso){ try{ return JSON.parse(store.get("wx-"+city)||"null")?.days?.[iso]?.p ?? null; }catch(e){ return null; } }
function whatNow(){
  const iso = todayIso(), d = dayOf(iso), wd = parse(iso).getDay(), h = nowH();
  const city = d && VN(d.city) ? d.city : "hcmc", M = (MOg().maps||{})[MAPCITY(city)];

  const planned = new Set((d ? d.items : []).flatMap(x=>placesFor(x[1], d.city)).map(p=>p.name));
  const meal = (h>=11 && h<14) || (h>=17.5 && h<21), coffee = (h>=7 && h<11) || (h>=14 && h<17.5), late = h>=18;
  const out = [];
  for (const [name, S] of Object.entries(MOg().spots||{})){
    const C = COORD(name); if (!C || !origin) continue;
    const km = hav(origin, C)*1.3; if (km > 12) continue;
    const till = openAt(S, h, wd); if (till == null) continue;
    let score = -km*1.6;
    if (S[0]==="eat" && meal) score += 3; if (S[0]==="coffee" && coffee) score += 2.5;
    if ((S[0]==="night"||S[0]==="walk") && late) score += 3; if ((S[0]==="night") && !late) score -= 2;
    if (rain!=null && rain>=50) score += S[1] ? 2 : -2.5;
    if (till - h < 1) score -= 2;
    if (planned.has(name)) score -= 1.5;
    out.push({ name, S, km, till, score, planned: planned.has(name) });
  }
  return { list: out.sort((a,b)=>b.score-a.score), rain, city, origin, d };
}
function getThere(km){
  const walk = Math.round(km/4.5*60), grab = Math.round(4 + km/20*60), fare = Math.max(30, Math.round((12 + km*14)/5)*5);
  return walk <= 20 ? `${walk} min walk` : `Grab ~${grab} min · ~${fare}k ₫`;
}

// --- Cash for today ---
function cashFor(d){
  if (!d || !VN(d.city)) return null;
  const F = MOg().fees||{}, B = MOg().cashBase||{food:350000,ride:40000,buffer:200000};
  const names = [...new Set(d.items.flatMap(x=>placesFor(x[1], d.city)).map(p=>p.name))];
  const lines = [];
  names.forEach(n=>{ if (F[n]) lines.push([n, F[n]]); });
  const txt = d.items.map(x=>x[1]).join(" ").toLowerCase();
  const rides = (txt.match(/\bgrab\b|\bcar to\b|\bcar\b|taxi|transfer/g)||[]).length;
  const fine = /coco|\bgia\b|tasting menu|la maison|anan/.test(txt);
  lines.push([fine ? "Street food, coffee and snacks (dinner on card)" : "Meals, coffee and snacks", fine ? Math.round(B.food*0.6) : B.food]);
  if (rides) lines.push([`${rides} ride${rides>1?"s":""}, shared`, rides*B.ride]);
  lines.push(["Tips and small extras", B.buffer]);
  const total = lines.reduce((s,l)=>s+l[1],0);
  return { total, lines };
}
function cashHtml(d){
  const c = cashFor(d); if (!c) return "";
  return `<details class="card cash"><summary><span class="cash-ico">₫</span><span><b>Carry about ${fmtVnd(c.total)} each</b><span class="small muted">≈ ${fmtUsd(c.total)} · tap for the breakdown</span></span></summary>

const placeCityKey = name => { const p = placeByName(name); return p ? CITYNAME[p.city] : null; };
const factWhere = w => CITYLBL[w] || w;
function hashStr(s){ let h = 0; for (const c of s) h = (h*31 + c.charCodeAt(0)) | 0; return Math.abs(h); }
// Facts for a day: places on the plan first, then the city, then the country; rotates by date.
function factsForDay(d, n){
  const F = FX().facts.map((f,i)=>({f,i}));
  const names = d ? new Set(d.items.flatMap(x=>placesFor(x[1], d.city)).map(p=>p.name)) : new Set();
  const pool = [...F.filter(x=>names.has(x.f[1])), ...F.filter(x=>d && x.f[1]===d.city), ...F.filter(x=>x.f[1]==="all")];
  const seed = hashStr(d ? d.date : todayIso()), out = [], seen = new Set();
  const groups = [pool.filter(x=>names.has(x.f[1])), pool.filter(x=>d && x.f[1]===d.city), pool.filter(x=>x.f[1]==="all")];
  for (const g of groups){ if (!g.length) continue; const x = g[seed % g.length]; if (!seen.has(x.i)){ out.push(x); seen.add(x.i); } if (out.length >= n) break; }
  return out;
}

// ===== Live leaderboard: every phone writes its own scores to one shared room and listens for everyone else's.
// Firebase Realtime Database over plain REST and server-sent events (no SDK). Works offline: changes wait and send later.
const LIVE = { es: null, room: null, dirty: false, timer: null, state: "off", seen: 0, ping0: Date.now() };
const liveBase = () => T && T.live ? `${T.live.db}/v26/${T.live.room}` : null;
const SCORE_KEYS = new Set(["hunt-found","trivia-right","trivia-scores","bingo","awards","haggles","speak"]);
function takeRecord(x){
  if (!x || !x.n || x.n === ME()) return false;
  const B = local.get("board", {}), rec = { n:x.n, t:x.t*60000, tr:x.tr||[], tb:x.tb||0, h:{}, bg:x.bg||0, hg:x.hg||0, sp:x.sp||{}, aw:(x.aw||[]).map(a=>({id:a[0], to:a[1], p:a[2], g:a[3], ts:a[4]*60000})) };
  Object.entries(x.h||{}).forEach(([k,v])=>rec.h[k]=v*60000);
  if (B[x.n] && B[x.n].t > rec.t) return false;
  B[x.n] = rec; store.set("board", JSON.stringify(B)); return true;
}
function livePush(soon){
  if (!liveBase() || !ME()) return; LIVE.dirty = true; clearTimeout(LIVE.timer);
  LIVE.timer = setTimeout(async ()=>{
    if (!navigator.onLine) return;
    try { const r = await fetch(`${liveBase()}/scores/${encodeURIComponent(ME())}.json`, { method: "PUT", body: JSON.stringify(compactRecord()) });
      if (r.ok){ LIVE.dirty = false; liveStatus(); } } catch(e){}
  }, soon ? 300 : 1500);
}
function liveApply(path, data){
  // Keep a mirror of the room, then copy everyone else's scores into this phone's board.
  if (path === "/") LIVE.room = data || {};
  else { LIVE.room = LIVE.room || {}; const parts = path.split("/").filter(Boolean).map(decodeURIComponent); let o = LIVE.room;
    for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]] = (o[parts[i]] && typeof o[parts[i]] === "object") ? o[parts[i]] : {};
    if (data == null) delete o[parts[parts.length-1]]; else o[parts[parts.length-1]] = data; }
  let changed = false; Object.values((LIVE.room||{}).scores || {}).forEach(x=>{ if (takeRecord(x)) changed = true; });
  const pg = (LIVE.room||{}).ping;
  if (pg && pg.t > LIVE.ping0 && pg.t > LIVE.seen){ LIVE.seen = pg.t; if (pg.by !== ME()){ toast(`${pg.by} refreshed everyone's app`); liveRefresh(); } }
  LIVE.seen = Math.max(LIVE.seen, (pg && pg.t) || 0);
  LIVE.state = "on"; liveStatus();
  if (changed && /^#(board|games)$/.test(location.hash)){ const y = scrollY; route(); scrollTo(0, y); }
}
function liveListen(){
  if (!liveBase() || !window.EventSource) return; liveStop();
  const es = LIVE.es = new EventSource(`${liveBase()}.json`);
  const on = ev => { try { const m = JSON.parse(ev.data); if (m) liveApply(m.path, m.data); } catch(e){} };
  es.addEventListener("put", on); es.addEventListener("patch", ev => { try { const m = JSON.parse(ev.data); Object.entries(m.data||{}).forEach(([k,v])=>liveApply((m.path==="/"?"":m.path)+"/"+k, v)); } catch(e){} });
  es.onerror = () => { LIVE.state = navigator.onLine ? "retry" : "off"; liveStatus(); };
}
function liveStop(){ if (LIVE.es){ LIVE.es.close(); LIVE.es = null; } }
async function liveRefresh(){

}
function liveStatus(){

function liveInit(){

function route(){

  if (h.startsWith("day-") && STREET()) { sub=h; h="plan"; }
  else if (h.startsWith("day-")) { target=h; h="plan"; }
  else if (h.startsWith("stay-")) { target=h; h="stays"; }
  if (sub) {}
  else if (PARENT[h]) { sub=h; h=PARENT[h]; }
  else if (h.startsWith("story-") || h.startsWith("guide-")) { sub=h; h="explore"; }

}

function toggleDay(d){
  const body = d.querySelector(".daybody"); if (!body) return;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches || !body.animate){ d.open=!d.open; return; }
  if (d._anim) d._anim.cancel();
  if (!d.open){
    d.open = true; const h = body.scrollHeight;
    d._anim = body.animate([{height:"0px",opacity:0},{height:h+"px",opacity:1}],{duration:320,easing:"cubic-bezier(.2,.8,.2,1)"});
  } else {
    const h = body.scrollHeight;
    d._anim = body.animate([{height:h+"px",opacity:1},{height:"0px",opacity:0}],{duration:240,easing:"cubic-bezier(.4,0,.2,1)"});
    d._anim.onfinish = ()=>{ d.open=false; d._anim=null; };
  }
}

const CITYV = { hcmc:"Sài Gòn", hoian:"Hội An", danang:"Đà Nẵng", hanoi:"Hà Nội", ninhbinh:"Ninh Bình", blr:"Bengaluru", kmc:"Karamchedu", hyd:"Hyderabad", srq:"Sarasota" };

// Today's city first (up to three photos), then the famous sights from the other cities: six in all.
function slidesFor(city){
  const out = [...(SLIDES[city]||[]).slice(0,3)], rest = Object.keys(SLIDES).filter(c=>c!==city);
  for (let i = 0; out.length < 6 && i < 40; i++){ const c = rest[i % rest.length], x = SLIDES[c][Math.floor(i / rest.length)]; if (x) out.push(x); }
  return out;
}
const reduceMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
function streetHero(o){
  const sl = slidesFor(o.city), k0 = reduceMotion() ? parse(todayIso()).getDate() % sl.length : 0;
  return `<section class="shero" id="shero" style="--city:${cityCol(o.city)}">
    <div class="slides">${sl.map(([key,cap],i)=>`<div class="ph sl${i===k0?" on":""}" data-lead="${esc(key)}" data-c="${esc(cap)}"></div>`).join("")}</div>
    <span class="capchip">${k0+1} of ${sl.length} · ${esc(sl[k0][1])}</span>
    <div class="tx"><div class="d">${o.line}</div><div class="plate"><div class="in"><span class="sm">${o.sm}</span><span class="nm" lang="vi">${esc(o.nm)}</span></div></div>
      ${o.title?`<div class="t">${o.title}</div>`:""}<div class="sdots" aria-hidden="true">${sl.map((_,i)=>`<i${i===k0?' class="on"':""}></i>`).join("")}</div></div></section>`;
}
let SLT = null;
function startSlides(){
  clearInterval(SLT); const h = document.getElementById("shero"); if (!h) return;
  const sl = [...h.querySelectorAll(".sl")], dots = [...h.querySelectorAll(".sdots i")], cap = h.querySelector(".capchip"); if (sl.length < 2) return;
  let k = Math.max(0, sl.findIndex(x=>x.classList.contains("on")));
  const show = n => { k = (n + sl.length) % sl.length; sl.forEach((x,i)=>x.classList.toggle("on", i===k)); dots.forEach((x,i)=>x.classList.toggle("on", i===k)); cap.textContent = `${k+1} of ${sl.length} · ${sl[k].dataset.c}`; };
  const tick = () => { if (!document.body.contains(h)) return clearInterval(SLT); if (document.visibilityState === "visible") show(k+1); };
  const run = () => { clearInterval(SLT); if (!reduceMotion()) SLT = setInterval(tick, 6000); };
  run();
  let x0 = null, y0 = 0;
  h.addEventListener("touchstart", e=>{ x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive:true});
  h.addEventListener("touchend", e=>{ if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)){ show(k + (dx < 0 ? 1 : -1)); run(); } }, {passive:true});
}

// Time plates: "10:00" when the plan has a clock time, otherwise the first word ("Evening").
const tplate = x => x.exact ? `${String(Math.floor(x.s/60)%24).padStart(2,"0")}:${String(x.s%60).padStart(2,"0")}` : esc(x.t.replace(/^~/,"").split(/[ ,(/]/)[0]);
const LEAVE = /grab|car to|private car|taxi|transfer|airport|\bfly\b|flight|vn ?\d|train|bus to|head to/i;
function nowStreetHtml(d){
  const { tl, cur, nxt, key, now } = nowNext(d);
  const until = x => x.exact ? hm(x.s/60) : x.t.replace(/^~/,"").toLowerCase();
  let big = null, rest = [];
  if (nxt && nxt.exact && nxt.s - now <= 45){
    const m = nxt.s - now;
    big = { k: m < 1 ? "Right now" : `Right now · ${LEAVE.test(nxt.w) ? "leave" : "starts"} ${inTime(m)}`, x: nxt };
    rest = tl.filter(x=>x.s > nxt.s || (x.s === nxt.s && x !== nxt && tl.indexOf(x) > tl.indexOf(nxt)));
  } else if (cur){
    big = { k: `Right now${nxt ? ` · until ${until(nxt)}` : ""}`, x: cur };
    rest = tl.filter(x=>x.s > now);
  } else if (nxt){
    big = { k: `First up · ${nxt.exact ? inTime(nxt.s - now) : until(nxt)}`, x: nxt };
    rest = tl.filter(x=>x.s > nxt.s);
  }
  const rows = [];
  if (rest[0]) rows.push(rest[0]);
  const k2 = rest.find(x=>x.key && !rows.includes(x)) || (rest[1] && !rows.includes(rest[1]) ? rest[1] : null);
  if (k2) rows.push(k2);
  const bp = big && (placesFor(big.x.w, d.city).find(p => p.photo) || {}).photo;
  const cd = big && big.x.exact && big.x.s > now ? `In ${inTime(big.x.s - now).replace(/^in /, "")}` : "";
  let h = big ? (bp ? `<div class="nowc hasph"><span class="ph" data-lead="${esc(bp)}"></span><span class="nowb">${cd ? `<i class="cdn">${esc(cd)}</i>` : `<i class="cdn now">Now</i>`}<span class="num big"><span>${tplate(big.x)}</span></span></span><div class="nowt"><span class="k">${esc(big.k)}</span><b>${esc(big.x.w)}</b></div></div>`
    : `<div class="nowc"><div><span class="k">${esc(big.k)}</span><b>${esc(big.x.w)}</b></div><span class="num big"><span>${tplate(big.x)}</span></span></div>`) : "";
  h += rows.map(x=>`<div class="nx"><span class="num"><span>${tplate(x)}</span></span><div><b>${esc(x.w)}</b><small>${x.key?`<span class="lan">Don't miss</span>`:""}${x.exact ? inTime(x.s - now) : "around " + esc(until(x))}</small></div></div>`).join("");
  if (!nxt){
    const i = T.days.findIndex(x=>x.date===d.date), tm = T.days[i+1], first = tm && timeline(tm)[0];
    h += `<div class="nx"><span class="num"><span>${first ? tplate(first) : "Done"}</span></span><div><b>${first ? `Tomorrow: ${esc(first.w)}` : "That's today's plan. Enjoy it."}</b><small>${first ? "That's the plan for today" : ""}</small></div></div>`;
  }
  return h;
}

// Next stop: the next place in today's plan (or tonight's stay), with the address for the driver and how to get there.
const WALK_I = '<svg viewBox="0 0 24 24"><circle cx="13" cy="4" r="2"/><path d="M10 22l2-7 3 3v4M8 12l2-4 4 1 3 3M10 8l-2 5"/></svg>';
const CAR_I = '<svg viewBox="0 0 24 24"><path d="M5 17h14v-5l-2-5H7l-2 5zM5 12h14M7 17v2M17 17v2"/><circle cx="8" cy="14.5" r=".8"/><circle cx="16" cy="14.5" r=".8"/></svg>';
function nextStop(){
  const d = dayOf(todayIso()); if (!d) return null;
  const { tl, now } = nowNext(d);
  const prevPlace = (() => { for (const x of [...tl].reverse()) if (x.s <= now && x.i >= 0){ const p = placesFor(x.w, d.city).find(p=>COORD(p.name)); if (p) return p; } return null; })();
  // Riding somewhere right now (a Grab to the airport): that's the next stop.
  const cur = [...tl].reverse().find(x=>x.s <= now && x.i >= 0);
  if (cur && LEAVE.test(cur.w)){ const p = placesFor(cur.w, d.city)[0]; if (p) return { d, x: cur, p, from: null }; }
  for (const x of tl) if (x.s >= now - 10 && x.i >= 0){ const p = placesFor(x.w, d.city)[0]; if (p && p !== prevPlace) return { d, x, p, from: prevPlace }; }
  const st = d.stay && stayById(d.stay); return st ? { d, st, from: prevPlace } : null;
}
function nextStopSheet(){
  const n = nextStop();

  const now = nowMin();
  let name, vi, addr, link, move = "";
  if (n.p){ name = n.p.name; vi = n.p.vi; addr = n.p.addr || ""; link = gmaps(n.p);
    const A = n.from && COORD(n.from.name), B = COORD(n.p.name);
    if (A && B && hav(A, B) < 40){ const km = hav(A, B) * 1.3; move = km < 2.2 ? `${WALK_I} About ${Math.max(2, Math.round(km / 4.8 * 60))} min walk from ${esc(n.from.name)} · ${km.toFixed(1)} km` : `${CAR_I} About ${Math.max(5, Math.round(km / 22 * 60 + 4))} min by Grab from ${esc(n.from.name)} · ${km.toFixed(1)} km`; }
  } else { name = n.st.name; vi = n.st.name; addr = n.st.address || ""; link = mapUrl(n.st.address || n.st.map || n.st.name); }
  const full = addr ? `${vi}, ${addr}` : vi;
  const when = n.x ? `${n.x.exact ? `${hm(n.x.s/60)} · ${inTime(n.x.s - now)}` : esc(n.x.t.replace(/^~/,""))}` : "Tonight's stay";
  openSheet(`<div class="ns-k">Next stop · ${when}</div>${n.p && n.p.photo ? `<div class="ph sheetph" data-lead="${esc(n.p.photo)}" data-hide-empty></div>` : ""}<div class="sname">${esc(name)}</div>
    ${n.x ? `<div class="small muted">${esc(n.x.w)}</div>` : ""}
    <div class="addr"><div><div class="vi" lang="vi">${esc(vi)}</div>${addr ? `<div class="a" lang="vi">${esc(addr)}</div>` : `<div class="a">Search this name in Grab</div>`}</div><button class="btn" data-copy="${esc(full)}">Copy</button></div>
    ${move ? `<div class="ns-move">${move}</div>` : ""}
    <div class="btns"><button class="btn solid" data-driver="${esc(vi)}" data-driver-sub="${esc(addr)}">Show the driver</button><a class="btn" href="grab://open" data-copy="${esc(full)}">Copy and open Grab</a><a class="btn" href="${link}" target="_blank" rel="noopener">Google Maps ↗</a></div>`);
}
document.addEventListener("click", e=>{ if (e.target.closest("[data-nextstop]")){ e.preventDefault(); nextStopSheet(); } });
// Pull down on Today to see the next stop.
{ let pd = null;

// Plan: the route, grouped by city signs, with stamps on finished days.
function dayStamps(){
  const out = {};
  boardRecords().forEach(r=>Object.entries(r.h||{}).forEach(([id,ts])=>{ const it = huntItem(id); if (!it) return; const day = isoOf(new Date(ts));
    const o = out[day] = out[day] || { n: 0, by: {} }; o.n++; o.by[r.n] = (o.by[r.n]||0) + it[1]; }));
  return out;
}
// Plan (A3): city story circles, a banner for the chosen city, and a short card per day. Tapping a day opens its own page.
let PCITY = null;
function planGroups(){
  const groups = [];
  T.days.forEach(d=>{ if (d.place === "Tokyo" && d.city) { (groups.find(g=>g.key===d.city) || (groups.push({ key:d.city, city:d.city, days:[] }), groups[groups.length-1])).days.push(d); return; }
    const key = VN(d.city) ? d.city : (d.city || d.place); let g = groups.find(x=>x.key===key);
    if (!g) { g = { key, city: d.city, place: d.place, days: [] }; groups.push(g); } g.days.push(d); });
  return groups;
}
function dayPh(d){ const st = d.stay ? stayById(d.stay) : null; return d.photo || ((T.flights||[]).find(f=>f.date===d.date)||{}).photo || (st && st.photo) || ""; }
function dayBriefOf(d){
  const b = (MOg().dayBrief||{})[d.date]; if (b) return b;
  const its = d.items.filter(x=>!/^(sleep|check out|breakfast|grab to|check in)/i.test(x[1])).slice(0,3);
  return its.map((x,i)=>[["☀️","🌤","🌙"][i], x[1].split(/[.:,(]/)[0].slice(0,42)]);
}
function planStreet(){
  const iso = todayIso(), vd = T.days.filter(d=>VN(d.city)), S = dayStamps();
  // Sections in trip order (Hà Nội can appear twice); circles are one per city.
  const secs = [];
  vd.forEach(d=>{ const key = d.place === "Tokyo" && d.city ? d.city : (VN(d.city) ? d.city : (d.city || d.place)), l = secs[secs.length-1];
    if (l && l.key === key) l.days.push(d); else secs.push({ key, city: d.city, place: d.place, days: [d] }); });
  secs.forEach((x,i)=>{ x.first = secs.findIndex(y=>y.key===x.key) === i; });
  const nm = x => VN(x.city) ? CITYV[x.city] : (CITYV[x.city] || x.place.split(" →")[0]);
  const gph = x => (SLIDES[x.city]||[])[0]?.[0] || x.days.map(dayPh).find(Boolean) || x.days[0].place;
  const all = k => secs.filter(x=>x.key===k).flatMap(x=>x.days);
  const rng = ds => { const f = ds[0].date, l = ds[ds.length-1].date; return fmt(f) + (l !== f ? "–" + (parse(l).getMonth() === parse(f).getMonth() ? parse(l).getDate() : fmt(l)) : ""); };
  const circles = secs.filter(x=>x.first).map(x=>`<button type="button" class="pcirc${all(x.key).some(d=>d.date===iso)?" now":""}${all(x.key).every(d=>d.date<iso)?" done":""}" data-pgo="${esc(x.key)}" style="--city:${cityCol(x.city)}"><i class="ph" data-lead="${esc(gph(x))}"></i><b lang="vi">${esc(nm(x))}</b><small>${rng(all(x.key))}</small></button>`).join("");
  // How you get to a section: a flight that day (or the evening before), else a travel-looking item.
  const RX = /flight|Vietnam Airlines|VietJet|Bamboo|by train|train to|private car|car north|car to|drive back|drive to|transfer to/i;
  const howTo = d => { const i = T.days.indexOf(d), prev = T.days[i-1];
    for (const day of [d, prev].filter(Boolean)) { const l = (MOg().legs||[]).find(l=>l.dep.slice(0,10)===day.date && (!l.pb || PB()) && (day === d || l.dep.slice(11,13) >= "12"));
      if (l) return { ic:"✈", t: (h => `${(+h[0]) % 12 || 12}:${h[1]} ${+h[0] < 12 ? "AM" : "PM"}`)(l.dep.slice(11,16).split(":")), w: `${/^[A-Z]{1,3} ?\d/.test(l.no) ? l.no : l.by.split(" (")[0]} · ${l.from} → ${l.to}`, todo: /not booked/i.test(l.by) };
      const its = day.items.filter(x=>RX.test(x[1]) && !(x[3]==="pb" && !PB())), it = day === d ? its[0] : its[its.length-1];
      if (it) return { ic: /flight|Airlines|VietJet|Bamboo/i.test(it[1]) ? "✈" : /train/i.test(it[1]) ? "🚆" : "🚗", t: it[0], w: it[1].replace(/\s*\(.*?\)/g,"").split(/\. /)[0].slice(0,64), todo: it[2]==="todo" }; }
    return null; };
  const stamp = d => { if (d.date >= iso) return ""; const s = S[d.date]; return `<span class="dstamp">Done${s ? ` · ${s.n} find${s.n>1?"s":""}` : ""}</span>`; };
  const card = (d, x) => { const dt = parse(d.date), td = d.items.filter(y=>y[2]==="todo").length, ph = dayPh(d) || gph(x);
    return `<a class="pday${d.date===iso?" is-today":""}${d.date<iso?" past":""}" id="pd-${d.date}" href="#day-${d.date}" style="--city:${cityCol(d.city || x.city)}"><div class="pimg"><div class="ph" data-lead="${esc(ph)}"></div><span class="pdate">${DOW[dt.getDay()]}<b>${dt.getDate()}</b></span></div>
      <div class="pday-x"><b class="pt">${esc(d.title)}</b>${d.place.includes("→") ? `<small class="pp">${esc(d.place)}</small>` : ""}<ul>${dayBriefOf(d).map(([i,t])=>`<li>${emoIcon(i)}${esc(t)}</li>`).join("")}</ul>
      ${stamp(d) || (td ? `<span class="pill td">${td} to book</span>` : `<span class="pill ok">✓ All set</span>`)}</div></a>`; };

    if (!x.first) return `${hop}<div class="pback" style="--city:${cityCol(x.city)}"><span class="sign" style="--city:${cityCol(x.city)}"><span lang="vi">Back to ${esc(nm(x))}</span></span><small>${rng(x.days)}</small></div>`;
    return `${hop}<div class="phero" id="pc-${esc(x.key)}" data-psec="${esc(x.key)}" style="--city:${cityCol(x.city)}"><div class="ph" data-lead="${esc(gph(x))}"></div>${MCITY[x.city] ? `<div class="pbtns"><button type="button" data-pmap="${esc(MCITY[x.city])}">${icon("map")}Map</button><button type="button" data-pplaces="${esc(MCITY[x.city])}">${icon("pin2")}${T.places.filter(p=>p.city===MCITY[x.city]).length} places</button></div>` : ""}<div class="phero-in"><b lang="vi">${esc(nm(x))}</b><small>${rng(all(x.key))} · ${all(x.key).length} day${all(x.key).length>1?"s":""}${st ? ` · ${esc(st.name)}` : ""}</small>${todo ? `<span class="ptodo">${todo} to book</span>` : `<span class="ptodo ok">✓ All set</span>`}</div>${(w => w ? `<div class="pwx" title="${esc(w[3])}"><span>${emoIcon(w[0])}</span><b>${Math.round(w[1]*9/5+32)}°</b><small>${Math.round(w[2]*9/5+32)}°F</small><em>${esc(w[3].split(",")[0])}</em></div>` : "")((MOg().decWeather||{})[x.city])}</div>`; };
  const vi = vd.findIndex(d=>d.date===iso);

// End-of-history quiz: 3 questions, one try each; right answers count as trivia points.
const QORDER = ["vietnam","saigon","hoian","danang","hanoi","ninhbinh"];
const qid = (id, i) => 1000 + 10 * QORDER.indexOf(id) + i;
function storyQuiz(id){
  const Q = (FX().quizzes || {})[id]; if (!Q || QORDER.indexOf(id) < 0) return "";
  const tried = local.get("quiz-tried", {}), R = triviaRight();
  const got = Q.filter((q, i) => R[qid(id, i)]).length, done = Q.filter((q, i) => tried[qid(id, i)] != null).length;
  return `<section class="squiz" id="squiz"><small>Quick quiz · a point each on the leaderboard</small><b>${done === Q.length ? `You got ${got} of ${Q.length}` : "How much do you remember?"}</b>
    ${Q.map(([q, opts, ans, why], i) => { const k = qid(id, i), t = tried[k];
      return `<div class="sq"><p>${i + 1}. ${esc(q)}</p><div class="sqo">${opts.map((o, j) => `<button type="button" data-sq="${id}:${i}:${j}"${t != null ? " disabled" : ""} class="${t != null && j === ans ? "ok" : t === j ? "no" : ""}">${esc(o)}</button>`).join("")}</div>${t != null ? `<p class="why">${t === ans ? "Right. " : "Not quite. "}${esc(why)}</p>` : ""}</div>`; }).join("")}</section>`;
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-sq]"); if (!b) return;
  const [id, i, j] = b.dataset.sq.split(":"), Q = FX().quizzes[id], k = qid(id, +i), T2 = local.get("quiz-tried", {});
  if (T2[k] != null) return; T2[k] = +j; local.set("quiz-tried", T2);
  if (+j === Q[+i][2]) { const R = triviaRight(); R[k] = 1; local.set("trivia-right", R); }
  const box = document.getElementById("squiz"); if (box) box.outerHTML = storyQuiz(id);
});

    ${t("guess", "c", 'style="--c:#c62a2a"', `${me.bill || 0} pts`, "Closest guess wins 3", "Guess the bill")}

// Leaderboard: lanterns sized by points, the bounty, and the latest finds.
function latestFeed(){
  const ev = [];
  boardRecords().forEach(r=>{
    Object.entries(r.h||{}).forEach(([id,ts])=>{ const it = huntItem(id); if (it) ev.push({ ts, n: r.n, html: `found ${esc(it[2].charAt(0).toLowerCase() + it[2].slice(1))}`, p: it[1] }); });
    (r.aw||[]).forEach(a=>{ if (a.to) ev.push({ ts: a.ts, n: a.to, html: `won ${a.g === "bill" ? "Guess the bill" : esc(a.g)}`, p: a.p }); });
  });
  const seen = new Set();
  return ev.filter(x=>{ const k = x.n + x.ts + x.html; if (seen.has(k)) return false; seen.add(k); return x.ts; }).sort((a,b)=>b.ts-a.ts).slice(0, 6);
}
function lanternsHtml(S){
  const names = T.travelers.map(t=>t.name), byN = Object.fromEntries(S.map(s=>[s.n, s]));
  S.forEach(s=>{ if (!names.includes(s.n)) names.push(s.n); });
  const max = Math.max(1, ...S.map(s=>s.total)), n = names.length;
  const sag = x => 22 + 26 * Math.sin(Math.PI * x);   // the wire droops in the middle
  const ls = names.map((nm,i)=>{ const s = byN[nm] || { total: 0 }, x = (i + .5) / n, sz = Math.round(40 + 34 * (s.total / max));
    return `<div class="ln${nm===ME()?" me":""}" style="left:${(x*100).toFixed(1)}%;top:${sag(x).toFixed(0)}px"><span class="cord" style="height:${10 + (i%2)*16}px"></span><span class="bod" style="width:${sz}px;height:${Math.round(sz*1.12)}px;font-size:${Math.round(sz*.42)}px">${s.total}</span><span class="tas"></span><span class="nm">${esc(nm)}</span></div>`; }).join("");
  const pts = Array.from({length:21}, (_,i)=>`${i*5},${sag(i/20).toFixed(1)}`).join(" ");
  return `<div class="lstring" aria-label="Points: ${S.map(s=>`${esc(s.n)} ${s.total}`).join(", ")}"><svg class="wire" viewBox="0 0 100 210" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="#5a3d1a" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>${ls}</div>`;
}
function boardStreet(){
  const S = scoreAll(), me = S.find(s=>s.me) || { total: 0 }, b = bountyFor(todayIso()), feed = latestFeed();
  const initial = n => esc(n.charAt(0).toUpperCase());
  return `<div class="lb-head"><a class="lb-back" href="#games">← Games</a><h2>Leaderboard</h2>${liveBase() ? `<p class="small live-st" id="live-st" role="status" aria-live="polite"></p>` : ""}</div>
    ${lanternsHtml(S)}
    ${b ? `<a class="card bounty-c" href="#hunt" style="margin-top:0"><span class="small">Today's photo hunt bounty · double points</span><b>${esc(b[2])}</b></a>` : ""}
    <h3>Latest</h3><div class="card feed">${feed.length ? feed.map(x=>`<div><span class="av${x.n===ME()?" me":""}" aria-hidden="true">${initial(x.n)}</span><p><b>${x.n===ME() ? "You" : esc(x.n)}</b> ${x.html}</p><em>+${x.p} · ${ago(x.ts).replace(" ago","")}</em></div>`).join("") : `<p class="small muted" style="margin:0">Finds and wins show up here as they happen.</p>`}</div>
    <div class="card mine"><span>Your points</span>${[["Hunt",me.hunt+me.bonus],["Trivia",me.trivia],["Bingo",me.bingo],["Bills",me.bill],["Haggle",me.haggle],["Speak",me.speak]].filter(x=>x[1]).map(x=>`<span>${x[0]} <b>${x[1]}</b></span>`).join("")}<b class="tot">= ${me.total}</b></div>
    ${liveBase() ? `<div class="btns" style="display:grid;grid-template-columns:1fr 1fr"><button class="btn solid" data-liverefresh>Refresh scores</button><button class="btn" data-liveping>Refresh everyone</button></div>` : `<div class="btns"><button class="btn solid" data-syncshare>Share my scores</button><a class="btn" href="#games">All games</a></div>`}
    ${recapOpen() ? `<a class="btn solid" href="#recap">Open the finale</a>` : ""}`;
}

// ===== End-of-trip recap: opens the last evening in Vietnam (Sat Dec 12, 6 PM). =====
const RECAP_AT = "2026-12-12";
function recapOpen(){ try { if (new URLSearchParams(location.search).get("recap")) return true; } catch(e){} const iso = todayIso(); return iso > RECAP_AT || (iso === RECAP_AT && nowMin() >= 18*60); }
const flapTiles = (s, n) => [...String(s).toUpperCase().padEnd(n, " ")].slice(0, n).map(c=>`<i${c===" "?' class="s"':""}>${c===" "?"":esc(c)}</i>`).join("");
function recapPage(){
  if (!recapOpen()) return `<a class="btn back-link" href="#games">← Games</a><h2>The finale</h2><div class="card"><p style="margin:0">The finale opens on the last night in Hà Nội, <b>Sat Dec 12 at 6 PM</b>: the final standings on a flip board, the route, everyone's hunt photos and the best moments.</p></div>`;
  const S = scoreAll(), N = Math.max(...S.map(s=>s.n.length), 6), R = boardRecords();
  const iso = todayIso(), St = dayStamps(), vd = T.days.filter(d=>VN(d.city));
  // Best moments, worked out from everyone's records.
  const all = []; R.forEach(r=>Object.entries(r.h||{}).forEach(([id,ts])=>all.push({ n: r.n, ts, it: huntItem(id) })));
  const firstFind = all.filter(x=>x.it).sort((a,b)=>a.ts-b.ts)[0];
  const rare = all.filter(x=>x.it && x.it[1] === 5).sort((a,b)=>a.ts-b.ts)[0];
  const hag = [...R].sort((a,b)=>(b.hg||0)-(a.hg||0))[0];
  const triv = [...S].sort((a,b)=>b.trivia-a.trivia)[0], food = [...S].sort((a,b)=>b.bingo-a.bingo)[0];
  const bestDay = Object.entries(St).sort((a,b)=>b[1].n-a[1].n)[0];
  const mom = [
    firstFind && ["First find", `${esc(firstFind.n)}: ${esc(firstFind.it[2])}`],
    rare && ["First rare find", `${esc(rare.n)}: ${esc(rare.it[2])}`],
    hag && hag.hg && ["Best haggle", `${esc(hag.n)}, ${hag.hg}% off`],
    triv && triv.trivia && ["Trivia brain", `${esc(triv.n)}, ${triv.trivia} right`],
    food && food.bingo && ["Ate the most", `${esc(food.n)}, ${food.bingo} dishes`],
    bestDay && ["Busiest hunt day", `${fmt(bestDay[0])}, ${bestDay[1].n} finds`],
  ].filter(Boolean);
  const F = huntFound(), ids = Object.keys(F).sort((a,b)=>F[a]-F[b]);
  return `<a class="btn back-link" href="#games">← Games</a><h2>Who won Vietnam?</h2>
    <p class="small muted" style="margin:0">Tap Reveal to flip the board one name at a time, last place first.</p>
    <div class="flap" id="flap">${S.map((s,i)=>`<div class="fr hid${i===0?" win":""}" data-rank="${i}"><span class="rk">${flapTiles(i+1, 1)}</span><span class="tiles">${flapTiles(s.n, N)}</span><span class="pts">${flapTiles(String(s.total).padStart(3," "), 3)}</span></div>`).join("")}</div>
    <div class="btns" style="display:grid;grid-template-columns:1fr 1fr"><button class="btn solid" data-reveal>Reveal next</button><button class="btn" data-revealall>Show all</button></div>
    <h3>The route</h3><div class="card"><div class="route2" style="gap:4px">${vd.map(d=>`<div style="display:flex;gap:10px;align-items:center"><span class="sign" style="--city:${cityCol(d.city)}"><span style="font-size:16px;min-width:58px;text-align:center">${parse(d.date).getDate()} Dec</span></span><span style="min-width:0"><b style="display:block;font-size:14.5px">${esc(d.title)}</b>${St[d.date] ? `<span class="dstamp">${St[d.date].n} finds</span>` : `<span class="small muted">${esc(CITYV[d.city]||d.place)}</span>`}</span></div>`).join("")}</div></div>
    <h3>Your hunt photos</h3><div class="card">${ids.length ? `<div class="rcol">${ids.map(id=>`<div class="hi" data-himg="${id}">${esc(huntItem(id) ? huntItem(id)[2] : "")}</div>`).join("")}</div>` : `<p class="small muted" style="margin:0">No hunt photos on this phone.</p>`}<div class="btns"><button class="btn solid" data-recap>Share my collage</button></div></div>
    ${mom.length ? `<h3>Best moments</h3><div class="card moments">${mom.map(([k,v])=>`<div><span class="sign"><span style="font-size:15px">${k}</span></span><span>${v}</span></div>`).join("")}</div>` : ""}`;
}
document.addEventListener("click", e=>{
  const one = e.target.closest("[data-reveal]"), all = e.target.closest("[data-revealall]"); if (!one && !all) return;
  const rows = [...document.querySelectorAll("#flap .fr.hid")]; if (!rows.length) return toast("That's everyone!");
  (all ? rows : [rows[rows.length-1]]).forEach((r,i)=>setTimeout(()=>{ r.classList.remove("hid"); r.classList.add("flip"); r.querySelectorAll("i").forEach((t,j)=>t.style.animationDelay = (j*45)+"ms"); }, i*250));
  if (rows.length === 1 || all) setTimeout(()=>{ toast(`${document.querySelector("#flap .fr.win .tiles").textContent.trim()} wins Vietnam '26!`); navigator.vibrate && navigator.vibrate([20,60,20]); }, all ? rows.length*250 + 400 : 600);
});

// Today in the street look: photo slideshow, the yellow wall with now and next, then the facts strip.
function todayStreet(){
  const iso = todayIso(), first = T.days[0].date, last = T.days[T.days.length-1].date, idx = T.days.findIndex(d=>d.date===iso);
  const dl = iso => { const x = parse(iso); return `${DOW[x.getDay()]} ${x.getDate()} ${MON[x.getMonth()]}`; };
  let top = "", body = "";
  if (iso < first){
    const n = Math.round((parse(first)-parse(iso))/864e5);
    const mf = PB() ? null : local.get("my-flights",[]).find(f=>f.date>=iso);
    const nn = mf ? Math.round((parse(mf.date)-parse(iso))/864e5) : n;
    top = streetHero({ city: "hoian", line: `Countdown · Hi ${esc(ME())}`, sm: `${nn} day${nn===1?"":"s"} to`, nm: "Việt Nam", title: PB() ? "We fly Fri Dec 4 at 6:00 AM from Sarasota" : mf ? `Your flight: ${esc(mf.from)} → ${esc(mf.to)}, ${fmt(mf.date)}` : "Everyone together in Sài Gòn from Sun Dec 6" });
    const sd = Object.keys(setupDone()).length, sn = (MOg().setup||[]).length;
    body = `${todoHtml(iso)}${jetlagHtml(iso)}<h3>Before you fly</h3><a class="card jlcard" href="#info" data-goto="setup"><b>Phone setup · <span id="setup-n">${sd}</span>/${sn} done</b><span class="small muted">Grab, offline maps, translate, eSIM and more ›</span></a>${wxCard()}${newsCard()}${todayFactsHtml(null)}<h3>First days</h3>${T.days.slice(0,3).map(d=>dayCard(d)).join("")}`;
  } else if (iso > last){
    top = streetHero({ city: "hanoi", line: "Trip complete", sm: "Welcome", nm: "Home", title: `<a href="#recap" style="color:#fff">Open the finale ›</a>` });
    body = `<h3>The whole trip</h3><p><a href="#plan">See every day</a></p>`;
  } else {
    const d = T.days[idx], st = d.stay ? stayById(d.stay) : null, vd = T.days.filter(x=>VN(x.city)), vi = vd.indexOf(d);
    top = streetHero({ city: d.city, line: `${dl(iso)} · ${vi >= 0 ? `Day ${vi+1} of ${vd.length}` : `Day ${idx+1} of ${T.days.length}`}`, sm: st ? "Tonight" : "Today", nm: CITYV[d.city] || d.place, title: esc(d.title) });
    const ru = dayRouteUrl(d), ns = nextStop();
    top += `<div class="nightbg ph" aria-hidden="true" data-lead="${esc((T.stories.find(x => (XCITY[x.id]||[])[2] === d.city) || {}).hero || "Vietnam")}"></div>`;
    top += `<div class="swall"><div id="nownext" class="nownext-s">${nowNextHtml(d)}</div>
      <div class="wnbar">${ns ? `<button type="button" class="btn solid" data-nextstop>Next stop</button>` : ""}<a class="btn${ns ? "" : " solid"}" href="#now">What now?</a>${ru ? `<a class="btn" href="${ru}" target="_blank" rel="noopener">Map ↗</a>` : ""}</div>
      ${ns ? `<div class="pullhint" aria-hidden="true">Pull down anytime for the next stop</div>` : ""}</div>
      <div id="raintop"></div>${factsStrip(d)}`;
    top += travelDayHtml(iso) + briefHtml(d) + checkoutHtml(d);
    top += `<h3>Today's plan</h3><div class="tflow">${dayFlow(d, d.items.filter(x=>x[2]==="todo").length)}</div>`;
    top += tomorrowHtml(iso) + jetlagHtml(iso);
    const tp = [...new Set(d.items.flatMap(x=>placesFor(x[1],d.city)))].filter(p=>p.photo);
    if (tp.length) top += `<h3>Today's places</h3><div class="strip">${tp.map(p=>`<button class="ptile" data-place="${p.id}"><div class="ph" data-lead="${esc(p.photo)}"></div><span>${esc(p.name)}</span></button>`).join("")}</div>`;
    top += wxCard() + newsCard();
    body = dayExtrasHtml(d) + gamesTodayHtml(iso) + todayFactsHtml(d);
    const gt = (T.guides||[]).filter(g=>g.day===iso);
    if (gt.length) body += `<h3>Audio guides for today</h3><div class="list">${gt.map(guideCard).join("")}</div>`;
    const ag = (T.airports||[]).find(a=>(!a.pb||PB()) && a.when.includes(fmt(iso)));
    if (ag) body += `<h3>${esc(ag.title)}</h3><div class="card"><ol class="steps" style="margin:0">${ag.steps.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div>`;
    const nf = T.flights.find(f=>f.date>=iso);
    if (nf) body += `<h3>Next flight</h3><div class="card"><div class="row" style="border:0;padding:0"><div class="when">${esc(nf.when)}</div><div class="what">${esc(nf.route)}</div>${chip(nf.status)}<div class="detail">${esc(nf.detail)}</div></div></div>`;
    if (T.days[idx+1]) body += `<h3>Tomorrow</h3>${dayCard(T.days[idx+1])}`;
  }
  const crew = T.travelers.map(p=>`<span class="person${/final/.test(p.note)?" tbd":""}" title="${esc(p.note)}">${esc(p.name)}</span>`).join("");
  const exp = T.expensesUrl ? `<a class="btn" href="${esc(T.expensesUrl)}" target="_blank" rel="noopener">Shared expenses ↗</a>` : "";
  return `${top}${body}<h3>Who's coming</h3><div class="card"><div class="people">${crew}</div><p class="small muted" style="margin:8px 0 0">Dashed names: plans with Sunny, Sindhu and Karthik are still being finalized.</p>${exp?`<div class="btns">${exp}</div>`:""}</div>`;
}

// Before-you-fly countdown: open items with their deadlines (more.mjs todo). Ticks are saved on this phone.
function todoHtml(iso){
  const L = (MOg().todo||[]).filter(t=>t[4]==="all" || PB()), done = local.get("todo-done", {});
  const open = L.filter(t=>!done[t[0]]); if (!L.length) return "";
  const dleft = due => Math.round((parse(due) - parse(iso)) / 864e5);
  const when = n => n < 0 ? `${-n} day${n===-1?"":"s"} late` : n === 0 ? "today" : n === 1 ? "tomorrow" : `${n} days`;
  const row = t => { const n = dleft(t[2]), dt = parse(t[2]);
    return `<label class="todo-r${done[t[0]]?" done":""}${n<=3&&!done[t[0]]?" soon":""}"><input type="checkbox" data-todo="${t[0]}"${done[t[0]]?" checked":""}><span><b>${esc(t[1])}</b><small>${esc(t[3])}</small></span><span class="num"><span>${done[t[0]] ? "Done" : when(n)}</span></span><em>${t[5] ? "Deadline" : "Aim for"} ${DOW[dt.getDay()]} ${MON[dt.getMonth()]} ${dt.getDate()}</em></label>`; };
  return `<h3>Still to do before you fly · ${open.length} left</h3><div class="card todo">${[...L].sort((a,b)=>(done[a[0]]?1:0)-(done[b[0]]?1:0) || a[2].localeCompare(b[2])).map(row).join("")}</div>`;
}

// Search: renders every page offscreen, splits it into cards and list items, and matches typed words (accents and typos forgiven).
const SRCH_SKIP = new Set(["trivia","guess","hunt","recap","board","haggle","speak","games","map","now"]);
const SRCH_NAME_DAY = k => { const d = T.days.find(x=>x.date===k.slice(4)); return d ? fmt(d.date) + " · " + d.title : "Plan"; };
const SRCH_NAME = {today:"Today",plan:"Plan",stays:"Stays",explore:"Explore",info:"Info",bookings:"Bookings",facts:"Did you know?",timeline:"Timeline",gifts:"Shopping",food:"Food",eat:"Eat list",listen:"Listen",places:"Places",say:"Say it"};
const srNorm = t => (t||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/gi,"d").toLowerCase().replace(/[-'’`]/g,"");
const SRCH_SEL = ".card, details, .fstop, .bcard, li, .xt, article p, article h2, article h3, tr";
function srText(el){ const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), out = []; let n; while ((n = w.nextNode())) if (!n.parentElement.closest("button")) out.push(n.data); return out.join(" ").replace(/\s+/g," ").replace(/ ↗/g,"").replace(/\s+([.,:;!?)])/g,"$1").trim(); }
function srUnits(root){ const all = [...root.querySelectorAll(SRCH_SEL)]; return all.filter(el=>!el.querySelector(SRCH_SEL)); }
let SRCH_IX = null;
function srPageKey(h){ if (h.startsWith("day-")) return STREET() ? h : null; if (h.startsWith("stay-")) return null; return h; }
function srRender(key, st){
  const save = {SVC, TLC}; try { if (st) { if ("SVC" in st) SVC = st.SVC; if ("TLC" in st) TLC = st.TLC; }
    return key.startsWith("day-") ? dayPage(key.slice(4)) : key.startsWith("story-") ? views.story(key.slice(6)) : key.startsWith("guide-") ? views.guide(key.slice(6)) : views[key] ? views[key]() : "";
  } catch(e){ return ""; } finally { SVC = save.SVC; TLC = save.TLC; }
}
function srBuild(){
  const ix = [], seen = new Set(), queue = ["today","plan","stays","explore","info"].map(k=>[k,null]);
  const tpl = document.createElement("template");
  while (queue.length){
    const [key, st] = queue.shift(), id = key + JSON.stringify(st||{}); if (seen.has(id)) continue; seen.add(id);
    tpl.innerHTML = srRender(key, st); const root = tpl.content;
    root.querySelectorAll('a[href^="#"]').forEach(a=>{ const h = srPageKey(a.getAttribute("href").slice(1)); if (h && !SRCH_SKIP.has(h) && (views[h] || /^(story|guide|day)-/.test(h))) queue.push([h,null]); });
    if (key === "gifts" && !st) [...Object.keys(MOg().souvenirs||{}),"tailor","gear","active"].forEach(v=>queue.push(["gifts",{SVC:v}]));
    if (key === "timeline" && !st) ["all", ...Object.keys(FX().cityTimeline||{})].forEach(v=>queue.push(["timeline",{TLC:v}]));
    if ((key === "gifts" || key === "timeline") && !st) continue;
    const title = key.startsWith("day-") ? SRCH_NAME_DAY(key) : SRCH_NAME[key] || (root.querySelector("h1, h2")||{}).textContent || key;
    let last = "";
    srUnits(root).forEach((el,i)=>{
      const txt = srText(el); if (txt.length < 3) return;
      const sm = el.closest("details")?.querySelector("summary"); let h = sm && srText(sm); let p = el; 
      while (!h && p && p !== root){ let q = p.previousElementSibling; while (q && !/^H[23]$/.test(q.tagName)) q = q.previousElementSibling; if (q) h = q.textContent; p = p.parentElement; }
      const sub = st?.SVC ? ({tailor:"Tailors",gear:"Outdoor gear",active:"Athletic & bags"}[st.SVC] || CITYV[st.SVC] || "") : st?.TLC ? (st.TLC==="all" ? "Vietnam" : CITYV[st.TLC] || "") : "";
      ix.push({key, st, i, txt, n: srNorm(txt), where: [title.trim(), sub, (h||"").replace(/\s+/g," ").trim()].filter((x,j,a)=>x && a.indexOf(x)===j).join(" · ")});
    });
  }
  return ix;
}
function srLev(a, b){ if (Math.abs(a.length-b.length) > 2) return 9; const d = Array.from({length:b.length+1},(_,j)=>j); for (let i=1;i<=a.length;i++){ let prev = d[0]; d[0] = i; for (let j=1;j<=b.length;j++){ const t = d[j]; d[j] = Math.min(d[j]+1, d[j-1]+1, prev + (a[i-1]===b[j-1]?0:1)); prev = t; } } return d[b.length]; }
function srFind(q){
  const nq = srNorm(q).trim(); if (nq.length < 2) return [];
  const toks = nq.split(/\s+/);
  const out = [];
  for (const u of SRCH_IX){
    let score = 0;
    if (u.n.includes(nq)) score = (new RegExp("(^|[^a-z0-9])" + nq.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + "($|[^a-z0-9])").test(u.n) ? 40 : 0) + 100 - Math.min(40, u.n.indexOf(nq)/4) + (srNorm(u.where).includes(nq) ? 10 : 0);
    else {
      let ok = true, s = 0; const words = u.n.split(/[^a-z0-9]+/);
      for (const t of toks){
        if (u.n.includes(t)) { s += 20; continue; }
        const tol = t.length >= 7 ? 2 : t.length >= 5 ? 1 : 0;
        if (tol && words.some(w => srLev(t, w.slice(0, t.length)) <= tol || srLev(t, w) <= tol)) { s += 10; continue; }
        ok = false; break;
      }
      if (ok) score = s;
    }
    if (score) out.push([score, u]);
  }
  out.sort((a,b)=>b[0]-a[0]);
  const dedupe = new Set();
  return out.filter(([,u])=>{ const k = u.txt.slice(0,80); if (dedupe.has(k)) return false; dedupe.add(k); return true; }).slice(0, 40).map(x=>x[1]);
}
function srSnippet(u, q){
  const nq = srNorm(q).trim(), toks = nq.split(/\s+/).filter(Boolean);

  clearTimeout(CS.t); CS.t = setTimeout(() => csShow(CS.i + 1), 6000);
}
function csClose(){ const el = document.getElementById("cstory"); if (CS) clearTimeout(CS.t); if (el) el.remove(); document.documentElement.style.overflow = ""; }
document.addEventListener("click", e => {
  if (!document.getElementById("cstory")) return;
  if (e.target.closest("[data-csclose]")) { csClose(); return; }
  if (e.target.closest(".csnext")) csShow(CS.i + 1); else if (e.target.closest(".csprev")) csShow(CS.i - 1);
});
addEventListener("keydown", e => { if (e.key === "Escape") csClose(); });

function launch(){
  if (!ME()) return picker();
  T = scoped(FULL); afterTripReady(); if (!LIVE.init){ LIVE.init = 1; liveInit(); } $("#tabs").hidden=false; current=null; route();
  setTimeout(()=>prefetchPhotos().catch(()=>{}), 4000);
}
function start(data){
  FULL = data; window.addEventListener("hashchange",()=>{ if(T && ME()) route(); }); launch();
  // Tabs and section buttons replace the history entry, so the iPhone back-swipe can't flip between tabs.
  document.addEventListener("click",e=>{ const a=e.target.closest("#tabs a[href^='#'], nav.seg a[href^='#']"); if(!a) return; e.preventDefault(); const h=a.getAttribute("href");
    if (location.hash!==h){ history.replaceState(null,"",h); if(T && ME()) route(); } },true);
}

// Encrypted build: the trip data is locked with a shared trip passcode, entered once per phone.
async function unlock(pass, enc){
  const b = s => Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b(enc.salt), iterations:150000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b(enc.iv)}, key, b(enc.ct));
  if (enc.z) return JSON.parse(await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"))).text());
  return JSON.parse(new TextDecoder().decode(pt));
}
function lockScreen(enc, msg){
  $("#view").innerHTML = `<form class="lock" id="lockform"><div class="brand" style="font-size:30px">Vietnam<span>’26</span></div>
    <label for="pass" class="muted">Enter the trip passcode. You only need to do this once on this phone.</label>
    <input id="pass" type="password" autocomplete="current-password" required>
    <button class="btn" style="justify-self:center">Unlock</button>${msg?`<div class="err">${esc(msg)}</div>`:""}</form>`;
  $("#lockform").addEventListener("submit", async e=>{ e.preventDefault(); const p=$("#pass").value.trim();
    try { const d = await unlock(p, enc); store.set("trip-pass", p); start(d); } catch(err){ lockScreen(enc, "That passcode didn't work. Check it with Praneeth and try again."); } });
}

if (window.TRIP) start(window.TRIP);
else if (window.TRIP_ENC){
  const saved = store.get("trip-pass");
  if (saved) unlock(saved, window.TRIP_ENC).then(start).catch(err=>{ if (window.TRIP_ENC.z && typeof DecompressionStream==="undefined"){ $("#view").innerHTML=`<div class="card" style="margin:24px 16px"><b>Update your iPhone to open the trip app.</b><p class="small">It needs iOS 16.4 or newer: Settings, General, Software Update.</p></div>`; return; } store.del("trip-pass"); lockScreen(window.TRIP_ENC); });
  else lockScreen(window.TRIP_ENC);
}
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && !/claude/.test(location.host)) {
  navigator.serviceWorker.register("sw.js").then(r=>{ r.update().catch(()=>{}); document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") r.update().catch(()=>{}); }); }).catch(()=>{});
  // A new version took over: reload once so it shows right away.
  let reloaded=false; const hadSW=!!navigator.serviceWorker.controller; navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(reloaded || !hadSW) return; reloaded=true; location.reload(); });
}
