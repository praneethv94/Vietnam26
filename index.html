// Offline city maps: CARTO tiles, cached by the service worker.
const TILE = (z,x,y) => `https://tile.openstreetmap.org/${z}/${x}/${y}.png`;

const y2lat = (y,z) => { const n=Math.PI-2*Math.PI*y/(256*2**z); return 180/Math.PI*Math.atan(0.5*(Math.exp(n)-Math.exp(-n))); };

    <p class="small muted" id="mapmsg" style="margin:8px 0 0">Maps you look at are kept on this phone. Before the trip, open each city on Wi-Fi and zoom around the areas you'll visit, and they'll show with no signal.</p>
    <h3>${esc(MAP.city)}</h3><div class="card" style="padding:4px 16px">${pins.map((p,i)=>`<div class="row prow" data-place="${p.id}" style="cursor:pointer"><div class="pthumb ph pinnum">${i+1}</div><div class="what">${esc(p.name)}</div><span class="pin" style="align-self:center">${PIN}Open</span><div class="detail">${esc(p.vi)}</div></div>`).join("")}</div>`;

function drawMap(){
  const el=document.getElementById("map"), layer=document.getElementById("map-layer"); if(!el) return;
  const cfg = MOg().maps[MAP.city]; if (MAP.z==null || MAP.for!==MAP.city){ MAP.c=cfg.c.slice(); MAP.z=cfg.z; MAP.for=MAP.city; }
  const W=el.clientWidth, H=el.clientHeight, z=MAP.z, cx=lon2x(MAP.c[1],z), cy=lat2y(MAP.c[0],z), x0=cx-W/2, y0=cy-H/2;
  let h=""; const n=2**z;
  for (let tx=Math.floor(x0/256); tx<=Math.floor((x0+W)/256); tx++) for (let ty=Math.floor(y0/256); ty<=Math.floor((y0+H)/256); ty++){
    if (ty<0||ty>=n) continue; const wx=((tx%n)+n)%n;
    h += `<img class="mtile" alt="" draggable="false" onerror="this.style.visibility='hidden'" src="${TILE(z,wx,ty)}" style="left:${Math.round(tx*256-x0)}px;top:${Math.round(ty*256-y0)}px">`; }
  mapPins(MAP.city).forEach((p,i)=>{ const [la,lo]=COORD(p.name); const px=lon2x(lo,z)-x0, py=lat2y(la,z)-y0; if(px<-20||py<-20||px>W+20||py>H+40) return;
    h += `<button type="button" class="mpin" data-place="${p.id}" style="left:${Math.round(px)}px;top:${Math.round(py)}px" aria-label="${esc(p.name)}"><span><i>${i+1}</i></span></button>`; });

}
function wireMap(){
  const el=document.getElementById("map"); if(!el) return; drawMap();
  let st=null, moved=false, lastTap=0;
  const layer=document.getElementById("map-layer");
  el.addEventListener("touchstart",e=>{ if(e.target.closest(".map-ctl")) return; moved=false; const t=e.touches;
    st = t.length===2 ? {d:Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY), dx:0, dy:0, k:1} : {x:t[0].clientX, y:t[0].clientY, dx:0, dy:0, k:1}; },{passive:true});
  el.addEventListener("touchmove",e=>{ if(!st) return; e.preventDefault(); moved=true; const t=e.touches;
    if (t.length===2 && st.d){ st.k=Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)/st.d; layer.style.transform=`scale(${st.k})`; layer.style.transformOrigin="50% 50%"; }
    else if (t.length===1 && st.x!=null){ st.dx=t[0].clientX-st.x; st.dy=t[0].clientY-st.y; layer.style.transform=`translate(${st.dx}px,${st.dy}px)`; } },{passive:false});
  const end=()=>{ if(!st) return; const z=MAP.z;
    if (st.k!==1){ MAP.z=Math.max(11,Math.min(18,z+Math.round(Math.log2(st.k)))); }
    else if (st.dx||st.dy){ const cx=lon2x(MAP.c[1],z)-st.dx, cy=lat2y(MAP.c[0],z)-st.dy; MAP.c=[y2lat(cy,z), x2lon(cx,z)]; }
    st=null; drawMap(); };
  el.addEventListener("touchend",e=>{ if(e.touches.length) return; const n=Date.now(); if(!moved && !e.target.closest(".mpin,.map-ctl")){ if(n-lastTap<300){ MAP.z=Math.min(18,MAP.z+1); st=null; drawMap(); lastTap=0; return; } lastTap=n; } end(); });
  // Mouse drag for desktop testing.
  el.addEventListener("mousedown",e=>{ if(e.target.closest(".map-ctl,.mpin")) return; st={x:e.clientX,y:e.clientY,dx:0,dy:0,k:1};
    const mv=ev=>{ st.dx=ev.clientX-st.x; st.dy=ev.clientY-st.y; layer.style.transform=`translate(${st.dx}px,${st.dy}px)`; };
    const up=()=>{ removeEventListener("mousemove",mv); removeEventListener("mouseup",up); end(); }; addEventListener("mousemove",mv); addEventListener("mouseup",up); });
}
document.addEventListener("click", e=>{
  const c=e.target.closest("[data-mapcity]"); if(c){ MAP.city=c.dataset.mapcity; store.set("map-city",MAP.city); MAP.z=null; render("stays",null,"map"); return; }
  const z=e.target.closest("[data-mapz]"); if(z){ const v=+z.dataset.mapz; if(v) MAP.z=Math.max(11,Math.min(18,MAP.z+v)); else MAP.z=null; drawMap(); return; }
  const s=e.target.closest("[data-mapsave]"); if(s){ const urls=[]; for (const [c,m] of Object.entries(MOg().maps||{})) for (let z=m.z-1; z<=m.z+1; z++){
      const [la0,lo0,la1,lo1]=m.box; const xa=Math.floor(lon2x(lo0,z)/256), xb=Math.floor(lon2x(lo1,z)/256), ya=Math.floor(lat2y(la1,z)/256), yb=Math.floor(lat2y(la0,z)/256);
      for (let x=xa;x<=xb;x++) for (let y=ya;y<=yb;y++) urls.push(TILE(z,x,y)); }
    const msg=document.getElementById("mapmsg");
    if (!navigator.serviceWorker?.controller){ if(msg) msg.textContent="Open the app from the home screen first, then try again."; return; }
    navigator.serviceWorker.controller.postMessage({type:"save-tiles", urls}); store.set("maps-saved", Date.now());
    if(msg) msg.textContent=`Saving ${urls.length} map pieces in the background. Keep the app open on Wi-Fi for a minute.`; s.textContent="Saving…"; }
});

const NF = new Intl.NumberFormat("en-US"), fmtVnd = n => NF.format(Math.round(n/50000)*50000) + " ₫";
const fmtUsd = n => "$" + Math.round(n / T.info.rates.VND);
const nowH = () => nowMin()/60;
const dayOf = iso => T.days.find(d=>d.date===iso);
const placeByName = n => (T.places||[]).find(p=>p.name===n);
const cityOfIso = iso => (dayOf(iso)||{}).city;
const MAPCITY = c => Object.keys(CITYNAME).find(k=>CITYNAME[k]===c);

// --- What now? ---
let WN = { here: null, n: 3 };
function openAt(S, h, wd){
  if (S[3] && !S[3].includes(wd)) return null;
  for (const [a,b] of S[2]){ if (h >= a && h < b - 0.25) return b; if (h + 24 >= a && h + 24 < b - 0.25) return b - 24; }
  return null;
}
function rainPct(city, iso){ try{ return JSON.parse(store.get("wx-"+city)||"null")?.days?.[iso]?.p ?? null; }catch(e){ return null; } }
function whatNow(){
  const iso = todayIso(), d = dayOf(iso), wd = parse(iso).getDay(), h = nowH();
  const city = d && VN(d.city) ? d.city : "hcmc", M = (MOg().maps||{})[MAPCITY(city)];
  const origin = WN.here || (M && M.c), rain = rainPct(city, iso);
  const planned = new Set((d ? d.items : []).flatMap(x=>placesFor(x[1], d.city)).map(p=>p.name));
  const meal = (h>=11 && h<14) || (h>=17.5 && h<21), coffee = (h>=7 && h<11) || (h>=14 && h<17.5), late = h>=18;
  const out = [];
  for (const [name, S] of Object.entries(MOg().spots||{})){
    const C = COORD(name); if (!C || !origin) continue;
    const km = hav(origin, C)*1.3; if (km > 12) continue;
    const till = openAt(S, h, wd); if (till == null) continue;
    let score = -km*1.6;
    if (S[0]==="eat" && meal) score += 3; if (S[0]==="coffee" && coffee) score += 2.5;
    if ((S[0]==="night"||S[0]==="walk") && late) score += 3; if ((S[0]==="night") && !late) score -= 2;
    if (rain!=null && rain>=50) score += S[1] ? 2 : -2.5;
    if (till - h < 1) score -= 2;
    if (planned.has(name)) score -= 1.5;
    out.push({ name, S, km, till, score, planned: planned.has(name) });
  }
  return { list: out.sort((a,b)=>b.score-a.score), rain, city, origin, d };
}
function getThere(km){
  const walk = Math.round(km/4.5*60), grab = Math.round(4 + km/20*60), fare = Math.max(30, Math.round((12 + km*14)/5)*5);
  return walk <= 20 ? `${walk} min walk` : `Grab ~${grab} min · ~${fare}k ₫`;
}
function whatNowCards(){
  const W = whatNow(), K = MOg().spotKinds||{};
  if (!W.list.length) return `<div class="card"><b>Nothing nearby is open right now.</b><p class="small muted" style="margin:6px 0 0">Late night? Head back to your stay, or check the Eat list for tomorrow.</p></div>`;
  return W.list.slice(0, WN.n).map((x,i)=>{ const p = placeByName(x.name);
    const why = [K[x.S[0]], x.S[1] ? "Indoors" : "", `Open till ${hm(x.till)}`, x.planned ? "On today's plan" : ""].filter(Boolean).join(" · ");
    return `<div class="card wn"><div class="wn-n">${i+1}</div><div class="wn-b"><b>${esc(x.name)}</b><span class="small muted">${esc(why)}</span><span class="wn-go">${getThere(x.km)}${WN.here?"":" from the center"}</span>
      <div class="btns">${p?`<button class="btn" data-place="${p.id}">Details</button>`:""}<a class="btn" href="${mapUrl(x.name+", Vietnam")}" target="_blank" rel="noopener">Directions</a></div></div></div>`; }).join("")
    + (W.list.length > WN.n ? `<button class="btn" data-wnmore style="margin-top:4px">Show more</button>` : "");
}
function nowPage(){

    <p class="small muted" style="margin:0 0 10px">Open right now and close by${rain!=null&&rain>=50?`, leaning indoors (${rain}% rain)`:""}. Hours are approximate.</p>
    <div class="btns" style="margin:0 0 14px"><button class="btn solid" data-wnhere>${WN.here?"Updated to where you are":"Use where I am"}</button></div>

// --- Cash for today ---
function cashFor(d){
  if (!d || !VN(d.city)) return null;
  const F = MOg().fees||{}, B = MOg().cashBase||{food:350000,ride:40000,buffer:200000};
  const names = [...new Set(d.items.flatMap(x=>placesFor(x[1], d.city)).map(p=>p.name))];
  const lines = [];
  names.forEach(n=>{ if (F[n]) lines.push([n, F[n]]); });
  const txt = d.items.map(x=>x[1]).join(" ").toLowerCase();
  const rides = (txt.match(/\bgrab\b|\bcar to\b|\bcar\b|taxi|transfer/g)||[]).length;
  const fine = /coco|\bgia\b|tasting menu|la maison|anan/.test(txt);
  lines.push([fine ? "Street food, coffee and snacks (dinner on card)" : "Meals, coffee and snacks", fine ? Math.round(B.food*0.6) : B.food]);
  if (rides) lines.push([`${rides} ride${rides>1?"s":""}, shared`, rides*B.ride]);
  lines.push(["Tips and small extras", B.buffer]);
  const total = lines.reduce((s,l)=>s+l[1],0);
  return { total, lines };
}
function cashHtml(d){
  const c = cashFor(d); if (!c) return "";
  return `<details class="card cash"><summary><span class="cash-ico">₫</span><span><b>Carry about ${fmtVnd(c.total)} each</b><span class="small muted">≈ ${fmtUsd(c.total)} · tap for the breakdown</span></span></summary>
    <ul class="cashl">${c.lines.map(([t,v])=>`<li><span>${esc(t)}</span><b>${(Math.round(v/1000)).toLocaleString()}k</b></li>`).join("")}</ul>
    <p class="small muted" style="margin:6px 0 0">Bring small notes (10k–100k). Cards work at hotels and nicer restaurants; markets, street food and tips are cash.</p></details>`;
}

// --- Morning brief ---
function briefHtml(d){
  const test = new URLSearchParams(location.search).get("am");
  if (!d || (nowH() >= 12 && !test)) return "";
  const h = nowH();
  const next = d.items.map(x=>[parseItemTime(x[0]), x]).filter(([t])=>t!=null && t >= h - 0.25).sort((a,b)=>a[0]-b[0])[0];
  const leg = legsOn(d.date).find(l=>localDate(l.dep)===d.date);
  const list = checklistFor(d), txt = list.map(x=>x[0]).join(" ");
  const wear = [];
  if (/Shoulders/.test(txt)) wear.push("shoulders and knees covered");
  if (/Comfortable shoes/.test(txt)) wear.push("good walking shoes");
  if (/Umbrella/.test(txt)) wear.push("something for the rain");
  if (/Light jacket/.test(txt)) wear.push("a light layer for tonight");
  if (/Dinner outfit/.test(txt)) wear.push("dinner clothes for tonight");
  if (!wear.length) wear.push("light, breathable clothes");
  const bring = list.filter(([t])=>!/Shoulders|Comfortable shoes|Dinner outfit|Light jacket|Phone charged|Cash in dong/.test(t)).map(x=>x[0]);
  const c = cashFor(d);
  const row = (k, v) => `<div class="br-r"><span class="br-k">${k}</span><span>${v}</span></div>`;
  return `<h3>Good morning</h3><div class="card brief">
    ${leg ? row("Flight", `<b>${esc(leg.no)} at ${localTime(leg.dep)}</b>`) : ""}
    ${next ? row("First up", `<b>${esc(next[1][0])}</b> ${esc(next[1][1])}`) : row("First up", "Nothing timed. Take it slow.")}
    ${row("Wear", esc(wear.join(", ")))}
    ${bring.length ? row("Bring", esc(bring.join(", "))) : ""}
    ${c ? row("Cash", `<b>about ${fmtVnd(c.total)}</b> each`) : ""}
  </div>`;
}

// ===== History and facts: Did you know?, timeline, December in history, trivia =====
const FX = () => (T && T.facts) || { facts: [], timeline: [], december: {}, trivia: [] };
const CITYLBL = { all: "Vietnam", hcmc: "Saigon", hoian: "Hội An", danang: "Đà Nẵng", hanoi: "Hà Nội", ninhbinh: "Ninh Bình" };
const placeCityKey = name => { const p = placeByName(name); return p ? CITYNAME[p.city] : null; };
const factWhere = w => CITYLBL[w] || w;
function hashStr(s){ let h = 0; for (const c of s) h = (h*31 + c.charCodeAt(0)) | 0; return Math.abs(h); }
// Facts for a day: places on the plan first, then the city, then the country; rotates by date.
function factsForDay(d, n){
  const F = FX().facts.map((f,i)=>({f,i}));
  const names = d ? new Set(d.items.flatMap(x=>placesFor(x[1], d.city)).map(p=>p.name)) : new Set();
  const pool = [...F.filter(x=>names.has(x.f[1])), ...F.filter(x=>d && x.f[1]===d.city), ...F.filter(x=>x.f[1]==="all")];
  const seed = hashStr(d ? d.date : todayIso()), out = [], seen = new Set();
  const groups = [pool.filter(x=>names.has(x.f[1])), pool.filter(x=>d && x.f[1]===d.city), pool.filter(x=>x.f[1]==="all")];
  for (const g of groups){ if (!g.length) continue; const x = g[seed % g.length]; if (!seen.has(x.i)){ out.push(x); seen.add(x.i); } if (out.length >= n) break; }
  return out;
}
const factCard = (x, sm) => `<div class="fact${sm?" sm":""}"><div class="fact-k"><span>${esc(x.f[0])}</span><span>${esc(factWhere(x.f[1]))}</span></div><p>${esc(x.f[2])}</p></div>`;
function todayFactsHtml(d){
  const list = factsForDay(d, 2), dec = d ? FX().december[d.date] : null;
  if (!list.length && !dec) return "";
  return `<h3>Did you know?</h3><div class="card facts-today">${list.map(x=>factCard(x,1)).join("")}
    <a class="more-link" href="#facts">More facts ›</a>
    ${dec?`<div class="fact sm dec"><div class="fact-k"><span>This December in history</span><span>${esc(dec[0])}</span></div><p>${esc(dec[1])}</p></div>`:""}</div>`;
}
function placeFactsHtml(p){
  const F = FX().facts.filter(f=>f[1]===p.name); if (!F.length) return "";
  return `<div class="pfacts"><div class="sub-h">Did you know?</div>${F.map(f=>`<p>${esc(f[2])}</p>`).join("")}</div>`;
}

// Did you know? deck
let FD = { cat: "All", order: null, i: 0 };
const FCATS = ["All", "History", "Food", "Language", "Culture", "Quirk", "Here"];
function deckList(){
  const d = dayOf(todayIso()), city = d && VN(d.city) ? d.city : null;
  return FX().facts.map((f,i)=>({f,i})).filter(({f})=>{
    if (FD.cat==="All") return true;
    if (FD.cat==="Here") return city && (f[1]===city || placeCityKey(f[1])===city);
    return f[0]===FD.cat || (FD.cat==="History" && f[0]==="Nature");
  });
}
function deckShuffle(){ const L = deckList(); FD.order = L.map(x=>x.i).sort(()=>Math.random()-.5); FD.i = 0; }
function deckCur(){ if (!FD.order || !FD.order.length) deckShuffle(); const i = FD.order[FD.i % Math.max(1,FD.order.length)]; return i==null ? null : {f: FX().facts[i], i}; }
function deckBody(){
  const x = deckCur(), n = FD.order ? FD.order.length : 0;
  return x ? `<div class="card deck">${factCard(x)}<div class="deck-n small muted">${(FD.i % n)+1} of ${n}</div></div>
    <div class="btns deck-btns"><button class="btn" data-deck="prev">← Back</button><button class="btn solid" data-deck="next">Next fact →</button><button class="btn" data-deck="shuffle">Shuffle</button></div>`
    : `<div class="card"><p style="margin:0">No facts for this filter yet${FD.cat==="Here"?" (it lights up once you're in Vietnam)":""}.</p></div>`;
}
function factsPage(){
  return `<a class="btn back-link" href="#explore">← Explore</a><h2>Did you know?</h2>
    <p class="small muted" style="margin:0 0 10px">${FX().facts.length} short facts about Vietnam. Tap Next, or shuffle.</p>
    <div class="chips" role="group" aria-label="Filter facts">${FCATS.map(c=>`<button type="button" class="chipbtn" data-fcat="${c}" aria-pressed="${FD.cat===c}">${c==="Here"?"Where we are":c}</button>`).join("")}</div>
    <div id="deck">${deckBody()}</div>`;
}
document.addEventListener("click", e=>{
  const c = e.target.closest("[data-fcat]");
  if (c){ FD.cat = c.dataset.fcat; deckShuffle(); document.querySelectorAll("[data-fcat]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.fcat===FD.cat)); $("#deck").innerHTML = deckBody(); return; }
  const b = e.target.closest("[data-deck]"); if (!b) return;
  const n = (FD.order||[]).length || 1;
  if (b.dataset.deck==="next") FD.i = (FD.i+1) % n; else if (b.dataset.deck==="prev") FD.i = (FD.i-1+n) % n; else deckShuffle();
  $("#deck").innerHTML = deckBody();
});

// Timeline
function timelinePage(){
  // Vietnam as a whole, or one city at a time. Opens on today's city during the trip.
  const CT = FX().cityTimeline || {}, d = T.days.find(x=>x.date===todayIso());
  if (TLC == null) TLC = d && CT[d.city] ? d.city : "all";
  const tabs = [["all","Vietnam"],["hcmc","Sài Gòn"],["hoian","Hội An"],["danang","Đà Nẵng"],["hanoi","Hà Nội"],["ninhbinh","Ninh Bình"]].filter(([k])=>k==="all"||CT[k]);
  const SID = {hcmc:"saigon"}, sid = SID[TLC]||TLC, story = T.stories.find(s=>s.id===sid);

// ===== Live leaderboard: every phone writes its own scores to one shared room and listens for everyone else's.
// Firebase Realtime Database over plain REST and server-sent events (no SDK). Works offline: changes wait and send later.
const LIVE = { es: null, room: null, dirty: false, timer: null, state: "off", seen: 0, ping0: Date.now() };
const liveBase = () => T && T.live ? `${T.live.db}/v26/${T.live.room}` : null;
const SCORE_KEYS = new Set(["hunt-found","trivia-right","trivia-scores","bingo","awards","haggles","speak"]);
function takeRecord(x){
  if (!x || !x.n || x.n === ME()) return false;
  const B = local.get("board", {}), rec = { n:x.n, t:x.t*60000, tr:x.tr||[], tb:x.tb||0, h:{}, bg:x.bg||0, hg:x.hg||0, sp:x.sp||{}, aw:(x.aw||[]).map(a=>({id:a[0], to:a[1], p:a[2], g:a[3], ts:a[4]*60000})) };
  Object.entries(x.h||{}).forEach(([k,v])=>rec.h[k]=v*60000);
  if (B[x.n] && B[x.n].t > rec.t) return false;
  B[x.n] = rec; store.set("board", JSON.stringify(B)); return true;
}
function livePush(soon){
  if (!liveBase() || !ME()) return; LIVE.dirty = true; clearTimeout(LIVE.timer);
  LIVE.timer = setTimeout(async ()=>{
    if (!navigator.onLine) return;
    try { const r = await fetch(`${liveBase()}/scores/${encodeURIComponent(ME())}.json`, { method: "PUT", body: JSON.stringify(compactRecord()) });
      if (r.ok){ LIVE.dirty = false; liveStatus(); } } catch(e){}
  }, soon ? 300 : 1500);
}
function liveApply(path, data){
  // Keep a mirror of the room, then copy everyone else's scores into this phone's board.
  if (path === "/") LIVE.room = data || {};
  else { LIVE.room = LIVE.room || {}; const parts = path.split("/").filter(Boolean).map(decodeURIComponent); let o = LIVE.room;
    for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]] = (o[parts[i]] && typeof o[parts[i]] === "object") ? o[parts[i]] : {};
    if (data == null) delete o[parts[parts.length-1]]; else o[parts[parts.length-1]] = data; }
  let changed = false; Object.values((LIVE.room||{}).scores || {}).forEach(x=>{ if (takeRecord(x)) changed = true; });
  const pg = (LIVE.room||{}).ping;
  if (pg && pg.t > LIVE.ping0 && pg.t > LIVE.seen){ LIVE.seen = pg.t; if (pg.by !== ME()){ toast(`${pg.by} refreshed everyone's app`); liveRefresh(); } }
  LIVE.seen = Math.max(LIVE.seen, (pg && pg.t) || 0);
  LIVE.state = "on"; liveStatus();
  if (changed && /^#(board|games)$/.test(location.hash)){ const y = scrollY; route(); scrollTo(0, y); }
}
function liveListen(){
  if (!liveBase() || !window.EventSource) return; liveStop();
  const es = LIVE.es = new EventSource(`${liveBase()}.json`);
  const on = ev => { try { const m = JSON.parse(ev.data); if (m) liveApply(m.path, m.data); } catch(e){} };
  es.addEventListener("put", on); es.addEventListener("patch", ev => { try { const m = JSON.parse(ev.data); Object.entries(m.data||{}).forEach(([k,v])=>liveApply((m.path==="/"?"":m.path)+"/"+k, v)); } catch(e){} });
  es.onerror = () => { LIVE.state = navigator.onLine ? "retry" : "off"; liveStatus(); };
}
function liveStop(){ if (LIVE.es){ LIVE.es.close(); LIVE.es = null; } }
async function liveRefresh(){
  // Fetch the newest app (if one was published) and reload; scores come back with the page.
  try { const r = await navigator.serviceWorker?.getRegistration(); await r?.update(); } catch(e){}
  setTimeout(()=>location.reload(), 900);
}
function liveStatus(){
  const el = document.getElementById("live-st"); if (!el) return;
  el.textContent = !liveBase() ? "" : LIVE.dirty && !navigator.onLine ? "Offline. Your scores will send when you're back online."
    : LIVE.state === "on" ? "Live. Scores update on everyone's phone as you play." : "Connecting…";

}
function liveInit(){
  if (!liveBase()) return;
  const set0 = local.set; local.set = (k, v) => { set0(k, v); if (SCORE_KEYS.has(k)) livePush(); };
  livePush(true); liveListen();
  document.addEventListener("visibilitychange", ()=>{ if (document.visibilityState === "visible"){ liveListen(); if (LIVE.dirty) livePush(true); } else liveStop(); });
  addEventListener("online", ()=>{ liveListen(); livePush(true); });
}

// Circles: tap to jump. Once the big row scrolls away, a slim bar slides in (transform only, no layout change),
// and the city on screen lights up. Both are driven by IntersectionObserver, so nothing runs on every scroll frame.
let PLAN_Y = null, planIO = [];
function planMark(k){
  document.querySelectorAll(".pcirc,.pmc").forEach(c=>c.classList.toggle("on", c.dataset.pgo === k));
  const bar = $(".pmini-in"), c = bar && bar.querySelector(`.pmc[data-pgo="${CSS.escape(k)}"]`);
  if (c) bar.scrollTo({ left: c.offsetLeft - (bar.clientWidth - c.offsetWidth) / 2, behavior: "smooth" });
}
function planObserve(){
  planIO.forEach(o=>o.disconnect()); planIO = [];
  // #view animates transform, which would trap a fixed bar inside it, so the bar lives on <body>.
  document.querySelectorAll("body > .pmini").forEach(x=>x.remove()); const m = $("#view .pmini"); if (m) document.body.appendChild(m);
  const row = $(".pcircs"), mini = $(".pmini"); if (!row || !mini) return;
  const hdr = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--hdr")) || 56;
  const o1 = new IntersectionObserver(([e])=>{ mini.classList.toggle("show", !e.isIntersecting && e.boundingClientRect.top < hdr); }, { rootMargin: `-${hdr}px 0px 0px 0px` });
  o1.observe(row); planIO.push(o1);
  // A section counts as current once its top passes just under the slim bar.
  const vis = new Map();
  const o2 = new IntersectionObserver(es=>{ es.forEach(e=>vis.set(e.target, e.isIntersecting));
    const secs = [...document.querySelectorAll(".psec")]; const cur = secs.filter(x=>vis.get(x)).shift() || null; if (cur) planMark(cur.dataset.psec); },
    { rootMargin: `-${hdr + 60}px 0px -55% 0px` });
  document.querySelectorAll(".psec").forEach(x=>o2.observe(x)); planIO.push(o2);
}
function planGo(el){ const off = (parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--hdr")) || 56) + 62; scrollTo({ top: el.getBoundingClientRect().top + scrollY - off, behavior: "smooth" }); }
function planInit(){
  if (PLAN_Y != null) { scrollTo(0, PLAN_Y); PLAN_Y = null; }
  else { const t = document.getElementById("pd-" + todayIso()); scrollTo(0, t ? t.getBoundingClientRect().top + scrollY - 140 : 0); }
  const first = $(".psec"); if (first) planMark(first.dataset.psec);
  planObserve(); planForecast();
}
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-pgo]"); if (b) { const s = document.getElementById("pc-" + b.dataset.pgo); if (s) planGo(s); return; }
  const c = e.target.closest(".pday"); if (c) PLAN_Y = scrollY;
});

// Live forecast: within the forecast window, banners show the real forecast for those dates and wet days get an umbrella.
async function planForecast(){
  const iso = todayIso(), lim = new Date(Date.now() + 15 * 864e5).toISOString().slice(0,10);
  for (const h of document.querySelectorAll(".phero[data-psec]")) {
    const k = h.dataset.psec, ds = T.days.filter(d=>d.city===k && d.date >= iso && d.date <= lim).map(d=>d.date); if (!ds.length) continue;
    const f = await forecast(k); if (!f || !h.isConnected) continue;
    const fd = ds.map(d=>f.days?.[d]).filter(Boolean); if (!fd.length) continue;
    const hi = Math.max(...fd.map(x=>x.hi)), lo = Math.min(...fd.map(x=>x.lo)), wet = fd.filter(x=>(x.p||0) >= 50).length, worst = fd.reduce((a,b)=>(b.p||0) > (a.p||0) ? b : a);
    const [ic, lab] = WMO(worst.c), w = h.querySelector(".pwx");
    if (w) w.innerHTML = `<span>${ic}</span><b>${hi}°</b><small>${lo}°F</small><em>Forecast · ${wet ? `${wet} wet day${wet>1?"s":""}` : esc(lab)}</em>`;
    ds.forEach(d=>{ const x = f.days?.[d], c = document.getElementById("pd-" + d); if (!x || !c || c.querySelector(".pwet")) return;

  }
}

  const iso = todayIso(), first = T.days[0].date, last = T.days[T.days.length-1].date, idx = T.days.findIndex(d=>d.date===iso);

  let top = "", body = "";
  if (iso < first){
    const n = Math.round((parse(first)-parse(iso))/864e5);
    const mf = PB() ? null : local.get("my-flights",[]).find(f=>f.date>=iso);
    const nn = mf ? Math.round((parse(mf.date)-parse(iso))/864e5) : n;
    top = streetHero({ city: "hoian", line: `Countdown · Hi ${esc(ME())}`, sm: `${nn} day${nn===1?"":"s"} to`, nm: "Việt Nam", title: PB() ? "We fly Fri Dec 4 at 6:00 AM from Sarasota" : mf ? `Your flight: ${esc(mf.from)} → ${esc(mf.to)}, ${fmt(mf.date)}` : "Everyone together in Sài Gòn from Sun Dec 6" });

  } else if (iso > last){

      <div id="raintop"></div>${factsStrip(d)}`;
    top += travelDayHtml(iso) + briefHtml(d) + checkoutHtml(d) + tomorrowHtml(iso) + jetlagHtml(iso);
    const tp = [...new Set(d.items.flatMap(x=>placesFor(x[1],d.city)))].filter(p=>p.photo);
    if (tp.length) top += `<h3>Today's places</h3><div class="strip">${tp.map(p=>`<button class="ptile" data-place="${p.id}"><div class="ph" data-lead="${esc(p.photo)}"></div><span>${esc(p.name)}</span></button>`).join("")}</div>`;

// Before-you-fly countdown: open items with their deadlines (more.mjs todo). Ticks are saved on this phone.
function todoHtml(iso){
  const L = (MOg().todo||[]).filter(t=>t[4]==="all" || PB()), done = local.get("todo-done", {});
  const open = L.filter(t=>!done[t[0]]); if (!L.length) return "";
  const dleft = due => Math.round((parse(due) - parse(iso)) / 864e5);
  const when = n => n < 0 ? `${-n} day${n===-1?"":"s"} late` : n === 0 ? "today" : n === 1 ? "tomorrow" : `${n} days`;
  const row = t => { const n = dleft(t[2]), dt = parse(t[2]);
    return `<label class="todo-r${done[t[0]]?" done":""}${n<=3&&!done[t[0]]?" soon":""}"><input type="checkbox" data-todo="${t[0]}"${done[t[0]]?" checked":""}><span><b>${esc(t[1])}</b><small>${esc(t[3])}</small></span><span class="num"><span>${done[t[0]] ? "Done" : when(n)}</span></span><em>${t[5] ? "Deadline" : "Aim for"} ${DOW[dt.getDay()]} ${MON[dt.getMonth()]} ${dt.getDate()}</em></label>`; };
  return `<h3>Still to do before you fly · ${open.length} left</h3><div class="card todo">${[...L].sort((a,b)=>(done[a[0]]?1:0)-(done[b[0]]?1:0) || a[2].localeCompare(b[2])).map(row).join("")}</div>`;
}

function tlxYear(from, to){
  const el = document.getElementById("tlxyear"); if (!el) return;
  el.style.fontSize = String(to).length > 9 ? "48px" : String(to).length > 7 ? "60px" : "";
  const num = s => { if (/legend/i.test(s)) return null; const m = String(s).match(/(\d{2,4})/); return m ? +m[1] * (/BC/.test(s) ? -1 : 1) : null; };
  const a = num(from), b = num(to);
  if (a == null || b == null || a === b || reduceMotion()){ el.textContent = to; return; }
  const t0 = performance.now(), D = 480, tok = el._tok = (el._tok||0) + 1;
  const step = t => { if (el._tok !== tok) return; const k = Math.min(1, (t - t0) / D), e = 1 - Math.pow(1 - k, 3), v = Math.round(a + (b - a) * e);
    el.textContent = k < 1 ? (v < 0 ? (-v) + " BC" : v) : to; if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function tlxTick(){
  const top = document.getElementById("tlxtop"), list = document.getElementById("tlxlist"); if (!TLX || !top || !list) return;
  const tb = top.getBoundingClientRect().bottom, line = tb + (innerHeight - tb) * .3, items = [...list.children];
  let k = 0; items.forEach((li,i)=>{ const r = li.getBoundingClientRect(); if (r.top < innerHeight * .94) li.classList.add("seen"); if (r.top < line) k = i; });
  if (k !== TLX.cur){ const prev = TLX.cur >= 0 ? TLX.rows[TLX.cur][0] : TLX.rows[0][0]; TLX.cur = k;
    items.forEach((li,i)=>li.classList.toggle("on", i===k));
    top.querySelectorAll(".ph").forEach((p,i)=>p.classList.toggle("on", TLX.keys[i]===TLX.ph[k]));
    tlxYear(prev, TLX.rows[k][0]); const t = document.getElementById("tlxttl"); if (t) t.textContent = TLX.rows[k][1]; }
  const lr = list.getBoundingClientRect(), p = Math.max(0, Math.min(1, (line - lr.top) / Math.max(1, lr.height - 40)));
  const rail = document.getElementById("tlxrail"); if (rail) rail.style.transform = `scaleX(${p.toFixed(3)})`;
}
addEventListener("scroll", ()=>{ if (TLX && document.getElementById("tlxtop")) requestAnimationFrame(tlxTick); }, {passive:true});

// Search: renders every page offscreen, splits it into cards and list items, and matches typed words (accents and typos forgiven).
const SRCH_SKIP = new Set(["trivia","guess","hunt","recap","board","haggle","speak","games","map","now"]);
const SRCH_NAME_DAY = k => { const d = T.days.find(x=>x.date===k.slice(4)); return d ? fmt(d.date) + " · " + d.title : "Plan"; };
const SRCH_NAME = {today:"Today",plan:"Plan",stays:"Stays",explore:"Explore",info:"Info",bookings:"Bookings",facts:"Did you know?",timeline:"Timeline",gifts:"Shopping",food:"Food",eat:"Eat list",listen:"Listen",places:"Places",say:"Say it"};
const srNorm = t => (t||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/gi,"d").toLowerCase().replace(/['’`]/g,"");
const SRCH_SEL = ".card, details, li, .xt, article p, article h2, article h3, tr";
function srText(el){ const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), out = []; let n; while ((n = w.nextNode())) if (!n.parentElement.closest("button")) out.push(n.data); return out.join(" ").replace(/\s+/g," ").replace(/ ↗/g,"").replace(/\s+([.,:;!?)])/g,"$1").trim(); }
function srUnits(root){ const all = [...root.querySelectorAll(SRCH_SEL)]; return all.filter(el=>!el.querySelector(SRCH_SEL)); }
let SRCH_IX = null;
function srPageKey(h){ if (h.startsWith("day-")) return STREET() ? h : null; if (h.startsWith("stay-")) return null; return h; }
function srRender(key, st){
  const save = {SVC, TLC}; try { if (st) { if ("SVC" in st) SVC = st.SVC; if ("TLC" in st) TLC = st.TLC; }
    return key.startsWith("day-") ? dayPage(key.slice(4)) : key.startsWith("story-") ? views.story(key.slice(6)) : key.startsWith("guide-") ? views.guide(key.slice(6)) : views[key] ? views[key]() : "";
  } catch(e){ return ""; } finally { SVC = save.SVC; TLC = save.TLC; }
}
function srBuild(){
  const ix = [], seen = new Set(), queue = ["today","plan","stays","explore","info"].map(k=>[k,null]);
  const tpl = document.createElement("template");
  while (queue.length){
    const [key, st] = queue.shift(), id = key + JSON.stringify(st||{}); if (seen.has(id)) continue; seen.add(id);
    tpl.innerHTML = srRender(key, st); const root = tpl.content;
    root.querySelectorAll('a[href^="#"]').forEach(a=>{ const h = srPageKey(a.getAttribute("href").slice(1)); if (h && !SRCH_SKIP.has(h) && (views[h] || /^(story|guide|day)-/.test(h))) queue.push([h,null]); });
    if (key === "gifts" && !st) [...Object.keys(MOg().souvenirs||{}),"tailor","gear","active"].forEach(v=>queue.push(["gifts",{SVC:v}]));
    if (key === "timeline" && !st) ["all", ...Object.keys(FX().cityTimeline||{})].forEach(v=>queue.push(["timeline",{TLC:v}]));
    if ((key === "gifts" || key === "timeline") && !st) continue;
    const title = key.startsWith("day-") ? SRCH_NAME_DAY(key) : SRCH_NAME[key] || (root.querySelector("h1, h2")||{}).textContent || key;
    let last = "";
    srUnits(root).forEach((el,i)=>{
      const txt = srText(el); if (txt.length < 3) return;
      const sm = el.closest("details")?.querySelector("summary"); let h = sm && srText(sm); let p = el; 
      while (!h && p && p !== root){ let q = p.previousElementSibling; while (q && !/^H[23]$/.test(q.tagName)) q = q.previousElementSibling; if (q) h = q.textContent; p = p.parentElement; }
      const sub = st?.SVC ? ({tailor:"Tailors",gear:"Outdoor gear",active:"Athletic & bags"}[st.SVC] || CITYV[st.SVC] || "") : st?.TLC ? (st.TLC==="all" ? "Vietnam" : CITYV[st.TLC] || "") : "";
      ix.push({key, st, i, txt, n: srNorm(txt), where: [title.trim(), sub, (h||"").replace(/\s+/g," ").trim()].filter((x,j,a)=>x && a.indexOf(x)===j).join(" · ")});
    });
  }
  return ix;
}
function srLev(a, b){ if (Math.abs(a.length-b.length) > 2) return 9; const d = Array.from({length:b.length+1},(_,j)=>j); for (let i=1;i<=a.length;i++){ let prev = d[0]; d[0] = i; for (let j=1;j<=b.length;j++){ const t = d[j]; d[j] = Math.min(d[j]+1, d[j-1]+1, prev + (a[i-1]===b[j-1]?0:1)); prev = t; } } return d[b.length]; }
function srFind(q){
  const nq = srNorm(q).trim(); if (nq.length < 2) return [];
  const toks = nq.split(/\s+/);
  const out = [];
  for (const u of SRCH_IX){
    let score = 0;
    if (u.n.includes(nq)) score = (new RegExp("(^|[^a-z0-9])" + nq.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + "($|[^a-z0-9])").test(u.n) ? 40 : 0) + 100 - Math.min(40, u.n.indexOf(nq)/4) + (srNorm(u.where).includes(nq) ? 10 : 0);
    else {
      let ok = true, s = 0; const words = u.n.split(/[^a-z0-9]+/);
      for (const t of toks){
        if (u.n.includes(t)) { s += 20; continue; }
        const tol = t.length >= 7 ? 2 : t.length >= 4 ? 1 : 0;
        if (tol && words.some(w => srLev(t, w.slice(0, t.length)) <= tol || srLev(t, w) <= tol)) { s += 10; continue; }
        ok = false; break;
      }
      if (ok) score = s;
    }
    if (score) out.push([score, u]);
  }
  out.sort((a,b)=>b[0]-a[0]);
  const dedupe = new Set();
  return out.filter(([,u])=>{ const k = u.txt.slice(0,80); if (dedupe.has(k)) return false; dedupe.add(k); return true; }).slice(0, 40).map(x=>x[1]);
}
function srSnippet(u, q){
  const nq = srNorm(q).trim(), toks = nq.split(/\s+/).filter(Boolean);
  let at = u.n.indexOf(nq); if (at < 0) at = Math.max(0, ...toks.map(t=>u.n.indexOf(t)));
  const a = Math.max(0, at - 50), txt = u.txt.slice(a, a + 170);
  let html = esc((a ? "…" : "") + txt + (u.txt.length > a + 170 ? "…" : ""));
  toks.forEach(t=>{ if (t.length < 2) return; const n = [...html].map(c=>srNorm(c).length===1 ? srNorm(c) : c).join(""); let i = n.indexOf(t); if (i >= 0 && !/[<>&]/.test(html.slice(i, i+t.length))) html = html.slice(0,i) + "<mark>" + html.slice(i, i+t.length) + "</mark>" + html.slice(i+t.length); });
  return html;
}
function srOpen(){
  if ($("#srch")) return;
  const d = document.createElement("div"); d.id = "srch"; d.setAttribute("role","dialog"); d.setAttribute("aria-label","Search");
  d.innerHTML = `<div class="srch-bar"><input id="srch-q" type="search" placeholder="Search everything: CoCo, Arc'teryx, áo dài…" autocomplete="off" enterkeyhint="search"><button type="button" class="btn" id="srch-x">Close</button></div><div id="srch-r" class="srch-r"><p class="small muted">Try a place, a food, a shop or a booking.</p></div>`;
  document.body.appendChild(d); document.body.classList.add("srch-on");
  const inp = $("#srch-q"); inp.value = local.get("srch-last","") || ""; inp.focus(); if (inp.value) srShow(inp.value);
  inp.addEventListener("input", ()=>srShow(inp.value));
}
function srClose(){ $("#srch")?.remove(); document.body.classList.remove("srch-on"); }
let SRCH_RES = [];
function srShow(q){
  if (!SRCH_IX) SRCH_IX = srBuild();
  local.set("srch-last", q);
  SRCH_RES = srFind(q);
  $("#srch-r").innerHTML = q.trim().length < 2 ? `<p class="small muted">Try a place, a food, a shop or a booking.</p>` : SRCH_RES.length ? SRCH_RES.map((u,j)=>`<button type="button" class="srch-hit" data-srhit="${j}"><small>${esc(u.where)}</small><span>${srSnippet(u, q)}</span></button>`).join("") : `<p class="small muted">Nothing found for “${esc(q)}”.</p>`;
}
function srGo(u){
  srClose();
  if (u.st){ if ("SVC" in u.st){ SVC = u.st.SVC; if (MOg().souvenirs?.[SVC]) CITYLAST = SVC; } if ("TLC" in u.st) TLC = u.st.TLC; }
  const h = "#" + u.key; if (location.hash === h) route(); else location.hash = h;
  setTimeout(()=>{ const el = srUnits($("#view"))[u.i] || null; const hit = el && srNorm(srText(el)) === u.n ? el : srUnits($("#view")).find(x=>srNorm(srText(x)) === u.n);
    if (!hit) return; let p = hit.closest("details"); while (p){ if (!p.open) { if (typeof toggleDay === "function" && p.classList.contains("day")) toggleDay(p); else p.open = true; } p = p.parentElement?.closest("details"); }
    // Photos and opening cards shift the page as they load, so re-centre a few times unless the person starts scrolling.
    let stop = false; const halt = ()=>{ stop = true; }; addEventListener("touchstart", halt, {once:true, passive:true}); addEventListener("wheel", halt, {once:true, passive:true});
    [150, 450, 900, 1500, 2300].forEach(t=>setTimeout(()=>{ if (!stop && hit.isConnected) hit.scrollIntoView({block:"center"}); }, t));
    hit.classList.add("srch-flash"); setTimeout(()=>hit.classList.remove("srch-flash"), 3200);
  }, 80);
}
document.addEventListener("click", e=>{
  if (e.target.closest("#srchbtn")) { srOpen(); return; }
  if (e.target.closest("#srch-x")) { srClose(); return; }
  const h = e.target.closest("[data-srhit]"); if (h) srGo(SRCH_RES[+h.dataset.srhit]);
});
document.addEventListener("keydown", e=>{ if (e.key === "Escape" && $("#srch")) srClose(); });

function launch(){
  if (!ME()) return picker();
  T = scoped(FULL); afterTripReady(); if (!LIVE.init){ LIVE.init = 1; liveInit(); } $("#tabs").hidden=false; current=null; route();
  setTimeout(()=>prefetchPhotos().catch(()=>{}), 4000);
}
function start(data){
  FULL = data; window.addEventListener("hashchange",()=>{ if(T && ME()) route(); }); launch();
  // Tabs and section buttons replace the history entry, so the iPhone back-swipe can't flip between tabs.
  document.addEventListener("click",e=>{ const a=e.target.closest("#tabs a[href^='#'], nav.seg a[href^='#']"); if(!a) return; e.preventDefault(); const h=a.getAttribute("href");
    if (location.hash!==h){ history.replaceState(null,"",h); if(T && ME()) route(); } },true);
}

// Encrypted build: the trip data is locked with a shared trip passcode, entered once per phone.
async function unlock(pass, enc){
  const b = s => Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b(enc.salt), iterations:150000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b(enc.iv)}, key, b(enc.ct));
  if (enc.z) return JSON.parse(await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"))).text());
  return JSON.parse(new TextDecoder().decode(pt));
}
function lockScreen(enc, msg){
  $("#view").innerHTML = `<form class="lock" id="lockform"><div class="brand" style="font-size:30px">Vietnam<span>’26</span></div>
    <label for="pass" class="muted">Enter the trip passcode. You only need to do this once on this phone.</label>
    <input id="pass" type="password" autocomplete="current-password" required>
    <button class="btn" style="justify-self:center">Unlock</button>${msg?`<div class="err">${esc(msg)}</div>`:""}</form>`;
  $("#lockform").addEventListener("submit", async e=>{ e.preventDefault(); const p=$("#pass").value.trim();
    try { const d = await unlock(p, enc); store.set("trip-pass", p); start(d); } catch(err){ lockScreen(enc, "That passcode didn't work. Check it with Praneeth and try again."); } });
}

if (window.TRIP) start(window.TRIP);
else if (window.TRIP_ENC){
  const saved = store.get("trip-pass");
  if (saved) unlock(saved, window.TRIP_ENC).then(start).catch(err=>{ if (window.TRIP_ENC.z && typeof DecompressionStream==="undefined"){ $("#view").innerHTML=`<div class="card" style="margin:24px 16px"><b>Update your iPhone to open the trip app.</b><p class="small">It needs iOS 16.4 or newer: Settings, General, Software Update.</p></div>`; return; } store.del("trip-pass"); lockScreen(window.TRIP_ENC); });
  else lockScreen(window.TRIP_ENC);
}
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && !/claude/.test(location.host)) {
  navigator.serviceWorker.register("sw.js").then(r=>{ r.update().catch(()=>{}); document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") r.update().catch(()=>{}); }); }).catch(()=>{});
  // A new version took over: reload once so it shows right away.
  let reloaded=false; const hadSW=!!navigator.serviceWorker.controller; navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(reloaded || !hadSW) return; reloaded=true; location.reload(); });
}
})();
