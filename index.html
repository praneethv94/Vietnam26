  background:rgb(255 255 255/.55);-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);box-shadow:inset 0 0 0 1px rgb(255 255 255/.7),0 4px 14px rgb(20 40 80/.12)}

/* ── Nov 5 round 2 ── */

/* Check-in card. */

/* Trip map button and sheet. */

.tm-list{display:grid;gap:6px;padding-top:6px}

.tm-row.now{box-shadow:inset 0 0 0 2px var(--city)}

/* ── Nov 5 round 3: liquid glass wallet, gates, Ninh Bình spur ── */
.wcard{background:linear-gradient(150deg,color-mix(in srgb,var(--c2) 70%,transparent),color-mix(in srgb,var(--c1) 84%,transparent));
  -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);overflow:hidden;

  background:radial-gradient(120% 70% at 0% 0%,rgb(255 255 255/.32),transparent 55%),linear-gradient(180deg,rgb(255 255 255/.14),transparent 30%)}

.wc-f{grid-template-columns:minmax(0,.8fr) minmax(0,1fr) minmax(0,.9fr) minmax(0,1.45fr);gap:5px}.wc-f .wf{padding:8px 7px}.wf b{font-size:14px}
.wc-track{display:flex;align-items:center;gap:10px;margin:12px 16px 0;min-height:52px;padding:8px 14px;border-radius:14px;text-decoration:none;color:#fff;
  background:rgb(255 255 255/.18);box-shadow:inset 0 0 0 1px rgb(255 255 255/.38),inset 0 1px 0 rgb(255 255 255/.55)}
.wc-track .ic2{width:20px;height:20px;color:#f2c94c;flex:none}.wc-track span{flex:1;display:grid}.wc-track b{font:800 14.5px var(--body)}.wc-track small{font:600 12px var(--body);color:rgb(255 255 255/.75)}
.wc-track i{font-style:normal;font-weight:800;opacity:.8}
.wc-f .wf.chg{background:#da251d}
.wcard .wc-qr{padding-top:10px}
.wc-ck{font:800 12px var(--body);font-style:normal;padding:4px 9px;border-radius:999px;background:rgb(255 255 255/.22);box-shadow:inset 0 0 0 1px rgb(255 255 255/.35);white-space:nowrap}
.wc-ck.on{background:#2e8b57;box-shadow:none}

.wc-ckrow i{font-style:normal;font-weight:800}

  background:rgb(255 255 255/.7);-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);box-shadow:inset 0 0 0 1px rgb(255 255 255/.8),0 6px 18px rgb(20 40 80/.18)}

const W = "https://en.wikipedia.org/api/rest_v1/page/";
const wkey = t => encodeURIComponent(t.replace(/ /g,"_"));
const BAD = /(\.svg|\.gif|flag|coat_of_arms|logo|location|locator|map|seal_of|emblem|icon|signature)/i;
async function cachedJson(k, url){
  try{ const c=JSON.parse(store.get(k)||"null"); if(c) return c; }catch(e){}

async function wikiLead(title){

  const j = await cachedJson(k, W+"summary/"+wkey(title)); if(!j) return null;

// Calendar reminders (.ics): flights and key moments, with alerts.

// Offline city maps: CARTO tiles, cached by the service worker.
const TILE = (z,x,y) => `https://tile.openstreetmap.org/${z}/${x}/${y}.png`;
const lon2x = (lon,z) => (lon+180)/360*256*2**z;
const lat2y = (lat,z) => { const s=Math.sin(lat*Math.PI/180); return (0.5-Math.log((1+s)/(1-s))/(4*Math.PI))*256*2**z; };
const x2lon = (x,z) => x/(256*2**z)*360-180;
const y2lat = (y,z) => { const n=Math.PI-2*Math.PI*y/(256*2**z); return 180/Math.PI*Math.atan(0.5*(Math.exp(n)-Math.exp(-n))); };
let MAP = { city: store.get("map-city") || "Saigon" };
function mapPins(city){ return T.places.filter(p=>p.city===city && COORD(p.name)); }
// City names are stored in plain English (they're data keys); show them in Vietnamese.
const VIN = c => ({"Saigon":"Sài Gòn","Ho Chi Minh City":"Sài Gòn","Hoi An":"Hội An","Da Nang":"Đà Nẵng","Hanoi":"Hà Nội","Ninh Binh":"Ninh Bình"})[c] || c;
// Centre and zoom the Google map so every pin in the city fits on screen.
function gmFit(pins, cfg){
  const P = pins.map(p => COORD(p.name)).filter(c => c && isFinite(c[0]) && isFinite(c[1]));
  if (!P.length) return cfg.c ? `&ll=${cfg.c[0]},${cfg.c[1]}&z=${cfg.z || 14}` : "";
  const la = P.map(c => c[0]), lo = P.map(c => c[1]), la0 = Math.min(...la), la1 = Math.max(...la), lo0 = Math.min(...lo), lo1 = Math.max(...lo);
  const W = Math.max(280, Math.min(innerWidth, 700) - 40), H = Math.min(innerHeight * .62, 520) - 60;
  const zx = Math.log2(W * 360 / (256 * Math.max(lo1 - lo0, .002))), zy = Math.log2(H * 360 / (256 * Math.max(la1 - la0, .002) * 1.05));
  const z = Math.max(9, Math.min(16, Math.floor(Math.min(zx, zy))));
  return `&ll=${((la0 + la1) / 2).toFixed(5)},${((lo0 + lo1) / 2).toFixed(5)}&z=${z}`;
}

  el.addEventListener("touchend",e=>{ if(e.touches.length) return; const n=Date.now(); if(!moved && !e.target.closest(".mpin,.map-ctl")){ if(n-lastTap<300){ MAP.z=Math.min(18,MAP.z+1); st=null; drawMap(); lastTap=0; return; } lastTap=n; } end(); });

const NF = new Intl.NumberFormat("en-US"), fmtVnd = n => NF.format(Math.round(n/50000)*50000) + " ₫";
const fmtUsd = n => "$" + Math.round(n / T.info.rates.VND);

// --- What now? ---
let WN = { here: null, n: 3 };
function openAt(S, h, wd){
  if (S[3] && !S[3].includes(wd)) return null;
  for (const [a,b] of S[2]){ if (h >= a && h < b - 0.25) return b; if (h + 24 >= a && h + 24 < b - 0.25) return b - 24; }
  return null;
}
function rainPct(city, iso){ try{ return JSON.parse(store.get("wx-"+city)||"null")?.days?.[iso]?.p ?? null; }catch(e){ return null; } }
function whatNow(){
  const iso = todayIso(), d = dayOf(iso), wd = parse(iso).getDay(), h = nowH();
  const city = d && VN(d.city) ? d.city : "hcmc", M = (MOg().maps||{})[MAPCITY(city)];
  const origin = WN.here || (M && M.c), rain = rainPct(city, iso);
  const planned = new Set((d ? d.items : []).flatMap(x=>placesFor(x[1], d.city)).map(p=>p.name));
  const meal = (h>=11 && h<14) || (h>=17.5 && h<21), coffee = (h>=7 && h<11) || (h>=14 && h<17.5), late = h>=18;
  const out = [];
  for (const [name, S] of Object.entries(MOg().spots||{})){
    const C = COORD(name); if (!C || !origin) continue;
    const km = hav(origin, C)*1.3; if (km > 12) continue;
    const till = openAt(S, h, wd); if (till == null) continue;
    let score = -km*1.6;
    if (S[0]==="eat" && meal) score += 3; if (S[0]==="coffee" && coffee) score += 2.5;
    if ((S[0]==="night"||S[0]==="walk") && late) score += 3; if ((S[0]==="night") && !late) score -= 2;
    if (rain!=null && rain>=50) score += S[1] ? 2 : -2.5;
    if (till - h < 1) score -= 2;
    if (planned.has(name)) score -= 1.5;
    out.push({ name, S, km, till, score, planned: planned.has(name) });
  }
  return { list: out.sort((a,b)=>b.score-a.score), rain, city, origin, d };
}
function getThere(km){
  const walk = Math.round(km/4.5*60), grab = Math.round(4 + km/20*60), fare = Math.max(30, Math.round((12 + km*14)/5)*5);
  return walk <= 20 ? `${walk} min walk` : `Grab ~${grab} min · ~${fare}k ₫`;
}

  const W = whatNow(), K = MOg().spotKinds||{};

  return W.list.slice(0, WN.n).map((x,i)=>{ const p = placeByName(x.name);
    const why = [K[x.S[0]], x.S[1] ? "Indoors" : "", `Open till ${hm(x.till)}`, x.planned ? "On today's plan" : ""].filter(Boolean).join(" · ");

// --- Cash for today ---
function cashFor(d){
  if (!d || !VN(d.city)) return null;
  const F = MOg().fees||{}, B = MOg().cashBase||{food:350000,ride:40000,buffer:200000};
  const names = [...new Set(d.items.flatMap(x=>placesFor(x[1], d.city)).map(p=>p.name))];
  const lines = [];
  names.forEach(n=>{ if (F[n]) lines.push([n, F[n]]); });
  const txt = d.items.map(x=>x[1]).join(" ").toLowerCase();
  const rides = (txt.match(/\bgrab\b|\bcar to\b|\bcar\b|taxi|transfer/g)||[]).length;
  const fine = /coco|\bgia\b|tasting menu|la maison|anan/.test(txt);
  lines.push([fine ? "Street food, coffee and snacks (dinner on card)" : "Meals, coffee and snacks", fine ? Math.round(B.food*0.6) : B.food]);
  if (rides) lines.push([`${rides} ride${rides>1?"s":""}, shared`, rides*B.ride]);
  lines.push(["Tips and small extras", B.buffer]);
  const total = lines.reduce((s,l)=>s+l[1],0);
  return { total, lines };
}

const CITYLBL = { all: "Vietnam", hcmc: "Sài Gòn", hoian: "Hội An", danang: "Đà Nẵng", hanoi: "Hà Nội", ninhbinh: "Ninh Bình" };
const placeCityKey = name => { const p = placeByName(name); return p ? CITYNAME[p.city] : null; };
const factWhere = w => CITYLBL[w] || w;
function hashStr(s){ let h = 0; for (const c of s) h = (h*31 + c.charCodeAt(0)) | 0; return Math.abs(h); }
// Facts for a day: places on the plan first, then the city, then the country; rotates by date.
function factsForDay(d, n){
  const F = FX().facts.map((f,i)=>({f,i}));
  const names = d ? new Set(d.items.flatMap(x=>placesFor(x[1], d.city)).map(p=>p.name)) : new Set();
  const pool = [...F.filter(x=>names.has(x.f[1])), ...F.filter(x=>d && x.f[1]===d.city), ...F.filter(x=>x.f[1]==="all")];
  const seed = hashStr(d ? d.date : todayIso()), out = [], seen = new Set();
  const groups = [pool.filter(x=>names.has(x.f[1])), pool.filter(x=>d && x.f[1]===d.city), pool.filter(x=>x.f[1]==="all")];
  for (const g of groups){ if (!g.length) continue; const x = g[seed % g.length]; if (!seen.has(x.i)){ out.push(x); seen.add(x.i); } if (out.length >= n) break; }
  return out;
}

function triviaStart(name){

function triviaPage(){
  const S = triviaScores();

    <p class="small muted" style="margin:0 0 12px">Ten random questions, about all of Vietnam or one city. Every different question you get right is a point on the leaderboard (${triviaN()} of ${FX().trivia.length} so far).</p>

  if (TQ.i >= TQ.qs.length){
    return `<h2>${esc(TQ.name)}: ${TQ.score}/${TQ.qs.length}</h2><div class="card"><p style="margin:0">${TQ.score>=8?"Tour-guide level.":TQ.score>=5?"Solid. Read a few more facts.":"The Did you know? deck is calling."}</p></div>
      <div class="btns"><button class="btn solid" data-tqagain>Play again</button><a class="btn" href="#board">Leaderboard</a></div>`;

    <div class="card tq"><p class="tq-q">${esc(q)}</p><div class="tq-opts">${opts.map((o,i)=>`<button type="button" class="tq-o${P!=null?(i===ans?" right":i===P?" wrong":""):""}" data-tqpick="${i}"${P!=null?" disabled":""}>${esc(o)}</button>`).join("")}</div>

document.addEventListener("click", e=>{
  const rr = () => { $("#view").innerHTML = triviaPage(); };
  const tc = e.target.closest("[data-tqcity]"); if (tc){ TQCITY = tc.dataset.tqcity; rr(); return; }
  const s = e.target.closest("[data-tqstart]"); if (s){ triviaStart(s.dataset.tqstart); rr(); return; }
  const p = e.target.closest("[data-tqpick]"); if (p && TQ && TQ.picked==null){ TQ.picked = +p.dataset.tqpick; if (TQ.picked === FX().trivia[TQ.qs[TQ.i]][2]) { TQ.score++; const R = triviaRight(); R[TQ.qs[TQ.i]] = 1; local.set("trivia-right", R); } rr(); return; }

    if (TQ.i >= TQ.qs.length){ const S = triviaScores(), v = S[TQ.name] || {best:0, plays:0}; v.best = Math.max(v.best, TQ.score); v.plays++; S[TQ.name] = v; local.set("trivia-scores", S); }

// ===== Games: photo hunt and one leaderboard for every game, synced by sharing a link =====
const HUNT = () => FX().hunt || [];
const huntItem = id => HUNT().find(h=>h[0]===id);
// Photos live in IndexedDB on this phone only.
const IDB = { db: null,
  open(){ if (this.db) return Promise.resolve(this.db); return new Promise((ok, no)=>{ const r = indexedDB.open("vietnam26", 1); r.onupgradeneeded = ()=>r.result.createObjectStore("hunt"); r.onsuccess = ()=>{ this.db = r.result; ok(this.db); }; r.onerror = ()=>no(r.error); }); },
  async put(k, v){ const db = await this.open(); return new Promise((ok, no)=>{ const t = db.transaction("hunt","readwrite"); t.objectStore("hunt").put(v, k); t.oncomplete = ok; t.onerror = ()=>no(t.error); }); },
  async get(k){ const db = await this.open(); return new Promise(ok=>{ const r = db.transaction("hunt").objectStore("hunt").get(k); r.onsuccess = ()=>ok(r.result||null); r.onerror = ()=>ok(null); }); },
  async del(k){ const db = await this.open(); return new Promise(ok=>{ const t = db.transaction("hunt","readwrite"); t.objectStore("hunt").delete(k); t.oncomplete = ok; t.onerror = ok; }); },
};
const huntFound = () => local.get("hunt-found", {});
const triviaRight = () => local.get("trivia-right", {});
const triviaN = () => Object.keys(triviaRight()).filter(k => +k < 1000).length;
function myRecord(){
  const tb = (triviaScores()[ME()]||{}).best || 0;
  const sp = {}; Object.entries(speakDone()).forEach(([k,v])=>sp[k]=v.by);
  return { n: ME(), t: Date.now(), tr: Object.keys(triviaRight()).map(Number), tb, h: huntFound(), bg: Object.keys(bingo()).length, hg: bestHaggle(), sp, aw: awardsMine() };
}
function boardRecords(){

  B[me.n] = me; return Object.values(B).filter(r=>r && r.n);

// Daily bounty: one item per trip day, worth double if caught that day.
function bountyFor(iso){
  const d = dayOf(iso); if (!d || !VN(d.city)) return null;
  const pool = HUNT().filter(h=>h[1] < 5 && (!h[3] || h[3]===d.city));
  return pool.length ? pool[hashStr("bounty"+iso) % pool.length] : null;
}
function scoreAll(){
  const R = boardRecords(), first = {}, aw = {}, SP = Object.fromEntries(SPEAK().map(x=>[x[0], x[4]]));
  R.forEach(r=>Object.entries(r.h||{}).forEach(([id,ts])=>{ if (first[id]==null || ts < first[id].ts) first[id] = {ts, n: r.n}; }));
  R.forEach(r=>(r.aw||[]).forEach(a=>{ aw[a.id] = a; }));
  Object.values(aw).forEach(a=>{ if (!R.some(r=>r.n===a.to)) R.push({ n: a.to, t: 0 }); });
  const champ = R.reduce((m,r)=>Math.max(m, r.hg||0), 0);
  return R.map(r=>{
    let hunt = 0, bonus = 0;
    Object.entries(r.h||{}).forEach(([id,ts])=>{ const it = huntItem(id); if (!it) return;
      const day = isoOf(new Date(ts)), b = bountyFor(day); let p = it[1]; if (b && b[0]===id) p *= 2;
      hunt += p; if (first[id] && first[id].n===r.n && R.length > 1) bonus++; });
    const trivia = (r.tr||[]).length, bingo = r.bg||0;
    const bill = Object.values(aw).filter(a=>a.to===r.n && a.g==="bill").reduce((s,a)=>s+a.p, 0);
    const haggle = Math.floor((r.hg||0)/10) + (champ > 0 && r.hg===champ && R.length > 1 ? 3 : 0);
    const speak = Object.keys(r.sp||{}).reduce((s,k)=>s+(SP[k]||0), 0);
    return { n: r.n, t: r.t, hunt, bonus, trivia, bingo, bill, haggle, speak, found: Object.keys(r.h||{}).length,
      total: hunt + bonus + trivia + bingo + bill + haggle + speak, me: r.n===ME() };
  }).sort((a,b)=>b.total-a.total || a.n.localeCompare(b.n));
}
const ago = t => { const m = Math.round((Date.now()-t)/60000); return m < 2 ? "just now" : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m/60)} h ago` : `${Math.round(m/1440)} d ago`; };

// Sharing scores: a link anyone in the group can open to update their leaderboard.
function compactRecord(){ const r = myRecord(), h = {}; Object.entries(r.h).forEach(([k,v])=>h[k]=Math.round(v/60000)); const aw = r.aw.map(a=>[a.id, a.to, a.p, a.g, Math.round(a.ts/60000)]); return {n:r.n,t:Math.round(r.t/60000),tr:r.tr,tb:r.tb,h,bg:r.bg,hg:r.hg,sp:r.sp,aw}; }
function syncCode(){ return btoa(unescape(encodeURIComponent(JSON.stringify(compactRecord())))).replace(/=+$/,""); }
function takeSyncFromHash(){

// ===== Live leaderboard: every phone writes its own scores to one shared room and listens for everyone else's.
// Firebase Realtime Database over plain REST and server-sent events (no SDK). Works offline: changes wait and send later.
const LIVE = { es: null, room: null, dirty: false, timer: null, state: "off", seen: 0, ping0: Date.now() };
const LIVE_OFF = location.protocol === "file:" || /^(localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\])$/.test(location.hostname);
const liveBase = () => T && T.live && !LIVE_OFF ? `${T.live.db}/v26/${T.live.room}` : null;
const SCORE_KEYS = new Set(["hunt-found","trivia-right","trivia-scores","bingo","awards","haggles","speak"]);
function takeRecord(x){
  if (!x || !x.n || x.n === ME()) return false;
  const B = local.get("board", {}), rec = { n:x.n, t:x.t*60000, tr:x.tr||[], tb:x.tb||0, h:{}, bg:x.bg||0, hg:x.hg||0, sp:x.sp||{}, aw:(x.aw||[]).map(a=>({id:a[0], to:a[1], p:a[2], g:a[3], ts:a[4]*60000})) };
  Object.entries(x.h||{}).forEach(([k,v])=>rec.h[k]=v*60000);
  if (B[x.n] && B[x.n].t > rec.t) return false;
  B[x.n] = rec; store.set("board", JSON.stringify(B)); return true;
}
function livePush(soon){
  if (!liveBase() || !ME()) return; LIVE.dirty = true; clearTimeout(LIVE.timer);
  LIVE.timer = setTimeout(async ()=>{
    if (!navigator.onLine) return;
    try { const r = await fetch(`${liveBase()}/scores/${encodeURIComponent(ME())}.json`, { method: "PUT", body: JSON.stringify(compactRecord()) });
      if (r.ok){ LIVE.dirty = false; liveStatus(); } } catch(e){}
  }, soon ? 300 : 1500);
}
function liveApply(path, data){
  // Keep a mirror of the room, then copy everyone else's scores into this phone's board.
  if (path === "/") LIVE.room = data || {};
  else { LIVE.room = LIVE.room || {}; const parts = path.split("/").filter(Boolean).map(decodeURIComponent); let o = LIVE.room;
    for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]] = (o[parts[i]] && typeof o[parts[i]] === "object") ? o[parts[i]] : {};
    if (data == null) delete o[parts[parts.length-1]]; else o[parts[parts.length-1]] = data; }
  if (typeof gatesSync === "function") gatesSync((LIVE.room||{}).gates);
  let changed = false; Object.values((LIVE.room||{}).scores || {}).forEach(x=>{ if (takeRecord(x)) changed = true; });
  const pg = (LIVE.room||{}).ping;
  if (pg && pg.t > LIVE.ping0 && pg.t > LIVE.seen){ LIVE.seen = pg.t; if (pg.by !== ME()){ toast(`${pg.by} refreshed everyone's app`); liveRefresh(); } }
  LIVE.seen = Math.max(LIVE.seen, (pg && pg.t) || 0);
  LIVE.state = "on"; liveStatus();
  if (changed && /^#(board|games)$/.test(location.hash)){ const y = scrollY; route(); scrollTo(0, y); }
}
function liveListen(){
  if (!liveBase() || !window.EventSource) return; liveStop();
  const es = LIVE.es = new EventSource(`${liveBase()}.json`);
  const on = ev => { try { const m = JSON.parse(ev.data); if (m) liveApply(m.path, m.data); } catch(e){} };
  es.addEventListener("put", on); es.addEventListener("patch", ev => { try { const m = JSON.parse(ev.data); Object.entries(m.data||{}).forEach(([k,v])=>liveApply((m.path==="/"?"":m.path)+"/"+k, v)); } catch(e){} });
  es.onerror = () => { LIVE.state = navigator.onLine ? "retry" : "off"; liveStatus(); };
}
function liveStop(){ if (LIVE.es){ LIVE.es.close(); LIVE.es = null; } }
async function liveRefresh(){
  // Fetch the newest app (if one was published) and reload; scores come back with the page.
  try { const r = await navigator.serviceWorker?.getRegistration(); await r?.update(); } catch(e){}
  setTimeout(()=>location.reload(), 900);
}
function liveStatus(){
  const el = document.getElementById("live-st"); if (!el) return;
  el.textContent = !liveBase() ? "" : LIVE.dirty && !navigator.onLine ? "Offline. Your scores will send when you're back online."
    : LIVE.state === "on" ? "Live. Scores update on everyone's phone as you play." : "Connecting…";
  el.dataset.st = LIVE.state;
}
function liveInit(){
  if (!liveBase()) return;
  const set0 = local.set; local.set = (k, v) => { set0(k, v); if (SCORE_KEYS.has(k)) livePush(); };
  livePush(true); liveListen();
  document.addEventListener("visibilitychange", ()=>{ if (document.visibilityState === "visible"){ liveListen(); if (LIVE.dirty) livePush(true); } else liveStop(); });
  addEventListener("online", ()=>{ liveListen(); livePush(true); });
}
document.addEventListener("click", async e=>{
  const b = e.target.closest("[data-liveping]"); if (!b) return;
  if (!liveBase()) return liveRefresh();
  try { await fetch(`${liveBase()}/ping.json`, { method: "PUT", body: JSON.stringify({ t: Date.now(), by: ME() }) }); toast("Refreshing everyone's app"); } catch(err){ toast("No connection. Try again when you're online."); return; }
  liveRefresh();
});
document.addEventListener("click", e=>{ if (e.target.closest("[data-liverefresh]")){ livePush(true); liveListen(); toast("Scores refreshed"); } });

  const Q = (FX().quizzes || {})[id]; if (!Q || QORDER.indexOf(id) < 0) return "";
  const tried = local.get("quiz-tried", {}), R = triviaRight();
  const got = Q.filter((q, i) => R[qid(id, i)]).length, done = Q.filter((q, i) => tried[qid(id, i)] != null).length;
  return `<section class="squiz" id="squiz"><small>Quick quiz · a point each on the leaderboard</small><b>${done === Q.length ? `You got ${got} of ${Q.length}` : "How much do you remember?"}</b>
    ${Q.map(([q, opts, ans, why], i) => { const k = qid(id, i), t = tried[k];
      return `<div class="sq"><p>${i + 1}. ${esc(q)}</p><div class="sqo">${opts.map((o, j) => `<button type="button" data-sq="${id}:${i}:${j}"${t != null ? " disabled" : ""} class="${t != null && j === ans ? "ok" : t === j ? "no" : ""}">${esc(o)}</button>`).join("")}</div>${t != null ? `<p class="why">${t === ans ? "Right. " : "Not quite. "}${esc(why)}</p>` : ""}</div>`; }).join("")}</section>`;
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-sq]"); if (!b) return;
  const [id, i, j] = b.dataset.sq.split(":"), Q = FX().quizzes[id], k = qid(id, +i), T2 = local.get("quiz-tried", {});
  if (T2[k] != null) return; T2[k] = +j; local.set("quiz-tried", T2);
  if (+j === Q[+i][2]) { const R = triviaRight(); R[k] = 1; local.set("trivia-right", R); }
  const box = document.getElementById("squiz"); if (box) box.outerHTML = storyQuiz(id);
});

// Leaderboard: lanterns sized by points, the bounty, and the latest finds.
function latestFeed(){
  const ev = [];
  boardRecords().forEach(r=>{
    Object.entries(r.h||{}).forEach(([id,ts])=>{ const it = huntItem(id); if (it) ev.push({ ts, n: r.n, html: `found ${esc(it[2].charAt(0).toLowerCase() + it[2].slice(1))}`, p: it[1] }); });
    (r.aw||[]).forEach(a=>{ if (a.to) ev.push({ ts: a.ts, n: a.to, html: `won ${a.g === "bill" ? "Guess the bill" : esc(a.g)}`, p: a.p }); });
  });
  const seen = new Set();
  return ev.filter(x=>{ const k = x.n + x.ts + x.html; if (seen.has(k)) return false; seen.add(k); return x.ts; }).sort((a,b)=>b.ts-a.ts).slice(0, 6);
}
function lanternsHtml(S){
  const names = T.travelers.map(t=>t.name), byN = Object.fromEntries(S.map(s=>[s.n, s]));
  S.forEach(s=>{ if (!names.includes(s.n)) names.push(s.n); });
  const max = Math.max(1, ...S.map(s=>s.total)), n = names.length;
  const sag = x => 22 + 26 * Math.sin(Math.PI * x);   // the wire droops in the middle
  const ls = names.map((nm,i)=>{ const s = byN[nm] || { total: 0 }, x = (i + .5) / n, sz = Math.round(40 + 34 * (s.total / max));
    return `<div class="ln${nm===ME()?" me":""}" style="left:${(x*100).toFixed(1)}%;top:${sag(x).toFixed(0)}px"><span class="cord" style="height:${10 + (i%2)*16}px"></span><span class="bod" style="width:${sz}px;height:${Math.round(sz*1.12)}px;font-size:${Math.round(sz*.42)}px">${s.total}</span><span class="tas"></span><span class="nm">${esc(nm)}</span></div>`; }).join("");
  const pts = Array.from({length:21}, (_,i)=>`${i*5},${sag(i/20).toFixed(1)}`).join(" ");
  return `<div class="lstring" aria-label="Points: ${S.map(s=>`${esc(s.n)} ${s.total}`).join(", ")}"><svg class="wire" viewBox="0 0 100 210" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="#5a3d1a" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>${ls}</div>`;
}

// Before-you-fly countdown: open items with their deadlines (more.mjs todo). Ticks are saved on this phone.
function todoHtml(iso){
  const L = (MOg().todo||[]).filter(t=>t[4]==="all" || PB()), done = local.get("todo-done", {});

// Travelling pill: which stop and year you're reading. IntersectionObserver only, no scroll handlers.
let TLFIO = [];
function tlfWatch(){
  TLFIO.forEach(o => o.disconnect()); TLFIO = [];
  document.querySelectorAll("body > .tlf-pill").forEach(x => x.remove());
  const pill = document.getElementById("tlfpill"); if (!pill) return; document.body.appendChild(pill);
  const name = document.getElementById("tlfname"), yr = document.getElementById("tlfyr"), stops = [...document.querySelectorAll(".tlf-stop")];
  const hdr = (document.querySelector("header.top") || {}).offsetHeight || 60, band = `-${hdr + 40}px 0px -${Math.round(innerHeight * .6)}px 0px`;
  const setStop = sec => { const i = stops.indexOf(sec); name.textContent = sec.dataset.name; pill.querySelectorAll(".tlf-dots i").forEach((d, j) => { d.className = j < i ? "past" : j === i ? "on" : ""; }); };
  const so = new IntersectionObserver(es => { es.forEach(e => { if (e.isIntersecting) setStop(e.target); }); }, { rootMargin: band });
  stops.forEach(s => so.observe(s));
  const yo = new IntersectionObserver(es => { es.forEach(e => { if (e.isIntersecting && yr.textContent !== e.target.dataset.y){ yr.textContent = e.target.dataset.y; } }); }, { rootMargin: band });
  document.querySelectorAll(".tlf li[data-y]").forEach(li => yo.observe(li));
  const first = stops[0], vo = new IntersectionObserver(es => { es.forEach(e => pill.classList.toggle("show", !e.isIntersecting && e.boundingClientRect.top < 0)); }, { rootMargin: `-${hdr}px 0px 0px 0px` });
  if (first) vo.observe(first.querySelector(".tlf-h"));
  TLFIO = [so, yo, vo];
}

// Search: renders every page offscreen, splits it into cards and list items, and matches typed words (accents and typos forgiven).
const SRCH_SKIP = new Set(["trivia","guess","hunt","recap","board","haggle","speak","games","map","now"]);
const SRCH_NAME_DAY = k => { const d = T.days.find(x=>x.date===k.slice(4)); return d ? fmt(d.date) + " · " + d.title : "Plan"; };
const SRCH_NAME = {today:"Today",plan:"Plan",stays:"Stays",explore:"Explore",info:"Info",bookings:"Bookings",facts:"Did you know?",timeline:"Timeline",gifts:"Shopping",food:"Food",eat:"Eat list",listen:"Listen",places:"Places",say:"Say it"};
const srNorm = t => (t||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/gi,"d").toLowerCase().replace(/[-'’`]/g,"");
const SRCH_SEL = ".card, details, .fstop, .bcard, li, .xt, article p, article h2, article h3, tr";
function srText(el){ const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), out = []; let n; while ((n = w.nextNode())) if (!n.parentElement.closest("button")) out.push(n.data); return out.join(" ").replace(/\s+/g," ").replace(/ ↗/g,"").replace(/\s+([.,:;!?)])/g,"$1").trim(); }
function srUnits(root){ const all = [...root.querySelectorAll(SRCH_SEL)]; return all.filter(el=>!el.querySelector(SRCH_SEL)); }
let SRCH_IX = null;
function srPageKey(h){ if (h.startsWith("day-")) return STREET() ? h : null; if (h.startsWith("stay-")) return null; return h; }
function srRender(key, st){
  const save = {SVC, TLC}; try { if (st) { if ("SVC" in st) SVC = st.SVC; if ("TLC" in st) TLC = st.TLC; }
    return key.startsWith("day-") ? dayPage(key.slice(4)) : key.startsWith("story-") ? views.story(key.slice(6)) : key.startsWith("guide-") ? views.guide(key.slice(6)) : views[key] ? views[key]() : "";
  } catch(e){ return ""; } finally { SVC = save.SVC; TLC = save.TLC; }
}
function srBuild(){
  const ix = [], seen = new Set(), queue = ["today","plan","stays","explore","info"].map(k=>[k,null]);
  const tpl = document.createElement("template");
  while (queue.length){
    const [key, st] = queue.shift(), id = key + JSON.stringify(st||{}); if (seen.has(id)) continue; seen.add(id);
    tpl.innerHTML = srRender(key, st); const root = tpl.content;
    root.querySelectorAll('a[href^="#"]').forEach(a=>{ const h = srPageKey(a.getAttribute("href").slice(1)); if (h && !SRCH_SKIP.has(h) && (views[h] || /^(story|guide|day)-/.test(h))) queue.push([h,null]); });
    if (key === "gifts" && !st) [...Object.keys(MOg().souvenirs||{}),"tailor","gear","active"].forEach(v=>queue.push(["gifts",{SVC:v}]));
    if (key === "timeline" && !st) ["all", ...Object.keys(FX().cityTimeline||{})].forEach(v=>queue.push(["timeline",{TLC:v}]));
    if ((key === "gifts" || key === "timeline") && !st) continue;
    const title = key.startsWith("day-") ? SRCH_NAME_DAY(key) : SRCH_NAME[key] || (root.querySelector("h1, h2")||{}).textContent || key;
    let last = "";
    srUnits(root).forEach((el,i)=>{
      const txt = srText(el); if (txt.length < 3) return;
      const sm = el.closest("details")?.querySelector("summary"); let h = sm && srText(sm); let p = el; 
      while (!h && p && p !== root){ let q = p.previousElementSibling; while (q && !/^H[23]$/.test(q.tagName)) q = q.previousElementSibling; if (q) h = q.textContent; p = p.parentElement; }
      const sub = st?.SVC ? ({tailor:"Tailors",gear:"Outdoor gear",active:"Athletic & bags"}[st.SVC] || CITYV[st.SVC] || "") : st?.TLC ? (st.TLC==="all" ? "Vietnam" : CITYV[st.TLC] || "") : "";
      ix.push({key, st, i, txt, n: srNorm(txt), where: [title.trim(), sub, (h||"").replace(/\s+/g," ").trim()].filter((x,j,a)=>x && a.indexOf(x)===j).join(" · ")});
    });
  }

// Full-screen city story (tap a city circle on Plan a second time): photo slides, tap to advance.
let CS = null;
function csOpen(slides, col){
  CS = { i: 0, n: slides.length, t: null };
  const el = document.createElement("div"); el.className = "cstory"; el.id = "cstory"; el.style.setProperty("--city", col);
  el.innerHTML = `<div class="csbars">${slides.map(() => `<i><b></b></i>`).join("")}</div><button type="button" class="csx" data-csclose aria-label="Close">✕</button>${slides.join("")}<button type="button" class="csprev" aria-label="Previous"></button><button type="button" class="csnext" aria-label="Next"></button>`;
  document.body.appendChild(el); hydrate(el); document.documentElement.style.overflow = "hidden"; csShow(0);
}
function csShow(i){
  const el = document.getElementById("cstory"); if (!el) return; if (i >= CS.n) return csClose(); CS.i = Math.max(0, i);
  el.querySelectorAll(".csl").forEach((s, k) => s.classList.toggle("on", k === CS.i));
  el.querySelectorAll(".csbars i").forEach((b, k) => { b.className = k < CS.i ? "done" : k === CS.i ? "run" : ""; });
  clearTimeout(CS.t); CS.t = setTimeout(() => csShow(CS.i + 1), 6000);
}
function csClose(){ const el = document.getElementById("cstory"); if (CS) clearTimeout(CS.t); if (el) el.remove(); document.documentElement.style.overflow = ""; }
document.addEventListener("click", e => {
  if (!document.getElementById("cstory")) return;
  if (e.target.closest("[data-csclose]")) { csClose(); return; }
  if (e.target.closest(".csnext")) csShow(CS.i + 1); else if (e.target.closest(".csprev")) csShow(CS.i - 1);
});
addEventListener("keydown", e => { if (e.key === "Escape") csClose(); });

// Ticket wallet: boarding passes, tickets and booking codes saved on this phone (photos in IndexedDB), works offline.
const WKIND = { flight: ["Flight", "plane", "#1f4e9a"], stay: ["Stay", "key", "#2a7148"], ticket: ["Ticket", "tag", "#c62a2a"], food: ["Table", "bowl", "#8a5a00"], other: ["Other", "wallet", "#4c4330"], car: ["Car", "car", "#0f7471"] };
const wallet = () => local.get("wallet", []);
const WURL = {};
async function walletPics(root){
  for (const el of (root || document).querySelectorAll("[data-wimg]:not([data-done])")) { el.dataset.done = 1; const id = el.dataset.wimg;
    if (!WURL[id]) { const b = await IDB.get("w-" + id); if (b) WURL[id] = URL.createObjectURL(b); }
    if (WURL[id]) { if (el.tagName === "IMG") el.src = WURL[id]; else el.style.backgroundImage = `url(${WURL[id]})`; } else el.remove(); }
}
function walletCard(w, iso){
  const k = WKIND[w.kind] || WKIND.other, x = w.date ? parse(w.date) : null;
  return `<button type="button" class="wpass${w.date === iso ? " today" : ""}${w.date && w.date < iso ? " old" : ""}" data-wopen="${w.id}" style="--wk:${k[2]}">
    <span class="wtop">${icon(k[1])}<small>${k[0]}${x ? ` · ${DOW[x.getDay()]} ${x.getDate()} ${MON[x.getMonth()]}` : ""}</small>${w.date === iso ? `<em>Today</em>` : ""}</span>
    <b>${esc(w.title)}</b>${w.code ? `<span class="wcode"><small>Code</small>${esc(w.code)}</span>` : ""}${w.pic ? `<span class="wthumb" data-wimg="${w.id}"></span>` : ""}</button>`;
}
function walletForm(pre){
  const p = pre || {};
  openSheet(`<div class="sname">${p.bk ? "Add boarding pass or QR" : "Add a pass"}</div><form class="wform" id="wform">
    <label class="wfile">${icon("tag")}<span data-wfname>Add a screenshot of the boarding pass, QR code or ticket</span><input name="pic" type="file" accept="image/*"></label>
    <label>Name<input name="title" required placeholder="e.g. VN 125 to Đà Nẵng" value="${esc(p.title || "")}"></label>
    ${p.bk ? `<input type="hidden" name="kind" value="${esc(p.kind || "ticket")}"><input type="hidden" name="date" value="${esc(p.date || "")}">` : `<div class="wkinds">${Object.entries(WKIND).map(([k, v]) => `<label><input type="radio" name="kind" value="${k}"${(p.kind || "ticket") === k ? " checked" : ""}><span>${icon(v[1])}${v[0]}</span></label>`).join("")}</div>
    <label>Date<input name="date" type="date" min="2026-12-01" max="2026-12-31" value="${esc(p.date || "")}"></label>`}
    <label>Confirmation code or seat<input name="code" placeholder="e.g. 7K4QXM · seat 12A" autocapitalize="characters" autocorrect="off" spellcheck="false"></label>
    <input type="hidden" name="bk" value="${esc(p.bk || "")}"><p class="small muted" style="margin:0">Saved only on this phone. Keep the screenshot in Photos too.</p><button class="btn solid" type="submit">Save</button></form>`);
}
document.addEventListener("click", async e => {
  if (e.target.closest("[data-wadd]")) return walletForm();
  const q = e.target.closest("[data-wquick]"); if (q) { const [date, title] = q.dataset.wquick.split("|"); return walletForm({ date, title, kind: "flight" }); }
  const o = e.target.closest("[data-wopen]"); if (o) {
    const w = wallet().find(x => x.id === o.dataset.wopen); if (!w) return; const k = WKIND[w.kind] || WKIND.other;
    openSheet(`<div class="wfull" style="--wk:${k[2]}"><small>${k[0]}${w.date ? " · " + esc(fmt(w.date)) : ""}</small><div class="sname">${esc(w.title)}</div>${w.code ? `<div class="wbig">${esc(w.code)}</div>` : ""}${w.pic ? `<img class="wimg" data-wimg="${w.id}" alt="${esc(w.title)}">` : ""}
      <p class="small muted">Turn your screen brightness up for scanners.</p><div class="btns"><button type="button" class="btn" data-wdel="${w.id}">Remove</button></div></div>`);
    walletPics(document.querySelector(".sheet")); return; }
  const d = e.target.closest("[data-wdel]"); if (d) { if (!confirm("Remove this from the wallet?")) return; const id = d.dataset.wdel; local.set("wallet", wallet().filter(x => x.id !== id)); await IDB.del("w-" + id); closeSheet(); render("plan", null, "bookings"); }
});
document.addEventListener("submit", async e => {
  const f = e.target.closest("#wform"); if (!f) return; e.preventDefault();
  const fd = new FormData(f), id = "w" + Date.now().toString(36), file = fd.get("pic");
  const w = { id, title: String(fd.get("title") || "").trim(), kind: fd.get("kind") || "other", date: fd.get("date") || "", code: String(fd.get("code") || "").trim(), pic: !!(file && file.size), bk: String(fd.get("bk") || "") };
  const btn = f.querySelector('button[type="submit"]'), err = m => { f.querySelector(".werr")?.remove(); btn.insertAdjacentHTML("beforebegin", `<p class="werr su-err" role="alert">${esc(m)}</p>`); };
  if (!w.title) { const t = f.querySelector('[name="title"]'); t.value = ""; t.setAttribute("aria-invalid", "true"); t.focus(); return err("Give it a name, like the flight number."); }
  if (f.dataset.busy) return; f.dataset.busy = "1"; btn.disabled = true; btn.textContent = "Saving…";
  try {
    if (w.pic) await IDB.put("w-" + id, file);
    local.set("wallet", wallet().concat(w));
    if (!wallet().some(x => x.id === id)) throw new Error("not stored");
  } catch (x) { delete f.dataset.busy; btn.disabled = false; btn.textContent = "Try again"; return err("Couldn't save on this phone (storage may be full or in private browsing). Try again, and keep the screenshot in Photos too."); }
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (x) {} closeSheet(); toast(w.bk ? "Saved to this booking" : "Saved"); if (w.bk) { render("bookings"); bkSheet(w.bk); } else render("plan", null, "bookings");
});
function walletToday(iso){
  const W = wallet().filter(w => w.date === iso); if (!W.length) return "";
  setTimeout(() => walletPics(), 0);
  return `<h3>Tickets for today</h3><div class="wlist">${W.map(w => walletCard(w, iso)).join("")}</div>`;

    sl("#2a7148", "Scavenger hunt", `${found} found`, hg ? `Best haggle: ${hg}% off.` : "Photos saved on your phone."),
    S.length > 1 ? sl("#8a5a00", "Trivia brain", esc(tw.n), `${tw.trivia} right answers.`) : "",
    S.length > 1 ? sl("#7a1a10", "Biggest appetite", esc(fd.n), `${fd.bingo} dishes tried.`) : "",
    `<div class="csl fact wr" style="--city:#f2c94c"><div class="cst"><small>${S.length > 1 ? "And the champion is" : "Your points"}</small><b>${S.length > 1 ? esc(champ.n) : me.total}</b><p class="big">${S.length > 1 ? `${champ.total} points. You finished with ${me.total}.` : "Share your scores to see the group's."}</p><a class="csgo" href="#recap" data-csclose>Open the finale board ›</a></div></div>`

// Bookings: tap any flight, car or reservation for its details and the passes attached to it (QR, boarding pass, code).
const MONI = { Jan:0, Feb:1, Mar:2, Apr:3, May:4, Jun:5, Jul:6, Aug:7, Sep:8, Oct:9, Nov:10, Dec:11 };
function bkItem(key){
  if (key[0] === "m") { const L = personalLegs().filter(l => l.dir === key.slice(2)); if (!L.length) return null;
    const x = { route: `${L[0].from} → ${L[L.length - 1].to}`, when: `${fmt(L[0].dep.slice(0, 10))} · ${t12(L[0].dep)}`, status: "booked", legs: L.map(l => l.no), ref: (L.find(l => l.ref) || {}).ref || "", mine: 1 };
    return { key, x, kind: "flight", title: x.route, when: x.when, date: L[0].dep.slice(0, 10), status: "booked", lines: [] }; }
  const [t, i] = key.split(":"), x = (t === "f" ? T.flights : t === "t" ? T.transfers : T.reservations)[+i]; if (!x) return null;
  const when = x.when || "", m = when.match(/\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\w*\s+(\d{1,2})/);
  const date = x.date || (m ? `2026-${String(MONI[m[1]] + 1).padStart(2, "0")}-${m[2].padStart(2, "0")}` : "");
  return { key, x, kind: t === "f" ? "flight" : t === "t" ? "car" : /dinner|lunch|table|restaurant|tasting|bar/i.test(x.what || "") ? "food" : "ticket",
    title: x.route || x.what || "", when, date, status: x.status, lines: [x.detail, x.note].filter(Boolean).join(" · ").split(/\s·\s|\.\s+(?=[A-Z])/).map(s => s.trim()).filter(Boolean) };
}
const bkPasses = key => wallet().filter(w => w.bk === key);
function bkTag(key){ const n = bkPasses(key).length; return `<span class="bktag">${n ? `${icon("tag")}${n} pass${n > 1 ? "es" : ""} saved` : "Details & passes"} ›</span>`; }
function bkOther(){ const W = wallet().filter(w => !w.bk); setTimeout(() => walletPics(), 0);
  return `<h2>Other passes</h2><p class="small muted" style="margin:0 0 10px">Tickets, QR codes and codes that aren't tied to a booking above. Saved only on this phone, shown offline.</p><button type="button" class="btn solid wadd" data-wadd>${icon("tag")}Add a ticket or pass</button>${W.length ? `<div class="wlist">${W.map(w => walletCard(w, todayIso())).join("")}</div>` : ""}`; }
const tName = t => /^\w$/.test(t) ? `Terminal ${t}` : `${t} terminal`;
// Which flight booking a piece of day text or a leg belongs to ("f:i"), so it can open the boarding-pass sheet.
function bkFlightKey(date, text, legNo){
  const F = T.flights || [], txt = text || "";
  let i = F.findIndex(f => (f.legs || []).some(n => n === legNo || (/\d/.test(n) && txt.replace(/\s/g, "").includes(n.replace(/\s/g, "")))));
  if (i < 0 && (legNo || /flight|airlines|qatar|united|✈|land at|lands|fly /i.test(txt))) i = F.findIndex(f => f.date === date || (f.legs || []).some(n => { const l = (MOg().legs || []).find(x => x.no === n); return l && (l.dep.slice(0, 10) === date || (l.arr || "").slice(0, 10) === date); }));
  return i < 0 || (F[i].pb && !PB()) ? "" : "f:" + i;
}
document.addEventListener("click", e => { const b = e.target.closest("[data-bkopen]"); if (!b) return; e.preventDefault(); e.stopPropagation(); bkSheet(b.dataset.bkopen);
  const n = b.dataset.bkleg, el = n && document.querySelector(`.sheet .bkl[data-no="${CSS.escape(n)}"]`); if (el) setTimeout(() => el.scrollIntoView({ block: "center", behavior: "smooth" }), 120); }, true);
const legIn = t => ((MOg().legs || []).find(l => /\d/.test(l.no) && (t || "").replace(/\s/g, "").includes(l.no.replace(/\s/g, ""))) || {}).no || "";
const t12 = iso => { if (!iso) return "—"; let h = +iso.slice(11, 13); const m = iso.slice(14, 16), ap = h < 12 ? "AM" : "PM"; h = h % 12 || 12; return `${h}:${m} ${ap}`; };
const dur = ms => { const m = Math.round(ms / 60000); return `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, "0")}m`; };
function seatList(s){ return (s || "").split("·").map(x => x.trim()).filter(Boolean).map(x => { const m = x.match(/^(\S+)\s+(\S+)$/); return m ? [m[1], m[2]] : ["", x]; }); }
function legCard(l){
  const sl = seatList(l.seats), wk = l.dep && fmt(l.dep.slice(0, 10)), ak = l.arr && fmt(l.arr.slice(0, 10)), d = l.arr ? dur(new Date(l.arr) - new Date(l.dep)) : "";
  return `<div class="bkl" data-no="${esc(l.no)}"><div class="bklh"><b>${esc(l.no)}</b><span>${esc(l.by.replace(/\s*\(not booked yet\)/, ""))}</span></div>
    <div class="bklr"><div><big>${esc(l.from)}</big><small>${esc(l.fromName)}</small><em>${t12(l.dep)}</em><small>${wk || ""}</small></div>
    <div class="bkld">${icon("plane")}${d ? `<small>${d}</small>` : ""}</div>
    <div class="r"><big>${esc(l.to)}</big><small>${esc(l.toName)}${l.toT ? ` · ${esc(tName(l.toT))}` : ""}</small><em>${l.arr ? t12(l.arr) : "—"}</em><small>${ak || ""}</small></div></div>
    ${/\d/.test(l.no) ? `<div class="bklt"><span>${l.fromT ? esc(tName(l.fromT)) : esc(l.from)}${l.gate ? ` · <b>Gate ${esc(l.gate)}</b>` : ` · Gate on the day`}</span><a href="https://www.google.com/search?q=${encodeURIComponent(l.no.replace(/\s/, "") + " flight status " + (l.dep || "").slice(0, 10))}" target="_blank" rel="noopener">Live status ›</a><a class="fty" href="flighty://" aria-label="Open Flighty">Flighty ›</a></div>` : ""}
    <div class="bkls"><span>Seat${sl.length > 1 ? "s" : ""}</span>${sl.length ? sl.map(([n, x]) => `<b>${n ? `<i>${esc(n)}</i>` : ""}${esc(x)}</b>`).join("") : `<b class="no">Not picked</b>`}</div></div>`;
}
function bkFields(b){
  const x = b.x, F = [];
  if (b.kind === "flight") {
    if (x.cabin) F.push(["Cabin", x.cabin]); if (x.bags) F.push(["Checked bags", x.bags]); if (x.carry) F.push(["Carry-on", x.carry]);
    (x.tickets || []).forEach(([n, t]) => F.push([`E-ticket · ${n}`, t, "mono"]));
  } else {
    F.push(["When", b.when]);
    const txt = [x.what, x.note].filter(Boolean).join(" · "), price = txt.match(/~?\$[\d,]+(?:[–-]\$?[\d,]+)?(?:\s*pp)?/), about = txt.match(/about (\d+(?:\.\d+)? (?:hrs?|min))/i), tel = txt.match(/\+\d[\d ]{7,}\d/);
    if (about) F.push(["Takes", about[1]]); if (price) F.push(["Price", price[0]]);
    if (tel) F.push(["Book by phone", `<a href="tel:${tel[0].replace(/\s/g, "")}">${esc(tel[0])}</a>`, "html"]);
    if (x.note) F.push(["Notes", x.note.replace(/Call \+\d[\d ]+\d( or )?/i, "").replace(/^\w/, c => c.toUpperCase()), "wide"]);
  }
  return F.length ? `<dl class="bkf">${F.map(([k, v, t]) => `<div class="${t === "wide" ? "w" : ""}"><dt>${esc(k)}</dt><dd class="${t === "mono" ? "mono" : ""}">${t === "html" ? v : esc(v)}</dd></div>`).join("")}</dl>` : "";
}
function bkSheet(key){
  const b = bkItem(key); if (!b) return; const P = bkPasses(key), k = WKIND[b.kind] || WKIND.other, x = b.x;
  const guide = b.kind === "flight" && (T.airports || []).find(a => (!a.pb || PB()) && b.date && a.when.includes(fmt(b.date)));
  const pool = x.mine ? personalLegs().filter(l => l.dir === key.slice(2)) : (MOg().legs || []), L = (x.legs || []).map(n => pool.find(l => l.no === n)).filter(Boolean);
  let legsHtml = "";
  L.forEach((l, i) => { if (i) { const p = L[i - 1]; legsHtml += `<div class="bklc">${p.arr ? dur(new Date(l.dep) - new Date(p.arr)) + " " : ""}layover in ${esc(p.toName)}</div>`; } legsHtml += legCard(l); });
  const title = b.kind === "flight" ? b.title : b.title.replace(/\s*\(~?\$[^)]*\)/, "");
  const lines = L.length ? [] : b.kind === "flight" ? b.lines : [];
  openSheet(`<div class="bkd" style="--wk:${k[2]}"><small>${icon(k[1])}${k[0]} · ${esc(b.when)}</small><div class="sname">${esc(title)}</div>${chip(b.status)}
    ${x.ref ? `<div class="bkref"><small>Booking reference</small><b>${esc(x.ref)}</b><button type="button" class="linkbtn" data-copy="${esc(x.ref)}">Copy</button></div>` : ""}
    ${legsHtml ? `<div class="bkl-wrap">${legsHtml}</div>` : ""}
    ${bkFields(b)}
    ${lines.length ? `<ul class="bklines">${lines.map(l => `<li>${esc(l)}</li>`).join("")}</ul>` : ""}
    <h4>Boarding passes, tickets &amp; QR codes</h4>
    ${P.length ? P.map(w => `<div class="bkpass">${w.code ? `<div class="wbig">${esc(w.code)}</div>` : ""}${w.pic ? `<img class="wimg" data-wimg="${w.id}" alt="Saved pass for ${esc(b.title)}">` : ""}<div class="bkpm"><span>${esc(w.title)}</span><button type="button" class="linkbtn" data-wdel="${w.id}">Remove</button></div></div>`).join("") : `<p class="small muted">Nothing saved yet. Add a screenshot of the ${b.kind === "flight" ? "boarding pass" : "ticket or confirmation"}, so it opens even with no signal.</p>`}
    <button type="button" class="btn solid wadd" data-bkadd="${key}">${icon("tag")}${P.length ? "Add another" : b.kind === "flight" ? "Add boarding pass" : "Add ticket or confirmation"}</button>
    ${guide ? `<details class="bkguide"><summary>${icon("plane")}${esc(guide.title)}</summary><ol class="steps">${guide.steps.map(x => `<li>${esc(x)}</li>`).join("")}</ol></details>` : ""}
    ${x.mine ? `<button type="button" class="btn su-wide" data-susetup style="margin-top:10px">Edit my flights</button>` : ""}${b.kind === "flight" ? `<p class="small muted" style="margin-top:12px">Turn your screen brightness up for scanners.</p>` : ""}</div>`);
  walletPics(document.querySelector(".sheet"));

// Bookings grouped by city, in trip order.
const BKAREA = [["out", "Flying out", "#1f4e9a", "Sarasota → Tokyo → Sài Gòn"], ["hcmc", "Sài Gòn", "#c4561a", "Dec 6–7"], ["hoian", "Hội An & Đà Nẵng", "#c62a2a", "Dec 7–9"], ["hanoi", "Hà Nội", "#2a7148", "Dec 9–13"], ["blr", "Bangalore", "#7a4bb0", "Dec 13–22"], ["kmc", "Karamchedu", "#8a5a00", "Dec 22–24"], ["hyd", "Hyderabad & home", "#4c4330", "Dec 24–27"]];
function bkRow(key){

// Online check-in countdown on the first pass of each journey: shows 3 days before it opens, until 1 h before take-off.
function ckinWin(l){
  const L = myLegs(), i = L.findIndex(x => x.no === l.no && x.dep === l.dep), prev = L[i - 1];
  if (prev && Date.parse(l.dep) - Date.parse(prev.arr || prev.dep) < 12 * 36e5) return null; // a connection: checked in with the first leg
  const q = /qatar/i.test(l.by) || /^QR/.test(l.no), dep = Date.parse(l.dep), open = dep - (q ? 48 : 24) * 36e5, n = flNow(l);
  if (n < open - 3 * 864e5 || n > dep - 36e5) return null;
  const url = /^UA/.test(l.no) || /united/i.test(l.by) ? "https://www.united.com/en/us/checkin" : q ? "https://www.qatarairways.com" : /^VN/.test(l.no) || /vietnam airlines/i.test(l.by) ? "https://www.vietnamairlines.com" : "";

}

// Encrypted build: the trip data is locked with a shared trip passcode, entered once per phone.
async function unlock(pass, enc){
  const b = s => Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b(enc.salt), iterations:150000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b(enc.iv)}, key, b(enc.ct));
  if (enc.z) return JSON.parse(await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"))).text());
  return JSON.parse(new TextDecoder().decode(pt));
}

}
