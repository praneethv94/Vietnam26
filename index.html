function setupStart(name){ SU = { step: name ? 2 : 1, name: name || ME() || "", legs: myF().map(l => ({ ...l, dd: l.dep.slice(0, 10), dt: l.dep.slice(11, 16), ad: (l.arr || "").slice(0, 10), at: (l.arr || "").slice(11, 16) })) }; setupRender(); }
function suHead(n, title, sub){ return `<div class="su-top"><span class="brand">Vietnam<span>’26</span></span></div><div class="su"><div class="su-step">Step ${n} of 4</div><div class="su-dots">${[1,2,3,4].map(i => `<b${i <= n ? ' class="on"' : ""}></b>`).join("")}</div><h1>${title}</h1>${sub ? `<p>${sub}</p>` : ""}`; }
function legForm(l, i){
  return `<div class="su-leg" data-li="${i}"><div class="su-lh"><b>${l.dir === "in" ? "To Vietnam" : "Going home"}${l.nth ? " · connection" : ""}</b><button type="button" class="linkbtn" data-sudel="${i}">Remove</button></div>
    <div class="su-two"><label>Flight<input data-f="no" value="${esc(l.no || "")}" placeholder="e.g. VN 99" autocapitalize="characters"></label><label>Booking ref<input data-f="ref" value="${esc(l.ref || "")}" placeholder="optional" autocapitalize="characters"></label></div>
    <div class="su-two"><label>From<input data-f="from" value="${esc(l.from || "")}" placeholder="SFO" maxlength="3" autocapitalize="characters"></label><label>To<input data-f="to" value="${esc(l.to || "")}" placeholder="SGN" maxlength="3" autocapitalize="characters"></label></div>
    <div class="su-two"><label>Departs<input data-f="dd" type="date" value="${esc(l.dd || "")}"><input data-f="dt" type="time" value="${esc(l.dt || "")}"></label><label>Lands (local time)<input data-f="ad" type="date" value="${esc(l.ad || "")}"><input data-f="at" type="time" value="${esc(l.at || "")}"></label></div></div>`;
}
function setupRender(){

  if (s.step === 1) { v.innerHTML = `${suHead(1, "Xin chào! Who's this?", "Pick your name. The app sets itself up around your flights and days.")}
    <div class="su-who">${people.map(p => `<button type="button" data-suwho="${esc(p.name)}" class="${s.name === p.name ? "on" : ""}"><b>${esc(p.name)}</b><small>${["Praneeth","Bindu"].includes(p.name) ? "Vietnam + India" : "Vietnam"}</small></button>`).join("")}</div></div>`; return; }
  if (s.step === 2) { const dir = s.dir || "in", L = s.legs.map((l, i) => [l, i]).filter(([l]) => l.dir === dir);
    v.innerHTML = `${suHead(2, dir === "in" ? "Your flight to Vietnam" : "Your flight home", "Fastest: open your confirmation screenshot, press and hold the text, tap Select All, then Copy, and paste it here.")}
      <textarea class="su-paste" id="supaste" placeholder="Paste your confirmation here" rows="3"></textarea><button type="button" class="btn solid su-wide" data-suparse>Fill in from what I pasted</button>
      <div class="su-or">or type it</div>${L.map(([l, i]) => legForm(l, i)).join("") || ""}
      <button type="button" class="btn su-wide" data-suadd="${dir}">${L.length ? "+ Add a connecting flight" : "+ Add a flight"}</button>
      <button type="button" class="btn solid su-wide su-next" data-sunext>${dir === "in" ? "Next: flight home" : "Next: check it"}</button>
      <button type="button" class="su-skip" data-suskip>${dir === "in" ? "Not booked yet? Skip, add it later" : "Skip the flight home for now"}</button></div>`; return; }
  if (s.step === 3) { const L = s.legs.map(suToLeg).filter(Boolean), pb = pbLand(), inn = L.filter(l => l.dir === "in").pop();
    let note = ""; if (inn && inn.arr && pb) { const h = Math.round((Date.parse(inn.arr) - Date.parse(pb.arr)) / 36e5); note = h === 0 ? "You land around the same time as Praneeth and Bindu." : `You land ${Math.abs(h)} hour${Math.abs(h) === 1 ? "" : "s"} ${h > 0 ? "after" : "before"} Praneeth and Bindu.`; }
    v.innerHTML = `${suHead(3, "Looks right?", "")}${L.length ? L.map(l => `<div class="su-chk">${legCard(l)}</div>`).join("") : `<p class="muted">No flights added yet. You can add them any time from Bookings.</p>`}
      ${note ? `<div class="su-note">${esc(note)} The app shows you the way to the Airbnb and shares your landing time with the group.</div>` : ""}
      <button type="button" class="btn solid su-wide" data-susave>Looks good</button><button type="button" class="su-skip" data-suback>Go back and fix</button></div>`; return; }
  const w = myWindow(), nd = w.from && w.to ? Math.round((parse(w.to) - parse(w.from)) / 864e5) + 1 : 0;
  v.innerHTML = `${suHead(4, `You're set, ${esc(s.name)}`, "Here's what the app did for you:")}
    <div class="su-ok"><i>✓</i><span><b>${nd ? `Your ${nd} days` : "Your days"}</b>${w.from ? `Plan shows you from ${fmt(w.from)}${w.to ? ` to ${fmt(w.to)}` : ""}. Days you're not there are greyed out.` : "Add your flights any time and Plan will fit your dates."}</span></div>
    <div class="su-ok"><i>✓</i><span><b>Boarding passes</b>Your flights are in Bookings. Tap one to add the boarding pass.</span></div>
    <div class="su-ok"><i>✓</i><span><b>Arrival plan</b>On your landing day, Today shows how to get to the Airbnb, with the address to show the driver.</span></div>
    <div class="su-ok"><i>✓</i><span><b>Shared with the group</b>Everyone sees when you land.</span></div>
    <button type="button" class="btn solid su-wide" data-ics>Add my reminders to Calendar</button><button type="button" class="btn su-wide" data-mapsave>Save maps for offline</button><p class="small muted" id="mapmsg" style="text-align:center;margin:0"></p>
    <button type="button" class="su-skip" data-sudone>Open the app</button><p class="small muted" style="text-align:center">Tip: in Safari, tap Share, then Add to Home Screen.</p></div>`;

function suRead(){ document.querySelectorAll(".su-leg").forEach(el => { const l = SU.legs[+el.dataset.li]; el.querySelectorAll("[data-f]").forEach(i => { l[i.dataset.f] = i.value.trim().toUpperCase().replace(/^(\d{4}-\d\d-\d\d|\d\d:\d\d)$/, x => x.toLowerCase()); }); }); }
function suToLeg(l){ if (!l.from || !l.to || !l.dd || !l.dt) return null;
  return { no: (l.no || "Flight").toUpperCase(), from: l.from.toUpperCase(), fromName: (APT[l.from.toUpperCase()] || [l.from])[0], to: l.to.toUpperCase(), toName: (APT[l.to.toUpperCase()] || [l.to])[0], dep: isoAt(l.dd, l.dt, l.from.toUpperCase()), arr: isoAt(l.ad || l.dd, l.at, l.to.toUpperCase()), by: "", seats: "", dir: l.dir, ref: l.ref || "", mine: true }; }
document.addEventListener("click", e => {
  if (!SU) return; const t = e.target;
  const w = t.closest("[data-suwho]"); if (w) { const n = w.dataset.suwho; store.set("trip-me", n); SU.name = n; if (["Praneeth","Bindu"].includes(n)) { SU = null; store.set("setup-done", "1"); launch(); return; } SU.step = 2; SU.dir = "in"; setupRender(); return; }
  if (t.closest("[data-suadd]")) { suRead(); const d = t.closest("[data-suadd]").dataset.suadd, prev = SU.legs.filter(l => l.dir === d).pop(); SU.legs.push({ dir: d, nth: !!prev, from: prev ? prev.to : (d === "out" ? "" : ""), to: d === "in" && !prev ? "SGN" : "", dd: prev ? prev.ad : "", ref: prev ? prev.ref : "" }); setupRender(); return; }
  const dl = t.closest("[data-sudel]"); if (dl) { suRead(); SU.legs.splice(+dl.dataset.sudel, 1); setupRender(); return; }
  if (t.closest("[data-suparse]")) { suRead(); const P = parseConf($("#supaste").value); if (!P.length) { toast("Couldn't find a flight in that text. Type it in below."); return; }
    const d = SU.dir || "in"; SU.legs = SU.legs.filter(l => l.dir !== d || l.no);
    // A paste can hold both directions: legs ending in Vietnam are "in", legs starting there are "out".
    P.forEach((p, i) => { const dir = VNA.includes(p.from) && !VNA.includes(p.to) ? "out" : VNA.includes(p.to) && !VNA.includes(p.from) ? "in" : d; SU.legs.push({ ...p, dir, nth: i > 0 }); });
    toast(`Found ${P.length} flight${P.length > 1 ? "s" : ""}. Check the details.`); setupRender(); return; }
  if (t.closest("[data-sunext]") || t.closest("[data-suskip]")) { suRead(); if (t.closest("[data-suskip]")) SU.legs = SU.legs.filter(l => l.dir !== (SU.dir || "in")); if ((SU.dir || "in") === "in") { SU.dir = "out"; } else SU.step = 3; setupRender(); return; }
  if (t.closest("[data-suback]")) { SU.step = 2; SU.dir = "in"; setupRender(); return; }
  if (t.closest("[data-susave]")) { const L = SU.legs.map(suToLeg).filter(Boolean); local.set("my-legs", L); store.set("setup-done", "1"); T = scoped(FULL); shareArrival(); SU.step = 4; setupRender(); return; }
  if (t.closest("[data-sudone]")) { SU = null; launch(); location.hash = "#today"; }
});
// Share landing and leaving times with the group (live database). Booking refs stay on the phone.
async function shareArrival(){
  const base = typeof liveBase === "function" && liveBase(); if (!base || !ME()) return;
  const L = personalLegs(), pick = l => l && { no: l.no, from: l.from, to: l.to, dep: l.dep, arr: l.arr };
  const body = { in: pick(L.filter(l => l.dir === "in").pop()) || null, out: pick(L.filter(l => l.dir === "out")[0]) || null, t: Date.now() };
  try { await fetch(`${base}/arrivals/${encodeURIComponent(ME())}.json`, { method: "PUT", body: JSON.stringify(body) }); } catch (e) {}
}
// Draw from what this phone already knows (instant), then refresh from the live database in the background.
function arrivalRows(A){
  const own = !PB() && personalLegs().filter(l => l.dir === "in").pop(); if (own && ME()) A = { ...A, [ME()]: { ...(A[ME()] || {}), in: own } };
  const pb = pbLand(), rows = [];
  if (pb) rows.push(["Praneeth & Bindu", pb]);
  ((FULL || T).travelers || []).filter(p => !["Praneeth","Bindu"].includes(p.name)).forEach(p => { const a = A[p.name]; rows.push([p.name, a && a.in]); });
  return rows.map(([n, l]) => `<div class="arr-r"><b>${esc(n)}</b>${l ? `<span>${esc(l.no)} · lands ${esc(l.to)} ${fmt(l.arr.slice(0, 10))}, ${t12(l.arr)}</span>` : `<span class="muted">Flight not added yet</span>`}</div>`).join("");
}
let ARR_T = 0;
async function fillArrivals(){
  const base = typeof liveBase === "function" && liveBase(); if (!base || Date.now() - ARR_T < 60000) return; ARR_T = Date.now();
  try { const r = await fetch(`${base}/arrivals.json`); if (!r.ok) return; const A = (await r.json()) || {};
    if (JSON.stringify(A) === JSON.stringify(local.get("arrivals-cache", {}))) return; local.set("arrivals-cache", A);
    const box = $("#arrivals"); if (box) box.innerHTML = arrivalRows(A); } catch (e) {}
}
const arrivalsBox = () => { setTimeout(fillArrivals, 0); return `<div class="card arrivals" id="arrivals">${arrivalRows(local.get("arrivals-cache", {}))}</div>`; };
function arrivalsCard(iso){ if (iso > "2026-12-07") return ""; return `<h3>Who lands when</h3>${arrivalsBox()}`; }
function arrivalPlan(iso){
  const l = personalLegs().find(x => x.dir === "in" && x.arr && x.arr.slice(0, 10) === iso && VNA.includes(x.to)); if (!l) return "";
  const st = (T.stays || []).find(s => s.start <= iso && s.end > iso) || (T.stays || []).find(s => s.start <= iso && s.end >= iso);
  const AC = { SGN: /Ho Chi Minh/, HAN: /Hanoi/, DAD: /Da Nang|Hoi An/ };
  if (st && AC[l.to] && !AC[l.to].test(st.city)) return `<h3>Your arrival</h3><div class="card arrplan"><b>You land at ${esc(l.toName)} (${esc(l.to)}) at ${t12(l.arr)}</b>
    <p style="margin:6px 0 10px">The group is in ${esc(st.city)} tonight, so you'll need a connection there. Message the group chat and we'll sort it out together.</p><a class="btn solid" href="#stay-${esc(st.id)}">Where we're staying ›</a></div>`;
  return `<h3>Your arrival</h3><div class="card arrplan"><b>You land at ${esc(l.toName)} (${esc(l.to)}) at ${t12(l.arr)}</b>
    <ol class="steps"><li>Immigration: passport and e-visa printout.</li><li>Get cash at an ATM in arrivals, and a SIM or eSIM if you need one.</li><li>Book a Grab to ${st ? esc(st.name) : "the group's stay"}</li></ol>
    ${st ? `<a class="btn solid" href="#stay-${esc(st.id)}">Address to show the driver ›</a>` : ""}</div>`;
}
// Banner on Today for people who haven't added their flights yet.
function setupNudge(){ if (PB() || personalLegs().length || store.get("nudge-off")) return ""; return `<div class="card su-nudge"><b>Add your flights (1 minute)</b><span>The app will fit your days, show your arrival plan and tell the group when you land.</span><div class="btns"><button type="button" class="btn solid" data-susetup>Add my flights</button><button type="button" class="btn" data-sunudgeoff>Later</button></div></div>`; }
document.addEventListener("click", e => { if (e.target.closest("[data-susetup]")) { setupStart(ME()); } if (e.target.closest("[data-sunudgeoff]")) { store.set("nudge-off", "1"); e.target.closest(".su-nudge").remove(); } });

// Your flights at the top of Bookings (for anyone not on Praneeth and Bindu's tickets).

function arrivalsBk(){ return `<h2>Who lands when</h2>${arrivalsBox()}`; }
// Grey out the days this person isn't in Vietnam.
function markAway(){

  document.querySelectorAll(".pday[id^='pd-']").forEach(el => { const d = el.id.slice(3), pre = w.from && d < w.from, post = w.to && d > w.to; if (!pre && !post) return;

// Older versions saved flights as "my-flights"; move them over once.
(function(){ const old = local.get("my-flights", null); if (!Array.isArray(old) || !old.length || local.get("my-legs", null)) return;
  local.set("my-legs", old.filter(f => f.date).map(f => ({ no: f.no || "Flight", from: (f.from || "").toUpperCase().slice(0, 3), to: (f.to || "").toUpperCase().slice(0, 3), dep: isoAt(f.date, f.time || "12:00", (f.from || "").toUpperCase().slice(0, 3)), arr: "", dir: "in", mine: true }))); })();

// ===== Stays: nights strip, full-photo stay cards, detail page =====
const STAYCITY = s => /Ho Chi/.test(s.city) ? "hcmc" : /Hoi/.test(s.city) ? "hoian" : /Da Nang/.test(s.city) ? "danang" : /Hanoi/.test(s.city) ? "hanoi" : "india";

const stayCol = s => STAYCITY(s) === "india" ? "#7a4bb0" : cityCol(STAYCITY(s));
const nightsOf = s => Math.round((parse(s.end) - parse(s.start)) / 864e5);
const VNStay = s => STAYCITY(s) !== "india";
function stayCancel(s){ // free-cancellation deadline as a date, from "Free cancellation before 3 PM Dec 4."
  const m = (s.cancel || "").match(/Free cancellation before ([\d:]+\s*[AP]M) (\w{3}) (\d{1,2})/i); if (!m) return null;
  const iso = `2026-${String(MONI[m[2]] + 1).padStart(2, "0")}-${m[3].padStart(2, "0")}`; return { iso, time: m[1], left: Math.round((parse(iso) - parse(todayIso())) / 864e5) }; }
const inDays = n => n === 0 ? "today" : n === 1 ? "tomorrow" : `in ${n} days`;
function stayStatusLine(s){
  if (s.status === "todo") return [`Not booked · ${nightsOf(s)} night${nightsOf(s) > 1 ? "s" : ""} to book`, "bad"];
  if (s.status === "maybe") return ["Not decided yet", "warn"];
  const iso = todayIso(), c = stayCancel(s);
  if (iso >= s.start && iso < s.end) return ["You're staying here tonight", "ok"];
  if (iso >= s.end) return ["Stayed", ""];
  if (c && c.left >= 0) return [`Free cancellation ends ${inDays(c.left)} (${fmt(c.iso)})`, c.left <= 7 ? "warn" : ""];
  const n = Math.round((parse(s.start) - parse(iso)) / 864e5); return [`Check-in ${inDays(n)}`, ""];
}
function nightsStrip(){
  const S = T.stays.filter(VNStay), first = "2026-12-05", last = "2026-12-13", iso = todayIso(), cells = [];
  for (let d = parse(first); d < parse(last); d.setDate(d.getDate() + 1)) { const k = isoOf(d), on = S.filter(s => s.start <= k && s.end > k);
    const st = on.find(s => s.status === "booked") || on[0], bad = !on.length || on.every(s => s.status === "todo"), two = on.length > 1;
    cells.push(`<a class="nsc${bad ? " bad" : ""}${two ? " two" : ""}${k === iso ? " now" : ""}" href="${st ? "#stay-" + st.id : "#stays"}" style="--city:${st ? stayCol(st) : "#c62a2a"}"><small>${DOW[d.getDay()]}</small><b>${d.getDate()}</b><i></i>${two ? `<em>2</em>` : ""}</a>`); }
  const gaps = cells.filter(c => c.includes(" bad")).length, dup = cells.filter(c => c.includes(" two")).length;
  const legend = [gaps && `<span class="nl bad">${gaps} night${gaps > 1 ? "s" : ""} not booked</span>`, dup && `<span class="nl two">${dup} night booked twice</span>`].filter(Boolean).join("");
  return `<div class="nstrip"><div class="nsh"><b>Your nights in Vietnam</b><span>Dec 5 – 13</span></div><div class="nscs">${cells.join("")}</div>${legend ? `<div class="nsl">${legend}</div>` : ""}</div>`;
}
function stayCardC(s){

  return `<a class="stc" href="#stay-${esc(s.id)}" style="--city:${stayCol(s)}"><div class="stc-ph"><div class="ph" data-lead="${esc(STAYPH[s.id] || s.photo || s.city)}"></div></div>
    <div class="stc-in"><span class="sign stc-sign" style="--city:${stayCol(s)}"><span>${esc(s.city.replace("Ho Chi Minh City", "Sài Gòn").replace("Hanoi", "Hà Nội").replace("Hoi An", "Hội An").replace("Da Nang", "Đà Nẵng"))}</span></span>
      <b class="stc-n">${esc(s.name.replace(/\s*\(to book\)/, ""))}</b><span class="stc-d">${fmt(s.start)} → ${fmt(s.end)} · ${n} night${n > 1 ? "s" : ""}${s.host && s.host !== "Hotel" ? ` · Host ${esc(s.host)}` : ""}</span></div>
    <div class="stc-f ${tone}">${icon(tone === "bad" ? "x" : tone === "ok" ? "key" : "check")}<span>${esc(line)}</span><i>›</i></div></a>`;

function staysStreet(){

  const tile = (k, v, sub, cls) => `<div class="stt${cls ? " " + cls : ""}"><small>${k}</small><b>${v}</b>${sub ? `<span>${sub}</span>` : ""}</div>`;
  const [line, tone] = stayStatusLine(s);
  return `<div class="stp" style="--city:${stayCol(s)}"><div class="stp-hero"><div class="ph" data-lead="${esc(STAYPH[s.id] || s.photo || s.city)}"></div><a class="stp-back" href="#stays">← Stays</a>
      <div class="stp-hin"><small>${esc(s.city)} · ${n} night${n > 1 ? "s" : ""}</small><b>${esc(s.name.replace(/\s*\(to book\)/, ""))}</b>${chip(s.status)}</div></div>

    <div class="stts">${tile("Check-in", esc(s.checkin.replace(/^\w{3} /, "")), ci > 0 ? inDays(ci) : "", "")}${tile("Check-out", esc((s.checkout || "").replace(/^\w{3} /, "")), "", "")}</div>

    ${c ? `<div class="stcan${c.left <= 7 && c.left >= 0 ? " warn" : ""}"><div><small>Free cancellation</small><b>${c.left >= 0 ? `Ends ${inDays(c.left)}` : "Ended"}</b><span>Before ${esc(c.time)}, ${fmt(c.iso)}</span></div><p>${esc(s.cancel.split(". ").slice(1).join(". "))}</p></div>` : ""}
    ${s.notes && s.notes.length ? `<h3>Good to know</h3><div class="card stnotes"><ul>${s.notes.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}

}

// ===== Today with tabs (less scrolling). Mock: ?tdv=b =====
let TTAB = null;
function ttabs(tabs, panes){
  const keys = tabs.map(t => t[0]); if (!keys.includes(TTAB)) TTAB = keys[0];
  return `<div class="ttabs" role="tablist"><span class="tind" aria-hidden="true"></span>${tabs.map(([k, l, n]) => `<button type="button" role="tab" data-ttab="${k}" aria-selected="${k === TTAB}">${l}${n ? `<i>${n}</i>` : ""}</button>`).join("")}</div>
    ${keys.map(k => `<div class="tpane" data-tpane="${k}"${k === TTAB ? "" : " hidden"}>${panes[k] || ""}</div>`).join("")}`;
}
document.addEventListener("click", e => { const b = e.target.closest("[data-ttab]"); if (!b) return; TTAB = b.dataset.ttab;
  document.querySelectorAll("[data-ttab]").forEach(x => x.setAttribute("aria-selected", x === b)); document.querySelectorAll("[data-tpane]").forEach(p => p.hidden = p.dataset.tpane !== TTAB);
  const t = document.querySelector(".ttabs"); if (t && t.getBoundingClientRect().top < 60) scrollTo({ top: scrollY + t.getBoundingClientRect().top - 58 }); tind(); });
// The glass pill that slides under the selected tab.
function tind(){ const t = document.querySelector(".ttabs"), b = t && t.querySelector('[aria-selected="true"]'), i = t && t.querySelector(".tind"); if (!b || !i) return;
  i.style.width = b.offsetWidth + "px"; i.style.transform = `translateX(${b.offsetLeft}px)`; }
new MutationObserver(() => { const t = document.querySelector(".ttabs:not([data-ok])"); if (t) { t.dataset.ok = 1; requestAnimationFrame(() => { tind(); requestAnimationFrame(() => t.classList.add("ready")); }); } }).observe(document.documentElement, { childList: true, subtree: true });
addEventListener("resize", tind);
function tminiDays(D){ return `<div class="tminis">${D.map(d => { const dt = parse(d.date); return `<a class="tmini" href="#day-${d.date}" style="--city:${cityCol(d.city)}"><div class="ph" data-lead="${esc(dayPh(d) || d.place)}"></div><span class="pdate">${DOW[dt.getDay()]}<b>${dt.getDate()}</b></span><b>${esc(d.title)}</b></a>`; }).join("")}</div>`; }
function nextUpHtml(iso){
  const L = (MOg().todo || []).filter(t => t[4] === "all" || PB()), done = local.get("todo-done", {}), open = L.filter(t => !done[t[0]]).sort((a, b) => a[2].localeCompare(b[2]));
  const fl = myLegs().find(l => l.dep && l.dep.slice(0, 10) >= iso), rows = [];
  if (open[0]) { const n = Math.round((parse(open[0][2]) - parse(iso)) / 864e5); rows.push(`<button type="button" class="tnx${n <= 3 ? " soon" : ""}" data-ttab="todo"><small>Next to do</small><b>${esc(open[0][1])}</b><span>${n < 0 ? `${-n} days late` : n === 0 ? "Due today" : `Due in ${n} day${n > 1 ? "s" : ""}`} · ${open.length} left ›</span></button>`); }
  if (fl) rows.push(`<button type="button" class="tnx" data-bkopen="${fl.mine ? "m:" + fl.dir : bkFlightKey(fl.dep.slice(0, 10), "", fl.no)}" data-bkleg="${esc(fl.no)}"><small>First flight</small><b>${esc(fl.no)} · ${esc(fl.from)} → ${esc(fl.to)}</b><span>${fmt(fl.dep.slice(0, 10))}, ${t12(fl.dep)} ›</span></button>`);
  return rows.length ? `<div class="tnxs">${rows.join("")}</div>` : "";
}
function todayTabs(){
  const iso = todayIso(), first = T.days[0].date, last = T.days[T.days.length - 1].date, idx = T.days.findIndex(d => d.date === iso);
  if (iso > last || (idx < 0 && iso >= first)) return todayStreet();
  const dl = x0 => { const x = parse(x0); return `${DOW[x.getDay()]} ${x.getDate()} ${MON[x.getMonth()]}`; };
  if (iso < first) {
    const n = Math.round((parse(first) - parse(iso)) / 864e5), ml = PB() ? null : personalLegs().find(l => l.dir === "in" && l.dep.slice(0, 10) >= iso);
    const nn = ml ? Math.round((parse(ml.dep.slice(0, 10)) - parse(iso)) / 864e5) : n;
    const top = streetHero({ city: "hoian", line: `Countdown · Hi ${esc(ME())}`, sm: `${nn} day${nn === 1 ? "" : "s"} to`, nm: "Việt Nam", title: PB() ? "We fly Fri Dec 4 at 6:00 AM from Sarasota" : ml ? `You fly ${esc(ml.from)} → ${esc(ml.to)}, ${fmt(ml.dep.slice(0, 10))} at ${t12(ml.dep)}` : "Everyone together in Sài Gòn from Sun Dec 6" });
    const L = (MOg().todo || []).filter(t => t[4] === "all" || PB()), done = local.get("todo-done", {}), left = L.filter(t => !done[t[0]]).length;
    const sd = Object.keys(setupDone()).length, sn = (MOg().setup || []).length;
    return (MOCK.gl === "1" ? top.replace('class="shero"', 'class="shero hasover"') + `<div class="tover">${nextUpHtml(iso)}</div>` : top) + ttabs([["home", "Overview"], ["todo", "To do", left || ""], ["ready", "Get ready"]], {
      home: `${setupNudge()}${MOCK.gl === "1" ? "" : nextUpHtml(iso)}<h3>First days</h3>${tminiDays(T.days.slice(0, 4))}${arrivalsCard(iso)}${todayFactsHtml(null)}`,
      todo: todoHtml(iso).replace(/^<h3>[^<]*<\/h3>/, ""),
      ready: `<a class="card jlcard" href="#info" data-goto="setup"><b>Phone setup · <span id="setup-n">${sd}</span>/${sn} done</b><span class="small muted">Grab, offline maps, translate, eSIM and more ›</span></a>${jetlagHtml(iso)}${wxCard()}${newsCard()}` });
  }
  const d = T.days[idx], st = d.stay ? stayById(d.stay) : null, vd = T.days.filter(x => VN(x.city)), vi = vd.indexOf(d), ru = dayRouteUrl(d), ns = nextStop();
  let top = streetHero({ city: d.city, line: `${dl(iso)} · ${vi >= 0 ? `Day ${vi + 1} of ${vd.length}` : `Day ${idx + 1} of ${T.days.length}`}`, sm: st ? "Tonight" : "Today", nm: CITYV[d.city] || d.place, title: esc(d.title) });
  top += `<div class="nightbg ph" aria-hidden="true" data-lead="${esc((T.stories.find(x => (XCITY[x.id] || [])[2] === d.city) || {}).hero || "Vietnam")}"></div>`;
  top += `<div class="swall"><div id="nownext" class="nownext-s">${nowNextHtml(d)}</div>
    <div class="wnbar">${ns ? `<button type="button" class="btn solid" data-nextstop>Next stop</button>` : ""}<a class="btn${ns ? "" : " solid"}" href="#now">What now?</a>${ru ? `<a class="btn" href="${ru}" target="_blank" rel="noopener">Map ↗</a>` : ""}</div></div><div id="raintop"></div>${factsStrip(d)}`;
  const tp = [...new Set(d.items.flatMap(x => placesFor(x[1], d.city)))].filter(p => p.photo), gt = (T.guides || []).filter(g => g.day === iso);
  const ag = (T.airports || []).find(a => (!a.pb || PB()) && a.when.includes(fmt(iso)));
  const travel = travelDayHtml(iso) + arrivalPlan(iso) + (ag ? `<h3>${esc(ag.title)}</h3><div class="card"><ol class="steps" style="margin:0">${ag.steps.map(x => `<li>${esc(x)}</li>`).join("")}</ol></div>` : "");
  const tips = arrivalsCard(iso) + jetlagHtml(iso) + wxCard() + newsCard() + dayExtrasHtml(d) + gamesTodayHtml(iso) + todayFactsHtml(d);
  const tabs = [["day", "Today"], ...(travel ? [["travel", "Travel"]] : []), ["tips", "Tips"], ["next", "Tomorrow"]];
  return top + ttabs(tabs, {
    day: `${setupNudge()}${walletToday(iso)}${briefHtml(d)}${checkoutHtml(d)}<div class="tflow">${dayFlow(d, d.items.filter(x => x[2] === "todo").length)}</div>${tp.length ? `<h3>Today's places</h3><div class="strip">${tp.map(p => `<button class="ptile" data-place="${p.id}"><div class="ph" data-lead="${esc(p.photo)}"></div><span>${esc(p.name)}</span></button>`).join("")}</div>` : ""}${gt.length ? `<h3>Audio guides for today</h3><div class="list">${gt.map(guideCard).join("")}</div>` : ""}`,
    travel, tips,
    next: `${tomorrowHtml(iso)}${T.days[idx + 1] ? tminiDays(T.days.slice(idx + 1, idx + 4)) : ""}` });
}

function launch(){
  if (!ME()) return picker();
  T = scoped(FULL); afterTripReady(); if (!LIVE.init){ LIVE.init = 1; liveInit(); } $("#tabs").hidden=false; current=null; route();
  setTimeout(()=>prefetchPhotos().catch(()=>{}), 4000);
}
function start(data){
  FULL = data; window.addEventListener("hashchange",()=>{ if(T && ME()) requestAnimationFrame(()=>route()); }); launch();
  // Tabs and section buttons replace the history entry, so the iPhone back-swipe can't flip between tabs.
  document.addEventListener("click",e=>{ const a=e.target.closest("#tabs a[href^='#'], nav.seg a[href^='#']"); if(!a) return; e.preventDefault(); const h=a.getAttribute("href");
    if (location.hash!==h){ history.replaceState(null,"",h); if(T && ME()) route(); } },true);
}

// Encrypted build: the trip data is locked with a shared trip passcode, entered once per phone.
async function unlock(pass, enc){
  const b = s => Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b(enc.salt), iterations:150000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b(enc.iv)}, key, b(enc.ct));
  if (enc.z) return JSON.parse(await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"))).text());
  return JSON.parse(new TextDecoder().decode(pt));
}
function lockScreen(enc, msg){
  $("#view").innerHTML = `<form class="lock" id="lockform"><div class="brand" style="font-size:30px">Vietnam<span>’26</span></div>
    <label for="pass" class="muted">Enter the trip passcode. You only need to do this once on this phone.</label>
    <input id="pass" type="password" autocomplete="current-password" required>
    <button class="btn" style="justify-self:center">Unlock</button>${msg?`<div class="err">${esc(msg)}</div>`:""}</form>`;
  $("#lockform").addEventListener("submit", async e=>{ e.preventDefault(); const p=$("#pass").value.trim();
    try { const d = await unlock(p, enc); store.set("trip-pass", p); start(d); } catch(err){ lockScreen(enc, "That passcode didn't work. Check it with Praneeth and try again."); } });
}

if (window.TRIP) start(window.TRIP);
else if (window.TRIP_ENC){
  const saved = store.get("trip-pass");
  if (saved) unlock(saved, window.TRIP_ENC).then(start).catch(err=>{ if (window.TRIP_ENC.z && typeof DecompressionStream==="undefined"){ $("#view").innerHTML=`<div class="card" style="margin:24px 16px"><b>Update your iPhone to open the trip app.</b><p class="small">It needs iOS 16.4 or newer: Settings, General, Software Update.</p></div>`; return; } store.del("trip-pass"); lockScreen(window.TRIP_ENC); });
  else lockScreen(window.TRIP_ENC);
}
