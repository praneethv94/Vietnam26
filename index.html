<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vietnam '26"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2c94c" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0d1830" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-512.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:0}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body><title>Vietnam '26</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap">
<style>
/* Layout: phone app shell. Sticky header, one scrolling view, fixed tab bar at the bottom. */
:root{
  --bg:#f2f4ef; --surface:#ffffff; --ink:#14231f; --muted:#5b6964; --line:#dce2dc;
  --jade:#1d5c50; --jade-soft:#e2eeea; --saffron:#c97f00; --saffron-soft:#fbefd6;
  --hero:#1d5c50; --hero-ink:#f2f4ef; --ok:#2c7a4b; --ok-soft:#e1f1e6; --todo:#a8550b; --todo-soft:#f8e7d6; --maybe:#5f56a0; --maybe-soft:#eae8f6;
  --display:"Bricolage Grotesque", ui-rounded, -apple-system, system-ui, sans-serif;
  --body:-apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
  --tab-h:58px; --read:"Newsreader", "Iowan Old Style", Georgia, serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1614; --surface:#16211e; --ink:#e7eeea; --muted:#9aa8a2; --line:#25322e;
  --jade:#80c6b5; --jade-soft:#1b302b; --saffron:#f1b240; --saffron-soft:#3a2d12;
  --ok:#7fd0a0; --ok-soft:#173022; --todo:#f0a565; --todo-soft:#3a2614; --maybe:#b4adf0; --maybe-soft:#25233d; --hero:#1c4a41; --hero-ink:#eef4f0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1614; --surface:#16211e; --ink:#e7eeea; --muted:#9aa8a2; --line:#25322e;
  --jade:#80c6b5; --jade-soft:#1b302b; --saffron:#f1b240; --saffron-soft:#3a2d12;
  --ok:#7fd0a0; --ok-soft:#173022; --todo:#f0a565; --todo-soft:#3a2614; --maybe:#b4adf0; --maybe-soft:#25233d; --hero:#1c4a41; --hero-ink:#eef4f0; color-scheme:dark}
html,body{background:var(--bg)}
body{color:var(--ink);font:15px/1.45 var(--body);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:12px 10px}
.brand{font:700 22px/1 var(--display);letter-spacing:-.01em}
.brand span{color:var(--saffron)}
.sub{color:var(--muted);font-size:13px}
main{padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 24px)}
main .wrap{padding-block:16px;display:grid;gap:16px}
h2{font:700 20px/1.2 var(--display);margin:8px 0 0;text-wrap:balance}
h3{font:600 13px/1.2 var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:8px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.list{display:grid;gap:10px}
.muted{color:var(--muted)}
.small{font-size:13px}
a{color:var(--jade);font-weight:600}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;background:var(--jade-soft);color:var(--jade);text-decoration:none;font-weight:600;font-size:14px;border:0;cursor:pointer}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-block;align-self:start;justify-self:end;font-size:11.5px;font-weight:700;letter-spacing:.03em;padding:2px 8px;border-radius:999px;white-space:nowrap;vertical-align:1px}
.chip.booked{background:var(--ok-soft);color:var(--ok)}
.chip.todo{background:var(--todo-soft);color:var(--todo)}
.chip.maybe{background:var(--maybe-soft);color:var(--maybe)}
:focus-visible{outline:2px solid var(--saffron);outline-offset:2px}

/* Hero on Today */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:18px;padding:18px;display:grid;gap:6px}
.hero .eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.hero .big{font:700 30px/1.05 var(--display);letter-spacing:-.015em;text-wrap:balance}
.hero .big em{font-style:normal;color:var(--saffron)}

/* Day list */
details.day{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
details.day[open]{border-color:color-mix(in srgb,var(--jade) 40%,var(--line))}
details.day.is-today{border-color:var(--saffron);box-shadow:0 0 0 1px var(--saffron)}
details.day summary{list-style:none;display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:12px 14px;cursor:pointer}
details.day summary::-webkit-details-marker{display:none}
.date{display:grid;justify-items:center;line-height:1}
.date .dow{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.date .dnum{font:700 24px/1.05 var(--display);font-variant-numeric:tabular-nums}
.date .mon{font-size:11px;color:var(--muted)}
.sumtext{min-width:0}
.sumtext .place{font-size:12px;color:var(--saffron);font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.sumtext .title{font-weight:600;font-size:16px;line-height:1.25}
.caret{width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
details[open] .caret{transform:rotate(-135deg)}
.daybody{border-top:1px solid var(--line);padding:6px 14px 14px}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.tl li:last-child{border-bottom:0}
.tl .t{font-size:12.5px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums;padding-top:1px}
.tl .w{min-width:0}
.night{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:13.5px}
.note{background:var(--saffron-soft);border-radius:10px;padding:8px 10px;font-size:13.5px;margin-top:8px}
.legbar{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.legbar a{flex:none;text-decoration:none;font-size:13px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink);font-weight:600;background:var(--surface)}

/* Stays */
.stay .city{font-size:12px;color:var(--saffron);font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.stay .name{font:700 18px/1.2 var(--display);margin:2px 0 8px}
.kv{display:grid;grid-template-columns:92px 1fr;gap:6px 10px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0}
.entry{margin-top:12px;border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
.entry b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}
.notes{margin:10px 0 0;padding-left:18px;font-size:14px}
.notes li+li{margin-top:4px}

/* Travel rows */
.row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .when{font-size:12.5px;color:var(--muted);font-weight:600;grid-column:1/-1}
.row .what{font-weight:600;min-width:0}
.row .detail{font-size:13.5px;color:var(--muted);grid-column:1/-1}

/* Info */
.conv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.conv label{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.conv input{font:600 17px var(--body);padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;box-sizing:border-box;font-variant-numeric:tabular-nums}
.phr{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;font-size:14px}
.phr div:nth-child(even){font-weight:700}
.people{display:flex;flex-wrap:wrap;gap:6px}
.person{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--jade-soft);color:var(--jade);font-weight:600}
.person.tbd{background:transparent;border:1px dashed var(--line);color:var(--muted)}

/* Tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tab-h)}
nav.tabs a{display:grid;place-items:center;align-content:center;gap:3px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:600}
nav.tabs a svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a[aria-current="page"]{color:var(--jade)}

/* Lock screen */
.lock{min-height:70vh;display:grid;place-content:center;gap:14px;text-align:center}
.lock input{font:600 20px var(--body);padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-align:center}
.err{color:var(--todo);font-size:14px}
/* Segmented control */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--line);border-radius:11px;padding:3px;gap:3px}
.seg a{text-align:center;padding:7px 0;border-radius:9px;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;transition:background-color .2s,color .2s}
.seg a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .12)}

/* Weather */
.wx{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:center}
.wx .ico{font-size:34px;line-height:1}
.wx .temp{font:700 28px/1 var(--display);font-variant-numeric:tabular-nums}
.wx .lo{color:var(--muted);font-weight:500;font-size:18px}
.wxrow{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(64px,1fr);gap:8px;overflow-x:auto;scrollbar-width:none;margin-top:12px}
.wxday{display:grid;justify-items:center;gap:2px;padding:8px 4px;border-radius:10px;background:var(--bg);font-size:12px;font-variant-numeric:tabular-nums}
.wxday b{font-size:13px}

/* Stories */
.story-card{display:grid;gap:4px;text-decoration:none;color:var(--ink)}
.story-card .k{font-size:12px;color:var(--saffron);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.story-card .t{font:700 22px/1.15 var(--display)}
.story-card .d{font:italic 16px/1.35 var(--read);color:var(--muted)}
.story-card .m{font-size:12.5px;color:var(--muted)}
.reader{display:grid;gap:6px;margin-top:-16px}
.reader .back{justify-self:start}
.reader h1{font:700 34px/1.05 var(--display);letter-spacing:-.02em;margin:10px 0 0;text-wrap:balance}
.reader .dek{font:italic 20px/1.3 var(--read);color:var(--muted);margin:0}
.reader .meta{font-size:13px;color:var(--muted)}
.toc{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:6px 0}
.toc a{flex:none;font-size:12.5px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);text-decoration:none;color:var(--ink);font-weight:600}
article.prose{font:19px/1.62 var(--read);max-width:36em}
article.prose h2{font:700 21px/1.25 var(--display);margin:28px 0 8px;scroll-margin-top:72px}
article.prose p{margin:0 0 14px}
article.prose ul{margin:0 0 14px;padding-left:20px}
article.prose li{margin-bottom:6px}
article.prose>p:first-child::first-letter{font:700 3.2em/0.8 var(--display);float:left;margin:6px 8px 0 0;color:var(--saffron)}
.progress{position:fixed;left:0;top:env(safe-area-inset-top,0px);height:3px;background:var(--saffron);width:100%;transform:scaleX(0);transform-origin:left;z-index:7;will-change:transform}

/* Food bingo */
.bingo-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--saffron);border-radius:99px;transition:width .5s var(--ease)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:12px;display:grid;gap:4px;align-content:start;font:inherit;cursor:pointer;transition:transform .18s var(--ease),background-color .25s,border-color .25s}
.tile:active{transform:scale(.96)}
.tile b{font-size:15px;line-height:1.2}
.tile span{font-size:12.5px;color:var(--muted);line-height:1.35}
.tile .stamp{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;border:1.5px dashed var(--line);display:grid;place-items:center;font-size:14px;color:transparent;transition:all .3s var(--ease)}
.tile[aria-pressed="true"]{background:var(--saffron-soft);border-color:color-mix(in srgb,var(--saffron) 50%,var(--line))}
.tile[aria-pressed="true"] .stamp{background:var(--saffron);border:0;color:var(--surface);transform:rotate(-12deg) scale(1.1)}
.tile[aria-pressed="true"] b{padding-right:26px}
.tile b{padding-right:26px}

/* Photos */
.ph{background:var(--line);overflow:hidden;position:relative}
.ph img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .5s var(--ease),transform .6s var(--ease)}
.ph img.loaded{opacity:1}
.gal{display:grid;grid-auto-flow:column;grid-auto-columns:82%;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:4px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 22px;padding:0 max(16px,env(safe-area-inset-left,0px));scrollbar-width:none;font-family:var(--body)}
.gal:empty{display:none}
.ph.none{display:none}
.gal figure{margin:0;scroll-snap-align:start;display:grid;gap:6px}
.gal .ph{aspect-ratio:4/3;border-radius:14px;cursor:zoom-in}
.gal figcaption{font-size:12.5px;line-height:1.35;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cover{margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));height:min(62vh,440px);position:relative;border-radius:0 0 22px 22px}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgb(0 0 0 / .25) 0%,transparent 30%,transparent 45%,rgb(0 0 0 / .78) 100%)}
.cover .over{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:20px;z-index:1;color:#fff;display:grid;gap:6px}
.cover .over h1{margin:0;color:#fff}
.cover .over .dek{color:rgb(255 255 255 / .85)}
.cover .over .meta{color:rgb(255 255 255 / .75)}
.cover .back{position:absolute;top:12px;left:max(16px,env(safe-area-inset-left,0px));z-index:1;background:rgb(0 0 0 / .35);color:#fff;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.story-card{padding:0;overflow:hidden}
.story-card .ph{aspect-ratio:16/9}
.story-card .txt{display:grid;gap:4px;padding:12px 16px 14px}
.thumb{width:52px;height:52px;border-radius:12px;flex:none}
details.day summary{grid-template-columns:48px 1fr 52px}
details.day .caret{display:none}
.daybody .banner{aspect-ratio:16/9;border-radius:12px;margin:8px 0 4px}
.stay{padding:0;overflow:hidden}
.stay .ph{aspect-ratio:16/8}
.stay .in{padding:14px 16px}
.hero.has-photo{background:#0d2a24}
.hero .bgph{position:absolute;inset:0;border-radius:inherit}
.hero .bgph img{filter:saturate(1.05)}
.hero .bgph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgb(8 30 25 / .35),rgb(8 30 25 / .82))}
.hero>*:not(.bgph){position:relative;z-index:1}
.hero.has-photo{color:#f2f4ef;--hero-ink:#f2f4ef;--hero:#0d2a24}
.lightbox{position:fixed;inset:0;z-index:50;background:rgb(0 0 0 / .94);display:grid;grid-template-rows:1fr auto;padding:calc(env(safe-area-inset-top,0px) + 44px) 0 calc(env(safe-area-inset-bottom,0px) + 16px);animation:fade .25s ease}
.lightbox img{width:100%;height:100%;object-fit:contain;align-self:center}
.lightbox p{color:#ddd;font-size:13.5px;margin:10px max(16px,env(safe-area-inset-left,0px)) 0;line-height:1.4}
.lightbox p a{color:#9fd8c9}
.lightbox .credit{display:block;color:#999;font-size:12px;margin-top:4px}
.lightbox button{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);right:max(12px,env(safe-area-inset-right,0px));background:rgb(255 255 255 / .15);color:#fff;border:0;border-radius:999px;width:36px;height:36px;font-size:18px}
@keyframes fade{from{opacity:0}}

/* Places, sheets, checklists, forms */
.pins{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pin{text-decoration:none;display:inline-flex;align-items:center;gap:4px;font:600 12.5px var(--body);padding:4px 9px;border-radius:999px;border:1px solid color-mix(in srgb,var(--jade) 30%,var(--line));background:var(--jade-soft);color:var(--jade);cursor:pointer}
.pin svg{width:12px;height:12px;fill:currentColor}
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgb(0 0 0 / .4);animation:fade .2s ease}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:20px 20px 0 0;padding:10px max(16px,env(safe-area-inset-left,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(16px,env(safe-area-inset-right,0px));display:grid;gap:12px;max-width:640px;margin:0 auto;animation:up .32s var(--ease)}
@keyframes up{from{transform:translateY(100%)}}
.sheet .grab{justify-self:center;width:38px;height:5px;border-radius:9px;background:var(--line)}
.sheet .sname{font:700 20px/1.2 var(--display)}
.addr{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--bg);border-radius:12px;padding:10px 12px}
.addr .vi{font-weight:700;font-size:16px}
.addr .a{font-size:14px;color:var(--muted);user-select:all;-webkit-user-select:all}
.sheet .btns{margin:0}
.btn.solid{background:var(--jade);color:var(--surface)}
.driver{position:fixed;inset:0;z-index:60;background:#fff;color:#111;display:grid;place-content:center;gap:18px;padding:max(24px,env(safe-area-inset-top,0px)) 24px;text-align:center;animation:fade .2s ease}
.driver .big{font:700 clamp(30px,9vw,46px)/1.15 var(--body)}
.driver .sm{font-size:20px;color:#444}
.driver .hint{font-size:13px;color:#888}
.check{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:2px}
.check label{display:flex;gap:10px;align-items:flex-start;padding:7px 0;font-size:14.5px;cursor:pointer}
.check input{appearance:none;-webkit-appearance:none;flex:none;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--muted);margin:1px 0 0;display:grid;place-content:center;transition:all .2s var(--ease)}
.check input:checked{background:var(--jade);border-color:var(--jade)}
.check input:checked::after{content:"";width:5px;height:10px;border:solid var(--surface);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check input:checked+span{color:var(--muted);text-decoration:line-through}
.check .why{display:block;font-size:12px;color:var(--muted);text-decoration:none}
.sub-h{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:12px}
.steps{margin:6px 0 0;padding-left:22px;font-size:14.5px}
.steps li{padding:4px 0}
.mich{font-size:11px;font-weight:700;color:#b3122e;background:color-mix(in srgb,#b3122e 12%,transparent);padding:2px 7px;border-radius:999px;margin-left:6px;white-space:nowrap}
.form{display:grid;gap:10px}
.form label{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.form input,.form textarea{font:16px var(--body);padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;box-sizing:border-box}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kvcard{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:14.5px}
.kvcard dt{color:var(--muted)}
.kvcard dd{margin:0;min-width:0;overflow-wrap:anywhere}
.ghost{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 16px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13.5px;z-index:70;animation:fade .2s ease}

/* Motion */
:root{--ease:cubic-bezier(.2,.8,.2,1)}
.btn,details.day summary,.legbar a{transition:transform .18s var(--ease),background-color .2s}
.btn:active,details.day summary:active,.legbar a:active{transform:scale(.97)}
.daybody{overflow:hidden}
#view>*{animation:rise .42s var(--ease) both}
#view>*:nth-child(2){animation-delay:.03s}#view>*:nth-child(3){animation-delay:.06s}#view>*:nth-child(4){animation-delay:.09s}#view>*:nth-child(5){animation-delay:.12s}#view>*:nth-child(n+6){animation-delay:.15s}
.list>*{animation:rise .42s var(--ease) both}
.list>*:nth-child(2){animation-delay:.03s}.list>*:nth-child(3){animation-delay:.06s}.list>*:nth-child(4){animation-delay:.09s}.list>*:nth-child(5){animation-delay:.12s}.list>*:nth-child(n+6){animation-delay:.15s}
@keyframes rise{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}
nav.tabs .in{position:relative}
nav.tabs .pill{position:absolute;top:7px;height:44px;width:calc(20% - 12px);left:6px;border-radius:12px;background:var(--jade-soft);transition:transform .38s var(--ease);z-index:-1}
nav.tabs a{position:relative;transition:color .25s}
nav.tabs a[aria-current="page"] svg{animation:pop .4s var(--ease)}
@keyframes pop{40%{transform:scale(1.18)}}

/* Hero route line */
.route{margin-top:8px;height:46px;position:relative}
.route svg{width:100%;height:100%;overflow:visible}
.route .track{stroke:color-mix(in srgb,var(--hero-ink) 45%,transparent);stroke-width:2;stroke-dasharray:2 5;fill:none;stroke-linecap:round}
.route .done{stroke:var(--saffron);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.1s .2s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:var(--off)}}
.route .stop{fill:var(--hero);stroke:color-mix(in srgb,var(--hero-ink) 75%,transparent);stroke-width:1.5}
.route .stop.past{fill:var(--saffron);stroke:var(--saffron)}
.route text{font:600 9px var(--body);fill:color-mix(in srgb,var(--hero-ink) 85%,transparent)}
.route .me{fill:var(--saffron)}
.route .halo{fill:var(--saffron);opacity:.35;transform-origin:center;transform-box:fill-box;animation:halo 2s ease-out infinite}
@keyframes halo{from{transform:scale(1);opacity:.45}to{transform:scale(2.6);opacity:0}}
.hero{position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--saffron) 45%,transparent),transparent 70%);pointer-events:none}
::view-transition-old(root),::view-transition-new(root){animation-duration:.28s;animation-timing-function:var(--ease)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition:none!important;animation:none!important}.route .done{stroke-dashoffset:var(--off)}}

/* Tap to hear */
.say{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--jade-soft);color:var(--jade);cursor:pointer;flex:none;vertical-align:middle;transition:transform .15s var(--ease)}
.say svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.say:active{transform:scale(.9)}
.say.sm{width:26px;height:26px}
.say.sm svg{width:14px;height:14px}
.say.on{background:var(--saffron);color:var(--surface)}
.phr{display:grid;grid-template-columns:1fr;gap:0;font-size:14px}
.phr .pr{display:grid;grid-template-columns:1fr 1.25fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.phr .pr:last-child{border-bottom:0}
.phr>div.pr{font-weight:400}
.phr .vi{font-weight:700;font-size:15px;display:block}
.sound{font-size:12.5px;color:var(--muted);font-style:italic}
.tile .viw{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:2px}
.tile .viw i{font-style:normal;font-weight:600;color:var(--ink);font-size:13px;line-height:1.25}
.tile .viw .sound{display:block;font-size:12px}
.driver .play{justify-self:center;font-size:17px;padding:12px 18px;border-radius:999px;background:#1d5c50;color:#fff;border:0;display:inline-flex;gap:8px;align-items:center}
.driver .play svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Now and next */
.nownext{padding:0;overflow:hidden}
.nn{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:start}
.nn:last-child{border-bottom:0}
.nn .dot{grid-row:1/3;width:10px;height:10px;border-radius:50%;margin-top:4px;background:var(--line)}
.nn .lbl{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.nn b{font-weight:600;font-size:15px;line-height:1.3;grid-column:2}
.nn.now{background:color-mix(in srgb,var(--jade-soft) 70%,transparent)}
.nn.now .dot{background:var(--jade);box-shadow:0 0 0 4px color-mix(in srgb,var(--jade) 25%,transparent);position:relative}.nn.now .dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--jade);animation:dotring 2s ease-out infinite}
@keyframes dotring{from{transform:scale(1);opacity:.6}to{transform:scale(1.9);opacity:0}}
.nn.now .lbl{color:var(--jade)}
.nn.key .dot{background:var(--saffron)}
.nn.key .lbl{color:var(--saffron)}
.nn.key b{font-weight:700}
.nn .cd{font:700 13px var(--body);font-variant-numeric:tabular-nums;color:var(--ink);text-transform:none;letter-spacing:0;margin-left:4px}
.nn .bar2{grid-column:2;height:3px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}
.nn .bar2 i{display:block;height:100%;background:var(--jade);border-radius:3px}
@keyframes breathe{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--jade) 0%,transparent)}}
.tl li.now{background:color-mix(in srgb,var(--jade-soft) 80%,transparent);margin:0 -14px;padding:8px 14px;border-radius:0}
.tl li.now .t{color:var(--jade)}
.tl li.now .t::before{content:"Now · ";}
.pin.listen{background:var(--saffron-soft);color:var(--saffron);border-color:color-mix(in srgb,var(--saffron) 30%,var(--line))}
.pin.listen svg{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* Audio guides */
.gcard{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center;text-decoration:none;color:var(--ink);padding:10px}
.gcard .ph{width:72px;height:72px;border-radius:12px}
.gcard .t{font:700 16.5px/1.2 var(--display)}
.gcard .m{font-size:12.5px;color:var(--muted);margin-top:3px}
.gcard .dist{font-size:12px;font-weight:700;color:var(--saffron);margin-top:3px}
.gcard.closest{border-color:var(--saffron);box-shadow:0 0 0 1px var(--saffron)}
.near{display:flex;gap:10px;align-items:center;justify-content:space-between}
.bigplay{display:inline-flex;align-items:center;gap:10px;justify-self:start;font:700 16px var(--body);padding:12px 18px 12px 14px;border-radius:999px;border:0;background:var(--saffron);color:#1b1206;cursor:pointer}
.bigplay svg,.mp svg,.stopplay svg{width:20px;height:20px;fill:currentColor}
.cover .bigplay{position:relative;z-index:1}
article.guide .stop{scroll-margin-top:72px}
article.guide .stop h2{display:flex;align-items:baseline;gap:10px;margin-top:26px}
article.guide .stop h2 .n{font:700 13px var(--body);color:var(--saffron);flex:none;letter-spacing:.04em}
article.guide .where{font:600 14px/1.4 var(--body);color:var(--jade);background:var(--jade-soft);border-radius:10px;padding:8px 10px;margin:0 0 12px}
.stopplay{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--saffron);font:700 13px var(--body);padding:0;margin:0 0 10px;cursor:pointer}
.stopplay svg{width:14px;height:14px}
.speaking{background:color-mix(in srgb,var(--saffron-soft) 85%,transparent);box-shadow:-8px 0 0 var(--saffron-soft),8px 0 0 var(--saffron-soft);border-radius:4px;transition:background-color .3s}
.tipcard{font-size:13.5px;color:var(--muted)}
.mp{position:fixed;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 8px);z-index:7;pointer-events:none}
.mp .in{pointer-events:auto;max-width:620px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) repeat(5,auto);gap:4px;align-items:center;background:color-mix(in srgb,var(--ink) 94%,transparent);color:var(--bg);border-radius:16px;padding:8px 8px 8px 14px;box-shadow:0 8px 30px rgb(0 0 0 / .25);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:up .3s var(--ease)}
.mp .ti{min-width:0;text-decoration:none;color:inherit}
.mp .ti b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp .ti span{display:block;font-size:12px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp button{border:0;background:transparent;color:inherit;width:36px;height:38px;border-radius:50%;display:grid;place-items:center;cursor:pointer;font:700 12px var(--body)}
.mp button.pp{background:var(--saffron);color:#1b1206}
.mp button:active{transform:scale(.9)}
body.has-player main{padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 90px)}
body.has-player .toast{bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 84px)}

/* ===== Design directions (mockups). Pick one with ?look=lantern|night|postcard ===== */
/* Shared structure for every look: full-bleed photo hero and a floating tab bar. */
html[data-look] .hero{margin:-16px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;border-radius:0 0 28px 28px;min-height:min(58vh,460px);align-content:end;padding:22px max(18px,env(safe-area-inset-left,0px)) 22px}
html[data-look] .hero::after{display:none}
html[data-look] .hero .big{font-size:clamp(34px,10vw,44px);line-height:1}
html[data-look] .hero .bgph::after{background:linear-gradient(180deg,rgb(0 0 0 / .05) 0%,rgb(0 0 0 / 0) 35%,rgb(0 0 0 / .72) 100%)}
html[data-look] nav.tabs{left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);border-radius:24px;border:1px solid var(--line);padding:0;box-shadow:0 10px 30px rgb(0 0 0 / .14)}
html[data-look] nav.tabs .in{height:62px}
html[data-look] main{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 110px)}
html[data-look] .mp{bottom:calc(env(safe-area-inset-bottom,0px) + 82px)}
html[data-look] .toast{bottom:calc(env(safe-area-inset-bottom,0px) + 92px)}
html[data-look] header.top{border-bottom:0}
html[data-look] .card,html[data-look] details.day{border-radius:20px}
html[data-look] .daybody .banner{border-radius:16px}

/* C. Postcard: bright and graphic, flag red and yellow, chunky type, sticker cards. Feels playful. */
html[data-look="postcard"]{--bg:#fff8e7;--surface:#ffffff;--ink:#141414;--muted:#5d5a52;--line:#141414;--jade:#0f6b5c;--jade-soft:#d7f0e8;--saffron:#da251d;--saffron-soft:#ffe1dc;--hero:#da251d;--hero-ink:#fff;--ok:#0f6b5c;--ok-soft:#d7f0e8;--todo:#141414;--todo-soft:#ffcd00;--maybe:#3d2fb0;--maybe-soft:#e6e2ff}
@media (prefers-color-scheme: dark){html[data-look="postcard"]:not([data-theme="light"]){--bg:#141414;--surface:#1f1e1c;--ink:#fff8e7;--muted:#bdb6a6;--line:#fff8e7;--jade:#5fd3b4;--jade-soft:#173a32;--saffron:#ff5a4e;--saffron-soft:#3d1a17;--ok:#5fd3b4;--ok-soft:#173a32;--todo:#141414;--todo-soft:#ffcd00}}
html[data-look="postcard"] .brand{font-weight:800;letter-spacing:-.04em;font-size:24px}
html[data-look="postcard"] .brand span{color:var(--ink);background:#ffcd00;padding:0 5px;border-radius:6px;margin-left:3px;display:inline-block;transform:rotate(-3deg)}
html[data-look="postcard"] .card,html[data-look="postcard"] details.day{border:2px solid var(--line);box-shadow:4px 4px 0 var(--line)}
html[data-look="postcard"] details.day.is-today{box-shadow:4px 4px 0 var(--saffron);border-color:var(--line)}
html[data-look="postcard"] h3{color:var(--ink);font:800 13px var(--display);letter-spacing:.08em}
html[data-look="postcard"] h3::before{content:"★ ";color:var(--saffron)}
html[data-look="postcard"] .hero .big{font-weight:800;letter-spacing:-.04em;text-transform:none}
html[data-look="postcard"] .hero .eyebrow{display:inline-block;justify-self:start;background:#ffcd00;color:#141414;padding:4px 8px;border-radius:6px;opacity:1;font-weight:800;transform:rotate(-2deg)}
html[data-look="postcard"] .sumtext .title{font:800 17px/1.2 var(--display)}
html[data-look="postcard"] .sumtext .place{color:var(--saffron)}
html[data-look="postcard"] .thumb{border:2px solid var(--line)}
html[data-look="postcard"] .chip,html[data-look="postcard"] .pin{border:1.5px solid var(--line)}
html[data-look="postcard"] nav.tabs{background:var(--surface);border:2px solid var(--line);box-shadow:4px 4px 0 var(--line)}
html[data-look="postcard"] nav.tabs .pill{background:#ffcd00;border:1.5px solid var(--line)}
html[data-look="postcard"] nav.tabs a[aria-current="page"]{color:var(--ink)}
html[data-look="postcard"] .nn{border-bottom:2px dashed var(--line)}
html[data-look="postcard"] .nn.now{background:#ffcd00;color:#141414}
html[data-look="postcard"] .nn.now .lbl,html[data-look="postcard"] .nn.now .cd{color:#141414}
html[data-look="postcard"] .nn.now .dot{background:#141414;box-shadow:none}
html[data-look="postcard"] .nn .bar2{background:rgb(0 0 0 / .15)}
html[data-look="postcard"] .nn .bar2 i{background:#141414}
html[data-look="postcard"] .hero{--saffron:#ffcd00}
html[data-look="postcard"] .seg{background:transparent;border:2px solid var(--line)}
html[data-look="postcard"] .seg a[aria-current="page"]{background:var(--saffron);color:#fff;box-shadow:none}

/* Postcard: buttons, tiles, forms and tactile press states */
html[data-look="postcard"] .btn{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:2px 2px 0 var(--line);border-radius:12px}
html[data-look="postcard"] .btn.solid{background:var(--saffron);color:#fff}
html[data-look="postcard"] .btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--line)}
html[data-look="postcard"] .cover .back{border:0;box-shadow:none;background:rgb(0 0 0 / .35);color:#fff}
html[data-look="postcard"] .bigplay{background:var(--saffron);color:#fff;border:2px solid #141414;box-shadow:3px 3px 0 #141414}
html[data-look="postcard"] .tile{border:2px solid var(--line);box-shadow:3px 3px 0 var(--line);transition:transform .18s var(--ease),box-shadow .18s var(--ease),background-color .25s}
html[data-look="postcard"] .tile:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--line)}
html[data-look="postcard"] .tile[aria-pressed="true"]{background:#ffcd00;color:#141414;border-color:var(--line)}
html[data-look="postcard"] .tile[aria-pressed="true"] span,html[data-look="postcard"] .tile[aria-pressed="true"] .viw i,html[data-look="postcard"] .tile[aria-pressed="true"] .sound{color:#141414}
html[data-look="postcard"] .tile .stamp{border:2px dashed var(--line)}
html[data-look="postcard"] .tile[aria-pressed="true"] .stamp{background:var(--saffron);color:#fff;border:2px solid #141414;animation:stampin .35s var(--ease)}
@keyframes stampin{0%{transform:scale(2.2) rotate(-30deg);opacity:0}70%{transform:scale(.9) rotate(-8deg);opacity:1}100%{transform:scale(1.1) rotate(-12deg)}}
html[data-look="postcard"] .bar{border:2px solid var(--line);background:var(--surface);height:12px;border-radius:999px;overflow:hidden}
html[data-look="postcard"] .bar i{background:var(--saffron)}
html[data-look="postcard"] .form input,html[data-look="postcard"] .conv input,html[data-look="postcard"] .lock input{border:2px solid var(--line)}
html[data-look="postcard"] .gal .ph,html[data-look="postcard"] .daybody .banner,html[data-look="postcard"] .gcard .ph{border:2px solid var(--line)}
html[data-look="postcard"] a.card,html[data-look="postcard"] details.day>summary{transition:transform .16s var(--ease)}
html[data-look="postcard"] a.card:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--line)}
html[data-look="postcard"] .story-card .ph,html[data-look="postcard"] .stay .ph{border-bottom:2px solid var(--line)}
html[data-look="postcard"] .legbar a{border:2px solid var(--line);background:var(--surface)}
html[data-look="postcard"] .legbar a:active{background:#ffcd00;color:#141414}
html[data-look="postcard"] .say{border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
html[data-look="postcard"] .say.on{background:var(--saffron);color:#fff}
html[data-look="postcard"] .pin.listen{background:#ffcd00;color:#141414}
html[data-look="postcard"] .sheet{border-top:2px solid var(--line)}
html[data-look="postcard"] .addr{border:2px dashed var(--line);background:transparent}
html[data-look="postcard"] .entry{border:2px dashed var(--line)}
html[data-look="postcard"] .note{background:#ffcd00;color:#141414;border:2px solid var(--line)}
html[data-look="postcard"] .chip.todo{background:#ffcd00;color:#141414}
html[data-look="postcard"] .mp .in{border:2px solid #141414;box-shadow:4px 4px 0 #141414}
html[data-look="postcard"] .mp button.pp{background:var(--saffron);color:#fff}
html[data-look="postcard"] .speaking{background:#ffcd00;color:#141414;box-shadow:-6px 0 0 #ffcd00,6px 0 0 #ffcd00}
html[data-look="postcard"] .gcard.closest{box-shadow:4px 4px 0 var(--saffron);border-color:var(--line)}
html[data-look="postcard"] .progress{background:var(--saffron);height:4px}
html[data-look="postcard"] article.prose>p:first-child::first-letter{color:var(--saffron)}
html[data-look="postcard"] .story-card .k{color:var(--saffron)}
html[data-look="postcard"] #view>*{animation-duration:.5s}

/* Photo-led extras: place sheet banner, place thumbnails, today's places strip */
.sheetph{height:170px;border-radius:14px;margin-top:2px}
html[data-look="postcard"] .sheetph,html[data-look="postcard"] .pthumb,html[data-look="postcard"] .ptile .ph{border:2px solid var(--line)}
.prow{grid-template-columns:52px 1fr auto;align-items:center}
.prow .pthumb{width:52px;height:52px;border-radius:12px;grid-row:1/3}
.prow .detail{grid-column:2/-1}
.none-pin{display:grid;place-items:center;background:var(--saffron-soft);color:var(--saffron)}
.none-pin svg{width:20px;height:20px;fill:currentColor}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:42%;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:2px max(16px,env(safe-area-inset-left,0px)) 6px}
.ptile{scroll-snap-align:start;border:0;background:none;padding:0;text-align:left;display:grid;gap:6px;color:var(--ink);font:700 13.5px/1.25 var(--body);cursor:pointer}
.ptile .ph{aspect-ratio:4/5;border-radius:16px;transition:transform .2s var(--ease)}
.ptile:active .ph{transform:scale(.96)}
html[data-look="postcard"] .ptile .ph{box-shadow:3px 3px 0 var(--line)}
html[data-look="postcard"] .ph{background:#ffcd00 radial-gradient(circle at 50% 50%,rgb(218 37 29 / .18) 0 18%,transparent 19%) 0 0/22px 22px}
.prow .ph.pthumb.none{display:grid;place-items:center;background:var(--saffron-soft)}
.prow .ph.pthumb.none::before{content:"★";font:800 20px var(--display);color:var(--saffron)}
html[data-look="postcard"] .ph.thumb.none{display:grid;place-items:center}
html[data-look="postcard"] .ph.thumb.none::before{content:"★";font:800 26px var(--display);color:#da251d}
/* Smoothness on iPhone: animate only the view container, keep scrolling layers cheap. */
#view>*,.list>*{animation:none}
#view{animation:viewin .26s cubic-bezier(.2,.8,.2,1) both}
@keyframes viewin{from{opacity:0;transform:translate3d(0,8px,0)}to{opacity:1;transform:none}}
html[data-look] nav.tabs{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--surface);transform:translateZ(0)}
details.day,.card,.ptile,.story-card{contain:layout paint}
article.prose>p{content-visibility:auto;contain-intrinsic-size:auto 160px}
.ph img{backface-visibility:hidden}
@media (prefers-reduced-motion: reduce){#view{animation:none}}
/* No page zoom; photos zoom inside the lightbox. */
html{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
.lightbox{touch-action:none;overflow:hidden}
.lightbox img{transform-origin:0 0;will-change:transform;transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.lightbox img.dragging{transition:none}
.lightbox .hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 6px);text-align:center;color:#888;font-size:12px;margin:0}
/* Reading text size */
:root{--tscale:1}
article.prose{font-size:calc(19px * var(--tscale))}
article.prose h2{font-size:calc(21px * var(--tscale))}
.tsize{display:flex;align-items:center;gap:8px;justify-content:flex-end;margin:4px 0 -4px}
.tsize .lbl{font-size:12px;color:var(--muted);margin-right:auto;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.tsize button{font:800 15px var(--display);min-width:44px;height:36px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);box-shadow:2px 2px 0 var(--line);padding:0 10px;cursor:pointer}
.tsize button:active{transform:translate(2px,2px);box-shadow:none}
.tsize button:disabled{opacity:.35;box-shadow:none}
.tsize .cur{font:700 13px var(--body);min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
html[data-look="postcard"][data-theme="dark"]{--bg:#141414;--surface:#1f1e1c;--ink:#fff8e7;--muted:#bdb6a6;--line:#fff8e7;--jade:#5fd3b4;--jade-soft:#173a32;--saffron:#ff5a4e;--saffron-soft:#3d1a17;--ok:#5fd3b4;--ok-soft:#173a32;--todo:#141414;--todo-soft:#ffcd00}
html[data-theme="dark"] body{background:var(--bg);color:var(--ink)}
/* Boarding pass */
.pass{background:var(--surface);border:2px solid var(--line);border-radius:20px;box-shadow:4px 4px 0 var(--line);overflow:hidden;margin-bottom:12px}
.pass-top{display:flex;justify-content:space-between;align-items:center;background:#da251d;color:#fff;padding:10px 16px}
.pass-no{font:800 18px var(--display);letter-spacing:-.01em}.pass-by{font-size:12.5px;opacity:.9}
.pass-route{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:14px 16px 10px}
.pass-route div{display:grid}.pass-route b{font:800 34px/1 var(--display);letter-spacing:-.02em}.pass-route span{font-size:12.5px;color:var(--muted)}
.pass-route em{font-style:normal;font:700 17px var(--display);margin-top:6px}.pass-route small{color:var(--muted);font-size:12px}
.pass-plane{font-size:22px;color:#da251d}
.pass-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:2px dashed var(--line);padding:10px 16px;font-weight:700;font-size:14px}
.pass-foot span:first-child{background:#ffcd00;color:#141414;border-radius:8px;padding:2px 8px}
.pass-tips{margin:0;padding:0 16px 12px 32px;font-size:14px;color:var(--muted)}
.pass-tips li{margin:4px 0}
.jlcard{display:grid;gap:4px;text-decoration:none;color:inherit}
.jl{margin:0;padding:0;list-style:none;display:grid;gap:10px}.jl li{display:grid;gap:2px;padding-left:12px;border-left:3px solid var(--line)}.jl li.on{border-left-color:#da251d}.jl li.on b{color:#da251d}
.dots{margin:0;padding-left:18px}.dots li{margin:6px 0}
.sunrow{display:flex;gap:12px;align-items:center;margin-top:10px;padding-top:10px;border-top:1px dashed var(--muted)}.sunrow div{display:grid}.sunico{font-size:24px;color:#e8a100}
.card .dots:first-child{margin-top:0}
.hu summary{font-weight:700;cursor:pointer;list-style:none}.hu summary::after{content:" ›";color:var(--muted)}.hu[open] summary::after{content:""}
.regroup b{font:800 18px var(--display);display:block;margin:2px 0 6px}
.tmr-h{display:flex;gap:12px;align-items:center}.tmr-h div{display:grid}.tmr-ico{font-size:28px}
.rainplan{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--maybe-soft,#e6e2ff)}
.hop{font-size:12.5px;color:var(--muted);margin:-2px 0 4px}
.hrsrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.hrs{font-size:12px;color:var(--muted);background:var(--bg);border:1px solid var(--muted);border-radius:8px;padding:2px 7px}
.hrs.bad{color:#fff;background:#da251d;border-color:#da251d;font-weight:700}
.lookbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lookbtns button,.chipbtn,.hg-quick button{font:700 14px var(--body);padding:9px 10px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.lookbtns button[aria-pressed="true"],.chipbtn[aria-pressed="true"]{background:#ffcd00;color:#141414}
/* Say */
.haggle .hg-in{display:flex;align-items:center;gap:8px;margin:6px 0 8px}.haggle input,.mfind{font:600 20px var(--body);padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%;box-sizing:border-box}
.mfind{font-size:16px;margin-bottom:8px}
.hg-k{font:800 20px var(--display)}.hg-quick{display:flex;flex-wrap:wrap;gap:6px}.hg-quick button{padding:6px 10px;font-size:13px}
.hg-out{margin-top:12px;display:grid;gap:8px}.hg-usd{font-size:18px}.hg-row{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.hg-row b{font:800 18px var(--display)}
.menu{display:grid}.mw{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--muted)}.mw:last-child{border:0}.mw>span:first-child{display:grid}
.mw .sound{font-size:12px;color:var(--muted)}
.viw{display:flex;align-items:center;justify-content:space-between;gap:10px}
/* Map */
.mapchips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px}.chipbtn{white-space:nowrap}
.map{position:relative;height:min(62vh,520px);border:2px solid var(--line);border-radius:20px;overflow:hidden;background:#e8e4d8;touch-action:none;box-shadow:4px 4px 0 var(--line)}
.map-layer{position:absolute;inset:0;will-change:transform}
.map .mtile{position:absolute;width:256px;height:256px;user-select:none;-webkit-user-drag:none}
html[data-theme="dark"] .map .mtile{filter:brightness(.8) contrast(1.1)}
.mpin{position:absolute;transform:translate(-50%,-100%);border:0;background:none;padding:0;cursor:pointer}
.mpin span{display:grid;place-items:center;width:28px;height:28px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#da251d;border:2px solid #141414;box-shadow:2px 2px 0 #141414}
.mpin span{color:#fff;font:800 12px var(--display)}
.mpin i{font-style:normal;transform:rotate(45deg);display:block}
.map-ctl{position:absolute;right:10px;top:10px;display:grid;gap:6px}.map-ctl button{width:40px;height:40px;border-radius:12px;border:2px solid #141414;background:#fff;color:#141414;font:800 20px var(--display);box-shadow:2px 2px 0 #141414}
.map-attr{position:absolute;right:6px;bottom:4px;font-size:10px;color:#333;background:rgb(255 255 255 / .7);padding:1px 5px;border-radius:6px}
.pinnum{display:grid;place-items:center;font:800 18px var(--display);background:#ffcd00!important;color:#141414}
html,body{overscroll-behavior-x:none}

/* Batch 3 */
.wnbar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.back-link{margin-bottom:6px;justify-self:start;width:fit-content}
.card.wn{display:grid;grid-template-columns:36px 1fr;gap:12px;margin-bottom:12px}
.wn-n{font:800 26px/1 var(--display);color:var(--saffron)}
.wn-b{display:grid;gap:3px}.wn-b b{font:800 18px/1.15 var(--display)}
.wn-go{font-weight:700;font-size:14px}
details.cash summary{list-style:none;display:flex;gap:12px;align-items:center;cursor:pointer}
details.cash summary::-webkit-details-marker{display:none}
.cash-ico{font:800 26px/1 var(--display);width:44px;height:44px;display:grid;place-items:center;background:var(--todo-soft);color:var(--todo);flex:none}
details.cash summary>span:last-child{display:grid}
.cashl{list-style:none;margin:12px 0 0;padding:0}.cashl li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.card.brief{display:grid;gap:8px}.br-r{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:baseline}
.br-k{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.form select{font:16px var(--body);padding:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.sm-show{display:block;width:fit-content;margin-top:6px;padding:4px 10px;font-size:13px}
html.press .card.brief{background:var(--v);color:#000}html.press .card.brief .br-k{color:#000}
html.press .cash-ico{background:var(--y);color:#000;border:3px solid #000}
html.press .wn-n{color:var(--r);font-weight:900}
html.press .form select{border:3px solid var(--line);font-weight:700}

.hx{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:2px 0 4px}
.hx-c{display:grid;gap:2px;text-decoration:none;color:var(--ink);padding:12px}
.hx-c b{font:800 16px/1.1 var(--display)}
.fact p{margin:6px 0 0;font:17px/1.45 var(--read)}
.fact.sm p{font-size:15.5px}
.fact+.fact{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.fact-k{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--saffron)}
.fact-k span+span{color:var(--muted)}
.more-link{display:inline-block;margin-top:12px;font-weight:800}
.deck{min-height:220px;display:grid;align-content:space-between}
.deck .fact p{font-size:21px;line-height:1.4}
.deck-n{margin-top:12px}
.deck-btns{margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.tline{list-style:none;margin:0;padding:0;position:relative}
.tline li{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:0 0 18px;position:relative}
.tline li::before{content:"";position:absolute;left:104px;top:6px;bottom:-6px;width:3px;background:var(--line)}
.tline li:last-child::before{display:none}
.tline .ty{font:800 14px/1.2 var(--display);text-align:right;padding-top:2px}
.tline li>div{padding-left:14px}
.tline b{font:800 17px/1.2 var(--display)}
.tline p{margin:4px 0 4px;font:16px/1.45 var(--read)}
.pfacts{margin:12px 0 4px}.pfacts p{margin:6px 0;font:15.5px/1.45 var(--read)}
.tq-top{display:flex;justify-content:space-between;align-items:baseline;margin:4px 0 10px}
.tq-q{font:800 21px/1.25 var(--display);margin:0 0 14px}
.tq-opts{display:grid;gap:10px}
.tq-o{font:700 16px var(--body);text-align:left;padding:12px 14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.tq-o.right{background:var(--ok-soft);border-color:var(--ok)}
.tq-o.wrong{background:var(--saffron-soft);border-color:var(--saffron)}
.tq-note{margin:14px 0 10px;font:16px/1.45 var(--read)}
.board{margin:0;padding-left:20px}.board li{display:grid;grid-template-columns:1fr auto auto;gap:12px;padding:6px 0}
html.press .hx-c b{font-weight:900;letter-spacing:-.03em;text-transform:uppercase;font-size:15px}
html.press .hx-c:nth-child(1){background:var(--y);color:#000}html.press .hx-c:nth-child(2){background:var(--v);color:#000}html.press .hx-c:nth-child(3){background:var(--r);color:#000}
html.press .hx-c .muted{color:#000}
html.press .fact-k{color:var(--r)}
html.press .fact+.fact{border-top:3px solid var(--line)}
html.press .fact.dec{background:var(--y);color:#000;margin:14px -16px -16px;padding:14px 16px;border-top:3px solid #000}
html.press .fact.dec .fact-k span{color:#000}
html.press .tline li::before{background:var(--k)}
html.press .tline .ty{background:var(--y);color:#000;border:3px solid #000;padding:4px 6px;text-align:center;align-self:start;font-weight:900}
html.press .tq-o{border:3px solid var(--line);box-shadow:3px 3px 0 var(--line)}
html.press .tq-o:active{transform:translate(3px,3px);box-shadow:none}
html.press .tq-o.right{background:var(--v);color:#000}html.press .tq-o.wrong{background:var(--r);color:#000}

.hx{grid-template-columns:repeat(6,1fr)}.hx-c{grid-column:span 2}.hx-c:nth-child(4),.hx-c:nth-child(5){grid-column:span 3}
.hunt-top{display:flex;justify-content:space-between;align-items:center;gap:12px}.hunt-top>div{display:grid}.hunt-top b{font:800 28px/1 var(--display)}
.bounty-c{display:grid;gap:4px;margin-top:12px;text-decoration:none;color:var(--ink)}.bounty-c b{font:800 19px/1.2 var(--display)}
.hgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ht{position:relative;display:grid;align-content:start;gap:6px;padding:8px;border:2px solid var(--line);background:var(--surface);color:var(--ink);text-align:left;font:600 12.5px/1.25 var(--body);cursor:pointer}
.ht-img{aspect-ratio:1;display:grid;place-items:center;font-size:24px;background:var(--bg);overflow:hidden}
.ht-img img{width:100%;height:100%;object-fit:cover}
.ht-p{position:absolute;top:4px;right:4px;z-index:1;font:800 12px var(--display);background:var(--ink);color:var(--bg);padding:2px 6px}
.ht-c{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--saffron)}
.ht.got .ht-t{text-decoration:line-through;opacity:.7}
.hunt-big{width:100%;margin:12px 0 4px;border:2px solid var(--line)}
.lb{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.lb:first-child{border-top:0}
.lb-r{font:800 20px var(--display);text-align:center}.lb-n{display:grid}.lb-t{font:800 26px var(--display)}
html.press .ht{border:3px solid var(--line);box-shadow:3px 3px 0 var(--line)}
html.press .ht:active{transform:translate(3px,3px);box-shadow:none}
html.press .ht.got{background:var(--v);color:#000}html.press .ht.got .ht-c{color:#000}
html.press .ht.bounty{background:var(--y);color:#000}
html.press .ht-img{border:2px solid var(--line);background:var(--bg)}
html.press .ht-p{background:#000;color:var(--y)}
html.press .bounty-c{background:var(--y);color:#000}html.press .bounty-c .small{color:#000}
html.press .lb{border-top:3px solid var(--line)}html.press .lb:first-child{border-top:0}html.press .lb.me{background:var(--y);color:#000;margin:0 -16px;padding:10px 16px}html.press .lb.me .muted{color:#000}
html.press .lb-t{font-weight:900}
html.press .hx-c:nth-child(4){background:var(--surface);color:var(--ink)}html.press .hx-c:nth-child(4) .muted{color:var(--muted)}
html.press .hx-c:nth-child(5){background:#000;color:var(--y)}html.press .hx-c:nth-child(5) .muted{color:var(--y)}
.gm{display:flex;justify-content:space-between;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}.gm>span:first-child{display:grid}.gm b{font:800 18px/1.2 var(--display)}
.gm-p{font:800 26px var(--display)}
.gb-row{grid-template-columns:110px 1fr!important;align-items:center;font-size:15px!important;color:var(--ink)!important}
.gb-actual{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.gb-actual .chips{margin:0}
.gb-actual input{font:16px var(--body);padding:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.gb-res{margin-top:12px}.gb-win{font:800 26px/1.2 var(--display);margin:6px 0 10px}
.gb-list{margin:0;padding-left:20px}.gb-list li{display:grid;grid-template-columns:1fr auto 80px;gap:10px;padding:4px 0}.gb-list li span:last-child{text-align:right}
.gb-past{display:grid;padding:6px 0;border-top:1px solid var(--line)}.gb-past:first-child{border-top:0}
.sp-h{display:flex;justify-content:space-between;gap:10px;align-items:start}.sp-h b{font:800 17px/1.2 var(--display)}
.linkbtn{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;font:inherit;cursor:pointer}
html.press .gm-p{font-weight:900;color:var(--r)}
html.press .gb-res{background:var(--y);color:#000}html.press .gb-res .muted{color:#000}
html.press .gb-actual input{border:3px solid var(--line);font-weight:700}
html.press .gb-past{border-top:3px solid var(--line)}html.press .gb-past:first-child{border-top:0}
html.press .card.sp.done{background:var(--v);color:#000}html.press .card.sp.done .sound{color:#000}

/* ===== Design pass: one loud thing per screen (the poster headline), quiet sentence-case labels,

/* ===== Street look (default): Hội An yellow walls + Hanoi enamel street signs. Night = navy with lantern red. ===== */

.plate{display:inline-block;justify-self:start;background:var(--city,var(--b));border-radius:10px;padding:5px;box-shadow:0 2px 0 #0003;color:#fff}
.plate .in{border:2px solid #fff;border-radius:7px;padding:4px 14px 11px;display:grid}
.plate .sm{font:600 12.5px var(--body);opacity:.92}
.plate .nm{font:800 52px/.9 var(--sign);text-transform:uppercase;letter-spacing:.01em}
.sign{display:inline-block;background:var(--city,var(--b));border-radius:7px;padding:3px;position:relative;z-index:1}
.sign>span{display:block;border:1.5px solid #fff;border-radius:5px;color:#fff;font:800 21px/1 var(--sign);text-transform:uppercase;padding:5px 10px 4px;letter-spacing:.02em}

/* Today hero: full-bleed photo slideshow */
.shero{position:relative;height:min(320px,44vh);min-height:270px;margin:-16px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;color:#fff;background:#2a2a2a;overflow:hidden}
.shero .slides,.shero .sl{position:absolute;inset:0}
.shero .sl{opacity:0;transition:opacity 1.2s ease;border-radius:0}
.shero .sl.on{opacity:1}
.shero .sl img{transform:scale(1.04);transition:transform 7s linear}
.shero .sl.on img{transform:scale(1.1)}
.shero::after{content:"";position:absolute;inset:0;background:linear-gradient(#0006,#0000 28%,#0000 42%,#000c);pointer-events:none}
.shero>.tx,.shero>.capchip{position:absolute;z-index:1}
.shero .capchip{right:12px;top:12px;font:600 12px var(--body);background:#000a;padding:4px 9px;border-radius:20px;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shero .tx{left:16px;right:16px;bottom:14px;display:grid}
.shero .d{font:600 14px var(--body);margin:0 0 6px 2px;text-shadow:0 1px 3px #0008}
.shero .t{font:700 19px/1.25 var(--body);margin:8px 0 0 2px;text-shadow:0 1px 3px #0008;text-wrap:balance}
.shero .sdots{display:flex;gap:8px;margin:10px 0 0 2px}.shero .sdots i{width:6px;height:6px;border-radius:3px;background:#fff8;transition:transform .35s cubic-bezier(.2,.8,.2,1),background-color .35s;transform-origin:left}.shero .sdots i.on{background:#fff;transform:scaleX(1.6)}.shero .sdots i.on+i{margin-left:4px}
@media (prefers-reduced-motion: reduce){.shero .sl,.shero .sl img{transition:none;transform:none}}

/* Today: the yellow wall with now and next */
.swall{background:var(--wall);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:14px max(16px,env(safe-area-inset-left,0px)) 12px;display:grid}
html.street main .wrap>.swall{margin-top:-16px}
.nowc{background:var(--b);color:#fff;border-radius:10px;padding:14px 14px 14px 16px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;margin-bottom:8px}
.nowc .k{font:600 13px var(--body);color:#d6e2f6;display:block;margin-bottom:2px}
.nowc b{font:700 18px/1.25 var(--body);display:block}
.nowc .num{background:#fff}
.nx{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:10px 0;border-top:2px solid #0000001a;align-items:center;color:#1d1a14}
.nx b{font:600 16px/1.3 var(--body);display:block}.nx small{font-size:13px;color:#4c4330}
.lan{display:inline-flex;align-items:center;gap:4px;font:700 12.5px var(--body);color:#a3201d;margin-right:4px}
.lan::before{content:"";width:9px;height:11px;border-radius:50%/45%;background:currentColor}
.swall .wnbar{margin:8px 0 2px}.swall .wnbar .btn{flex:1}
.pullhint{font:600 12.5px var(--body);color:#4c4330;text-align:center;margin:4px 0 -4px;opacity:.8}
html.street[data-theme="dark"] .swall{background:#0d1830;color:var(--ink);border-bottom:2px solid var(--line)}
html.street[data-theme="dark"] .nowc{background:var(--lan)}
html.street[data-theme="dark"] .nowc .k{color:#ffe1dc}
html.street[data-theme="dark"] .nowc .num>span{color:var(--lan);border-color:var(--lan)}
html.street[data-theme="dark"] .nx{color:var(--ink);border-top-color:#ffffff1f}
html.street[data-theme="dark"] .nx small,html.street[data-theme="dark"] .pullhint{color:#b9c3d6}
html.street[data-theme="dark"] .num{background:#0d1830}
html.street[data-theme="dark"] .num>span{border-color:#8fb0ea;color:#cfe0ff}
html.street[data-theme="dark"] .lan{color:#ff8a7a}
html.street[data-theme="dark"] .lan::before{box-shadow:0 0 8px #ff6a5c}
html.street[data-theme="dark"] .swall .btn:not(.solid){background:transparent}

.facts3{display:grid;grid-template-columns:repeat(3,1fr);border-top:2px solid var(--line);border-bottom:2px solid var(--line)}
.facts3>*{padding:9px 0 9px 10px;min-width:0;text-align:left;background:none;border:0;color:inherit;font:inherit}
.facts3>*+*{border-left:2px solid var(--line)}.facts3>:first-child{padding-left:0}
.facts3 small{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.facts3 b{font:800 19px var(--body);letter-spacing:-.02em;display:block;white-space:nowrap}
.rainbar{background:var(--saffron-soft);border-radius:10px;padding:12px 14px}
.rainbar .rainplan{margin:0;border:0;padding:0;background:none}

/* Plan: the route */
.ptop{display:grid;gap:8px}
.ptop .prog{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.ptop .prog i{display:block;height:100%;background:var(--b);border-radius:4px}
.ptop .pl{font:600 13.5px var(--body);color:var(--muted)}
.route2{position:relative;display:grid;gap:8px}
.route2::before{content:"";position:absolute;left:27px;top:30px;bottom:30px;border-left:3px dotted var(--b);opacity:.7}
.route2 .grp{display:grid;gap:8px}
.route2 .grp>.sign{justify-self:start;margin-top:8px}
html.street .route2 details.day{border:0;background:transparent;border-radius:10px;overflow:visible}
html.street .route2 details.day[open]{background:var(--surface);box-shadow:inset 0 0 0 2px var(--line)}
html.street .route2 details.day summary{grid-template-columns:54px 1fr 68px;padding:6px 0}
html.street .route2 details.day[open] summary{padding:6px 8px 6px 0}
html.street .route2 .thumb{width:68px;height:60px;border-radius:6px;border:0}
html.street details.day .date{background:var(--surface);color:var(--b);border-radius:7px;padding:5px 0;width:54px;box-shadow:inset 0 0 0 2px var(--b);position:relative;z-index:1;gap:1px}
html.street details.day .date .dnum{font:800 25px/1 var(--sign)}
html.street details.day .date .dow,html.street details.day .date .mon{font:600 11.5px var(--body);color:inherit;letter-spacing:0;text-transform:none}
html.street details.day .date .mon{display:none}
html.street details.day.is-today .date{background:var(--lan);color:#fff;box-shadow:inset 0 0 0 2px var(--lan),inset 0 0 0 3.5px #fff}
html.street[data-theme="dark"] details.day .date{background:#0d1830;color:#cfe0ff;box-shadow:inset 0 0 0 2px #8fb0ea}
html.street[data-theme="dark"] details.day.is-today .date{background:var(--lan);color:#fff;box-shadow:inset 0 0 0 2px var(--lan),inset 0 0 0 3.5px #fff}
html.street .sumtext .place{font:600 12.5px var(--body);color:var(--muted);text-transform:none;letter-spacing:0}
html.street .sumtext .title{font:700 16px/1.25 var(--body)}
html.street details.day.is-today .sumtext .place{color:var(--r-ink);font-weight:700}
html.street .route2 details.day.past .sumtext .title{color:var(--muted)}
.dstamp{display:inline-flex;align-items:center;gap:8px;margin-top:4px;font:800 12px/1 var(--sign);letter-spacing:.06em;text-transform:uppercase;color:var(--r-ink);border:2px solid currentColor;border-radius:5px;padding:4px 7px 3px;transform:rotate(-2.5deg);opacity:.9}
html.street .daybody{padding:0 12px 12px}

/* Explore tiles */
.xgrid{display:grid;grid-template-columns:1fr 1fr;grid-auto-flow:dense;gap:12px;grid-auto-rows:minmax(112px,auto)}
.xt{border-radius:10px;padding:12px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;text-decoration:none;color:var(--ink);background:var(--surface);box-shadow:inset 0 0 0 2px var(--line);border:0;text-align:left;font:inherit}
.xt b{font:800 19px/1.12 var(--body);letter-spacing:-.02em}.xt small{font:600 12.5px/1.3 var(--body);display:block;margin-bottom:2px}
.xt.wide{grid-column:1/-1;min-height:150px}
.xt.ph1{color:#fff;box-shadow:none;background:#333}.xt.ph1 .ph{position:absolute;inset:0;border-radius:0}
.xt.ph1::before{content:"";position:absolute;inset:0;background:linear-gradient(#0000 30%,#000c);z-index:1}.xt.ph1>:not(.ph){position:relative;z-index:2}
.xt.y{background:var(--wall);color:#1d1a14;box-shadow:none;grid-row:span 2;justify-content:space-between}
.xt.y p{font:600 16px/1.4 var(--body);margin:8px 0}
.xt.y .more{font:700 13.5px var(--body);color:#1f4e9a;background:none;border:0;padding:8px 0 0;text-align:left;min-height:44px}
.xt.b{background:var(--b);color:#fff;box-shadow:none}.xt.r{background:var(--lan);color:#fff;box-shadow:none}
.xt .big{position:absolute;top:8px;right:12px;font:800 32px/1 var(--sign);opacity:.95}
html.street[data-theme="dark"] .xt.y{background:#f2c94c}
.tlbar{display:block;height:68px;border-radius:10px;background:#1d1a14;color:#f2c94c;position:relative;padding:10px 14px;text-decoration:none;font:800 12px var(--sign);letter-spacing:.05em}
html.street[data-theme="dark"] .tlbar{background:#060d1c;box-shadow:inset 0 0 0 2px var(--line)}
.tlbar .yrs{display:flex;justify-content:space-between}
.tlbar::before{content:"";position:absolute;left:14px;right:14px;top:30px;border-top:2px solid #f2c94c66}
.tlbar b{position:absolute;left:14px;bottom:10px;font:700 15px var(--body);color:#fff;letter-spacing:0}

/* Leaderboard: lanterns */
.lstring{position:relative;height:210px;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));background:var(--wall)}
.lstring svg.wire{position:absolute;inset:0;width:100%;height:100%}
.lstring .ln{position:absolute;display:grid;justify-items:center;text-align:center;transform:translateX(-50%);transform-origin:50% 0}
.ln .cord{width:2px;background:#5a3d1a}
.ln .bod{background:var(--lan);border-radius:50%/42%;display:grid;place-items:center;color:#fff;font:800 22px/1 var(--sign);position:relative;box-shadow:inset -8px 0 0 #0002}
.ln .bod::before,.ln .bod::after{content:"";position:absolute;left:26%;right:26%;height:6px;background:#7a1a1a;border-radius:2px}
.ln .bod::before{top:-4px}.ln .bod::after{bottom:-4px}
.ln .tas{width:2px;height:14px;background:#7a1a1a}
.ln .nm{font:700 14px var(--body);margin-top:2px;color:#1d1a14}
.ln.me .bod{background:var(--b)}.ln.me .bod::before,.ln.me .bod::after,.ln.me .tas{background:#123366}
html.street[data-theme="dark"] .lstring{background:#0d1830}
html.street[data-theme="dark"] .ln .nm{color:#f6efe0}
html.street[data-theme="dark"] .ln .cord{background:#8a7350}
html.street[data-theme="dark"] .ln .bod{background:radial-gradient(circle at 45% 40%,#ffb36b,#e0442f 55%,#a5231b);box-shadow:0 0 22px 4px #ff6a3d66,0 0 60px 10px #ff6a3d22}
html.street[data-theme="dark"] .ln.me .bod{background:radial-gradient(circle at 45% 40%,#bcd6ff,#3d74d6 55%,#1f4e9a);box-shadow:0 0 22px 4px #5b9bff66}
html.street[data-theme="dark"] .ln{animation:sway 4.5s ease-in-out infinite alternate}
html.street[data-theme="dark"] .ln:nth-child(2n){animation-duration:5.3s;animation-delay:-1.4s}
@keyframes sway{from{transform:translateX(-50%) rotate(-3deg)}to{transform:translateX(-50%) rotate(3deg)}}
@media (prefers-reduced-motion: reduce){html.street[data-theme="dark"] .ln{animation:none}}
.lb-head{background:var(--wall);margin:-16px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;padding:6px max(16px,env(safe-area-inset-left,0px)) 0}
.lb-head h2{margin:0}
.lb-head .live-st{margin:4px 0 0;color:var(--wall-ink)}
.feed>div{display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:center;padding:8px 0;border-bottom:2px solid var(--line)}
.feed>div:last-child{border-bottom:0}
.feed p{margin:0;font-size:14.5px;line-height:1.3}.feed em{font:600 12.5px var(--body);color:var(--muted);font-style:normal;text-align:right;white-space:nowrap}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:800 14px var(--body);background:var(--line);color:var(--ink)}
.av.me{background:var(--b);color:#fff}
.mine{display:flex;gap:4px 12px;align-items:baseline;flex-wrap:wrap;font-size:14px}.mine>span{color:var(--muted);margin-right:auto}.mine b{font-weight:700}.mine .tot{color:var(--b);font:800 22px var(--sign)}
html.street[data-theme="dark"] .mine .tot{color:#cfe0ff}

/* Next stop sheet, Carry sheet */
.ns-k{font:700 13px var(--body);color:var(--muted)}
.ns-move{display:flex;gap:8px;align-items:center;font:600 14px var(--body)}
.ns-move svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;flex:none}

/* Driver card in street-sign style */
html.street .driver{background:var(--b);color:#fff;padding:max(28px,env(safe-area-inset-top,0px)) 18px 28px}
html.street .driver::before{content:"";position:absolute;inset:max(14px,env(safe-area-inset-top,0px)) 12px 14px;border:4px solid #fff;border-radius:16px;pointer-events:none}
html.street .driver .big{font:800 clamp(38px,12vw,64px)/1.02 var(--sign);text-transform:uppercase;letter-spacing:.01em}
html.street .driver .sm{color:#e3ebf7;font:600 19px/1.35 var(--body)}
html.street .driver .hint{color:#c9d8f2}
html.street .driver .play{background:#fff;color:var(--b);font-weight:700}

/* Info plates */
.iplates{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.iplate{display:grid;gap:2px;text-align:left;background:var(--surface);color:var(--ink);border:0;border-radius:8px;padding:10px 12px;box-shadow:inset 0 0 0 2px var(--b);font:inherit;min-height:56px;text-decoration:none}
.iplate small{font:600 12px/1.25 var(--body);color:var(--muted)}
.iplate b{font:800 22px/1.05 var(--sign);color:var(--b);letter-spacing:.01em;word-break:break-word}
.iplate.wide{grid-column:1/-1}
.iplate.sos{background:var(--lan);box-shadow:none}.iplate.sos small{color:#ffe1dc}.iplate.sos b{color:#fff;font-size:28px}
html.street[data-theme="dark"] .iplate{box-shadow:inset 0 0 0 2px #5b82c9}
html.street[data-theme="dark"] .iplate b{color:#cfe0ff}
html.street[data-theme="dark"] .iplate.sos{box-shadow:none}html.street[data-theme="dark"] .iplate.sos b{color:#fff}

/* Recap: split-flap board */
.flap{background:#15130f;border-radius:12px;padding:12px;display:grid;gap:8px;color:#f6efe0}
.flap .fr{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.flap .tiles{display:flex;gap:4px;flex-wrap:wrap}
.flap .tiles i,.flap .rk i,.flap .pts i{font:800 22px/1 var(--sign);font-style:normal;width:20px;height:30px;display:grid;place-items:center;background:#2a2620;border-radius:3px;position:relative;color:#f2c94c;text-transform:uppercase}
.flap .tiles i::after,.flap .rk i::after,.flap .pts i::after{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px solid #0009}
.flap .tiles i.s::after{display:none}
.flap .rk{display:flex}.flap .pts{display:flex;gap:2px}

.flap .fr.flip i{animation:flipin .5s var(--ease,ease) both}
@keyframes flipin{0%{transform:rotateX(90deg);color:#f6efe0}100%{transform:none}}
.flap .fr.win .tiles i,.flap .fr.win .pts i{background:var(--lan);color:#fff}
.rcol{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rcol .hi{aspect-ratio:1;border-radius:6px;background:var(--line);overflow:hidden;display:grid;place-items:center;font:700 11.5px var(--body);color:var(--muted);text-align:center;padding:4px}
.rcol .hi img{width:100%;height:100%;object-fit:cover}
.moments{display:grid;gap:8px}.moments>div{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
#raintop:empty{display:none}
/* Postcard leftovers, re-dressed for the street look */
html.street .pass{box-shadow:none;border-radius:12px}
html.street .pass-top{background:var(--b)}
html.street .pass-route b{font:800 40px/1 var(--sign);letter-spacing:.01em}
html.street .pass-plane{color:var(--b)}
html.street .pass-foot span:first-child{background:#f2c94c;color:#1d1a14}
html.street .ph{background:var(--line)}
html.street .ph.thumb.none::before{content:"";}
html.street .lookbtns button[aria-pressed="true"],html.street .chipbtn[aria-pressed="true"]{background:var(--b);color:#fff}
html.street .jl li.on{border-left-color:var(--lan)}html.street .jl li.on b{color:var(--r-ink)}
html.street .map{box-shadow:none;border-radius:12px}
html.street .mpin span{background:var(--lan);border-color:#fff;box-shadow:0 1px 3px #0006}
html.street .pinnum{background:#f2c94c!important}
html.street .tsize button{border-radius:8px}
html.street .hero{border-radius:12px}
html.street .pin.listen{background:#f2c94c;color:#1d1a14}
html.street .gcard,html.street .gcard.closest{box-shadow:none}html.street .gcard.closest{border-color:var(--b)}
html.street .bigplay{background:var(--b);border:0;box-shadow:none}
html.street .speaking{background:#f2c94c;color:#1d1a14;box-shadow:-6px 0 0 #f2c94c,6px 0 0 #f2c94c}
html.street .mp .in{border:2px solid var(--line);box-shadow:0 4px 16px #0002}
html.street .mp button.pp{background:var(--b)}
.lb-back{display:inline-flex;align-items:center;min-height:44px;font:700 14.5px var(--body);color:var(--b);text-decoration:none}
html.street[data-theme="dark"] .lb-back{color:#cfe0ff}
html.street[data-theme="dark"] .nowc .num{background:#fff}
.flap .fr.hid .tiles i,.flap .fr.hid .pts i{color:transparent!important;background:#2a2620!important}
html.street .pin{min-height:40px}
html.street .seg a{padding:12px 0}
html.street details.day .date .dow,html.street .chip{font-size:12px}
html.street .tl li.now{background:var(--jade-soft);color:var(--ink)}
html.street .tl li.now .w,html.street .tl li.now .t{color:var(--ink)}
html.street .tl li.now .t{color:var(--b);font-weight:700}
html.street[data-theme="dark"] .tl li.now .t{color:#cfe0ff}
html.street[data-theme="dark"] .nowc .k{color:#fff}
.iplate.sos small{color:#fff!important}
.todo{padding:4px 14px}
.todo-r{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:start;padding:12px 0;border-bottom:2px solid var(--line);cursor:pointer}
.todo-r:last-child{border-bottom:0}
.todo-r input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--b)}
.todo-r b{display:block;font:700 15px/1.3 var(--body)}.todo-r small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.todo-r em{grid-column:2/4;font:600 12.5px var(--body);font-style:normal;color:var(--muted)}
.todo-r .num>span{min-width:0;font-size:16px;padding:4px 7px 3px}
.todo-r.soon .num{background:var(--lan)}.todo-r.soon .num>span{color:#fff;border-color:#fff}
.todo-r.soon em{color:var(--r-ink)}
.todo-r.done b{text-decoration:line-through;color:var(--muted)}.todo-r.done .num{opacity:.6}
.sv-h{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}
.sv-h b{display:block;font:700 17px/1.25 var(--display)}.sv-h .vi{display:block;font-size:13.5px;color:var(--muted);margin-top:2px}
.sv p{margin:8px 0 6px;font-size:14.5px;line-height:1.45}
.sv-row{display:grid;grid-template-columns:78px 1fr;gap:8px;font-size:13.5px;padding:3px 0}
.sv .num>span{font-size:17px;min-width:0;padding:4px 7px 3px}
/* Timeline: pinned year dial */
.tlx-top{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr,50px));z-index:3;height:max(250px,36vh);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));overflow:hidden;color:#fff;background:#1d1a14}
.tlx-top .ph{position:absolute;inset:0;border-radius:0;opacity:0;transition:opacity .8s ease}
.tlx-top .ph.on{opacity:1}
.tlx-top .ph img{transform:scale(1.04);transition:transform 6s linear}.tlx-top .ph.on img{transform:scale(1.12)}
.tlx-top::after{content:"";position:absolute;inset:0;background:linear-gradient(#0006,#0000 30%,#000d);pointer-events:none}
.tlx-top .dial{position:absolute;left:16px;right:16px;bottom:20px;z-index:2}
.tlx-top small{font:700 13px var(--body);opacity:.9;display:block;margin-bottom:4px}
.tlx-top .year{font:800 76px/.85 var(--sign);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:clip}
.tlx-top .ttl{font:700 19px/1.25 var(--body);margin-top:8px;min-height:24px;text-shadow:0 1px 3px #0008}
.tlx-top .rail{position:absolute;left:16px;right:16px;bottom:8px;height:4px;background:#ffffff33;border-radius:2px;z-index:2}
