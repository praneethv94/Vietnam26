(function(){
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"], DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const parse = iso => { const [y,m,d]=iso.split("-").map(Number); return new Date(y,m-1,d); };
const isoOf = dt => dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");
const LABEL = {booked:"Booked", todo:"To book", maybe:"Not decided"};
const chip = s => s ? `<span class="chip ${s}">${LABEL[s]}</span>` : "";
const mapUrl = q => "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q);
const store = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}, del(k){try{localStorage.removeItem(k)}catch(e){}} };

let T = null;

function todayIso(){
  let d = null;
  try { d = new URLSearchParams(location.search).get("d"); } catch(e){}
  return d && /^\d{4}-\d{2}-\d{2}$/.test(d) ? d : isoOf(new Date());
}
const stayById = id => T.stays.find(s=>s.id===id);

function dayCard(d, opts={}){
  const dt = parse(d.date), st = d.stay ? stayById(d.stay) : null;
  const dph = d.photo || ((T.flights||[]).find(f=>f.date===d.date)||{}).photo || (st&&st.photo) || "";
  const nowI = opts.today && d.date===todayIso() ? (nowNext(d).cur||{}).i : null;
  let prevP=null;
  const items = d.items.map((x,i)=>[x[0],x[1],x[2],i,x[3]]).filter(x=>!(x[4]==="pb" && !PB())).map(([t,w,s,i])=>{ const ps=placesFor(w,d.city), gs=guidesFor(w); const pc=ps.filter(p=>COORD(p.name)); const hop=(prevP&&pc[0])?hopHtml(prevP,pc[0]):""; if(pc.length) prevP=pc[pc.length-1];
    return `<li data-i="${i}"${i===nowI?' class="now"':""}><div class="t">${esc(t)}</div><div class="w">${hop}${esc(w)} ${chip(s)}${hoursHtml(ps,d.date)}${ps.length||gs.length?`<div class="pins">${gs.map(listenPin).join("")}${ps.map(pinBtn).join("")}</div>`:""}</div></li>`; }).join("");
  const night = (!PB() && d.date==="2026-12-13") ? "" : d.night ? esc(d.night) : st ? `<a href="#stay-${st.id}">${esc(st.name)}</a> ${st.status!=="booked"?chip(st.status):""}` : "";
  return `<details class="day${opts.today?" is-today":""}${opts.past?" past":""}" id="day-${d.date}"${opts.open?" open":""}>
    <summary><div class="date"><span class="dow">${DOW[dt.getDay()]}</span><span class="dnum">${dt.getDate()}</span><span class="mon">${MON[dt.getMonth()]}</span></div>
      <div class="sumtext"><div class="place">${esc(d.place)}</div><div class="title">${esc(d.title)}</div>${opts.stamp||""}</div>${dph?`<div class="ph thumb" data-lead="${esc(dph)}"></div>`:`<span class="caret" aria-hidden="true"></span>`}</summary>
    <div class="daybody">${dph?`<div class="ph banner" data-lead="${esc(dph)}"></div>`:""}${d.note?`<div class="note">${esc(d.note)}</div>`:""}<ul class="tl">${items}</ul>
      ${night?`<div class="night"><span class="muted">Tonight:</span> ${night}</div>`:""}${checklistHtml(d)}</div></details>`;
}

const STOPS = [["Saigon","2026-12-06"],["Hoi An","2026-12-07"],["Da Nang","2026-12-08"],["Hanoi","2026-12-09"]];
function routeSvg(iso){
  const W=320, pts = STOPS.map((s,i)=>[12+i*(W-24)/(STOPS.length-1), i%2?30:16]);
  let k = -1; STOPS.forEach((s,i)=>{ if (iso>=s[1]) k=i; });
  const path = "M"+pts.map(p=>p.join(",")).join(" L");
  const stops = pts.map((p,i)=>`<circle class="stop${i<=k?" past":""}" cx="${p[0]}" cy="${p[1]}" r="3.5"/><text x="${p[0]}" y="${i%2?44:7}" text-anchor="${i===0?"start":i===pts.length-1?"end":"middle"}" dx="${i===0?-6:i===pts.length-1?6:0}">${STOPS[i][0]}</text>`).join("");
  const me = k>=0 ? `<circle class="halo" cx="${pts[k][0]}" cy="${pts[k][1]}" r="5"/><circle class="me" cx="${pts[k][0]}" cy="${pts[k][1]}" r="5"/>` : "";
  return `<div class="route" aria-hidden="true"><svg viewBox="0 0 ${W} 46"><path class="track" d="${path}"/><path class="done" data-k="${k}" d="${path}"/>${stops}${me}</svg></div>`;
}
function sizeRoute(){
  const p = document.querySelector(".route .done"); if(!p) return;
  const len = p.getTotalLength(), k = +p.dataset.k, n = STOPS.length-1;
  const frac = k>=0 ? k/n : 0;
  p.style.setProperty("--len", len); p.style.setProperty("--off", len*(1-frac));
}

// Photos from Wikipedia and Wikimedia Commons, fetched when online and kept for offline use.
const W = "https://en.wikipedia.org/api/rest_v1/page/";
const wkey = t => encodeURIComponent(t.replace(/ /g,"_"));
const BAD = /(\.svg|\.gif|flag|coat_of_arms|logo|location|locator|map|seal_of|emblem|icon|signature)/i;
async function cachedJson(k, url){
  try{ const c=JSON.parse(store.get(k)||"null"); if(c) return c; }catch(e){}
  try{ const r=await fetch(url); if(!r.ok) throw 0; const j=await r.json(); return j; }catch(e){ return null; }
}
// Bundled photos first (shipped with the app, work offline from the first open), Wikipedia only for anything not bundled.
async function wikiLead(title){
  const B = T.photos; if (B && title in B.lead) return B.lead[title];
  const k="wl-"+title; try{ const c=store.get(k); if(c) return JSON.parse(c); }catch(e){}
  const j = await cachedJson(k, W+"summary/"+wkey(title)); if(!j) return null;
  const src = j.thumbnail?.source ? j.thumbnail.source.replace(/\/\d+px-/,"/960px-") : j.originalimage?.source;
  if (!src || BAD.test(src)) { store.set(k, "null"); return null; }
  const out = {src, cap: j.title, link: j.content_urls?.mobile?.page || ("https://en.wikipedia.org/wiki/"+wkey(title))};
  store.set(k, JSON.stringify(out)); return out;
}
async function wikiGallery(title){
  const B = T.photos; if (B && B.gallery[title]) return B.gallery[title];
  const k="wg-"+title; try{ const c=store.get(k); if(c) return JSON.parse(c); }catch(e){}
  const j = await cachedJson(k, W+"media-list/"+wkey(title)); if(!j) return [];

function sunset(lat, lon, iso, tz){
  const d = parse(iso), n = Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()) - Date.UTC(d.getFullYear(),0,0))/864e5);
  const g = 2*Math.PI/365*(n-1);
  const eq = 229.18*(0.000075+0.001868*Math.cos(g)-0.032077*Math.sin(g)-0.014615*Math.cos(2*g)-0.040849*Math.sin(2*g));
  const dec = 0.006918-0.399912*Math.cos(g)+0.070257*Math.sin(g)-0.006758*Math.cos(2*g)+0.000907*Math.sin(2*g)-0.002697*Math.cos(3*g)+0.00148*Math.sin(3*g);
  const r = Math.PI/180, ha = Math.acos(Math.cos(90.833*r)/(Math.cos(lat*r)*Math.cos(dec))-Math.tan(lat*r)*Math.tan(dec))/r;
  return (720 - 4*(lon - ha) - eq)/60 + tz;
}

function untilTxt(ms){ if(ms<=0) return "Departed"; const m=Math.round(ms/6e4), h=Math.floor(m/60); return h>=24 ? `in ${Math.round(h/24)} days` : h ? `in ${h} h ${m%60} min` : `in ${m} min`; }
function passCard(l){

  return `<div class="pass"><div class="pass-top"><span class="pass-no">${esc(l.no)}</span><span class="pass-by">${esc(l.by)}</span></div>

    <div class="pass-foot">${localDate(l.dep)!==todayIso() && localDate(l.arr)===todayIso() ? `<span>Lands ${esc(localTime(l.arr))}</span>` : `<span data-dep="${esc(l.dep)}">${ms>0?"Departs "+untilTxt(ms):"Departed"}</span>`}${l.seats?`<span>Seats ${esc(l.seats)}</span>`:""}</div>
    ${(l.tips||[]).length?`<ul class="pass-tips">${l.tips.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`:""}</div>`;
}

// Evening: what's first tomorrow, an alarm time, and what to bring.
function parseItemTime(t){ const m=String(t).match(/(\d{1,2})(?::(\d{2}))?\s*(AM|PM)/i); if(!m) return null; let H=+m[1]%12; if(/pm/i.test(m[3])) H+=12; return H+(+(m[2]||0))/60; }
function tomorrowHtml(iso){
  const i = T.days.findIndex(d=>d.date===iso), nd = T.days[i+1]; if(!nd) return "";
  const h = nowH(), test = new URLSearchParams(location.search).get("eve");
  if (h < 17 && !test) return "";
  const first = nd.items.find(x=>parseItemTime(x[0])!=null), leg = legsOn(nd.date).find(l=>localDate(l.dep)===nd.date);
  let alarm = null, why = "";
  const early = nd.items.map(x=>[parseItemTime(x[0]),x]).filter(([t])=>t!=null && t>=4).sort((a,b)=>a[0]-b[0])[0];
  if (early){ alarm = early[0] - 1; why = `${early[1][0]}: ${early[1][1]}`; }
  if (leg){ const [H,M]=leg.dep.slice(11,16).split(":").map(Number), la = H+M/60 - (/SRQ|DAD/.test(leg.from)?2.5:3.5); if (alarm==null || la < alarm){ alarm = la; why = `${leg.no} departs ${localTime(leg.dep)}`; } }
  const bring = checklistFor(nd);
  return `<h3>Tonight: get ready for ${esc(DOW[parse(nd.date).getDay()])}</h3><div class="card tmr"><div class="tmr-h"><span class="tmr-ico">${ico("alarm")}</span><div>${alarm!=null?`<b>Set an alarm for ${hm(Math.max(alarm,4))}</b>`:`<b>No early start</b>`}<span class="small muted">${esc(why||nd.title)}</span></div></div>
    ${bring.length?`<div class="sub-h">Lay out tonight</div><ul class="dots">${bring.map(([t,w])=>`<li><b>${esc(t)}</b> <span class="muted">${esc(w)}</span></li>`).join("")}</ul>`:""}</div>`;
}

// Rain plan: when the forecast says rain, suggest indoor backups.
function rainHtml(city, pct){

  return `<div class="rainplan"><b>${ico("umbrella")} ${pct}% chance of rain. Indoor backups:</b><ul class="dots">${R.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`;

// Opening notes and the hop between stops, inside the day plan.
const COORD = name => (MOg().coords||{})[name];
function hav(a,b){ const r=Math.PI/180, dl=(b[0]-a[0])*r, dn=(b[1]-a[1])*r, x=Math.sin(dl/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dn/2)**2; return 12742*Math.asin(Math.sqrt(x)); }
function hopHtml(a, b){
  const A=COORD(a.name), B=COORD(b.name); if(!A||!B||a===b) return "";
  const km = hav(A,B)*1.3; if (km < 0.15 || km > 40) return "";
  const walk = Math.round(km/4.5*60), grab = Math.round(4 + km/20*60), fare = Math.max(30, Math.round((12 + km*14)/5)*5);
  return `<div class="hop">↳ From ${esc(a.name)}: ${km<1?Math.round(km*1000)+" m":km.toFixed(1)+" km"} · ${walk<=25?`${walk} min walk`:`Grab ~${grab} min, ~${fare}k ₫`}${walk<=25&&walk>12?` (Grab ~${grab} min)`:""}</div>`;
}
function hoursHtml(ps, iso){
  const wd = parse(iso).getDay(), out=[];
  for (const p of ps){ const H=(MOg().hours||{})[p.name]; if(!H) continue;
    if (H.closed && H.closed.includes(wd)) out.push(`<span class="hrs bad">${esc(p.name)} is closed on ${DOW[wd]}s</span>`);
    else if (H.open && !H.open.includes(wd)) out.push(`<span class="hrs bad">${esc(p.name)}: not open on ${DOW[wd]}s</span>`);
    else if (H.show && !H.show.includes(wd)) out.push(`<span class="hrs">${esc(H.note)} Not tonight.</span>`);
    else out.push(`<span class="hrs">${esc(H.note)}</span>`); }
  return out.length ? `<div class="hrsrow">${out.join("")}</div>` : "";
}

// Calendar reminders (.ics): flights and key moments, with alerts.
function icsDate(s){ return new Date(Date.parse(s)).toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,""); }
function icsText(){
  const ev=[], esc2=s=>String(s).replace(/[,;\\]/g,m=>"\\"+m).replace(/\n/g,"\\n");
  for (const l of myLegs()){ if(!l.dep) continue; const end=l.arr||new Date(Date.parse(l.dep)+2*36e5).toISOString();
    ev.push({uid:"leg-"+l.no.replace(/\W/g,"")+"-"+l.dep.slice(0,10), t:`✈ ${l.no} ${l.from} → ${l.to}`, s:l.dep, e:end, d:[l.by, l.seats?"Seats "+l.seats:"", ...(l.tips||[])].filter(Boolean).join("\n"), a:[24*60, /SRQ|DAD/.test(l.from)?120:180]}); }
  for (const r of (MOg().reminders||[])){ if(r.pb && !PB()) continue; ev.push({uid:"r-"+r.at, t:r.t, s:r.at, e:new Date(Date.parse(r.at)+(r.mins||30)*6e4).toISOString(), d:"From the Vietnam '26 app", a:r.alarms||[0]}); }
  // Morning nudge: 8 AM local on each Vietnam day, with the day's "before you head out" list.
  for (const d of T.days){ if (!VN(d.city) || typeof checklistFor !== "function") continue;
    const items = checklistFor(d).map(x => x[0]).filter(Boolean); if (!items.length) continue;
    const s0 = new Date(Date.parse(d.date + "T08:00:00+07:00")).toISOString();
    ev.push({uid:"am-"+d.date, t:`☀ ${CITYV[d.city]||d.place}: ${d.title}`, s:s0, e:new Date(Date.parse(s0)+15*6e4).toISOString(), d:"Before you head out:\n• " + items.slice(0,8).join("\n• ") + "\n\nOpen Today in the Vietnam '26 app for the full plan.", a:[0]}); }
  const lines=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Vietnam26//Trip//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:Vietnam '26"];
  const stamp=icsDate(new Date().toISOString());
  for (const x of ev){ lines.push("BEGIN:VEVENT",`UID:${x.uid}@vietnam26`,`DTSTAMP:${stamp}`,`DTSTART:${icsDate(x.s)}`,`DTEND:${icsDate(x.e)}`,`SUMMARY:${esc2(x.t)}`,`DESCRIPTION:${esc2(x.d)}`);
    for (const m of x.a) lines.push("BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${esc2(x.t)}`,`TRIGGER:-PT${m}M`,"END:VALARM");
    lines.push("END:VEVENT"); }
  lines.push("END:VCALENDAR"); return { text: lines.join("\r\n"), n: ev.length };
}
document.addEventListener("click", async e=>{ const b=e.target.closest("[data-ics]"); if(!b) return; e.preventDefault();
  const {text} = icsText(), file = new File([text], "vietnam26-reminders.ics", {type:"text/calendar"});
  try { if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file], title:"Vietnam '26 reminders"}); return; } } catch(err){ if (err && err.name==="AbortError") return; }
  const url = URL.createObjectURL(file); location.href = url; setTimeout(()=>URL.revokeObjectURL(url), 60000);
});

// Offline city maps: CARTO tiles, cached by the service worker.
const TILE = (z,x,y) => `https://tile.openstreetmap.org/${z}/${x}/${y}.png`;
const lon2x = (lon,z) => (lon+180)/360*256*2**z;
const lat2y = (lat,z) => { const s=Math.sin(lat*Math.PI/180); return (0.5-Math.log((1+s)/(1-s))/(4*Math.PI))*256*2**z; };
const x2lon = (x,z) => x/(256*2**z)*360-180;
const y2lat = (y,z) => { const n=Math.PI-2*Math.PI*y/(256*2**z); return 180/Math.PI*Math.atan(0.5*(Math.exp(n)-Math.exp(-n))); };
let MAP = { city: store.get("map-city") || "Saigon" };
function mapPins(city){ return T.places.filter(p=>p.city===city && COORD(p.name)); }
function mapView(){
  const cities = Object.keys(MOg().maps||{}); if(!cities.includes(MAP.city)) MAP.city = cities[0];
  const pins = mapPins(MAP.city);
  return `${seg("map")}<div class="chips mapchips">${cities.map(c=>`<button type="button" class="chipbtn" data-mapcity="${esc(c)}" aria-pressed="${c===MAP.city}">${esc(c)}</button>`).join("")}</div>
    <div class="map" id="map"><div class="map-layer" id="map-layer"></div><div class="map-ctl"><button type="button" data-mapz="1" aria-label="Zoom in">+</button><button type="button" data-mapz="-1" aria-label="Zoom out">−</button><button type="button" data-mapz="0" aria-label="Recenter">◎</button></div><div class="map-attr">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors</div></div>
    <p class="small muted" id="mapmsg" style="margin:8px 0 0">Maps you look at are kept on this phone. Before the trip, open each city on Wi-Fi and zoom around the areas you'll visit, and they'll show with no signal.</p>
    <h3>${esc(MAP.city)}</h3><div class="card" style="padding:4px 16px">${pins.map((p,i)=>`<div class="row prow" data-place="${p.id}" style="cursor:pointer"><div class="pthumb ph pinnum">${i+1}</div><div class="what">${esc(p.name)}</div><span class="pin" style="align-self:center">${PIN}Open</span><div class="detail">${esc(p.vi)}</div></div>`).join("")}</div>`;
}
function drawMap(){
  const el=document.getElementById("map"), layer=document.getElementById("map-layer"); if(!el) return;
  const cfg = MOg().maps[MAP.city]; if (MAP.z==null || MAP.for!==MAP.city){ MAP.c=cfg.c.slice(); MAP.z=cfg.z; MAP.for=MAP.city; }
  const W=el.clientWidth, H=el.clientHeight, z=MAP.z, cx=lon2x(MAP.c[1],z), cy=lat2y(MAP.c[0],z), x0=cx-W/2, y0=cy-H/2;
  let h=""; const n=2**z;
  for (let tx=Math.floor(x0/256); tx<=Math.floor((x0+W)/256); tx++) for (let ty=Math.floor(y0/256); ty<=Math.floor((y0+H)/256); ty++){
    if (ty<0||ty>=n) continue; const wx=((tx%n)+n)%n;
    h += `<img class="mtile" alt="" draggable="false" onerror="this.style.visibility='hidden'" src="${TILE(z,wx,ty)}" style="left:${Math.round(tx*256-x0)}px;top:${Math.round(ty*256-y0)}px">`; }
  mapPins(MAP.city).forEach((p,i)=>{ const [la,lo]=COORD(p.name); const px=lon2x(lo,z)-x0, py=lat2y(la,z)-y0; if(px<-20||py<-20||px>W+20||py>H+40) return;
    h += `<button type="button" class="mpin" data-place="${p.id}" style="left:${Math.round(px)}px;top:${Math.round(py)}px" aria-label="${esc(p.name)}"><span><i>${i+1}</i></span></button>`; });
  layer.style.transform=""; layer.innerHTML=h;
}
function wireMap(){
  const el=document.getElementById("map"); if(!el) return; drawMap();
  let st=null, moved=false, lastTap=0;
  const layer=document.getElementById("map-layer");
  el.addEventListener("touchstart",e=>{ if(e.target.closest(".map-ctl")) return; moved=false; const t=e.touches;
    st = t.length===2 ? {d:Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY), dx:0, dy:0, k:1} : {x:t[0].clientX, y:t[0].clientY, dx:0, dy:0, k:1}; },{passive:true});
  el.addEventListener("touchmove",e=>{ if(!st) return; e.preventDefault(); moved=true; const t=e.touches;
    if (t.length===2 && st.d){ st.k=Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)/st.d; layer.style.transform=`scale(${st.k})`; layer.style.transformOrigin="50% 50%"; }
    else if (t.length===1 && st.x!=null){ st.dx=t[0].clientX-st.x; st.dy=t[0].clientY-st.y; layer.style.transform=`translate(${st.dx}px,${st.dy}px)`; } },{passive:false});
  const end=()=>{ if(!st) return; const z=MAP.z;
    if (st.k!==1){ MAP.z=Math.max(11,Math.min(18,z+Math.round(Math.log2(st.k)))); }
    else if (st.dx||st.dy){ const cx=lon2x(MAP.c[1],z)-st.dx, cy=lat2y(MAP.c[0],z)-st.dy; MAP.c=[y2lat(cy,z), x2lon(cx,z)]; }
    st=null; drawMap(); };
  el.addEventListener("touchend",e=>{ if(e.touches.length) return; const n=Date.now(); if(!moved && !e.target.closest(".mpin,.map-ctl")){ if(n-lastTap<300){ MAP.z=Math.min(18,MAP.z+1); st=null; drawMap(); lastTap=0; return; } lastTap=n; } end(); });
  // Mouse drag for desktop testing.
  el.addEventListener("mousedown",e=>{ if(e.target.closest(".map-ctl,.mpin")) return; st={x:e.clientX,y:e.clientY,dx:0,dy:0,k:1};
    const mv=ev=>{ st.dx=ev.clientX-st.x; st.dy=ev.clientY-st.y; layer.style.transform=`translate(${st.dx}px,${st.dy}px)`; };
    const up=()=>{ removeEventListener("mousemove",mv); removeEventListener("mouseup",up); end(); }; addEventListener("mousemove",mv); addEventListener("mouseup",up); });
}
document.addEventListener("click", e=>{
  const c=e.target.closest("[data-mapcity]"); if(c){ MAP.city=c.dataset.mapcity; store.set("map-city",MAP.city); MAP.z=null; render("plan",null,"map"); return; }
  const z=e.target.closest("[data-mapz]"); if(z){ const v=+z.dataset.mapz; if(v) MAP.z=Math.max(11,Math.min(18,MAP.z+v)); else MAP.z=null; drawMap(); return; }
  const s=e.target.closest("[data-mapsave]"); if(s){ const urls=[]; for (const [c,m] of Object.entries(MOg().maps||{})) for (let z=m.z-1; z<=m.z+1; z++){
      const [la0,lo0,la1,lo1]=m.box; const xa=Math.floor(lon2x(lo0,z)/256), xb=Math.floor(lon2x(lo1,z)/256), ya=Math.floor(lat2y(la1,z)/256), yb=Math.floor(lat2y(la0,z)/256);
      for (let x=xa;x<=xb;x++) for (let y=ya;y<=yb;y++) urls.push(TILE(z,x,y)); }
    const msg=document.getElementById("mapmsg");
    if (!navigator.serviceWorker?.controller){ if(msg) msg.textContent="Open the app from the home screen first, then try again."; return; }
    navigator.serviceWorker.controller.postMessage({type:"save-tiles", urls}); store.set("maps-saved", Date.now());
    if(msg) msg.textContent=`Saving ${urls.length} map pieces in the background. Keep the app open on Wi-Fi for a minute.`; s.textContent="Saving…"; }
});

const NF = new Intl.NumberFormat("en-US"), fmtVnd = n => NF.format(Math.round(n/50000)*50000) + " ₫";
const fmtUsd = n => "$" + Math.round(n / T.info.rates.VND);
const nowH = () => nowMin()/60;
const dayOf = iso => T.days.find(d=>d.date===iso);
const placeByName = n => (T.places||[]).find(p=>p.name===n);
const cityOfIso = iso => (dayOf(iso)||{}).city;
const MAPCITY = c => Object.keys(CITYNAME).find(k=>CITYNAME[k]===c);

// --- What now? ---
let WN = { here: null, n: 3 };
function openAt(S, h, wd){
  if (S[3] && !S[3].includes(wd)) return null;
  for (const [a,b] of S[2]){ if (h >= a && h < b - 0.25) return b; if (h + 24 >= a && h + 24 < b - 0.25) return b - 24; }
  return null;
}
function rainPct(city, iso){ try{ return JSON.parse(store.get("wx-"+city)||"null")?.days?.[iso]?.p ?? null; }catch(e){ return null; } }
function whatNow(){
  const iso = todayIso(), d = dayOf(iso), wd = parse(iso).getDay(), h = nowH();
  const city = d && VN(d.city) ? d.city : "hcmc", M = (MOg().maps||{})[MAPCITY(city)];
  const origin = WN.here || (M && M.c), rain = rainPct(city, iso);
  const planned = new Set((d ? d.items : []).flatMap(x=>placesFor(x[1], d.city)).map(p=>p.name));
  const meal = (h>=11 && h<14) || (h>=17.5 && h<21), coffee = (h>=7 && h<11) || (h>=14 && h<17.5), late = h>=18;
  const out = [];
  for (const [name, S] of Object.entries(MOg().spots||{})){
    const C = COORD(name); if (!C || !origin) continue;
    const km = hav(origin, C)*1.3; if (km > 12) continue;
    const till = openAt(S, h, wd); if (till == null) continue;
    let score = -km*1.6;
    if (S[0]==="eat" && meal) score += 3; if (S[0]==="coffee" && coffee) score += 2.5;
    if ((S[0]==="night"||S[0]==="walk") && late) score += 3; if ((S[0]==="night") && !late) score -= 2;
    if (rain!=null && rain>=50) score += S[1] ? 2 : -2.5;
    if (till - h < 1) score -= 2;
    if (planned.has(name)) score -= 1.5;
    out.push({ name, S, km, till, score, planned: planned.has(name) });
  }
  return { list: out.sort((a,b)=>b.score-a.score), rain, city, origin, d };
}
function getThere(km){
  const walk = Math.round(km/4.5*60), grab = Math.round(4 + km/20*60), fare = Math.max(30, Math.round((12 + km*14)/5)*5);
  return walk <= 20 ? `${walk} min walk` : `Grab ~${grab} min · ~${fare}k ₫`;
}
function whatNowCards(){
  const W = whatNow(), K = MOg().spotKinds||{};
  if (!W.list.length) return `<div class="card"><b>Nothing nearby is open right now.</b><p class="small muted" style="margin:6px 0 0">Late night? Head back to your stay, or check the Eat list for tomorrow.</p></div>`;
  return W.list.slice(0, WN.n).map((x,i)=>{ const p = placeByName(x.name);
    const why = [K[x.S[0]], x.S[1] ? "Indoors" : "", `Open till ${hm(x.till)}`, x.planned ? "On today's plan" : ""].filter(Boolean).join(" · ");
    return `<div class="card wn"><div class="wn-n">${i+1}</div><div class="wn-b"><b>${esc(x.name)}</b><span class="small muted">${esc(why)}</span><span class="wn-go">${getThere(x.km)}${WN.here?"":" from the center"}</span>
      <div class="btns">${p?`<button class="btn" data-place="${p.id}">Details</button>`:""}<a class="btn" href="${mapUrl(x.name+", Vietnam")}" target="_blank" rel="noopener">Directions</a></div></div></div>`; }).join("")
    + (W.list.length > WN.n ? `<button class="btn" data-wnmore style="margin-top:4px">Show more</button>` : "");
}
function nowPage(){
  const W = whatNow(), rain = W.rain;
  return `<a class="btn back-link" href="#today">← Today</a><h2>What now?</h2>
    <p class="small muted" style="margin:0 0 10px">Open right now and close by${rain!=null&&rain>=50?`, leaning indoors (${rain}% rain)`:""}. Hours are approximate.</p>
    <div class="btns" style="margin:0 0 14px"><button class="btn solid" data-wnhere>${WN.here?"Updated to where you are":"Use where I am"}</button></div>

}

// --- Cash for today ---
function cashFor(d){
  if (!d || !VN(d.city)) return null;
  const F = MOg().fees||{}, B = MOg().cashBase||{food:350000,ride:40000,buffer:200000};
  const names = [...new Set(d.items.flatMap(x=>placesFor(x[1], d.city)).map(p=>p.name))];
  const lines = [];
  names.forEach(n=>{ if (F[n]) lines.push([n, F[n]]); });
  const txt = d.items.map(x=>x[1]).join(" ").toLowerCase();
  const rides = (txt.match(/\bgrab\b|\bcar to\b|\bcar\b|taxi|transfer/g)||[]).length;
  const fine = /coco|\bgia\b|tasting menu|la maison|anan/.test(txt);
  lines.push([fine ? "Street food, coffee and snacks (dinner on card)" : "Meals, coffee and snacks", fine ? Math.round(B.food*0.6) : B.food]);
  if (rides) lines.push([`${rides} ride${rides>1?"s":""}, shared`, rides*B.ride]);
  lines.push(["Tips and small extras", B.buffer]);
  const total = lines.reduce((s,l)=>s+l[1],0);
  return { total, lines };
}
function cashHtml(d){
  const c = cashFor(d); if (!c) return "";
  return `<details class="card cash"><summary><span class="cash-ico">₫</span><span><b>Carry about ${fmtVnd(c.total)} each</b><span class="small muted">≈ ${fmtUsd(c.total)} · tap for the breakdown</span></span></summary>
    <ul class="cashl">${c.lines.map(([t,v])=>`<li><span>${esc(t)}</span><b>${(Math.round(v/1000)).toLocaleString()}k</b></li>`).join("")}</ul>
    <p class="small muted" style="margin:6px 0 0">Bring small notes (10k–100k). Cards work at hotels and nicer restaurants; markets, street food and tips are cash.</p></details>`;
}

// ===== History and facts: Did you know?, timeline, December in history, trivia =====
const FX = () => (T && T.facts) || { facts: [], timeline: [], december: {}, trivia: [] };
const CITYLBL = { all: "Vietnam", hcmc: "Saigon", hoian: "Hội An", danang: "Đà Nẵng", hanoi: "Hà Nội", ninhbinh: "Ninh Bình" };
const placeCityKey = name => { const p = placeByName(name); return p ? CITYNAME[p.city] : null; };
const factWhere = w => CITYLBL[w] || w;
function hashStr(s){ let h = 0; for (const c of s) h = (h*31 + c.charCodeAt(0)) | 0; return Math.abs(h); }
// Facts for a day: places on the plan first, then the city, then the country; rotates by date.
function factsForDay(d, n){
  const F = FX().facts.map((f,i)=>({f,i}));
  const names = d ? new Set(d.items.flatMap(x=>placesFor(x[1], d.city)).map(p=>p.name)) : new Set();
  const pool = [...F.filter(x=>names.has(x.f[1])), ...F.filter(x=>d && x.f[1]===d.city), ...F.filter(x=>x.f[1]==="all")];
  const seed = hashStr(d ? d.date : todayIso()), out = [], seen = new Set();
  const groups = [pool.filter(x=>names.has(x.f[1])), pool.filter(x=>d && x.f[1]===d.city), pool.filter(x=>x.f[1]==="all")];
  for (const g of groups){ if (!g.length) continue; const x = g[seed % g.length]; if (!seen.has(x.i)){ out.push(x); seen.add(x.i); } if (out.length >= n) break; }
  return out;
}
const factCard = (x, sm) => `<div class="fact${sm?" sm":""}"><div class="fact-k"><span>${esc(x.f[0])}</span><span>${esc(factWhere(x.f[1]))}</span></div><p>${esc(x.f[2])}</p></div>`;
function todayFactsHtml(d){

  if (!list.length && !dec) return "";
  return `<h3>Did you know?</h3><div class="card facts-today">${list.map(x=>factCard(x,1)).join("")}
    <a class="more-link" href="#facts">More facts ›</a>
    ${dec?`<div class="fact sm dec"><div class="fact-k"><span>This December in history</span><span>${esc(dec[0])}</span></div><p>${esc(dec[1])}</p></div>`:""}</div>`;
}
function placeFactsHtml(p){
  const F = FX().facts.filter(f=>f[1]===p.name); if (!F.length) return "";
  return `<div class="pfacts"><div class="sub-h">Did you know?</div>${F.map(f=>`<p>${esc(f[2])}</p>`).join("")}</div>`;
}

// Did you know? deck
let FD = { cat: "All", order: null, i: 0 };
const FCATS = ["All", "History", "Food", "Language", "Culture", "Quirk", "Here"];
function deckList(){
  const d = dayOf(todayIso()), city = d && VN(d.city) ? d.city : null;
  return FX().facts.map((f,i)=>({f,i})).filter(({f})=>{
    if (FD.cat==="All") return true;
    if (FD.cat==="Here") return city && (f[1]===city || placeCityKey(f[1])===city);
    return f[0]===FD.cat || (FD.cat==="History" && f[0]==="Nature");
  });
}
function deckShuffle(){ const L = deckList(); FD.order = L.map(x=>x.i).sort(()=>Math.random()-.5); FD.i = 0; }
function deckCur(){ if (!FD.order || !FD.order.length) deckShuffle(); const i = FD.order[FD.i % Math.max(1,FD.order.length)]; return i==null ? null : {f: FX().facts[i], i}; }
function deckBody(){
  const x = deckCur(), n = FD.order ? FD.order.length : 0;
  return x ? `<div class="card deck">${factCard(x)}<div class="deck-n small muted">${(FD.i % n)+1} of ${n}</div></div>

function factsPage(){

const HUNT = () => FX().hunt || [];
const huntItem = id => HUNT().find(h=>h[0]===id);

const IDB = { db: null,
  open(){ if (this.db) return Promise.resolve(this.db); return new Promise((ok, no)=>{ const r = indexedDB.open("vietnam26", 1); r.onupgradeneeded = ()=>r.result.createObjectStore("hunt"); r.onsuccess = ()=>{ this.db = r.result; ok(this.db); }; r.onerror = ()=>no(r.error); }); },
  async put(k, v){ const db = await this.open(); return new Promise((ok, no)=>{ const t = db.transaction("hunt","readwrite"); t.objectStore("hunt").put(v, k); t.oncomplete = ok; t.onerror = ()=>no(t.error); }); },
  async get(k){ const db = await this.open(); return new Promise(ok=>{ const r = db.transaction("hunt").objectStore("hunt").get(k); r.onsuccess = ()=>ok(r.result||null); r.onerror = ()=>ok(null); }); },
  async del(k){ const db = await this.open(); return new Promise(ok=>{ const t = db.transaction("hunt","readwrite"); t.objectStore("hunt").delete(k); t.oncomplete = ok; t.onerror = ok; }); },
};

// Daily bounty: one item per trip day, worth double if caught that day.
function bountyFor(iso){
  const d = dayOf(iso); if (!d || !VN(d.city)) return null;
  const pool = HUNT().filter(h=>h[1] < 5 && (!h[3] || h[3]===d.city));
  return pool.length ? pool[hashStr("bounty"+iso) % pool.length] : null;
}
function scoreAll(){
  const R = boardRecords(), first = {}, aw = {}, SP = Object.fromEntries(SPEAK().map(x=>[x[0], x[4]]));
  R.forEach(r=>Object.entries(r.h||{}).forEach(([id,ts])=>{ if (first[id]==null || ts < first[id].ts) first[id] = {ts, n: r.n}; }));
  R.forEach(r=>(r.aw||[]).forEach(a=>{ aw[a.id] = a; }));
  Object.values(aw).forEach(a=>{ if (!R.some(r=>r.n===a.to)) R.push({ n: a.to, t: 0 }); });
  const champ = R.reduce((m,r)=>Math.max(m, r.hg||0), 0);
  return R.map(r=>{
    let hunt = 0, bonus = 0;
    Object.entries(r.h||{}).forEach(([id,ts])=>{ const it = huntItem(id); if (!it) return;
      const day = isoOf(new Date(ts)), b = bountyFor(day); let p = it[1]; if (b && b[0]===id) p *= 2;
      hunt += p; if (first[id] && first[id].n===r.n && R.length > 1) bonus++; });
    const trivia = (r.tr||[]).length, bingo = r.bg||0;
    const bill = Object.values(aw).filter(a=>a.to===r.n && a.g==="bill").reduce((s,a)=>s+a.p, 0);
    const haggle = Math.floor((r.hg||0)/10) + (champ > 0 && r.hg===champ && R.length > 1 ? 3 : 0);
    const speak = Object.keys(r.sp||{}).reduce((s,k)=>s+(SP[k]||0), 0);
    return { n: r.n, t: r.t, hunt, bonus, trivia, bingo, bill, haggle, speak, found: Object.keys(r.h||{}).length,
      total: hunt + bonus + trivia + bingo + bill + haggle + speak, me: r.n===ME() };
  }).sort((a,b)=>b.total-a.total || a.n.localeCompare(b.n));
}

// ===== Live leaderboard: every phone writes its own scores to one shared room and listens for everyone else's.
// Firebase Realtime Database over plain REST and server-sent events (no SDK). Works offline: changes wait and send later.
const LIVE = { es: null, room: null, dirty: false, timer: null, state: "off", seen: 0, ping0: Date.now() };
const liveBase = () => T && T.live ? `${T.live.db}/v26/${T.live.room}` : null;
const SCORE_KEYS = new Set(["hunt-found","trivia-right","trivia-scores","bingo","awards","haggles","speak"]);
function takeRecord(x){
  if (!x || !x.n || x.n === ME()) return false;
  const B = local.get("board", {}), rec = { n:x.n, t:x.t*60000, tr:x.tr||[], tb:x.tb||0, h:{}, bg:x.bg||0, hg:x.hg||0, sp:x.sp||{}, aw:(x.aw||[]).map(a=>({id:a[0], to:a[1], p:a[2], g:a[3], ts:a[4]*60000})) };
  Object.entries(x.h||{}).forEach(([k,v])=>rec.h[k]=v*60000);
  if (B[x.n] && B[x.n].t > rec.t) return false;
  B[x.n] = rec; store.set("board", JSON.stringify(B)); return true;
}
function livePush(soon){
  if (!liveBase() || !ME()) return; LIVE.dirty = true; clearTimeout(LIVE.timer);
  LIVE.timer = setTimeout(async ()=>{
    if (!navigator.onLine) return;
    try { const r = await fetch(`${liveBase()}/scores/${encodeURIComponent(ME())}.json`, { method: "PUT", body: JSON.stringify(compactRecord()) });
      if (r.ok){ LIVE.dirty = false; liveStatus(); } } catch(e){}
  }, soon ? 300 : 1500);
}
function liveApply(path, data){
  // Keep a mirror of the room, then copy everyone else's scores into this phone's board.
  if (path === "/") LIVE.room = data || {};
  else { LIVE.room = LIVE.room || {}; const parts = path.split("/").filter(Boolean).map(decodeURIComponent); let o = LIVE.room;
    for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]] = (o[parts[i]] && typeof o[parts[i]] === "object") ? o[parts[i]] : {};
    if (data == null) delete o[parts[parts.length-1]]; else o[parts[parts.length-1]] = data; }
  let changed = false; Object.values((LIVE.room||{}).scores || {}).forEach(x=>{ if (takeRecord(x)) changed = true; });
  const pg = (LIVE.room||{}).ping;
  if (pg && pg.t > LIVE.ping0 && pg.t > LIVE.seen){ LIVE.seen = pg.t; if (pg.by !== ME()){ toast(`${pg.by} refreshed everyone's app`); liveRefresh(); } }
  LIVE.seen = Math.max(LIVE.seen, (pg && pg.t) || 0);
  LIVE.state = "on"; liveStatus();
  if (changed && /^#(board|games)$/.test(location.hash)){ const y = scrollY; route(); scrollTo(0, y); }
}
function liveListen(){
  if (!liveBase() || !window.EventSource) return; liveStop();
  const es = LIVE.es = new EventSource(`${liveBase()}.json`);
  const on = ev => { try { const m = JSON.parse(ev.data); if (m) liveApply(m.path, m.data); } catch(e){} };
  es.addEventListener("put", on); es.addEventListener("patch", ev => { try { const m = JSON.parse(ev.data); Object.entries(m.data||{}).forEach(([k,v])=>liveApply((m.path==="/"?"":m.path)+"/"+k, v)); } catch(e){} });
  es.onerror = () => { LIVE.state = navigator.onLine ? "retry" : "off"; liveStatus(); };
}
function liveStop(){ if (LIVE.es){ LIVE.es.close(); LIVE.es = null; } }
async function liveRefresh(){
  // Fetch the newest app (if one was published) and reload; scores come back with the page.
  try { const r = await navigator.serviceWorker?.getRegistration(); await r?.update(); } catch(e){}
  setTimeout(()=>location.reload(), 900);
}
function liveStatus(){
  const el = document.getElementById("live-st"); if (!el) return;
  el.textContent = !liveBase() ? "" : LIVE.dirty && !navigator.onLine ? "Offline. Your scores will send when you're back online."
    : LIVE.state === "on" ? "Live. Scores update on everyone's phone as you play." : "Connecting…";
  el.dataset.st = LIVE.state;
}
function liveInit(){
  if (!liveBase()) return;
  const set0 = local.set; local.set = (k, v) => { set0(k, v); if (SCORE_KEYS.has(k)) livePush(); };
  livePush(true); liveListen();
  document.addEventListener("visibilitychange", ()=>{ if (document.visibilityState === "visible"){ liveListen(); if (LIVE.dirty) livePush(true); } else liveStop(); });
  addEventListener("online", ()=>{ liveListen(); livePush(true); });
}
document.addEventListener("click", async e=>{
  const b = e.target.closest("[data-liveping]"); if (!b) return;
  if (!liveBase()) return liveRefresh();
  try { await fetch(`${liveBase()}/ping.json`, { method: "PUT", body: JSON.stringify({ t: Date.now(), by: ME() }) }); toast("Refreshing everyone's app"); } catch(err){ toast("No connection. Try again when you're online."); return; }
  liveRefresh();
});

  return `<a class="btn back-link" href="#games">← Games</a><h2>Guess the bill</h2>
    <p class="small muted" style="margin:0 0 12px">Before paying for a meal, massage or ride, pass the phone round. Everyone guesses the total in US dollars; the closest wins 3 points.</p>
    <div class="card form" id="gb">
      <label>What are we paying for?<input id="gb-what" placeholder="e.g. Dinner at Bún Chả Hương Liên" maxlength="60"></label>
      <div class="sub-h" style="margin:4px 0 0">Guesses in $</div>
      ${players().map(n=>`<label class="gb-row"><span>${esc(n)}</span><input type="number" inputmode="decimal" step="0.5" min="0" data-gbp="${esc(n)}" placeholder="skip"></label>`).join("")}
      <div class="sub-h" style="margin:4px 0 0">The real total</div>
      <div class="gb-actual"><input id="gb-amt" aria-label="The real total" type="number" inputmode="numeric" min="0" placeholder="e.g. 450000"><div class="chips" role="group"><button type="button" class="chipbtn" data-gbunit="vnd" aria-pressed="true">₫</button><button type="button" class="chipbtn" data-gbunit="usd" aria-pressed="false">$</button></div></div>
      <div class="btns"><button class="btn solid" data-gbgo>Reveal the winner</button></div>
    </div>
    <div id="gb-out"></div>
    ${R.length?`<h3>Past rounds</h3><div class="card">${R.map(r=>`<div class="gb-past"><b>${esc(r.what||"Bill")}</b><span class="small muted">${money$(r.usd)} · won by ${esc(r.win.join(" & "))}</span></div>`).join("")}</div>`:""}`;
}
let GB_UNIT = "vnd";
document.addEventListener("click", e=>{
  const u = e.target.closest("[data-gbunit]"); if (u){ GB_UNIT = u.dataset.gbunit; document.querySelectorAll("[data-gbunit]").forEach(b=>b.setAttribute("aria-pressed", b===u)); $("#gb-amt").placeholder = GB_UNIT==="vnd" ? "e.g. 450000" : "e.g. 17.50"; return; }
  if (!e.target.closest("[data-gbgo]")) return;
  const amt = +$("#gb-amt").value; if (!amt) return toast("Enter the real total first");
  const real = GB_UNIT==="vnd" ? usd(amt) : amt;
  const G = [...document.querySelectorAll("[data-gbp]")].filter(i=>i.value!=="").map(i=>({n:i.dataset.gbp, g:+i.value, d:Math.abs(+i.value - real)}));
  if (G.length < 2) return toast("Need at least two guesses");
  G.sort((a,b)=>a.d-b.d); const win = G.filter(x=>x.d===G[0].d).map(x=>x.n);
  const what = $("#gb-what").value.trim(), ts = Date.now();
  const A = awardsMine(); win.forEach(n=>A.push({ id: uid(), to: n, p: 3, g: "bill", ts })); local.set("awards", A);
  const R = local.get("bill-rounds", []); R.push({ what, usd: real, win, ts }); local.set("bill-rounds", R);
  $("#gb-out").innerHTML = `<div class="card gb-res"><div class="small">The bill: <b>${money$(real)}</b>${GB_UNIT==="vnd"?` (${amt.toLocaleString()} ₫)`:""}</div><div class="gb-win">${ico("trophy")} ${esc(win.join(" & "))} +3</div>
    <ol class="gb-list">${G.map(x=>`<li><span>${esc(x.n)}</span><span>${money$(x.g)}</span><span class="muted">${x.d<0.01?"exact!":(x.g>real?"+":"−")+money$(x.d)}</span></li>`).join("")}</ol></div>`;
  document.querySelectorAll("[data-gbp]").forEach(i=>i.value=""); $("#gb-amt").value=""; $("#gb-what").value="";
  $("#gb-out").scrollIntoView({block:"start"}); scrollBy(0,-70);
});

// Haggle champ
function hagglePage(){
  const H = haggles().slice().reverse(), best = bestHaggle();
  return `<a class="btn back-link" href="#games">← Games</a><h2>Haggle champ</h2>
    <p class="small muted" style="margin:0 0 12px">Log what they asked and what you paid. Every 10% off your best haggle is a point, and whoever has the best haggle of the group gets +3. Markets and stalls only, and always with a smile.</p>
    <div class="card form"><label>What did you buy?<input id="hg-w" placeholder="e.g. Silk scarf, Hàng Gai" maxlength="60"></label>
      <div class="two"><label>They asked (₫)<input id="hg-a" type="number" inputmode="numeric" placeholder="400000"></label><label>You paid (₫)<input id="hg-p" type="number" inputmode="numeric" placeholder="250000"></label></div>
      <div class="btns"><button class="btn solid" data-hglog>Log it</button><a class="btn" href="#say">Haggle helper</a></div></div>
    ${best?`<div class="card bounty-c"><span class="small">Your best</span><b>${best}% off</b></div>`:""}
    ${H.length?`<h3>Your haggles</h3><div class="card">${H.map(h=>`<div class="gb-past"><b>${esc(h.w||"Something nice")}</b><span class="small muted">${h.a.toLocaleString()} → ${h.p.toLocaleString()} ₫ · ${h.pct}% off</span></div>`).join("")}</div>`:""}`;
}
document.addEventListener("click", e=>{ if (!e.target.closest("[data-hglog]")) return;
  const a = +$("#hg-a").value, p = +$("#hg-p").value; if (!a || !p || p > a) return toast("Enter the asking price and what you paid");
  const H = haggles(), pct = Math.round((1 - p/a)*100); H.push({ w: $("#hg-w").value.trim(), a, p, pct, ts: Date.now() }); local.set("haggles", H);
  toast(pct >= 30 ? `${pct}% off. Nicely done` : `${pct}% off`); render("explore", null, "haggle");
});

// Speak up
function speakPage(){
  const D = speakDone(), pts = SPEAK().reduce((s,x)=>s + (D[x[0]] ? x[4] : 0), 0);
  return `<a class="btn back-link" href="#games">← Games</a><h2>Speak up</h2>
    <p class="small muted" style="margin:0 0 12px">Use the phrase with a local and get understood. Someone in the group has to confirm it. ${pts} points so far.</p>
    <div class="list">${SPEAK().map(([id, t, vi, snd, p])=>{ const d = D[id]; return `<div class="card sp${d?" done":""}"><div class="sp-h"><b>${esc(t)}</b><span class="ht-p" style="position:static">${p}</span></div>
      <div class="viw"><span><i lang="vi">${esc(vi)}</i> <span class="sound">“${esc(snd)}”</span></span>${sayBtn(vi.replace("…",""),1)}</div>
      ${d?`<div class="small">✓ Done ${new Date(d.ts).toLocaleDateString([], {month:"short", day:"numeric"})}, confirmed by ${esc(d.by)} <button class="linkbtn" data-spundo="${id}">Undo</button></div>`:`<div class="btns" style="margin-top:8px">${players().filter(n=>n!==ME()).map(n=>`<button class="btn" data-spdo="${id}" data-spby="${esc(n)}">${esc(n)} saw it</button>`).join("")}</div>`}</div>`; }).join("")}</div>`;
}
document.addEventListener("click", e=>{
  const d = e.target.closest("[data-spdo]"); if (d){ const S = speakDone(); S[d.dataset.spdo] = { ts: Date.now(), by: d.dataset.spby }; local.set("speak", S); const y = scrollY; render("explore", null, "speak"); scrollTo(0, y); return; }
  const u = e.target.closest("[data-spundo]"); if (u){ const S = speakDone(); delete S[u.dataset.spundo]; local.set("speak", S); const y = scrollY; render("explore", null, "speak"); scrollTo(0, y); }
});

function route(){

  else if (h.startsWith("stay-")) { target=h; h="stays"; }
  if (sub) {}
  else if (PARENT[h]) { sub=h; h=PARENT[h]; }

function toggleDay(d){
  const body = d.querySelector(".daybody"); if (!body) return;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches || !body.animate){ d.open=!d.open; return; }
  if (d._anim) d._anim.cancel();
  if (!d.open){
    d.open = true; const h = body.scrollHeight;
    d._anim = body.animate([{height:"0px",opacity:0},{height:h+"px",opacity:1}],{duration:320,easing:"cubic-bezier(.2,.8,.2,1)"});
  } else {
    const h = body.scrollHeight;
    d._anim = body.animate([{height:h+"px",opacity:1},{height:"0px",opacity:0}],{duration:240,easing:"cubic-bezier(.4,0,.2,1)"});
    d._anim.onfinish = ()=>{ d.open=false; d._anim=null; };
  }
}

function latestFeed(){

  return ev.filter(x=>{ const k = x.n + x.ts + x.html; if (seen.has(k)) return false; seen.add(k); return x.ts; }).sort((a,b)=>b.ts-a.ts).slice(0, 6);

function lanternsHtml(S){
  const names = T.travelers.map(t=>t.name), byN = Object.fromEntries(S.map(s=>[s.n, s]));

function tlxYear(from, to){

  const a = num(from), b = num(to);
  if (a == null || b == null || a === b || reduceMotion()){ el.textContent = to; return; }
  const t0 = performance.now(), D = 480, tok = el._tok = (el._tok||0) + 1;
  const step = t => { if (el._tok !== tok) return; const k = Math.min(1, (t - t0) / D), e = 1 - Math.pow(1 - k, 3), v = Math.round(a + (b - a) * e);
    el.textContent = k < 1 ? (v < 0 ? (-v) + " BC" : v) : to; if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

// Search: renders every page offscreen, splits it into cards and list items, and matches typed words (accents and typos forgiven).
const SRCH_SKIP = new Set(["trivia","guess","hunt","recap","board","haggle","speak","games","map","now"]);
const SRCH_NAME_DAY = k => { const d = T.days.find(x=>x.date===k.slice(4)); return d ? fmt(d.date) + " · " + d.title : "Plan"; };
const SRCH_NAME = {today:"Today",plan:"Plan",stays:"Stays",explore:"Explore",info:"Info",bookings:"Bookings",facts:"Did you know?",timeline:"Timeline",gifts:"Shopping",food:"Food",eat:"Eat list",listen:"Listen",places:"Places",say:"Say it"};
const srNorm = t => (t||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/gi,"d").toLowerCase().replace(/[-'’`]/g,"");
const SRCH_SEL = ".card, details, .fstop, .bcard, li, .xt, article p, article h2, article h3, tr";
function srText(el){ const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), out = []; let n; while ((n = w.nextNode())) if (!n.parentElement.closest("button")) out.push(n.data); return out.join(" ").replace(/\s+/g," ").replace(/ ↗/g,"").replace(/\s+([.,:;!?)])/g,"$1").trim(); }
function srUnits(root){ const all = [...root.querySelectorAll(SRCH_SEL)]; return all.filter(el=>!el.querySelector(SRCH_SEL)); }
let SRCH_IX = null;
function srPageKey(h){ if (h.startsWith("day-")) return STREET() ? h : null; if (h.startsWith("stay-")) return null; return h; }
function srRender(key, st){
  const save = {SVC, TLC}; try { if (st) { if ("SVC" in st) SVC = st.SVC; if ("TLC" in st) TLC = st.TLC; }
    return key.startsWith("day-") ? dayPage(key.slice(4)) : key.startsWith("story-") ? views.story(key.slice(6)) : key.startsWith("guide-") ? views.guide(key.slice(6)) : views[key] ? views[key]() : "";
  } catch(e){ return ""; } finally { SVC = save.SVC; TLC = save.TLC; }
}
function srBuild(){
  const ix = [], seen = new Set(), queue = ["today","plan","stays","explore","info"].map(k=>[k,null]);
  const tpl = document.createElement("template");
  while (queue.length){
    const [key, st] = queue.shift(), id = key + JSON.stringify(st||{}); if (seen.has(id)) continue; seen.add(id);
    tpl.innerHTML = srRender(key, st); const root = tpl.content;
    root.querySelectorAll('a[href^="#"]').forEach(a=>{ const h = srPageKey(a.getAttribute("href").slice(1)); if (h && !SRCH_SKIP.has(h) && (views[h] || /^(story|guide|day)-/.test(h))) queue.push([h,null]); });
    if (key === "gifts" && !st) [...Object.keys(MOg().souvenirs||{}),"tailor","gear","active"].forEach(v=>queue.push(["gifts",{SVC:v}]));
    if (key === "timeline" && !st) ["all", ...Object.keys(FX().cityTimeline||{})].forEach(v=>queue.push(["timeline",{TLC:v}]));
    if ((key === "gifts" || key === "timeline") && !st) continue;
    const title = key.startsWith("day-") ? SRCH_NAME_DAY(key) : SRCH_NAME[key] || (root.querySelector("h1, h2")||{}).textContent || key;
    let last = "";
    srUnits(root).forEach((el,i)=>{
      const txt = srText(el); if (txt.length < 3) return;
      const sm = el.closest("details")?.querySelector("summary"); let h = sm && srText(sm); let p = el;

  const b = bkItem(key), x = b.x, k = WKIND[b.kind] || WKIND.other;
  const sub = b.kind === "flight" ? (x.legs && x.ref ? `${x.legs.join(" · ")} · ref ${x.ref}` : x.legs && x.status === "booked" ? x.legs.join(" · ") : x.detail) : x.note || "";
  return `<div class="row bkrow" data-bk="${key}" style="--wk:${k[2]}"><div class="when"><span class="bkk">${icon(k[1])}${k[0]}</span>${esc(b.when)}</div><div class="what">${esc(b.kind === "flight" ? b.title : b.title.replace(/\s*\(~?\$[^)]*\)/, ""))}</div>${chip(b.status)}${sub ? `<div class="detail">${esc(sub)}</div>` : ""}${bkTag(key)}</div>`;
}
function bkByCity(){
  const all = [["f", T.flights], ["t", T.transfers], ["r", T.reservations]].flatMap(([t, A]) => (A || []).map((x, i) => [t + ":" + i, x])).filter(([, x]) => !x.pb || PB());
  const tm = w => { const m = (w || "").match(/(\d{1,2})(?::(\d\d))?\s*(AM|PM)/i); if (m) return (+m[1] % 12 + (/pm/i.test(m[3]) ? 12 : 0)) * 60 + +(m[2] || 0);
    return /morning/i.test(w) ? 540 : /lunch/i.test(w) ? 720 : /dinner/i.test(w) ? 1140 : /late/i.test(w) ? 1320 : 600; };
  const sk = k => { const b = bkItem(k); return (b.date || "2026-12-99") + String(tm(b.when)).padStart(5, "0"); };
  return BKAREA.map(([a, name, col, sub]) => { const R = all.filter(([, x]) => (x.area || "hanoi") === a).sort((p, q) => sk(p[0]) < sk(q[0]) ? -1 : 1); if (!R.length) return "";
    const open = R.filter(([, x]) => x.status !== "booked").length;
    return `<section class="bkcity" style="--city:${col}"><div class="bkch"><div><h2>${esc(name)}</h2><small>${esc(sub)}</small></div><span>${R.length - open}/${R.length} booked</span></div><div class="card">${R.map(([k]) => bkRow(k)).join("")}</div></section>`; }).join("");
}

function launch(){
  if (!ME()) return picker();
  T = scoped(FULL); afterTripReady(); if (!LIVE.init){ LIVE.init = 1; liveInit(); } $("#tabs").hidden=false; current=null; route();
  setTimeout(()=>prefetchPhotos().catch(()=>{}), 4000);
}
function start(data){
  FULL = data; window.addEventListener("hashchange",()=>{ if(T && ME()) route(); }); launch();
  // Tabs and section buttons replace the history entry, so the iPhone back-swipe can't flip between tabs.
  document.addEventListener("click",e=>{ const a=e.target.closest("#tabs a[href^='#'], nav.seg a[href^='#']"); if(!a) return; e.preventDefault(); const h=a.getAttribute("href");
    if (location.hash!==h){ history.replaceState(null,"",h); if(T && ME()) route(); } },true);
}

// Encrypted build: the trip data is locked with a shared trip passcode, entered once per phone.
async function unlock(pass, enc){
  const b = s => Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b(enc.salt), iterations:150000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b(enc.iv)}, key, b(enc.ct));
  if (enc.z) return JSON.parse(await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"))).text());
  return JSON.parse(new TextDecoder().decode(pt));
}
function lockScreen(enc, msg){
  $("#view").innerHTML = `<form class="lock" id="lockform"><div class="brand" style="font-size:30px">Vietnam<span>’26</span></div>
    <label for="pass" class="muted">Enter the trip passcode. You only need to do this once on this phone.</label>
    <input id="pass" type="password" autocomplete="current-password" required>
    <button class="btn" style="justify-self:center">Unlock</button>${msg?`<div class="err">${esc(msg)}</div>`:""}</form>`;
  $("#lockform").addEventListener("submit", async e=>{ e.preventDefault(); const p=$("#pass").value.trim();
    try { const d = await unlock(p, enc); store.set("trip-pass", p); start(d); } catch(err){ lockScreen(enc, "That passcode didn't work. Check it with Praneeth and try again."); } });
}

if (window.TRIP) start(window.TRIP);
else if (window.TRIP_ENC){
  const saved = store.get("trip-pass");
  if (saved) unlock(saved, window.TRIP_ENC).then(start).catch(err=>{ if (window.TRIP_ENC.z && typeof DecompressionStream==="undefined"){ $("#view").innerHTML=`<div class="card" style="margin:24px 16px"><b>Update your iPhone to open the trip app.</b><p class="small">It needs iOS 16.4 or newer: Settings, General, Software Update.</p></div>`; return; } store.del("trip-pass"); lockScreen(window.TRIP_ENC); });
  else lockScreen(window.TRIP_ENC);
}
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && !/claude/.test(location.host)) {
  navigator.serviceWorker.register("sw.js").then(r=>{ r.update().catch(()=>{}); document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") r.update().catch(()=>{}); }); }).catch(()=>{});
  // A new version took over: reload once so it shows right away.
  let reloaded=false; const hadSW=!!navigator.serviceWorker.controller; navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(reloaded || !hadSW) return; reloaded=true; location.reload(); });
}
