.psigns .sg{display:block;background:var(--city);color:#fff;font:800 19px/1 var(--sign);text-transform:uppercase;letter-spacing:.02em;padding:9px 12px 8px;border-radius:7px;box-shadow:inset 0 0 0 2.5px var(--city),inset 0 0 0 4.5px #fff;white-space:nowrap}
.psigns .pnv small{font:700 12px var(--body);color:var(--muted);padding-left:2px}
.psigns .pnv.on .sg{transform:translateY(-2px);box-shadow:inset 0 0 0 2.5px var(--city),inset 0 0 0 4.5px #fff,0 6px 12px -4px var(--city)}
.psigns .pnv:not(.on) .sg{opacity:.88}
.pindex{display:grid;border-radius:16px;overflow:hidden;background:var(--surface);box-shadow:inset 0 0 0 2px var(--line)}
.pindex .pnv{display:flex;align-items:center;gap:12px;border:0;background:none;border-top:2px solid var(--line);padding:11px 14px 11px 12px;font:inherit;color:var(--ink);text-align:left;cursor:pointer;position:relative}
.pindex .pnv:first-child{border-top:0}.pindex .pnv::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--city)}
.pindex .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--city);color:#fff;font:800 13px var(--body);flex:none}
.pindex .t{flex:1;min-width:0}.pindex b{display:block;font:800 17px/1.1 var(--sign);text-transform:uppercase;color:var(--city)}.pindex small{font:600 12.5px var(--body);color:var(--muted)}
.pindex em{font:800 11.5px var(--body);font-style:normal;color:#a3201a;background:#fde3e0;border-radius:999px;padding:3px 8px;white-space:nowrap}.pindex em.ok{background:#e3f1e6;color:#2a7148}
.pindex i{font:800 18px var(--body);font-style:normal;color:var(--muted)}.pindex .pnv.now{background:color-mix(in srgb,var(--city) 8%,transparent)}
/* B: all signs visible at once; sticky bar shows only the current city */
.pcircs.nav-b .psigns{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;overflow:visible;margin:0;padding:8px 0 4px}
.pcircs.nav-b .pnv{justify-items:stretch;min-width:0}
.pcircs.nav-b .sg{display:flex;align-items:center;justify-content:center;min-height:44px;font-size:14px;line-height:1.02;white-space:normal;text-align:center;padding:6px 4px;box-shadow:inset 0 0 0 2px var(--city),inset 0 0 0 3.5px #fff}
.pcircs.nav-b .pnv small{text-align:center;font-size:10.5px;padding:0;white-space:nowrap}
.pcircs.nav-b .pnv.on .sg{box-shadow:inset 0 0 0 2px var(--city),inset 0 0 0 3.5px #fff,0 6px 12px -4px var(--city)}
.pmini .pmini-in{justify-content:space-between;align-items:center}
.pmini .pmc{display:none}.pmini .pmc.on{display:flex;align-items:baseline;gap:8px;background:var(--city);color:#fff;border-radius:7px;padding:7px 12px 6px;box-shadow:inset 0 0 0 2px var(--city),inset 0 0 0 3.5px #fff}
.pmini .pmc.on b{font-size:17px}.pmini .pmc small{font:700 12px var(--body);opacity:.9;white-space:nowrap}
.pmup{flex:none;border:0;background:none;font:800 13px var(--body);color:var(--b);padding:6px 4px;cursor:pointer;display:flex;align-items:center;gap:4px}.pmup svg{width:14px;height:14px;transform:rotate(-90deg)}
.pcircs.nav-b .sg.trip{background:var(--bg);color:var(--city);box-shadow:inset 0 0 0 2px var(--city);outline:2px dashed var(--city);outline-offset:-6px}
/* Street signs v2: same plate as the "Back to" sign */
.pcircs.nav-b .psigns{gap:7px;padding:10px 0 6px}
.pcircs.nav-b .pnv{display:block;position:relative}
.pcircs.nav-b .sg{display:block;min-height:0;padding:3px;border-radius:8px;background:var(--city);box-shadow:0 2px 0 color-mix(in srgb,var(--city) 60%,#000);outline:0;opacity:1;transition:transform .18s}
.pcircs.nav-b .sg>span{display:grid;place-items:center;align-content:center;gap:3px;height:52px;border:1.5px solid #fff;border-radius:6px;color:#fff;padding:2px 2px}
.pcircs.nav-b .sg b{font:800 14.5px/1 var(--sign);text-transform:uppercase;letter-spacing:.02em;text-align:center}
.pcircs.nav-b .sg small{font:700 10px/1 var(--body);opacity:.85;white-space:nowrap;letter-spacing:.01em}
.pcircs.nav-b .sg.trip>span{border-style:dashed}
.pcircs.nav-b .sg.trip{background:var(--city);color:#fff;outline:0}
.pcircs.nav-b .pnv>small{display:none}
.pcircs.nav-b .pnv.on .sg{transform:translateY(-3px);box-shadow:0 5px 0 color-mix(in srgb,var(--city) 60%,#000),0 10px 16px -8px var(--city)}
.pcircs.nav-b .pnv.on::after{content:"";position:absolute;left:50%;bottom:-9px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--city)}
/* sticky bar: all five, current one lit */
.pmini .pmini-in{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:7px 16px 8px}
.pmini .pmc,.pmini .pmc.on{display:block;padding:2px;border-radius:7px;background:var(--city);box-shadow:none;opacity:.45;transition:opacity .2s,transform .2s}
.pmini .pmc>span{display:grid;place-items:center;height:28px;border:1.25px solid #fff;border-radius:5px;color:#fff}
.pmini .pmc b{font:800 12px/1 var(--sign);text-transform:uppercase;white-space:nowrap}
.pmini .pmc.trip>span{border-style:dashed}
.pmini .pmc.on{opacity:1;transform:translateY(-1px);box-shadow:0 3px 0 color-mix(in srgb,var(--city) 60%,#000)}
.pcircs.nav-b .sg small{color:#fff;text-transform:none;font:700 10.5px/1 var(--body);opacity:.9}
.pcircs.nav-b .sg>span{height:54px}
.pmini .pmc,.pmini .pmc.on{opacity:.72}.pmini .pmc.on{opacity:1}
.pmini .pmc b{font-size:11px;letter-spacing:0}
.pmini .pmc b,.pmini .pmc.on b{font-size:12.5px;letter-spacing:0}

/* First-open setup */
.su-top{display:flex;justify-content:center;padding:18px 0 4px}
.su-top .brand{font-size:26px}
.su{max-width:520px;margin:0 auto;padding:6px 2px 40px;display:grid;gap:12px}
.su-step{font:700 12px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.su-dots{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.su-dots b{height:5px;border-radius:9px;background:var(--muted);opacity:.35}
.su-dots b.on{background:var(--saffron);opacity:1}
.su h1{font:800 30px/1.05 var(--display);margin:6px 0 0;letter-spacing:-.01em}
.su>p{margin:0;color:var(--muted);font-size:15px;line-height:1.45}
.su-who{display:grid;gap:10px}
.su-who button{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:700 19px var(--body);cursor:pointer;text-align:left}
.su-who button small{font:600 13px var(--body);color:var(--muted)}
.su-who button.on,.su-who button:active{background:#ffcd00;color:#141414}
.su-paste{width:100%;box-sizing:border-box;border:2px dashed var(--line);border-radius:14px;padding:12px;font:16px var(--body);background:var(--surface);color:var(--ink);resize:vertical}
.su-wide{width:100%;justify-content:center;text-align:center;box-sizing:border-box}
.su-or{text-align:center;font:700 12px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.su-leg{border:2px solid var(--line);border-radius:16px;padding:12px;background:var(--surface);display:grid;gap:10px}
.su-lh{display:flex;justify-content:space-between;align-items:center}
.su-lh b{font:800 15px var(--display);text-transform:uppercase;letter-spacing:.04em}
.su-two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.su-leg label{display:grid;gap:5px;font:700 12px var(--body);color:var(--muted);min-width:0}
.su-leg input{width:100%;box-sizing:border-box;min-width:0;border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;font:600 16px var(--body);background:var(--bg);color:var(--ink)}
.su-next{margin-top:6px}
.su-skip{background:none;border:0;color:var(--muted);font:600 14px var(--body);text-decoration:underline;cursor:pointer;padding:6px;min-height:44px}
.su-chk .bkl{margin:0}
.su-note{background:var(--jade-soft);color:var(--ink);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.45}
.su-ok{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--surface);border:2px solid var(--line)}
.su-ok i{flex:none;width:26px;height:26px;border-radius:50%;background:var(--jade);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:800}
.su-ok span{display:grid;gap:2px;font-size:14px;color:var(--muted);line-height:1.4}
.su-ok b{color:var(--ink);font-size:15px}
.su-nudge{display:grid;gap:6px;border-color:var(--saffron)!important}
.su-nudge b{font:800 17px var(--display)}
.su-nudge span{font-size:14px;color:var(--muted)}
.su-nudge .btns{margin:4px 0 0}
/* Who lands when */
.arrivals{display:grid;gap:0;padding:4px 14px}
.arr-r{display:grid;gap:2px;padding:10px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 15%,transparent)}
.arr-r:last-child{border:0}
.arr-r b{font-size:15px}
.arr-r span{font-size:14px}
.arrplan b{display:block;font:800 17px var(--display);margin-bottom:4px}
.arrplan .steps{margin:6px 0 10px}
/* Days you're not there */
.pday.away{opacity:.42;filter:grayscale(1)}
.pday.away .ptn{display:none}
.paway{display:inline-block;justify-self:start;font:700 11px var(--body);letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:var(--bg);padding:3px 8px;border-radius:6px;margin-bottom:4px}

/* Day card layouts (mock: ?card=a|b|c) */
/* A: wider photo, bigger type */
html[data-card="a"] .pday{grid-template-columns:42% 1fr;min-height:172px;border-radius:18px}
html[data-card="a"] .pday-x{padding:14px 14px 14px}
html[data-card="a"] .pday .pt{font-size:18px;line-height:1.2;margin-bottom:4px}
html[data-card="a"] .pday li{font-size:14px;gap:9px}
html[data-card="a"] .pday ul{gap:6px;margin:8px 0 10px}
html[data-card="a"] .pdate{left:10px;top:10px;padding:5px 10px 4px}
html[data-card="a"] .pdate b{font-size:28px}
/* B: photo banner on top, text full width below */
html[data-card="b"] .pday{grid-template-columns:1fr;grid-template-rows:auto;border-radius:18px}
html[data-card="b"] .pday.tnb{grid-template-rows:auto 1fr auto}
html[data-card="b"] .pimg{height:150px;min-height:0}
html[data-card="b"] .pimg::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgb(0 0 0/.45))}
html[data-card="b"] .pdate{left:12px;top:12px;padding:5px 11px 4px;z-index:2}
html[data-card="b"] .pdate b{font-size:28px}
html[data-card="b"] .ptstub{left:auto;right:12px;bottom:12px;max-width:62%;z-index:2;padding:6px 9px;font-size:13px}
html[data-card="b"] .pwx.on{left:12px;bottom:12px;z-index:2}
html[data-card="b"] .pday-x{padding:14px 16px 14px}
html[data-card="b"] .pday .pt{font-size:20px;line-height:1.2;margin-bottom:4px}
html[data-card="b"] .pday ul{gap:7px;margin:10px 0 12px}
html[data-card="b"] .pday li{font-size:14px}
/* C: full-bleed photo, text over a dark fade */
html[data-card="c"] .pday{grid-template-columns:1fr;position:relative;min-height:210px;border-radius:18px;box-shadow:none;isolation:isolate}
html[data-card="c"] .pday.tnb{grid-template-rows:1fr auto}
html[data-card="c"] .pimg{position:absolute;inset:0;z-index:-1}
html[data-card="c"] .pimg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgb(10 12 20/.86) 0%,rgb(10 12 20/.62) 55%,rgb(10 12 20/.15) 100%)}
html[data-card="c"] .pdate{left:auto;right:12px;top:12px;z-index:2;padding:5px 11px 4px}
html[data-card="c"] .pdate b{font-size:28px}
html[data-card="c"] .ptstub{left:16px;right:auto;bottom:auto;top:14px;max-width:60%;z-index:2;padding:5px 9px}
html[data-card="c"] .pday:has(.ptstub) .pday-x{padding-top:56px}
html[data-card="c"] .pday-x{padding:16px 90px 14px 16px;color:#fff}
html[data-card="c"] .pday .pt{font-size:21px;line-height:1.15;margin-bottom:4px;color:#fff;text-shadow:0 1px 8px rgb(0 0 0/.4)}
html[data-card="c"] .pday .pp{color:rgb(255 255 255/.8)}
html[data-card="c"] .pday li{font-size:14px;color:#fff;opacity:.95}
html[data-card="c"] .pday li .ic2{color:#ffd76a}
html[data-card="c"] .pday ul{gap:7px;margin:10px 0 12px}
html[data-card="c"] .pday.tnb>.ptn{background:var(--surface);border-top:0}
html[data-card="c"] .pday.is-today{box-shadow:0 0 0 3px var(--lan)}
/* C: flight stub as a frosted glass pill on the photo */
html[data-card="c"] .ptstub{top:16px;left:16px;max-width:none;flex-wrap:nowrap;gap:6px;padding:6px 12px 6px 10px;border-radius:999px;background:rgb(255 255 255/.16);-webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%);border:1px solid rgb(255 255 255/.32);box-shadow:0 4px 14px rgb(0 0 0/.18);color:#fff;font-size:13px;letter-spacing:.02em}
html[data-card="c"] .ptstub svg{color:#ffd76a;width:14px;height:14px}
html[data-card="c"] .ptstub i{flex-basis:auto;color:rgb(255 255 255/.85);font-size:12px;font-weight:700;padding-left:8px;margin-left:2px;border-left:1px solid rgb(255 255 255/.35)}
html[data-card="c"] .pday:has(.ptstub) .pday-x{padding-top:62px}
/* Floating map button: blue-tinted glass */
.pfab{background:rgb(31 78 154/.74);-webkit-backdrop-filter:blur(16px) saturate(170%);backdrop-filter:blur(16px) saturate(170%);border:1px solid rgb(255 255 255/.35);box-shadow:0 8px 24px rgb(15 30 60/.22),inset 0 1px 0 rgb(255 255 255/.25);text-shadow:0 1px 2px rgb(0 0 0/.2)}
/* Compact Days / Bookings switch, with the trip line beside it */
html.street .seg.seg-c{display:inline-flex;width:auto;background:var(--surface);border-radius:999px;padding:3px;gap:2px;box-shadow:inset 0 0 0 1.5px var(--line);margin:0 0 4px}
html.street .seg.seg-c a{flex:none;padding:7px 16px;border-radius:999px;box-shadow:none;font-size:13.5px}
html.street .seg.seg-c a[aria-current="page"]{box-shadow:none}
.ptop2{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0}
.ptop2 .seg.seg-c{margin:0}
.ptop2 .pl{margin:0;text-align:right;font:600 12.5px/1.25 var(--body)}
.ptop2+.pcircs{margin-top:2px}
.ptop2+.pcircs.nav-b .psigns{padding-top:8px}
html.street .seg.seg-c{width:max-content;justify-self:start;align-self:flex-start}
.ptop2 .pl{white-space:nowrap}

/* Stays (new) */
.nstrip{background:var(--surface);border-radius:18px;padding:12px 12px 10px;box-shadow:inset 0 0 0 1.5px var(--line);margin:0 0 14px}
.nsh{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 8px}.nsh b{font:800 15px var(--body)}.nsh span{font:600 12.5px var(--body);color:var(--muted)}
.nscs{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.nsc{position:relative;display:grid;justify-items:center;gap:1px;padding:6px 0 8px;border-radius:10px;background:color-mix(in srgb,var(--city) 13%,var(--surface));color:var(--ink);text-decoration:none}
.nsc small{font:700 10px var(--body);text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}.nsc b{font:800 19px/1 var(--sign)}
.nsc i{width:70%;height:4px;border-radius:4px;background:var(--city);margin-top:4px}
.nsc.bad{background:#fde3e0;color:#9b1c12}.nsc.bad i{background:repeating-linear-gradient(90deg,#c62a2a 0 4px,transparent 4px 7px)}
.nsc.two em{position:absolute;top:-5px;right:-4px;font:800 10px/16px var(--body);font-style:normal;width:16px;height:16px;border-radius:50%;background:#e9a400;color:#1d1a14;text-align:center}
.nsc.now{box-shadow:inset 0 0 0 2px var(--city)}
.nsl{display:flex;flex-wrap:wrap;gap:6px 12px;margin:9px 2px 0}.nl{font:700 12px var(--body);display:inline-flex;align-items:center;gap:6px}.nl::before{content:"";width:10px;height:10px;border-radius:3px}
.nl.bad{color:#9b1c12}.nl.bad::before{background:#c62a2a}.nl.two{color:#7a5300}.nl.two::before{background:#e9a400;border-radius:50%}
.stcs{display:grid;gap:14px}
.stc{position:relative;display:grid;grid-template-rows:1fr auto;min-height:220px;border-radius:18px;overflow:hidden;text-decoration:none;color:#fff;isolation:isolate;background:var(--city)}
.stc-ph{position:absolute;inset:0;z-index:-1}.stc-ph .ph{position:absolute;inset:0;background-size:cover;background-position:center}
.stc-ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgb(10 12 20/.05) 20%,rgb(10 12 20/.78) 100%)}
.stc-in{align-self:end;display:grid;gap:5px;padding:16px 16px 14px;justify-items:start}
.stc-sign{font-size:13px!important}
.stc-n{font:800 23px/1.12 var(--body);text-shadow:0 1px 10px rgb(0 0 0/.35)}
.stc-d{font:600 13.5px var(--body);color:rgb(255 255 255/.88)}
.stc-f{display:flex;align-items:center;gap:9px;padding:11px 14px;background:var(--surface);color:var(--ink);font:700 13.5px/1.3 var(--body)}
.stc-f svg{width:17px;height:17px;flex:none;color:var(--jade)}.stc-f span{flex:1}.stc-f i{font:800 18px var(--body);font-style:normal;color:var(--muted)}
.stc-f.bad{background:#fde3e0;color:#9b1c12}.stc-f.bad svg{color:#c62a2a}
.stc-f.warn{background:#fff3cf;color:#6b4700}.stc-f.warn svg{color:#b07a00}
.stc-f.ok{background:#dcefe2;color:#1c5a2e}.stc-f.ok svg{color:#1c5a2e}
.stc-f.solo{border-radius:14px;margin:0 0 12px}
.stin{margin-top:16px}.stin>summary{list-style:none;display:flex;align-items:baseline;gap:10px;cursor:pointer;padding:10px 2px}.stin>summary::-webkit-details-marker{display:none}
.stin>summary b{font:800 20px var(--sign);text-transform:uppercase}.stin>summary span{flex:1;font:600 13px var(--body);color:var(--muted)}.stin>summary i{font:700 13px var(--body);font-style:normal;color:var(--jade)}
.stin[open]>summary i{visibility:hidden}
/* stay page */
.stp-hero{position:relative;height:260px;margin:-8px -16px 0;overflow:hidden;color:#fff;isolation:isolate}
.stp-hero .ph{position:absolute;inset:0;z-index:-1;background-size:cover;background-position:center}
.stp-hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgb(10 12 20/.3),transparent 35%,rgb(10 12 20/.8))}
.stp-back{position:absolute;left:16px;top:14px;padding:7px 12px;border-radius:999px;color:#fff;text-decoration:none;font:700 13.5px var(--body);background:rgb(255 255 255/.18);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgb(255 255 255/.3)}
.stp-hin{position:absolute;left:16px;right:16px;bottom:16px;display:grid;gap:5px;justify-items:start}
.stp-hin small{font:700 12px var(--body);text-transform:uppercase;letter-spacing:.06em;opacity:.9}.stp-hin b{font:800 26px/1.1 var(--body)}
.stp-act{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 12px}
.stp-act>*{display:grid;justify-items:center;gap:5px;padding:12px 4px 10px;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink);text-decoration:none;font:700 12px/1.2 var(--body);text-align:center;border:0;cursor:pointer}
.stp-act svg{width:22px;height:22px;color:var(--city)}.stp-act>[disabled]{opacity:.5}
.stts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 10px}
.stt{background:var(--surface);border-radius:14px;padding:12px 13px;box-shadow:inset 0 0 0 1.5px var(--line);display:grid;gap:3px;align-content:start}
.stt small{font:800 10.5px var(--body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}.stt b{font:800 15px/1.25 var(--body)}.stt span{font:600 12.5px/1.3 var(--body);color:var(--muted)}
.stt.dim b{color:var(--muted);font-weight:700}
.stcan{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:var(--surface);border-radius:14px;padding:12px 14px;box-shadow:inset 0 0 0 1.5px var(--line);margin:0 0 6px}

/* Today tabs */
.ttabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px);z-index:6;display:flex;gap:4px;margin:14px -16px 10px;padding:8px 16px;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.ttabs button{flex:1;display:inline-flex;justify-content:center;align-items:center;gap:6px;padding:9px 6px;border:0;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink);font:700 13.5px var(--body);cursor:pointer}
.ttabs button[aria-selected="true"]{background:var(--b);color:#fff;box-shadow:none}
.ttabs i{font:800 11px/18px var(--body);font-style:normal;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#c62a2a;color:#fff}
.tpane>h3:first-child{margin-top:4px}
.tnxs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:2px 0 6px}
.tnx{display:grid;gap:3px;align-content:start;text-align:left;padding:12px 13px;border:0;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink);cursor:pointer}
.tnx small{font:800 10.5px var(--body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}.tnx b{font:800 15px/1.25 var(--body)}.tnx span{font:600 12.5px var(--body);color:var(--b)}
.tnx.soon{background:#fff3cf;box-shadow:none}.tnx.soon span{color:#8a5a00}
.tminis{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}.tminis::-webkit-scrollbar{display:none}
.tmini{position:relative;flex:0 0 62%;height:150px;border-radius:16px;overflow:hidden;color:#fff;text-decoration:none;scroll-snap-align:start;isolation:isolate;display:flex;align-items:flex-end;padding:12px}
.tmini .ph{position:absolute;inset:0;z-index:-1;background-size:cover;background-position:center}
.tmini::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(transparent 35%,rgb(10 12 20/.8))}
.tmini>b{font:800 16px/1.2 var(--body)}.tmini .pdate{left:10px;top:10px}
.tminis{scroll-padding-left:16px}.tmini:last-child{margin-right:16px}

/* Glass tabs: one frosted capsule with a sliding pill (default) */
.ttabs{position:sticky}
.ttabs .tind{display:none}
html[data-gl="1"] .ttabs{margin:12px 0 12px;padding:4px;gap:0;border-radius:999px;background:rgb(255 255 255/.55);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:inset 0 0 0 1px rgb(255 255 255/.7),inset 0 1px 0 rgb(255 255 255/.9),0 8px 24px rgb(20 40 80/.12)}
html[data-gl="1"] .ttabs button{position:relative;z-index:1;background:none;box-shadow:none;color:var(--ink);transition:color .3s}
html[data-gl="1"] .ttabs button[aria-selected="true"]{background:none;color:#fff}
html[data-gl="1"] .ttabs .tind{display:block;position:absolute;left:0;top:4px;bottom:4px;border-radius:999px;background:linear-gradient(180deg,#2b63bd,#1f4e9a);box-shadow:inset 0 1px 0 rgb(255 255 255/.35),0 4px 12px rgb(31 78 154/.35)}
html[data-gl="1"] .ttabs.ready .tind{transition:transform .38s cubic-bezier(.3,1.3,.5,1),width .38s cubic-bezier(.3,1.3,.5,1)}
html[data-gl="1"][data-theme="dark"] .ttabs{background:rgb(20 30 55/.55);box-shadow:inset 0 0 0 1px rgb(255 255 255/.14),0 8px 24px rgb(0 0 0/.3)}
html[data-gl="1"][data-theme="dark"] .ttabs button{color:var(--ink)}
/* panes ease in */
html[data-gl="1"] .tpane:not([hidden]){animation:tpin .35s cubic-bezier(.2,.8,.2,1)}
@keyframes tpin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){html[data-gl="1"] .tpane:not([hidden]){animation:none}}
/* glass cards floating over the bottom of the photo */
html[data-gl="1"] .shero.hasover{height:min(400px,52vh)}
html[data-gl="1"] .shero.hasover .tx{bottom:104px}
html[data-gl="1"] .tover{position:relative;z-index:2;margin-top:-96px}
html[data-gl="1"] .tover .tnxs{margin:0}
html[data-gl="1"] .tover .tnx{background:rgb(255 255 255/.18);-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);box-shadow:inset 0 0 0 1px rgb(255 255 255/.35),inset 0 1px 0 rgb(255 255 255/.5),0 10px 30px rgb(0 0 0/.25);color:#fff}
html[data-gl="1"] .tover .tnx small{color:rgb(255 255 255/.8)}html[data-gl="1"] .tover .tnx span{color:#ffd76a}
html[data-gl="1"] .tover .tnx.soon{background:rgb(255 205 0/.28)}
/* shorter photo header during the trip */
html[data-gl="1"] .shero:not(.hasover):has(~ .swall){height:220px;min-height:0}
html[data-gl="1"] .shero:not(.hasover):has(~ .swall) .plate{transform:scale(.82);transform-origin:left bottom}
/* glass details: the capchip and countdown line */
html[data-gl="1"] .shero .capchip{background:rgb(255 255 255/.16);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgb(255 255 255/.3)}
/* a soft colour wash behind Today so cards read as glass */
html[data-gl="1"] body:has(.ttabs){background:radial-gradient(60% 40% at 90% 30%,rgb(242 201 76/.28),transparent 70%),radial-gradient(70% 45% at 0% 70%,rgb(31 78 154/.14),transparent 70%),var(--bg);background-attachment:fixed}
html[data-gl="1"] .tpane .card,html[data-gl="1"] .tpane .tnx{background:rgb(255 255 255/.66);-webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%);box-shadow:inset 0 0 0 1px rgb(255 255 255/.8),0 6px 18px rgb(20 40 80/.08);border-color:transparent}
html[data-gl="1"][data-theme="dark"] .tpane .card,html[data-gl="1"][data-theme="dark"] .tpane .tnx{background:rgb(30 42 70/.6);box-shadow:inset 0 0 0 1px rgb(255 255 255/.1)}
/* glass cards sit fully inside the photo, not across its edge */
html[data-gl="1"] .shero.hasover{height:min(430px,56vh)}
html[data-gl="1"] .shero.hasover .tx{bottom:128px}
html[data-gl="1"] .tover{margin-top:-120px;margin-bottom:8px}
html[data-gl="1"] .tover .tnxs{align-items:stretch}
html[data-gl="1"] .tover .tnx{background:rgb(20 24 34/.32);min-height:96px}
html[data-gl="1"] .tover .tnx.soon{background:rgb(20 24 34/.32);box-shadow:inset 0 0 0 1px rgb(255 255 255/.35),inset 3px 0 0 #ffcd00,0 10px 30px rgb(0 0 0/.25)}

/* ===== Liquid glass, app-wide (default; ?gl=0 turns it off) ===== */
html[data-gl="1"]{--glass:rgb(255 255 255/.62);--glass-edge:inset 0 0 0 1px rgb(255 255 255/.78),inset 0 1px 0 rgb(255 255 255/.95);--glass-shadow:0 6px 18px rgb(20 40 80/.08);--glass-blur:blur(18px) saturate(170%)}
html[data-gl="1"][data-theme="dark"]{--glass:rgb(28 40 68/.55);--glass-edge:inset 0 0 0 1px rgb(255 255 255/.12),inset 0 1px 0 rgb(255 255 255/.16);--glass-shadow:0 8px 22px rgb(0 0 0/.28)}
/* a soft colour wash on every page so the glass has something to sit on */
html[data-gl="1"] body{background:radial-gradient(60% 40% at 92% 22%,rgb(242 201 76/.26),transparent 70%),radial-gradient(70% 45% at 0% 72%,rgb(31 78 154/.13),transparent 70%),radial-gradient(50% 35% at 70% 100%,rgb(198 42 42/.07),transparent 70%),var(--bg);background-attachment:fixed}
html[data-gl="1"][data-theme="dark"] body{background:radial-gradient(60% 40% at 92% 22%,rgb(242 201 76/.10),transparent 70%),radial-gradient(70% 45% at 0% 72%,rgb(60 110 220/.18),transparent 70%),var(--bg);background-attachment:fixed}
/* cards and tiles */
html[data-gl="1"] main .card,html[data-gl="1"] .stt,html[data-gl="1"] .stcan,html[data-gl="1"] .nstrip,html[data-gl="1"] .stp-act>*,html[data-gl="1"] .stdays a,html[data-gl="1"] .tnx,html[data-gl="1"] .hop2,html[data-gl="1"] .tile,html[data-gl="1"] .su-leg,html[data-gl="1"] .su-ok,html[data-gl="1"] .su-who button,html[data-gl="1"] .tpane .card{background:var(--glass);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);box-shadow:var(--glass-edge),var(--glass-shadow);border-color:transparent}
html[data-gl="1"] .stcan.warn{background:rgb(255 236 170/.7)}
html[data-gl="1"] .tover .tnx{background:rgb(20 24 34/.32)}
/* segmented controls (Explore, Days/Bookings): one glass capsule, blue pill */
html[data-gl="1"] .seg{background:var(--glass)!important;-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);box-shadow:var(--glass-edge),var(--glass-shadow)!important;border-radius:999px!important;padding:4px!important;gap:2px!important}
html[data-gl="1"] .seg a{background:none!important;box-shadow:none!important;border-radius:999px!important;padding:9px 0}
html[data-gl="1"] .seg a[aria-current="page"]{background:linear-gradient(180deg,#2b63bd,#1f4e9a)!important;color:#fff!important;box-shadow:inset 0 1px 0 rgb(255 255 255/.35),0 4px 12px rgb(31 78 154/.3)!important}
/* sticky city bar and header-adjacent bars */
html[data-gl="1"] .pmini{background:color-mix(in srgb,var(--bg) 55%,transparent);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur)}
/* buttons on photos */
html[data-gl="1"] .phero .pbtns button,html[data-gl="1"] .ptodo{background:rgb(255 255 255/.2);color:#fff;-webkit-backdrop-filter:blur(14px) saturate(170%);backdrop-filter:blur(14px) saturate(170%);box-shadow:inset 0 0 0 1px rgb(255 255 255/.38),0 4px 14px rgb(0 0 0/.18)}
html[data-gl="1"] .phero .pbtns button svg{color:#fff}
html[data-gl="1"] .ptodo{color:#fff}
/* regular buttons */
html[data-gl="1"] main .btn:not(.solid){background:var(--glass);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);box-shadow:var(--glass-edge),var(--glass-shadow);border-color:transparent}
html[data-gl="1"] main .btn.solid{background:linear-gradient(180deg,#2b63bd,#1f4e9a);border-color:transparent;box-shadow:inset 0 1px 0 rgb(255 255 255/.3),0 6px 16px rgb(31 78 154/.28)}
/* bottom sheets */
html[data-gl="1"] .sheet{background:color-mix(in srgb,var(--surface) 80%,transparent);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);box-shadow:inset 0 1px 0 rgb(255 255 255/.6),0 -10px 40px rgb(0 0 0/.18)}
html[data-gl="1"] .sheet .shead{background:transparent}
/* bottom tab bar: selected tab as a glass-blue pill */
html[data-gl="1"].street nav.tabs a:not(.tmid)[aria-current="page"] svg{background:linear-gradient(180deg,#2b63bd,#1f4e9a);box-shadow:inset 0 1px 0 rgb(255 255 255/.35),0 3px 10px rgb(31 78 154/.3);border-radius:999px}
/* keep the bold yellow wall but give its action buttons glass */
html[data-gl="1"] .wnbar .btn:not(.solid){background:rgb(255 255 255/.45)}
html.street[data-theme="dark"] .nsc.bad{background:rgb(198 42 42/.22);color:#ffb3ab}
html.street[data-theme="dark"] .nl.bad{color:#ff9b92}html.street[data-theme="dark"] .nl.two{color:#ffd76a}
html.street[data-theme="dark"] .nsc{background:color-mix(in srgb,var(--city) 22%,transparent)}
html.street[data-theme="dark"] .bkrow .bkk,html.street[data-theme="dark"] .bkrow .bkk svg,html.street[data-theme="dark"] .bktag,html.street[data-theme="dark"] .bkcity h2{color:#8fb4ff}

/* Food guide on bingo tiles, phrasebook sections, trivia city chips */
.tile .dmore{display:grid;gap:4px;margin-top:4px;padding-top:6px;border-top:1px dashed var(--line)}
.tile .dprice{font-weight:700;color:var(--ink);font-size:12.5px}

.tile .dord{display:flex;align-items:center;gap:6px;color:var(--jade);font-size:12px}

.tile .dord i{font-style:normal;font-weight:600}
.phrd{padding:2px 16px;margin:0 0 8px}
.phchips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}

.tlx-band::after{display:none}

.xchaps{gap:8px}
.hr{grid-template-columns:64px 1fr;min-height:64px;gap:12px}

.tlbar{margin:12px 0 2px}

.tlr{margin:10px 0 6px}

html.street{background:linear-gradient(var(--wall) 50%,var(--bg) 50%)}

.tlb-eras{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:10px -16px 8px;padding:0 16px}

.tlbc b{display:block;font:700 18px/1.25 var(--body);margin:2px 0 6px}

.tlc{margin-top:14px;border-radius:14px;overflow:hidden;background:var(--surface);box-shadow:inset 0 0 0 2px var(--line)}

/* Timeline mock D: chapters */
.tld{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tld-t{position:relative;border:0;padding:0;border-radius:16px;overflow:hidden;min-height:200px;text-align:left;color:#fff;background:var(--e);font:inherit;cursor:pointer;display:flex;align-items:flex-end}

/* Timeline mock E: one-screen scrubber */
.tle2-top{margin-top:12px;color:var(--e)}
.tle2-top small{font:800 12px var(--body);letter-spacing:.06em;text-transform:uppercase}
.tle2-y{font:800 56px/.95 var(--sign);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tle2-rule{display:flex;gap:4px;margin:10px 0 14px}
.tle2-seg{min-width:0;display:grid;gap:5px}
.tle2-seg .dots{display:flex;justify-content:space-around;align-items:center;height:22px;background:color-mix(in srgb,var(--e) 18%,transparent);border-radius:999px;padding:0 3px}
.tle2-seg button{width:9px;height:9px;padding:0;border:0;border-radius:50%;background:color-mix(in srgb,var(--e) 45%,#fff);flex:none;transition:transform .2s}
.tle2-seg button.past{background:var(--e)}
.tle2-seg button.on{background:var(--e);transform:scale(1.9);box-shadow:0 0 0 2px var(--bg)}
.tle2-seg span{font:700 9.5px var(--body);color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tle2-card{background:var(--surface);border-radius:18px;overflow:hidden;box-shadow:inset 0 0 0 2px var(--line),0 10px 24px #0001;border-top:5px solid var(--e);animation:tleIn .25s ease}
.tle2-card .ph{height:200px;border-radius:0}
.tle2-card .in{padding:14px 16px 16px}
.tle2-card b{display:block;font:700 20px/1.25 var(--body);margin-bottom:6px}
.tle2-card p{margin:0 0 8px;line-height:1.5;opacity:.88}
.tle2-nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tle2-nav button{border:0;border-radius:999px;padding:12px;font:700 15px var(--body);background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.tle2-nav button.solid{background:var(--b);color:#fff;box-shadow:none}
.tle2-nav button:disabled{opacity:.4}
@keyframes tleIn{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Timeline mock F: trip through time */
.tlf-pre{background:var(--surface);border-radius:14px;box-shadow:inset 0 0 0 2px var(--line);padding:0 14px;margin-bottom:14px}
.tlf-pre summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:12px 0;cursor:pointer}
.tlf-pre summary::-webkit-details-marker{display:none}
.tlf-pre summary span{font:600 12.5px var(--body);color:var(--b)}
.tlf-rows{padding-bottom:10px}
.tlf-r{display:grid;grid-template-columns:86px 1fr;gap:8px;padding:5px 0;border-top:1px solid var(--line);font-size:13.5px}
.tlf-r .y{font:800 13px var(--sign);color:var(--b)}
.tlf-stop{margin-bottom:18px}
.tlf-h{position:relative;display:flex;align-items:flex-end;height:96px;border-radius:14px;overflow:hidden;color:#fff;background:#333}
.tlf-h .ph{position:absolute;inset:0;border-radius:0}
.tlf-h::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#000b,#0002)}
.tlf-h .in{position:relative;z-index:1;padding:12px 14px;display:grid}
.tlf-h small{font:700 12px var(--body);opacity:.9}
.tlf-h b{font:800 28px/1 var(--sign);text-transform:uppercase}
ol.tlf{list-style:none;margin:8px 0 0;padding:0 0 0 14px;border-left:3px solid var(--line);margin-left:8px}
ol.tlf li{display:grid;grid-template-columns:78px 1fr;gap:10px;padding:8px 0;position:relative}
ol.tlf li::before{content:"";position:absolute;left:-21px;top:13px;width:11px;height:11px;border-radius:50%;background:var(--bg);border:3px solid var(--muted)}
ol.tlf .y{font:800 13.5px/1.3 var(--sign);color:var(--muted);padding-top:2px}
ol.tlf b{display:block;font:700 15px/1.3 var(--body)}
ol.tlf p{margin:2px 0 0;font-size:13px;line-height:1.45;color:var(--muted)}
ol.tlf li.here::before{background:#f2c94c;border-color:#c99312;width:13px;height:13px;left:-22px}
ol.tlf li.here .y{color:#a67a06}
ol.tlf li.here .c{background:color-mix(in srgb,#f2c94c 22%,var(--surface));border-radius:14px;overflow:hidden;box-shadow:inset 0 0 0 2px color-mix(in srgb,#f2c94c 60%,var(--line))}
ol.tlf li.here .c>div{padding:10px 12px 12px}
ol.tlf li.here .c .ph{display:block;height:120px;border-radius:0}
ol.tlf li.here p{color:var(--ink);opacity:.85}
.tlf-pin{margin-top:8px;border:0;border-radius:999px;background:var(--b);color:#fff;font:700 12px var(--body);padding:6px 10px;display:inline-flex;align-items:center;gap:4px}
.tlf-pin svg{width:13px;height:13px}
.tlf-more{display:inline-block;margin:4px 0 0 30px;font:700 13px var(--body);color:var(--b)}

/* Trip through time: tighter */
ol.tlf{padding-left:12px;margin:6px 0 0 6px}
ol.tlf li{display:block;padding:6px 0}
ol.tlf li::before{left:-19px;top:11px}
ol.tlf li.here::before{left:-20px;top:16px}
ol.tlf .y{display:block;font-size:12.5px;padding:0;letter-spacing:.03em}
ol.tlf li.here .c .y{margin-bottom:1px}
ol.tlf li.here .c .ph{height:150px}
ol.tlf li.here .c>div{padding:10px 12px}
.tlf-pin{margin-top:6px}
.tlf-h{height:84px}
.tlf-stop{margin-bottom:12px}
.tlf-more{margin:2px 0 0 18px}
h2.tlf-title{font-size:26px;margin:6px 0 0}
ol.tlf{padding-left:20px}
ol.tlf li::before{left:-27px}
ol.tlf li.here::before{left:-28px}
html.street h2.tlf-title{font-size:30px;line-height:1;margin:4px 0 0}

/* History: timeline entry card */
.tlnew{position:relative;display:grid;gap:10px;margin:12px 0 4px;padding:14px 14px 12px;border-radius:18px;text-decoration:none;color:var(--ink);background:linear-gradient(135deg,rgb(242 201 76/.35),rgb(31 78 154/.12));box-shadow:inset 0 0 0 1px rgb(255 255 255/.7),0 8px 22px rgb(20 40 80/.1);-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%)}
html[data-theme="dark"] .tlnew{background:linear-gradient(135deg,rgb(242 201 76/.16),rgb(60 110 220/.18));box-shadow:inset 0 0 0 1px rgb(255 255 255/.12),0 8px 22px rgb(0 0 0/.3)}
.tln-h{display:grid;gap:1px;padding-right:30px}
.tln-h small{font:800 11.5px var(--body);letter-spacing:.08em;text-transform:uppercase;color:#a67a06}
html[data-theme="dark"] .tln-h small{color:#f2c94c}
.tln-h b{font:800 22px/1.05 var(--sign);text-transform:uppercase;letter-spacing:.01em}
.tln-h em{font:500 13px var(--body);font-style:normal;color:var(--muted)}
.tln-go{position:absolute;right:14px;top:16px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--b);color:#fff;font:700 20px/1 var(--body);box-shadow:0 4px 10px rgb(31 78 154/.3)}
.tln-route{position:relative;display:flex;justify-content:space-between}
.tln-route::before{content:"";position:absolute;left:24px;right:24px;top:23px;border-top:2px dashed color-mix(in srgb,var(--b) 45%,transparent)}
.tln-s{position:relative;display:grid;justify-items:center;gap:4px;width:20%}
.tln-s .ph{width:46px;height:46px;border-radius:50%;box-shadow:0 0 0 2.5px #fff,0 3px 8px rgb(0 0 0/.18)}
html[data-theme="dark"] .tln-s .ph{box-shadow:0 0 0 2.5px var(--surface),0 3px 8px rgb(0 0 0/.4)}
.tln-s i{font:700 11px var(--body);font-style:normal;white-space:nowrap}
.tlnew:active{transform:scale(.985)}
/* Trip timeline: travelling glass pill */
.tlf-pill{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + var(--hdr,60px) + 8px);z-index:20;display:flex;align-items:center;gap:8px;padding:7px 12px 7px 10px;border-radius:999px;transform:translate(-50%,-14px);opacity:0;pointer-events:none;transition:opacity .25s,transform .3s cubic-bezier(.2,.8,.2,1);background:rgb(255 255 255/.62);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:inset 0 0 0 1px rgb(255 255 255/.8),0 6px 18px rgb(20 40 80/.14);white-space:nowrap}
html[data-theme="dark"] .tlf-pill{background:rgb(28 40 68/.6);box-shadow:inset 0 0 0 1px rgb(255 255 255/.14),0 6px 18px rgb(0 0 0/.35)}
.tlf-pill.show{opacity:1;transform:translate(-50%,0)}
.tlf-dots{display:flex;gap:4px}
.tlf-dots i{width:6px;height:6px;border-radius:50%;background:color-mix(in srgb,var(--ink) 22%,transparent);transition:all .3s}
.tlf-dots i.past{background:#c99312}
.tlf-dots i.on{width:16px;border-radius:3px;background:#c99312}
.tlf-pill b{font:800 13px var(--body)}
.tlf-pill span#tlfyr{font:700 13px var(--sign);color:#a67a06;letter-spacing:.03em}
html[data-theme="dark"] .tlf-pill span#tlfyr{color:#f2c94c}
/* Liquid glass across Explore */
html[data-gl="1"] .hr,html[data-gl="1"] .xlook,html[data-gl="1"] .tlf-pre,html[data-gl="1"] .phrd,html[data-gl="1"] .eatfood,html[data-gl="1"] .chipbtn,html[data-gl="1"] .tld-m{background:var(--glass)!important;-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);box-shadow:var(--glass-edge),var(--glass-shadow)!important;border-color:transparent}
html[data-gl="1"] .hr{border-radius:16px}
html[data-gl="1"] .hr .ph{border-radius:12px;margin:6px 0 6px 6px;min-height:52px;height:52px;align-self:center}
html[data-gl="1"] .xlook{border-radius:16px}
html[data-gl="1"] .chipbtn[aria-pressed="true"]{background:linear-gradient(180deg,#2b63bd,#1f4e9a)!important;color:#fff!important;box-shadow:inset 0 1px 0 rgb(255 255 255/.35),0 4px 12px rgb(31 78 154/.3)!important}
html[data-gl="1"] .dyc{background:linear-gradient(135deg,rgb(242 201 76/.92),rgb(242 201 76/.72))}
html[data-gl="1"] .dyrow{box-shadow:inset 0 0 0 1px rgb(255 255 255/.55),0 10px 26px rgb(166 122 6/.18);border-radius:18px}
html[data-gl="1"] .xhero{border-radius:18px}
html[data-gl="1"] .xhero .bt i{background:rgb(255 255 255/.22);color:#fff;-webkit-backdrop-filter:blur(14px) saturate(170%);backdrop-filter:blur(14px) saturate(170%);box-shadow:inset 0 0 0 1px rgb(255 255 255/.4);border-radius:999px}
html[data-gl="1"] .xbook .ph{border-radius:16px}
html[data-gl="1"] .xbook.on .ph{box-shadow:0 0 0 3px var(--b),0 8px 18px rgb(31 78 154/.25)}
html[data-gl="1"] ol.tlf li.here .c{background:linear-gradient(160deg,rgb(242 201 76/.38),rgb(255 255 255/.55));-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);box-shadow:inset 0 0 0 1px rgb(255 255 255/.75),0 8px 20px rgb(166 122 6/.15)}
html[data-gl="1"][data-theme="dark"] ol.tlf li.here .c{background:linear-gradient(160deg,rgb(242 201 76/.18),rgb(28 40 68/.55));box-shadow:inset 0 0 0 1px rgb(255 255 255/.12)}
html[data-gl="1"] .tlf-h,html[data-gl="1"] .tile{border-radius:16px}
html[data-gl="1"] .tlf-pin{background:linear-gradient(180deg,#2b63bd,#1f4e9a);box-shadow:inset 0 1px 0 rgb(255 255 255/.3),0 3px 10px rgb(31 78 154/.3)}
.tln-h b{font-size:20px}
.dyc{min-height:0}
.dyc p{flex:0 1 auto;margin-bottom:14px}
.dyc .dkf{margin-top:auto}

/* A photo already shown on this page: a soft tinted tile instead of a repeat */
.ph.dupe{background:linear-gradient(135deg,color-mix(in srgb,var(--b) 22%,var(--surface)),color-mix(in srgb,#f2c94c 30%,var(--surface)));display:grid;place-items:center;overflow:hidden}
.ph.dupe .dupe-i{font:800 12px var(--sign);text-transform:uppercase;letter-spacing:.06em;color:color-mix(in srgb,var(--ink) 55%,transparent);padding:4px;text-align:center}

/* Bottom tabs: quick, smooth highlight (no bouncy pop) */
html.street nav.tabs a[aria-current="page"] svg{animation:tabIn .2s cubic-bezier(.2,.8,.2,1)}
html.street nav.tabs a.tmid[aria-current="page"] svg{animation:none}
@keyframes tabIn{from{transform:scale(.82);opacity:.6}to{transform:none;opacity:1}}
html.street nav.tabs a{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.fstats{flex-wrap:wrap;row-gap:6px}

/* ── Nov 5 travel-app pass ── */
/* Live flight card (Flighty style): big codes, live progress line, chips for terminal, gate, seat. */
.lflight{all:unset;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;width:100%;margin:0 0 10px;padding:14px 16px 14px;border-radius:22px;cursor:pointer;color:#fff;
  background:radial-gradient(120% 90% at 0% 0%,#2f5fb3 0%,transparent 60%),linear-gradient(160deg,#16264a,#0c1630);
  box-shadow:inset 0 0 0 1px rgb(255 255 255/.14),inset 0 1px 0 rgb(255 255 255/.22),0 14px 34px rgb(12 22 48/.35);-webkit-tap-highlight-color:transparent}
.lflight:active{transform:scale(.985)}
.lf-top{display:flex;align-items:center;gap:8px;font:700 13px var(--body)}
.lf-no{display:inline-flex;align-items:center;gap:6px;font:800 14px var(--body);letter-spacing:.02em}
.lf-no .ic2{width:16px;height:16px;color:#f2c94c}
.lf-by{color:rgb(255 255 255/.62);font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lf-st{padding:5px 10px;border-radius:999px;background:rgb(255 255 255/.14);box-shadow:inset 0 0 0 1px rgb(255 255 255/.2);font:800 12.5px var(--body);white-space:nowrap}
.t-ok .lf-st{background:#2e8b57}.t-go .lf-st{background:#da251d}.t-air .lf-st{background:#f2c94c;color:#1d1a14}.t-done .lf-st{background:rgb(255 255 255/.22)}
.lf-route{display:grid;grid-template-columns:auto minmax(44px,1fr) auto;align-items:center;gap:10px}
.lf-a{display:grid;gap:1px}.lf-a.r{text-align:right}
.lf-a b{font:800 34px/1 var(--sign,var(--body));letter-spacing:.01em}
.lf-a em{font:800 16px/1.2 var(--body);font-style:normal;color:#f2c94c}.lf-a em sup{font-size:10px;margin-left:2px;color:rgb(255 255 255/.7)}
.lf-a small{font:600 12px var(--body);color:rgb(255 255 255/.62);max-width:96px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lf-track{position:relative;height:40px;--p:0}
.lf-track i{position:absolute;top:14px;height:3px;border-radius:3px;left:0}
.lf-line{right:0;background:repeating-linear-gradient(90deg,rgb(255 255 255/.35) 0 5px,transparent 5px 10px)}
.lf-done{width:calc(var(--p)*100%);background:#f2c94c;box-shadow:0 0 10px rgb(242 201 76/.6)}
.lf-track .lf-pl{top:3px;height:auto;left:calc(var(--p)*(100% - 24px));width:24px;display:grid;place-items:center;background:none}
.lf-pl .ic2{width:24px;height:24px;color:#fff;transform:rotate(45deg);filter:drop-shadow(0 2px 4px rgb(0 0 0/.4))}
.lf-track small{position:absolute;left:0;right:0;bottom:0;text-align:center;font:700 11.5px var(--body);color:rgb(255 255 255/.62)}
.lf-sub{font:600 13.5px var(--body);color:rgb(255 255 255/.85)}
.lf-chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.lfc{display:grid;gap:1px;padding:8px 9px;border-radius:12px;background:rgb(255 255 255/.1);box-shadow:inset 0 0 0 1px rgb(255 255 255/.14)}
.lfc small{font:700 11px var(--body);color:rgb(255 255 255/.6)}.lfc b{font:800 14px/1.2 var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lfc.dim b{color:rgb(255 255 255/.55);font-weight:700;font-size:12.5px}
@media (prefers-reduced-motion: no-preference){.t-air .lf-pl{transition:left 1s ease}}

/* Live chip in the header (Live Activity style) on Plan, Stays, Explore and Info during the trip. */
header.top .brand{white-space:nowrap;flex:none}
header.top .wrap{align-items:center}
header.top .hright{flex:1 1 auto;min-width:0;justify-content:flex-end;gap:6px}
header.top .srchbtn{flex:none;margin:-8px -8px -8px 0}
#subtitle.haschip{flex:0 1 auto;min-width:0;max-width:none;display:flex;justify-content:flex-end;overflow:hidden;padding:2px 0}
#subtitle.haschip .lchip{min-width:0;margin-left:10px}
.lchip{display:inline-flex;align-items:center;gap:7px;max-width:100%;min-height:32px;padding:0 12px 0 10px;border-radius:999px;text-decoration:none;color:var(--ink);font:600 13px var(--body);
  background:rgb(255 255 255/.55);-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);box-shadow:inset 0 0 0 1px rgb(255 255 255/.7),0 4px 14px rgb(20 40 80/.12)}
.lchip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lchip b{font-weight:800}
.lchip .dot{flex:none;width:8px;height:8px;border-radius:50%;background:#2e8b57;box-shadow:0 0 0 3px rgb(46 139 87/.25)}
.lchip .ic2{flex:none;width:15px;height:15px;color:var(--b)}
@media (prefers-reduced-motion: no-preference){.lchip .dot.soon{animation:lcp 2s ease-in-out infinite}@keyframes lcp{50%{box-shadow:0 0 0 6px rgb(46 139 87/0)}}}
html[data-theme="dark"] .lchip{background:rgb(20 30 55/.6);box-shadow:inset 0 0 0 1px rgb(255 255 255/.16),0 4px 14px rgb(0 0 0/.3);color:#fff}
html[data-theme="dark"] .lchip .ic2{color:#f2c94c}

/* Trip readiness ring on Today before the trip. */
.trdy{display:grid;grid-template-columns:76px 1fr;gap:14px;align-items:center;margin:4px 0 14px;padding:14px;border-radius:20px;background:rgb(255 255 255/.6);
  -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:inset 0 0 0 1px rgb(255 255 255/.75),inset 0 1px 0 rgb(255 255 255/.9),0 8px 24px rgb(20 40 80/.1)}
html[data-theme="dark"] .trdy{background:rgb(20 30 55/.55);box-shadow:inset 0 0 0 1px rgb(255 255 255/.14),0 8px 24px rgb(0 0 0/.3)}
.rd-ring{position:relative;width:76px;height:76px}
.rd-ring svg{width:76px;height:76px;transform:rotate(-90deg)}
.rd-ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.rd-bg{stroke:rgb(31 78 154/.14)}html[data-theme="dark"] .rd-bg{stroke:rgb(255 255 255/.14)}
.rd-fg{stroke:#2b63bd}html[data-theme="dark"] .rd-fg{stroke:#f2c94c}
.rd-ring b{position:absolute;inset:0;display:grid;place-items:center;font:800 22px/1 var(--body);color:var(--ink)}.rd-ring b small{font-size:12px;margin-left:1px}
.rd-ring b{display:flex;align-items:center;justify-content:center}
.rd-tx>small{display:block;font:700 12px var(--body);color:var(--muted)}
.rd-tx>b{display:block;font:800 16px/1.25 var(--body);color:var(--ink);margin:1px 0 8px}
.rd-rows{display:grid;gap:4px}
.rd-r{all:unset;box-sizing:border-box;display:grid;grid-template-columns:96px 1fr 34px;align-items:center;gap:8px;min-height:24px;cursor:pointer;font:600 12.5px var(--body);color:var(--ink)}
.rd-r i{position:relative;height:6px;border-radius:6px;background:rgb(31 78 154/.12);overflow:hidden}
html[data-theme="dark"] .rd-r i{background:rgb(255 255 255/.12)}
.rd-r i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--w);border-radius:6px;background:#da251d}
.rd-r.ok i::after{background:#2e8b57}
.rd-r em{font:800 12px var(--body);font-style:normal;text-align:right;color:var(--muted)}

/* ── Nov 5 round 2 ── */
/* Wallet stack: each pass peeks 58px; the open one shows in full. */
.wstack{display:grid;margin:0 0 14px;padding-bottom:2px}
.wcard{position:relative;border-radius:18px;color:#fff;cursor:pointer;background:linear-gradient(160deg,var(--c2),var(--c1));
  box-shadow:inset 0 0 0 1px rgb(255 255 255/.16),inset 0 1px 0 rgb(255 255 255/.25),0 -6px 18px rgb(10 20 50/.18);-webkit-tap-highlight-color:transparent}
.wcard+.wcard{margin-top:-14px}
.wcard.past{filter:saturate(.45) brightness(.9)}
.wc-h{display:flex;align-items:center;gap:10px;min-height:58px;padding:0 16px 14px;padding-top:14px;box-sizing:border-box;font:700 13px var(--body)}
.wcard:last-child .wc-h,.wcard.open .wc-h{padding-bottom:0;min-height:52px}
.wc-no{display:inline-flex;align-items:center;gap:6px;font:800 15px var(--body)}.wc-no .ic2{width:16px;height:16px;color:#f2c94c}
.wc-r{flex:1;font:800 15px var(--body);letter-spacing:.02em;opacity:.95}
.wc-d{font:600 12.5px var(--body);color:rgb(255 255 255/.75)}
.wc-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s cubic-bezier(.3,1.1,.4,1)}
.wcard.open .wc-b{grid-template-rows:1fr}
.wc-in{overflow:hidden;min-height:0}
.wcard.open{z-index:1}
.wcard.open+.wcard{margin-top:-6px}
.wc-route{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:10px 16px 6px}
.wc-route span{display:grid;gap:1px}.wc-route .r{text-align:right}
.wc-route b{font:800 40px/1 var(--sign,var(--body))}.wc-route em{font:800 16px var(--body);font-style:normal;color:#f2c94c}.wc-route small{font:600 12px var(--body);color:rgb(255 255 255/.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

}

  const urls=[];

// Weather: live from Open-Meteo when online, last forecast kept on the phone for offline use.
// One outline icon set (24px grid, 2px stroke) instead of emoji, so icons match the nav and follow the theme.

  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',

  snow:'<path d="M7 15h10a4 4 0 0 0 0-8 5.5 5.5 0 0 0-10.5 2A3 3 0 0 0 7 15zM8 19h.01M12 19h.01M16 19h.01M10 22h.01M14 22h.01"/>',

  cal:'<rect x="3" y="5" width="18" height="16"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  camera:'<path d="M3 8h4l2-3h6l2 3h4v12H3z"/><circle cx="12" cy="13.5" r="3.5"/>',

  plane:'<path d="M3 12h16M13 6l6 6-6 6"/>'
};
const ico = (n, cls) => `<svg class="i${cls?" "+cls:""}" viewBox="0 0 24 24" aria-hidden="true" focusable="false">${ICP[n]||""}</svg>`;
const WMO = c => c===0?[ico("sun"),"Clear"]:c<=2?[ico("part"),"Partly cloudy"]:c===3?[ico("cloud"),"Cloudy"]:c<=48?[ico("fog"),"Fog"]:c<=57?[ico("rain"),"Drizzle"]:c<=67?[ico("rain"),"Rain"]:c<=77?[ico("snow"),"Snow"]:c<=82?[ico("rain"),"Showers"]:[ico("storm"),"Storms"];
async function forecast(key){
  const P = T.info.places[key]; if(!P) return null;
  let cached=null; try{ cached=JSON.parse(store.get("wx-"+key)||"null"); }catch(e){}
  if (cached && Date.now()-cached.t < 3*3600e3) return cached;
  try {
    const u=`https://api.open-meteo.com/v1/forecast?latitude=${P.lat}&longitude=${P.lon}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&temperature_unit=fahrenheit&timezone=auto&forecast_days=16`;
    const r=await fetch(u); if(!r.ok) throw 0; const j=await r.json();
    const out={t:Date.now(), days:Object.fromEntries(j.daily.time.map((d,i)=>[d,{c:j.daily.weather_code[i],hi:Math.round(j.daily.temperature_2m_max[i]),lo:Math.round(j.daily.temperature_2m_min[i]),p:j.daily.precipitation_probability_max[i]}]))};
    store.set("wx-"+key, JSON.stringify(out)); return out;
  } catch(e){ return cached; }
}
// Local news: a short digest refreshed each morning; the app checks for a newer one when online.
const LEVEL = {alert:["Alert","todo"], watch:["Watch","maybe"], info:["Good to know","booked"]};
function newsCard(){ return `<h3>Local news</h3><div class="card" id="news" style="padding:4px 16px">${newsRows(T.news)}</div>`; }
function newsRows(n){
  if (!n || !n.items?.length) return `<p class="small muted">Nothing that affects the trip right now.</p>`;
  const order={alert:0,watch:1,info:2};
  return n.items.slice().sort((a,b)=>order[a.level]-order[b.level]).map(it=>`<div class="row"><div class="when">${esc(it.area)} · ${fmt(it.date)}</div><div class="what">${esc(it.title)}</div><span class="chip ${LEVEL[it.level]?.[1]||"booked"}">${LEVEL[it.level]?.[0]||""}</span><div class="detail">${esc(it.impact)} <a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.source)} ↗</a></div></div>`).join("")
    + `<p class="small muted">Digest updated ${fmt(n.updated)}. Only news that could affect the trip.</p>`;
}
async function fillNews(){
  const box=$("#news"); if(!box || !/^https?:$/.test(location.protocol)) return;
  try{ const r=await fetch("news.json",{cache:"no-store"}); if(!r.ok) return; const n=await r.json(); if(n.updated>=(T.news?.updated||"")){ T.news=n; box.innerHTML=newsRows(n); } }catch(e){}
}
function wxCard(){ return `<h3>Weather</h3><div class="card" id="wx"><div class="small muted">Loading the forecast…</div></div>`; }
async function fillWx(){
  const box=$("#wx"); if(!box) return;
  const iso=todayIso(), first=T.days[0].date;
  const focus = T.days.find(d=>d.date===iso) || (iso<first ? T.days[0] : null);
  if (!focus) { box.closest(".card").previousElementSibling?.remove(); box.remove(); return; }
  const key = focus.city || "hcmc", P=T.info.places[key];
  const upcoming = T.days.filter(d=>d.date>=focus.date).slice(0,7);
  const keys=[...new Set(upcoming.map(d=>d.city).filter(Boolean))];
  const fc=Object.fromEntries(await Promise.all(keys.map(async k=>[k, await forecast(k)])));
  const f = fc[key]?.days?.[focus.date];
  const when = focus.date===iso ? "Today" : `${DOW[parse(focus.date).getDay()]} ${fmt(focus.date)}`;
  let main;
  if (f){ const [ic,lab]=WMO(f.c); main=`<div class="ico">${ic}</div><div><div class="temp">${f.hi}° <span class="lo">${f.lo}°</span></div><div class="small muted">${when} in ${esc(P.name)} · ${lab}${f.p!=null?`, ${f.p}% rain`:""}</div></div>`; }
  else { const [hi,lo,txt]=P.normal; main=`<div class="ico">${ico("cal")}</div><div><div class="temp">${hi}° <span class="lo">${lo}°</span></div><div class="small muted">Typical December in ${esc(P.name)} · ${esc(txt)}</div></div>`; }
  const strip = upcoming.map(d=>{ const x=fc[d.city]?.days?.[d.date]; const pl=T.info.places[d.city];
    if(!x) return ""; return `<div class="wxday"><span class="muted">${DOW[parse(d.date).getDay()]}</span><span class="wxi">${WMO(x.c)[0]}</span><b>${x.hi}°</b><span class="muted">${esc(pl.name)}</span></div>`; }).join("");
  const stamp = Object.values(fc).find(Boolean); const age = stamp ? new Date(stamp.t) : null;
  box.innerHTML = `<div class="wx">${main}</div>${strip?`<div class="wxrow">${strip}</div>`:""}<div class="small muted" style="margin-top:10px">${f||strip?`Forecast from Open-Meteo${age?`, updated ${age.toLocaleString([], {weekday:"short",hour:"numeric",minute:"2-digit"})}`:""}.`:"Live forecasts start about two weeks before you land."}</div>`;
  // Street look: weather in the facts strip, and on a rainy day the indoor backups move to the top.
  let rp = f?.p; try { const q = +new URLSearchParams(location.search).get("rain"); if (q) rp = q; } catch(e){}
  const fw = $("#f3wx"); if (fw && f && focus.date===iso){ fw.textContent = `${f.hi}°${rp>=40?" rain":""}`; $("#f3wx2").textContent = rp!=null ? `${rp}% chance of rain` : WMO(f.c)[1]; }
  const rt = $("#raintop"), rh = focus.date===iso ? rainHtml(key, rp) : "";
  if (rt && rh){ rt.innerHTML = `<h3>Rainy day plan</h3><div class="rainbar">${rh}</div>`; if (fw && !f){ fw.textContent = "Rain"; $("#f3wx2").textContent = `${rp}% chance`; } }
  else box.insertAdjacentHTML("beforeend", rainHtml(key, f?.p));
}

// ===== Trip helpers: travel days, maps, sunset, evening look, phrases, reminders =====
const MOg = () => (typeof T!=="undefined" && T && T.more) || {};
const TZ = c => c==="srq" ? -5 : (c==="blr"||c==="kmc"||c==="hyd") ? 5.5 : 7;
const VN = c => ["hcmc","hoian","danang","hanoi","ninhbinh"].includes(c);
const CITYNAME = {"Saigon":"hcmc","Hoi An":"hoian","Da Nang":"danang","Hanoi":"hanoi","Ninh Binh":"ninhbinh"};
const hm = h => { h=((h%24)+24)%24; let H=Math.floor(h), M=Math.round((h-H)*60); if(M===60){H++;M=0;} const ap=H>=12?"PM":"AM"; return `${(H%12)||12}:${String(M).padStart(2,"0")} ${ap}`; };
// Sunset in local hours (NOAA approximation).
function sunset(lat, lon, iso, tz){
  const d = parse(iso), n = Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()) - Date.UTC(d.getFullYear(),0,0))/864e5);
  const g = 2*Math.PI/365*(n-1);
  const eq = 229.18*(0.000075+0.001868*Math.cos(g)-0.032077*Math.sin(g)-0.014615*Math.cos(2*g)-0.040849*Math.sin(2*g));
  const dec = 0.006918-0.399912*Math.cos(g)+0.070257*Math.sin(g)-0.006758*Math.cos(2*g)+0.000907*Math.sin(2*g)-0.002697*Math.cos(3*g)+0.00148*Math.sin(3*g);
  const r = Math.PI/180, ha = Math.acos(Math.cos(90.833*r)/(Math.cos(lat*r)*Math.cos(dec))-Math.tan(lat*r)*Math.tan(dec))/r;
  return (720 - 4*(lon - ha) - eq)/60 + tz;
}
function sunFor(city, iso){ const P=T.info.places[city]; if(!P) return null; return sunset(P.lat, P.lon, iso, TZ(city)); }

// Evening look: Auto switches to the dark Postcard after sunset where you are.
function lookMode(){ return store.get("look-mode") || "auto"; }
function applyLook(){
  const m = lookMode(); let dark;
  if (m==="dark") dark=true; else if (m==="light") dark=false;
  else { const iso=todayIso(), d=T.days.find(x=>x.date===iso), city=d?.city||"hcmc", now=new Date(), h=now.getHours()+now.getMinutes()/60;
    const ss = (d && VN(city)) ? sunFor(city, iso) : 18; dark = h >= ss + .25 || h < 6; }
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  const mc=document.querySelector('meta[name="theme-color"]'); const cl=document.documentElement.classList; if(mc) mc.content = cl.contains("street") ? (dark?"#0d1830":"#f2c94c") : dark ? (cl.contains("press")?"#121212":"#141414") : (cl.contains("press")?"#fff5d6":"#fff8e7");
}
setInterval(()=>{ if(document.visibilityState==="visible") applyLook(); }, 60000);
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") applyLook(); });
document.addEventListener("click", e=>{ const b=e.target.closest("[data-look-mode]"); if(!b) return; store.set("look-mode", b.dataset.lookMode); applyLook();
  document.querySelectorAll("[data-look-mode]").forEach(x=>x.setAttribute("aria-pressed", x.dataset.lookMode===lookMode())); });

// Flights as boarding-pass cards on travel days.
const myLegs = () => (MOg().legs||[]).filter(l=>!l.pb || PB()).concat(PB() ? [] : personalLegs()).sort((a,b)=>Date.parse(a.dep)-Date.parse(b.dep));
const localDate = s => s ? s.slice(0,10) : "";
const localTime = s => { if(!s) return ""; const [H,M]=s.slice(11,16).split(":").map(Number); return hm(H+M/60); };
function legsOn(iso){ return myLegs().filter(l=>localDate(l.dep)===iso || localDate(l.arr)===iso); }
function untilTxt(ms){ if(ms<=0) return "Departed"; const m=Math.round(ms/6e4), h=Math.floor(m/60); return h>=24 ? `in ${Math.round(h/24)} days` : h ? `in ${h} h ${m%60} min` : `in ${m} min`; }
function passCard(l){
  const ms = Date.parse(l.dep) - Date.now();
  return `<div class="pass"><div class="pass-top"><span class="pass-no">${esc(l.no)}</span><span class="pass-by">${esc(l.by)}</span></div>
    <div class="pass-route"><div><b>${esc(l.from)}</b><span>${esc(l.fromName)}</span><em>${esc(localTime(l.dep))}</em><small>${esc(fmt(localDate(l.dep)))}</small></div><div class="pass-plane">${ico("plane")}</div>
    <div style="text-align:right"><b>${esc(l.to)}</b><span>${esc(l.toName)}</span><em>${l.arr?esc(localTime(l.arr)):"—"}</em><small>${l.arr?esc(fmt(localDate(l.arr))):""}</small></div></div>
    <div class="pass-foot">${localDate(l.dep)!==todayIso() && localDate(l.arr)===todayIso() ? `<span>Lands ${esc(localTime(l.arr))}</span>` : `<span data-dep="${esc(l.dep)}">${ms>0?"Departs "+untilTxt(ms):"Departed"}</span>`}${l.seats?`<span>Seats ${esc(l.seats)}</span>`:""}</div>
    ${(l.tips||[]).length?`<ul class="pass-tips">${l.tips.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`:""}</div>`;
}
setInterval(()=>{ document.querySelectorAll("[data-dep]").forEach(el=>{ const ms=Date.parse(el.dataset.dep)-Date.now(); el.textContent = ms>0 ? "Departs "+untilTxt(ms) : "Departed"; }); }, 30000);
function travelDayHtml(iso){
  const ls = legsOn(iso); let h = "";
  if (ls.length) h += typeof passStack === "function" ? passStack(ls, "Travel day") + `<ul class="pass-tips wtips">${ls.flatMap(l => (l.tips || []).map(t => `<li><b>${esc(l.no)}</b> ${esc(t)}</li>`)).join("")}</ul>` : "";
  const L = MOg().layover; if (L && L.when===iso && PB()) h += `<h3>${esc(L.title)}</h3><div class="card"><ol class="steps" style="margin:0">${L.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol></div>`;
  return h;
}

// Jet lag and phone setup cards before and early in the trip.
function jetlagHtml(iso, all){

  if (all) return `<div class="card"><ol class="jl">${J.map(j=>`<li${j.date===iso?' class="on"':""}><b>${esc(DOW[parse(j.date).getDay()]+" "+fmt(j.date))}</b><span>${esc(j.what)}</span></li>`).join("")}</ol><p class="small muted" style="margin:8px 0 0">Florida to Vietnam is +12 hours. Some people take melatonin, so ask your doctor if you're curious.</p></div>`;
  const j = J.find(x=>x.date===iso); if (!j) return "";
  return `<h3>Jet lag plan</h3><a class="card jlcard" href="#info" data-goto="jetlag"><b>Today</b><span>${esc(j.what)}</span><span class="small muted">See the whole plan ›</span></a>`;
}
function setupDone(){ return local.get("setup",{}); }
function setupHtml(){
  const done = setupDone();
  return `<ul class="check">${(MOg().setup||[]).map(([t,why])=>`<li><label><input type="checkbox" data-setup="${esc(t)}"${done[t]?" checked":""}><span>${esc(t)}<span class="why">${esc(why)}</span></span></label></li>`).join("")}</ul>`;
}
document.addEventListener("change", e=>{ const c=e.target.closest("[data-setup]"); if(!c) return; const v=setupDone(); if(c.checked) v[c.dataset.setup]=1; else delete v[c.dataset.setup]; local.set("setup", v);
  const n=document.getElementById("setup-n"); if(n) n.textContent = Object.keys(v).length; });
document.addEventListener("click", e=>{ const g=e.target.closest("[data-goto]"); if(!g) return; e.preventDefault(); const id=g.dataset.goto;
  if (current!=="info") location.hash="info"; setTimeout(()=>{ const el=document.getElementById(id); if(el) el.scrollIntoView({block:"start"}), scrollBy(0,-70); }, 80); });

// What's on, sunset, heads-up and regroup cards for a day.
function dayExtrasHtml(d){
  let h = "";
  const W = (MOg().whatson||{})[d.date];
  const ss = VN(d.city) ? sunFor(d.city, d.date) : null, gs = (MOg().golden||{})[d.city];
  if (W || ss) h += `<h3>What's on</h3><div class="card">${W?`<ul class="dots">${W.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}${ss?`<div class="sunrow"><span class="sunico">${ico("sun")}</span><div><b>Sunset ${hm(ss)}</b><span class="small muted">Golden hour from about ${hm(ss-0.5)}${gs?` · Best spot: ${esc(gs)}`:""}</span></div></div>`:""}</div>`;
  const H = (MOg().headsup||{})[d.city];
  if (H) h += `<h3>Heads-up in ${esc(T.info.places[d.city].name)}</h3><details class="card hu"><summary>${esc(H[0])}</summary><ul class="dots">${H.slice(1).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></details>`;
  const R = (MOg().regroup||{})[d.city], st = d.stay ? stayById(d.stay) : null;
  if (R) h += `<h3>If we split up</h3><div class="card regroup"><div class="small muted">Meet at</div><b>${esc(R.spot)}</b><div class="viw"><span lang="vi">${esc(R.vi)}</span>${sayBtn(R.vi,1)}</div>${st?`<div class="small muted" style="margin-top:8px">Or back at <a href="#stay-${st.id}">${esc(st.name)}</a>. Share your live location in the group chat.</div>`:""}</div>`;
  return h;
}

// Evening: what's first tomorrow, an alarm time, and what to bring.
function parseItemTime(t){ const m=String(t).match(/(\d{1,2})(?::(\d{2}))?\s*(AM|PM)/i); if(!m) return null; let H=+m[1]%12; if(/pm/i.test(m[3])) H+=12; return H+(+(m[2]||0))/60; }
function tomorrowHtml(iso){
  const i = T.days.findIndex(d=>d.date===iso), nd = T.days[i+1]; if(!nd) return "";
  const h = nowH(), test = new URLSearchParams(location.search).get("eve");
  if (h < 17 && !test) return "";
  const first = nd.items.find(x=>parseItemTime(x[0])!=null), leg = legsOn(nd.date).find(l=>localDate(l.dep)===nd.date);
  let alarm = null, why = "";
  const early = nd.items.map(x=>[parseItemTime(x[0]),x]).filter(([t])=>t!=null && t>=4).sort((a,b)=>a[0]-b[0])[0];
  if (early){ alarm = early[0] - 1; why = `${early[1][0]}: ${early[1][1]}`; }
  if (leg){ const [H,M]=leg.dep.slice(11,16).split(":").map(Number), la = H+M/60 - (/SRQ|DAD/.test(leg.from)?2.5:3.5); if (alarm==null || la < alarm){ alarm = la; why = `${leg.no} departs ${localTime(leg.dep)}`; } }
  const bring = checklistFor(nd);
  return `<h3>Tonight: get ready for ${esc(DOW[parse(nd.date).getDay()])}</h3><div class="card tmr"><div class="tmr-h"><span class="tmr-ico">${ico("alarm")}</span><div>${alarm!=null?`<b>Set an alarm for ${hm(Math.max(alarm,4))}</b>`:`<b>No early start</b>`}<span class="small muted">${esc(why||nd.title)}</span></div></div>
    ${bring.length?`<div class="sub-h">Lay out tonight</div><ul class="dots">${bring.map(([t,w])=>`<li><b>${esc(t)}</b> <span class="muted">${esc(w)}</span></li>`).join("")}</ul>`:""}</div>`;
}

// Rain plan: when the forecast says rain, suggest indoor backups.
function rainHtml(city, pct){
  const R = (MOg().rain||{})[city]; if (!R || pct==null || pct < 60) return "";
  return `<div class="rainplan"><b>${ico("umbrella")} ${pct}% chance of rain. Indoor backups:</b><ul class="dots">${R.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`;
}

// Opening notes and the hop between stops, inside the day plan.
const COORD = name => (MOg().coords||{})[name];
function hav(a,b){ const r=Math.PI/180, dl=(b[0]-a[0])*r, dn=(b[1]-a[1])*r, x=Math.sin(dl/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dn/2)**2; return 12742*Math.asin(Math.sqrt(x)); }
function hopHtml(a, b){
  const A=COORD(a.name), B=COORD(b.name); if(!A||!B||a===b) return "";
  const km = hav(A,B)*1.3; if (km < 0.15 || km > 40) return "";
  const walk = Math.round(km/4.5*60), grab = Math.round(4 + km/20*60), fare = Math.max(30, Math.round((12 + km*14)/5)*5);
  return `<div class="hop">↳ From ${esc(a.name)}: ${km<1?Math.round(km*1000)+" m":km.toFixed(1)+" km"} · ${walk<=25?`${walk} min walk`:`Grab ~${grab} min, ~${fare}k ₫`}${walk<=25&&walk>12?` (Grab ~${grab} min)`:""}</div>`;
}
function hoursHtml(ps, iso){
  const wd = parse(iso).getDay(), out=[];
  for (const p of ps){ const H=(MOg().hours||{})[p.name]; if(!H) continue;
    if (H.closed && H.closed.includes(wd)) out.push(`<span class="hrs bad">${esc(p.name)} is closed on ${DOW[wd]}s</span>`);
    else if (H.open && !H.open.includes(wd)) out.push(`<span class="hrs bad">${esc(p.name)}: not open on ${DOW[wd]}s</span>`);
    else if (H.show && !H.show.includes(wd)) out.push(`<span class="hrs">${esc(H.note)} Not tonight.</span>`);
    else out.push(`<span class="hrs">${esc(H.note)}</span>`); }
  return out.length ? `<div class="hrsrow">${out.join("")}</div>` : "";
}

// Say: menu decoder, phrase packs, haggle helper.
function haggleHtml(){
  return `<div class="card haggle"><label class="small muted" for="hg-q">They're asking (dong)</label>
    <div class="hg-in"><input id="hg-q" inputmode="numeric" placeholder="e.g. 300000" autocomplete="off"><span class="hg-k">₫</span></div>
    <div class="hg-quick">${[50,100,200,300,500,1000].map(k=>`<button type="button" data-hgq="${k*1000}">${k>=1000?k/1000+"M":k+"k"}</button>`).join("")}</div>
    <div id="hg-out" class="hg-out"><p class="small muted" style="margin:0">Type the price you're quoted to see dollars and a fair counter-offer.</p></div></div>`;
}
function haggleCalc(v){
  const out=document.getElementById("hg-out"); if(!out) return; const n=Math.round(+String(v).replace(/[^\d]/g,"")); if(!n){ out.innerHTML=""; return; }

  const say1 = "Bớt được không?", say2 = `Tôi trả ${Math.round(offer/1000)} nghìn`;
  out.innerHTML = `<div class="hg-usd">${n.toLocaleString()} ₫ ≈ <b>$${usd<10?usd.toFixed(2):Math.round(usd)}</b></div>
    <div class="hg-row"><span>Open with</span><b>${offer.toLocaleString()} ₫</b><span class="muted">≈ $${(offer/T.info.rates.VND).toFixed(offer/T.info.rates.VND<10?2:0)}</span></div>

// Calendar reminders (.ics): flights and key moments, with alerts.
function icsDate(s){ return new Date(Date.parse(s)).toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,""); }
function icsText(){
  const ev=[], esc2=s=>String(s).replace(/[,;\\]/g,m=>"\\"+m).replace(/\n/g,"\\n");
  for (const l of myLegs()){ if(!l.dep) continue; const end=l.arr||new Date(Date.parse(l.dep)+2*36e5).toISOString();
    ev.push({uid:"leg-"+l.no.replace(/\W/g,"")+"-"+l.dep.slice(0,10), t:`✈ ${l.no} ${l.from} → ${l.to}`, s:l.dep, e:end, d:[l.by, l.seats?"Seats "+l.seats:"", ...(l.tips||[])].filter(Boolean).join("\n"), a:[24*60, /SRQ|DAD/.test(l.from)?120:180]}); }
  for (const r of (MOg().reminders||[])){ if(r.pb && !PB()) continue; ev.push({uid:"r-"+r.at, t:r.t, s:r.at, e:new Date(Date.parse(r.at)+(r.mins||30)*6e4).toISOString(), d:"From the Vietnam '26 app", a:r.alarms||[0]}); }
  // Morning nudge: 8 AM local on each Vietnam day, with the day's "before you head out" list.
  for (const d of T.days){ if (!VN(d.city) || typeof checklistFor !== "function") continue;
    const items = checklistFor(d).map(x => x[0]).filter(Boolean); if (!items.length) continue;
    const s0 = new Date(Date.parse(d.date + "T08:00:00+07:00")).toISOString();
    ev.push({uid:"am-"+d.date, t:`☀ ${CITYV[d.city]||d.place}: ${d.title}`, s:s0, e:new Date(Date.parse(s0)+15*6e4).toISOString(), d:"Before you head out:\n• " + items.slice(0,8).join("\n• ") + "\n\nOpen Today in the Vietnam '26 app for the full plan.", a:[0]}); }
  const lines=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Vietnam26//Trip//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:Vietnam '26"];
  const stamp=icsDate(new Date().toISOString());
  for (const x of ev){ lines.push("BEGIN:VEVENT",`UID:${x.uid}@vietnam26`,`DTSTAMP:${stamp}`,`DTSTART:${icsDate(x.s)}`,`DTEND:${icsDate(x.e)}`,`SUMMARY:${esc2(x.t)}`,`DESCRIPTION:${esc2(x.d)}`);
    for (const m of x.a) lines.push("BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${esc2(x.t)}`,`TRIGGER:-PT${m}M`,"END:VALARM");
    lines.push("END:VEVENT"); }
  lines.push("END:VCALENDAR"); return { text: lines.join("\r\n"), n: ev.length };
}
document.addEventListener("click", async e=>{ const b=e.target.closest("[data-ics]"); if(!b) return; e.preventDefault();
  const {text} = icsText(), file = new File([text], "vietnam26-reminders.ics", {type:"text/calendar"});
  try { if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file], title:"Vietnam '26 reminders"}); return; } } catch(err){ if (err && err.name==="AbortError") return; }
  const url = URL.createObjectURL(file); location.href = url; setTimeout(()=>URL.revokeObjectURL(url), 60000);
});

// Offline city maps: CARTO tiles, cached by the service worker.
const TILE = (z,x,y) => `https://tile.openstreetmap.org/${z}/${x}/${y}.png`;
const lon2x = (lon,z) => (lon+180)/360*256*2**z;
const lat2y = (lat,z) => { const s=Math.sin(lat*Math.PI/180); return (0.5-Math.log((1+s)/(1-s))/(4*Math.PI))*256*2**z; };
const x2lon = (x,z) => x/(256*2**z)*360-180;
const y2lat = (y,z) => { const n=Math.PI-2*Math.PI*y/(256*2**z); return 180/Math.PI*Math.atan(0.5*(Math.exp(n)-Math.exp(-n))); };
let MAP = { city: store.get("map-city") || "Saigon" };
function mapPins(city){ return T.places.filter(p=>p.city===city && COORD(p.name)); }
function mapView(){
  const cities = Object.keys(MOg().maps||{}); if(!cities.includes(MAP.city)) MAP.city = cities[0];
  const pins = mapPins(MAP.city);
  return `${seg("map")}<div class="chips mapchips">${cities.map(c=>`<button type="button" class="chipbtn" data-mapcity="${esc(c)}" aria-pressed="${c===MAP.city}">${esc(c)}</button>`).join("")}</div>
    <div class="map" id="map"><div class="map-layer" id="map-layer"></div><div class="map-ctl"><button type="button" data-mapz="1" aria-label="Zoom in">+</button><button type="button" data-mapz="-1" aria-label="Zoom out">−</button><button type="button" data-mapz="0" aria-label="Recenter">◎</button></div><div class="map-attr">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors</div></div>
    <p class="small muted" id="mapmsg" style="margin:8px 0 0">Maps you look at are kept on this phone. Before the trip, open each city on Wi-Fi and zoom around the areas you'll visit, and they'll show with no signal.</p>
    <h3>${esc(MAP.city)}</h3><div class="card" style="padding:4px 16px">${pins.map((p,i)=>`<div class="row prow" data-place="${p.id}" role="button" tabindex="0" aria-label="${esc(p.name)}, details" style="cursor:pointer"><div class="pthumb ph pinnum">${i+1}</div><div class="what">${esc(p.name)}</div><span class="pin" style="align-self:center" aria-hidden="true">Details ›</span><div class="detail">${esc(p.vi)}</div></div>`).join("")}</div>`;
}
function drawMap(){
  const el=document.getElementById("map"), layer=document.getElementById("map-layer"); if(!el) return;
  const cfg = MOg().maps[MAP.city]; if (MAP.z==null || MAP.for!==MAP.city){ MAP.c=cfg.c.slice(); MAP.z=cfg.z; MAP.for=MAP.city; }
  const W=el.clientWidth, H=el.clientHeight, z=MAP.z, cx=lon2x(MAP.c[1],z), cy=lat2y(MAP.c[0],z), x0=cx-W/2, y0=cy-H/2;
  let h=""; const n=2**z;
  for (let tx=Math.floor(x0/256); tx<=Math.floor((x0+W)/256); tx++) for (let ty=Math.floor(y0/256); ty<=Math.floor((y0+H)/256); ty++){
    if (ty<0||ty>=n) continue; const wx=((tx%n)+n)%n;
    h += `<img class="mtile" alt="" draggable="false" src="${TILE(z,wx,ty)}" style="left:${Math.round(tx*256-x0)}px;top:${Math.round(ty*256-y0)}px">`; }
  mapPins(MAP.city).forEach((p,i)=>{ const [la,lo]=COORD(p.name); const px=lon2x(lo,z)-x0, py=lat2y(la,z)-y0; if(px<-20||py<-20||px>W+20||py>H+40) return;
    h += `<button type="button" class="mpin" data-place="${p.id}" style="left:${Math.round(px)}px;top:${Math.round(py)}px" aria-label="${esc(p.name)}"><span><i>${i+1}</i></span></button>`; });
  layer.style.transform=""; layer.innerHTML=h; const nt=el.querySelector(".mnote"); if (nt) nt.hidden=true;
}
// A tile that isn't saved and can't load: say so instead of showing a grey hole.
document.addEventListener("error", e=>{ const t=e.target; if (t && t.classList && t.classList.contains("mtile")){ t.style.visibility="hidden"; mapHole(); } }, true);
function mapHole(){ const el=document.getElementById("map"); if(!el) return; let nt=el.querySelector(".mnote"); if(!nt){ el.insertAdjacentHTML("beforeend", `<div class="mnote" role="status"></div>`); nt=el.querySelector(".mnote"); }
  nt.textContent = navigator.onLine===false ? "This area isn't saved for offline. Open it once on Wi-Fi to keep it." : "Some of the map didn't load. Check your connection."; nt.hidden=false; }
function wireMap(){
  const el=document.getElementById("map"); if(!el) return; drawMap();
  let st=null, moved=false, lastTap=0;
  const layer=document.getElementById("map-layer");
  el.addEventListener("touchstart",e=>{ if(e.target.closest(".map-ctl")) return; moved=false; const t=e.touches;
    st = t.length===2 ? {d:Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY), dx:0, dy:0, k:1} : {x:t[0].clientX, y:t[0].clientY, dx:0, dy:0, k:1}; },{passive:true});
  el.addEventListener("touchmove",e=>{ if(!st) return; e.preventDefault(); moved=true; const t=e.touches;
    if (t.length===2 && st.d){ st.k=Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)/st.d; layer.style.transform=`scale(${st.k})`; layer.style.transformOrigin="50% 50%"; }
    else if (t.length===1 && st.x!=null){ st.dx=t[0].clientX-st.x; st.dy=t[0].clientY-st.y; layer.style.transform=`translate(${st.dx}px,${st.dy}px)`; } },{passive:false});
  const end=()=>{ if(!st) return; const z=MAP.z;
    if (st.k!==1){ MAP.z=Math.max(11,Math.min(18,z+Math.round(Math.log2(st.k)))); }
    else if (st.dx||st.dy){ const cx=lon2x(MAP.c[1],z)-st.dx, cy=lat2y(MAP.c[0],z)-st.dy; MAP.c=[y2lat(cy,z), x2lon(cx,z)]; }
    st=null; drawMap(); };
  el.addEventListener("touchcancel",()=>{ st=null; layer.style.transform=""; },{passive:true});
  el.addEventListener("touchend",e=>{ if(e.touches.length) return; const n=Date.now(); if(!moved && !e.target.closest(".mpin,.map-ctl")){ if(n-lastTap<300){ MAP.z=Math.min(18,MAP.z+1); st=null; drawMap(); lastTap=0; return; } lastTap=n; } end(); });
  // Mouse drag for desktop testing.
  el.addEventListener("mousedown",e=>{ if(e.target.closest(".map-ctl,.mpin")) return; st={x:e.clientX,y:e.clientY,dx:0,dy:0,k:1};
    const mv=ev=>{ st.dx=ev.clientX-st.x; st.dy=ev.clientY-st.y; layer.style.transform=`translate(${st.dx}px,${st.dy}px)`; };
    const up=()=>{ removeEventListener("mousemove",mv); removeEventListener("mouseup",up); end(); }; addEventListener("mousemove",mv); addEventListener("mouseup",up); });
}
document.addEventListener("click", e=>{
  const c=e.target.closest("[data-mapcity]"); if(c){ MAP.city=c.dataset.mapcity; store.set("map-city",MAP.city); MAP.z=null; render("plan",null,"map"); return; }
  const z=e.target.closest("[data-mapz]"); if(z){ const v=+z.dataset.mapz; if(v) MAP.z=Math.max(11,Math.min(18,MAP.z+v)); else MAP.z=null; drawMap(); return; }
  const s=e.target.closest("[data-mapsave]"); if(s){ const urls=[]; for (const [c,m] of Object.entries(MOg().maps||{})) for (let z=m.z-1; z<=m.z+1; z++){
      const [la0,lo0,la1,lo1]=m.box; const xa=Math.floor(lon2x(lo0,z)/256), xb=Math.floor(lon2x(lo1,z)/256), ya=Math.floor(lat2y(la1,z)/256), yb=Math.floor(lat2y(la0,z)/256);
      for (let x=xa;x<=xb;x++) for (let y=ya;y<=yb;y++) urls.push(TILE(z,x,y)); }
    const msg=document.getElementById("mapmsg");
    if (!navigator.serviceWorker?.controller){ if(msg) msg.textContent="Open the app from the home screen first, then try again."; return; }
    navigator.serviceWorker.controller.postMessage({type:"save-tiles", urls}); store.set("maps-saved", Date.now());
    if(msg) msg.textContent=`Saving ${urls.length} map pieces in the background. Keep the app open on Wi-Fi for a minute.`; s.textContent="Saving…"; }
});
