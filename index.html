.plate{display:inline-block;justify-self:start;background:var(--city,var(--b));border-radius:10px;padding:5px;box-shadow:0 2px 0 #0003;color:#fff}
.plate .in{border:2px solid #fff;border-radius:7px;padding:4px 14px 11px;display:grid}
.plate .sm{font:600 12.5px var(--body);opacity:.92}
.plate .nm{font:800 52px/.9 var(--sign);text-transform:uppercase;letter-spacing:.01em}
.sign{display:inline-block;background:var(--city,var(--b));border-radius:7px;padding:3px;position:relative;z-index:1}
.sign>span{display:block;border:1.5px solid #fff;border-radius:5px;color:#fff;font:800 21px/1 var(--sign);text-transform:uppercase;padding:5px 10px 4px;letter-spacing:.02em}

/* Today hero: full-bleed photo slideshow */
.shero{position:relative;height:min(320px,44vh);min-height:270px;margin:-16px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;color:#fff;background:#2a2a2a;overflow:hidden}
.shero .slides,.shero .sl{position:absolute;inset:0}
.shero .sl{opacity:0;transition:opacity 1.2s ease;border-radius:0}
.shero .sl.on{opacity:1}
.shero .sl img{transform:scale(1.04);transition:transform 7s linear}
.shero .sl.on img{transform:scale(1.1)}
.shero::after{content:"";position:absolute;inset:0;background:linear-gradient(#0006,#0000 28%,#0000 42%,#000c);pointer-events:none}
.shero>.tx,.shero>.capchip{position:absolute;z-index:1}
.shero .capchip{right:12px;top:12px;font:600 12px var(--body);background:#000a;padding:4px 9px;border-radius:20px;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shero .tx{left:16px;right:16px;bottom:14px;display:grid}
.shero .d{font:600 14px var(--body);margin:0 0 6px 2px;text-shadow:0 1px 3px #0008}
.shero .t{font:700 19px/1.25 var(--body);margin:8px 0 0 2px;text-shadow:0 1px 3px #0008;text-wrap:balance}
.shero .sdots{display:flex;gap:6px;margin:10px 0 0 2px}.shero .sdots i{width:6px;height:6px;border-radius:3px;background:#fff8;transition:width .3s}.shero .sdots i.on{width:18px;background:#fff}
@media (prefers-reduced-motion: reduce){.shero .sl,.shero .sl img{transition:none;transform:none}}

/* Today: the yellow wall with now and next */
.swall{background:var(--wall);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:14px max(16px,env(safe-area-inset-left,0px)) 12px;display:grid}
html.street main .wrap>.swall{margin-top:-16px}
.nowc{background:var(--b);color:#fff;border-radius:10px;padding:14px 14px 14px 16px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;margin-bottom:6px}
.nowc .k{font:600 13px var(--body);color:#d6e2f6;display:block;margin-bottom:2px}
.nowc b{font:700 18px/1.25 var(--body);display:block}
.nowc .num{background:#fff}
.nx{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:10px 0;border-top:2px solid #0000001a;align-items:center;color:#1d1a14}
.nx b{font:600 16px/1.3 var(--body);display:block}.nx small{font-size:13px;color:#4c4330}
.lan{display:inline-flex;align-items:center;gap:5px;font:700 12.5px var(--body);color:#a3201d;margin-right:4px}
.lan::before{content:"";width:9px;height:11px;border-radius:50%/45%;background:currentColor}
.swall .wnbar{margin:8px 0 2px}.swall .wnbar .btn{flex:1}
.pullhint{font:600 12.5px var(--body);color:#4c4330;text-align:center;margin:4px 0 -4px;opacity:.8}
html.street[data-theme="dark"] .swall{background:#0d1830;color:var(--ink);border-bottom:2px solid var(--line)}
html.street[data-theme="dark"] .nowc{background:var(--lan)}
html.street[data-theme="dark"] .nowc .k{color:#ffe1dc}
html.street[data-theme="dark"] .nowc .num>span{color:var(--lan);border-color:var(--lan)}
html.street[data-theme="dark"] .nx{color:var(--ink);border-top-color:#ffffff1f}
html.street[data-theme="dark"] .nx small,html.street[data-theme="dark"] .pullhint{color:#b9c3d6}
html.street[data-theme="dark"] .num{background:#0d1830}
html.street[data-theme="dark"] .num>span{border-color:#8fb0ea;color:#cfe0ff}
html.street[data-theme="dark"] .lan{color:#ff8a7a}
html.street[data-theme="dark"] .lan::before{box-shadow:0 0 8px #ff6a5c}
html.street[data-theme="dark"] .swall .btn:not(.solid){background:transparent}

.facts3{display:grid;grid-template-columns:repeat(3,1fr);border-top:2px solid var(--line);border-bottom:2px solid var(--line)}
.facts3>*{padding:9px 0 9px 10px;min-width:0;text-align:left;background:none;border:0;color:inherit;font:inherit}
.facts3>*+*{border-left:2px solid var(--line)}.facts3>:first-child{padding-left:0}
.facts3 small{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.facts3 b{font:800 19px var(--body);letter-spacing:-.02em;display:block;white-space:nowrap}
.rainbar{background:var(--saffron-soft);border-radius:10px;padding:12px 14px}
.rainbar .rainplan{margin:0;border:0;padding:0;background:none}

/* Plan: the route */
.ptop{display:grid;gap:6px}
.ptop .prog{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.ptop .prog i{display:block;height:100%;background:var(--b);border-radius:4px}
.ptop .pl{font:600 13.5px var(--body);color:var(--muted)}
.route2{position:relative;display:grid;gap:8px}
.route2::before{content:"";position:absolute;left:27px;top:30px;bottom:30px;border-left:3px dotted var(--b);opacity:.7}
.route2 .grp{display:grid;gap:8px}
.route2 .grp>.sign{justify-self:start;margin-top:8px}
html.street .route2 details.day{border:0;background:transparent;border-radius:10px;overflow:visible}
html.street .route2 details.day[open]{background:var(--surface);box-shadow:inset 0 0 0 2px var(--line)}
html.street .route2 details.day summary{grid-template-columns:54px 1fr 68px;padding:6px 0}
html.street .route2 details.day[open] summary{padding:6px 8px 6px 0}
html.street .route2 .thumb{width:68px;height:60px;border-radius:6px;border:0}
html.street details.day .date{background:var(--surface);color:var(--b);border-radius:7px;padding:5px 0;width:54px;box-shadow:inset 0 0 0 2px var(--b);position:relative;z-index:1;gap:1px}
html.street details.day .date .dnum{font:800 25px/1 var(--sign)}
html.street details.day .date .dow,html.street details.day .date .mon{font:600 11.5px var(--body);color:inherit;letter-spacing:0;text-transform:none}
html.street details.day .date .mon{display:none}
html.street details.day.is-today .date{background:var(--lan);color:#fff;box-shadow:inset 0 0 0 2px var(--lan),inset 0 0 0 3.5px #fff}
html.street[data-theme="dark"] details.day .date{background:#0d1830;color:#cfe0ff;box-shadow:inset 0 0 0 2px #8fb0ea}
html.street[data-theme="dark"] details.day.is-today .date{background:var(--lan);color:#fff;box-shadow:inset 0 0 0 2px var(--lan),inset 0 0 0 3.5px #fff}
html.street .sumtext .place{font:600 12.5px var(--body);color:var(--muted);text-transform:none;letter-spacing:0}
html.street .sumtext .title{font:700 16px/1.25 var(--body)}
html.street details.day.is-today .sumtext .place{color:var(--r-ink);font-weight:700}
html.street .route2 details.day.past .sumtext .title{color:var(--muted)}
.dstamp{display:inline-flex;align-items:center;gap:6px;margin-top:5px;font:800 12px/1 var(--sign);letter-spacing:.06em;text-transform:uppercase;color:var(--r-ink);border:2px solid currentColor;border-radius:5px;padding:4px 7px 3px;transform:rotate(-2.5deg);opacity:.9}
html.street .daybody{padding:0 12px 12px}

/* Explore tiles */
.xgrid{display:grid;grid-template-columns:1fr 1fr;grid-auto-flow:dense;gap:10px;grid-auto-rows:minmax(112px,auto)}
.xt{border-radius:10px;padding:12px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;text-decoration:none;color:var(--ink);background:var(--surface);box-shadow:inset 0 0 0 2px var(--line);border:0;text-align:left;font:inherit}
.xt b{font:800 19px/1.12 var(--body);letter-spacing:-.02em}.xt small{font:600 12.5px/1.3 var(--body);display:block;margin-bottom:2px}
.xt.wide{grid-column:1/-1;min-height:150px}
.xt.ph1{color:#fff;box-shadow:none;background:#333}.xt.ph1 .ph{position:absolute;inset:0;border-radius:0}
.xt.ph1::before{content:"";position:absolute;inset:0;background:linear-gradient(#0000 30%,#000c);z-index:1}.xt.ph1>:not(.ph){position:relative;z-index:2}
.xt.y{background:var(--wall);color:#1d1a14;box-shadow:none;grid-row:span 2;justify-content:space-between}
.xt.y p{font:600 16px/1.4 var(--body);margin:8px 0}
.xt.y .more{font:700 13.5px var(--body);color:#1f4e9a;background:none;border:0;padding:8px 0 0;text-align:left;min-height:44px}
.xt.b{background:var(--b);color:#fff;box-shadow:none}.xt.r{background:var(--lan);color:#fff;box-shadow:none}
.xt .big{position:absolute;top:8px;right:12px;font:800 32px/1 var(--sign);opacity:.95}
html.street[data-theme="dark"] .xt.y{background:#f2c94c}
.tlbar{display:block;height:68px;border-radius:10px;background:#1d1a14;color:#f2c94c;position:relative;padding:10px 14px;text-decoration:none;font:800 12px var(--sign);letter-spacing:.05em}
html.street[data-theme="dark"] .tlbar{background:#060d1c;box-shadow:inset 0 0 0 2px var(--line)}
.tlbar .yrs{display:flex;justify-content:space-between}
.tlbar::before{content:"";position:absolute;left:14px;right:14px;top:30px;border-top:2px solid #f2c94c66}
.tlbar b{position:absolute;left:14px;bottom:10px;font:700 15px var(--body);color:#fff;letter-spacing:0}

/* Leaderboard: lanterns */
.lstring{position:relative;height:210px;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));background:var(--wall)}
.lstring svg.wire{position:absolute;inset:0;width:100%;height:100%}
.lstring .ln{position:absolute;display:grid;justify-items:center;text-align:center;transform:translateX(-50%);transform-origin:50% 0}
.ln .cord{width:2px;background:#5a3d1a}
.ln .bod{background:var(--lan);border-radius:50%/42%;display:grid;place-items:center;color:#fff;font:800 22px/1 var(--sign);position:relative;box-shadow:inset -8px 0 0 #0002}
.ln .bod::before,.ln .bod::after{content:"";position:absolute;left:26%;right:26%;height:6px;background:#7a1a1a;border-radius:2px}
.ln .bod::before{top:-4px}.ln .bod::after{bottom:-4px}
.ln .tas{width:2px;height:14px;background:#7a1a1a}
.ln .nm{font:700 14px var(--body);margin-top:2px;color:#1d1a14}
.ln.me .bod{background:var(--b)}.ln.me .bod::before,.ln.me .bod::after,.ln.me .tas{background:#123366}
html.street[data-theme="dark"] .lstring{background:#0d1830}
html.street[data-theme="dark"] .ln .nm{color:#f6efe0}
html.street[data-theme="dark"] .ln .cord{background:#8a7350}
html.street[data-theme="dark"] .ln .bod{background:radial-gradient(circle at 45% 40%,#ffb36b,#e0442f 55%,#a5231b);box-shadow:0 0 22px 4px #ff6a3d66,0 0 60px 10px #ff6a3d22}
html.street[data-theme="dark"] .ln.me .bod{background:radial-gradient(circle at 45% 40%,#bcd6ff,#3d74d6 55%,#1f4e9a);box-shadow:0 0 22px 4px #5b9bff66}
html.street[data-theme="dark"] .ln{animation:sway 4.5s ease-in-out infinite alternate}
html.street[data-theme="dark"] .ln:nth-child(2n){animation-duration:5.3s;animation-delay:-1.4s}
@keyframes sway{from{transform:translateX(-50%) rotate(-3deg)}to{transform:translateX(-50%) rotate(3deg)}}
@media (prefers-reduced-motion: reduce){html.street[data-theme="dark"] .ln{animation:none}}
.lb-head{background:var(--wall);margin:-16px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;padding:6px max(16px,env(safe-area-inset-left,0px)) 0}
.lb-head h2{margin:0}
.lb-head .live-st{margin:4px 0 0;color:var(--wall-ink)}
.feed>div{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:2px solid var(--line)}
.feed>div:last-child{border-bottom:0}
.feed p{margin:0;font-size:14.5px;line-height:1.3}.feed em{font:600 12.5px var(--body);color:var(--muted);font-style:normal;text-align:right;white-space:nowrap}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:800 14px var(--body);background:var(--line);color:var(--ink)}
.av.me{background:var(--b);color:#fff}
.mine{display:flex;gap:4px 10px;align-items:baseline;flex-wrap:wrap;font-size:14px}.mine>span{color:var(--muted);margin-right:auto}.mine b{font-weight:700}.mine .tot{color:var(--b);font:800 22px var(--sign)}
html.street[data-theme="dark"] .mine .tot{color:#cfe0ff}

/* Next stop sheet, Carry sheet */
.ns-k{font:700 13px var(--body);color:var(--muted)}
.ns-move{display:flex;gap:8px;align-items:center;font:600 14px var(--body)}
.ns-move svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;flex:none}

/* Driver card in street-sign style */
html.street .driver{background:var(--b);color:#fff;padding:max(28px,env(safe-area-inset-top,0px)) 18px 28px}
html.street .driver::before{content:"";position:absolute;inset:max(14px,env(safe-area-inset-top,0px)) 12px 14px;border:4px solid #fff;border-radius:16px;pointer-events:none}
html.street .driver .big{font:800 clamp(38px,12vw,64px)/1.02 var(--sign);text-transform:uppercase;letter-spacing:.01em}
html.street .driver .sm{color:#e3ebf7;font:600 19px/1.35 var(--body)}
html.street .driver .hint{color:#c9d8f2}
html.street .driver .play{background:#fff;color:var(--b);font-weight:700}

/* Info plates */
.iplates{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.iplate{display:grid;gap:2px;text-align:left;background:var(--surface);color:var(--ink);border:0;border-radius:8px;padding:10px 12px;box-shadow:inset 0 0 0 2px var(--b);font:inherit;min-height:56px;text-decoration:none}
.iplate small{font:600 12px/1.25 var(--body);color:var(--muted)}
.iplate b{font:800 22px/1.05 var(--sign);color:var(--b);letter-spacing:.01em;word-break:break-word}
.iplate.wide{grid-column:1/-1}
.iplate.sos{background:var(--lan);box-shadow:none}.iplate.sos small{color:#ffe1dc}.iplate.sos b{color:#fff;font-size:28px}
html.street[data-theme="dark"] .iplate{box-shadow:inset 0 0 0 2px #5b82c9}
html.street[data-theme="dark"] .iplate b{color:#cfe0ff}
html.street[data-theme="dark"] .iplate.sos{box-shadow:none}html.street[data-theme="dark"] .iplate.sos b{color:#fff}

/* Recap: split-flap board */
.flap{background:#15130f;border-radius:12px;padding:12px;display:grid;gap:8px;color:#f6efe0}
.flap .fr{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.flap .tiles{display:flex;gap:3px;flex-wrap:wrap}
.flap .tiles i,.flap .rk i,.flap .pts i{font:800 22px/1 var(--sign);font-style:normal;width:20px;height:30px;display:grid;place-items:center;background:#2a2620;border-radius:3px;position:relative;color:#f2c94c;text-transform:uppercase}
.flap .tiles i::after,.flap .rk i::after,.flap .pts i::after{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px solid #0009}
.flap .tiles i.s::after{display:none}
.flap .rk{display:flex}.flap .pts{display:flex;gap:2px}

.flap .fr.flip i{animation:flipin .5s var(--ease,ease) both}
@keyframes flipin{0%{transform:rotateX(90deg);color:#f6efe0}100%{transform:none}}
.flap .fr.win .tiles i,.flap .fr.win .pts i{background:var(--lan);color:#fff}
.rcol{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.rcol .hi{aspect-ratio:1;border-radius:6px;background:var(--line);overflow:hidden;display:grid;place-items:center;font:700 11.5px var(--body);color:var(--muted);text-align:center;padding:4px}
.rcol .hi img{width:100%;height:100%;object-fit:cover}
.moments{display:grid;gap:8px}.moments>div{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
#raintop:empty{display:none}
/* Postcard leftovers, re-dressed for the street look */
html.street .pass{box-shadow:none;border-radius:12px}
html.street .pass-top{background:var(--b)}
html.street .pass-route b{font:800 40px/1 var(--sign);letter-spacing:.01em}
html.street .pass-plane{color:var(--b)}
html.street .pass-foot span:first-child{background:#f2c94c;color:#1d1a14}
html.street .ph{background:var(--line)}
html.street .ph.thumb.none::before{content:"";}
html.street .lookbtns button[aria-pressed="true"],html.street .chipbtn[aria-pressed="true"]{background:var(--b);color:#fff}
html.street .jl li.on{border-left-color:var(--lan)}html.street .jl li.on b{color:var(--r-ink)}
html.street .map{box-shadow:none;border-radius:12px}
html.street .mpin span{background:var(--lan);border-color:#fff;box-shadow:0 1px 3px #0006}
html.street .pinnum{background:#f2c94c!important}
html.street .tsize button{border-radius:8px}
html.street .hero{border-radius:12px}
html.street .pin.listen{background:#f2c94c;color:#1d1a14}
html.street .gcard,html.street .gcard.closest{box-shadow:none}html.street .gcard.closest{border-color:var(--b)}
html.street .bigplay{background:var(--b);border:0;box-shadow:none}
html.street .speaking{background:#f2c94c;color:#1d1a14;box-shadow:-6px 0 0 #f2c94c,6px 0 0 #f2c94c}
html.street .mp .in{border:2px solid var(--line);box-shadow:0 4px 16px #0002}
html.street .mp button.pp{background:var(--b)}
.lb-back{display:inline-flex;align-items:center;min-height:44px;font:700 14.5px var(--body);color:var(--b);text-decoration:none}
html.street[data-theme="dark"] .lb-back{color:#cfe0ff}
html.street[data-theme="dark"] .nowc .num{background:#fff}
.flap .fr.hid .tiles i,.flap .fr.hid .pts i{color:transparent!important;background:#2a2620!important}
html.street .pin{min-height:40px}
html.street .seg a{padding:12px 0}
html.street details.day .date .dow,html.street .chip{font-size:12px}
html.street .tl li.now{background:var(--jade-soft);color:var(--ink)}
html.street .tl li.now .w,html.street .tl li.now .t{color:var(--ink)}
html.street .tl li.now .t{color:var(--b);font-weight:700}
html.street[data-theme="dark"] .tl li.now .t{color:#cfe0ff}
html.street[data-theme="dark"] .nowc .k{color:#fff}
.iplate.sos small{color:#fff!important}
.todo{padding:4px 14px}
.todo-r{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:start;padding:12px 0;border-bottom:2px solid var(--line);cursor:pointer}
.todo-r:last-child{border-bottom:0}
.todo-r input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--b)}
.todo-r b{display:block;font:700 15px/1.3 var(--body)}.todo-r small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.todo-r em{grid-column:2/4;font:600 12.5px var(--body);font-style:normal;color:var(--muted)}
.todo-r .num>span{min-width:0;font-size:16px;padding:4px 7px 3px}
.todo-r.soon .num{background:var(--lan)}.todo-r.soon .num>span{color:#fff;border-color:#fff}
.todo-r.soon em{color:var(--r-ink)}
.todo-r.done b{text-decoration:line-through;color:var(--muted)}.todo-r.done .num{opacity:.6}
.sv-h{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}
.sv-h b{display:block;font:700 17px/1.25 var(--display)}.sv-h .vi{display:block;font-size:13.5px;color:var(--muted);margin-top:2px}
.sv p{margin:8px 0 6px;font-size:14.5px;line-height:1.45}
.sv-row{display:grid;grid-template-columns:78px 1fr;gap:8px;font-size:13.5px;padding:3px 0}
.sv .num>span{font-size:17px;min-width:0;padding:4px 7px 3px}
/* Timeline: pinned year dial */
.tlx-top{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr,50px));z-index:3;height:max(250px,36vh);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));overflow:hidden;color:#fff;background:#1d1a14}
.tlx-top .ph{position:absolute;inset:0;border-radius:0;opacity:0;transition:opacity .8s ease}
.tlx-top .ph.on{opacity:1}
.tlx-top .ph img{transform:scale(1.04);transition:transform 6s linear}.tlx-top .ph.on img{transform:scale(1.12)}
.tlx-top::after{content:"";position:absolute;inset:0;background:linear-gradient(#0006,#0000 30%,#000d);pointer-events:none}
.tlx-top .dial{position:absolute;left:16px;right:16px;bottom:20px;z-index:2}
.tlx-top small{font:700 13px var(--body);opacity:.9;display:block;margin-bottom:4px}
.tlx-top .year{font:800 76px/.85 var(--sign);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:clip}
.tlx-top .ttl{font:700 19px/1.25 var(--body);margin-top:8px;min-height:24px;text-shadow:0 1px 3px #0008}
.tlx-top .rail{position:absolute;left:16px;right:16px;bottom:8px;height:4px;background:#ffffff33;border-radius:2px;z-index:2}
.tlx-top .rail i{display:block;height:100%;width:0;background:#f2c94c;border-radius:2px;transition:width .15s linear}
ol.tlx{list-style:none;margin:0;padding:6px 0 0 40px;position:relative}
ol.tlx::before{content:"";position:absolute;left:13px;top:0;bottom:0;border-left:3px dotted var(--b);opacity:.7}
ol.tlx li{position:relative;padding:16px 0 22px;opacity:.28;transform:translateY(28px);transition:opacity .5s,transform .6s cubic-bezier(.2,.8,.2,1)}
ol.tlx li.seen{opacity:.6;transform:none}ol.tlx li.on{opacity:1}
ol.tlx li::before{content:"";position:absolute;left:-34px;top:21px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:3px solid var(--b);transition:background .3s,border-color .3s,transform .3s}
ol.tlx li.on::before{background:var(--lan);border-color:var(--lan);transform:scale(1.3)}
ol.tlx .y{font:800 15px var(--sign);color:var(--b);letter-spacing:.04em;text-transform:uppercase}
html.street[data-theme="dark"] ol.tlx .y{color:#9dbcf2}
ol.tlx b{display:block;font:700 19px/1.25 var(--body);margin:2px 0 6px}ol.tlx p{margin:0;color:var(--ink);opacity:.85;line-height:1.5}
ol.tlx a{display:inline-block;margin-top:6px}
.tlx-end{padding:8px 0 30vh}
@media (prefers-reduced-motion: reduce){ol.tlx li{opacity:1;transform:none}}

html.street .shopseg{margin-top:12px}html.street .shopseg{display:flex}html.street .shopseg a{flex:1 1 auto;font-size:13px;padding:11px 7px;white-space:nowrap}
.hright{display:flex;align-items:center;gap:10px}
.srchbtn{display:grid;place-items:center;width:40px;height:40px;margin:-8px -8px -8px 0;border:0;background:transparent;color:inherit;border-radius:10px;cursor:pointer}
html.street .srchbtn{color:#1f4e9a}
html.street[data-theme="dark"] .srchbtn{color:#f2c94c}
#srch{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);animation:srin .18s ease-out}
@keyframes srin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.srch-bar{display:flex;gap:8px;padding:12px 16px;border-bottom:2px solid var(--line)}
.srch-bar input{flex:1;min-width:0;font:600 17px var(--body,inherit);padding:11px 14px;border-radius:10px;border:2px solid var(--b,#1f4e9a);background:var(--surface);color:var(--ink)}
.srch-r{flex:1;overflow-y:auto;padding:8px 16px calc(env(safe-area-inset-bottom,0px) + 24px);-webkit-overflow-scrolling:touch}
.srch-hit{display:block;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:0;box-shadow:inset 0 0 0 2px var(--line);border-radius:10px;padding:11px 13px;margin:8px 0;font:inherit;cursor:pointer}
.srch-hit small{display:block;font-weight:700;font-size:12px;color:var(--b,#1f4e9a);margin-bottom:3px}
html.street[data-theme="dark"] .srch-hit small{color:#f2c94c}
.srch-hit span{font-size:14px;line-height:1.4}
.srch-hit mark{background:#f2c94c;color:#1a1a1a;border-radius:3px;padding:0 1px}
body.srch-on{overflow:hidden}body.srch-on nav.tabs{display:none}
.srch-flash{animation:srflash 3.2s ease-out}
@keyframes srflash{0%,60%{box-shadow:0 0 0 4px #f2c94c}100%{box-shadow:0 0 0 0 transparent}}

/* Plan: stats, route strip, city banners, travel hops */
.pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pstats>div{background:var(--surface);border-radius:10px;box-shadow:inset 0 0 0 2px var(--line);padding:9px 12px 8px}
.pstats b{display:block;font:800 28px/1 var(--sign);color:var(--b)}
.pstats small{font:600 12px var(--body);color:var(--muted)}
.pstats .warn b{color:var(--lan)}
html.street[data-theme="dark"] .pstats b{color:#f2c94c}html.street[data-theme="dark"] .pstats .warn b{color:var(--r-ink)}
.tstrip{display:flex;gap:4px;margin-top:4px}
.seg2{min-width:0;display:grid;gap:3px;flex-basis:auto}
.seg2 i{display:block;height:10px;border-radius:3px;background:var(--city)}
.seg2 span{font:700 11px var(--body);white-space:nowrap}
.seg2 small{font:600 11px var(--body);color:var(--muted);margin-top:-3px}
.seg2.done i{opacity:.35}.seg2.on i{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--city)}
.route2::before{display:none}
.route2 .grp{position:relative}
.route2 .grp::before{content:"";position:absolute;left:27px;top:20px;bottom:30px;border-left:3px dotted var(--b);opacity:.6}
.cban{position:relative;height:118px;border-radius:12px;overflow:hidden;background:var(--city);margin-top:4px;box-shadow:inset 0 0 0 2px var(--city)}
.cban .ph{position:absolute;inset:0;background-size:cover;background-position:center;border-radius:0}
.cban::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgb(0 0 0 / 0) 30%,rgb(0 0 0 / .62));pointer-events:none}
.cban-in{position:absolute;left:12px;right:12px;bottom:11px;z-index:1;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.cban-in .sign{margin:0}
.cban-r{text-align:right;color:#fff;text-shadow:0 1px 3px rgb(0 0 0 / .5);min-width:0}
.cban-r b{display:block;font:800 20px/1 var(--sign);letter-spacing:.02em}
.cban-r small{display:block;font:600 12px/1.3 var(--body);opacity:.95;margin-top:3px}
.hop2{position:relative;z-index:1;display:flex;align-items:center;gap:10px;margin:6px 0 2px;padding:9px 12px;border-radius:10px;background:var(--surface);box-shadow:inset 0 0 0 2px var(--line);font:600 13px/1.35 var(--body)}
.hop2 .ic{font-size:17px;flex:none}
.hop2 b{color:var(--b);white-space:nowrap}
html.street[data-theme="dark"] .hop2 b{color:#f2c94c}
.hop2 em{margin-left:auto;flex:none;font:800 11px var(--body);font-style:normal;color:#fff;background:var(--lan);border-radius:5px;padding:3px 7px}
.dmeta{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.dmeta span{font:700 11.5px/1 var(--body);padding:4px 7px;border-radius:5px;background:var(--line);color:var(--ink)}
.dmeta .ok{background:#d9eedd;color:#1c5a2e}.dmeta .td{background:#fbe0dc;color:#9b1c12}
html.street[data-theme="dark"] .dmeta span{background:#1b2d52;color:#cfe0ff}html.street[data-theme="dark"] .dmeta .ok{background:#163d26;color:#9fe0b4}html.street[data-theme="dark"] .dmeta .td{background:#4a1a17;color:#ffb3a8}
html.street .route2 .thumb{width:76px;height:66px;border-radius:8px}
html.street .route2 details.day summary{grid-template-columns:54px 1fr 76px}
.cban-in .sign{white-space:nowrap;flex:none}

(function(){

const parse = iso => { const [y,m,d]=iso.split("-").map(Number); return new Date(y,m-1,d); };
const isoOf = dt => dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");

const store = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}, del(k){try{localStorage.removeItem(k)}catch(e){}} };

let T = null;

function todayIso(){
  let d = null;
  try { d = new URLSearchParams(location.search).get("d"); } catch(e){}
  return d && /^\d{4}-\d{2}-\d{2}$/.test(d) ? d : isoOf(new Date());
}
const stayById = id => T.stays.find(s=>s.id===id);

function dayCard(d, opts={}){

  const night = (!PB() && d.date==="2026-12-13") ? "" : d.night ? esc(d.night) : st ? `<a href="#stay-${st.id}">${esc(st.name)}</a> ${st.status!=="booked"?chip(st.status):""}` : "";

}

const STOPS = [["Saigon","2026-12-06"],["Hoi An","2026-12-07"],["Da Nang","2026-12-08"],["Hanoi","2026-12-09"]];
function routeSvg(iso){
  const W=320, pts = STOPS.map((s,i)=>[12+i*(W-24)/(STOPS.length-1), i%2?30:16]);
  let k = -1; STOPS.forEach((s,i)=>{ if (iso>=s[1]) k=i; });
  const path = "M"+pts.map(p=>p.join(",")).join(" L");
  const stops = pts.map((p,i)=>`<circle class="stop${i<=k?" past":""}" cx="${p[0]}" cy="${p[1]}" r="3.5"/><text x="${p[0]}" y="${i%2?44:7}" text-anchor="${i===0?"start":i===pts.length-1?"end":"middle"}" dx="${i===0?-6:i===pts.length-1?6:0}">${STOPS[i][0]}</text>`).join("");
  const me = k>=0 ? `<circle class="halo" cx="${pts[k][0]}" cy="${pts[k][1]}" r="5"/><circle class="me" cx="${pts[k][0]}" cy="${pts[k][1]}" r="5"/>` : "";
  return `<div class="route" aria-hidden="true"><svg viewBox="0 0 ${W} 46"><path class="track" d="${path}"/><path class="done" data-k="${k}" d="${path}"/>${stops}${me}</svg></div>`;
}
function sizeRoute(){
  const p = document.querySelector(".route .done"); if(!p) return;
  const len = p.getTotalLength(), k = +p.dataset.k, n = STOPS.length-1;
  const frac = k>=0 ? k/n : 0;
  p.style.setProperty("--len", len); p.style.setProperty("--off", len*(1-frac));
}

// Photos from Wikipedia and Wikimedia Commons, fetched when online and kept for offline use.
const W = "https://en.wikipedia.org/api/rest_v1/page/";
const wkey = t => encodeURIComponent(t.replace(/ /g,"_"));
const BAD = /(\.svg|\.gif|flag|coat_of_arms|logo|location|locator|map|seal_of|emblem|icon|signature)/i;
async function cachedJson(k, url){
  try{ const c=JSON.parse(store.get(k)||"null"); if(c) return c; }catch(e){}
  try{ const r=await fetch(url); if(!r.ok) throw 0; const j=await r.json(); return j; }catch(e){ return null; }
}
// Bundled photos first (shipped with the app, work offline from the first open), Wikipedia only for anything not bundled.
async function wikiLead(title){
  const B = T.photos; if (B && title in B.lead) return B.lead[title];
  const k="wl-"+title; try{ const c=store.get(k); if(c) return JSON.parse(c); }catch(e){}
  const j = await cachedJson(k, W+"summary/"+wkey(title)); if(!j) return null;
  const src = j.thumbnail?.source ? j.thumbnail.source.replace(/\/\d+px-/,"/960px-") : j.originalimage?.source;
  if (!src || BAD.test(src)) { store.set(k, "null"); return null; }
  const out = {src, cap: j.title, link: j.content_urls?.mobile?.page || ("https://en.wikipedia.org/wiki/"+wkey(title))};
  store.set(k, JSON.stringify(out)); return out;
}
async function wikiGallery(title){
  const B = T.photos; if (B && B.gallery[title]) return B.gallery[title];
  const k="wg-"+title; try{ const c=store.get(k); if(c) return JSON.parse(c); }catch(e){}
  const j = await cachedJson(k, W+"media-list/"+wkey(title)); if(!j) return [];
  const out = (j.items||[]).filter(i=>i.type==="image" && i.showInGallery!==false && i.srcset?.length && !BAD.test(i.title||"")).slice(0,6).map(i=>{
    const best = i.srcset[i.srcset.length-1].src; const src=(best.startsWith("//")?"https:":"")+best;
    return {src, cap:(i.caption?.text||i.title.replace(/^File:|\.\w+$/g,"").replace(/_/g," ")).trim(), link:"https://commons.wikimedia.org/wiki/"+encodeURIComponent(i.title)};
  });
  store.set(k, JSON.stringify(out)); return out;
}
function phImg(el, p){

const distLabel = km => km < 1 ? `${Math.round(km*1000/10)*10} m away` : km < 20 ? `${km.toFixed(1)} km away` : `${Math.round(km)} km away`;

// ---------- Now and next: where you should be in today's plan. ----------
const SLOT = { breakfast:480, morning:540, "late morning":630, midday:720, lunch:750, "early afternoon":810, afternoon:870, cafes:900, sunset:1020, evening:1110, dinner:1140, bar:1290, late:1320, night:1320 };
function startMin(label){
  const l = label.toLowerCase().replace(/^~/, "").trim();
  if (/^until|^optional|^if /.test(l)) return null;
  const m = l.match(/(\d{1,2})(?::(\d{2}))?/);
  if (m){
    let h = +m[1]; const mm = +(m[2]||0), ap = (l.slice(m.index).match(/am|pm/)||[""])[0];
    if (ap==="pm" && h<12) h += 12; if (ap==="am" && h===12) h = 0;
    return h*60 + mm;
  }
  return SLOT[l] ?? null;
}
const KEY = /tasting menu|flight|vn\d|ua \d|qatar|puppet|boat ride|sampan|pickup|class|check ?out|show|car to|private car/i;
function timeline(d){
  const items = d.items.map((x, i) => ({ i, t: x[0], w: x[1], st: x[2], pb: x[3]==="pb", s: startMin(x[0]), exact: /\d/.test(x[0]) }))
    .filter(x => !(x.pb && !PB()));
  items.forEach((x, k) => {
    if (x.s == null){ const prev = items.slice(0, k).reverse().find(y => y.s != null); x.s = prev ? prev.s + 45 : 540; }
    const prev = items[k-1]; if (prev && x.s < prev.s && !(k===1 && prev.s < 120)) x.s = prev.s;
  });
  // Deadlines hidden inside the text, like "Check out by 11 AM".
  d.items.forEach(x => { const m = x[1].match(/check ?out by (\d{1,2}(?::\d{2})?\s*(?:AM|PM))/i);
    if (m) items.push({ i: -1, t: "By " + m[1], w: "Check out of the stay", s: startMin(m[1]), exact: true, key: true }); });
  items.sort((a, b) => a.s - b.s);
  items.forEach(x => { if (x.key == null) x.key = x.st==="todo" || x.st==="booked" || KEY.test(x.w); });
  return items;
}
function nowMin(){
  try { const t = new URLSearchParams(location.search).get("t"); if (t && /^\d{1,2}:\d{2}$/.test(t)){ const [h, m] = t.split(":").map(Number); return h*60 + m; } } catch(e){}
  const n = new Date(); return n.getHours()*60 + n.getMinutes();
}
const inTime = mins => mins < 1 ? "now" : mins < 60 ? `in ${mins} min` : `in ${Math.floor(mins/60)} h${mins%60 ? " " + (mins%60) + " min" : ""}`;
function nowNext(d){
  const tl = timeline(d), now = nowMin();
  const cur = [...tl].reverse().find(x => x.s <= now && x.i >= 0);
  const nxt = tl.find(x => x.s > now);
  const key = tl.find(x => x.s > now && x.key && x !== nxt);
  return { tl, cur, nxt, key, now };
}
function nowNextHtml(d){
  if (STREET()) return nowStreetHtml(d);
  const { tl, cur, nxt, key, now } = nowNext(d);
  const row = (cls, lbl, x, extra="") => `<div class="nn ${cls}${x.key && cls!=="now" ? " key" : ""}"><span class="dot"></span><span class="lbl">${lbl}${extra}</span><b>${esc(x.w)}</b>${cls==="now" ? progress(x) : ""}</div>`;
  const progress = x => { const n = tl[tl.indexOf(x)+1]; if (!n) return ""; const p = Math.max(4, Math.min(100, (now - x.s) / Math.max(15, n.s - x.s) * 100)); return `<div class="bar2"><i style="width:${p}%"></i></div>`; };
  const when = x => `<span class="cd">${x.exact ? inTime(x.s - now) + " · " + esc(x.t.replace(/^~/, "")) : "around " + esc(x.t.toLowerCase())}</span>`;
  let h = "";
  if (cur) h += row("now", "Now", cur, `<span class="cd">${esc(cur.t)}</span>`);
  if (nxt) h += row("next", nxt.key ? "Don't miss" : "Next", nxt, when(nxt));
  if (key) h += row("next", "Don't miss", key, when(key));

  }
  return h;
}

// Daily checklist, built from the day's plan and the weather.
function checklistFor(d){
  const txt = (d.title+" "+d.items.map(i=>i[0]+" "+i[1]).join(" ")).toLowerCase(), out=[];
  const add=(t,why)=>{ if(!out.some(o=>o[0]===t)) out.push([t,why]); };
  if (/flight|vn983|ua 7913|ua 1525|ua 79|qatar|depart sarasota|airport/.test(txt)) add("Passport and boarding pass","Flight today");
  if (d.date==="2026-12-04") add("Printed Vietnam e-visa","Needed at immigration in Saigon");
  if (d.date==="2026-12-13" && PB()) add("OCI card","For India immigration");
  if (/check out|checkout/.test(txt)) add("Pack up and check the room","Checkout today");
  if (/temple|pagoda|mausoleum|cathedral/.test(txt)) add("Shoulders and knees covered","Temples and pagodas today");
  if (/boat|sampan|trang an|basket/.test(txt)) add("Small cash for the boat tip","50,000–100,000 dong");
  if (/mua cave|steps|bike|marble mountains|stair/.test(txt)) add("Comfortable shoes","Steps or cycling today");
  if (/coco|\bgia\b|tasting menu|la maison/.test(txt)) add("Dinner outfit","Tasting menu tonight");
  if (/tailoring: get measured|place orders/.test(txt)) add("Photos of clothes you want made","For the tailor");
  if (/pick up tailoring|tailor fittings/.test(txt)) add("Tailoring receipt","Fitting or pickup today");
  if (/spa|pool|beach/.test(txt)) add("Swimsuit","Pool or beach today");
  // weather: forecast if saved, otherwise typical December
  const P = T.info.places[d.city]; let hi, lo, rain=null;
  try{ const f=JSON.parse(store.get("wx-"+d.city)||"null")?.days?.[d.date]; if(f){ hi=f.hi; lo=f.lo; rain=f.p; } }catch(e){}
  if (hi==null && P){ [hi,lo]=P.normal; rain = /rain|shower/i.test(P.normal[2]) ? 50 : 10; }
  if (rain!=null && rain>=40) add("Umbrella or rain jacket", rain>=50 && hi!=null ? `${rain}% chance of rain` : "Rain likely");
  if (hi!=null && hi>=86) add("Water bottle and sunscreen", `High of ${hi}°`);
  if (lo!=null && lo<=62) add("Light jacket", `Down to ${lo}° tonight`);
  if (/^hcmc|hoian|danang|hanoi|ninhbinh$/.test(d.city||"")) add("Cash in dong","Street food, tips, markets");
  add("Phone charged, plus a power bank","Maps and Grab all day");
  return out;
}
function checklistHtml(d){
  const done = local.get("check-"+d.date, {});
  return `<div class="sub-h">Before you head out</div><ul class="check">${checklistFor(d).map(([t,why],i)=>`<li><label><input type="checkbox" data-check="${d.date}" data-item="${esc(t)}"${done[t]?" checked":""}><span>${esc(t)}<span class="why">${esc(why)}</span></span></label></li>`).join("")}</ul>`;
}

const ico = (n, cls) => `<svg class="i${cls?" "+cls:""}" viewBox="0 0 24 24" aria-hidden="true" focusable="false">${ICP[n]||""}</svg>`;
const WMO = c => c===0?[ico("sun"),"Clear"]:c<=2?[ico("part"),"Partly cloudy"]:c===3?[ico("cloud"),"Cloudy"]:c<=48?[ico("fog"),"Fog"]:c<=57?[ico("rain"),"Drizzle"]:c<=67?[ico("rain"),"Rain"]:c<=77?[ico("snow"),"Snow"]:c<=82?[ico("rain"),"Showers"]:[ico("storm"),"Storms"];
async function forecast(key){
  const P = T.info.places[key]; if(!P) return null;
  let cached=null; try{ cached=JSON.parse(store.get("wx-"+key)||"null"); }catch(e){}
  if (cached && Date.now()-cached.t < 3*3600e3) return cached;
  try {
    const u=`https://api.open-meteo.com/v1/forecast?latitude=${P.lat}&longitude=${P.lon}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&temperature_unit=fahrenheit&timezone=auto&forecast_days=16`;
    const r=await fetch(u); if(!r.ok) throw 0; const j=await r.json();
    const out={t:Date.now(), days:Object.fromEntries(j.daily.time.map((d,i)=>[d,{c:j.daily.weather_code[i],hi:Math.round(j.daily.temperature_2m_max[i]),lo:Math.round(j.daily.temperature_2m_min[i]),p:j.daily.precipitation_probability_max[i]}]))};
    store.set("wx-"+key, JSON.stringify(out)); return out;
  } catch(e){ return cached; }
}

// ===== Trip helpers: travel days, maps, sunset, evening look, phrases, reminders =====
const MOg = () => (typeof T!=="undefined" && T && T.more) || {};
const TZ = c => c==="srq" ? -5 : (c==="blr"||c==="kmc"||c==="hyd") ? 5.5 : 7;
const VN = c => ["hcmc","hoian","danang","hanoi","ninhbinh"].includes(c);
const CITYNAME = {"Saigon":"hcmc","Hoi An":"hoian","Da Nang":"danang","Hanoi":"hanoi","Ninh Binh":"ninhbinh"};
const hm = h => { h=((h%24)+24)%24; let H=Math.floor(h), M=Math.round((h-H)*60); if(M===60){H++;M=0;} const ap=H>=12?"PM":"AM"; return `${(H%12)||12}:${String(M).padStart(2,"0")} ${ap}`; };
// Sunset in local hours (NOAA approximation).
function sunset(lat, lon, iso, tz){
  const d = parse(iso), n = Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()) - Date.UTC(d.getFullYear(),0,0))/864e5);
  const g = 2*Math.PI/365*(n-1);
  const eq = 229.18*(0.000075+0.001868*Math.cos(g)-0.032077*Math.sin(g)-0.014615*Math.cos(2*g)-0.040849*Math.sin(2*g));
  const dec = 0.006918-0.399912*Math.cos(g)+0.070257*Math.sin(g)-0.006758*Math.cos(2*g)+0.000907*Math.sin(2*g)-0.002697*Math.cos(3*g)+0.00148*Math.sin(3*g);
  const r = Math.PI/180, ha = Math.acos(Math.cos(90.833*r)/(Math.cos(lat*r)*Math.cos(dec))-Math.tan(lat*r)*Math.tan(dec))/r;
  return (720 - 4*(lon - ha) - eq)/60 + tz;
}
function sunFor(city, iso){ const P=T.info.places[city]; if(!P) return null; return sunset(P.lat, P.lon, iso, TZ(city)); }

// Evening look: Auto switches to the dark Postcard after sunset where you are.
function lookMode(){ return store.get("look-mode") || "auto"; }
function applyLook(){
  const m = lookMode(); let dark;
  if (m==="dark") dark=true; else if (m==="light") dark=false;
  else { const iso=todayIso(), d=T.days.find(x=>x.date===iso), city=d?.city||"hcmc", now=new Date(), h=now.getHours()+now.getMinutes()/60;
    const ss = (d && VN(city)) ? sunFor(city, iso) : 18; dark = h >= ss + .25 || h < 6; }
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  const mc=document.querySelector('meta[name="theme-color"]'); const cl=document.documentElement.classList; if(mc) mc.content = cl.contains("street") ? (dark?"#0d1830":"#f2c94c") : dark ? (cl.contains("press")?"#121212":"#141414") : (cl.contains("press")?"#fff5d6":"#fff8e7");
}
setInterval(()=>{ if(document.visibilityState==="visible") applyLook(); }, 60000);
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") applyLook(); });
document.addEventListener("click", e=>{ const b=e.target.closest("[data-look-mode]"); if(!b) return; store.set("look-mode", b.dataset.lookMode); applyLook();
  document.querySelectorAll("[data-look-mode]").forEach(x=>x.setAttribute("aria-pressed", x.dataset.lookMode===lookMode())); });

function wireMap(){

const NF = new Intl.NumberFormat("en-US"), fmtVnd = n => NF.format(Math.round(n/50000)*50000) + " ₫";
const fmtUsd = n => "$" + Math.round(n / T.info.rates.VND);
const nowH = () => nowMin()/60;
const dayOf = iso => T.days.find(d=>d.date===iso);

const cityOfIso = iso => (dayOf(iso)||{}).city;
const MAPCITY = c => Object.keys(CITYNAME).find(k=>CITYNAME[k]===c);

// --- What now? ---
let WN = { here: null, n: 3 };
function openAt(S, h, wd){
  if (S[3] && !S[3].includes(wd)) return null;
  for (const [a,b] of S[2]){ if (h >= a && h < b - 0.25) return b; if (h + 24 >= a && h + 24 < b - 0.25) return b - 24; }
  return null;
}
function rainPct(city, iso){ try{ return JSON.parse(store.get("wx-"+city)||"null")?.days?.[iso]?.p ?? null; }catch(e){ return null; } }
function whatNow(){
  const iso = todayIso(), d = dayOf(iso), wd = parse(iso).getDay(), h = nowH();
  const city = d && VN(d.city) ? d.city : "hcmc", M = (MOg().maps||{})[MAPCITY(city)];
  const origin = WN.here || (M && M.c), rain = rainPct(city, iso);
  const planned = new Set((d ? d.items : []).flatMap(x=>placesFor(x[1], d.city)).map(p=>p.name));
  const meal = (h>=11 && h<14) || (h>=17.5 && h<21), coffee = (h>=7 && h<11) || (h>=14 && h<17.5), late = h>=18;
  const out = [];
  for (const [name, S] of Object.entries(MOg().spots||{})){
    const C = COORD(name); if (!C || !origin) continue;
    const km = hav(origin, C)*1.3; if (km > 12) continue;
    const till = openAt(S, h, wd); if (till == null) continue;
    let score = -km*1.6;
    if (S[0]==="eat" && meal) score += 3; if (S[0]==="coffee" && coffee) score += 2.5;
    if ((S[0]==="night"||S[0]==="walk") && late) score += 3; if ((S[0]==="night") && !late) score -= 2;
    if (rain!=null && rain>=50) score += S[1] ? 2 : -2.5;
    if (till - h < 1) score -= 2;
    if (planned.has(name)) score -= 1.5;
    out.push({ name, S, km, till, score, planned: planned.has(name) });
  }
  return { list: out.sort((a,b)=>b.score-a.score), rain, city, origin, d };
}
function getThere(km){
  const walk = Math.round(km/4.5*60), grab = Math.round(4 + km/20*60), fare = Math.max(30, Math.round((12 + km*14)/5)*5);

}

// --- Cash for today ---
function cashFor(d){
  if (!d || !VN(d.city)) return null;
  const F = MOg().fees||{}, B = MOg().cashBase||{food:350000,ride:40000,buffer:200000};
  const names = [...new Set(d.items.flatMap(x=>placesFor(x[1], d.city)).map(p=>p.name))];
  const lines = [];
  names.forEach(n=>{ if (F[n]) lines.push([n, F[n]]); });
  const txt = d.items.map(x=>x[1]).join(" ").toLowerCase();
  const rides = (txt.match(/\bgrab\b|\bcar to\b|\bcar\b|taxi|transfer/g)||[]).length;
  const fine = /coco|\bgia\b|tasting menu|la maison|anan/.test(txt);
  lines.push([fine ? "Street food, coffee and snacks (dinner on card)" : "Meals, coffee and snacks", fine ? Math.round(B.food*0.6) : B.food]);
  if (rides) lines.push([`${rides} ride${rides>1?"s":""}, shared`, rides*B.ride]);
  lines.push(["Tips and small extras", B.buffer]);
  const total = lines.reduce((s,l)=>s+l[1],0);
  return { total, lines };
}
function cashHtml(d){
  const c = cashFor(d); if (!c) return "";
  return `<details class="card cash"><summary><span class="cash-ico">₫</span><span><b>Carry about ${fmtVnd(c.total)} each</b><span class="small muted">≈ ${fmtUsd(c.total)} · tap for the breakdown</span></span></summary>

const placeCityKey = name => { const p = placeByName(name); return p ? CITYNAME[p.city] : null; };
const factWhere = w => CITYLBL[w] || w;
function hashStr(s){ let h = 0; for (const c of s) h = (h*31 + c.charCodeAt(0)) | 0; return Math.abs(h); }
// Facts for a day: places on the plan first, then the city, then the country; rotates by date.
function factsForDay(d, n){
  const F = FX().facts.map((f,i)=>({f,i}));
  const names = d ? new Set(d.items.flatMap(x=>placesFor(x[1], d.city)).map(p=>p.name)) : new Set();
  const pool = [...F.filter(x=>names.has(x.f[1])), ...F.filter(x=>d && x.f[1]===d.city), ...F.filter(x=>x.f[1]==="all")];
  const seed = hashStr(d ? d.date : todayIso()), out = [], seen = new Set();
  const groups = [pool.filter(x=>names.has(x.f[1])), pool.filter(x=>d && x.f[1]===d.city), pool.filter(x=>x.f[1]==="all")];
  for (const g of groups){ if (!g.length) continue; const x = g[seed % g.length]; if (!seen.has(x.i)){ out.push(x); seen.add(x.i); } if (out.length >= n) break; }
  return out;
}

// ===== Live leaderboard: every phone writes its own scores to one shared room and listens for everyone else's.
// Firebase Realtime Database over plain REST and server-sent events (no SDK). Works offline: changes wait and send later.
const LIVE = { es: null, room: null, dirty: false, timer: null, state: "off", seen: 0, ping0: Date.now() };
const liveBase = () => T && T.live ? `${T.live.db}/v26/${T.live.room}` : null;
const SCORE_KEYS = new Set(["hunt-found","trivia-right","trivia-scores","bingo","awards","haggles","speak"]);
function takeRecord(x){
  if (!x || !x.n || x.n === ME()) return false;
  const B = local.get("board", {}), rec = { n:x.n, t:x.t*60000, tr:x.tr||[], tb:x.tb||0, h:{}, bg:x.bg||0, hg:x.hg||0, sp:x.sp||{}, aw:(x.aw||[]).map(a=>({id:a[0], to:a[1], p:a[2], g:a[3], ts:a[4]*60000})) };
  Object.entries(x.h||{}).forEach(([k,v])=>rec.h[k]=v*60000);
  if (B[x.n] && B[x.n].t > rec.t) return false;
  B[x.n] = rec; store.set("board", JSON.stringify(B)); return true;
}
function livePush(soon){
  if (!liveBase() || !ME()) return; LIVE.dirty = true; clearTimeout(LIVE.timer);
  LIVE.timer = setTimeout(async ()=>{
    if (!navigator.onLine) return;
    try { const r = await fetch(`${liveBase()}/scores/${encodeURIComponent(ME())}.json`, { method: "PUT", body: JSON.stringify(compactRecord()) });
      if (r.ok){ LIVE.dirty = false; liveStatus(); } } catch(e){}
  }, soon ? 300 : 1500);
}
function liveApply(path, data){
  // Keep a mirror of the room, then copy everyone else's scores into this phone's board.
  if (path === "/") LIVE.room = data || {};
  else { LIVE.room = LIVE.room || {}; const parts = path.split("/").filter(Boolean).map(decodeURIComponent); let o = LIVE.room;
    for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]] = (o[parts[i]] && typeof o[parts[i]] === "object") ? o[parts[i]] : {};
    if (data == null) delete o[parts[parts.length-1]]; else o[parts[parts.length-1]] = data; }
  let changed = false; Object.values((LIVE.room||{}).scores || {}).forEach(x=>{ if (takeRecord(x)) changed = true; });
  const pg = (LIVE.room||{}).ping;
  if (pg && pg.t > LIVE.ping0 && pg.t > LIVE.seen){ LIVE.seen = pg.t; if (pg.by !== ME()){ toast(`${pg.by} refreshed everyone's app`); liveRefresh(); } }
  LIVE.seen = Math.max(LIVE.seen, (pg && pg.t) || 0);

}
function liveListen(){

  const es = LIVE.es = new EventSource(`${liveBase()}.json`);

}
function liveStop(){ if (LIVE.es){ LIVE.es.close(); LIVE.es = null; } }
async function liveRefresh(){

function liveStatus(){

  if (!e.target.closest("[data-gbgo]")) return;
  const amt = +$("#gb-amt").value; if (!amt) return toast("Enter the real total first");
  const real = GB_UNIT==="vnd" ? usd(amt) : amt;
  const G = [...document.querySelectorAll("[data-gbp]")].filter(i=>i.value!=="").map(i=>({n:i.dataset.gbp, g:+i.value, d:Math.abs(+i.value - real)}));
  if (G.length < 2) return toast("Need at least two guesses");
  G.sort((a,b)=>a.d-b.d); const win = G.filter(x=>x.d===G[0].d).map(x=>x.n);
  const what = $("#gb-what").value.trim(), ts = Date.now();
  const A = awardsMine(); win.forEach(n=>A.push({ id: uid(), to: n, p: 3, g: "bill", ts })); local.set("awards", A);
  const R = local.get("bill-rounds", []); R.push({ what, usd: real, win, ts }); local.set("bill-rounds", R);
  $("#gb-out").innerHTML = `<div class="card gb-res"><div class="small">The bill: <b>${money$(real)}</b>${GB_UNIT==="vnd"?` (${amt.toLocaleString()} ₫)`:""}</div><div class="gb-win">${ico("trophy")} ${esc(win.join(" & "))} +3</div>
    <ol class="gb-list">${G.map(x=>`<li><span>${esc(x.n)}</span><span>${money$(x.g)}</span><span class="muted">${x.d<0.01?"exact!":(x.g>real?"+":"−")+money$(x.d)}</span></li>`).join("")}</ol></div>`;
  document.querySelectorAll("[data-gbp]").forEach(i=>i.value=""); $("#gb-amt").value=""; $("#gb-what").value="";
  $("#gb-out").scrollIntoView({block:"start"}); scrollBy(0,-70);
});

// Haggle champ
function hagglePage(){
  const H = haggles().slice().reverse(), best = bestHaggle();
  return `<a class="btn back-link" href="#games">← Games</a><h2>Haggle champ</h2>
    <p class="small muted" style="margin:0 0 12px">Log what they asked and what you paid. Every 10% off your best haggle is a point, and whoever has the best haggle of the group gets +3. Markets and stalls only, and always with a smile.</p>
    <div class="card form"><label>What did you buy?<input id="hg-w" placeholder="e.g. Silk scarf, Hàng Gai" maxlength="60"></label>
      <div class="two"><label>They asked (₫)<input id="hg-a" type="number" inputmode="numeric" placeholder="400000"></label><label>You paid (₫)<input id="hg-p" type="number" inputmode="numeric" placeholder="250000"></label></div>
      <div class="btns"><button class="btn solid" data-hglog>Log it</button><a class="btn" href="#say">Haggle helper</a></div></div>
    ${best?`<div class="card bounty-c"><span class="small">Your best</span><b>${best}% off</b></div>`:""}
    ${H.length?`<h3>Your haggles</h3><div class="card">${H.map(h=>`<div class="gb-past"><b>${esc(h.w||"Something nice")}</b><span class="small muted">${h.a.toLocaleString()} → ${h.p.toLocaleString()} ₫ · ${h.pct}% off</span></div>`).join("")}</div>`:""}`;
}
document.addEventListener("click", e=>{ if (!e.target.closest("[data-hglog]")) return;
  const a = +$("#hg-a").value, p = +$("#hg-p").value; if (!a || !p || p > a) return toast("Enter the asking price and what you paid");
  const H = haggles(), pct = Math.round((1 - p/a)*100); H.push({ w: $("#hg-w").value.trim(), a, p, pct, ts: Date.now() }); local.set("haggles", H);
  toast(pct >= 30 ? `${pct}% off. Nicely done` : `${pct}% off`); render("explore", null, "haggle");
});

// Speak up
function speakPage(){
  const D = speakDone(), pts = SPEAK().reduce((s,x)=>s + (D[x[0]] ? x[4] : 0), 0);
  return `<a class="btn back-link" href="#games">← Games</a><h2>Speak up</h2>
    <p class="small muted" style="margin:0 0 12px">Use the phrase with a local and get understood. Someone in the group has to confirm it. ${pts} points so far.</p>
    <div class="list">${SPEAK().map(([id, t, vi, snd, p])=>{ const d = D[id]; return `<div class="card sp${d?" done":""}"><div class="sp-h"><b>${esc(t)}</b><span class="ht-p" style="position:static">${p}</span></div>
      <div class="viw"><span><i lang="vi">${esc(vi)}</i> <span class="sound">“${esc(snd)}”</span></span>${sayBtn(vi.replace("…",""),1)}</div>
      ${d?`<div class="small">✓ Done ${new Date(d.ts).toLocaleDateString([], {month:"short", day:"numeric"})}, confirmed by ${esc(d.by)} <button class="linkbtn" data-spundo="${id}">Undo</button></div>`:`<div class="btns" style="margin-top:8px">${players().filter(n=>n!==ME()).map(n=>`<button class="btn" data-spdo="${id}" data-spby="${esc(n)}">${esc(n)} saw it</button>`).join("")}</div>`}</div>`; }).join("")}</div>`;
}
document.addEventListener("click", e=>{
  const d = e.target.closest("[data-spdo]"); if (d){ const S = speakDone(); S[d.dataset.spdo] = { ts: Date.now(), by: d.dataset.spby }; local.set("speak", S); const y = scrollY; render("explore", null, "speak"); scrollTo(0, y); return; }
  const u = e.target.closest("[data-spundo]"); if (u){ const S = speakDone(); delete S[u.dataset.spundo]; local.set("speak", S); const y = scrollY; render("explore", null, "speak"); scrollTo(0, y); }
});

function toggleDay(d){
  const body = d.querySelector(".daybody"); if (!body) return;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches || !body.animate){ d.open=!d.open; return; }
  if (d._anim) d._anim.cancel();
  if (!d.open){
    d.open = true; const h = body.scrollHeight;
    d._anim = body.animate([{height:"0px",opacity:0},{height:h+"px",opacity:1}],{duration:320,easing:"cubic-bezier(.2,.8,.2,1)"});
  } else {
    const h = body.scrollHeight;
    d._anim = body.animate([{height:h+"px",opacity:1},{height:"0px",opacity:0}],{duration:240,easing:"cubic-bezier(.4,0,.2,1)"});
    d._anim.onfinish = ()=>{ d.open=false; d._anim=null; };
  }
}

// Today's city first (up to three photos), then the famous sights from the other cities: six in all.
function slidesFor(city){
  const out = [...(SLIDES[city]||[]).slice(0,3)], rest = Object.keys(SLIDES).filter(c=>c!==city);
  for (let i = 0; out.length < 6 && i < 40; i++){ const c = rest[i % rest.length], x = SLIDES[c][Math.floor(i / rest.length)]; if (x) out.push(x); }
  return out;
}
const reduceMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
function streetHero(o){
  const sl = slidesFor(o.city), k0 = reduceMotion() ? parse(todayIso()).getDate() % sl.length : 0;
  return `<section class="shero" id="shero" style="--city:${cityCol(o.city)}">
    <div class="slides">${sl.map(([key,cap],i)=>`<div class="ph sl${i===k0?" on":""}" data-lead="${esc(key)}" data-c="${esc(cap)}"></div>`).join("")}</div>
    <span class="capchip">${k0+1} of ${sl.length} · ${esc(sl[k0][1])}</span>
    <div class="tx"><div class="d">${o.line}</div><div class="plate"><div class="in"><span class="sm">${o.sm}</span><span class="nm" lang="vi">${esc(o.nm)}</span></div></div>
      ${o.title?`<div class="t">${o.title}</div>`:""}<div class="sdots" aria-hidden="true">${sl.map((_,i)=>`<i${i===k0?' class="on"':""}></i>`).join("")}</div></div></section>`;
}
let SLT = null;
function startSlides(){
  clearInterval(SLT); const h = document.getElementById("shero"); if (!h) return;
  const sl = [...h.querySelectorAll(".sl")], dots = [...h.querySelectorAll(".sdots i")], cap = h.querySelector(".capchip"); if (sl.length < 2) return;
  let k = Math.max(0, sl.findIndex(x=>x.classList.contains("on")));
  const show = n => { k = (n + sl.length) % sl.length; sl.forEach((x,i)=>x.classList.toggle("on", i===k)); dots.forEach((x,i)=>x.classList.toggle("on", i===k)); cap.textContent = `${k+1} of ${sl.length} · ${sl[k].dataset.c}`; };
  const tick = () => { if (!document.body.contains(h)) return clearInterval(SLT); if (document.visibilityState === "visible") show(k+1); };
  const run = () => { clearInterval(SLT); if (!reduceMotion()) SLT = setInterval(tick, 6000); };
  run();
  let x0 = null, y0 = 0;
  h.addEventListener("touchstart", e=>{ x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive:true});
  h.addEventListener("touchend", e=>{ if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)){ show(k + (dx < 0 ? 1 : -1)); run(); } }, {passive:true});
}

// Time plates: "10:00" when the plan has a clock time, otherwise the first word ("Evening").
const tplate = x => x.exact ? `${String(Math.floor(x.s/60)%24).padStart(2,"0")}:${String(x.s%60).padStart(2,"0")}` : esc(x.t.replace(/^~/,"").split(/[ ,(/]/)[0]);
const LEAVE = /grab|car to|private car|taxi|transfer|airport|\bfly\b|flight|vn ?\d|train|bus to|head to/i;
function nowStreetHtml(d){
  const { tl, cur, nxt, key, now } = nowNext(d);
  const until = x => x.exact ? hm(x.s/60) : x.t.replace(/^~/,"").toLowerCase();
  let big = null, rest = [];
  if (nxt && nxt.exact && nxt.s - now <= 45){
    const m = nxt.s - now;
    big = { k: m < 1 ? "Right now" : `Right now · ${LEAVE.test(nxt.w) ? "leave" : "starts"} ${inTime(m)}`, x: nxt };
    rest = tl.filter(x=>x.s > nxt.s || (x.s === nxt.s && x !== nxt && tl.indexOf(x) > tl.indexOf(nxt)));
  } else if (cur){
    big = { k: `Right now${nxt ? ` · until ${until(nxt)}` : ""}`, x: cur };
    rest = tl.filter(x=>x.s > now);
  } else if (nxt){
    big = { k: `First up · ${nxt.exact ? inTime(nxt.s - now) : until(nxt)}`, x: nxt };
    rest = tl.filter(x=>x.s > nxt.s);
  }
  const rows = [];
  if (rest[0]) rows.push(rest[0]);
  const k2 = rest.find(x=>x.key && !rows.includes(x)) || (rest[1] && !rows.includes(rest[1]) ? rest[1] : null);
  if (k2) rows.push(k2);
  let h = big ? `<div class="nowc"><div><span class="k">${esc(big.k)}</span><b>${esc(big.x.w)}</b></div><span class="num big"><span>${tplate(big.x)}</span></span></div>` : "";
  h += rows.map(x=>`<div class="nx"><span class="num"><span>${tplate(x)}</span></span><div><b>${esc(x.w)}</b><small>${x.key?`<span class="lan">Don't miss</span>`:""}${x.exact ? inTime(x.s - now) : "around " + esc(until(x))}</small></div></div>`).join("");
  if (!nxt){
    const i = T.days.findIndex(x=>x.date===d.date), tm = T.days[i+1], first = tm && timeline(tm)[0];
    h += `<div class="nx"><span class="num"><span>${first ? tplate(first) : "Done"}</span></span><div><b>${first ? `Tomorrow: ${esc(first.w)}` : "That's today's plan. Enjoy it."}</b><small>${first ? "That's the plan for today" : ""}</small></div></div>`;
  }
  return h;
}

// Next stop: the next place in today's plan (or tonight's stay), with the address for the driver and how to get there.
const WALK_I = '<svg viewBox="0 0 24 24"><circle cx="13" cy="4" r="2"/><path d="M10 22l2-7 3 3v4M8 12l2-4 4 1 3 3M10 8l-2 5"/></svg>';
const CAR_I = '<svg viewBox="0 0 24 24"><path d="M5 17h14v-5l-2-5H7l-2 5zM5 12h14M7 17v2M17 17v2"/><circle cx="8" cy="14.5" r=".8"/><circle cx="16" cy="14.5" r=".8"/></svg>';
function nextStop(){
  const d = dayOf(todayIso()); if (!d) return null;
  const { tl, now } = nowNext(d);
  const prevPlace = (() => { for (const x of [...tl].reverse()) if (x.s <= now && x.i >= 0){ const p = placesFor(x.w, d.city).find(p=>COORD(p.name)); if (p) return p; } return null; })();
  // Riding somewhere right now (a Grab to the airport): that's the next stop.
  const cur = [...tl].reverse().find(x=>x.s <= now && x.i >= 0);
  if (cur && LEAVE.test(cur.w)){ const p = placesFor(cur.w, d.city)[0]; if (p) return { d, x: cur, p, from: null }; }
  for (const x of tl) if (x.s >= now - 10 && x.i >= 0){ const p = placesFor(x.w, d.city)[0]; if (p && p !== prevPlace) return { d, x, p, from: prevPlace }; }
  const st = d.stay && stayById(d.stay); return st ? { d, st, from: prevPlace } : null;
}
function nextStopSheet(){

  } else { name = n.st.name; vi = n.st.name; addr = n.st.address || ""; link = mapUrl(n.st.address || n.st.map || n.st.name); }
  const full = addr ? `${vi}, ${addr}` : vi;
  const when = n.x ? `${n.x.exact ? `${hm(n.x.s/60)} · ${inTime(n.x.s - now)}` : esc(n.x.t.replace(/^~/,""))}` : "Tonight's stay";
  openSheet(`<div class="ns-k">Next stop · ${when}</div>${n.p && n.p.photo ? `<div class="ph sheetph" data-lead="${esc(n.p.photo)}" data-hide-empty></div>` : ""}<div class="sname">${esc(name)}</div>
    ${n.x ? `<div class="small muted">${esc(n.x.w)}</div>` : ""}
    <div class="addr"><div><div class="vi" lang="vi">${esc(vi)}</div>${addr ? `<div class="a" lang="vi">${esc(addr)}</div>` : `<div class="a">Search this name in Grab</div>`}</div><button class="btn" data-copy="${esc(full)}">Copy</button></div>
    ${move ? `<div class="ns-move">${move}</div>` : ""}
    <div class="btns"><button class="btn solid" data-driver="${esc(vi)}" data-driver-sub="${esc(addr)}">Show the driver</button><a class="btn" href="grab://open" data-copy="${esc(full)}">Copy and open Grab</a><a class="btn" href="${link}" target="_blank" rel="noopener">Google Maps ↗</a></div>`);
}

// Plan: the route, grouped by city signs, with stamps on finished days.
function dayStamps(){
  const out = {};
  boardRecords().forEach(r=>Object.entries(r.h||{}).forEach(([id,ts])=>{ const it = huntItem(id); if (!it) return; const day = isoOf(new Date(ts));
    const o = out[day] = out[day] || { n: 0, by: {} }; o.n++; o.by[r.n] = (o.by[r.n]||0) + it[1]; }));
  return out;
}
function planStreet(){
  const iso = todayIso(), vd = T.days.filter(d=>VN(d.city)), vi = vd.findIndex(d=>d.date===iso);
  const done = vi >= 0 ? vi + 1 : (iso > (vd[vd.length-1]||{}).date ? vd.length : 0);
  const pl = vi >= 0 ? `Day ${vi+1} of ${vd.length} · ${vd.length - vi - 1} day${vd.length-vi-1===1?"":"s"} to go in Vietnam` : iso < vd[0].date ? `${vd.length} days in Vietnam · starts ${fmt(vd[0].date)}` : "Vietnam done";
  const S = dayStamps(), groups = [];
  T.days.forEach(d=>{ const key = d.city || d.place, g = groups[groups.length-1]; if (g && g.key === key) g.days.push(d); else groups.push({ key, city: d.city, days: [d] }); });
  const stamp = d => { if (d.date >= iso) return ""; const s = S[d.date]; if (!s) return `<span class="dstamp">Done</span>`;
    const top = Object.entries(s.by).sort((a,b)=>b[1]-a[1])[0]; return `<span class="dstamp">Done · ${s.n} find${s.n>1?"s":""} · ${esc(top[0])} led</span>`; };
  // How you get to each city: a flight from legs, else the first travel-looking item of that day.
  const legOn = d => (MOg().legs||[]).find(l=>l.dep.slice(0,10)===d.date && VN(d.city));
  const howTo = d => { const l = legOn(d); if (l) return { ic:"✈", t:`${l.dep.slice(11,16).replace(/^0/,"")}`, w:`${l.no === l.by.split(" (")[0] ? l.by.split(" (")[0] : l.no} · ${l.from} → ${l.to}`, todo: !l.pb };
    const it = d.items.find(x=>/flight|Vietnam Airlines|VietJet|Bamboo|train|bus\b|private car|drive to|transfer to|Grab to (?!.*airport)/i.test(x[1])); if (!it) return null;
    return { ic: /flight|Airlines|VietJet|Bamboo/i.test(it[1]) ? "✈" : /by train|train to/i.test(it[1]) ? "🚆" : "🚗", t: it[0], w: it[1].replace(/\s*\(.*?\)/g,"").slice(0,70), todo: it[2]==="todo" }; };
  const vg = groups.filter(g=>VN(g.city)), vn = vg.reduce((n,g)=>n+g.days.length,0);
  const todoN = T.days.filter(d=>VN(d.city)).reduce((n,d)=>n + d.items.filter(x=>x[2]==="todo").length, 0);
  const strip = `<div class="tstrip" role="img" aria-label="Route: ${vg.map(g=>CITYV[g.city]).join(", ")}">${vg.map(g=>{ const on = g.days.some(d=>d.date===iso);
      return `<div class="seg2${on?" on":""}${g.days[g.days.length-1].date < iso ? " done" : ""}" style="flex:${g.days.length} 1 auto;--city:${cityCol(g.city)}"><i></i><span lang="vi">${esc(CITYV[g.city])}</span><small>${g.days.length}d</small></div>`; }).join("")}</div>`;
  const meta = d => { const its = d.items.filter(x=>x[3]!=="pb" || PB()), td = its.filter(x=>x[2]==="todo").length, bk = its.filter(x=>x[2]==="booked").length;
    return `<div class="dmeta"><span>${its.length} plan${its.length===1?"":"s"}</span>${bk ? `<span class="ok">✓ ${bk} booked</span>` : ""}${td ? `<span class="td">${td} to book</span>` : ""}</div>`; };
  const banner = g => { const f = g.days[0], l = g.days[g.days.length-1], st = f.stay ? stayById(f.stay) : null, how = howTo(g.days.find(d=>d.place!=="Tokyo") || f);
    const ph = (SLIDES[g.city]||[])[0]?.[0] || f.photo || "";
    return `${how ? `<div class="hop2${how.todo?" todo":""}"><span class="ic" aria-hidden="true">${how.ic}</span><span><b>${esc(how.t)}</b> ${esc(how.w)}</span>${how.todo ? `<em>To book</em>` : ""}</div>` : ""}
      <div class="cban" style="--city:${cityCol(g.city)}">${ph ? `<div class="ph" data-lead="${esc(ph)}"></div>` : ""}<div class="cban-in">
        <span class="sign" style="--city:${cityCol(g.city)}"><span lang="vi">${esc(CITYV[g.city])}</span></span>
        <div class="cban-r"><b>${fmt(f.date)}${l.date !== f.date ? "–" + parse(l.date).getDate() : ""}</b><small>${g.days.length} day${g.days.length>1?"s":""}${st ? ` · ${esc(st.name)}${st.status!=="booked" && !/to book/i.test(st.name) ? " (to book)" : ""}` : ""}</small></div></div></div>`; };
  return `<div class="ptop"><div class="pstats"><div><b>${vn}</b><small>days</small></div><div><b>${new Set(vg.map(g=>g.city)).size}</b><small>cities</small></div><div class="${todoN?"warn":""}"><b>${todoN}</b><small>to book</small></div></div>
    ${strip}<div class="pl">${pl}</div></div>
    ${seg("plan")}
    <div class="route2">${groups.map((g,gi)=>`<div class="grp">${VN(g.city) && groups.slice(0,gi).some(x=>x.city===g.city) ? `<span class="sign" style="--city:${cityCol(g.city)}"><span lang="vi">Back to ${esc(CITYV[g.city])}</span></span>` : VN(g.city) ? banner(g) : `<span class="sign" style="--city:${cityCol(g.city)}"><span lang="vi">${esc(CITYV[g.city] || g.days[0].place)}</span></span>`}
      ${g.days.map(d=>dayCard(d, { today: d.date===iso, past: d.date < iso, stamp: meta(d) + stamp(d) })).join("")}</div>`).join("")}</div>`;
}

// Leaderboard: lanterns sized by points, the bounty, and the latest finds.
function latestFeed(){
  const ev = [];
  boardRecords().forEach(r=>{
    Object.entries(r.h||{}).forEach(([id,ts])=>{ const it = huntItem(id); if (it) ev.push({ ts, n: r.n, html: `found ${esc(it[2].charAt(0).toLowerCase() + it[2].slice(1))}`, p: it[1] }); });
    (r.aw||[]).forEach(a=>{ if (a.to) ev.push({ ts: a.ts, n: a.to, html: `won ${a.g === "bill" ? "Guess the bill" : esc(a.g)}`, p: a.p }); });
  });
  const seen = new Set();
  return ev.filter(x=>{ const k = x.n + x.ts + x.html; if (seen.has(k)) return false; seen.add(k); return x.ts; }).sort((a,b)=>b.ts-a.ts).slice(0, 6);
}
function lanternsHtml(S){
  const names = T.travelers.map(t=>t.name), byN = Object.fromEntries(S.map(s=>[s.n, s]));
  S.forEach(s=>{ if (!names.includes(s.n)) names.push(s.n); });
  const max = Math.max(1, ...S.map(s=>s.total)), n = names.length;
  const sag = x => 22 + 26 * Math.sin(Math.PI * x);   // the wire droops in the middle

function todoHtml(iso){

  const row = t => { const n = dleft(t[2]), dt = parse(t[2]);

const SRCH_SKIP = new Set(["trivia","guess","hunt","recap","board","haggle","speak","games","map","now"]);

let SRCH_IX = null;
function srPageKey(h){ if (h.startsWith("day-") || h.startsWith("stay-")) return null; return h; }

  } catch(e){ return ""; } finally { SVC = save.SVC; TLC = save.TLC; }
}
function srBuild(){

  while (queue.length){
    const [key, st] = queue.shift(), id = key + JSON.stringify(st||{}); if (seen.has(id)) continue; seen.add(id);
    tpl.innerHTML = srRender(key, st); const root = tpl.content;
    root.querySelectorAll('a[href^="#"]').forEach(a=>{ const h = srPageKey(a.getAttribute("href").slice(1)); if (h && !SRCH_SKIP.has(h) && (views[h] || /^(story|guide)-/.test(h))) queue.push([h,null]); });
    if (key === "gifts" && !st) [...Object.keys(MOg().souvenirs||{}),"tailor","gear","active"].forEach(v=>queue.push(["gifts",{SVC:v}]));
    if (key === "timeline" && !st) ["all", ...Object.keys(FX().cityTimeline||{})].forEach(v=>queue.push(["timeline",{TLC:v}]));
    if ((key === "gifts" || key === "timeline") && !st) continue;
    const title = SRCH_NAME[key] || (root.querySelector("h1, h2")||{}).textContent || key;
    let last = "";

      const txt = srText(el); if (txt.length < 3) return;
      const sm = el.closest("details")?.querySelector("summary"); let h = sm && srText(sm); let p = el; 
      while (!h && p && p !== root){ let q = p.previousElementSibling; while (q && !/^H[23]$/.test(q.tagName)) q = q.previousElementSibling; if (q) h = q.textContent; p = p.parentElement; }

function srLev(a, b){ if (Math.abs(a.length-b.length) > 2) return 9; const d = Array.from({length:b.length+1},(_,j)=>j); for (let i=1;i<=a.length;i++){ let prev = d[0]; d[0] = i; for (let j=1;j<=b.length;j++){ const t = d[j]; d[j] = Math.min(d[j]+1, d[j-1]+1, prev + (a[i-1]===b[j-1]?0:1)); prev = t; } } return d[b.length]; }
function srFind(q){
  const nq = srNorm(q).trim(); if (nq.length < 2) return [];
  const toks = nq.split(/\s+/);

    let score = 0;
    if (u.n.includes(nq)) score = (new RegExp("(^|[^a-z0-9])" + nq.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + "($|[^a-z0-9])").test(u.n) ? 40 : 0) + 100 - Math.min(40, u.n.indexOf(nq)/4) + (srNorm(u.where).includes(nq) ? 10 : 0);

        const tol = t.length >= 7 ? 2 : t.length >= 4 ? 1 : 0;

}

// Encrypted build: the trip data is locked with a shared trip passcode, entered once per phone.
async function unlock(pass, enc){
  const b = s => Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b(enc.salt), iterations:150000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b(enc.iv)}, key, b(enc.ct));
  if (enc.z) return JSON.parse(await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"))).text());
  return JSON.parse(new TextDecoder().decode(pt));
}

    <label for="pass" class="muted">Enter the trip passcode. You only need to do this once on this phone.</label>
    <input id="pass" type="password" autocomplete="current-password" required>
    <button class="btn" style="justify-self:center">Unlock</button>${msg?`<div class="err">${esc(msg)}</div>`:""}</form>`;
  $("#lockform").addEventListener("submit", async e=>{ e.preventDefault(); const p=$("#pass").value.trim();
    try { const d = await unlock(p, enc); store.set("trip-pass", p); start(d); } catch(err){ lockScreen(enc, "That passcode didn't work. Check it with Praneeth and try again."); } });
}
